นมาเพื่ออะไรกันแน่...","แฮร์รอฟและออโรร่าไม่ได้ตอบคำถามของลินน์ แต่พวกเขากลับหันไปมองวิกโตริโอพร้อมๆ กัน","เขาคือผู้ที่อาวุโสที่สุดในบรรดาประธานสภา แม้แต่แฮร์รอฟและออโรร่าก็ยังไม่แน่ใจเลยว่า วิกโตริโอมีชีวิตอยู่มานานแค่ไหนแล้ว เขาจึงเป็นคนที่มีโอกาสรู้เรื่องนี้มากที่สุด","“ในทวีปแห่งนี้ มีจุดเชื่อมต่อมิติกระจายอยู่ไม่น้อยเลยจริงๆ แค่ที่ข้ารู้ก็มีถึงสามแห่งแล้ว และทั้งหมดก็ล้วนอยู่ในถ้ำเหมืองคริสตัลเวทมนตร์ทั้งสิ้น...ส่วนสาเหตุการเกิดของพวกมัน ข้าเกรงว่าคงจะมีแค่เทพเจ้าชั่วร้ายในยุคโบราณ ที่เคยเข้าร่วมสงครามแห่งความศรัทธา และเทพเจ้าจอมปลอมของศาสนจักรเท่านั้นที่รู้”","วิกโตริโอกล่าวด้วยน้ำเสียงหนักแน่น","หลังจากที่ศาสนจักรเข้ายึดครองทวีปแห่งนี้ พวกเขาก็ได้สังหารหมู่พ่อมดไปเป็นจำนวนมาก ส่งผลให้ข้อมูลเกี่ยวกับยุคนั้นถูกทำลายและฝังกลบไปจนเกือบหมด แม้ว่าสถาบันที่เขาสืบทอดมาจะเก่าแก่มาก แต่เขาก็ไม่ได้รับข้อมูลอะไรมากมายนัก","ในช่วงหลายปีที่ผ่านมา สภาเวทมนตร์เองก็เคยทำการศึกษาวิจัยเกี่ยวกับจุดเชื่อมต่อมิติ ภายในถ้ำเหมืองคริสตัลเวทมนตร์เช่นกัน ถึงขนาดเคยส่งคนเข้าไปสำรวจด้วยซ้ำ","แต่สุดท้าย ไม่ว่าจะส่งใครเข้าไป คนเหล่านั้นก็หายสาบสูญไปจนหมด แม้แต่ข่าวคราวก็ยังไม่ถูกส่งกลับมาเลย","เมื่อเห็นว่าบรรดาประธานสภา ต่างก็มีความรู้เกี่ยวกับประตูมิติอย่างจำกัด ลินน์ก็ทำได้เพียงแค่เก็บความสงสัยเอาไว้ในใจ จากนั้นเขาก็แจกจ่ายกระดาษร่างให้กับทุกคน","แฮร์รอฟรับไปดูด้วยความอยากรู้อยากเห็น และเขาก็ต้องตาลายกับสัญลักษณ์และสมการแปลกตาจำนวนมากบนนั้น จนอดไม่ได้ที่จะขมวดคิ้วออกมา","นี่มันซับซ้อนยิ่งกว่าสมการแคลคูลัสเสียอีก","“นี่มันอะไรกัน? สมการอนุมานของคณิตศาสตร์ชั้นสูงงั้นรึ?”","ออโรร่าเอ่ยถามด้วยความไม่เข้าใจ","สำหรับศาสตร์ที่ซับซ้อนและละเอียดอ่อนอย่างคณิตศาสตร์ชั้นสูง บรรดาประธานสภาอย่างพวกเขา ย่อมต้องเคยศึกษามาบ้างอยู่แล้ว","ด้วยความสามารถในการคำนวณที่ยอดเยี่ยมที่สุด ไม่ว่าจะเป็นสมการ เรขาคณิต ฟังก์ชัน หรือแคลคูลัส ก็ล้วนไม่สามารถทำให้พวกเขาลำบากใจได้เลย วิกโตริโอถึงกับเชื่อว่า สมการคณิตศาสตร์ชั้นสูง ก็เหมือนกับอักษรรูนของการเล่นแร่แปรธาตุ ที่เปิดเผยกฎเกณฑ์การทำงานของโลกอย่างเป็นระบบ","“ถูกต้อง นี่คือสมการคณิตศาสตร์ชั้นสูงอย่างแน่นอน...ข้าเรียกมันว่าสมการแปลงพลังเวทมนตร์!”","ลินน์มองไปที่ประธานสภาทั้งสามคน แล้วกล่าวด้วยสีหน้าจริงจัง","“โดยอาศัยสมการนี้ ข้าได้ค้นพบวิธีการสร้างร่างกายพลังงานขึ้นมาแล้ว และถ้าไม่มีอะไรผิดพลาด นี่ก็คือพิธีกรรมเลื่อนขั้นเป็นระดับตำนาน!”","คำพูดของลินน์เปรียบเสมือนก้อนหินก้อนใหญ่ ที่ถูกโยนลงไปในทะเลสาบที่เงียบสงบ จนทำให้เกิดคลื่นลูกใหญ่ซัดสาดไปมาในทันที","“อะไรนะ?! เจ้าแน่ใจนะว่าค้นพบวิธีเลื่อนขั้นเป็นระดับตำนานแล้ว?”","วิกโตริโอลุกพรวดขึ้นมาทันที แม้แต่น้ำเสียงของเขาก็ยังสั่นเครือเล็กน้อย","แฮร์รอฟและออโรร่าที่อยู่ข้างๆ เอง ก็แทบจะระงับความตื่นเต้นเอาไว้ไม่อยู่เช่นกัน","สองร้อยปีเต็มๆ นับตั้งแต่ที่พวกเขาก้าวเข้าสู่ขอบเขตของจอมเวทผู้ยิ่งใหญ่ระดับหกวงแหวน พวกเขาก็เฝ้าค้นหาวิธีที่จะทะลวงผ่านขอบเขตนี้มาโดยตลอด แต่แม้จะลองมานับวิธีไม่ถ้วน พวกเขาก็ยังคงถูกจำกัดด้วยร่างกายเนื้อ จนทำให้พวกเขาได้ข้อสรุปว่า จอมเวทผู้ยิ่งใหญ่ระดับหกวงแหวน คือขีดจำกัดสูงสุดที่มนุษย์จะสามารถไปถึงได้!","และวิธีเดียวที่ได้รับการพิสูจน์แล้วว่า สามารถทำลายขีดจำกัดนี้ได้ ก็คือการเก็บเกี่ยววิญญาณ หรือความศรัทธา เพื่อเพิ่มความสามารถในการคำนวณของตัวเอง!","แต่พิษของความศรัทธา ก็เปรียบเสมือนดาบที่แขวนอยู่บนหัว ทำให้พวกเขาไม่กล้าที่จะแตะต้องมันง่ายๆ","และตอนนี้ ลินน์กลับบอกว่าเขาค้นพบวิธีใหม่ในการเลื่อนขั้นเป็นระดับตำนานแล้ว จะไม่ให้พวกเขารู้สึกตกตะลึงและตื่นเต้นได้อย่างไร...","“วิธีที่ชัดเจนก็อยู่ในสมการเหล่านี้แหละ พวกท่านลองดูก็จะรู้เองไม่ใช่รึ?”","ลินน์กล่าวพลางยิ้ม และอธิบายความหมายของสัญลักษณ์แต่ละตัวให้พวกเขาฟัง","แน่นอนว่า เขาไม่ได้เขียนขั้นตอนการอนุมานทั้งหมดลงไป โดยเขาได้เก็บซ่อนเอาไว้บางส่วน แต่เพียงแค่สมการนี้ ก็เพียงพอแล้วที่จะใช้พิสูจน์วิธีการเลื่อนขั้นของเขา!","แฮร์รอฟและคนอื่นๆ รีบหยิบกระดาษร่างบนโต๊ะขึ้นมาตรวจสอบอย่างรวดเร็วทันที","แก่นแท้ของคณิตศาสตร์ชั้นสูง ก็คือภาษาทางวิทยาศาสตร์ที่ใช้อธิบายและบันทึกความเป็นไปของโลก ดังนั้น จึงไม่จำเป็นต้องอธิบายอะไรมาก ทุกสิ่งทุกอย่างล้วนแฝงอยู่ในสัญลักษณ์ที่ซับซ้อน และสมการที่ละเอียดอ่อนเหล่านี้","“อย่างนี้นี่เอง...อย่างนี้นี่เอง!”","วิกโตริโอกำกระดาษร่างในมือแน่น เขาเดินไปเดินมาอยู่ในห้องประชุม พร้อมกับกล่าวออกมาอย่างตื่นเต้น","“ใช้ธาตุที่จำลองขึ้นมาจากพลังเวทมนตร์เป็นรากฐาน และใช้พลังงานเป็นแกนกลาง เพื่อสร้างร่างกายใหม่ขึ้นมา อัจฉริยะ...นี่มันเป็นแนวคิดของอัจฉริยะชัดๆ!”","ในช่วงหลายวันที่ผ่านมา เขาเอาแต่ศึกษาร่างกายของประธานผู้พิพากษามาโดยตลอด เขาจึงรู้สึกสงสัยมาก ว่าทำไมร่างกายของโจชัวถึงได้ประหลาดนัก มันมีคุณสมบัติของสสารทุกอย่าง สามารถใช้เวทมนตร์สลายร่างเพื่อแยกส่วนได้ แต่สิ่งที่ได้กลับมาก็คือพลังงานศักดิ์สิทธิ์","ตอนนี้เขาเข้าใจแล้ว!","แฮร์รอฟและออโรร่าที่มีความสามารถในการคำนวณด้อยกว่าเล็กน้อย ก็สามารถทำความเข้าใจแนวคิดอันน่าทึ่งของลินน์ได้ในเวลาอันรวดเร็ว!","ตั้งแต่ทฤษฎีดวงดาวไปจนถึงกฎแรงโน้มถ่วงสากล การวัดความเร็วแสง โครงสร้างของอะตอม และล่าสุดก็คือสมการแปลงพลังเวทมนตร์นี้...มันยากที่จะจินตนาการได้จริงๆ ว่าทฤษฎีเวทมนตร์ที่ยอดเยี่ยมมากมายขนาดนี้ จะมาจากความคิดของคนๆ เดียว","“สมการแปลงพลังเวทมนตร์ของเจ้า จะต้องเป็นการค้นพบที่ยิ่งใหญ่ที่สุด ในประวัติศาสตร์เวทมนตร์อย่างแน่นอน!”","แฮร์รอฟต้องใช้เวลานานทีเดียว กว่าจะดึงสติกลับมาจากสมการอันละเอียดอ่อนตรงหน้าได้","สมการนี้ได้หลอมรวมมวล พลังเวทมนตร์ และพลังงานเข้าด้วยกันอย่างสมบูรณ์แบบ ทำให้พวกมันไม่ได้เป็นอิสระต่อกันอีกต่อไป แต่สามารถพึ่งพา ส่งผลกระทบ และเปลี่ยนแปลงซึ่งกันและกันได้!","สมการบนกระดาษร่าง ที่สามารถทำให้จอมเวทผู้ยิ่งใหญ่ที่ไม่สันทัดเรื่องคณิตศาสตร์ชั้นสูงถึงกับสติแตกได้ กลับกลายเป็นสิ่งที่น่าทึ่งอย่างยิ่งในสายตาของแฮร์รอฟ ตัวเลขและสัญลักษณ์บนนั้น ราวกับกำลังกระโดดโลดเต้นและร่ายรำอยู่บนกระดาษ เพื่อเปิดเผยความจริงอันลี้ลับที่สุดของโลกใบนี้ให้กับเขา","“ก็คงจะไม่ถึงขั้นยิ่งใหญ่ที่สุดหรอก สมการของข้าอย่างมากก็แค่เปิดเผยความลับของโลกจุลภาคในมุมหนึ่งเท่านั้น!”","ลินน์ส่ายหน้า","ตอนที่เขาสร้างสมการนี้ขึ้นมาใหม่ๆ เขาก็มีความคิดแบบเดียวกับแฮร์รอฟ แต่หลังจากที่ความตื่นเต้นลดลง ความคิดที่โอหังนี้ก็ค่อยๆ จางหายไป","ถ้าหากเขาสามารถรวมแรงพื้นฐานทั้งสี่เข้าด้วยกัน และสร้างภาพที่แท้จริงของจักรวาลทั้งหมดขึ้นมาได้ นั่นต่างหากถึงจะเรียกว่าเป็นสมการที่ยิ่งใหญ่ที่สุด!","ออโรร่าและคนอื่นๆ ต่างก็มีสีหน้าแปลกๆ ตามที่ลินน์พูด ถ้าอย่างนั้น ช่วงเวลาหลายร้อยปีที่ผ่านมาของพวกเขาก็คงจะไม่ได้สัมผัสแม้แต่มุมหนึ่งของมันเลยสินะ...","“สรุปก็คือ สมการที่พวกท่านเห็น ก็คือวิธีการเลื่อนขั้นที่ข้าคิดค้นขึ้นมา!”","ลินน์กล่าวด้วยสีหน้าจริงจัง","“ในทางทฤษฎีแล้วมันสามารถทำได้อย่างแน่นอน แต่ข้าก็ไม่รับประกันว่าจะประสบความสำเร็จร้อยเปอร์เซ็นต์หรอกนะ!”","บรรดาประธานสภาต่างก็รู้ดี ว่าวิธีการเลื่อนขั้นใดๆ ล้วนต้องมีคนยอมเสี่ยงเป็นหนูทดลองอยู่แล้ว","ยกตัวอย่างเช่น การเลื่อนขั้นเป็นพ่อมดฝึกหัดผ่านแหล่งกำเนิดพลังเวทมนตร์ หรือการเลื่อนขั้นเป็นจอมเวทผู้ยิ่งใหญ่ผ่านวงแหวนเวทมนตร์เล่นแร่แปรธาตุ ล้วนต้องอาศัยการสรุปประสบการณ์จากอุบัติเหตุทางเวทมนตร์ครั้งแล้วครั้งเล่า ค่อยๆ ปรับปรุงให้สมบูรณ์ ถึงจะสามารถรับประกันความปลอดภัยและความน่าเชื่อถือได้","ในอดีต มีพ่อมดจำนวนไม่น้อยเลย ที่ต้องจบชีวิตลงในระหว่างการทดลองเวทมนตร์ที่เกี่ยวข้อง","และวิธีการที่ลินน์เสนอมาในครั้งนี้ คือวิธีการเลื่อนขั้นเป็นพ่อมดระดับตำนาน ดังนั้น ความอันตรายของมันจึงเป็นที่ประจักษ์ชัดอยู่แล้ว","“ถ้างั้นให้ข้าเป็นคนลองเองก็แล้วกัน!”","จู่ๆ วิกโตริโอก็เอ่ยขึ้นมา สายตาของเขาเต็มไปด้วยความแน่วแน่","“ข้าดูสมการของเจ้าแล้ว เวทมนตร์ระเบิดนิวเคลียร์ก็เป็นข้อพิสูจน์แล้วว่า พลังงานและมวลสามารถเปลี่ยนแปลงซึ่งกันและกันได้ ข้าเชื่อว่ามันจะต้องไม่มีปัญหาอะไรอย่างแน่นอน!”","วิกโตริโอรอคอยมานานเกินไปแล้ว เขาก็จำไม่ได้แล้วว่าตัวเองมีชีวิตอยู่มานานแค่ไหน ความกระตือรือร้นในใจของเขาค่อยๆ ดับมอดลงไปทีละน้อย แต่กลุ่มสมการของลินน์กลับทำให้เขามีความหวังครั้งใหม่ขึ้นมาอีกครั้ง","มันก็เหมือนกับคนที่หิวกระหายในทะเลทรายมาเป็นเวลานาน ได้มาพบกับโอเอซิส ไม่ว่ามันจะมีอยู่จริง หรือเป็นเพียงแค่ภาพลวงตา เขาก็ต้องคว้ามันเอาไว้ให้ได้!","ลินน์พยักหน้า ในเมื่อวิกโตริโอยินดีที่จะเป็นหนูทดลอง งั้นก็ดีเลย!","แม้ว่าภายในสภาเวทมนตร์ จะมีจอมเวทผู้ยิ่งใหญ่ระดับหกวงแหวนอีกสี่คน ที่มีคุณสมบัติตรงตามข้อกำหนดขั้นต่ำในการเลื่อนขั้น แต่ตามการคาดเดาของลินน์ ขั้นตอนสุดท้ายในการสร้างร่างกายใหม่นั้น เป็นงานที่ละเอียดอ่อนมาก มันจำเป็นต้องควบคุมพลังเวทมนตร์และพลังงานมหาศาลไปพร้อมๆ กัน ดังนั้น ความสามารถในการคำนวณ ยิ่งสูงก็ยิ่งดี!","ในทางทฤษฎีแล้ว ยิ่งมีความสามารถในการคำนวณสูงเท่าไหร่ โอกาสที่จะประสบความสำเร็จก็จะยิ่งสูงขึ้นเท่านั้น!","“แล้วพิธีกรรมเลื่อนขั้นในครั้งนี้ ต้องเตรียมอะไรบ้างงั้นรึ?”","แฮร์รอฟเอ่ยถามอย่างจริงจัง","“ยังขาดวงแหวนเวทมนตร์เล่นแร่แปรธาตุ สำหรับนำทางพลังงานอีกหนึ่งวง เรื่องนี้ท่านน่าจะจัดการได้ใช่ไหม ท่านประธานวิกโตริโอ?”","ลินน์เอ่ยพลางยิ้ม","แม้ว่าเขาจะเคยศึกษาเกี่ยวกับการเล่นแร่แปรธาตุมาบ้าง แต่การจะออกแบบวงแหวนเวทมนตร์เล่นแร่แปรธาตุ ที่มีขนาดใหญ่และซับซ้อนขนาดนี้ ก็ยังเกินความสามารถของเขาไปอยู่ดี โชคดีที่นักเล่นแร่แปรธาตุของสภาเวทมนตร์ไม่ได้มีแค่เขาเพียงคนเดียว","วิกโตริโอพยักหน้า วงแหวนเวทมนตร์สำหรับนำทางพลังงานแค่วงเดียว สำหรับเขาแล้ว ถือเป็นเรื่องง่ายมาก","“นอกจากนี้ก็คือปัญหาเรื่องพลังงานแล้วล่ะ”","เมื่อพูดถึงตรงนี้ สีหน้าของลินน์ก็เปลี่ยนเป็นเคร่งเครียด","แฮร์รอฟและคนอื่นๆ ก็เข้าใจดีว่า นี่แหละคือจุดสำคัญที่สุด","“แล้วต้องใช้พลังงานเท่าไหร่กันล่ะ?”","ออโรร่าเอ่ยถาม","“เอาเป็นว่า จากการคำนวณของข้า น่าจะต้องใช้พลังงานเท่ากับการร่ายเวทมนตร์ระเบิดนิวเคลียร์ประมาณหนึ่งหมื่นครั้งล่ะมั้ง!”","ลินน์ครุ่นคิดก่อนจะตอบกลับ","“หนึ่งหมื่นครั้ง...เวทมนตร์ระเบิดนิวเคลียร์งั้นรึ?!”","วิกโตริโอถึงกับอึ้งไปเลย เขารู้สึกหน้ามืดวิงเวียนขึ้นมาในทันที","แฮร์รอฟและออโรร่าต่างก็มีสีหน้าตกตะลึงเช่นกัน พวกเขาเกือบจะคิดไปแล้วว่าตัวเองฟังผิดหรือเปล่า","ลินน์ยักไหล่อย่างจนใจ การแตกตัวของยูเรเนียม-235 จะสูญเสียมวลไปประมาณเก้าในหมื่นส่วนเท่านั้น","นั่นหมายความว่า ในยูเรเนียม-235 ปริมาณ 1 กรัม จะมีมวลเพียง 0.9 มิลลิกรัมเท่านั้น ที่ถูกเปลี่ยนเป็นพลังงาน ซึ่งถือว่าประสิทธิภาพต่ำมาก","ความจริงแล้ว พลังงานที่เกิดจากการระเบิดนิวเคลียร์หนึ่งหมื่นครั้ง ก็เทียบเท่ากับมวลแค่สิบถึงยี่สิบกิโลกรัมเท่านั้น ซึ่งมันก็คิดเป็นแค่สิบกว่าเปอร์เซ็นต์ของน้ำหนักตัวเขาเอง เพราะแก่นแท้ในการสร้างร่างกายธาตุนั้น พลังเวทมนตร์คือส่วนสำคัญที่สุด","“นี่มันไม่เยอะเกินไปหน่อยงั้นรึ!”","เมื่อเห็นว่าลินน์ไม่ได้มีทีท่าว่าล้อเล่นเลยแม้แต่น้อย วิกโตริโอก็ขมวดคิ้วเข้าหากันแน่นในทันที","เวทมนตร์ระเบิดนิวเคลียร์เพียงแค่ครั้งเดียว ก็เพียงพอที่จะทำลายล้างดินแดนในรัศมีสิบกว่ากิโลเมตร และเปลี่ยนเมืองขนาดใหญ่ให้กลายเป็นดินแดนรกร้างได้แล้ว","แต่การร่ายเวทมนตร์นี้ติดต่อกันถึงหนึ่งหมื่นครั้ง คงใช้คำว่าทำลายล้างโลกมาอธิบายได้เท่านั้น!","“งั้นพวกเราสร้างร่างกายของเด็กทารกขึ้นมาก่อนดีไหม?”","จู่ๆ วิกโตริโอก็มีความคิดแปลกๆ ขึ้นมา เขาคิดว่าแบบนี้ก็น่าจะพอรับได้เหมือนกัน","เล็กหน่อยก็เล็กหน่อยเถอะ ขอแค่ใช้ได้ก็พอ!","ยังไงเสีย เขาก็ไม่ได้สนใจเรื่องหน้าตาอยู่แล้ว!","เมื่อได้ยินข้อเสนอของวิกโตริโอ ลินน์ก็อดไม่ได้ที่จะหัวเราะไม่ออก เขาคาดเดาเอาไว้แล้วว่า ร่างกายพลังงานนี้ ไม่ได้ถูกสร้างขึ้นมาส่งเดช แต่มันมีความเกี่ยวข้องกับวิญญาณด้วย ไม่อย่างนั้น อาจจะเกิดความไม่เข้ากันได้","หลังจากที่ลินน์อธิบายไปอย่างจนใจ เขาก็กล่าวต่อไปว่า","“เรื่องพลังงาน พวกท่านไม่ต้องเป็นห่วงไป ข้ามีวิธีแก้ไขแล้วล่ะ!”","เมื่อเห็นว่าลินน์พูดจาหนักแน่นขนาดนี้ บรรดาประธานสภาต่างก็รู้สึกประหลาดใจเป็นอย่างมาก พลังงานจากการระเบิดนิวเคลียร์หนึ่งหมื่นครั้งไม่ใช่เรื่องตลกเลยนะ ต่อให้พวกเขาขุดเหมืองยูเรเนียมจนหมดภูเขา ก็ยังไม่แน่ใจเลยว่าจะสามารถรวบรวมเชื้อเพลิงนิวเคลียร์ได้มากขนาดนั้น","“ในช่วงไม่กี่วันที่ผ่านมา ข้าหาเวลาปรับปรุงเวทมนตร์ระเบิดนิวเคลียร์ โดยใช้ธาตุอีกชนิดหนึ่งเป็นเชื้อเพลิง ซึ่งมันจะช่วยเพิ่มพลังทำลายล้างได้อย่างมหาศาล เพิ่มอัตราการสูญเสียมวลได้ถึงแปดเท่า และยังสามารถปลดปล่อยพลังงานออกมาได้อย่างต่อเนื่องด้วย!”","ลินน์อธิบายเป็นฉากๆ","นี่มันยังเพิ่มพลังทำลายล้างได้อีกแปดเท่างั้นรึ?","วิกโตริโอนึกถึงยอดเขาที่หายไป และพื้นดินที่กลายเป็นกระจก นอกเมืองน้ำมันดิน เขาไม่สามารถจินตนาการได้เลยว่า เวทมนตร์ระเบิดนิวเคลียร์ที่มีพลังเพิ่มขึ้นแปดเท่า จะทรงพลังมากขนาดไหน","ส่วนแฮร์รอฟก็มองไปที่สมการคณิตศาสตร์ชั้นสูงที่ซับซ้อนบนโต๊ะ แล้วก็มีท่าทีลังเลอยากจะพูดอะไรบางอย่าง เขาแปลกใจมาก ว่าลินน์สามารถปรับปรุงเวทมนตร์ระดับตำนานไป ‘พร้อมๆ’ กับการวิจัยสมการแปลงพลังเวทมนตร์ได้อย่างไร","หรือว่าเขาจะมีสมองสองซีกกันแน่?","บางทีนี่อาจจะเป็นสิ่งที่เรียกว่าอัจฉริยะล่ะมั้ง...","หลังจากที่ลินน์อธิบายแนวคิดของตัวเองจบ เขาก็สรุปทิ้งท้ายว่า","“แผนการของข้าเรียบง่ายมาก นั่นก็คือการสร้างดวงอาทิตย์ขึ้นมาบนพื้นดิน เพื่อให้เป็นแหล่งพลังงานที่เพียงพอ!”","ออโรร่าคลึงขมับของตัวเองเบาๆ ข้อมูลมหาศาลที่ลินน์มอบให้ ทำให้เธอรู้สึกว่ามันยากที่จะย่อยสลายได้ในเวลาอันสั้น แถมยิ่งฟังก็ยิ่งดูเกินจริงเข้าไปใหญ่","สร้างดวงอาทิตย์ขึ้นมาบนพื้นดินเนี่ยนะ?","หากคำพูดเหล่านี้ไม่ได้ออกมาจากปากของดาวรุ่งแห่งเวทมนตร์ เธอคงจะคิดว่ามันเป็นเรื่องไร้สาระของพ่อมดคนไหนสักคนเป็นแน่","แต่พลังของเวทมนตร์ระเบิดนิวเคลียร์นั้นช่างน่าสะพรึงกลัวจริงๆ ถึงขนาดที่ชาวเมืองน้ำมันดินต่างก็ลือกันว่า พวกเขาได้ดึงดวงอาทิตย์ลงมาจากท้องฟ้า!","การใช้คำว่าดวงอาทิตย์เทียมมาอธิบาย ก็ดูเหมือนจะไม่เกินจริงเท่าไหร่นัก...","“เจ้าบอกมาเลยดีกว่า ว่าพวกเราต้องทำอะไรบ้าง”","สมการมากมาย และทฤษฎีแปลกใหม่ที่ออกมาจากปากของลินน์ ทำให้แฮร์รอฟปวดหัวไปหมด เห็นได้ชัดว่ามันไม่ใช่สิ่งที่จะอธิบายให้เข้าใจได้ภายในสองสามวัน","“สรุปก็คือ เวทมนตร์ใหม่ของข้าจำเป็นต้องใช้น้ำ ‘น้ำมวลหนัก’ จำนวนมาก!”","ลินน์กล่าวด้วยสีหน้าจริงจัง","แฮร์รอฟและคนอื่นๆ ย่อมรู้ดีว่าน้ำมวลหนักที่ลินน์พูดถึง ก็คือธาตุดิวเทอเรียม ทริเทียม ฯลฯ ที่สกัดออกมาจากน้ำนั่นเอง","“ต้องใช้เยอะมากๆ เลยนะ!”","ลินน์ลองคำนวณคร่าวๆ ก่อนจะพูดเปรียบเทียบให้เห็นภาพ","“อืม ก็น่าจะประมาณว่าสกัดธาตุออกมาจากน้ำครึ่งหนึ่งของทะเลสาบล่ะมั้ง ถึงจะพอน่ะ!”","นี่เป็นปริมาณที่น่าสะพรึงกลัวอย่างไม่ต้องสงสัย แต่หลังจากที่ถูกโจมตีด้วยสมการแปลงพลังเวทมนตร์ และแนวคิดดวงอาทิตย์เทียม แฮร์รอฟ ออโรร่า และวิกโตริโอก็เริ่มจะชินชาเสียแล้ว","“ตกลง! ถ้างั้นข้าจะส่งคนไปจัดการสูบน้ำในทะเลสาบนั้น...ให้แห้งซะ!”","วิกโตริโอเป็นคนแรกที่ตัดสินใจอย่างเด็ดขาด","อย่าว่าแต่ครึ่งทะเลสาบเลย ขอเพียงแค่สามารถเลื่อนขั้นเป็นระดับตำนานได้ ต่อให้ลินน์จะสั่งให้พวกเขาไปสูบน้ำในมหาสมุทรให้แห้ง พวกเขาก็ต้องหาทางทำมันให้ได้!"]},{"n":461,"t":"สติปัญญาของท่านปรมาจารย์ลินน์ จะเป็นสิ่งที่พวกเจ้าเข้าใจได้อย่างไรกัน?","c":["ในวันรุ่งขึ้น หลังจากการประชุมภายในของบรรดาประธานสภาสิ้นสุดลง พ่อมดทุกคนที่เชี่ยวชาญเวทมนตร์สายฟ้า ก็ถูกเรียกตัวมารวมกัน โดยพวกเขาต้องหยุดงานในมือทั้งหมด และเริ่มต้นเข้าสู่โหมดการสกัดทริเทียมแบบเต็มกำลัง!","วิธีการที่ใช้ ก็คือวิธีการแยกสลายด้วยไฟฟ้าที่ค่อนข้างโบราณ!","ซึ่งมีข้อเสียเพียงอย่างเดียว คือมันกินไฟมากเกินไป โชคดีที่พ่อมดสามารถสร้างกระแสไฟฟ้าขึ้นมาเองได้ ดังนั้น การรวมตัวกันของพ่อมดที่เชี่ยวชาญเวทมนตร์สายฟ้าหลายร้อยคน ก็ทำให้พวกเขาสามารถจัดการกับน้ำในทะเลสาบได้ประมาณสิบตันภายในวันเดียว","ส่วนวิกโตริโอ ก็พาบรรดานักเล่นแร่แปรธาตุ ไปครุ่นคิดหาวิธีสร้างวงแหวนเวทมนตร์สำหรับนำทางพลังงาน","หลังจากที่ได้ฟังคำอธิบายของลินน์ เขาก็เพิ่งจะเข้าใจ ว่าภารกิจของเขามันหนักหนาขนาดไหน การที่จะต้องดึงพลังงานที่เทียบเท่ากับเวทมนตร์ระเบิดนิวเคลียร์ถึงหนึ่งหมื่นครั้ง เข้าไปในวงแหวนเวทมนตร์เล่นแร่แปรธาตุ จากนั้นก็ค่อยๆ ถ่ายโอนมันเข้าสู่ร่างกายพลังงานอย่างเป็นระเบียบ ความยากของมันก็เป็นที่ประจักษ์ชัดอยู่แล้ว!","วิกโตริโอระมัดระวังเป็นอย่างมาก เขาพยายามทำให้วงแหวนเวทมนตร์ออกมาสมบูรณ์แบบที่สุด เพราะยังไงเสีย เขาก็เป็นแค่หนูทดลอง หากเกิดข้อผิดพลาดเพียงเล็กน้อย เขาก็จะถูกพลังงานอันน่าสะพรึงกลัวนี้ ลบล้างไปจนหมดสิ้น!","การระดมพลครั้งใหญ่ของสภาเวทมนตร์ ย่อมยากที่จะปิดบังเอาไว้ได้","เพื่อป้องกันไม่ให้ข้อมูลรั่วไหล แฮร์รอฟจึงให้คนปล่อยข่าวลือออกไป ว่าเนื่องจากท่านปรมาจารย์ลินน์ ผู้เป็นดาวรุ่งแห่งเวทมนตร์ ได้ร่ายเวทมนตร์ระเบิดนิวเคลียร์ จึงทำให้น้ำในแม่น้ำสายใหญ่ที่อยู่นอกเมืองไม่สามารถนำมาดื่ม หรือใช้รดน้ำต้นไม้ได้อีกต่อไป โดยพวกเขากำลังหาวิธีแก้ไขปัญหาเรื่องการปนเปื้อนของรังสีอยู่","ข่าวลือเรื่องน้ำปนเปื้อน ทำให้เกิดความตื่นตระหนกขึ้นในเมืองเพียงเล็กน้อย แต่ไม่นานมันก็ถูกระงับลงไป โดยสภาเวทมนตร์ที่มีการเตรียมการเอาไว้ล่วงหน้าแล้ว เพราะความจริงแล้ว ในช่วงนี้ พวกเขาก็ไม่ได้ดื่มน้ำจากแม่น้ำสายใหญ่นั้นเลย แต่มันถูกสูบมาจากทะเลสาบต่างหาก","บรรดาพ่อมดใช้เวลาหลายวัน ในการขุดคลองขนาดใหญ่ขึ้นมา และหลังจากที่สกัดน้ำมวลหนักออกไปแล้ว น้ำส่วนที่เหลือ ก็จะถูกนำไปใช้เป็นน้ำประปาให้กับชาวเมือง","แต่การรดน้ำต้นไม้ในพื้นที่การเกษตร ก็ถือเป็นปัญหาใหญ่เลยทีเดียว","เรื่องนี้ทำให้มอนโรที่คอยสอดแนมข่าวกรองอยู่เงียบๆ นั้นรู้สึกดีใจเป็นอย่างมาก เพราะเขาพบว่า บรรดาพ่อมดไม่ได้มีความคิดที่จะเบิกที่ดินทำกินเลยแม้แต่น้อย แม้กระทั่งที่ดินเดิมที่มีอยู่ ก็ถูกทิ้งร้างไปจนหมดแล้ว และบรรดาคนยากจนที่เคยทำนา ต่างก็เข้าไปทำงานในโรงงานผลิตปืนคาบศิลา ปืนใหญ่ หรือไม่ก็สินค้าแปลกๆ ชนิดต่างๆ จนหมด","แทบจะทุกวัน จะมีขบวนกองคาราวานสินค้า ขนเงินและทองคำจำนวนมหาศาลเข้ามาในเมืองน้ำมันดิน จากนั้นก็ขนสินค้ากลับไปจนเต็มคันรถ ด้วยความพึงพอใจ เพราะกำไรที่พวกเขาได้รับนั้น มากพอที่จะทำให้ทุกคนต้องอิจฉาตาร้อน!","แม้มอนโรจะเกลียดชังพ่อค้าของจักรวรรดิที่ทรยศต่อพระผู้เป็นเจ้า และหันไปทำสัญญากับปีศาจเหล่านี้เข้ากระดูกดำ แต่เขาก็ต้องอดทนเอาไว้ ปล่อยให้บรรดาพ่อมดและพ่อค้าที่ร่ำรวยเหล่านี้ ดีใจกันไปก่อนเถอะ!","ขอเพียงแค่การเพาะปลูกในฤดูใบไม้ร่วงของปีนี้เกิดปัญหา อีกไม่นาน เมื่อเสบียงอาหารหมดลง ทั้งเมือง หรือแม้กระทั่งทั้งอาณาจักร ก็จะต้องตกอยู่ในสภาวะอดอยากอย่างแน่นอน","นอกจากนี้ สิ่งที่ทำให้มอนโรรู้สึกเกลียดชังเป็นพิเศษ ก็คือหลักสูตรของสถาบันเวทมนตร์","เมื่อพิจารณาว่า บรรดาพ่อมดที่เดินทางมายังอาณาจักรแห่งนี้ มีระดับเวทมนตร์ที่แตกต่างกันมาก ดังนั้น ภายใต้การหารือของสภาเวทมนตร์ พวกเขาจึงถูกส่งเข้าไปเรียนในสถาบันเวทมนตร์ เพื่อทำการปรับปรุงใหม่ทั้งหมด","และการกระทำอันป่าเถื่อนเช่นนี้ ก็ทำให้พ่อมดบางคนรู้สึกไม่พอใจ โดยเฉพาะจอมเวทผู้ยิ่งใหญ่หลายคนที่เดินทางมาจากแดนไกล ไม่คิดเลยว่าตัวเองจะต้องเข้าไปเรียนในสถาบันอีกครั้ง","แต่หลังจากที่ได้สัมผัสกับหลักสูตรของสถาบันเวทมนตร์อย่างแท้จริงแล้ว พวกเขาก็พบว่า มันดูเหมือนจะแตกต่างไปจากที่พวกเขาคิดเอาไว้เล็กน้อย","นอกจากวิชาพื้นฐานอย่าง ธาตุ การแปรสภาพ การเล่นแร่แปรธาตุ และยาเวทมนตร์แล้ว ก็ยังมีวิชาคณิตศาสตร์ ฟิสิกส์ และเคมีอีกสามวิชาด้วย","หลังจากที่เรียนไปได้สองสามคาบ ลูคัสและคนอื่นๆ ก็ค้นพบอย่างรวดเร็วว่า ฟิสิกส์ที่ว่านี้ ก็คือกฎเกณฑ์การทำงานของโลก และเป็นพื้นฐานของเวทมนตร์สนามพลัง","ส่วนเคมี ก็คือรากฐานของเวทมนตร์ธาตุ เพียงแค่ตารางธาตุใบเดียว ก็ทำให้บรรดาพ่อมดธาตุถึงกับตกตะลึงไปตามๆ กัน","พวกเขาไม่คิดเลยว่า จะมีใครสามารถสรุปคุณสมบัติต่างๆ ของธาตุ ให้ออกมาเป็นตารางได้ แถมยังจัดเรียงลำดับของพวกมันได้อีกด้วย...","บอกได้คำเดียวว่า สมแล้วที่เป็นดินแดนศักดิ์สิทธิ์ของพ่อมด!","แม้กระทั่งจอมเวทผู้ยิ่งใหญ่ที่เคยวางมาดในตอนแรก เมื่อได้เห็นธาตุที่มีมากถึงร้อยกว่าชนิดบนตาราง ก็ต้องยอมรับว่า ความรู้พื้นฐานด้านเวทมนตร์ของพวกเขานั้น ยังจำเป็นต้องได้รับการปรับปรุงอีกมาก","“ท่านฟิลิป ทำไมธาตุโบรอนบนตารางธาตุ ถึงมีแค่ชื่อกับลำดับล่ะ มันเป็นธาตุใหม่ที่ถูกปิดเป็นความลับงั้นรึ?”","ลูคัสบังเอิญสังเกตเห็นจุดที่ค่อนข้างแปลกประหลาดบนตารางธาตุ จึงเอ่ยถามขึ้นมา","มีธาตุเพียงครึ่งเดียวบนตาราง ที่มีคำอธิบายอย่างละเอียด ทั้งมวล ความหนาแน่น จุดเดือด เลขอะตอม มวลอะตอม และอื่นๆ ...ส่วนธาตุอีกครึ่งหนึ่ง ก็เหมือนกับธาตุโครเมียม ที่นอกจากชื่อและลำดับแล้ว ก็ว่างเปล่าไปหมด","“นั่นคือธาตุที่ท่านปรมาจารย์ลินน์คาดเดาเอาไว้ว่าน่าจะมีอยู่จริง แต่ยังหาไม่พบน่ะ!”","ฟิลิปอธิบาย","“คาดเดางั้นรึ?”","มอนโรหัวเราะเยาะออกมา","“อย่าบอกนะว่า ตารางธาตุทั้งตาราง ถูกท่านปรมาจารย์ลินน์คนนั้น คาดเดาขึ้นมาทั้งหมดน่ะ?”","“ตามคำอธิบายบนนั้น ปริมาตรของอะตอมหนึ่งตัว อาจจะมีขนาดเพียงแค่เศษหนึ่งส่วนหลายพันเซนติเมตร แถมมันยังล่องลอยอยู่ในอากาศอีก แล้วพวกเขาใช้วิธีอะไร ในการวัดน้ำหนัก ความหนาแน่น และปริมาตรของพวกมันกันล่ะ?”","คำพูดของมอนโร ทำให้บรรดาพ่อมดที่อยู่ที่นั่นอดไม่ได้ที่จะขมวดคิ้วออกมา","เมื่อพิจารณาจากสิ่งใหม่ๆ ที่พวกเขาได้เห็น หลังจากที่เข้ามาในเมืองน้ำมันดินแห่งนี้ ก่อนหน้านี้ พวกเขาก็ไม่ได้มีข้อสงสัยอะไรมากมายนัก เกี่ยวกับเนื้อหาบนตารางธาตุใบนี้","แต่หลังจากที่ถูกมอนโรขัดจังหวะ ในใจของลูคัสและคนอื่นๆ ก็เกิดความสงสัยแบบเดียวกันขึ้นมา ว่าท่านปรมาจารย์ลินน์ใช้วิธีอะไร ในการวัดข้อมูลต่างๆ ของธาตุที่มีขนาดเล็กขนาดนั้นกันแน่?","“ไอ้โง่! การที่เจ้าคิดไม่ออก มันก็ไม่ได้หมายความว่าคนอื่นจะคิดไม่ออกนี่ สติปัญญาของท่านปรมาจารย์ลินน์ จะเป็นสิ่งที่คนอย่างเจ้าเข้าใจได้อย่างไรกัน?”","ฟิลิปมองมอนโรด้วยสายตาดูถูก จากนั้นเขาก็อธิบายให้ทุกคนฟัง","ลำดับบนตารางธาตุใบนี้ ไม่ได้ถูกจัดเรียงขึ้นมามั่วๆ แต่มันถูกกำหนดขึ้น ตามจำนวนโปรตอนในโครงสร้างของธาตุ","ตัวอย่างเช่น ในบรรดาธาตุที่พวกเขาค้นพบและยืนยันแล้ว อย่างธาตุไฮโดรเจนมีเลขอะตอมเป็นหนึ่ง ธาตุฮีเลียมเป็นสอง ธาตุลิเธียมและเบริลเลียมเป็นสามและสี่ จากนั้นลำดับของธาตุคาร์บอน ก็กระโดดไปเป็นหก ส่วนธาตุไนโตรเจนและออกซิเจน ก็เป็นเจ็ดและแปดพอดี แต่กลับไม่มีลำดับที่ห้าเลย!","ลินน์เชื่อว่า ลำดับที่ห้า (โปรตอนในนิวเคลียส) จะต้องมีอยู่จริงอย่างแน่นอน เพียงแต่พวกเขายังค้นหาไม่พบก็เท่านั้น!","ส่วนธาตุอื่นๆ ก็ถูก ‘คาดเดา’ ออกมาด้วยวิธีเดียวกันนี้แหละ!","ส่วนมวลของพวกมัน ก็ถูกวัดด้วยการใช้แรงโน้มถ่วงเป็นไม้บรรทัด จากนั้นก็ใช้วิธีการขยายการเสียรูปเล็กน้อย เพื่อขยายความแตกต่างเพียงเล็กน้อยให้ใหญ่ขึ้นหลายร้อยเท่า จนสามารถคำนวณหามวลของพวกมันออกมาได้","“ท่านปรมาจารย์ลินน์เคยกล่าวเอาไว้ว่า การวัดความยาวของสิ่งของ ไม่จำเป็นต้องใช้ไม้บรรทัดเสมอไป และการวัดมวลของสิ่งของ ก็ไม่จำเป็นต้องใช้ตาชั่งเสมอไปเช่นกัน!”","ฟิลิปอธิบายแนวคิดที่ยอดเยี่ยมของท่านประธานลินน์ ให้บรรดาพ่อมดที่อยู่ที่นั่นฟังอย่างเข้าใจง่าย","มอนโรที่มี ‘ระดับการศึกษา’ จำกัด ถึงกับฟังไม่รู้เรื่อง แต่เขาก็ไม่กล้าที่จะตอบโต้อะไรกลับไป เพราะบรรดาพ่อมดที่อยู่ข้างๆ ต่างก็พากันร้องอุทานออกมาด้วยความชื่นชมแล้ว","“ใช้แรงโน้มถ่วงเป็นไม้บรรทัด ใช้กาลอวกาศเป็นฉากกั้น สมแล้วที่เป็นดาวรุ่งแห่งเวทมนตร์ ถึงกับคิดหาวิธีแบบนี้ออกมาได้!”","ลูคัสกล่าวชื่นชมออกมาจากใจจริง","“ในเมื่อลำดับของธาตุ ถูกกำหนดโดยโครงสร้างภายในของมัน งั้นก็แสดงว่า สภาเวทมนตร์น่าจะทำความเข้าใจเกี่ยวกับโครงสร้างของธาตุได้อย่างถ่องแท้แล้วใช่ไหม?”","แม่มดหน้าตาสะสวยคนหนึ่ง เอ่ยถามขึ้นมาอย่างกะทันหัน","ลูคัสและคนอื่นๆ ต่างก็หันไปมองฟิลิปเช่นกัน ก่อนหน้านี้ ในความทรงจำของพวกเขา ธาตุก็คือสิ่งที่พื้นฐานที่สุดที่ประกอบขึ้นเป็นโลกใบนี้ และเป็นรากฐานของทุกสรรพสิ่ง","เพียงแต่ความเชื่อนี้ ได้ถูกทำลายลงไปแล้วในชั่วโมงเรียนวิชาฟิสิกส์ เพราะในการศึกษาวิจัยเกี่ยวกับสนามแม่เหล็กและสนามไฟฟ้า โดยพ่อมดที่เป็นผู้สอน ได้อธิบายถึงสิ่งที่มีขนาดเล็กกว่าธาตุพื้นฐานขึ้นมา ซึ่งนั่นก็คือประจุไฟฟ้า!","แถมประจุไฟฟ้าก็ยังมีอยู่ทั่วไปในธาตุ และก็น่าจะเป็นหนึ่งในสสารพื้นฐาน ที่ประกอบขึ้นเป็นธาตุด้วย","“นั่นมันก็แน่อยู่แล้ว!”","ฟิลิปพยักหน้าด้วยความภาคภูมิใจ เขาจงใจกระตุ้นความอยากรู้อยากเห็นของทุกคน ก่อนจะเปลี่ยนเรื่อง แล้วกล่าวต่อไปว่า","“การศึกษาวิจัยเกี่ยวกับโครงสร้างภายในของธาตุ ถือเป็นทฤษฎีเวทมนตร์ที่ล้ำสมัยที่สุดของสภาเวทมนตร์ในปัจจุบัน ซึ่งมันยังอยู่ในขั้นตอนการปรับปรุงให้สมบูรณ์ ดังนั้น ตอนนี้จึงมีเพียงแค่สมาชิกสภาเท่านั้น ที่มีสิทธิ์เข้าร่วมในการวิจัย!”","“แล้วจะทำยังไงถึงจะได้เข้าไปในสภาเวทมนตร์ และกลายเป็นสมาชิกสภาล่ะ?”","แม่มดหน้าตาสะสวยเอ่ยถามขึ้นมาอีกครั้ง","“เรื่องนี้ ก็ต้องผ่านการประเมินสิ สมาชิกสภาแต่ละคน ล้วนเป็นบุคคลชั้นยอดที่ถูกคัดเลือกมาทั้งนั้น!”","ฟิลิปทำท่าวางมาด การจะกลายเป็นสมาชิกสภานั้น ไม่ใช่เรื่องง่ายเลย","นั่นคือสมาชิกระดับแกนนำของสภาเวทมนตร์ ซึ่งมีสิทธิ์ในการลงคะแนนเสียงในกิจการสำคัญทุกอย่าง","และตอนนี้ก็กำลังอยู่ในช่วงสงคราม พ่อมดต่างถิ่นที่เดินทางมาจากจักรวรรดิเหล่านี้ หากต้องการจะเป็นสมาชิกสภา พวกเขาก็จะต้องผ่านช่วงเวลาการประเมินที่ยาวนานเสียก่อน","เมื่อพูดถึงตรงนี้ ฟิลิปก็หยุดชะงักไปครู่หนึ่ง เพื่อเป็นการกระตุ้นความกระตือรือร้นของบรรดาพ่อมดต่างถิ่นเหล่านี้ และทำให้พวกเขายอมแบ่งปันผลการวิจัยทางเวทมนตร์ของตัวเองออกมา เขาจึงเอ่ยขึ้นมาอีกครั้ง","“ความจริงแล้ว การจะเป็นสมาชิกสภาก็มีทางลัดอยู่เหมือนกัน นั่นก็คือการสร้างผลงานให้มากพอ!”","“ยกตัวอย่างเช่น ท่านปรมาจารย์ลินน์ กฎแรงโน้มถ่วงสากลที่เขาเสนอให้กับเวทมนตร์สนามพลัง ทำให้เขาได้รับเกียรติยศสูงสุดของสภาเวทมนตร์ นั่นก็คือเหรียญตราโคโรนา และเขาก็ได้รับการเสนอชื่อจากบรรดาประธานสภาในทันที!”","ฟิลิปพูดจ้อไม่หยุด จากนั้นเขาก็พูดปลอบใจทุกคน ว่าอัจฉริยะทางเวทมนตร์อย่างท่านปรมาจารย์ลินน์นั้น มีอยู่เพียงหยิบมือเดียวเท่านั้น ซึ่งความจริงแล้ว การจะเป็นสมาชิกสภานั้นไม่จำเป็นต้องได้รับเหรียญตราโคโรนาที่เวอร์วังขนาดนั้นหรอก ขอเพียงแค่ได้รับเหรียญตราจันทร์สีเงินหนึ่งเหรียญ หรือไม่ก็เหรียญตาดาวประกายพฤกษ์สามเหรียญ ก็จะได้รับการเสนอชื่อร้อยเปอร์เซ็นต์แล้ว!","...","ชั่วโมงเรียนวิชาเคมีจบลงอย่างรวดเร็ว ท่ามกลางเสียงคุยโวของฟิลิป ตลอดครึ่งชั่วโมงที่ผ่านมา ฟิลิปเอาแต่เล่าถึงวีรกรรมอันยิ่งใหญ่ของใครบางคน ให้บรรดาพ่อมดที่เดินทางมาจากจักรวรรดิฟัง","ตั้งแต่การใช้ลูกบอลสองลูก เพื่อพิสูจน์กฎการตกอย่างอิสระ ไปจนถึงการคำนวณเส้นรอบวงของดวงดาว ด้วยมุมของการสะท้อนผ่านเสาน้ำแข็ง ราวกับจะบอกว่า ขอเพียงแค่พยายาม คุณเองก็สามารถเป็นดาวรุ่งแห่งเวทมนตร์คนต่อไปได้!","“ไร้สาระ นี่มันไร้สาระสิ้นดี!”","ทันทีที่มอนโรกลับมาถึงที่พักของสำนัก เขาก็อดไม่ได้ที่จะสบถออกมาด้วยความโมโห","ไอ้พวกพ่อมดนั่น ถึงกับบอกว่าทวีปที่พวกเขาเหยียบอยู่ เป็นทรงกลม แถมมันยังหมุนอยู่ตลอดเวลาอีก!","สมองของพวกมันถูกเวทมนตร์กัดกินไปหมดแล้วรึไง?","ถึงได้คิดทฤษฎีที่น่าขันแบบนี้ออกมาได้!","หากทวีปเป็นทรงกลม แล้วคนที่อยู่ด้านล่างของทรงกลม จะใช้ชีวิตอยู่ได้ยังไง พวกเขาจะไม่หัวทิ่มตกลงไปหรอกรึ?","ไอวีน่าเองก็กำลังครุ่นคิดถึงปัญหานี้เช่นกัน โดยตลอดหนึ่งสัปดาห์ที่เธอเข้ามาเรียนในสถาบันเวทมนตร์ ทุกคาบเรียนที่เธอเข้าเรียน ล้วนทำให้เธอรู้สึกแปลกใหม่และแปลกประหลาดเป็นอย่างมาก","อย่างเช่น การทดลองการตกอย่างอิสระในสภาวะสุญญากาศ การแยกแสงด้วยปริซึมสามเหลี่ยม การสร้างรุ้งกินน้ำเทียม และอื่นๆ ในวิชาฟิสิกส์","สิ่งที่ทำให้ไอวีน่ารู้สึกประหลาดใจมากที่สุด ก็คือการทดลองที่เรียกกันว่า การทดลองหลายๆ อย่างนั้น ไม่จำเป็นต้องพึ่งพาเวทมนตร์เลยด้วยซ้ำ อย่างการสร้างรุ้งกินน้ำที่ง่ายที่สุด ขอเพียงแค่มีอุปกรณ์พ่นละอองน้ำง่ายๆ แล้วหามุมที่เหมาะสมก็เพียงพอแล้ว","ตามคำอธิบายของพ่อมดผู้สอน การพัฒนาด้านเวทมนตร์ของพวกเขานั้น แท้จริงแล้ว ก็คือกระบวนการในการค้นหาความจริงของโลก และเวทมนตร์ก็เป็นเพียงแค่สิ่งที่ช่วยให้พ่อมด สามารถเปลี่ยนกฎเกณฑ์การทำงานของทุกสรรพสิ่ง ให้กลายเป็นพลังได้อย่างง่ายดายเท่านั้น!","แต่เมื่อเอาการทดลองที่แปลกใหม่เหล่านี้มารวมกัน มันก็ยังไม่น่าตกตะลึงเท่ากับทฤษฎีดวงดาวนี้เลย!","ไม่ว่าใครที่ได้ยินว่าทวีปที่พวกเขาเหยียบอยู่ ไม่ใช่พื้นราบ แต่เป็นทรงกลม ก็คงจะรู้สึกไม่อยากจะเชื่อทั้งนั้นแหละ!","ตามคำสอนในพระคัมภีร์ โลกทั้งใบถูกสร้างขึ้นมาจากความว่างเปล่า โดยพระผู้เป็นเจ้าผู้ทรงเมตตา และดวงดาวทุกดวงบนท้องฟ้า ซึ่งรวมถึงดวงอาทิตย์และดวงจันทร์ ต่างก็หมุนรอบทวีปที่พวกเขาเหยียบอยู่ทั้งสิ้น","นี่คือสามัญสำนึกที่เป็นที่รู้กันดีไปทั่วทั้งจักรวรรดิ!","แต่โลกในปากของบรรดาพ่อมด กลับแตกต่างออกไปอย่างสิ้นเชิง โดยทวีปที่พวกเขาเหยียบอยู่ นอกจากจะเป็นทรงกลมแล้ว ดวงอาทิตย์ก็ยังเป็นศูนย์กลางของระบบสุริยะทั้งหมดอีกด้วย ส่วนดาวเคราะห์ดวงอื่นๆ ต่างก็หมุนรอบดวงอาทิตย์อย่างต่อเนื่อง ภายใต้แรงโน้มถ่วง","ซึ่งพ่อมดผู้สอนยังได้ยก ‘หลักฐาน’ มาอธิบายอีกมากมาย","ยกตัวอย่างเช่น ปรากฏการณ์จันทรุปราคา ก็คือเงาของดวงดาวที่พวกเขาอาศัยอยู่ ไปบดบังดวงจันทร์เอาไว้ หรืออย่างตอนที่นั่งเรือ หากใช้เวทมนตร์ส่องดูประภาคารสูงตระหง่านที่อยู่ไกลๆ ก็จะต้องเห็นยอดประภาคารก่อน แล้วค่อยเห็นตัวประภาคาร เป็นต้น...","ลินน์ที่มีฉายาว่าดาวรุ่งแห่งเวทมนตร์ ถึงกับใช้การทดลองลูกตุ้มที่แม่นยำ เพื่อพิสูจน์ว่าดวงดาวกำลังหมุนรอบตัวเอง แถมยังใช้หอคอยสูงตระหง่าน และเสาน้ำแข็งที่ตั้งตระหง่านอยู่บนผิวน้ำทะเล ในการคำนวณข้อมูลเส้นรอบวงของดวงดาวออกมาได้สำเร็จอีกด้วย!","ตั้งสี่หมื่นสามพันสองร้อยกิโลเมตรเลยนะ!","ที่สำคัญที่สุดก็คือ เมื่อไม่นานมานี้ พวกเขาเพิ่งจะได้เรียนรู้เกี่ยวกับทฤษฎีสามเหลี่ยม รวมไปถึงวิธีการคำนวณเส้นรอบวง และพื้นที่ของวงกลมในวิชาคณิตศาสตร์ ซึ่งนั่นก็หมายความว่า หากอาศัยเงื่อนไขเหล่านี้ ตัวเธอเองก็สามารถคำนวณมันออกมาได้อย่างง่ายดายเช่นกัน!","การอนุมานเชิงตรรกะที่ยอดเยี่ยม การคำนวณทางคณิตศาสตร์ที่เข้มงวด บวกกับหลักฐานต่างๆ มากมาย ทำให้ไอวีน่าไม่รู้เลยว่า ฝั่งไหนกันแน่ที่เป็นฝ่ายถูก","สามัญสำนึกตลอดหลายปีที่ผ่านมา บอกเธอว่าทวีปไม่มีทางที่จะเป็นทรงกลมได้อย่างแน่นอน แต่การอนุมานเชิงตรรกะ กลับเอนเอียงไปทางอีกฝั่งหนึ่งมากกว่า","ก็แผนที่ดวงดาวนั้นมันสวยงามมากจริงๆ ดวงอาทิตย์ตั้งอยู่ใจกลางของหมู่ดาว และดึงดูดดาวเคราะห์ดวงอื่นๆ เอาไว้ ด้วยน้ำหนักที่มหาศาล ทุกอย่างดูเป็นระเบียบและเป็นไปตามกฎเกณฑ์ ราวกับถูกสร้างสรรค์ขึ้นมาอย่างสมบูรณ์แบบ","ไอวีน่าหันไปมองมอนโร เธออยากจะหาใครสักคนมาระบายความสับสนในใจ แต่แล้วเธอก็หยุดพูดไป เพราะเธอรู้ดีว่า มอนโรไม่ได้ตั้งใจฟังที่สอนเลยแม้แต่น้อย และการที่เขาสามารถอดทนรอจนกลับมาถึงที่พักแล้วค่อยด่าได้ ก็ถือว่าเต็มที่แล้ว!","ดาวรุ่งแห่งเวทมนตร์ ผู้นำพาหายนะ ลินน์...","ไอวีน่ากำลังครุ่นคิดถึงเป้าหมายที่สำคัญที่สุดของภารกิจในครั้งนี้ ตั้งแต่ก้าวเข้ามาในเมืองน้ำมันดิน แทบจะทุกวัน เธอจะได้ยินคนพูดถึงชื่อนี้อยู่เสมอ","เรื่องราวระดับตำนานของลินน์ เธอได้ยินจนหูชาไปหมดแล้ว ไม่ว่าจะเป็นสิ่งประดิษฐ์เล่นแร่แปรธาตุที่ทรงพลัง หรือทฤษฎีเวทมนตร์ที่แปลกใหม่ ล้วนมีความเกี่ยวข้องกับดาวรุ่งแห่งเวทมนตร์ผู้นี้ทั้งสิ้น","ในขณะที่ไอวีน่ากำลังครุ่นคิดอยู่นั้น จู่ๆ มอนโรที่อยู่ข้างๆ ก็หยุดนิ่งไป เขาหยิบลูกแก้วคริสตัลสีแดงจางๆ ออกมาจากอกเสื้อ แล้วพูดขึ้นมาด้วยความดีใจ","“ทางศาสนจักรติดต่อพวกเรามาแล้ว! ไอวีน่า ช่วยดูลาดเลาให้ข้าที ข้าจะต้องรายงานสถานการณ์ที่นี่ ให้ท่านสันตะปาปาทราบด้วยตัวเอง...”"]},{"n":462,"t":"ข้ากล้าพนันเลยว่า ไม่เกินหนึ่งเดือน อาณาจักรเวทมนตร์จะต้องพังทลายลงอย่างแน่นอน!","c":["ณ ที่พักของสำนัก ภายในเมืองน้ำมันดิน","มอนโรตรวจสอบภายในห้องอย่างละเอียดอีกครั้ง เพื่อให้แน่ใจว่าไม่ได้ถูกบรรดาพ่อมดแอบติดตั้งเวทมนตร์ดักฟังเอาไว้ จากนั้นเขาก็วางลูกแก้วคริสตัลลงบนโต๊ะ","แสงสีแดงสว่างวาบขึ้นมา ก่อนที่คลื่นพลังแปลกประหลาด จะแผ่กระจายออกไปรอบทิศทางอย่างรวดเร็ว","มอนโรไม่ได้กังวลเลย ว่าความผันผวนของพลังงานนี้ จะทำให้บรรดาพ่อมดรู้สึกสงสัย","แม้ว่าทั่วทั้งเมืองน้ำมันดิน จะถูกติดตั้งเวทมนตร์สำหรับตรวจจับพลังศักดิ์สิทธิ์เอาไว้ แต่ลูกแก้วคริสตัลในมือของเขา แท้จริงแล้วมันก็คืออุปกรณ์เวทมนตร์ชิ้นหนึ่ง ซึ่งนี่ก็เป็นเหตุผลที่ทำให้มันสามารถผ่านการตรวจค้นมาได้","โดยบรรดาพ่อมดต่างก็มีอุปกรณ์เล่นแร่แปรธาตุที่หลากหลายติดตัวเอาไว้มากมาย และสภาเวทมนตร์ก็ไม่สามารถตรวจสอบทีละชิ้นได้อย่างละเอียด ซึ่งคงจะไม่ทำเรื่องที่เสี่ยงต่อการสร้างความไม่พอใจแบบนี้ด้วย","และการที่พ่อมดคนหนึ่งจะใช้เวทมนตร์ภายในห้อง จนทำให้เกิดความผันผวนของพลังเวทมนตร์ขึ้นมาบ้าง มันก็ถือเป็นเรื่องปกติมาก และก็ไม่มีอะไรน่าสงสัยเลย","เพราะยังไงเสีย จำนวนของพ่อมดที่ทำการทดลอง หรือแม้กระทั่งก่อให้เกิดอุบัติเหตุภายในห้องพัก ก็มีอยู่มากมายนับไม่ถ้วน...","แต่ใบหน้าของมอนโรกลับเต็มไปด้วยความรังเกียจและอึดอัดใจ เขาที่เป็นถึงรองผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์ กลับต้องลดตัวลงมาพึ่งพาอุปกรณ์เวทมนตร์อันชั่วร้ายแบบนี้!","นี่มันช่างน่าอัปยศอดสูจริงๆ!","ในขณะที่เขากำลังครุ่นคิดอยู่นั้น แสงสีแดงก็ค่อยๆ จางหายไป ภาพลางๆ ปรากฏขึ้นมาตรงหน้า แม้จะไม่ค่อยชัดเจนนัก แต่ก็พอจะมองออกว่า นี่คือผู้กุมอำนาจสูงสุดของศาสนจักรในปัจจุบัน...องค์สันตะปาปาอัลวิสนั่นเอง!","“ท่านสันตะปาปา!”","มอนโรคุกเข่าลงข้างหนึ่ง พร้อมกับเอ่ยเรียกด้วยความตื่นเต้นและเคารพ","ในฐานะที่เป็นเพียงแค่รองผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์ธรรมดาๆ คนหนึ่ง ในอดีต เขาจะมีโอกาสได้เข้าเฝ้าตัวแทนของพระผู้เป็นเจ้าองค์นี้ ก็เฉพาะในตอนที่เข้าร่วมพิธีกรรมสำคัญๆ เท่านั้น แต่ตอนนี้ เขากลับได้มีโอกาสพูดคุยเป็นการส่วนตัว","“ในช่วงไม่กี่วันที่ผ่านมา พวกเจ้าคงจะไม่ได้ทำให้พวกพ่อมดสงสัยใช่ไหม?”","สันตะปาปาอัลวิสมองดูมอนโรที่กำลังคุกเข่าอยู่ตรงหน้า แล้วเอ่ยถามด้วยน้ำเสียงราบเรียบ","“ข้าคิดว่าไม่ขอรับ”","มอนโรลังเลอยู่ครู่หนึ่ง ในช่วงหนึ่งสัปดาห์ที่ผ่านมา แม้ว่าเขาจะมีปากเสียง และโต้เถียงกับผู้สอนในสถาบันอยู่บ้าง แต่มันก็ยังอยู่ในระดับที่ปกติ","ความจริงแล้ว เนื่องจากทฤษฎีของบรรดาศาตราจารย์เหล่านั้น มันแปลกประหลาดจนเกินไป ดังนั้น แทบจะทุกคาบเรียน จึงมีเสียงสอบถามและข้อสงสัยดังขึ้นมาอยู่เสมอ","โดยจะมีเขาเพิ่มมาอีกสักคน หรือขาดเขาไปสักคน มันก็ไม่ได้มีผลอะไรหรอก","มอนโรคาดเดาว่า ตัวเขาเองน่าจะยังไม่ได้เป็นที่น่าสงสัยในสายตาของบรรดาพ่อมด อย่างน้อยตอนที่เขาออกไปข้างนอก เขาก็ไม่พบร่องรอยของการถูกสะกดรอยตาม หรือถูกจับตามองเลย","“ในเมื่อเป็นเช่นนั้น ภารกิจที่ข้ามอบหมายให้ เจ้าทำสำเร็จไปถึงไหนแล้ว?”","อัลวิสเอ่ยถามขึ้นมาอีกครั้ง","มอนโรเอ่ยตอบกลับไปว่า","“เกี่ยวกับสถานที่คุมขังของท่านประธานผู้พิพากษาโจชัว ข้ายังไม่สามารถสืบทราบมาได้เลยขอรับ บรรดาพ่อมดเหล่านั้นระมัดระวังตัวกันมาก ข้าเดาว่าคงจะมีแค่สมาชิกสภาเพียงหยิบมือ หรือไม่ก็บรรดาประธานสภาเท่านั้น ที่รู้เรื่องนี้”","“ส่วนดาวรุ่งแห่งเวทมนตร์ผู้นั้น การเคลื่อนไหวของเขาก็ไม่แน่ชัดนัก ในช่วงนี้เขาน่าจะยังคงอยู่แต่ในเมืองน้ำมันดิน ข้าก็เพิ่งจะรวบรวมข้อมูลเกี่ยวกับตัวเขามาได้แค่บางส่วนเท่านั้น...”","เมื่อพูดถึงตรงนี้ มอนโรก็รู้สึกละอายใจเป็นอย่างมาก","เป็นเพราะท่านสันตะปาปาไว้วางใจในตัวเขามาก ถึงได้มอบหมายภารกิจที่ยากลำบากขนาดนี้ให้","แต่ผ่านไปเป็นสัปดาห์แล้ว เขากลับยังไม่ได้ข้อมูลสำคัญอะไรมาเลย...","หลังจากที่ลอบเข้ามาในเมืองน้ำมันดินได้สำเร็จ พวกพ่อมดดูเหมือนจะใจกว้างมาก โดยไม่ได้จำกัดอิสรภาพของใครเลย แต่ความจริงแล้ว พวกเขากลับขังทุกคนเอาไว้ในสถาบันเวทมนตร์ เพื่อให้ง่ายต่อการควบคุมต่างหาก","ยิ่งไปกว่านั้น พวกเขายังต้องเสียเวลาไปกับการฟังบรรดาศาตราจารย์เหล่านั้น พ่นเรื่องไร้สาระออกมาอีก","อัลวิสย่อมรู้ดีถึงความเสี่ยงของการแฝงตัวเข้าไปในดงศัตรู ดังนั้น เขาจึงไม่ได้มีทีท่าว่าจะตำหนิมอนโรเลยแม้แต่น้อย โดยเขาเปลี่ยนไปสอบถามเกี่ยวกับสถานการณ์ในปัจจุบันของเมืองน้ำมันดินแทน จากนั้นก็ถอนหายใจ แล้วเอ่ยถามขึ้นมาอีกประโยคหนึ่ง","“เหล่าลูกแกะของพระผู้เป็นเจ้า ที่อยู่ภายใต้การปกครองของพวกพ่อมด ยังเหลือรอดอยู่อีกเท่าไหร่กัน?”","แม้ว่าเขาจะไม่อยากพูดแบบนี้เลยก็ตาม แต่ในแง่หนึ่ง พวกเขาก็ต้องจำใจทอดทิ้งผู้ศรัทธาในเมืองน้ำมันดิน หรือแม้กระทั่งทั้งอาณาจักร ปล่อยให้พวกเขาต้องตกอยู่ภายใต้การปกครองอันชั่วร้ายของพวกพ่อมด","ป่านนี้ ที่นั่นคงจะเต็มไปด้วยซากศพ และเลือดที่ไหลนองเป็นสายน้ำไปแล้วกระมัง...พวกพ่อมดไม่มีทางปล่อยผู้ที่ศรัทธาในพระผู้เป็นเจ้าอย่างแรงกล้าไปอย่างแน่นอน!","มอนโรชะงักไปครู่หนึ่ง เขารู้สึกอึกอัก ไม่รู้จะพูดอย่างไรดี ในช่วงหลายวันที่ผ่านมา เขาได้ออกไปสืบข่าวอย่างลับๆ เพื่อที่จะได้เปิดโปงความเจริญรุ่งเรืองจอมปลอมของเมืองน้ำมันดิน แต่ผลลัพธ์ที่ได้ กลับทำให้เขารู้สึกประหลาดใจเป็นอย่างมาก","พวกพ่อมดไม่เพียงแต่ยินดีที่จะจ่าย ‘ค่าจ้างราคาสูง’ เพื่อแลกกับแรงงานของคนยากจนเหล่านี้เท่านั้น แต่พวกเขายังรับประกันอาหารทั้งสามมื้อให้อีกด้วย แม้กระทั่งคนงานรับจ้างรายวันที่ถูกจ้างมาจากสลัม ก็ยังได้กินขนมปังขาวแสนอร่อย และในบางวัน อาหารกลางวันของพวกเขาก็ยังมีสเต็กปลาอีกด้วย","บวกกับค่าจ้างอีกห้าเหรียญเงินของจักรวรรดิ นี่มันเทียบเท่ากับสวัสดิการของทหารชั้นยอดของจักรวรรดิเลยนะ!","มอนโรเล่าสิ่งที่เขาพบเห็นมาให้ฟังจนหมด ก่อนจะสรุปว่า","“ข้าคิดว่าบรรดาพ่อมดกำลังพยายามใช้เงิน เพื่อกัดกร่อนความศรัทธาที่คนยากจนเหล่านี้มีต่อพระผู้เป็นเจ้าขอรับ!”","“เรื่องนี้น่าจับตามองจริงๆ”","สีหน้าของอัลวิสดูเคร่งเครียดเป็นอย่างมาก","หากพวกพ่อมดปกครองด้วยความโหดร้าย มันก็คงจะรับมือได้ง่ายกว่านี้ แต่การที่พวกเขายอมทุ่มเทไม่อั้น เพื่อเอาอกเอาใจผู้คนแบบนี้ต่างหากล่ะ ที่เป็นการบ่อนทำลายรากฐานของศาสนจักรอย่างแท้จริง!","มอนโรกล่าวเสริม","“แถมความเร็วในการพัฒนาอาวุธของพวกเขาก็ยังเร็วมากด้วย แทบจะทุกวัน จะมีอาวุธรุ่นใหม่ถูกผลิตออกมาเป็นจำนวนมาก”","“ข้ายังได้ยินมาอีกว่า พวกพ่อมดกำลังสร้างสิ่งที่เรียกว่า ‘รถไฟ’ ซึ่งมันสามารถขนส่งสินค้าเกือบพันตัน และกองทัพนับพันคน จากมุมใดมุมหนึ่งของอาณาจักร มายังเมืองน้ำมันดินได้ภายในเวลาเพียงไม่กี่ชั่วโมง!”","เมื่อได้ยินดังนั้น ใบหน้าของอัลวิสก็เปลี่ยนเป็นเคร่งเครียดในทันที เขาตระหนักได้ทันทีว่า สิ่งที่เรียกว่ารถไฟนี้ จะนำพาภัยคุกคามที่ใหญ่หลวงขนาดไหนมาให้","นั่นหมายความว่า พวกพ่อมดจะมีศักยภาพในการทำสงครามที่น่าสะพรึงกลัวเป็นอย่างมาก ขอเพียงแค่พวกเขาต้องการ พวกเขาก็สามารถระดมทหารและเสบียงจากทั่วทั้งอาณาจักร มาสนับสนุนได้อย่างไม่ขาดสาย","ในขณะที่อัลวิสกำลังขมวดคิ้ว และครุ่นคิดหาวิธีรับมืออยู่นั้น จู่ๆ มอนโรก็พูดขึ้นมา","“แต่ในความเห็นของข้า อีกไม่นาน อาณาจักรนี้จะต้องพังทลายลงด้วยตัวของมันเองอย่างแน่นอนขอรับ!”","“โอ้?”","อัลวิสมองไปที่มอนโรด้วยความประหลาดใจ เขารู้สึกแปลกใจมาก ว่าทำไมจู่ๆ มอนโรถึงได้พูดแบบนี้ออกมา","มอนโรอธิบายด้วยความมั่นใจ","“พวกพ่อมดเอาแต่เข่นฆ่าขุนนางในพื้นที่ แต่กลับไม่รู้จักวิธีบริหาร ซึ่งเอาแต่ผลาญทรัพย์สินที่ปล้นมาได้ เพื่อให้คนยากจนในเมืองน้ำมันดินได้กินเนื้อและขนมปังขาว แถมยังจ่ายค่าจ้างให้ในราคาที่สูงลิ่วอีก...”","“แต่พวกเขากลับไม่สนใจเรื่องการเพาะปลูกและการผลิตเลย พวกเขาเอาแต่ละโมบหาเงินเพียงอย่างเดียว นั่นทำให้ตอนนี้พื้นที่ส่วนใหญ่ในเมืองน้ำมันดิน ถูกทิ้งร้างไปหมดแล้ว และข้าก็เชื่อว่าเมืองอื่นๆ ในภาคตะวันออกของอาณาจักร ที่อยู่ภายใต้การปกครองของพวกพ่อมด ก็คงจะไม่ต่างกัน!”","ยิ่งพูด มอนโรก็ยิ่งตื่นเต้นมากขึ้นเรื่อยๆ ส่วนสันตะปาปาอัลวิสก็เริ่มจะเข้าใจความหมายของเขาแล้ว","เพื่อที่จะหาเงิน พวกพ่อมดได้ดึงตัวชาวนาจากไร่นา ให้เข้าไปทำงานในโรงงาน เพื่อผลิตอาวุธและอุปกรณ์เล่นแร่แปรธาตุที่มีมูลค่าสูง การกระทำที่สายตาสั้นเช่นนี้ ย่อมเป็นหนทางสู่ความหายนะอย่างไม่ต้องสงสัย!","“ที่อาณาจักรยังคงรักษาความสงบสุขเอาไว้ได้ ก็เป็นเพราะพวกเขาใช้เงิน เพื่อล่อลวงบรรดาพ่อค้าที่ทรยศต่อจักรวรรดิ ให้ไปซื้อเสบียงอาหารจำนวนมากมาจากจักรวรรดิ ขอเพียงแค่พวกเราตัดเส้นทางการค้านี้ได้ ข้ากล้าพนันเลยว่า ไม่เกินสามเดือน พวกพ่อมดจะต้องพ่ายแพ้ไปเองอย่างแน่นอน!”","มอนโรสรุปด้วยความภาคภูมิใจ","“นี่เป็นข่าวดีที่สุดที่ข้าเคยได้ยินมาเลย!”","คิ้วที่ขมวดแน่นของอัลวิส คลายออกในทันที เขามองมอนโรด้วยสายตาชื่นชม","สมแล้วที่เป็นคนที่กุสตาฟ ผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์เป็นคนแนะนำมา!","ความช่างสังเกต และความสามารถในการวิเคราะห์ที่เฉียบแหลมเช่นนี้ ช่างเกิดมาเพื่อทำงานข่าวกรองโดยแท้ การให้เขาเป็นแค่รองผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์ ถือเป็นการดูถูกความสามารถของเขาเกินไปแล้ว!","แม้จะเชื่อมั่นในการตัดสินใจของมอนโรมาก แต่อัลวิสก็ส่ายหน้า พร้อมกับชี้ให้เห็นถึงข้อบกพร่องของแผนการนี้","“สามเดือนมันนานเกินไป! ข้าเกรงว่าหากพวกพ่อมดรู้ตัว พวกเขาอาจจะตัดสินใจทุ่มสุดตัว โดยไม่สนใจความอดอยากของอาณาจักร และหันมายกทัพบุกโจมตีจักรวรรดิแทน!”","เขาไม่อยากจะคิดเลยว่า ในอีกสามเดือนข้างหน้า พวกพ่อมดจะมีอาวุธยุทโธปกรณ์ที่น่าสะพรึงกลัวขนาดไหน...","อาณาจักรนี้มีประชากรมากถึงสามล้านคน ต่อให้จะคัดเลือกทหารในอัตราสิบห้าต่อหนึ่ง พวกเขาก็สามารถระดมกองทัพนับแสนคนได้แล้ว ซึ่งเพียงแค่ใช้เวลาฝึกฝนเพียงหนึ่งสัปดาห์ ก็สามารถใช้งานปืนคาบศิลาได้อย่างคล่องแคล่ว และกลายเป็นทหารที่มีคุณสมบัติเพียงพอ ที่จะคุกคามกองทัพทัณฑ์ศักดิ์สิทธิ์ที่สวมเกราะเต็มยศบนสนามรบได้แล้ว","ยิ่งไม่ต้องพูดถึงอุปกรณ์เล่นแร่แปรธาตุที่ทรงพลังมากมายของพวกพ่อมด อย่างเช่น เครื่องบิน เรือเหาะ รถหุ้มเกราะเล่นแร่แปรธาตุ ปืนใหญ่สายฟ้า (ปืนใหญ่แม่เหล็กไฟฟ้า) เป็นต้น ต่อให้จะรวบรวมกองกำลังทั้งหมดของจักรวรรดิมา ก็ใช่ว่าจะสามารถเอาชนะสงครามครั้งนี้ได้ง่ายๆ","“ท่านหมายความว่าอย่างไรหรือขอรับ?”","มอนโรเอ่ยถามด้วยความลังเล","“พวกเราควรจะเร่งกระบวนการนี้ให้เร็วขึ้นจะดีกว่า!”","อัลวิสพูดด้วยน้ำเสียงหนักแน่น ราวกับว่าเขามีแผนการอยู่ในใจแล้ว แววตาของเขาเป็นประกายเจิดจ้า","“ข้าคิดว่าเจ้าคงจะสังเกตเห็นแล้ว ว่าการกระทำของพวกพ่อมดในอาณาจักร ได้สร้างความไม่พอใจให้กับคนบางกลุ่มแล้ว”","มอนโรครุ่นคิดอยู่ครู่หนึ่ง ก่อนจะนึกขึ้นได้ทันที ว่าคนที่ท่านสันตะปาปาหมายถึง ก็คือบรรดาขุนนางในอาณาจักรนั่นเอง","“แม้ว่าพวกเขาจะทรยศต่อจักรวรรดิและศาสนจักร แต่ข้าคิดว่าคงจะมีบางคนที่ถูกพวกพ่อมดบังคับ จนต้องจำใจเลือกเดินในเส้นทางที่ผิด พวกเราควรจะให้โอกาสพวกเขา ได้พิสูจน์ตัวเองอีกครั้ง...”","แววตาของอัลวิสฉายแววเย็นชา ก่อนจะกล่าวต่อไป","“เรื่องนี้ ข้าจะส่งคนอื่นไปจัดการเอง เจ้าแค่คอยสืบข่าวอยู่ในเมืองน้ำมันดินต่อไป และคอยให้ความร่วมมืออยู่ห่างๆ ในขณะที่ต้องรักษาความปลอดภัยของตัวเองเอาไว้ให้ดี ก็พอแล้ว!”","“รับทราบขอรับ นายท่าน!”","มอนโรพยักหน้ารับคำ","เขารู้ดีว่า ศาสนจักรไม่มีทางส่งแค่เขาและไอวีน่า ให้ลอบเข้ามาในอาณาจักรเพียงสองคนแน่ ความจริงแล้ว เท่าที่เขารู้ สายลับที่ถูกพวกพ่อมดจับได้ ก็มีมากกว่าสามร้อยคนแล้ว และคนที่ยังสามารถซ่อนตัวอยู่ในเงามืดได้ ล้วนเป็นยอดฝีมือในหมู่ยอดฝีมือทั้งสิ้น","“หากสามารถทำให้เกิดความวุ่นวายในอาณาจักรได้สำเร็จ เจ้าก็คือผู้ที่มีความดีความชอบเป็นอันดับแรก เมื่อพวกเราสามารถกำจัดพวกนอกรีตเหล่านี้ได้ ข้าจะเป็นคนทำพิธีศีลจุ่มให้เจ้าด้วยตัวเอง!”","อัลวิสกล่าวชื่นชม","มอนโรตื่นเต้นจนพูดไม่ออก เพราะในอดีต มีเพียงแค่สมาชิกระดับสูงของศาสนจักรเท่านั้น ที่จะมีสิทธิ์ได้รับศีลจุ่มจากองค์สันตะปาปา ซึ่งนี่ก็เปรียบเสมือนใบรับประกัน ที่จะปูทางไปสู่จุดสูงสุดของอำนาจ!","เมื่อมีแผนการบ่อนทำลายอาณาจักรเวทมนตร์แล้ว ความกังวลที่สะสมมานานหลายเดือนของอัลวิส ก็ลดลงไปได้มาก เขาจึงกล่าวต่อไปว่า","“เจ้ามีเรื่องอะไรจะรายงานอีกไหม?”","มอนโรลังเลอยู่ครู่หนึ่ง ก่อนจะเล่าทฤษฎีแปลกประหลาดมากมาย ที่เขาได้ยินมาจากในห้องเรียนตลอดหลายวันที่ผ่านมาให้ฟัง","ตั้งแต่เรขาคณิต กฎการเคลื่อนที่ของดวงดาว ไปจนถึงทฤษฎีดวงดาว...","อัลวิสฟังไปได้ครึ่งทาง ก็ยกมือขึ้น เป็นการบอกให้มอนโรหยุดพูด ก่อนจะเอ่ยอธิบาย","“เห็นได้ชัดว่า พวกเขากำลังพยายามบิดเบือนคำสอนในพระคัมภีร์ และข้าก็คิดว่ากุสตาฟคงจะเคยเตือนเจ้าแล้ว ว่าหนังสือเวทมนตร์ทุกเล่ม ล้วนแฝงไปด้วยพลังอันชั่วร้ายของปีศาจ ซึ่งมีพลังในการล่อลวงจิตใจสูงมาก การไม่ฟัง ไม่รับรู้ และไม่สนใจ คือวิธีที่ดีที่สุดในการต่อต้านการถูกครอบงำ!”","“ข้าเข้าใจแล้วขอรับ ขอบคุณสำหรับคำเตือนขอรับ ท่านสันตะปาปา!”","มอนโรเห็นด้วยอย่างยิ่ง คำพูดของพวกพ่อมดนั้น ช่างมีพลังในการปลุกปั่นจิตใจได้ดีเยี่ยมจริงๆ","ยกตัวอย่างเช่น ทฤษฎีดวงดาว ซึ่งเป็นสิ่งที่ขัดต่อสามัญสำนึกอย่างรุนแรง แต่พวกเขากลับสามารถแต่งเรื่องทฤษฎีมากมายที่ฟังดูมีเหตุผล เพื่อใช้เป็นหลักฐานหลอกลวงผู้คนนับหมื่นได้ แม้กระทั่งตัวเขาเอง เมื่อได้ฟังแล้ว ก็ยังอดรู้สึกไม่ได้ว่ามันมีเหตุผลอยู่บ้าง","จนถึงตอนนี้ มอนโรก็เพิ่งจะตระหนักได้ ว่าเขาถูกความรู้ของปีศาจทำให้แปดเปื้อนไปแล้ว และวิญญาณของเขาก็ไม่บริสุทธิ์อีกต่อไป!","บางทีนี่อาจจะเป็นเหตุผล ที่ท่านสันตะปาปาต้องการจะทำพิธีศีลจุ่มให้เขาด้วยตัวเอง","เมื่อตระหนักได้ถึงจุดนี้ มอนโรก็รู้สึกซาบซึ้งใจเป็นอย่างมาก แต่ไม่นาน เขาก็นึกถึงไอวีน่า เพื่อนร่วมทางของเขาขึ้นมาได้!","ความแปดเปื้อนที่เธอได้รับ น่าจะรุนแรงกว่าเขามาก เพราะในช่วงสองวันที่ผ่านมา มอนโรพบว่า เด็กสาวถึงกับเริ่มจดบันทึกในระหว่างที่เรียนแล้ว!","นี่เป็นสัญญาณที่อันตรายมาก และทำให้เขารู้สึกกังวลใจเป็นอย่างยิ่ง!","แต่ในขณะที่มอนโรกำลังจะเอ่ยปากขอคำปรึกษา ภาพลางๆ ของท่านสันตะปาปา ก็จู่ๆ ก็เกิดอาการสั่นไหว และแสงสีแดงที่เปล่งออกมาจากลูกแก้วคริสตัล ก็เริ่มกะพริบอย่างไม่เป็นจังหวะ ก่อนจะดับวูบลงไปดื้อๆ","มอนโรสะดุ้งตกใจ รีบหันไปมองรอบๆ ตัว ด้วยคิดว่าพวกพ่อมดอาจจะค้นพบเขา และเข้ามาขัดจังหวะเวทมนตร์ของเขาเข้าแล้ว","โชคดีที่มอนโรนึกขึ้นได้ทัน ว่าบิชอปผู้รับผิดชอบดูแลอุปกรณ์เวทมนตร์อันตรายชิ้นนี้ เคยเตือนเขาเอาไว้ว่า ‘สัญญาณ’ ของมันไม่ค่อยดีนัก และการสื่อสารในแต่ละครั้ง ก็ไม่ควรจะใช้เวลานานเกินไป ไม่อย่างนั้น สัญญาณก็อาจจะถูกตัดขาดได้...","“อุปกรณ์เวทมนตร์บ้า!”","มอนโรสบถออกมาด้วยความโมโห แต่เขาก็ทำอะไรไม่ได้","เขาไม่ใช่พ่อมด และก็ไม่รู้จักการเล่นแร่แปรธาตุ เขาจึงทำได้เพียงแค่รอให้มันชาร์จพลังงานจนเต็มก่อน ถึงจะสามารถเชื่อมต่อได้อีกครั้ง","สิ่งเดียวที่น่าโชคดีก็คือ เรื่องสำคัญๆ ต่างก็คุยกันจบไปหมดแล้ว!","มอนโรจัดการกับอารมณ์ของตัวเองอย่างรวดเร็ว เขาเก็บลูกแก้วคริสตัลเอาไว้ แล้วก็ผลักประตูเดินออกไป","ไอวีน่ากำลังยืนพิงกำแพงห้องนั่งเล่น มือขวาจับด้ามดาบเอาไว้แน่น เพื่อป้องกันไม่ให้ใครบุกเข้ามาขัดจังหวะการสนทนา เมื่อเห็นมอนโรเดินออกมาจากห้อง เธอก็เอ่ยถามด้วยความสงสัย","“ทุกอย่างราบรื่นดีใช่ไหม มอนโร?”","“ราบรื่นดีมาก ท่านสันตะปาปายอมรับในความสามารถและแผนการของข้าแล้ว!”","มอนโรพูดด้วยความภาคภูมิใจ จากนั้น สายตาของเขาก็กวาดมองไปที่ตัวของไอวีน่า และเขาก็สังเกตเห็นสมุดบันทึกเล่มหนา ที่ห้อยอยู่ตรงเอวของเด็กสาวทันที","ตรงนั้นเคยเป็นที่สำหรับห้อยพระคัมภีร์ แต่ตอนนี้ มันกลับถูกแทนที่ด้วยสมุดบันทึก ที่เต็มไปด้วยความรู้ของพวกพ่อมด","มอนโรพูดด้วยความไม่พอใจ","“ช่วงนี้ ดูเหมือนเจ้าจะสนใจความรู้ของพวกพ่อมดมากเลยนะ ไอวีน่า?”","“เป็นเพราะท่านแสดงออกชัดเจนเกินไปต่างหาก มอนโร!”","สีหน้าของไอวีน่าไม่เปลี่ยน เธอกลับเป็นฝ่ายเตือนเขาแทน","“พวกพ่อมดมีความกระหายในความรู้สูงมาก คนที่ไม่ยอมจดบันทึกในเวลาเรียนอย่างท่าน ถือเป็นชนกลุ่มน้อย และมันจะดึงดูดความสนใจของพวกเขาได้ง่ายมาก!”","“นั่นเป็นความสะเพร่าของข้าเองจริงๆ”","สีหน้าของมอนโรเปลี่ยนไป น้ำเสียงของเขาอ่อนลงในทันที","“เจ้าเองก็ต้องระมัดระวังตัวให้ดีด้วย ความรู้ของปีศาจ มีพลังในการล่อลวงจิตใจ และการศึกษาเรื่องพวกนี้อย่างลึกซึ้ง ก็อาจจะบิดเบือนการรับรู้ของพวกเราได้...”","ไอวีน่าลังเลอยู่ครู่หนึ่ง ก่อนจะพยักหน้ารับ","“หนึ่งเดือน ขอแค่พวกเราทนไปอีกหนึ่งเดือน ก็พอแล้ว!”","มอนโรพูดอย่างมั่นใจ","“ตามแผนการของข้า บวกกับความช่วยเหลือจากคนเหล่านั้น อย่างมากที่สุดเพียงแค่หนึ่งเดือน อาณาจักรเวทมนตร์ที่ยิ่งใหญ่ ก็จะต้องล่มสลายลงด้วยตัวของมันเองอย่างแน่นอน!”","หนึ่งเดือนงั้นรึ?","ไอวีน่านึกถึงสิ่งที่เธอได้พบเห็นมาตลอดหลายวันที่ผ่านมา พลางถอนหายใจออกมาอย่างเงียบๆ","คนยากจนในอาณาจักร คงจะต้องเผชิญกับความยากลำบากอีกแล้วสินะ"]},{"n":463,"t":"เตาปฏิกรณ์นิวเคลียร์ฟิวชัน","c":["ช่วงบ่าย ณ เมืองน้ำมันดิน","ภายใต้คำสั่งของสภาเวทมนตร์ นักเล่นแร่แปรธาตุที่มีชื่อเสียงทุกคน ต่างก็มารวมตัวกันที่ห้องโถงด้านหน้าของคฤหาสน์ดยุกคนก่อน","พวกเขาจะต้องวาดวงแหวนเวทมนตร์เล่นแร่แปรธาตุ ที่ใหญ่ที่สุดในประวัติศาสตร์ขึ้นมา!","โดยขอบเขตของมัน ก็คือทั่วทั้งคฤหาสน์ ซึ่งประกอบไปด้วยอักษรรูนทั้งหมดหนึ่งล้านเจ็ดแสนสองหมื่นตัว!","ก่อนหน้านี้ บรรดาพ่อมดธาตุได้ร่ายเวทมนตร์รื้อถอนของตกแต่ง และเฟอร์นิเจอร์ทั้งหมดออกไปแล้ว อีกทั้งยังขุดเจาะลงไปใต้ดิน เพื่อเพิ่มพื้นที่ให้กว้างขวางเพียงพอ","แต่เพื่อรักษาความลับ บรรดาประธานสภาจึงไม่ได้เปิดเผย ว่านี่คือพิธีกรรมเลื่อนขั้นสู่ระดับตำนาน โดยพวกเขาบอกเพียงแค่ว่า ท่านปรมาจารย์ลินน์ได้ค้นคว้าเวทมนตร์บทใหม่ขึ้นมาได้สำเร็จ และที่นี่ก็คือสถานที่สำหรับทดลองเวทมนตร์!","“เวทมนตร์แบบไหนกันนะ ถึงต้องใช้อักษรรูนมากมายขนาดนี้?”","ทิคถือแบบแปลนในส่วนที่ตัวเองรับผิดชอบเอาไว้ในมือ เขาพึมพำกับตัวเองเบาๆ ในขณะที่กำลังวาดมันลงบนพื้น","เขาสามารถมองออกได้ว่า ส่วนที่เขารับผิดชอบนั้น ดูเหมือนจะเป็นวงแหวนเวทมนตร์ที่ใช้สำหรับนำทางพลังเวทมนตร์","โดยปกติแล้ว สิ่งนี้มักจะถูกนำมาใช้เพื่อสะสมพลัง สำหรับร่ายเวทมนตร์บางอย่าง แต่การจัดเตรียมที่ยิ่งใหญ่ขนาดนี้ ช่างทำให้ผู้คนอดที่จะจินตนาการไปไกลไม่ได้จริงๆ","เช่นเดียวกับทิค นักเล่นแร่แปรธาตุกว่าห้าร้อยคนที่เข้าร่วมในภารกิจนี้ ต่างก็อดไม่ได้ที่จะคาดเดา ว่าวงแหวนเวทมนตร์ที่ใหญ่โตขนาดนี้ ถูกสร้างขึ้นมาเพื่อทำอะไรกันแน่","“ข้าได้ยินมาว่า ท่านปรมาจารย์ลินน์กำลังเตรียมที่จะสร้างดวงอาทิตย์ดวงใหม่ขึ้นมาบนพื้นดินล่ะ!”","นักเล่นแร่แปรธาตุคนหนึ่ง ลดเสียงลงแล้วเอ่ยขึ้นมา","“ดวงอาทิตย์งั้นรึ? ชาร์ลี มุกตลกของเจ้านี่มันไม่ขำเอาซะเลยนะ...”","แม่มดที่อยู่ข้างๆ หัวเราะเยาะ พร้อมกับส่ายหน้า","ดวงอาทิตย์คืออะไร?","มันคือดาวฤกษ์ที่แขวนอยู่เหนือหัวของพวกเขา และเป็นแหล่งกำเนิดของแสงสว่าง ตามการคาดเดาของบรรดานักพยากรณ์ มวลของดวงอาทิตย์นั้น อย่างน้อยก็มากกว่ามวลของดวงดาวที่พวกเขาเหยียบอยู่ถึงหลายล้านเท่า เพียงแค่มันขยับเขยื้อนเพียงเล็กน้อย ทวีปใต้เท้าของพวกเขาก็คงจะพินาศไปแล้ว นั่นสิถึงจะเรียกว่าวันสิ้นโลกของแท้!","“ข้าไม่ได้พูดเล่นนะ...”","พ่อมดที่ชื่อชาร์ลี รู้สึกอับจนหนทาง นี่คือข้อมูลลับสุดยอดที่เขาแอบไปสืบมาได้เชียวนะ!","“เลิกคุยเล่นกันได้แล้ว! ตั้งใจทำงานกันหน่อย วงแหวนเวทมนตร์เล่นแร่แปรธาตุนี้มีความสำคัญมาก พวกเราจะต้องทำให้เสร็จโดยเร็วที่สุด ห้ามผิดพลาดแม้แต่สัญลักษณ์เดียวเด็ดขาด!”","วิกโตริโอออกคำสั่งด้วยน้ำเสียงเคร่งขรึม","พิธีกรรมเลื่อนขั้นในครั้งนี้ เกี่ยวพันถึงชีวิตและความเป็นความตายของเขา รวมไปถึงความเป็นไปได้ในการก้าวขึ้นสู่ระดับตำนาน วิกโตริโอจึงให้ความสำคัญกับมันมาก นอกจากเขาจะรับผิดชอบในการจัดวางวงแหวนเวทมนตร์ที่เป็นแกนกลางแล้ว เมื่อไหร่ที่เขาพอมีเวลาว่าง เขาก็จะไปตรวจสอบการจัดวางอักษรรูนแต่ละตัวด้วยตัวเอง","ภายใต้การจับตามองของท่านประธานสภาด้วยตัวเอง ย่อมไม่มีใครกล้าที่จะอู้งาน ทิคและคนอื่นๆ ต่างก็ก้มหน้าก้มตาทำงานอย่างหนัก โดยมุ่งความสนใจไปที่งานในมือของตัวเอง","เมื่อลินน์ก้าวเข้ามาในคฤหาสน์ สิ่งที่เขาเห็น ก็คือภาพของผู้คนนับร้อยที่กำลังรวมตัวกันวาดแบบแปลน...","“ความคืบหน้าเป็นยังไงบ้างขอรับ ท่านวิกโตริโอ?”","ลินน์เอ่ยถามเสียงเบา","“ก็ถือว่าไม่เลว ปัญหาท้าทายส่วนใหญ่ได้รับการแก้ไขแล้ว โดยข้าใช้โครงสร้างแบบซ้อนทับในการสร้างวงแหวนเวทมนตร์เล่นแร่แปรธาตุนี้ ดังนั้น แม้ว่าวงแหวนเวทมนตร์ในพื้นที่ใดพื้นที่หนึ่งจะเกิดข้อผิดพลาดขึ้นมาหนึ่งหรือสองจุด มันก็จะไม่ส่งผลกระทบต่อภาพรวม...”","วิกโตริโอพาลินน์เดินดูรอบๆ คฤหาสน์ พลางอธิบายเกี่ยวกับการจัดวางวงแหวนเวทมนตร์ และแผนสำรองที่เตรียมเอาไว้อย่างละเอียด","ลินน์พยักหน้าครั้งแล้วครั้งเล่า ความรอบคอบของวิกโตริโอทำให้เขารู้สึกพึงพอใจเป็นอย่างมาก หากเตาปฏิกรณ์นิวเคลียร์ฟิวชันเกิดสูญเสียการควบคุมขึ้นมา นั่นไม่ใช่เรื่องล้อเล่นเลยนะ!","ต่อให้จะเตรียมการเอาไว้มากแค่ไหน ก็ไม่อาจพูดได้ว่ามันปลอดภัยร้อยเปอร์เซ็นต์!","“สรุปก็คือ พวกเราทำดีที่สุดเท่าที่ความสามารถของพวกเราจะอำนวยแล้วล่ะ”","วิกโตริโอถอนหายใจ แล้วเอ่ยออกมา","ในครั้งนี้ ถือว่าเขาได้นำความรู้ทั้งหมดที่เรียนรู้มาทั้งชีวิต ออกมาใช้จนหมดเกลี้ยง อีกทั้งยังรวบรวมกองกำลังชั้นยอดของสภาเวทมนตร์เอาไว้ทั้งหมดแล้ว!","หากขนาดนี้ยังไม่สำเร็จ และวิญญาณของเขาต้องถูกทำลายลงไปภายใต้พลังงานที่บ้าคลั่งในพิธีกรรมเลื่อนขั้น วิกโตริโอก็คิดว่า มันก็คงจะไม่ใช่เรื่องน่าเสียดายอะไรแล้ว!","“สบายใจเถอะขอรับ ขอเพียงแค่ตรวจสอบให้แน่ใจว่าได้จัดการทุกอย่างเรียบร้อยแล้ว ข้าคิดว่าความสำเร็จ ก็คงจะไม่ใช่ปัญหา!”","ลินน์พูดพลางยื่นแบบแปลนเตาปฏิกรณ์นิวเคลียร์ฟิวชันไปให้","การสร้าง ‘ดวงอาทิตย์จำลอง’ ขึ้นมาบนพื้นดิน เป็นสิ่งที่เหลือเชื่ออย่างมากสำหรับพวกพ่อมด พวกเขาคงจะคิดว่ามันเป็นเรื่องที่ยากลำบากอย่างถึงที่สุด แต่สำหรับลินน์แล้ว การสร้างเตาปฏิกรณ์นิวเคลียร์ฟิวชันนั้น เป็นเรื่องที่ธรรมดามาก จะมีก็แค่การย่อส่วนเท่านั้น ที่พอจะมีความยากทางเทคนิคอยู่บ้าง","วิกโตริโอรับแบบแปลนมา ราวกับว่ามันเป็นของล้ำค่า เขาพิจารณาดูมันอย่างละเอียด","การสร้างดวงอาทิตย์ นี่มันคือผลงานชิ้นเอกที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์การเล่นแร่แปรธาตุเลยนะ!","ส่วนลินน์ก็กำลังครุ่นคิดว่า จะใช้เวทมนตร์เพื่อแก้ปัญหาทางด้านวัสดุศาสตร์ได้อย่างไร","หากระเบิดปรมาณูคือการทำลายธาตุยูเรเนียม ทำให้ธาตุที่มีมวลมากแตกตัวออกเป็นธาตุที่มีมวลน้อยกว่าหลายๆ ตัว นิวเคลียร์ฟิวชันก็จะตรงกันข้ามกัน มันคือการรวมธาตุที่มีมวลน้อยกว่าสองตัว ให้กลายเป็นธาตุที่มีมวลมากขึ้น!","แน่นอนว่า หลักการในการสร้างพลังงานของพวกมันนั้นเหมือนกัน นั่นก็คือในระหว่างกระบวนการแตกตัวหรือการรวมตัวกัน ย่อมหลีกเลี่ยงไม่ได้ที่จะเกิดการสูญเสียมวล และมวลที่สูญเสียไปเหล่านี้ ก็คือแหล่งที่มาของพลังงานอันน่าสะพรึงกลัวของระเบิดนิวเคลียร์...","ซึ่งก็มีปัญหาทางเทคนิคมากมาย ในการสร้างเตาปฏิกรณ์นิวเคลียร์ แต่ปัญหาที่ร้ายแรงจริงๆ มีอยู่สองประการ!","ประการแรกก็คือ จะทำอย่างไรให้วัสดุฟิวชันมีอุณหภูมิที่สูงพอ","หากต้องการจะทำให้เกิดปฏิกิริยานิวเคลียร์ฟิวชัน ก็จำเป็นจะต้องใช้แรงนิวเคลียร์อย่างเข้ม ซึ่งเป็นหนึ่งในสี่แรงพื้นฐาน เพื่อให้นิวเคลียสของอะตอมสองตัว สามารถเกาะติดกันแน่น แทนที่จะถูกผลักออกจากกันด้วยแรงผลักทางไฟฟ้า","แต่แรงนิวเคลียร์อย่างเข้มนี้ มีระยะการทำงานที่สั้นมาก นิวเคลียสของอะตอมทั้งสองตัว จึงจำเป็นต้องอยู่ใกล้กันมาก","ระยะห่างนี้ จะต้องรักษาระดับเอาไว้ที่ 10 ยกกำลังลบ 15 เมตร หรือก็คือ 0.000001 นาโนเมตร","นี่คือตัวเลขที่น่าสิ้นหวังอย่างไม่ต้องสงสัย!","แต่มันก็ไม่ใช่ว่าจะไม่มีวิธีเลย เพราะวิธีการนั้นก็คืออุณหภูมิสูงและความดันสูง!","เมื่อพิจารณาจากความกดอากาศของดาวเคราะห์ใต้เท้าดวงนี้ จำเป็นจะต้องเพิ่มอุณหภูมิให้สูงกว่าหนึ่งร้อยล้านองศาเซลเซียส จึงจะสามารถบรรลุเป้าหมายนี้ได้ และสิ่งที่ตามมาก็คือปัญหาประการที่สอง...จะใช้ภาชนะอะไร ในการบรรจุวัสดุฟิวชันที่มีอุณหภูมิสูงถึงหลายร้อยล้านองศาเซลเซียส!","หลังจากที่มีการเสนอสมการความเท่าเทียมกันของมวล-พลังงาน ปัญหาทั้งสองประการนี้ ก็สร้างความปวดหัวให้กับมนุษยชาติมานานกว่าร้อยปี","โชคดีที่ในฐานข้อมูล 071 มีข้อมูลและแบบแปลนที่เกี่ยวข้องอยู่","หลังจากที่ผ่านการพิจารณาอย่างถี่ถ้วน ลินน์ก็ตั้งใจที่จะใช้วิธีการโฟกัสเลเซอร์ เพื่อสร้างอุณหภูมิสูงหลายร้อยล้านองศาเซลเซียสขึ้นมา พอดีเลยที่ก่อนหน้านี้ พวกเขาได้พัฒนาเวทมนตร์เลเซอร์ขึ้นมาแล้ว โดยขอเพียงแค่มีพลังเวทมนตร์ที่เพียงพอ ก็คงจะสามารถบรรลุเป้าหมายนี้ได้อย่างราบรื่น","ปัญหาที่เหลือ ก็คือจะควบคุมพลังนี้ได้อย่างไร!","เมื่อผนวกเข้ากับความสามารถของบรรดาพ่อมด ลินน์คิดว่าพวกเขาสามารถลองใช้สนามแม่เหล็กเพื่อกักเก็บนิวเคลียส หรือไม่ก็ใช้แรงโน้มถ่วง!","ส่วนจะใช้วิธีไหนนั้น...","ในทางทฤษฎี การกักเก็บด้วยแรงโน้มถ่วงนั้น น่าเชื่อถือที่สุด ตัวอย่างเช่น สาเหตุที่ดาวฤกษ์สามารถรักษารูปร่างเอาไว้ได้ ภายใต้ปฏิกิริยาฟิวชันที่รุนแรง ก็เป็นเพราะผลกระทบของแรงโน้มถ่วง ได้สร้างความสมดุลกับปฏิกิริยาฟิวชันที่อยู่ภายในนั่นเอง","และหากพวกเขาสามารถจำลองสิ่งนี้ขึ้นมาได้ พวกเขาก็จะสามารถจำลองดวงอาทิตย์จำลองขนาดเล็กขึ้นมาได้อย่างแท้จริง!","แต่การจะสร้างแหล่งกำเนิดแรงโน้มถ่วงขนาดใหญ่นั้น ไม่ใช่เรื่องง่ายเลย เขาเคยไปสอบถามแฮร์รอฟมาแล้ว และผลลัพธ์ที่ได้ก็คือการปฏิเสธ ยิ่งไปกว่านั้น ขอบเขตอิทธิพลของแรงโน้มถ่วงก็ยังกว้างมากด้วย เมื่อถึงเวลานั้น อย่าว่าแต่คฤหาสน์แห่งนี้เลย ข้าเกรงว่าแม้แต่ทั้งเมือง ก็อาจจะถูกดึงเข้าไปด้วย","ดังนั้น ลินน์จึงทำได้เพียงแค่ถอยกลับมาหนึ่งก้าว และใช้การกักเก็บด้วยแม่เหล็กไฟฟ้า เพื่อแก้ปัญหานี้","“ใช้สนามแม่เหล็กที่มองไม่เห็น เพื่อกักเก็บพลังงานที่แข็งแกร่งงั้นรึ? ช่างเป็นแนวคิดที่ยอดเยี่ยมจริงๆ!”","วิกโตริโอบังเอิญอ่านมาถึงตรงนี้พอดี เขาจึงกล่าวชื่นชมแนวคิดอันยอดเยี่ยมของลินน์","เขาสามารถมองออก ว่าแบบแปลนนี้มีความสมบูรณ์แบบมาก ซึ่งนี่ก็เป็นข้อพิสูจน์แล้ว ว่าแผนการสร้างดวงอาทิตย์เทียมของลินน์ ไม่ใช่แค่การเพ้อฝันที่ไร้เหตุผล แต่มันมีทฤษฎีเวทมนตร์ที่เข้มงวดเป็นรากฐานรองรับอยู่","เรื่องนี้ทำให้วิกโตริโอรู้สึกโล่งใจขึ้นมาก...","“จริงสิ ช่วงนี้ทางศาสนจักรเป็นอย่างไรบ้าง? มีสถานการณ์ใหม่อะไรหรือไม่?”","วิกโตริโอคืนแบบแปลนให้ พร้อมกับเอ่ยถามขึ้น","หลังจากที่พวกเขาสามารถเอาชนะกองกำลังปราบปรามมาได้ มันก็ผ่านไประยะหนึ่งแล้ว โดยอีกฝ่ายอาจจะหวาดกลัวต่อการข่มขู่จากเวทมนตร์ระเบิดนิวเคลียร์ จนไม่กล้ายกทัพมาบุกโจมตีก็เป็นได้ แต่เขาก็รู้ดีว่า ทางศาสนจักรจะไม่มีทางปล่อยให้พวกเขาพัฒนาต่อไปเรื่อยๆ อย่างแน่นอน","ลินน์นึกย้อนไปถึงข่าวกรองที่เขาได้รับมาเมื่อวาน ก่อนจะอธิบาย","“ตามรายงานของสายลับ ในช่วงไม่กี่เดือนที่ผ่านมา เกิดภัยพิบัติจากเทพนอกรีตขึ้นถึงสามครั้งภายในจักรวรรดิ บวกกับผลกระทบจากการไล่ล่าพ่อมด ตอนนี้ภายในจักรวรรดิจึงไม่ค่อยจะสงบสุขนัก...”","“นี่เป็นข่าวดีทีเดียว!”","วิกโตริโอเลิกคิ้วขึ้น ตอนนี้สิ่งที่พวกเขากังวลมากที่สุด ก็คือการที่ศาสนจักรจะตัดสินใจทุ่มสุดตัว และระดมกองกำลังทั้งหมดมาสู้ตายกับพวกเขา","การก่อสร้างเตาปฏิกรณ์นิวเคลียร์ ไม่ว่าจะเร็วแค่ไหน ก็ต้องใช้เวลาสองถึงสามเดือน...ส่วนเรื่องการสกัดน้ำมวลหนัก ก็ต้องใช้เวลาประมาณสองเดือนเช่นกัน!","หากไม่มีพลังในระดับเดียวกัน เพื่อรับมือกับร่างจุติของเทพจอมปลอมนั่น พวกเขาก็ทำได้เพียงแค่ต้องใช้เวทมนตร์ระเบิดนิวเคลียร์ ซึ่งเป็นเวทมนตร์ประเภทที่สร้างความเสียหายให้กับศัตรูหนึ่งหมื่น แต่ตัวเองต้องสูญเสียไปแปดพัน","คลื่นพลังงานที่รุนแรง จะไม่แยกแยะระหว่างมิตรและศัตรู ครั้งที่แล้ว พื้นที่ที่ถูกทำลายคือดินแดนที่อยู่ห่างจากเมืองออกไปหลายสิบกิโลเมตร แต่ครั้งนี้ อาจจะเป็นเมืองน้ำมันดิน หรือไม่ก็เมืองหลวงเลยก็ได้","ลินน์ยิ้มออกมา ดูเหมือนว่าการที่พวกเขาจงใจปล่อยข่าวลือเรื่องความพ่ายแพ้ของกองกำลังปราบปราม จะทำให้ผู้คนที่เคยกบดานอยู่ในเงามืด และไม่เคยสงบเสงี่ยม ยอมเผยตัวออกมาจนหมดแล้ว","แม้ว่าเรื่องนี้ จะทำให้เกิดการไล่ล่าพ่อมดขนานใหญ่ จนส่งผลให้มีพ่อมดแม่มดหลายคนต้องตายอย่างน่าเวทนา ซึ่งทำให้เขารู้สึกเสียดายอยู่บ้าง แต่ตอนนี้ทางศาสนจักรเองก็กำลังวุ่นวายอยู่กับการจัดการปัญหาเหล่านี้ ซึ่งมันน่าจะช่วยซื้อเวลาให้กับพวกเขาได้บ้าง","ส่วนพวกเทพนอกรีตและบรรดาสาวกของพวกมัน ลินน์ก็ไม่ได้มีความรู้สึกดีๆ ให้เลยแม้แต่น้อย เพราะพ่อมดจิตวิญญาณที่เก่าแก่ที่สุดเหล่านี้ ล้วนถูกพลังแห่งความศรัทธากัดกิน จนสูญเสียสติสัมปชัญญะไปหมดแล้ว หากศาสนจักรสามารถกำจัดพวกมันไปได้ มันก็เป็นเรื่องดีที่สุดแล้ว!","ด้วยวิธีนี้ ในอนาคตเมื่อพวกเขาเข้าไปยึด พวกเขาก็จะได้ไม่ต้องเสียเวลา ไปจัดการกับปัญหาที่น่ารำคาญเหล่านี้อีก","ในขณะที่ทั้งสองกำลังปรึกษาหารือกันอยู่นั้น ผู้ติดตามคนหนึ่งก็เดินถือม้วนเอกสารเข้ามาจากนอกประตู พร้อมกับเอ่ยขัดจังหวะด้วยความเคารพ","“ท่านประธานสภา ท่านปรมาจารย์ลินน์ นี่คือข่าวกรองเกี่ยวกับทางจักรวรรดิขอรับ”","ลินน์รับกระดาษมาดู ก่อนจะขมวดคิ้วเข้าหากัน","ถึงกับบังเอิญขนาดนี้เลยงั้นรึ?","“มีอะไรหรือ?”","วิกโตริโอเอ่ยถามด้วยความสงสัย","“เป็นเรื่องของภัยพิบัติจากเทพนอกรีตน่ะ!”","ลินน์อธิบาย ตามรายงานของสายลับ เกิดภัยพิบัติจากเทพนอกรีตขึ้นสามครั้งภายในจักรวรรดิ แต่สิ่งที่น่าแปลกก็คือ พวกมันกลับถูกกำจัดทิ้งไปทีละกลุ่ม โดยที่แทบจะไม่เกิดความสูญเสียอะไรเลย","เพราะต้องรู้ก่อน ว่ามีเพียงจอมเวทผู้ยิ่งใหญ่ระดับหกเท่านั้น ที่จะมีสิทธิ์ก้าวไปสู่เทพนอกรีตได้ และหลังจากที่ได้รับพลังแห่งความศรัทธามาแล้ว ความแข็งแกร่งของพวกเขา ก็จะไปถึงระดับกึ่งตำนาน ซึ่งมันไม่ใช่สิ่งที่นักบวชธรรมดาๆ จะรับมือได้เลย","โดยปกติแล้ว ทันทีที่บรรดาสาวกปลุกเทพนอกรีตขึ้นมา นั่นหมายความว่าจะต้องมีผู้เสียชีวิตและบาดเจ็บหลายหมื่น หรืออาจจะหลายแสนคน และลำพังแค่พลังของศาสนจักรในพื้นที่ ก็แทบจะไม่มีความสามารถในการต่อต้านเลยด้วยซ้ำ เพราะจำเป็นจะต้องให้นักบวชระดับตำนานเป็นคนจัดการเท่านั้น","แต่ครั้งนี้กลับแตกต่างออกไป ภัยพิบัติจากเทพนอกรีตถึงสามครั้งติดต่อกัน กลับถูกปราบปรามลงได้อย่างง่ายดาย ราวกับว่าเบื้องบนของศาสนจักรได้รับข่าวล่วงหน้า และไปดักซุ่มรออยู่ที่นั่นแล้ว","“มันก็ดูแปลกจริงๆ นั่นแหละ”","วิกโตริโอลูบหนวดสีขาว พลางครุ่นคิดว่าทางศาสนจักรกำลังเล่นลูกไม้อะไรอยู่","นอกจากนี้ ยังมีข่าวกรองอีกเรื่องที่น่าจับตามอง นั่นก็คือพ่อมดที่รับผิดชอบด้านการสื่อสาร ได้รับสัญญาณคลื่นแม่เหล็กไฟฟ้าแปลกๆ เมื่อตอนพลบค่ำของเมื่อวานนี้","เนื่องจากความเร็วในการส่งผ่านคลื่นแม่เหล็กไฟฟ้านั้นเร็วมาก พวกเขาจึงไม่สามารถระบุแหล่งที่มาได้ และก็ไม่มีความสามารถในการถอดรหัสด้วย หลังจากพิจารณาอย่างถี่ถ้วนแล้ว พวกเขาจึงทำได้เพียงแค่ใช้เวทมนตร์แม่เหล็กไฟฟ้า เพื่อเข้าไปรบกวนเท่านั้น","มีคนพัฒนาการประยุกต์ใช้คลื่นแม่เหล็กไฟฟ้าในทางเวทมนตร์ขึ้นมาแล้วงั้นรึ?","ลินน์รู้สึกประหลาดใจเป็นอย่างมาก แต่ที่มากกว่านั้นก็คือความระแวดระวัง เพราะการใช้งานที่เห็นได้ชัดที่สุดของสิ่งนี้ มักจะใช้สำหรับส่งข่าวกรอง!","...","สามวันต่อมา ณ เมืองหลวงของอาณาจักร ภายในปราสาทอันหรูหราแห่งหนึ่ง ขุนนางหลายสิบคนที่แต่งกายโอ่อ่า และมีสีหน้าไม่พอใจ กำลังรวมตัวกันเพื่อจัดการประชุมลับ","“ไอ้พวกพ่อมดบ้าพวกนี้ ถึงกับกล้ายึดครองดินแดนทางตะวันออกของอาณาจักรไปเป็นของตัวเอง แถมยังลงโทษและเข่นฆ่าบรรดาขุนนางของอาณาจักรตามอำเภอใจ ใครเป็นคนให้สิทธิ์พวกมันกัน?”","มาร์ควิสมอร์แทนตะโกนลั่นปราสาทอย่างบ้าคลั่ง ซึ่งก็เรียกเสียงสนับสนุนจากขุนนางคนอื่นๆ ได้เป็นอย่างดี","ในช่วงเวลากว่าหนึ่งปี ที่พวกพ่อมดยึดครองเมืองหลวง ต้องขอบคุณผลประโยชน์จากการปกครองที่เป็นรูปธรรม ซึ่งได้มาจากการขับไล่ศาสนจักรออกไป หลายคนจึงได้เปลี่ยนทัศนคติ และค่อยๆ ยอมรับสถานการณ์ ที่พวกพ่อมดได้เข้ามาแทนที่สถานะของศาสนจักร","แม้กระทั่งมอร์แทน ที่ได้ชื่อว่าเป็นผู้ที่มีความศรัทธาต่อพระผู้เป็นเจ้าอย่างแรงกล้าที่สุด หลังจากที่ได้เห็นภาพจำลองของพระผู้เป็นเจ้าถูกทำลาย และได้ยินข่าวการพ่ายแพ้อย่างต่อเนื่องของกองกำลังปราบปราม เขาก็ต้องกัดฟันยอมรับสิทธิ์ในการบริหารอาณาจักรของพวกพ่อมด","แต่พื้นฐานของความร่วมมือทั้งหมด ล้วนตั้งอยู่บนเงื่อนไขที่ว่าทั้งสองฝ่ายต้องปฏิบัติตามกฎ!","และกฎที่ว่านั้นก็คือ ขุนนางปกครองโลกมนุษย์ ส่วนพ่อมดปกครองโลกเหนือธรรมชาติ!","แต่การกระทำของพวกพ่อมดในช่วงที่ผ่านมา กลับทำให้พวกเขารู้สึกหวาดกลัวเป็นอย่างยิ่ง!","เพราะระหว่างทางที่พวกเขายึดดินแดนของอาณาจักรคืนมา และบุกจักรวรรดิ ก็มีขุนนางจำนวนมากที่ถูกจับแขวนคอ ทรัพย์สินทั้งหมดถูกยึด บุตรธิดาและคนรับใช้ ถูกบังคับให้กลายเป็นแรงงานชั้นต่ำ ต้องทำงานแบบเดียวกับคนยากจนเหล่านั้น เรื่องแบบนี้ จะไม่ให้พวกเขารู้สึกโกรธแค้นและหวาดกลัวได้อย่างไร!","“แล้วองค์กษัตริย์ล่ะ? พระองค์จะทรงปล่อยให้ดินแดนทางตะวันออกของอาณาจักรทั้งหมด ถูกพวกพ่อมดยึดครองไปเฉยๆ แบบนี้เลยหรือ?”","ไวส์เคานต์แห่งอาณาจักรคนหนึ่ง เอ่ยถามขึ้นมาอย่างไม่อยากจะเชื่อ","“องค์กษัตริย์งั้นรึ?”","มอร์แทนพูดด้วยน้ำเสียงเย้ยหยัน","“ก็แค่กษัตริย์จอมปลอม เป็นแค่หุ่นเชิดที่ถูกเชิดขึ้นมาก็เท่านั้นแหละ”","เขาได้ยินมาจากทหารองครักษ์คนหนึ่ง ว่าหลังจากที่พวกพ่อมดยึดเมืองได้ พวกเขาก็ส่งคนมาขอคำปรึกษาจริงๆ","แต่นั่นมันก็เป็นแค่การขอคำปรึกษาเท่านั้น!","ในเมื่ออีกฝ่ายจัดการทุกอย่างเสร็จสิ้นไปหมดแล้ว นอกจากจะเห็นด้วยแล้ว กษัตริย์ฮัตตาร์ยังมีทางเลือกที่สองอีกงั้นรึ?","เหล่าขุนนางที่เข้าร่วมการหารือ ต่างก็ยิ่งรู้สึกโกรธแค้นมากขึ้นเรื่อยๆ หากตอนนั้นไม่ได้รับความช่วยเหลือ และความร่วมมือจากพวกเขา พวกพ่อมดจะมีปัญญาอะไรมาบริหารดินแดนอันกว้างใหญ่ของอาณาจักรได้?","อาณาจักรทั้งอาณาจักร คงจะแตกแยกเป็นเสี่ยงๆ ภายใต้การโจมตีของผู้ศรัทธาและกลุ่มกบฏไปนานแล้ว!","ตอนนี้เห็นได้ชัดว่าอีกฝ่ายต้องการจะถีบหัวส่ง วันนี้คนที่ต้องเดือดร้อน อาจจะเป็นแค่ขุนนางในดินแดนตะวันออกของอาณาจักร ที่ต่อต้านพวกพ่อมด แต่ถ้าหากพวกพ่อมดจัดการกับกลุ่มที่ต่อต้านจนหมดแล้ว รายต่อไป ก็คงจะหนีไม่พ้นพวกเขานี่แหละ..."]},{"n":464,"t":"ให้พวกพ่อมดได้เห็นถึงสติปัญญาและพลังของขุนนางเสียบ้าง!","c":["“พวกเราจะปล่อยให้เป็นแบบนี้ต่อไปไม่ได้อีกแล้ว!”","ท่ามกลางเสียงโต้เถียงและเสียงวิพากษ์วิจารณ์ของผู้คน เอิร์ลเฮลเดอร์ก็ตบโต๊ะแล้วลุกขึ้นยืน เขากวาดสายตามองไปยังทุกคนที่อยู่ในห้อง ก่อนจะพูดด้วยน้ำเสียงขุ่นเคือง","“ข้าคิดว่าพวกเรามีความจำเป็นที่จะต้องใช้มาตรการบางอย่าง เพื่อหยุดยั้งพฤติกรรมอันอุกอาจของพวกพ่อมดภายในอาณาจักร!”","แต่คำพูดอันปลุกเร้าอารมณ์ของเฮลเดอร์ กลับไม่ได้รับเสียงโห่ร้องยินดีจากฝูงชน ตรงกันข้าม เขากลับได้รับเสียงหัวเราะเยาะกลับมาแทน","“มาตรการงั้นรึ? ท่านตั้งใจจะทำอะไรล่ะ ท่านเอิร์ลเฮลเดอร์?”","ไวส์เคานต์สเคอร์พูดจาเยาะเย้ยอย่างไม่ไว้หน้า","“รวบรวมทหารองครักษ์และอัศวินของท่าน แล้วบุกไปทวงความยุติธรรมที่เมืองน้ำมันดินอย่างนั้นรึ?”","ตอนนี้พวกพ่อมดกำลังอยู่ในช่วงรุ่งโรจน์ถึงขีดสุด พวกเขาสามารถเอาชนะกองกำลังปราบปรามของศาสนจักรได้อย่างต่อเนื่อง และยังบุกทะลวงเข้าไปจนถึงเขตแดนของจักรวรรดิได้อีก!","ต่อให้พวกเขาจะไม่อยากเชื่อแค่ไหน แต่พวกเขาก็ต้องเผชิญหน้ากับความจริงที่ว่า ลำพังแค่กองกำลังของขุนนางอย่างพวกเขา มันไม่เพียงพอที่จะสั่นคลอนการปกครองของพวกพ่อมดได้เลย แถมพวกเขาอาจจะสู้กับกองกำลังป้องกันอาณาจักรไม่ได้ด้วยซ้ำ!","จุดจบของแกรนด์ดยุกริคแมนในตอนนั้น คือข้อพิสูจน์ที่ดีที่สุด","พลปืนคาบศิลาเพียงสามพันคน ที่ทำงานร่วมกับสิ่งที่เรียกว่าเรือเหาะ สามารถทำให้ทหารระดับแนวหน้าของอาณาจักรนับหมื่นคน ต้องวิ่งหนีหัวซุกหัวซุน ในสายตาของสเคอร์ การเผชิญหน้ากับพวกพ่อมดแบบตรงๆ จึงไม่ใช่ความคิดที่ฉลาดเลย!","คำพูดเยาะเย้ยของสเคอร์ ทำให้ใบหน้าของเฮลเดอร์แดงก่ำ เขาโต้กลับด้วยความโกรธจัด","“แล้วพวกเราก็ควรจะนั่งดูสมุนของพวกปีศาจเหล่านี้ ได้คืบเอาศอก และเปลี่ยนอาณาจักรทั้งอาณาจักร ให้กลายเป็นทรัพย์สินส่วนตัวของพวกมันอย่างนั้นรึ?”","“พวกท่านอย่าลืมสิ ว่าพวกพ่อมดใช้ข้ออ้างอะไร ในการลงโทษบรรดาขุนนางในภาคตะวันออก...”","เมื่อได้ยินดังนั้น สีหน้าของทุกคนที่อยู่ที่นั่น ก็เปลี่ยนไปเล็กน้อย","เป็นความจริงที่ว่า บรรดาขุนนางในภาคตะวันออกของอาณาจักร ได้เลือกที่จะยืนอยู่ข้างจักรวรรดิและศาสนจักร ภายใต้สถานการณ์ที่ยังไม่ชัดเจน ซึ่งถือเป็นความผิดพลาดครั้งใหญ่ แต่ไม่ว่าอย่างไร พวกพ่อมดก็ไม่ควรจะมาตั้งศาลเตี้ย และตัดสินความผิดกันเอาเองแบบนี้!","แถมหลักฐานการกระทำความผิดหลายๆ อย่างที่อีกฝ่ายนำมาอ้าง ก็เป็นสิ่งที่น่าเหลือเชื่อเกินไป!","ตั้งแต่เมื่อไหร่กัน ที่การเฆี่ยนตีทาสที่ทำผิดจนตาย ถือเป็นความผิด?","และไอ้เรื่องที่เรียกว่า การเก็บภาษีขูดรีด นั่นมันก็เป็นเรื่องตลกสิ้นดี!","ตามกฎหมายของอาณาจักร ประชาชนทุกคน ล้วนเป็นทรัพย์สินส่วนตัวของท่านลอร์ด การที่คนเหล่านี้จะต้องจ่ายข้าวปลาอาหารเท่าไหร่ หรือควรจะถูกลงโทษอย่างไร ล้วนเป็นสิ่งที่ท่านลอร์ดในพื้นที่นั้นๆ เป็นผู้ตัดสินใจ เว้นแต่ว่ามันจะเกี่ยวข้องกับปัญหาเรื่องความศรัทธา ไม่เช่นนั้น แม้แต่องค์กษัตริย์และศาสนจักรในพื้นที่ ก็ยังไม่สามารถเข้ามาแทรกแซงได้!","หากใช้มาตรฐานการตัดสินของอีกฝ่าย แบบนี้ตัวเขาเองก็ไม่รอดจากการถูกพิจารณาคดีด้วยน่ะสิ?","เมื่อคิดถึงเรื่องนี้ บรรดาขุนนางที่อยู่ในห้องลับ ต่างก็รู้สึกหนาวสั่นขึ้นมาในใจ","เฮลเดอร์หันไปมองไวส์เคานต์สเคอร์ แล้วเปิดแผลใจของอีกฝ่ายอย่างไม่ลังเล","“อย่าคิดว่าข้าไม่รู้นะ สเคอร์ ว่าเมื่อไม่กี่วันก่อน อัศวินเอกของท่าน ได้ผิดคำสาบาน และวิ่งไปซบอกพวกพ่อมดแล้วน่ะ?”","สีหน้าของอีกฝ่าย เปลี่ยนเป็นน่าเกลียดขึ้นมาในทันที","เมื่อสัปดาห์ที่แล้ว จู่ๆ อัศวินเอกของเขาก็หายตัวไป และสเคอร์ส่งคนออกไปตามหาอยู่หลายวัน จนในที่สุดก็พบว่า เจ้านั่นแอบหนีเข้าไปทำงานเป่าแก้ว ให้กับพวกพ่อมดในโรงงานที่เมืองหลวง!","เรื่องนี้เกือบจะทำให้เขาโกรธจนตาย!","อัศวินผู้มีบรรดาศักดิ์ ถึงกับยอมลดตัวลงไปทำงานต่ำต้อย ที่มีแต่พวกคนยากจนเท่านั้นที่ทำกัน นี่มันเป็นการดูถูกเกียรติของขุนนางชัดๆ!","แต่หลังจากที่สอบถามถึงสาเหตุ เขาก็ได้รับรู้ว่า ค่าจ้างที่โรงงานจ่ายให้นั้น มากกว่าที่เขาให้ถึงสองเท่า แถมยังมีอาหารให้ครบสามมื้อ และมีที่พักให้อีกด้วย...","สเคอร์ที่กำลังโกรธจัด จึงคิดอยากจะส่งคนไปลากตัวอัศวินเอกของตัวเองกลับมา เพื่อไม่ให้ขายหน้าไปมากกว่านี้ และเตรียมที่จะลงโทษการกระทำของอีกฝ่าย ที่ทำให้เกียรติของขุนนางต้องแปดเปื้อนอย่างหนัก","แต่พ่อมดที่เป็นคนดูแลโรงงาน กลับปฏิเสธคำขออันสมเหตุสมผลของเขาอย่างเย่อหยิ่ง เพราะอัศวินเอกของเขามีพรสวรรค์มาก แม้จะเพิ่งเข้ามาทำงานได้เพียงสัปดาห์เดียว แต่เขากลับเป็นคนที่เป่าแก้วได้เก่งที่สุดในโรงงาน และตอนนี้ เขาก็ได้กลายเป็นผู้ดูแล ที่รับผิดชอบในการสอนงานให้กับเด็กใหม่ไปแล้ว","เมื่อนึกถึงสายตาที่เย่อหยิ่งและดูถูกของอีกฝ่าย ความโกรธแค้นและความอัปยศอดสูอันไร้ที่สิ้นสุด ก็พรั่งพรูเข้ามาในหัวใจของสเคอร์","พวกพ่อมดต่ำต้อย ที่เมื่อก่อนทำได้เพียงแค่ซ่อนตัวอยู่ตามซอกหลืบของเมืองราวกับหนู และต้องคอยพึ่งพาบารมีของพวกขุนนางอย่างพวกเขา เพื่อให้มีชีวิตรอดไปวันๆ แต่ตอนนี้ พวกมันกลับก้าวขึ้นมาเหยียบหัวของพวกเขา และทำตัวเป็นใหญ่...","เฮลเดอร์ไม่ยอมหยุดแค่นั้น หลังจากที่เปิดแผลใจของสเคอร์แล้ว เขาก็หันไปมองขุนนางคนอื่นๆ ที่อยู่ที่นั่น แล้วแทงใจดำของพวกเขาแต่ละคนอย่างรุนแรง","แม้ว่าอิทธิพลของพวกพ่อมด จะยังแผ่ขยายมาไม่ถึงดินแดนของพวกเขา แต่ผลกระทบที่ตามมา กลับคุกคามผลประโยชน์ของทุกคนอย่างแท้จริง","ไม่ต้องพูดถึงเรื่องอื่น ลำพังแค่อัตราการก่อความวุ่นวายของพวกทาสเหมืองและคนยากจน ก็เพิ่มขึ้นหลายเท่าตัว บางพื้นที่ถึงกับเกิดปรากฏการณ์ประชาชนพากันหลบหนีออกจากพื้นที่เป็นจำนวนมากเลยทีเดียว","และนี่ก็คือเหตุผล ว่าทำไมในวันนี้ พวกเขาถึงได้มารวมตัวกัน เพื่อปรึกษาหารือเกี่ยวกับอนาคตของพวกขุนนางและอาณาจักร!","“ข้ามีแผนการหนึ่ง ซึ่งอาจจะพอเป็นไปได้!”","ในขณะที่ทุกคนกำลังเต็มไปด้วยความโกรธแค้น จู่ๆ มาร์ควิสมอร์แทนก็พูดขึ้นมา ซึ่งมันก็ดึงดูดความสนใจของทุกคนได้เป็นอย่างดี ก่อนที่เขาจะพูดด้วยความมั่นใจ","“พวกเราอาจจะไม่ใช่คู่ต่อสู้ของพวกพ่อมด หากต้องสู้กันซึ่งๆ หน้า แต่พวกท่านอย่าลืมสิ ว่าในมือของพวกเรา ยังมีสิ่งหนึ่งที่สามารถส่งผลกระทบต่อความอยู่รอดของทั้งอาณาจักรได้”","บรรดาขุนนางภายในห้องลับ ต่างก็ชะงักไปเล็กน้อย แม้แต่เอิร์ลเฮลเดอร์เอง ก็ยังรู้สึกประหลาดใจเป็นอย่างมาก","โชคดีที่มาร์ควิสมอร์แทนไม่ได้ตั้งใจจะอมพะนำ เขาจึงพูดออกมาตรงๆ","“เสบียงอาหาร!”","“ท่านหมายความว่า...”","เอิร์ลเฮลเดอร์รู้สึกเหมือนมองเห็นแสงสว่างที่ปลายอุโมงค์ เขาพอจะเข้าใจความหมายของท่านมาร์ควิสขึ้นมาบ้างแล้ว","“ตอนนี้ พื้นที่ทางภาคตะวันออกของอาณาจักร เพิ่งจะผ่านพ้นภัยสงครามมาหมาดๆ การจะฟื้นฟูผลผลิต จึงไม่ใช่เรื่องง่ายเลย และพวกท่านก็ไม่ได้สังเกตเลยหรือ ว่าพวกพ่อมดกำลังกว้านซื้อข้าวสาลีจำนวนมหาศาลอยู่น่ะ!”","มาร์ควิสมอร์แทนพูดด้วยรอยยิ้มเย็นชา","เพื่อเอาใจประชาชนระดับรากหญ้า และทำลายรากฐานของศาสนจักร สภาเวทมนตร์ได้ใช้ทรัพย์สินที่ปล้นชิงมาได้ เพื่อจ้างงานบรรดาคนยากจนด้วยค่าตอบแทนที่สูงลิ่ว จากนั้นก็นำสิ่งประดิษฐ์เล่นแร่แปรธาตุแปลกใหม่ที่พวกเขาผลิตขึ้นมาได้ ไปขายแลกกับผลกำไรมหาศาล เพื่อรักษาสถานการณ์ในปัจจุบันเอาไว้","ต้องยอมรับเลย ว่าพวกพ่อมดนั้นใจป้ำมาก และแผนการนี้ก็ยอดเยี่ยมมากจริงๆ!","เวลาเพียงแค่หนึ่งปี ประชาชนในเมืองหลวง ก็เปลี่ยนจากความหวาดกลัวต่อโรงงานที่ปล่อยควันโขมงจากก้นบึ้งของหัวใจ มาเป็นการแย่งชิงกันเข้าไปทำงาน และถึงขั้นรู้สึกภาคภูมิใจที่ได้ทำงานให้กับพวกพ่อมด!","แต่มันก็มีปัญหาอยู่อย่างหนึ่ง เมื่อประชาชนมีเงินเก็บมากขึ้น พวกเขาก็จะไม่ยอมทนหิวอีกต่อไป ขนมปังดำที่เมื่อก่อนเคยขายดีจนหมดเกลี้ยง ตอนนี้กลับไม่มีแม้แต่สุนัขข้างถนนยอมกิน...","ต้องรู้ก่อนนะ ว่าของพวกนี้ เคยเป็นอาหารหลักของคนยากจน","เพื่อลดต้นทุน บรรดาพ่อค้ามักจะผสมขี้เลื่อยและเศษหญ้าลงไปในแป้ง ซึ่งแม้มันจะเคี้ยวได้ยาก แต่มันก็สามารถทำให้ท้องอิ่มได้...","แต่ในทุกวันนี้ ภายในเมืองหลวง แม้แต่คนงานเหมืองที่ต่ำต้อยที่สุด ก็ยังไม่ลังเลที่จะซื้อขนมปังขาวแสนอร่อยมากิน","สิ่งนี้ทำให้ความต้องการในการบริโภคอาหาร เพิ่มขึ้นหลายเท่าตัว ยิ่งไปกว่านั้น ดินแดนทางภาคตะวันออกของอาณาจักรที่เพิ่งยึดมาได้ ก็ยังมีประชากรมากกว่าหนึ่งล้านคน การจะเลี้ยงปากท้องของคนจำนวนมากขนาดนี้ ไม่ใช่เรื่องง่ายเลย","ขบวนรถเสบียงอาหารที่วิ่งไปมาอยู่ตลอดเวลา เป็นข้อพิสูจน์ได้ดีว่า เสบียงอาหารในมือของสภาเวทมนตร์นั้นไม่เพียงพอแล้ว","ในเวลานี้ หากพวกเขากว้านซื้อข้าวสาลีเป็นจำนวนมาก พวกเขาก็จะสามารถสั่นคลอนการค้าเสบียงอาหารของทั้งอาณาจักรได้ ทำให้เสบียงอาหารที่มีไม่เพียงพออยู่แล้วในตลาด ยิ่งลดน้อยลงไปอีก ซึ่งก็จะส่งผลให้ราคาอาหารพุ่งสูงขึ้น","และเหล่าคนยากจนที่มีเงินเหลือเก็บ เมื่อรู้สึกหวาดกลัว ก็จะเริ่มกักตุนอาหาร จนเกิดเป็นปฏิกิริยาลูกโซ่!","“ตอนนี้ อาณาจักรภายใต้การปกครองของพวกพ่อมด ก็เปรียบเสมือนปราสาทที่มีเปลือกนอกแข็งแกร่ง แต่ภายในกลับสั่นคลอนอย่างหนัก ขอเพียงแค่พวกเราเตะมันแรงๆ สักที มันก็จะต้องพังทลายลงมาอย่างแน่นอน!”","มาร์ควิสมอร์แทนพูดด้วยน้ำเสียงเด็ดขาด","บรรดาขุนนางที่อยู่ที่นั่น ต่างก็มีสีหน้าตื่นตระหนก","แผนการทำลายล้างนี้ ช่างโหดร้ายไร้ความปรานีเสียจริง!","“แต่ทางฝั่งจักรวรรดิล่ะ...”","สเคอร์ลังเลอยู่ครู่หนึ่ง หากพวกพ่อมดสามารถนำเข้าเสบียงอาหารจากจักรวรรดิ ผ่านทางการค้าได้ ทุกสิ่งที่พวกเขาทำไป ก็คงจะเปล่าประโยชน์","“วางใจเถอะ จากทิศทางนั้น จะไม่มีเมล็ดข้าวแม้แต่เมล็ดเดียว เล็ดลอดมาได้อย่างแน่นอน!”","มาร์ควิสมอร์แทนให้คำรับประกัน","ขุนนางที่อยู่ที่นั่นไม่ใช่คนโง่ พวกเขาตระหนักได้ทันที ว่าการที่มาร์ควิสมอร์แทนเรียกพวกเขามาประชุมในวันนี้ จะต้องเป็นการทำตามคำสั่งของศาสนจักรอย่างแน่นอน","แต่นั่นกลับทำให้ทุกคนรู้สึกโล่งใจ เพราะสิ่งที่พวกเขาถนัดที่สุด ก็คือการไหลไปตามน้ำ และกอบโกยผลประโยชน์จากมัน สถานการณ์ในปัจจุบัน พวกพ่อมดเป็นฝ่ายกุมอำนาจเบ็ดเสร็จ แถมยังสามารถผูกใจบรรดาคนยากจนเอาไว้ได้เป็นจำนวนมาก ลำพังแค่กำลังของพวกเขามันไม่เพียงพอที่จะต่อต้านได้เลย","“ท่านมาร์ควิสมอร์แทน แผนการของท่านยอดเยี่ยมมาก แต่ถ้าพวกพ่อมดลงมือกับพวกเราโดยตรงล่ะ จะทำอย่างไร?”","ไวส์เคานต์สเคอร์เอ่ยถามอย่างลังเล","พ่อมดผู้ครอบครองพลังเวทมนตร์อันทรงพลัง ไม่สนใจกฎหมายของอาณาจักรหรอก หากทำให้คนพวกนี้โกรธขึ้นมา การที่พวกมันจะบุกเข้ามา และฆ่าพวกเขาทิ้งทั้งหมด ก็ไม่ใช่เรื่องที่เป็นไปไม่ได้","“ท่านคิดว่าหากพวกเรามัวแต่นั่งรออยู่เฉยๆ โดยไม่ทำอะไรเลย พวกพ่อมดก็จะยอมปล่อยพวกเราไปอย่างนั้นรึ?”","มอร์แทนพูดด้วยรอยยิ้มเย้ยหยัน","“เลิกโง่ได้แล้ว ตอนนี้พวกเขาเพียงแค่ถูกกดดันจากทางจักรวรรดิและศาสนจักร จึงยังไม่มีเวลามาจัดการกับพวกเราเท่านั้นแหละ”","“ยิ่งไปกว่านั้น พวกเราก็ไม่จำเป็นต้องลงมือเองด้วย!”","มอร์แทนได้วางแผนเอาไว้ล่วงหน้าแล้ว เรื่องการกว้านซื้อเสบียงอาหาร และการปั่นราคาอาหาร แค่ใช้กองคาราวานสินค้าที่อยู่ภายใต้สังกัดของพวกเขาก็เพียงพอแล้ว โดยสิ่งที่พวกเขาต้องทำ ก็คือใช้ความมั่งคั่งและอิทธิพลของตัวเอง คอยสนับสนุนอยู่เบื้องหลังก็พอ!","ยิ่งไปกว่านั้น ตอนนี้กำลังรบหลักของพวกพ่อมดก็กำลังอยู่ในดินแดนของจักรวรรดิ และต้องเผชิญหน้ากับการต่อสู้ที่ดุเดือดกับกองกำลังปราบปรามของศาสนจักรอยู่ตลอดเวลา หากพวกเขาเลือกที่จะแตกหักกับพวกขุนนางอย่างพวกเรา อาณาจักรทั้งอาณาจักร ก็อาจจะตกอยู่ในความเสี่ยงที่จะล่มสลายได้!","หลังจากที่ได้ฟังคำอธิบายของมอร์แทน เฮลเดอร์และคนอื่นๆ ก็ค่อยๆ คลายความกังวลลง","ด้วยวิธีนี้ พวกเขาก็ไม่ต้องไปปะทะกับพวกพ่อมดที่โหดเหี้ยมเหล่านั้นตรงๆ","หลังจากนี้ ไม่ว่าจะใช้เสบียงอาหารเป็นข้อต่อรอง เพื่อบีบให้พวกพ่อมดยอมถอย หรือว่าจะทำให้เกิดความวุ่นวายในอาณาจักร จนกลับไปสู่ยุคที่พวกขุนนางและศาสนจักรร่วมกันปกครองเหมือนในอดีต อำนาจการตัดสินใจ ก็จะตกอยู่ในมือของพวกเขาทั้งหมด!","ภายใต้ภัยคุกคามต่อผลประโยชน์ของตนเอง และการล่อลวงที่จะยึดอำนาจการควบคุมอาณาจักรกลับคืนมา บรรดาขุนนางในห้องลับต่างก็ตัดสินใจอย่างแน่วแน่ ว่าจะร่วมมือกันเพื่อทำให้พวกพ่อมดที่ไม่รู้จักเรื่องเศรษฐกิจ ได้เห็นถึงพลังและสติปัญญาของพวกขุนนางเสียบ้าง!","...","กลางดึกสงัด บรรดาขุนนางที่มาร่วมการประชุม ได้แอบเดินทางออกจากปราสาทของมาร์ควิสมอร์แทนผ่านทางเดินลับ ร่องรอยของความวิตกกังวลที่เคยมีในตอนแรก ได้มลายหายไปจนหมดสิ้น แต่ละคนกลับเต็มไปด้วยขวัญกำลังใจ ความตื่นเต้น และความกระตือรือร้น ราวกับได้เห็นรุ่งอรุณแห่งชัยชนะอยู่ตรงหน้า!","เจฟฟ์ที่ปะปนอยู่ในกลุ่มคนเหล่านั้น ยังคงรักษารอยยิ้มเอาไว้บนใบหน้า แต่ภายในใจกลับเต็มไปด้วยความกังวลอย่างลึกซึ้ง","ในฐานะที่เป็นเพียงแค่บารอนตัวเล็กๆ เจฟฟ์มีดินแดนเป็นของตัวเอง แต่ด้วยความที่มีหัวการค้า และรู้จักพลิกแพลงไปตามสถานการณ์ ภายใต้การปกครองของพวกพ่อมด เขาจึงไม่ได้รับผลกระทบมากนัก ตรงกันข้าม เขากลับได้รับผลประโยชน์มากมาย","ตัวอย่างเช่น เมื่อสามเดือนก่อน เขาได้ปล่อยเช่าสิทธิ์ในการบริหารเหมืองแร่และพื้นที่การเกษตรในดินแดนของตนเอง รวมไปถึงประชาชนอีกกว่าสองหมื่นคน ซึ่งทำให้เขาได้รับค่าตอบแทนเกือบหนึ่งพันเหรียญทองของจักรวรรดิต่อปี ซึ่งมันมากกว่าที่เขาเคยทำได้ จากการบริหารดินแดนอย่างเหน็ดเหนื่อยในอดีตเสียอีก!","เจฟฟ์ไม่ได้มีความทะเยอทะยานที่ยิ่งใหญ่อะไรนัก การได้เก็บค่าเช่า ได้เล่นสนุกกับสิ่งประดิษฐ์เวทมนตร์แปลกใหม่ ได้หาหญิงรับใช้หน้าตาดีมาปรนนิบัติสักสองสามคน เพื่อช่วยสร้างความเจริญรุ่งเรืองให้กับตระกูล แค่นี้ก็ถือเป็นเป้าหมายสูงสุดในชีวิตของเขาแล้ว!","ที่สำคัญที่สุดก็คือ เขาไม่เห็นด้วยกับแผนการทำลายล้างของมาร์ควิสมอร์แทน เพราะเจฟฟ์รู้ดีว่า การที่พวกพ่อมดผลักดันให้ประชาชนระดับรากหญ้าเข้าไปทำงานในโรงงาน ไม่ใช่เพราะต้องการปล่อยให้ที่ดินรกร้าง แต่เป็นเพราะการทำเกษตรกรรม ไม่จำเป็นต้องใช้คนมากขนาดนั้นต่างหาก!","ก่อนหน้านี้ เขาเคยกลับไปที่ดินแดนของตัวเอง และได้เห็นสิ่งที่เรียกว่าเครื่องจักรไถนา","สิ่งประดิษฐ์เล่นแร่แปรธาตุชนิดนี้ น่ากลัวมาก มันใช้คนควบคุมเพียงแค่หนึ่งหรือสองคน ก็สามารถไถพรวนดินแดนหลายร้อยเอเคอร์ได้อย่างง่ายดาย!","ดังนั้น สภาเวทมนตร์จึงไม่ได้ขาดแคลนเสบียงอาหาร อย่างที่มอร์แทนและคนอื่นๆ คาดเดาเอาไว้เลย...","แต่เจฟฟ์ก็รู้ดีว่าคำพูดของตัวเองไม่มีน้ำหนักมากนัก การที่จะไปรายงานเรื่องที่ขุนนางของอาณาจักรรวมตัวกันเพื่อวางแผนร้าย โดยที่ไม่มีหลักฐาน ก็คงจะไม่ได้รับความสนใจมากนัก","เจฟฟ์ครุ่นคิดอยู่ครู่หนึ่ง ก่อนจะนึกถึงเจ้านายของตัวเองขึ้นมาได้ทันที!","ผู้ซึ่งเป็นมือขวาคนสนิทขององค์กษัตริย์ และเป็นหนึ่งในผู้ที่มีความดีความชอบ ในการสนับสนุนให้กษัตริย์ฮัตตาร์ขึ้นครองราชย์ ผู้ซึ่งถูกขุนนางหลายคนแอบด่าทออย่างลับๆ ว่าเป็นสุนัขรับใช้ของพวกพ่อมด...แกรนด์ดยุกการ์ด!","นี่คือบุคคลระดับสูงสุด ที่เขาสามารถเข้าถึงได้ในตอนนี้","เมื่อคิดได้ดังนั้น เจฟฟ์ก็ไม่รอช้าอีกต่อไป หลังจากที่ออกจากปราสาทของมาร์ควิส เขาก็รีบเดินทางไปยังคฤหาสน์ของแกรนด์ดยุกการ์ดในเมืองหลวง ตลอดทั้งคืน","หลังจากที่แจ้งเรื่องกับทหารยามแล้ว ในไม่ช้า เขาก็ได้รับอนุญาตให้เข้าพบ","เจฟฟ์เดินช้าๆ เข้าไปในห้องด้านในที่กว้างขวาง เขารออยู่ครู่หนึ่ง แกรนด์ดยุกการ์ดที่สวมชุดคลุมยาว ก็เดินเข้ามาพร้อมกับองครักษ์หลายคน","“โปรดอภัยให้ข้าด้วยเถิด ที่ต้องมาขัดจังหวะการพักผ่อนของท่าน แกรนด์ดยุก”","เจฟฟ์โค้งคำนับด้วยความเคารพอย่างสูง","“ว่ามาสิ บารอน การที่ท่านมาหาข้าดึกดื่นป่านนี้ มีเรื่องสำคัญอะไรจะรายงานงั้นรึ?”","แกรนด์ดยุกการ์ดไม่มีท่าทีเกรงใจ เขาเอ่ยถามด้วยน้ำเสียงที่ค่อนข้างหงุดหงิด","“เรียนท่านแกรนด์ดยุก เป็นเรื่องของมาร์ควิสมอร์แทนขอรับ...”","เจฟฟ์รายงานไปตามความเป็นจริง เขาเล่าเรื่องที่มอร์แทนแอบเรียกประชุมขุนนางกว่าสี่สิบคนในคืนนี้ เพื่อวางแผนกว้านซื้อเสบียงอาหารครั้งใหญ่ และสร้างความอดอยากขึ้นมาด้วยน้ำมือมนุษย์ ให้ฟังอย่างละเอียด","หลังจากที่ได้ฟังเรื่องราวของเจฟฟ์ แกรนด์ดยุกการ์ดก็ครุ่นคิดอยู่ครู่หนึ่ง","“ทำได้ดีมาก บารอน ข้าจะรายงานเรื่องนี้ให้กษัตริย์ฮัตตาร์ทรงทราบตามความเป็นจริง”","เจฟฟ์ไม่กล้าที่จะรับความดีความชอบนี้ไว้คนเดียว แต่ก่อนที่เขาจะได้ปฏิเสธ แกรนด์ดยุกการ์ดก็ถามขึ้นมาอีกครั้ง","“เรื่องนี้ ท่านบอกใครไปบ้างแล้ว?”","“มีแค่ท่านคนเดียวขอรับ นายท่าน!”","เจฟฟ์รีบตอบกลับไป","“ดี ดีมาก!”","การ์ดพยักหน้าด้วยความพอใจ จากนั้นก็ให้คนรับใช้นำถุงทองคำมาให้ เพื่อเป็นรางวัลสำหรับการแจ้งข่าว เขาพูดให้กำลังใจว่า","“หากยืนยันได้ว่าเรื่องนี้เป็นความจริง ท่านก็จะได้รับรางวัลที่สมน้ำสมเนื้ออย่างแน่นอน!”","เจฟฟ์รับมาด้วยความดีใจ ถุงนั้นหนักอึ้ง ข้างในน่าจะมีเหรียญทองของจักรวรรดิอย่างน้อยสองร้อยเหรียญ","“ท่านกลับไปพักผ่อนได้แล้ว!”","การ์ดโบกมือเป็นสัญญาณ","เจฟฟ์หันหลังกลับ และเก็บถุงเงินที่เต็มไปด้วยเหรียญทองเอาไว้ ไม่รู้ทำไม จู่ๆ เขาก็รู้สึกกระวนกระวายใจขึ้นมาอย่างประหลาด จนกระทั่งกำลังจะก้าวเท้าออกจากห้องด้านใน เขาก็นึกขึ้นมาได้ว่า หลังจากที่ฟังเรื่องเล่าของเขาจบ ท่าทีของท่านแกรนด์ดยุกผู้นี้ ดูจะสงบนิ่งเกินไปหน่อย ตั้งแต่ต้นจนจบ บนใบหน้าของเขาไม่มีวี่แววของความประหลาดใจเลยแม้แต่น้อย","ราวกับว่าเขารู้เรื่องนี้อยู่ก่อนแล้ว...","ความกังวลในใจของเจฟฟ์ทวีความรุนแรงยิ่งขึ้น และทันทีที่เขาก้าวเท้าออกจากประตู ความกังวลที่รุนแรงนั้น ก็แปรเปลี่ยนเป็นความรู้สึกถึงอันตรายที่รุนแรงยิ่งกว่า","เกือบจะโดยสัญชาตญาณ มือขวาของเจฟฟ์เอื้อมไปจับด้ามดาบที่เอว แต่สิ่งที่เร็วกว่าความเร็วของเขาก็คือลูกหน้าไม้ในมือของพวกองครักษ์!","ลูกธนูอันแหลมคม และเสียงลั่นไกของหน้าไม้ดังขึ้นเกือบจะพร้อมๆ กัน ในชั่วพริบตาเดียว มันก็พุ่งทะลุหน้าอก แขน และต้นขาของเจฟฟ์ จากนั้น ดาบยาวก็พุ่งแหวกอากาศเข้ามา ท่ามกลางเลือดที่พุ่งกระฉูด ศีรษะที่กลมโตของเจฟฟ์ก็ถูกฟันขาดกระเด็น ดวงตาที่เบิกกว้างของเขา เต็มไปด้วยความไม่เข้าใจ...","การ์ดโยนดาบยาวที่เปื้อนเลือดในมือทิ้ง เขาจ้องมององครักษ์รอบๆ ด้วยสายตาเย็นชา ก่อนจะพูดขึ้นมา","“จัดการเก็บกวาดศพให้เรียบร้อย แล้วไปบอกมอร์แทนด้วย ว่าคราวหน้าคราวหลังให้ระวังตัวหน่อย อย่าปล่อยให้คนแบบนี้หลุดรอดเข้าไปได้อีก”"]},{"n":465,"t":"พวกท่านเคยได้ยินเรื่องขนมปังเวทมนตร์ไหม?","c":["เช้าตรู่ของวันใหม่ในเมืองหลวง ท้องฟ้าเพิ่งจะเริ่มสว่าง ซูซานก็ตื่นจากความฝัน หลังจากที่จัดการกับงานบ้านตามปกติเสร็จ เธอก็ออกจากบ้านเพื่อไปซื้อวัตถุดิบสำหรับทำอาหารในอีกไม่กี่วันข้างหน้า","ถนนหนทางคึกคักมาก ขบวนกองคาราวานสินค้าสัญจรไปมาอย่างไม่ขาดสาย สัตว์พาหนะที่แข็งแรงลากรถล้อไม้ที่เต็มไปด้วยเสบียงแล่นไปบนถนนคอนกรีตที่ถูกขยายให้กว้างขึ้น พ่อค้าผู้มั่งคั่งหลายคนที่เพิ่งเคยเดินทางมาที่เมืองหลวงเป็นครั้งแรก ต่างก็วิพากษ์วิจารณ์กังหันน้ำขนาดใหญ่ที่หมุนวนอยู่ไกลๆ พร้อมกับส่งเสียงร้องอุทานออกมาด้วยความประหลาดใจเป็นระยะๆ","เสียงหวูดรถดังก้องกังวาน รถเล่นแร่แปรธาตุที่ถูกตกแต่งอย่างหรูหราคันหนึ่งแล่นผ่านไปอย่างรวดเร็ว ไอน้ำพวยพุ่งออกมาจากปล่องควันที่หน้ารถ ดึงดูดสายตาอิจฉาของชาวเมืองและบรรดาพ่อค้า","รถพลังงานไอน้ำชนิดนี้ ที่สามารถวิ่งได้เองโดยไม่ต้องใช้ม้าหรือสัตว์พาหนะ มีราคาขายสูงถึงหนึ่งร้อยเหรียญทองของจักรวรรดิเลยทีเดียว มีเพียงผู้ที่มีฐานะจริงๆ เท่านั้น ที่จะสามารถครอบครองมันได้ ซึ่งนี่ก็คือแฟชั่นใหม่ของบรรดาพ่อค้าผู้มั่งคั่ง และบรรดาขุนนางใหญ่ในเมืองหลวง...","ส่วนท่านพ่อมดทั้งหลาย พวกเขาจะนั่งสิ่งที่เรียกว่ากล่องเหล็ก ซึ่งไม่จำเป็นต้องพ่นไอน้ำออกมา แถมยังวิ่งได้เร็วกว่ามากด้วย ซึ่งได้ยินมาว่าจะต้องใช้เวทมนตร์เพื่อสตาร์ทมันเท่านั้น","ในขณะที่ซูซานกำลังคิดเพลินๆ จู่ๆ เงารูปไข่ก็ทอดตัวลงมา มันคือเรือเหาะขนาดใหญ่โตและสง่างาม ที่เพิ่งจะบินผ่านท้องฟ้าเหนือหัวของพวกเขาไป บดบังแสงแดดอันร้อนแรงในยามเช้าเอาไว้จนหมด","ริมถนน เด็กๆ จับกลุ่มกันสามห้าคน กำลังเหยียบเงาที่ทอดลงมาจากเรือเหาะ พร้อมกับวิ่งไล่จับกันอย่างสนุกสนาน...","แม้ซูซานจะเห็นภาพแปลกตาเหล่านี้อยู่ทุกวัน แต่เธอก็ยังรู้สึกไม่ค่อยชินนัก","ในช่วงหนึ่งปีที่ผ่านมา เธอรู้สึกเหมือนตัวเองกำลังใช้ชีวิตอยู่ในความฝัน","เริ่มจากการที่ศาสนจักรป่าวประกาศ ว่าพวกพ่อมดที่ชั่วร้ายได้นำกองทัพมาบุกยึดเมืองหลวง โดยพวกเขาสังหารกษัตริย์บาเซลอย่างโหดเหี้ยม ทำลายโบสถ์อันศักดิ์สิทธิ์จนราบเป็นหน้ากลอง พร้อมผู้ศรัทธาที่เคร่งศาสนาจำนวนมากถูกจับกุมตัวไป ทำให้ประชาชนทั่วทั้งเมืองหลวงต่างก็ตกอยู่ในความหวาดผวา เพราะกลัวว่าสมุนของพวกปีศาจเหล่านี้ จะพุ่งเป้ามาที่พวกตน","แต่สิ่งที่เกิดขึ้นหลังจากนั้น กลับเหนือความคาดหมายของทุกคน พวกพ่อมดไม่ได้จัดพิธีบูชายัญมนุษย์ที่ชั่วร้าย และไม่ได้บุกเข้ามาในบ้านเพื่อปล้นชิงทรัพย์สิน ตรงกันข้าม พวกเขากลับเริ่มซ่อมแซมบ้านเรือนและถนนหนทาง แถมยังเปิดโรงงานเวทมนตร์ขึ้นมาหลายแห่ง โดยมีการรับสมัครคนงานถลุงเหล็ก เป่าแก้ว และผลิตปืนคาบศิลา ด้วยค่าจ้างที่สูงลิ่ว","ในช่วงแรก ไม่มีใครกล้าเข้าไปทำงานในโรงงานเลย แถมยังมีข่าวลือออกมาว่า นี่คือกลอุบายที่พวกพ่อมดใช้เพื่อหลอกลวงพวกตน ภายนอกโรงงานเวทมนตร์อาจจะดูเหมือนรับสมัครคนงาน แต่แท้จริงแล้ว พวกเขากำลังทำการทดลองมนุษย์อันชั่วร้ายอยู่ โดยพวกพ่อมดจะสูบวิญญาณของคนออกมา ทำให้ร่างกายเน่าเปื่อยกลายเป็นโครงกระดูก และโยนพวกเขาทิ้งลงไปในขุมนรก!","แต่หลังจากที่ไฮเดนผู้กล้าหาญ ได้เข้าไปทำงานในโรงงานของพวกพ่อมด เขาก็มีชีวิตความเป็นอยู่ที่มั่งคั่งขึ้นเรื่อยๆ ถึงขั้นได้รับแจกบ้านหลังใหม่ ข่าวลือดังกล่าวจึงสลายไปโดยปริยาย","ซูซานรู้สึกโชคดีมาก ที่เธอและสามี เป็นคนงานกลุ่มแรกๆ ที่ได้เข้าไปทำงานในโรงงาน","ต้องรู้ก่อนนะ แม้โรงงานเวทมนตร์จะขยายกิจการไปหลายครั้ง แต่จำนวนแรงงานที่พวกเขารับสมัคร ก็ยังมีจำกัดอยู่ดี","ซึ่งบรรดาคนยากจนที่ตาสว่างช้าเกินไป ก็ทำได้เพียงแค่ไปสร้างถนนและขุดเหมือง แม้ว่าค่าจ้างที่ได้รับจะไม่ได้ต่ำมาก แต่มันก็เหนื่อยกว่าการทำงานในโรงงานมากจริงๆ","ตอนนี้ค่าจ้างของเธอและสามี ที่ทำงานในโรงงานผลิตปืนคาบศิลารวมกัน สามารถทำเงินได้ถึงเดือนละยี่สิบเหรียญเงิน ซึ่งหากเป็นเมื่อหนึ่งปีก่อน เรื่องแบบนี้ คงเป็นสิ่งที่ไม่กล้าแม้แต่จะจินตนาการถึงเลยด้วยซ้ำ!","และซูซานก็เพิ่งจะรู้เป็นครั้งแรก ว่าการทำงานในหนึ่งสัปดาห์ มีวันหยุดให้พักผ่อนหนึ่งวันด้วย","ที่นี่มันคือสรวงสวรรค์ที่ถูกอธิบายเอาไว้ในพระคัมภีร์ชัดๆ เพียงแต่มันถูกสร้างขึ้นมาโดยพวกพ่อมดก็เท่านั้น...","ในขณะที่คิด ซูซานก็เดินมาถึงถนนที่เจริญที่สุดในเมืองหลวง สายตาของเธออดไม่ได้ที่จะมองไปยังร้านขายเสื้อผ้าที่เพิ่งเปิดใหม่ ด้านหลังกระจกใสนั้น มีชุดกระโปรงสีสันสดใสมากมาย ทั้งเนื้อผ้าและสีสัน ช่างดูหรูหรากว่าชุดที่พวกลูกสาวขุนนางเคยใส่ในอดีตเสียอีก","ราคาขายก็ไม่ได้แพงมากนัก อยู่ที่ประมาณสิบถึงสิบห้าเหรียญเงิน ซูซานนับเงินในกระเป๋า แต่เมื่อนึกถึงค่าใช้จ่ายในการส่งลูกสองคนเข้าเรียนในสถาบันเวทมนตร์ เธอก็กัดฟัน แล้วเดินไปที่ร้านขายขนมปังที่อยู่ข้างๆ","“เอาเหมือนเดิม ขนมปังขาวสามถุง ถั่วสองที่”","ซูซานหยิบถุงเหรียญทองแดงเล็กๆ ออกมาจากอกเสื้อ แล้วยื่นไปให้","โคล์ม เจ้าของร้านขายขนมปังส่ายหน้า","“ทั้งหมดหนึ่งเหรียญเงินกับอีกเก้าสิบเหรียญทองแดง...”","“ทำไมถึงแพงขนาดนี้ล่ะ?”","ซูซานเบิกตากว้าง มองอีกฝ่ายอย่างไม่อยากจะเชื่อ","เธอจำได้ว่าเมื่อสัปดาห์ก่อน ขนมปังขาวหนึ่งถุง ราคาแค่สิบห้าเหรียญทองแดง ส่วนถั่วก็ราคาแค่สิบเหรียญทองแดงเท่านั้น","“เจ้าคงยังไม่รู้ล่ะสิ ช่วงนี้ข้าวสาลีราคาแพงขึ้นมาก ขนมปังก็เลยต้องขึ้นราคาตามไปด้วย”","โคล์มพึมพำ เวลาเพียงแค่ไม่กี่วัน ราคาข้าวสาลีก็พุ่งขึ้นเกือบสามเท่า นี่เขาขายถูกแล้วนะ","“ส่วนสาเหตุ...ก็คงเป็นเพราะสงครามล่ะมั้ง”","มีข่าวลือในเมืองหลวง ว่าพวกพ่อมดได้บุกเข้าไปถึงเขตแดนของจักรวรรดิแล้ว และประชาชนในดินแดนที่เพิ่งยึดมาได้ ก็สามารถเข้าไปทำงานในโรงงาน และได้กินขนมปังขาวทุกมื้อเหมือนกับพวกเขา","แต่ขนมปังมากมายขนาดนั้น จะไปหามาจากไหนล่ะ?","แม้ว่าโคล์มจะได้ยินจากบรรดาพ่อค้าที่เดินทางมาจากแดนไกล ว่าพวกพ่อมดได้สร้างสิ่งประดิษฐ์เล่นแร่แปรธาตุ ที่สามารถไถนาได้เอง แต่เขาก็คิดว่ามันคงไม่สามารถจัดหาเสบียงอาหารให้เพียงพอต่อประชากรหลายล้านคนของอาณาจักรได้หรอก","ยิ่งไปกว่านั้น ดินแดนทางตะวันออกเฉียงเหนือของอาณาจักรหลายแห่ง ก็ดูเหมือนจะเกิดภาวะขาดแคลนเสบียงอาหารขึ้น ดังนั้น ตอนนี้ในเมืองหลวงจึงมีข่าวลือแพร่สะพัดไปทั่ว ว่าเสบียงอาหารไม่เพียงพอแล้ว","พ่อค้าหัวหมอหลายคน เริ่มกักตุนข้าวสาลีกันแล้ว ซึ่งแน่นอนว่าโคล์มเองก็ไม่เว้น เขาเอ่ยเตือนซูซาน ว่าวันนี้ควรจะซื้อตุนเอาไว้เยอะๆ เพราะพรุ่งนี้อาจจะไม่ได้ราคานี้แล้ว!","ซูซานมองราคาที่สูงลิ่วอย่างลังเล แต่เมื่อนึกขึ้นได้ว่าราคาขนมปังอาจจะสูงขึ้นไปอีก เธอก็ยอมนับเงินจ่ายไป พร้อมกับถอนหายใจ แล้วพูดขึ้น","“งั้นเอาขนมปังดำมาอีกห้าถุงก็แล้วกัน”","“ขนมปังดำห้าถุง ทั้งหมดหกสิบเหรียญทองแดง!”","โคล์มยิ้มจนหุบปากไม่ลง หลังจากที่ได้ลิ้มรสขนมปังขาวแสนอร่อยแล้ว ก็ไม่มีใครยอมกลับไปกินขนมปังดำที่ทั้งแข็งและเคี้ยวยากอีกต่อไป","ตอนนี้ก็ถือโอกาส โละสต๊อกออกไปให้หมดเลยก็แล้วกัน","หลังจากที่จ่ายเงินไปสามเหรียญเงินด้วยความปวดใจ ซูซานก็รับวัตถุดิบที่ซื้อมา เธออดไม่ได้ที่จะขมวดคิ้ว เพราะขนมปังไม่เพียงแต่จะราคาแพงขึ้นหลายเท่า แต่ขนาดของมันก็ยังเล็กลงอย่างเห็นได้ชัดด้วย จากเดิมขนมปังหนึ่งก้อนจะหนาประมาณสี่นิ้วมือ แต่ตอนนี้กลับลดลงเหลือแค่สามนิ้วมือเท่านั้น","ในใจของซูซานเริ่มรู้สึกกังวลขึ้นมา นับตั้งแต่พวกพ่อมดยึดครองเมืองหลวง ภาวะอดอยากก็ดูเหมือนจะกลายเป็นอดีตไปแล้ว แต่ตอนนี้ราคาอาหารที่พุ่งสูงขึ้นอย่างต่อเนื่อง กลับทำให้ซูซานรู้สึกกังวลใจเป็นอย่างมาก","แม้ตอนนี้เธอจะยังพอซื้อไหว แต่วีกหนึ่งสัปดาห์ หรือหนึ่งเดือนหลังจากนี้ล่ะ?","ซูซานกำเหรียญเงินสองสามเหรียญสุดท้ายในมือแน่น เธอลังเลว่าควรจะซื้อตุนเอาไว้อีกสักหน่อยดีหรือไม่?","...","ภายใต้การสมรู้ร่วมคิดของบรรดาขุนนางและพ่อค้าผู้มั่งคั่ง ข่าวลือเรื่องความอดอยาก ก็แพร่สะพัดไปทั่วอาณาจักรอย่างรวดเร็ว ราคาของข้าวสาลีเพิ่มขึ้นแทบทุกวัน และความตื่นตระหนกที่เกิดขึ้น ก็ส่งผลกระทบไปถึงเมืองน้ำมันดิน!","ลินน์ที่กำลังง่วนอยู่กับการวิจัยในห้องทดลอง เพื่อหาวิธีดัดแปลงเวทมนตร์ระเบิดนิวเคลียร์ ให้กลายเป็นเวทมนตร์ระเบิดไฮโดรเจน ก็ถูกบังคับให้ต้องหยุดการวิจัย และถูกลากตัวเข้าไปในห้องประชุม","หลังจากที่ได้อ่านรายงาน ลินน์ก็อดไม่ได้ที่จะขมวดคิ้วเข้าหากัน","เวลาเพียงครึ่งเดือน ราคาข้าวสาลีในอาณาจักร ก็พุ่งจากเดิมกิโลกรัมละสองเหรียญทองแดง กลายเป็นสิบเหรียญทองแดง ซึ่งเพิ่มขึ้นถึงห้าเท่าตัว!","“เรื่องใหญ่ขนาดนี้ ทำไมก่อนหน้านี้ถึงไม่มีใครมาเตือนข้าเลยล่ะ?”","ลินน์เอ่ยถามด้วยความไม่เข้าใจ","เขามองปราดเดียวก็รู้ ว่ามีคนตั้งใจจะใช้การปั่นราคาอาหาร เพื่อสร้างความปั่นป่วนให้กับอาณาจักร วิธีที่ดีที่สุดก็คือการตัดไฟตั้งแต่ต้นลม แต่หากปล่อยให้มันลุกลามจนกลายเป็นปฏิกิริยาลูกโซ่ มันก็จะรับมือได้ยากมาก","เพราะทุกคนจะเริ่มกักตุนอาหารกันเอง ถึงตอนนั้น ต่อให้จะมีเสบียงอาหารมากแค่ไหน ก็คงไม่พอ!","ลอดด์ ผู้รับผิดชอบด้านการจัดซื้อเสบียงอาหาร ระบายความอัดอั้นตันใจออกมาอย่างจนปัญญา","เนื่องจากการสร้างเตาปฏิกรณ์นิวเคลียร์ฟิวชัน ทำให้ท่านประธานสภาและจอมเวทผู้ยิ่งใหญ่ทุกคน ต่างก็ยุ่งกันจนหัวหมุน หากไม่ใช่เรื่องเร่งด่วนจริงๆ พวกเขาก็ไม่สามารถจัดการประชุมเพื่อปรึกษาหารือกันได้เลย","ยิ่งไปกว่านั้น สงครามที่เกิดขึ้นอย่างต่อเนื่อง มักจะส่งผลให้ราคาอาหารพุ่งสูงขึ้นเสมอ ดังนั้น การที่ราคาข้าวสาลีจะผันผวน หรือแม้กระทั่งพุ่งขึ้นเป็นเท่าตัวในระยะเวลาอันสั้น จึงถือเป็นเรื่องที่ปกติมาก","ที่ผ่านมา พวกเขาก็คอยควบคุมราคาข้าวสาลี ด้วยการกว้านซื้อและระบายเสบียงอาหารออกสู่ตลาดมาโดยตลอด ดังนั้น ในช่วงหนึ่งปีที่ผ่านมา ราคาข้าวสาลีจึงเพิ่มขึ้นเพียงร้อยละห้าสิบเท่านั้น ซึ่งเมื่อเทียบกับค่าจ้างของคนยากจนที่เพิ่มขึ้นหลายเท่าตัว มันก็ไม่ได้สร้างความตื่นตระหนกอะไรเลย","ด้วยเหตุนี้ ลอดด์จึงไม่ได้สนใจเรื่องราคาข้าวสาลีที่พุ่งสูงขึ้นในตอนแรก เขาทำเพียงแค่ส่งเสบียงอาหารไปยังที่ต่างๆ ให้มากขึ้นตามปกติ เพื่อกดราคาอาหารให้ต่ำลง จนกระทั่งเขาพบว่าสถานการณ์มันอยู่เหนือการควบคุมแล้ว เขาถึงได้รายงานเรื่องนี้ให้เป็นเรื่องฉุกเฉิน","อัลวาที่รับผิดชอบด้านการค้า ก็พูดเสริมขึ้นมาว่า เมื่อวานซืน จู่ๆ ทางศาสนจักรก็มาตั้งป้อมยามที่เมืองชายแดนของจักรวรรดิ เพื่อตรวจค้นขบวนกองคาราวานสินค้าที่จะเดินทางออกนอกประเทศอย่างเข้มงวด ทำให้ขบวนกองคาราวานสินค้าที่เดินทางมาจากจักรวรรดิลดลงถึงแปดในสิบส่วน ซึ่งนี่ก็หมายความว่า พวกเขาจะไม่สามารถกว้านซื้อเสบียงอาหารจากจักรวรรดิในปริมาณมหาศาลได้อีกต่อไปแล้ว!","ข่าวร้ายสองเรื่องซ้อน ทำให้บรรดา
