นานทั้งสองคนนั้น ก็ไม่น่าจะอยู่ที่นั่นด้วย จึงไม่มีใครสามารถขัดขวางการโจมตีของพวกเขาได้!","“แล้วทางฝั่งของท่านศาสตราจารย์ลินน์ล่ะขอรับ จะทำยังไงดี?”","เรย์เดลชะงักไปครู่หนึ่ง ก่อนจะเอ่ยอย่างลังเลเล็กน้อย","กองกำลังหลักของศัตรูถูกล่อออกไปจนหมดแล้ว การต่อสู้ทางฝั่งของพวกเขาจึงดำเนินไปอย่างราบรื่นเป็นอย่างมาก แต่เรย์เดลก็อดไม่ได้ที่จะรู้สึกเป็นห่วงสถานการณ์การต่อสู้ในอีกฝั่ง","เพราะบนเรือเหาะมีกำลังพลไม่ถึงสองพันนายด้วยซ้ำ แล้วพวกเขาจะรับมือกับการโจมตีของกองทัพปราบปรามศาสนจักร ที่มีจำนวนถึงห้าหมื่นนายได้อย่างไร?","“ไม่ต้องเป็นห่วงไป ข้าคิดว่าท่านปรมาจารย์ลินน์จะต้องมีแผนการเตรียมเอาไว้อยู่แล้ว...”","แอนโธนี่เอ่ยปลอบใจ","“อีกอย่าง นี่คือการต่อสู้ที่ต้องเป็นพ่อมดระดับตำนานเท่านั้น ถึงจะสามารถเข้าร่วมได้ ในแง่หนึ่งแล้ว ไม่ว่าจะเป็นเจ้าหรือข้า พวกเราต่างก็เป็นได้เพียงแค่ตัวถ่วงเท่านั้นแหละ!”","เมื่อพูดมาถึงตรงนี้ แอนโธนี่ก็อดไม่ได้ที่จะส่ายหน้า ก่อนหน้านี้ในตอนที่หารือกันว่า จะรับมือกับกองทัพปราบปรามของศาสนจักรอย่างไร เขาก็ตระหนักได้ถึงจุดนี้แล้ว","เพราะจุดสำคัญที่บรรดาประธานสภาหารือกัน ล้วนอยู่ที่ว่าจะล่อให้นักบวชระดับตำนานของศาสนจักร ไปยังสถานที่ที่เหมาะสมได้อย่างไร เพื่อให้เวทมนตร์บทใหม่ของลินน์สามารถถูกปลดปล่อยออกมาได้อย่างราบรื่น จากนั้นก็เป็นเรื่องของวิธีหลีกเลี่ยงไม่ให้คนของฝั่งตัวเองได้รับบาดเจ็บ...","จะเห็นได้เลยว่าบรรดาประธานสภาต่างก็เชื่อมั่นในพลานุภาพของเวทมนตร์บทใหม่นี้เป็นอย่างมาก หรือกระทั่งไม่ได้มองกองทัพปราบปรามนับหมื่นของศาสนจักร อยู่ในสายตาเลยด้วยซ้ำ","และสาเหตุที่ตัดสินใจให้เรือเหาะมารับหน้าที่เป็นเหยื่อล่อ ก็เป็นเพราะว่าเจ้านี่มันบินได้ค่อนข้างเร็วนั่นเอง!","“ถ้าทุกอย่างดำเนินไปอย่างราบรื่นล่ะก็ บางทีพวกเราอาจจะสามารถกลับไปสนับสนุน และได้เห็นเวทมนตร์บทใหม่ของท่านปรมาจารย์ลินน์จากที่ไกลๆ ก็เป็นได้นะ!”","แอนโธนี่เอ่ยด้วยความคาดหวังเป็นอย่างมาก","เรย์เดลเองก็สงสัยเป็นอย่างมากเช่นกัน ว่าท้ายที่สุดแล้ว จะต้องเป็นเวทมนตร์แบบไหน ถึงจะสามารถทำให้ท่านลินน์มีความมั่นใจ ที่จะเอาชนะนักบวชระดับตำนานที่สามารถใช้พลังศักดิ์สิทธิ์เทพจุติ รวมถึงกองทัพปราบปรามนับหมื่นนายเหล่านั้นได้...","...","ในขณะที่เรย์เดลนำกองทหารปืนคาบศิลา ไปบุกโจมตีเมืองน้ำมันดินอย่างกะทันหันอยู่นั้น การต่อสู้บนท้องฟ้าก็เกิดการเปลี่ยนแปลงครั้งใหม่ขึ้นมาเช่นกัน!","ภายใต้การไล่ล่าของเครื่องบินรบรุ่นใหม่ อัศวินกริฟฟอนนับร้อยก็สูญเสียขวัญกำลังใจไปจนหมดสิ้นอย่างรวดเร็ว และทำได้เพียงแค่แตกพ่ายหลบหนีไปคนละทิศคนละทางเท่านั้น","ไม่ใช่ว่าไม่มีใครคิดที่จะไล่ตามเรือเหาะ เพื่อที่ก่อนตายจะยอมสละชีวิตร่วมกับศัตรูก็ยังดี แต่ปัญหาอยู่ที่ว่า เมื่อไม่มีการรังควานของมังกรไฟแล้ว พวกเขาก็ไม่มีทางไล่ตามสิ่งประดิษฐ์เล่นแร่แปรธาตุ ที่กำลังแล่นด้วยความเร็วสูงสุดเหล่านี้ได้ทันเลยแม้แต่น้อย!","เนื่องจากยาโซซีมีความเชี่ยวชาญในเวทมนตร์แปรสภาพ จึงมีประสบการณ์ในการบิน แถมเขายังมีพรสวรรค์ในด้านคณิตศาสตร์ในระดับหนึ่งอีกต่างหาก ดังนั้น เขาจึงได้รับเลือกให้เป็นนักบินเครื่องบินรบรุ่นแรกอย่างประสบความสำเร็จ","โดยเขาเอง ก็มีความสนใจในสิ่งประดิษฐ์เล่นแร่แปรธาตุรุ่นใหม่นี้อย่างเต็มเปี่ยมเช่นกัน ด้วยความเร็วของมันที่เหนือล้ำไปกว่าสิ่งมีชีวิตที่บินได้ทุกชนิดในความรู้ของเขา และยังเร็วกว่าเรือเหาะถึงสามเท่าตัว การใช้คำว่ารวดเร็วปานสายฟ้าแลบ ก็ยังไม่เพียงพอที่จะนำมาอธิบายเลยด้วยซ้ำ!","ยาโซซีกระตุ้นเวทมนตร์ตรวจจับความร้อนไปจนถึงขีดสุด อัศวินกริฟฟอนที่หนีกันไปคนละทิศคนละทางเหล่านั้น ก็กลายสภาพเป็นจุดสีแดงขนาดใหญ่ทีละจุด ซึ่งมองเห็นได้อย่างชัดเจนในยามค่ำคืน พวกเขาทำเพียงแค่ต้องเล็งไปที่เป้าหมาย และเปิดปืนกลกราดยิงใส่ ก็เพียงพอแล้ว!","ในจังหวะที่ยาโซซีหาเป้าหมายต่อไปพบ และเตรียมที่จะส่งอีกฝ่ายไปลงนรก ภายในระยะการรับรู้ ก็มีอัศวินกริฟฟอนตัวหนึ่งกำลังบินมาจากด้านล่าง และมุ่งหน้ามาทางนี้","“ผู้โชคร้ายงั้นรึ? บินสวนกระแสขึ้นมาแบบนี้ ช่างกล้าหาญจริงๆ เลยนะ!”","ยาโซซีเดาะลิ้นชื่นชม โดยคิดว่าเป็นอัศวินกริฟฟอนตัวใดตัวหนึ่งที่ถูกพวกเขาโจมตีจนร่วงหล่นลงไป และหลังจากที่รักษาอาการบาดเจ็บเสร็จแล้ว ก็กลับมายังท้องฟ้าเพื่อเข้าร่วมการต่อสู้อีกครั้ง ภายในใจของเขาจึงอดไม่ได้ที่จะเกิดความรู้สึกชื่นชมขึ้นมาเล็กน้อย","สำหรับศัตรูเช่นนี้ ย่อมต้องทุ่มเทอย่างสุดกำลังอยู่แล้วถึงจะถูก!","ยาโซซีหันหน้าเครื่องบินรบเข้าหา และพุ่งทะยานเข้าไปเผชิญหน้าในทันที ภายในความรู้สึก จุดสีแดงก็เข้ามาใกล้เรื่อยๆ ในขณะที่ปืนกลของเขาก็เข้าที่เรียบร้อยแล้ว","เมื่อระยะห่างเหลือเพียงแค่สามร้อยเมตร ยาโซซีก็กดคันบังคับอย่างแรง เปลวไฟสีแดงฉานปะทุออกมาจากปากกระบอกปืนกล ห่ากระสุนที่เชื่อมต่อกันเป็นสายปรากฏขึ้นบนท้องฟ้า...","จุดสีแดงขนาดใหญ่จุดนั้น ไม่ได้หลบหลีกเลยแม้แต่น้อย ปืนกลที่รุนแรงก็พุ่งเข้าชนอย่างจังในไม่ช้า!","“ง่ายดายอะไรเช่นนี้!”","รอยยิ้มปรากฏขึ้นบนใบหน้าของยาโซซี แต่ในเวลาต่อมาเขาก็พบว่ากระสุนปืนกลที่ยิงออกไปเหล่านี้ กลับหายเงียบไปราวกับกระสุนที่จมลงไปในทะเล มันไม่สามารถโจมตีอีกฝ่ายจนร่วงหล่นลงไปได้เลยแม้แต่น้อย ภายในใจของเขาถึงได้เริ่มตระหนักถึงความผิดปกติขึ้นมาลางๆ","ต่อมา สัญญาณเตือนที่รุนแรงก็ผุดขึ้นมาในใจ ยาโซซีจึงรีบเปลี่ยนทิศทางตามสัญชาตญาณ เพียงแต่มันก็สายเกินไปเสียแล้ว!","เสียงระเบิดของเหล็กกล้าที่ถูกฉีกกระชากดังสนั่นหวั่นไหวอยู่ที่ข้างหู ประกายไฟสาดกระเซ็นไปทั่ว ซึ่งมองเห็นได้อย่างชัดเจนในยามค่ำคืน","ยาโซซีรู้สึกเพียงแค่ว่าร่างกายสั่นสะท้าน หน้าอกทั้งหน้าอกราวกับกำลังจะระเบิดออก ด้วยการมองเห็นภาพเคลื่อนไหวอันยอดเยี่ยมของพ่อมดสายแปรสภาพ เขาจึงสามารถมองเห็นได้อย่างชัดเจนว่าสิ่งที่พุ่งเข้าชนตัวเองนั้น ก็คือกระสุนปืนกลสีเหลืองทอง!","อีกฝ่ายกลับสะท้อนการโจมตีของปืนกลกลับมาจนหมด!","ห่ากระสุนนับร้อยนัด ฉีกกระชากตัวเครื่องไปกว่าครึ่งโดยตรง ทำให้เครื่องบินรบทั้งลำสูญเสียความเร็วในทันที และร่วงหล่นลงสู่พื้นดินอย่างไม่อาจแก้ไขได้...","ยาโซซีฝืนทนต่อความเจ็บปวดอย่างรุนแรงทางร่างกาย โดยอาศัยเวทมนตร์แม่เหล็กไฟฟ้า ส่งข้อความเตือนออกไปหนึ่งข้อความ จากนั้นก่อนที่เครื่องบินรบจะร่วงหล่นลงไปอย่างสมบูรณ์ เขาก็เปิดฝาครอบป้องกันที่ด้านบนออก และกระโดดหนีออกมา...","‘แปรสภาพปีกค้างคาว’","ยาโซซีที่ลอยอยู่กลางอากาศ กล้ามเนื้อแผ่นหลังของเขาเริ่มเปลี่ยนรูปและขยายตัวออกมาจากบริเวณกระดูกสะบัก ปีกขนาดใหญ่ที่มีความยาวถึงสามเมตร ก่อตัวขึ้นในเวลาเพียงแค่หนึ่งวินาทีสั้นๆ","แม้ว่าเวทมนตร์แปรสภาพที่เขาศึกษา จะไม่ได้รับการยอมรับจากบรรดาปรมาจารย์ จนไม่ได้รับเหรียญตราดาวประกายพฤกษ์มาครอบครอง แต่เมื่อดูจากตอนนี้ มันก็ยังมีประโยชน์อยู่บ้าง...","เมื่อสัญญาณคลื่นแม่เหล็กไฟฟ้าถูกส่งออกไป บรรดาพ่อมดที่อยู่บนเรือเหาะและเครื่องบินรบ ก็พากันได้รับข้อความนี้เช่นกัน","[ปืนกลไร้ผล ศัตรู...อันตรายมาก!]","อันที่จริง ไม่จำเป็นต้องให้ใครมาเตือน ลินน์ก็เห็นยาโซซีที่ถูกยิงจนร่วงหล่นลงไป และลูเซียที่กำลังนั่งอยู่บนหลังกริฟฟอน ได้พุ่งทะยานมาทางนี้เรียบร้อยแล้ว","ไม่รู้ว่าเป็นเพราะใช้พลังอะไรหรือเปล่า กริฟฟอนที่อยู่ใต้ร่างของอีกฝ่าย ถึงได้มีความเร็วสูงมาก ปีกของมันกระพือจนเกิดเป็นภาพติดตา และความเร็วของมันก็กระทั่งสามารถไล่ตามเรือเหาะได้ทันแล้ว...","“นี่น่าจะเป็นสตรีศักดิ์สิทธิ์ของศาสนจักรคนนั้นใช่ไหม?”","แฮร์รอฟหรี่ตาลงเล็กน้อย ก่อนจะเอ่ยด้วยความชื่นชม","“มีความกล้าหาญไม่เบา ถึงกับกล้าตามมาเพียงคนเดียว!”","ลินน์เองก็รู้สึกประหลาดใจเล็กน้อยเช่นกัน แม้เขาจะรู้ดีว่าหลังจากที่จัดการกับมังกรไฟและกริฟฟอนบนท้องฟ้าไปแล้ว ระดับตำนานของศาสนจักรก็จะต้องยื่นมือเข้ามาสอดอย่างแน่นอน แต่เขากลับไม่คาดคิดเลยว่า คนที่ไล่ตามมา จะมีเพียงแค่ลูเซียคนเดียวเท่านั้น","นี่มันไม่ตรงกับแผนการที่เขาวางเอาไว้ก่อนหน้านี้เลย","ความไม่รู้ต่างหาก ที่เป็นสิ่งที่น่าหวาดกลัวที่สุด","“ให้เครื่องบินรบถอนกำลังออกไปก่อนเถอะ!”","ลินน์เอ่ยด้วยสีหน้าเคร่งขรึม และไม่นานคำสั่งก็ถูกส่งออกไปในรูปแบบของคลื่นแม่เหล็กไฟฟ้า","หลังจากที่เครื่องบินรบหลายลำในบริเวณใกล้เคียงได้รับคำสั่ง พวกเขาก็เริ่มหันหัวกลับทันที โดยละทิ้งความตั้งใจที่จะรุมโจมตีอีกฝ่าย แถมกระสุนและเชื้อเพลิงของพวกเขานั้นถูกใช้ไปจนแทบจะหมดแล้ว จึงไม่มีกำลังพอที่จะต่อสู้ได้อีกต่อไป..."]},{"n":434,"t":"พลังศักดิ์สิทธิ์ระดับตำนาน หยาดฝนดารา!","c":["ลูเซียที่กำลังนั่งอยู่บนหลังกริฟฟอน ย่อมสังเกตเห็นเครื่องบินรบที่กำลังพุ่งทะยานอยู่กลางอากาศเหล่านี้อย่างแน่นอน","ภายใต้เนตรศักดิ์สิทธิ์ของเธอ เวทมนตร์หักเหแสงที่สามารถทำให้ล่องหนได้นั้น ไม่ได้ส่งผลใดๆ เลยแม้แต่น้อย","“ความเร็วสูงสุดเกินกว่าสามร้อยกิโลเมตรต่อชั่วโมงงั้นรึ?”","ลูเซียคาดคะเนความเร็วของอีกฝ่ายคร่าวๆ ผ่านการเปลี่ยนตำแหน่งของเครื่องบินรบในอากาศได้อย่างรวดเร็ว","หากเปลี่ยนร่างกายให้อยู่ในสถานะพลังงาน ความเร็วเพียงแค่สามร้อยกิโลเมตรต่อชั่วโมง ย่อมไม่นับว่าเป็นอะไร แต่ด้วยสถานะในปัจจุบัน สิ่งประดิษฐ์เล่นแร่แปรธาตุรุ่นใหม่เหล่านี้ อาจจะสามารถสร้างภัยคุกคามได้บ้างจริงๆ","ฝ่ามือของลูเซียเปล่งประกายแสงศักดิ์สิทธิ์ออกมา โดยเตรียมที่จะทิ้งสิ่งประดิษฐ์เล่นแร่แปรธาตุรุ่นใหม่ทั้งหมดเหล่านี้เอาไว้ที่นี่","แต่ในวินาทีต่อมา บรรดาเครื่องบินรบก็เปลี่ยนทิศทาง และถอนกำลังไปในทิศทางที่แตกต่างกัน","“หนีไปแล้วงั้นรึ?”","ลูเซียขมวดคิ้วเล็กน้อย แต่ก็ไม่ได้สิ้นเปลืองพลังในการไล่ตาม เธอเปลี่ยนเป็นยกมือขึ้นชี้ไปยังท้องฟ้า โดยแสงศักดิ์สิทธิ์อันเจิดจรัสสายนั้นก็กระจายตัวออกไปในพริบตา และพุ่งตรงขึ้นไปบนท้องฟ้า ส่องสว่างไปทั่วทั้งผืนฟ้า","ความผันผวนของพลังศักดิ์สิทธิ์อันแข็งแกร่ง ทำให้ลินน์และคนอื่นๆ ที่อยู่ห่างออกไปหนึ่งกิโลเมตร ขนลุกซู่ไปทั้งตัว ต่อมาภายใต้การจับจ้องของพวกเขา แสงดาวอันเจิดจรัสนับไม่ถ้วนก็โปรยปรายลงมาจากท้องฟ้า","“นี่มัน...ดาวตกงั้นรึ?”","แฮร์รอฟมีสีหน้าเคร่งขรึม โดยเขาสัมผัสได้ถึงอันตรายอย่างรุนแรง จากแสงดาวที่ร่วงหล่นลงมาเหล่านี้","“ถ่ายทอดคำสั่งลงไป เตรียมการป้องกันให้พร้อม และมุ่งหน้าด้วยความเร็วสูงสุด พวกเราต้องรีบออกไปจากที่นี่เดี๋ยวนี้!”","ลินน์เองก็ตระหนักได้ถึงความผิดปกติ จึงรีบออกคำสั่งทันที","ขอบเขตที่แสงดาวครอบคลุมนั้น มีระยะทางถึงสามกิโลเมตร แม้เครื่องบินรบที่มีความเร็วสูง จะพุ่งทะยานไปตลอดทาง และสามารถหลบหนีออกจากพื้นที่นี้ได้สำเร็จ ก่อนที่แสงดาวจะร่วงหล่นลงมา แต่เรือเหาะที่เชื่องช้ากว่าเล็กน้อย กลับไม่ได้โชคดีเช่นนั้น...","แสงดาวที่ร่วงหล่นลงมา ได้แสดงให้เห็นถึงพลานุภาพอันน่าสะพรึงกลัวของมันในทันที โดยมันสามารถเจาะทะลุและหลอมละลายหนังพิเศษของถุงลมได้อย่างง่ายดาย แม้กระทั่งบรรดาพ่อมดที่อยู่ด้านบนก็ไม่มีข้อยกเว้น เวทมนตร์ป้องกันบนตัวของพวกเขาอ่อนแอยิ่งกว่ากระดาษเสียอีก และไม่นานก็ถูกหลอมละลายไปในประกายไฟที่ระเบิดขึ้น","เพียงพริบตาเดียว เรือเหาะกว่ายี่สิบลำก็ร่วงหล่นลงมาอย่างแรง ความเสียหายที่เกิดขึ้นจากการโจมตีเพียงครั้งเดียวนี้นั้น รุนแรงกว่าการโจมตีด้วยลมหายใจของมังกรไฟเสียอีก!","และนี่ก็คือพลังศักดิ์สิทธิ์ระดับตำนาน ‘หยาดฝนดารา’!","เรือเหาะที่ลินน์อยู่ ก็อยู่ในขอบเขตของ ‘หยาดฝนดารา’ เช่นกัน แต่สิ่งที่แตกต่างก็คือ แสงดาวเหล่านี้ล้วนถูกบาเรียมิติที่แฮร์รอฟสร้างขึ้น กีดกันเอาไว้ด้านนอกจนหมด แต่พวกเขากลับไม่มีกำลังพอที่จะไปช่วยเหลือเพื่อนร่วมรบคนอื่นๆ และทำได้เพียงแค่มองดูเรือเหาะแต่ละลำ ถูกกลืนกินไปในแสงดาวที่เต็มท้องฟ้าตาปริบๆ...","หลังจากที่ฃต้านทาน ‘หยาดฝนดารา’ เอาไว้ได้ แฮร์รอฟก็ไม่มีเวลาให้ได้พักหายใจเลยด้วยซ้ำ เพราะลูเซียที่กำลังนั่งอยู่บนหลังกริฟฟอน อยู่ห่างจากพวกเขาไม่ถึงสองร้อยเมตรแล้ว!","ซึ่งนี่ก็หมายความว่า อีกฝ่ายได้เข้ามาอยู่ในระยะการยิงของเลเซอร์แล้ว!","นักบินที่รับหน้าที่ควบคุมอุปกรณ์ลำแสง รีบเปิดฉากโจมตีทันที!","แต่ลินน์ที่อยู่ด้านข้างกลับต้องการพูดอะไรบางอย่างขึ้นมา แต่เขาก็ไม่สามารถบอกเอาไว้ได้ทัน เพราะความเร็วของแสงนั้น รวดเร็วมากจนเกินไปจริงๆ!","ในจังหวะเดียวกับที่ปุ่มถูกกดลง ลำแสงเลเซอร์อันรุนแรงก็ถูกยิงออกไป โดยที่เป้าหมายนั้นพุ่งตรงไปยังสตรีศักดิ์สิทธิ์ลูเซีย!","ความเร็วสามแสนกิโลเมตรต่อวินาที แทบจะไม่มีความเป็นไปได้ที่จะหลบหลีกได้พ้น แต่ลูเซียก็ไม่เคยคิดที่จะหลบหลีกอยู่แล้ว โดนก่อนหน้านี้ เธอก็เคยเห็นแสงเลเซอร์ที่แปลกประหลาดชนิดนี้มาแล้ว ย่อมเป็นไปไม่ได้ที่จะไม่ป้องกันตัว","ม่านใสๆ บานหนึ่งปรากฏขึ้นตรงหน้า แสงเลเซอร์สีแดงฉานราวกับทะลุผ่านผิวน้ำ มันหักเหและเฉียดผ่านร่างของสตรีศักดิ์สิทธิ์ไป จากนั้นลูเซียก็อ้าปากเอ่ยออกมา","“สะท้อน!”","เมื่อสิ้นเสียง ม่านใสๆ ก็กลายเป็นของแข็งในทันที แสงที่เข้ามาใกล้ถูกหักเหไปอย่างรวดเร็ว และวาดเป็นเส้นโค้งอันงดงามในความว่างเปล่า ก่อนจะหันกลับไปตัดเรือเหาะ!","โชคดีที่ลินน์ไหวตัวทันในตอนที่ตระหนักได้ถึงความผิดปกติ เขาจึงรีบดึงทับทิมที่ใช้สำหรับร่ายเวทเลเซอร์ออกมาโดยตรง ถึงได้สามารถหยุดการทำงานของเวทมนตร์ได้ทัน ก่อนที่แสงจะหักเหกลับมา จึงสามารถหลีกเลี่ยงความเสี่ยงที่จะถูกเวทมนตร์ของตัวเองฆ่าตายไปได้...","ข้อมูลที่สตรีศักดิ์สิทธิ์ของศาสนจักรสามารถทำลายเวทเลเซอร์ได้ เขาเคยพูดคุยกับออโรร่าและคนอื่นๆ ในที่ประชุมมาก่อนแล้ว และเห็นได้ชัดว่านักบินเรือเหาะเหล่านี้ ไม่มีคุณสมบัติพอที่จะเข้าร่วมการประชุมในครั้งนั้น","“ประกายดารา!”","ลูเซียเอ่ยปากขึ้นมาอีกครั้ง แสงดาวอันไร้ขอบเขตปรากฏขึ้นรอบกาย ราวกับแม่น้ำแห่งดวงดาว และพุ่งทะยานเข้าใส่เรือเหาะลำยักษ์","ไม่ว่าจะเป็นลินน์หรือแฮร์รอฟ ภายใต้แรงกดดันอันรุนแรงเช่นนี้ พวกเขาก็ไม่กล้าประมาทเลยแม้แต่น้อย ต่างก็พากันงัดเอาเวทมนตร์ป้องกันที่ทรงพลังที่สุดของตัวเองออกมา","“กำแพงมิติ”!","“เพลิงอมตะ”!","แม่น้ำแสงดาวอันไร้ขอบเขต ถูกทำให้อ่อนกำลังลงทีละชั้น ภายใต้การขัดขวางของเวทมนตร์สนามพลัง จากนั้นมันก็พุ่งเข้าปะทะกับเพลิงอมตะที่ลุกโชนขึ้นมาอย่างจัง จนเกิดเป็นเสียงระเบิดดังสนั่นหวั่นไหว!","แสงดาวและเปลวเพลิงที่ปะปนเข้าด้วยกัน คลื่นความร้อนที่ถูกพัดพาขึ้นมา ทำให้เรือเหาะที่อยู่ห่างออกไปหนึ่งร้อยเมตรสั่นสะเทือนอย่างรุนแรง ทั้งลินน์และแฮร์รอฟต่างก็มีสีหน้าตกตะลึง เพราะลูเซียที่กำลังนั่งอยู่บนหลังกริฟฟอน ได้พุ่งตัวออกมาจากแสงดาวอันเจิดจรัส และเพลิงอมตะที่ไม่มีวันดับมอด!","นี่มันสัตว์ประหลาดอะไรกัน?","ลินน์ถึงกับตกตะลึงไปทั้งตัว รอบกายของลูเซียถูกปกคลุมไปด้วยเพลิงอมตะ คลอรีนไตรฟลูออไรด์ที่ทรงพลังจนสามารถกลืนกินธาตุที่รู้จักทั้งหมดได้ ราวกับเป็นของปลอม มันไม่สามารถสร้างผลกระทบใดๆ ต่อสตรีศักดิ์สิทธิ์ท่านนี้ได้เลยแม้แต่น้อย...","“ไม่ ไม่ใช่สิ นี่มันคือภาพลวงตาต่างหาก!”","ลินน์ตอบสนองได้ในทันที และร้องเตือนเสียงดัง","สิ่งที่เป็นของปลอมไม่ใช่เปลวไฟของเขา แต่เป็นตัวของลูเซียเองต่างหาก!","ในเมื่อสิ่งที่พุ่งออกมาจาก ‘เพลิงอมตะ’ เป็นเพียงแค่ภาพลวงตา แล้วร่างจริงของอีกฝ่ายอยู่ที่ไหนกันล่ะ?","วินาทีต่อมา หลังจากที่อ้าปากพูด เรือเหาะที่เดิมทีสั่นเพียงเล็กน้อย ก็มีแนวโน้มที่จะแกว่งไปมาอย่างรุนแรงมากขึ้น จากนั้นห้องนักบินทั้งห้องก็ส่งเสียงเอี๊ยดอ๊าดอันน่าเกลียดออกมา ไม่ว่าจะเป็นพื้นใต้เท้าหรือราวกันตกรอบด้าน ต่างก็พังทลายลงอย่างรวดเร็ว กระทั่งถูกบีบจนระเบิดออกดื้อๆ!","ส่วนบรรดาคนที่อยู่บนเรือเหาะ ก็พากันพลิกตัวกระโดดลงมาจากราวกันตก และสามารถหนีรอดจากจุดจบที่จะถูกบีบจนแหลกละเอียดไปพร้อมๆ กันได้...","ลินน์เองก็ไม่มีข้อยกเว้น เขาหลบหนีออกมาจากเรือเหาะที่ถูกบีบจนระเบิด และกำลังร่วงหล่นลงสู่พื้นดินด้วยความเร่งที่รวดเร็วเป็นอย่างมาก...","เขาไม่ได้กังวลว่าจะตกลงไปตายมากนัก เพราะหลังจากที่เลื่อนขั้นเป็นจอมเวทผู้ยิ่งใหญ่ และสามารถควบคุมเวทมนตร์สนามพลังได้แล้ว เขาก็ไม่จำเป็นต้องพึ่งพาสิ่งใดเพื่อที่จะบินไปในอากาศ เพียงแต่ว่าความเร็วมันค่อนข้างช้าก็เท่านั้น","หากเป็นในเวลาปกติ นี่ก็คงไม่นับว่าเป็นจุดอ่อนอะไร แต่ตอนนี้มันต่างออกไป เพราะในสายตาของเขา ลูเซียกำลังนั่งอยู่บนหลังกริฟฟอน และพุ่งทะยานมาทางนี้","“เลือกข้าเป็นเป้าหมายงั้นรึ?”","ลินน์มีสีหน้าเคร่งขรึม ไม่รู้ว่านี่คือความโชคดีหรือโชคร้ายกันแน่...","บางทีอาจจะใช้ได้เพียงคำว่ารู้สึกเป็นเกียรติเท่านั้นแหละมั้ง!","เมื่อลินน์นึกคิด เพลิงอมตะเป็นกลุ่มๆ ก็พุ่งออกไป เพื่อขัดขวางไม่ให้อีกฝ่ายเข้ามาใกล้ คลื่นความร้อนที่เกิดจากการระเบิด ทำให้ความเร็วในการร่วงหล่นของเขาเพิ่มขึ้นอีกครั้ง!","แต่ลินน์ก็รู้ดีว่า นี่เป็นเพียงแค่การขัดขวางอีกฝ่ายเพียงเล็กน้อยเท่านั้น สายตาของเขาจึงรีบหันไปมองทับทิมที่หยิบลงมาจากเรือเหาะก่อนหน้านี้อย่างรวดเร็ว...","งั้นก็ลองใช้นี่ดูหน่อยก็แล้วกัน!","แสงเลเซอร์ระดับพลังงานขั้นที่ห้า จะสามารถทะลวงผ่านกระจกสะท้อนที่ไม่สมบูรณ์ และเอาชนะข้อบกพร่องที่ใหญ่ที่สุดของเวทมนตร์เลเซอร์ได้หรือไม่ นี่เป็นปัญหาที่ลินน์กำลังค้นหาคำตอบมาโดยตลอด","แม้จะยังไม่ได้รับการยืนยัน แต่ภายใต้สถานการณ์อันเลวร้ายนี้ เขาก็ทำได้เพียงแค่เสี่ยงลองดูเท่านั้น!"]},{"n":435,"t":"ทะลวงขีดจำกัด กระจกสะท้อนที่ถูกฟันขาด!","c":["‘071 เปิดโหมดโอเวอร์โหลด!’","ลินน์พูดขึ้นมาในใจ จากนั้นก็ประกบมือเข้าหากัน ทับทิมก็หมุนวนอยู่ในฝ่ามืออย่างรวดเร็ว","พร้อมกับพลังจิตวิญญาณของเขาที่พุ่งสูงขึ้นอย่างรวดเร็วเช่นกัน","สี่วงแหวน ห้าวงแหวน หกวงแหวน...","พลังการประมวลผลของเครือข่ายเวทมนตร์ถูกเรียกใช้อย่างรวดเร็ว ความรู้สึกที่พลังจิตวิญญาณล้นทะลัก ปรากฏขึ้นในใจอีกครั้ง","แต่สิ่งที่แตกต่างไปจากครั้งก่อนก็คือ ลินน์ไม่รู้สึกถึงอาการปวดหัวจนแทบจะระเบิดแต่อย่างใด ตรงกันข้าม เขากลับรู้สึกเหมือนได้ทะลวงผ่านสิ่งกีดขวางบางอย่าง จนทำให้สมองปลอดโปร่งเป็นอย่างมาก...","อันที่จริง ในตอนสงครามป้องกันเมืองหลวง ลินน์ก็ได้สัมผัสถึงขอบเขตของพ่อมดระดับสูงล่วงหน้ามาแล้ว แถมเขายังดื่มยาเวทมนตร์ระดับตำนานเข้าไปติดต่อกันถึงสองขวด แถมระยะห่างจากการเลื่อนขั้น ก็ขาดเพียงแค่การสะสมพลังอีกเพียงเล็กน้อย แล้วก้าวข้ามก้าวสุดท้ายนี้ไปให้ได้เท่านั้น!","ในตอนนี้ เมื่ออาศัยโอกาสนี้ ลินน์ย่อมสามารถทะลวงขึ้นเป็นจอมเวทผู้ยิ่งใหญ่ระดับห้าวงแหวนได้อย่างราบรื่น และสามารถควบคุมพลังการประมวลผลที่เครือข่ายเวทมนตร์มอบให้อย่างแท้จริง!","นี่ถือเป็นเรื่องน่ายินดีที่เหนือความคาดหมายอย่างไม่ต้องสงสัย!","แต่ในเวลานี้ เขาไม่มีเวลามามัวตรวจสอบสถานะปัจจุบันของตัวเองผ่านปัญญาประดิษฐ์สนับสนุนอีกต่อไป เขาได้ทุ่มเททั้งกายและใจ ไปกับการปลดปล่อยเวทมนตร์","ภายในใจของเขาเหลือเพียงแค่ความคิดเดียวเท่านั้น นั่นก็คือ บีบอัด บีบอัด บีบอัดเข้าไปอีก!","ภายในม่านสีดำที่มองไม่เห็น ทับทิมที่ดูดซับพลังงานเอาไว้เป็นจำนวนมาก สั่นสะเทือนอย่างรุนแรง ราวกับว่ามันพร้อมที่จะระเบิดออกในวินาทีต่อไป...","โดยก่อนหน้านี้ เขาต้องใช้เวลาเตรียมการเวทมนตร์บทนี้นานถึงสองนาทีกว่า แต่ตอนนี้ เขากลับสามารถย่นระยะเวลาลงให้เหลือไม่ถึงสามวินาทีได้!","หยาดเหงื่อผุดซึมขึ้นมาบนหน้าผากของลินน์ จากนั้นเขาก็คำรามออกมาเสียงดัง","“ทำลายมันซะ!”","ชั้นสะท้อนแสงที่ปิดสนิท แตกออกเป็นรูเล็กๆ ที่เล็กยิ่งกว่าเส้นผมในทันที ลำแสงอันเจิดจรัสพุ่งทะยานออกมาจากม่านสีดำ และเจาะทะลุฟ้าดินไปในพริบตา!","ในตอนที่มองออกว่าอีกฝ่ายเตรียมที่จะร่ายเวทมนตร์เลเซอร์ ลูเซียก็ควบแน่นม่านน้ำที่ล้อมรอบตัว ให้กลายเป็นกระจกสะท้อนแสงทรงกลมเรียบร้อยแล้ว ด้วยความเร็วของแสงที่รวดเร็วจนยากจะจินตนาการได้ ต่อให้เป็นเธอก็ไม่อาจหลบหลีกได้อย่างมีประสิทธิภาพเช่นกัน...","วิธีเดียวก็คือ การสะท้อนมัน หรือกระทั่งสะท้อนมันกลับไป!","แต่ในวินาทีเดียวกับที่ลำแสงเลเซอร์ถูกยิงออกมา ลูเซียที่อยู่ภายใต้การปกป้องของกระจกสะท้อน กลับสัมผัสได้ถึงวิกฤตลางๆ เพียงแต่มันสายเกินไปเสียแล้ว ความเร็วของแสงนั้น เร็วกว่าความเร็วในการส่งผ่านเซลล์ประสาทเสียอีก","ในวินาทีที่เธอตระหนักได้ถึงวิกฤต ลำแสงเลเซอร์ที่เล็กยิ่งกว่าเส้นผม และเจิดจรัสยิ่งกว่าแสงดาว ก็ทะลวงผ่านกระจกสะท้อน และเจาะทะลุร่างของเธอไปในพริบตา!","จากนั้นลำแสงก็เปลี่ยนทิศทางอย่างรวดเร็ว และฟันร่างนี้รวมถึงกริฟฟอนที่อยู่ใต้เท้าให้ร่วงหล่นลงมาพร้อมกัน!","ในความว่างเปล่า กระจกสะท้อนทรงกลมที่สะท้อนแสงไฟ ก็แตกกระจายออกเป็นเสี่ยงๆ และกลายเป็นเศษกระจกนับไม่ถ้วนที่โปรยปรายลงมาจากท้องฟ้า...","“น่าจะโดนแล้วใช่ไหม?”","ความคิดนี้ผุดขึ้นมาในหัวของลินน์ แต่ในตอนนี้เขาไม่มีเวลามาตรวจสอบผลงานของตัวเองอีกต่อไป เพราะตอนนี้เขาอยู่ห่างจากพื้นดินไม่ถึงสิบเมตรแล้ว!","ต่อให้จะใช้เวทมนตร์สนามพลังและเวทชะลอการร่วงหล่นพร้อมกัน ก็ยากที่จะหักล้างแรงกระแทก จากการตกลงมาจากที่สูงหลายพันเมตรในระยะเวลาอันสั้นเช่นนี้ได้อย่างสมบูรณ์","ลินน์ล้มลุกคลุกคลาน กลิ้งไปบนพื้นหลายตลบอย่างทุลักทุเล ถึงจะสามารถสลายแรงกระแทกนี้ไปได้ แต่เขาก็ยังคงรู้สึกเจ็บปวดไปทั่วทั้งร่างกายอยู่ดี หากเซลล์ในร่างกายของเขา ไม่ได้ถูกแทรกซึมไปด้วยพลังเวท บวกกับการรองรับของเวทมนตร์ ป่านนี้เขาคงตกลงมากลายเป็นกองเนื้อบดไปแล้ว...","เลือดหยดแล้วหยดเล่า ร่วงหล่นลงมาบนผืนดินอันรกร้างแห่งนี้อย่างต่อเนื่อง!","นี่ไม่ใช่เลือดของลินน์อย่างแน่นอน เพราะไม่นานเจ้าของของมัน ก็ร่วงหล่นลงมาจากท้องฟ้า!","มันคือกริฟฟอนตัวหนึ่งที่ถูกฟันขาดครึ่ง อวัยวะภายในและเลือดของมัน สาดกระเซ็นไปทั่วท้องฟ้าในระหว่างที่ร่วงหล่นลงมา...","สายตาของลินน์เพียงแค่กวาดมองผ่านไปเท่านั้น ก่อนจะไปหยุดอยู่ที่อีกฝั่ง ร่างของลูเซีย สตรีศักดิ์สิทธิ์ของศาสนจักร ปรากฏขึ้นตรงหน้าเขา โดยร่อนลงมาจากท้องฟ้าอย่างราบรื่น...","เลเซอร์ยิงพลาดงั้นรึ?","ลินน์เกิดความสงสัยขึ้นมาในใจ แต่ไม่นานเขาก็ปฏิเสธความคิดนี้ไป เพราะที่แขนซ้ายของสตรีศักดิ์สิทธิ์ตรงหน้า มีรอยเลือดกำลังไหลริน และหยดลงบนพื้นอย่างต่อเนื่อง","ชุดคลุมศักดิ์สิทธิ์ที่อีกฝ่ายสวมใส่อยู่ ก็ถูกฟันขาดเช่นกัน โดยมีรอยขาดตั้งแต่ไหล่ซ้ายลากยาวไปจนถึงขาขวา แต่ชุดก็ไม่ได้หลุดร่วงลงมา ราวกับถูกพลังบางอย่างยึดติดเอาไว้ด้วยกัน ซึ่งคาดว่าร่างกายภายในก็น่าจะอยู่ในสภาพที่ใกล้เคียงกัน...","ร่างกายถูกผ่าครึ่ง แต่กลับยังทำตัวเหมือนไม่มีอะไรเกิดขึ้น สภาพครึ่งเป็นครึ่งตายเช่นนี้ คงใช้ได้เพียงคำว่าน่าสะพรึงกลัวเท่านั้น","ลูเซียเพิ่งจะสัมผัสได้ถึงความผิดปกติบนร่างกาย นิ้วเรียวยาวลูบไล้ไปตามรอยขาดเบาๆ บาดแผลที่ถูกฟันก็ฟื้นฟูกลับคืนมาจนหมด!","มันคือวิชาลวงตา หรือว่าเป็นกายอมตะกันแน่?","ลินน์ขมวดคิ้วเล็กน้อย เขาเคยเจอกับปัญหายุ่งยากนี้มาตั้งแต่ตอนที่ต่อสู้กับเอ็ดเวลล์แล้ว","อีกฝ่ายราวกับฆ่าไม่ตาย ต่อให้จะได้รับบาดเจ็บสาหัสจนถึงขั้นถูกหั่น ก็ไม่เพียงพอที่จะทำให้ถึงตายได้","ตามที่พวกเขาคาดเดา เรื่องนี้น่าจะเกี่ยวข้องกับความลับในการเลื่อนขั้นสู่ระดับตำนาน...","“เป็นเวทมนตร์ที่ยอดเยี่ยมมาก!”","ลูเซียเอ่ยชื่นชม ก่อนจะหันไปมองลินน์ และเอ่ยถามขึ้นมา","“บอกหลักการของมันให้ข้าฟังหน่อยได้หรือไม่?”","ก่อนหน้านี้ เธอให้ความสนใจเวทมนตร์ลำแสงที่แปลกประหลาดชนิดนี้เป็นอย่างมาก","เดิมทีเธอคิดว่า มันก็เป็นเพียงแค่การประยุกต์ใช้หลักการของการรวมแสงและการหักเหของแสงเท่านั้น แต่หลังจากที่ได้ทดลองดู เธอก็พบว่ามันไม่ได้ง่ายดายขนาดนั้น!","ภายในนี้จะต้องมีความลับที่ลึกซึ้งยิ่งกว่าซ่อนอยู่อย่างแน่นอน...","“ทำไม เจ้าอยากจะเรียนรู้เวทมนตร์งั้นรึ?”","ลินน์รู้สึกประหลาดใจเล็กน้อย","หากเขาจำไม่ผิด ตามที่พระคัมภีร์กล่าวเอาไว้ เวทมนตร์คือพลังของปีศาจ จิตวิญญาณของผู้ที่ใช้พลังนี้ จะค่อยๆ แปดเปื้อน และหลังจากที่ตายไป ก็จะต้องตกนรก!","“ก็ไม่ใช่ว่าเบื้องสูงของศาสนจักรทุกคน จะหัวโบราณกันไปเสียหมดหรอกนะ”","ลูเซียเอ่ยพร้อมกับหัวเราะเบาๆ","“หากเจ้ายอมมอบความศรัทธาของเจ้าออกมา ข้าจะให้ท่านสันตะปาปาทำพิธีศีลจุ่มให้เจ้าด้วยตัวเอง เพื่อให้เจ้าก้าวเข้าสู่ขอบเขตที่ลึกล้ำยิ่งกว่า ขอบเขตระดับตำนานที่แท้จริง!”","“ไม่ต้องหรอก”","ลินน์ส่ายหน้า และเอ่ยตอบกลับไปตรงๆ","เบื้องสูงของศาสนจักร อาจจะเข้าใกล้ความเป็นตำนานที่แท้จริงมากกว่าบรรดาประธานสภาอย่างแฮร์รอฟ แต่พวกเขาก็ต้องถูกจำกัดอย่างแน่นอน ดีไม่ดี แม้แต่ชีวิตก็อาจจะต้องตกอยู่ในกำมือของผู้อื่น ซึ่งนี่คือสิ่งที่เขาไม่อาจยอมรับได้อย่างเด็ดขาด","แต่คำพูดของลูเซีย ก็ทำให้ลินน์เกิดลางสังหรณ์แห่งอันตรายขึ้นมาในใจ สตรีศักดิ์สิทธิ์ของศาสนจักรคนหนึ่ง มีอำนาจมากถึงขนาดที่จะสามารถอภัยโทษให้กับสมุนของปีศาจอย่างเขา หรือกระทั่งออกคำสั่งให้สันตะปาปาทำพิธีศีลจุ่มให้กับพ่อมดได้เลยเชียวรึ?","“น่าเสียดายจริงๆ!”","ลูเซียเอ่ยด้วยความเสียดาย ในช่วงหลายร้อยปีมานี้ นี่เป็นครั้งแรกที่เธอรู้สึกเสียดายคนมีความสามารถ แต่ดูเหมือนอีกฝ่ายจะไม่เข้าใจความปรารถนาดีของเธอเอาเสียเลย","“น่าเสียดายงั้นรึ?”","เสียงหัวเราะเยาะหยันดังขึ้นบนผืนดินอันรกร้างแห่งนี้","“เจ้าเอาเวลาไปเป็นห่วงตัวเองก่อนจะดีกว่านะ!”","เมื่อสิ้นเสียง โซ่ที่สร้างขึ้นมาจากอักขระเล่นแร่แปรธาตุนับสิบเส้น ก็ผุดขึ้นมาจากพื้นดิน และมัดขาทั้งสองข้างของลูเซียเอาไว้แน่น ก่อนจะลามขึ้นไปบนร่างกายของอีกฝ่าย...","ในเวลาไม่ถึงหนึ่งวินาที สตรีศักดิ์สิทธิ์ของศาสนจักรท่านนี้ ก็ถูกมัดเอาไว้อย่างแน่นหนาเสียแล้ว","วิกโตริโอที่เอ่ยปากเมื่อครู่ ก็ได้ปรากฏตัวขึ้นท่ามกลางความมืดมิดในยามค่ำคืน พร้อมกับร่างของออโรร่าและแฮร์รอฟก็ปรากฏขึ้นรอบๆ เช่นกัน โดยตีวงล้อมลูเซียเอาไว้ตรงกลาง"]},{"n":436,"t":"สตรีศักดิ์สิทธิ์ลูเซียคือเอลา และเธอคือเทพ!","c":["เมื่อประธานสภาทั้งสามคนมาถึง สถานการณ์ในสนามรบก็พลิกผันไปในพริบตา","ลูเซียที่ถูกพันธนาการอย่างแน่นหนาด้วยโซ่ที่สร้างขึ้นจากอักขระเล่นแร่แปรธาตุ กลับไม่มีสีหน้าเปลี่ยนไปเลยแม้แต่น้อย เธอเอ่ยออกมาอย่างเย็นชา","“ดูเหมือนว่าเป้าหมายของพวกเจ้าจะไม่ใช่น้ำมันดินสินะ...”","“น้ำมันดินก็ต้องเอาอยู่แล้วล่ะ แต่จะเป็นหลังจากที่จัดการกับพวกเจ้าเสร็จแล้วน่ะนะ”","แฮร์รอฟแค่นเสียงหัวเราะและเอ่ยตอบกลับไป","เมื่อครู่นี้เรือเหาะของพวกเขาไม่ได้บินไปอย่างไร้จุดหมาย การมุ่งหน้าไปยังเมืองน้ำมันดินก็เป็นเพียงแค่ข้ออ้างเท่านั้น!","ความสำคัญของปิโตรเลียมนั้นเป็นที่รู้กันดีโดยไม่ต้องพูด แต่เพราะเหตุนี้แหละ ที่นั่นถึงไม่สามารถใช้เป็นสนามรบได้!","“ทำไมถึงมีแค่คนเดียวล่ะ? แล้วประธานผู้พิพากษาคนนั้นไปไหนล่ะ?”","วิกโตริโอรู้สึกประหลาดใจเป็นอย่างมาก ตามแผนการก่อนหน้านี้ ลินน์และคนอื่นๆ จะต้องหาวิธีล่อให้ระดับตำนานของศาสนจักรทั้งสองคนมาที่นี่ เพื่อที่จะได้จัดการไปพร้อมกันทีเดียวถึงจะถูกสิ","“จัดการเจ้านี่ไปก่อนหนึ่งคน ก็ไม่เลวเหมือนกันนะ”","รอยยิ้มปรากฏขึ้นในแววตาของออโรร่า","หากต้องสู้แบบสี่ต่อสอง ก็ไม่แน่ว่า จะเกิดข้อผิดพลาดอะไรขึ้นมาได้ หากศัตรูฝืนทะลวงวงล้อมออกไปได้ มันก็คงจะจัดการได้ยาก","แต่ตอนนี้เป็นสี่ต่อหนึ่ง พวกเราจึงเป็นฝ่ายได้เปรียบ!","ออโรร่าคิดเช่นนั้น แต่ไม่นานเธอก็สังเกตเห็นถึงความผิดปกติ เพราะสตรีศักดิ์สิทธิ์ของศาสนจักรตรงหน้านั้น สงบนิ่งมากจนเกินไป ต่อให้จะถูกพวกเธอหลายคนตีวงล้อมเอาไว้ และถูกพันธนาการด้วยเวทมนตร์เล่นแร่แปรธาตุของวิกโตริโอ แต่บนใบหน้าของเธอกลับมองไม่เห็นร่องรอยของความวิตกกังวลเลยแม้แต่น้อย","“นี่คือแผนการทั้งหมดของพวกเจ้าในคืนนี้งั้นรึ?”","ลูเซียเอ่ยปากขึ้นมาด้วยความผิดหวังเล็กน้อย","การที่เป้าหมายของพ่อมดเหล่านี้ไม่ใช่น้ำมันดิน เป็นเรื่องที่อยู่นอกเหนือความคาดหมายของเธอจริงๆ แต่การอาศัยเวทมนตร์หักเหแสง เพื่อหลบซ่อนตัวอยู่ที่นี่ของวิกโตริโอและคนอื่นๆ รวมถึงค่ายกลเล่นแร่แปรธาตุที่ถูกจัดเตรียมเอาไว้ใต้ดิน ก็ไม่อาจรอดพ้นไปจากการรับรู้ของเธอได้ เพียงแต่เธอไม่ได้ใส่ใจมันมากนักก็เท่านั้นเอง","สำหรับเธอแล้ว ไม่ว่าจะเป็นหนึ่งคน...สี่คน...หรือสิบคน มันก็ไม่มีความแตกต่างใดๆ ทั้งนั้น!","“ในเมื่อมากันครบแล้ว งั้นก็ถือโอกาสจัดการไปพร้อมกันทีเดียวเลยก็แล้วกัน!”","สายตาของลูเซียกลายเป็นเย็นชาเป็นอย่างมาก ความผันผวนของพลังศักดิ์สิทธิ์อันน่าสะพรึงกลัวปะทุขึ้นมารอบกาย โซ่ที่พันธนาการตัวของเธอเอาไว้อย่างแน่นหนา สั่นสะเทือนขึ้นมาอย่างรุนแรง","อาณาเขตแห่งสรวงสวรรค์!","บทเพลงสรรเสริญอันยิ่งใหญ่ดังก้องไปทั่วท้องฟ้ายามค่ำคืน ต่อมา ต้นหญ้าและต้นไม้บนผืนดินอันรกร้างแห่งนี้ ก็พุ่งทะยานขึ้นมา เถาวัลย์ที่คดเคี้ยวชอนไชโผล่พ้นดิน และทำลายค่ายกลเล่นแร่แปรธาตุที่จัดเตรียมเอาไว้บนพื้นดินจนพังพินาศไปจนหมด","ลูเซียลอยตัวขึ้นไป ดวงตาทั้งสองข้างเปล่งประกายแสงราวกับดวงดาว โซ่ที่พันธนาการอยู่รอบกาย ขาดสะบั้นลงในพริบตา พื้นที่ทั้งหมดที่สามารถมองเห็นได้ด้วยตาเปล่า และผืนดินอันรกร้างทั้งหมดนี้ ก็กลายสภาพเป็นดินแดนศักดิ์สิทธิ์ที่เทพประทานให้ในชั่วพริบตา...","ลินน์ก้าวถอยหลังอย่างรวดเร็ว แต่ก็ยังคงถูกรวบเข้าไปในอาณาเขตแห่งสรวงสวรรค์อยู่ดี โดยสิ่งที่ทำให้เขาตกใจมากที่สุดก็คือ ตอนที่อีกฝ่ายกางอาณาเขตแห่งสรวงสวรรค์ออกมา เธอไม่ได้ใช้ถ้อยคำศักดิ์สิทธิ์เลยแม้แต่น้อย","ก่อนหน้านี้ ในตอนที่อีกฝ่ายใช้พลังที่เหนือล้ำไปกว่าระดับพระคาร์ดินัล ดูเหมือนว่าเธอจะไม่ต้องทำการสวดภาวนาล่วงหน้าเหมือนกับเอ็ดเวลล์เลย...","ในชั่วพริบตานั้น ข้อมูลทั้งหมดก็หลั่งไหลเข้ามาในหัวของเขาในทันที ความสับสนก่อนหน้านี้ก็ถูกคลี่คลายลงอย่างฉับพลัน!","“เจ้าไม่ใช่สตรีศักดิ์สิทธิ์ของศาสนจักร!”","รูม่านตาของลินน์หดเล็กลงเล็กน้อย ก่อนจะเอ่ยด้วยน้ำเสียงหนักแน่นเด็ดขาด","“เจ้าคือ เอลา งั้นรึ? เจ้า...เทพจอมปลอมนั่น?”","ทั่วทั้งศาสนจักร มีเพียงแค่คนเดียวเท่านั้น ที่มีอำนาจในการออกคำสั่งให้สันตะปาปา ทำพิธีศีลจุ่มให้กับพ่อมดผู้ชั่วร้าย และยังสามารถดึงเอาพลังแห่งสรวงสวรรค์ออกมาใช้ โดยที่ไม่ต้องใช้ถ้อยคำศักดิ์สิทธิ์ได้!","และนั่นก็คือ เอลา เทพที่ศาสนจักรให้ความเคารพศรัทธา!","“อะไรนะ?”","แฮร์รอฟ วิกโตริโอ และออโรร่า ต่างก็มองไปยังลูเซียที่กำลังลอยตัวอยู่ด้วยความตกตะลึง และภายใต้การแจ้งเตือนของลินน์ พวกเขาก็พากันตอบสนองได้ในที่สุด","ตามข้อมูลของพวกเขา สตรีศักดิ์สิทธิ์ที่ถูกคัดเลือกมาจากบรรดาแม่ชี ซึ่งจะมีการผลัดเปลี่ยนหมุนเวียนกันในทุกๆ หลายปี และอาศัยอยู่ในนครศักดิ์สิทธิ์อย่างสุขสบาย เป็นไปไม่ได้อย่างเด็ดขาดที่จะมีพลังเช่นนี้!","บางทีอาจจะเป็นวิธีการบางอย่าง ที่คล้ายคลึงกับพลังศักดิ์สิทธิ์เทพจุติก็เป็นได้!","และสิ่งที่ทำให้ทุกคนรู้สึกเย็นวาบขึ้นมาในใจมากยิ่งกว่าเดิมก็คือ อีกฝ่ายกลับมีสติสัมปชัญญะ และมีความคิดที่เฉียบแหลมเป็นอย่างมาก ซึ่งแตกต่างไปจากสิ่งที่พวกเขาสันนิษฐานเอาไว้ก่อนหน้านี้อย่างสิ้นเชิง...","นี่ถือเป็นสถานการณ์ที่เลวร้ายที่สุดอย่างไม่ต้องสงสัย!","“เจ้าค้นพบวิธีขจัดพิษแห่งความศรัทธาแล้วงั้นรึ?”","วิกโตริโอเอ่ยถามออกมาทีละคำ สีหน้าของเขาเต็มไปด้วยความหวาดหวั่น และยังมีความปรารถนาอันแรงกล้าปรากฏขึ้นมาอีกด้วย","เส้นทางบรรลุเทวะด้วยความศรัทธา...นั่นคือทางลัดที่ทอดไปสู่ขอบเขตที่สูงส่งยิ่งกว่า และเป็นเส้นทางที่เคยถูกพวกเขาทอดทิ้งมาแล้ว!","โดยอุปสรรคที่ใหญ่ที่สุดในเรื่องนี้ ก็คือพิษแห่งความศรัทธา!","มันจะกัดกร่อนเจตจำนงของมนุษย์ และทำให้กลมกลืนไปกับเทพในจินตนาการของผู้ศรัทธาอย่างสมบูรณ์แบบ!","ลูเซียไม่ได้ใส่ใจกับคำเรียกขานว่าเทพจอมปลอมเลยแม้แต่น้อย เธอมองลงมาจากที่สูง ดวงตาราวกับดวงดาวกวาดมองผู้คนทั้งสี่ที่อยู่รอบกาย และสุดท้ายก็ไปหยุดอยู่ที่ลินน์ ก่อนจะเอ่ยด้วยน้ำเสียงเย็นชา","“นี่คือโอกาสสุดท้าย หากเจ้าคิดจะเสียใจตอนนี้ มันก็ยังทันนะ!”","สิ่งที่ตอบกลับเธอมา ก็คือเพลิงอมตะที่ผุดขึ้นมารอบกายของลินน์...","ซึ่งความหมายนั้นก็ชัดเจนอยู่แล้ว มีเพียงแค่การต่อสู้เท่านั้น!","แม้ว่าพัฒนาการของเรื่องราว จะหลุดพ้นจากการควบคุมไปบ้างแล้ว แต่การเตรียมการทั้งหมดของพวกเขา ก็เพื่อการต่อสู้ในครั้งนี้!","ไม่มีเหตุผลใดที่จะต้องยอมจำนนก่อนที่จะเริ่มต่อสู้!","ลูเซียก็ไม่พูดพร่ำทำเพลงอีกต่อไป ในเมื่อไม่อาจใช้งานได้ งั้นก็เป็นภัยคุกคามที่ต้องถูกกำจัด!","ส่วนสิ่งประดิษฐ์เล่นแร่แปรธาตุ และเวทมนตร์แปลกใหม่ต่างๆ เหล่านั้น เธอย่อมสามารถค้นออกมาจากหัวของคนเหล่านี้ได้อย่างแน่นอน!","การต่อสู้พร้อมที่จะปะทุขึ้นในทุกเมื่อ!","แฮร์รอฟเป็นฝ่ายลงมือเป็นคนแรก มิติเวลาที่อยู่รอบกายบิดเบี้ยวไปมา พร้อมกับเสียงกระจกแตกดังขึ้นเบาๆ เส้นใยสีดำลุกลามไปทั่วภาพฉายอาณาเขตแห่งสรวงสวรรค์อย่างรวดเร็ว ในทุกที่ที่มันพาดผ่าน อาณาเขตก็พังทลายลง ต้นหญ้าและต้นไม้ต่างก็แตกสลาย...","และนี่ก็คือเวทมนตร์ระดับตำนานสายสนามพลัง คมดาบมิติเวลา!","ในขณะเดียวกัน อักขระเล่นแร่แปรธาตุที่ถูกทำลายบนพื้นดิน ก็เชื่อมต่อเข้าด้วยกันอย่างเงียบเชียบ และพุ่งเข้าล็อคตัวของลูเซียจากทุกทิศทุกทาง...","ลูเซียมีสีหน้าเฉยเมย โดยปล่อยให้โซ่และคมดาบไร้รูปที่ตัดผ่านมิติเวลา เจาะทะลุร่างกายของเธอ และถูกดึงเข้าไปในวังวนมิติ","แต่ในเวลานี้ ออโรร่ากลับรีบร้องเตือนออกมาด้วยความร้อนรน","“สิ่งที่พวกเจ้าโจมตี เป็นเพียงแค่ร่างมายา ระวังด้วยวิกโตริโอ ร่างจริงของเธออยู่ทางขวามือของเจ้า!”","สัญญาณเตือนดังขึ้นมาในใจของวิกโตริโอเช่นกัน อาณาเขตของเขาถูกอาณาเขตแห่งสรวงสวรรค์บีบอัด ให้เหลือเพียงแค่สามเมตรรอบกายเท่านั้น โดยที่พลังการรับรู้ของเขาก็อ่อนแอลงเป็นอย่างมากเช่นกัน","ไม่รู้ว่าตั้งแต่เมื่อใด ที่ร่างของสตรีศักดิ์สิทธิ์ลูเซียได้ปรากฏตัวขึ้นที่ด้านข้างของเขา มือขวาที่เปล่งประกายแสงศักดิ์สิทธิ์ ได้ทะลวงผ่านเวทมนตร์ป้องกันที่เขาสร้างขึ้นมาแล้ว...","ความหวาดกลัวที่พุ่งตรงเข้าไปถึงส่วนลึกของจิตวิญญาณ ผุดขึ้นมาในหัวของวิกโตริโอ...","สัมผัสที่หกอันรุนแรงทำให้เขาตระหนักได้ว่า หากถูกโจมตีเข้า ตัวเขาจะต้องตายอย่างแน่นอน!","โชคดีที่ลินน์และคนอื่นๆ ตอบสนองได้ทัน ลำแสงเลเซอร์อันรุนแรงพุ่งทะยานผ่านไป","แม้ว่าหลังจากที่สูญเสียทับทิมที่เป็นสิ่งพึ่งพาไปแล้ว เขาจะไม่สามารถกระตุ้นลำแสงเลเซอร์ระดับพลังงานขั้นที่ห้าออกมาได้ในพริบตา และมีความเสี่ยงที่จะถูกสะท้อนกลับมา แต่ลูเซียก็ไม่กล้าเสี่ยงกับความน่าจะเป็นนี้ จึงมีม่านน้ำที่ซ้อนทับกันเป็นชั้นๆ ปรากฏขึ้นรอบกาย และหักเหลำแสงไปได้หลายองศา แต่ก็ต้องสูญเสียโอกาสที่จะสังหารวิกโตริโอไปเช่นกัน...","เวทมนตร์สลายโครงสร้างขั้นสูง!","ดัชนีมรณะ","ภายใต้การร่วมมือกันของแฮร์รอฟและออโรร่า ม่านน้ำที่ซ้อนทับกันเป็นชั้นๆ เหล่านี้ ก็พังทลายลงในทันที ลำแสงเลเซอร์อันรุนแรงถูกฟันออกมาอีกครั้ง วิกโตริโอก็อาศัยโอกาสนี้ในการทิ้งระยะห่าง และหลุดพ้นจากการควบคุมของอีกฝ่าย..."]},{"n":437,"t":"สถานการณ์สิ้นหวัง สตรีศักดิ์สิทธิ์ผู้แข็งแกร่ง!","c":["เพียงแค่ปะทะกันครั้งแรก คนหลายคนที่อยู่ในเหตุการณ์ต่างก็ตระหนักได้ว่า ศัตรูในครั้งนี้รับมือได้ยากเย็นเพียงใด แม้จะถูกจำกัดด้วยข้อจำกัดทางร่างกาย ทำให้ลูเซียไม่สามารถปลดปล่อยพลังออกมาได้มากนัก แต่เธอก็ยังไม่ใช่สิ่งที่ระดับตำนานจอมปลอมอย่างพวกเขาจะสามารถเทียบเคียงได้อยู่ดี","เพียงแค่เผชิญหน้ากัน วิกโตริโอก็เกือบจะต้องเอาชีวิตมาทิ้งไว้ที่นี่เสียแล้ว!","เพลิงอมตะที่ลุกโชน ได้พุ่งทะยานขึ้นมาอย่างรวดเร็ว และสกัดกั้นความเป็นไปได้ที่ลูเซียจะไล่ตามมา","วิกโตริโอที่เพิ่งจะรอดพ้นจากความตายมาได้อย่างหวุดหวิด ก็ไม่กล้าที่จะหยั่งเชิงใดๆ อีก เขาจึงรีบเปิดใช้งานกับดักที่พวกเขาเตรียมเอาไว้ล่วงหน้าในทันที!","พร้อมกับเสียงระเบิดของดินและหินที่ดังสนั่นหวั่นไหว พื้นดินใต้เท้าของทุกคน ก็ทรุดตัวลงไปในทันที...","ไม่ว่าจะเป็นลูเซีย หรือพวกลินน์ ต่างก็ไม่อาจหลีกเลี่ยงการร่วงหล่นลงสู่เบื้องล่างไปพร้อมๆ กันได้!","แม้ว่าการบินบนอากาศ จะเป็นความสามารถพื้นฐานที่สุด เมื่อก้าวเข้าสู่ระดับจอมเวทผู้ยิ่งใหญ่ แต่ตอนนี้ทุกคนกลับถูกพลังอันแข็งแกร่งบางอย่าง ดึงดูดให้ร่วงหล่นลงสู่ใต้ดิน โดยทำให้ไม่สามารถบินขึ้นไปได้เลย!","และนี่ก็คือผลลัพธ์ที่ยิ่งใหญ่ที่สุด ในการค้นคว้าเวทมนตร์สนามพลังของแฮร์รอฟ ซึ่งเป็นการผสมผสานกับการเล่นแร่แปรธาตุของวิกโตริโอ จนสร้าง ‘อาณาเขตแรงโน้มถ่วง’ ขึ้นมา!","และสถานที่ที่ทุกคนกำลังร่วงหล่นลงไป ก็คือเหมืองแร่ที่ถูกขุดจนกลวง ที่ถูกทิ้งร้างเอาไว้ พร้อมกับบนกำแพงที่มีรอยด่างดำอยู่รอบๆ เต็มไปด้วยอักขระเล่นแร่แปรธาตุอันซับซ้อน","เวทมนตร์เหล่านี้ เป็นสิ่งที่วิกโตริโอและนักเล่นแร่แปรธาตุกว่าสามร้อยคน ใช้เวลาหนึ่งชั่วโมงในการจัดเตรียมขึ้นมาอย่างประณีต โดยมันไม่ได้เป็นเพียงแค่อาณาเขตแรงโน้มถ่วงง่ายๆ เช่นนี้อย่างแน่นอน!","“สายฟ้าจงมา!”","ลินน์ยกมือขึ้น ประกายสายฟ้าสว่างวาบขึ้นมาในฝ่ามือ อักขระเล่นแร่แปรธาตุอันซับซ้อนบนกำแพงก็สว่างขึ้นทีละตัว จากนั้นทุกคนที่อยู่ที่นั่น ก็ถูกกลืนกินไปในประกายสายฟ้าที่เต็มท้องฟ้า!","เสียงฟ้าร้องดังกึกก้องไปทั่วฟ้าดิน!","พลังแห่งสายฟ้าอันบ้าคลั่ง อาละวาดไปทั่วทั้งเหมืองโดยไม่แบ่งแยกมิตรศัตรู ประกายไฟสีขาวสว่างจ้ากระโดดไปมาอย่างต่อเนื่อง ราวกับตาข่ายสายฟ้าอันหนาแน่น ครอบคลุมทุกคนที่อยู่ที่นั่นเอาไว้ภายใน","ค่ายกลนี้ ก็คือค่ายกลสายล่อฟ้าที่เขาเคยใช้ที่เมืองหลวงนั่นเอง!","แม้จะขาดความช่วยเหลือจากปรากฏการณ์ทางธรรมชาติ แต่จากการที่วิกโตริโอ นักเล่นแร่แปรธาตุ ‘ระดับตำนาน’ เป็นผู้ปรับปรุงและร่ายเวทมนตร์ด้วยตัวเอง บวกกับพลังเวทของพ่อมดอีกสามร้อยคน และศิลาสายฟ้าอีกนับหมื่นก้อน ที่ใช้สำหรับชาร์จพลังงานให้กับปืนใหญ่แม่เหล็กไฟฟ้า","พลานุภาพของมันจึงมีแต่จะแข็งแกร่งขึ้น ไม่มีลดลงอย่างแน่นอน!","ในวินาทีที่ลูเซียร่วงหล่นลงมา เธอก็ถูกปกคลุมไปด้วยแสงอัสนี พร้อมกับธาตุต่างๆ ภายในอาณาเขตแห่งสรวงสวรรค์ ถูกเปลี่ยนให้กลายเป็นพลาสมาอุณหภูมิสูงในทันที...","ทั่วทั้งเหมืองแร่กลายเป็นเหมือนกับห้องซาวน่าที่มีอุณหภูมิสูงนับพันองศา ซึ่งมากพอที่จะระเหยความชื้นในร่างกายมนุษย์ให้แห้งเหือดได้ภายในเวลาไม่กี่วินาที!","ส่วนพวกลินน์ที่อยู่ภายใต้การโจมตีของสายฟ้าเช่นเดียวกัน แต่ในวินาทีที่ร่วงหล่นลงมา พวกเขาก็สร้างตาข่ายทองแดงทรงกลมขึ้นมารอบกาย ซึ่งนั่นก็คือ กรงฟาราเดย์!","สายฟ้าทั้งหมดถูกกีดกันเอาไว้ด้านนอก กระทั่งยังสามารถสัมผัสได้ถึงความเย็นสบายที่สายลมอิเล็กตรอนพัดพามาอีกด้วย","สำหรับจอมเวทผู้ยิ่งใหญ่ และพ่อมดระดับตำนานแล้ว การใช้พลังเวทในอาณาเขต เพื่อสร้างกรงฟาราเดย์ขึ้นมานั้นไม่ใช่เรื่องยาก แต่ที่ยากก็คือ การล่วงรู้ถึงหลักการของมันต่างหาก!","แสงอัสนีอันบ้าคลั่งสว่างวาบขึ้นมาอย่างต่อเนื่อง หลังจากที่ร่อนลงสู่พื้น ทั้งลินน์ แฮร์รอฟ ออโรร่า และวิกโตริโอ ต่างก็มองไปยังใจกลางเหมืองแร่ด้วยความตึงเครียดเป็นอย่างมาก","ในฐานะจุดศูนย์กลางของค่ายกล พลังแห่งสายฟ้าส่วนใหญ่ล้วนหลั่งไหลไปรวมกันอยู่ที่นั่น จนก่อตัวเป็นวังวนอัสนีขนาดยักษ์ พลาสมาสีขาวสว่างจ้าพุ่งพล่านไปมาอย่างต่อเนื่อง พร้อมกับแผ่กลิ่นอายอันน่าสะพรึงกลัวออกมา!","“เธอคงจะยังไม่ตายหรอกใช่ไหม?”","ออโรร่าเอ่ยขึ้นด้วยเสียงแผ่วเบา","“ก็อาจจะ...”","วิกโตริโอตอบกลับไปส่งๆ ค่ายกลนี้เป็นสิ่งที่เขาจัดเตรียมขึ้นมาด้วยตัวเอง เขาย่อมรู้ซึ้งถึงอานุภาพของมันเป็นอย่างดี","แม้ว่าพวกเขาจะไม่มีเวลาทำให้ค่ายกลนี้สมบูรณ์แบบ เนื่องจากศาสนจักรเป็นฝ่ายบุกโจมตีกะทันหัน แต่อานุภาพของมันก็เหนือล้ำยิ่งกว่าเวทมนตร์ระดับตำนานทั่วไปเสียอีก","วิกโตริโอจึงมั่นใจว่า หากเขาตกลงไปในกับดักนี้ ในสถานการณ์ที่ไม่อาจกางกรงฟาราเดย์ออกมาได้ เขาก็คงไม่มีทางรอดไปได้อย่างแน่นอน...","แต่เป้าหมายของพวกเขาคือสตรีศักดิ์สิทธิ์ของศาสนจักร เป็นลูเซียที่น่าจะเป็นร่างจุติของเทพจอมปลอมองค์นั้น ต่อให้จะเป็นวิกโตริโอ เขาก็ไม่มีความมั่นใจอย่างเต็มเปี่ยมเช่นกัน!","ในวินาทีต่อมา หลังจากที่ทั้งสองคนเอ่ยปาก วังวนอัสนีที่รวมตัวกันก็ระเบิดออก เผยให้เห็นภาพเบื้องหลัง!","หินบนพื้นผิวหลอมละลายกลายเป็นลาวาเดือดพล่านภายใต้อุณหภูมิสูง ส่วนเท้าทั้งสองข้างของลูเซีย ก็เหยียบย่ำลงบนลาวาอันร้อนระอุ ผิวพรรณอันขาวผ่องถูกอุณหภูมิสูงแผดเผาจนกลายเป็นสีแดงก่ำ หยาดเหงื่อเปียกชุ่มไปทั่วทั้งชุดคลุมศักดิ์สิทธิ์ รอบกายยังมีประกายไฟอันหนาแน่นห้อมล้อมเอาไว้อีกด้วย...","แต่ลินน์ที่ตาไวกลับมองเห็นว่า แสงอัสนีส่วนใหญ่ กลับไม่สามารถแทรกซึมเข้าไปใกล้ผิวของอีกฝ่ายในระยะสามเซนติเมตรได้ มีเพียงแค่ส่วนน้อยเท่านั้น ที่สามารถทะลวงผ่านสิ่งกีดขวาง และพุ่งเข้าสู่ร่างกายของอีกฝ่ายได้","สีหน้าของแฮร์รอฟ ออโรร่า และวิกโตริโอเปลี่ยนไปอย่างฉับพลัน ลินน์เองก็ใจหายวาบเช่นกัน","“ฉนวนไฟฟ้าอย่างงั้นรึ?”","เห็นได้ชัดว่า อีกฝ่ายอาศัยธาตุที่เป็นฉนวน เพื่อลดทอนพลานุภาพของเวทมนตร์สายฟ้าลงอย่างมหาศาล จากนั้นก็สกัดกั้นส่วนที่เหลือเอาไว้ และนี่ก็คือเหตุผลที่ทำให้อีกฝ่ายยังคงยืนหยัดอยู่ที่นั่นได้อย่างปลอดภัย...","และนี่ก็คือความแตกต่างที่ยิ่งใหญ่ที่สุด ระหว่างการมีสติปัญญากับไร้สติปัญญา ก่อนหน้านี้ เอลาที่เคยเป็นแม่มดมาก่อน ย่อมรับมือได้ยากกว่าบรรดาผู้ใช้พลังศักดิ์สิทธิ์ที่ ‘โง่เขลา’ เหล่านั้นมาก","บ้าเอ๊ย รู้อย่างนี้เขาเปลี่ยนไปใช้คลอรีนไตรฟลูออไรด์ตั้งแต่แรกก็ดีหรอก...","ลินน์แอบนึกเสียใจอยู่เงียบๆ","โดยเหตุผลหลักก็คือ การใช้ของพรรค์นั้นเป็นกับดัก มันง่ายมากที่พวกเขาจะถูกแผดเผาไปพร้อมกันด้วย","แต่เขาก็ไม่คาดคิดมาก่อนเหมือนกันว่า สตรีศักดิ์สิทธิ์ของศาสนจักร จะเป็นร่างจุติของเอลา กับดักสายฟ้าเช่นนี้ หากใช้เพื่อรับมือกับพวกนักบวชระดับตำนานที่ ‘ไร้การศึกษา’ เหล่านั้น มันก็เพียงพอแล้วแท้ๆ...","“ถอย!”","ลินน์เค้นคำสองคำนี้ออกมาอย่างยากลำบาก แผนการก่อนหน้านี้ของพวกเขาถือว่าล้มเหลวแล้ว!","“คิดจะหนีงั้นรึ?”","น้ำเสียงเย็นชาของลูเซียดังก้องอยู่ข้างหูของทุกคน ต่อมา แสงศักดิ์สิทธิ์อันเจิดจ้าบาดตาก็พุ่งทะยานออกมาจากร่างกาย","แสงศักดิ์สิทธิ์มีความเร็วที่รวดเร็วเป็นอย่างมาก มันครอบคลุมไปทั่วทั้งเหมืองในพริบตา โดยทุกคนที่อยู่ที่นั่น ต่างก็สัมผัสได้ในทันทีว่า อาณาเขตของตัวเองถูกกดดันหนักยิ่งกว่าเดิม ยิ่งไปกว่านั้น การเคลื่อนไหวของพวกเขาก็ยังเชื่องช้าลงเป็นอย่างมากอีกด้วย...","นั่นเป็นเพราะธาตุกำลังขัดขวางการเคลื่อนไหวของพวกเขาอยู่!","อันที่จริง หากปราศจากการปกป้องจากอาณาเขต ธาตุเหล่านี้ก็คงจะกลายเป็นอาวุธแหลมคม และพุ่งทะลวงร่างของพวกเขาจากทุกทิศทุกทางไปแล้ว!","“ประกายดารา!”","ลูเซียเอ่ยปากขึ้นมาอีกครั้ง ประกายแสงดาวอันเจิดจรัสพุ่งทะยานขึ้นมาท่ามกลางความว่างเปล่ารอบกาย มันหลอมรวมเข้าด้วยกัน ราวกับแม่น้ำแห่งดวงดาวสายยาว ก่อนจะพุ่งเข้าใส่ทุกคนที่อยู่ที่นั่น","แฮร์รอฟที่อยู่ใกล้ที่สุดเป็นผู้ประสบเคราะห์กรรมคนแรก เวทมนตร์ป้องกันรอบกายของเขาแตกกระจายออกเป็นเสี่ยงๆ ท่ามกลางสะเก็ดไฟที่ระเบิดออก เสียงกระดูกหักดังกรอบแกรบ หน้าอกของเขาถูกฉีกขาดเป็นรอยแผลขนาดใหญ่ เลือดสาดกระเซ็น ร่างทั้งร่างปลิวละลิ่ว และกระแทกเข้ากับพื้นดินอย่างแรง","“แฮร์รอฟ?”","วิกโตริโอร้องอุทานออกมา แต่เขาก็ไม่มีเวลาไปตรวจสอบอาการของอีกฝ่าย เพราะแม่น้ำแห่งดวงดาวสีคราม ได้พุ่งเข้ามาใกล้จนถึงตรงหน้าแล้ว","“เขตแดนม่านน้ำ!”","ในเวลานี้ ภาพมายาที่ซ้อนทับกันเป็นชั้นๆ ก็ปรากฏขึ้นภายในเหมืองแร่ในทันที ร่างของออโรร่านับสิบคน ปรากฏตัวขึ้นตรงหน้าของลูเซีย และล้อมรอบอีกฝ่ายเอาไว้ตรงกลาง ก่อนที่แม่น้ำแห่งดวงดาวจะพุ่งเข้ามาถึงตัว พวกเธอก็ประสานเสียงตะโกนออกมาพร้อมกัน","“กระจกสะท้อนฟ้าดิน!”","ประกายแสงดาวที่พุ่งทะยานเข้ามา ราวกับจมหายลงไปในทะเลสาบ มันถูกเขตแดนม่านน้ำที่ปรากฏขึ้นดูดซับเข้าไปจนหมด จากนั้นมันก็ถูกสะท้อนกลับไปในเส้นทางเดิม"]},{"n":438,"t":"นรกจุติลงมาบนโลกมนุษย์!","c":["ประกายแสงดาวอันเจิดจรัส ถูกเวทมนตร์ลับกระจกสะท้อนฟ้าดิน ที่ออโรร่าร่ายออกมา สะท้อนกลับไปในเส้นทางเดิม ทำให้สีหน้าของลูเซียปรากฏความประหลาดใจขึ้นมาเล็กน้อย ก่อนจะเอ่ยออกมาหนึ่งคำ","“ทำลาย!”","ในวินาทีที่สิ้นเสียง ประกายแสงดาวที่ถูกสะท้อนกลับไป ก็ระเบิดออกในวินาทีที่หลุดพ้นจากผิวกระจก และกลายเป็นสะเก็ดไฟดาราอันรุนแรง","ท่ามกลางสะเก็ดไฟที่พุ่งทะยานขึ้น และคลื่นกระแทกที่แผ่ขยายออกไป ภาพมายานับสิบก็ถูกทำลายจนแหลกสลายไปในพริบตา!","กำแพงหินหนาหนึ่งเมตรภายในเหมืองแร่ ถูกเฉือนออกไปโดยตรง ลวดลายเวทมนตร์ทั้งหมดถูกทำลายจนพินาศย่อยยับ!","และในเวลาเพียงแค่สองถึงสามวินาทีนี้ พวกลินน์ก็ได้หลบหนีไปอย่างไร้ร่องรอยแล้ว...","แต่เธอไม่ได้รู้สึกกังวลเลยแม้แต่น้อย เพราะภาพฉายอาณาเขตแห่งสรวงสวรรค์ ได้แผ่ขยายออกไปครอบคลุมทั่วทั้งภูเขาแล้ว และทุกการเคลื่อนไหวของอีกฝ่าย ก็ล้วนตกอยู่ภายใต้การควบคุมของเธอ!","ลูเซียไม่ได้รีบร้อนที่จะไล่ตามไป แต่เธอกลับก้มลงมองดู ชุดคลุมศักดิ์สิทธิ์อันขาวสะอาดบนร่างกายของเธอ ถูกลำแสงเลเซอร์อันน่าสะพรึงกลัวฟันขาดไปก่อนหน้านี้แล้ว และท่ามกลางพลังแห่งสายฟ้าอันบ้าคลั่งเมื่อครู่ มันก็ยิ่งถูกทำลายด้วยการแยกสลายด้วยไฟฟ้า จึงต้องพึ่งพาพลังศักดิ์สิทธิ์ของเธอค้ำจุนเอาไว้","ลูเซียฉีกชุดคลุมบนร่างกายออกโดยตรง และอาศัยพลังศักดิ์สิทธิ์ สร้างชุดคลุมศักดิ์สิทธิ์ขึ้นมาใหม่ ก่อนจะเอ่ยพึมพำด้วยใบหน้าที่เย็นชาปานน้ำแข็ง","“ผู้ลบหลู่เทพจะต้องตกลงสู่นรก!”","ถ้อยคำแห่งเทพกลายเป็นความจริง!","ภาพฉายอาณาเขตแห่งสรวงสวรรค์ทั้งหมด เปลี่ยนแปลงไปอย่างเงียบเชียบ โดยมีเหมืองแร่แห่งนี้เป็นศูนย์กลาง และแผ่ขยายออกไปทุกทิศทุกทางอย่างรวดเร็ว","เสียงคำรามและเสียงกรีดร้องอันน่าสะพรึงกลัว ดังขึ้นมาจากความว่างเปล่า กลิ่นอายอันน่าสะพรึงกลัวพุ่งพล่านอย่างบ้าคลั่ง ดินแดนแห่งความสุขบนโลกมนุษย์อันไร้ขอบเขต กลายสภาพเป็นนรกไร้ก้นบึ้งในชั่วพริบตา...","...","ในขณะเดียวกัน พวกลินน์ที่ถูกบีบให้ต้องหลบหนี ก็กำลังเร่งฝีเท้าไปตามอุโมงค์เหมืองแร่ที่ถูกทิ้งร้าง","“ท่านประธานสภาแฮร์รอฟ ท่านไม่เป็นอะไรใช่ไหม?”","ลินน์เอ่ยถามด้วยความเป็นห่วง","ในตอนนี้ บนใบหน้าของแฮร์รอฟเต็มไปด้วยคราบเลือด หน้าอกของเขาถูกเจาะเป็นรูขนาดใหญ่ เสื้อผ้าก็ขาดวิ่น เสียงหายใจของเขาราวกับกลองที่แตกและรั่วซึมออกมาอย่างต่อเนื่อง ดูแล้วน่าเวทนาเป็นอย่างมาก!","“ยังดี ไม่ถึงตายหรอก!”","แฮร์รอฟหยิบ ‘น้ำแห่งชีวิต’ ออกมาอย่างยากลำบาก และกระดกมันลงไปโดยตรง","บาดแผลขนาดใหญ่บนหน้าอก สมานตัวอย่างรวดเร็วจนมองเห็นได้ด้วยตาเปล่า!","ยาเวทมนตร์ระดับตำนานชนิดนี้ ย่อมล้ำค่าเป็นอย่างมากอย่างไม่ต้องสงสัย แต่ตอนนี้เห็นได้ชัดว่าไม่ใช่เวลาที่จะมามัวประหยัด ชีวิตย่อมมีความสำคัญมากกว่าของนอกกายเหล่านั้น...","“ดูเหมือนว่าแผนการที่เราวางเอาไว้ จะล้มเหลวซะแล้วสิ ตอนนี้จะทำยังไงกันดี?”","ออโรร่าสัมผัสได้ว่าเวทมนตร์ร่างจำลองของเธอถูกทำลายไปจนหมดแล้ว จึงได้แต่เอ่ยพึมพำด้วยสีหน้าเคร่งขรึม","ตามที่พวกเขาคาดการณ์เอาไว้ก่อนหน้านี้ก็คือ ล่อระดับตำนานของศาสนจักรทั้งสองคนมาที่นี่ และร่วมมือกันต่อสู้แบบสี่ต่อสอง จากนั้นก็อาศัยเวทมนตร์ระดับตำนานธาตุสายฟ้า ที่สร้างขึ้นจากค่ายกลเล่นแร่แปรธาตุ เพื่อบีบให้อีกฝ่ายตกที่นั่งลำบาก โดยหลอกล่อให้อีกฝ่ายเปิดประตูแห่งสรวงสวรรค์ออกมา!","จากการค้นคว้าของแฮร์รอฟและคนอื่นๆ เกี่ยวกับประตูมิติภายในเหมืองคริสตัลเวทมนตร์ การที่ตัวตนที่ทรงพลังมากเท่าไหร่ การข้ามมิติก็ยิ่งยากลำบากมากขึ้นเท่านั้น","ตัวตนอย่าง เอลา แม้จะมีการเสียสละชีวิตของนักบวชระดับตำนาน เพื่อให้ได้มาซึ่งพลังงานที่มากพอ แต่ตั้งแต่ตอนที่เปิดประตู จนถึงตอนที่เทพจอมปลอมนั่นก้าวออกมาจากประตู ก็ต้องใช้เวลาประมาณหกถึงเจ็ดวินาที!","และเวลานี้ ก็มากพอที่เขาจะโยนเวทมนตร์ระเบิดนิวเคลียร์เข้าไปแล้ว!","เพียงแต่ลินน์ไม่คาดคิดมาก่อนเลยว่า อีกฝ่ายเพียงแค่อาศัยร่างจุติ ก็สามารถบีบให้พวกเขาตกอยู่ในสถานการณ์สิ้นหวังได้แล้ว!","กับดักที่พวกเขาสร้างขึ้นมาอย่างประณีต ก็ถูกฉนวนไฟฟ้าลดทอนพลานุภาพลง จนไม่อาจสร้างผลลัพธ์ที่ควรจะเป็นได้เลย...","“การโจมตีแบบปกติ ไม่สามารถฆ่าสตรีศักดิ์สิทธิ์ของศาสนจักรคนนี้ได้ ต่อให้จะหั่นร่างของเธอก็ไม่มีประโยชน์ เมื่อครู่ข้าได้ลองดูแล้ว!”","ลินน์เอ่ยเตือนขึ้นมา","แฮร์รอฟและคนอื่นๆ ต่างก็มีสีหน้าเคร่งขรึม แต่ไม่นานพวกเขาก็ผ่อนคลายลง","ในตอนสงครามเมืองหลวง เอ็ดเวลล์ก็เคยแสดงความสามารถคล้ายกับความเป็นอมตะออกมา แต่สุดท้ายเขาก็ยังคงถูกพวกตนสังหารไปได้อยู่ดี","ซึ่งนี่ก็พิสูจน์ให้เห็นแล้วว่า ความเป็นอมตะนั้นไม่ได้เป็นอมตะอย่างแท้จริง แต่มันก็มีขีดจำกัดอยู่เหมือนกัน!","บางทีอาจจะต้องใช้พลังงานจำนวนมหาศาล หรือไม่ก็ความสามารถในการรักษาอาจจะมีขีดจำกัด","“งั้นก็คงต้องใช้เวทมนตร์บทใหม่ของเจ้าแล้วล่ะ”","วิกโตริโอมองไปยังลินน์ ด้วยอานุภาพของเวทมนตร์ระเบิดนิวเคลียร์ หากอยู่ในจุดศูนย์กลางของการระเบิด รับรองได้เลยว่าจะต้องไม่เหลือแม้แต่เถ้ากระดูกอย่างแน่นอน!","และย่อมไม่มีความเป็นไปได้ที่จะฟื้นฟูร่างกายกลับคืนมา","“แต่จะเอามาใช้ที่นี่จริงๆ งั้นรึ? เพียงเพื่อจัดการกับร่างจุติร่างเดียวเนี่ยนะ?”","ออโรร่าเอ่ยด้วยความลังเลใจ","“ด้วยพลังที่อีกฝ่ายแสดงออกมา มันไม่ใช่แค่การจุติเทพธรรมดาอย่างแน่นอน!”","แฮร์รอฟเอ่ยด้วยความหนักแน่นเด็ดขาด","ลินน์นิ่งเงียบไม่พูดอะไร อันที่จริง เขาไม่สามารถหาโอกาสที่จะใช้เวทระเบิดนิวเคลียร์ได้เลยด้วยซ้ำ!","ท้ายที่สุดแล้ว ระยะห่างระหว่างพวกเขาทั้งสองฝ่ายนั้นใกล้กันมากเกินไป ในสถานการณ์เช่นนี้ การจุดระเบิดนิวเคลียร์ ก็คือการจบชีวิตไปพร้อมกันอย่างไม่ต้องสงสัย...","ลินน์คิดถึงเรื่องนี้ได้ แฮร์รอฟและคนอื่นๆ ย่อมเข้าใจดีเช่นกัน","และวิธีแก้ปัญหาที่ตามมาก็ใช่ว่าจะไม่มี","นั่นก็คือการแบ่งคนออกไปคนหนึ่ง เพื่อถ่วงเวลาลูเซียเอาไว้ชั่วคราว จากนั้นก็ร่ายเวทมนตร์บทนี้ และให้คนอื่นๆ หลบหนีไป!","แต่ปัญหาอยู่ที่ว่า เพียงแค่คนๆ เดียว จะสามารถถ่วงเวลาเอาไว้ได้จริงๆ งั้นรึ?","ขนาดพวกเขาร่วมมือกัน ยังยืนหยัดอยู่ได้ไม่นานเลย แถมมันก็ไม่เพียงพอที่จะถ่วงเวลา จนกว่าจะหลุดพ้นจากรัศมีของการระเบิดด้วย","แล้วใครจะเป็นผู้เสียสละล่ะ?","“คงต้องทิ้งคนไว้สองคน และให้หนีไปสองคนแล้วล่ะ!”","แฮร์รอฟถอนหายใจออกมา ก่อนจะมองไปทางลินน์ และเอ่ยถามขึ้นมาอีกครั้ง","“เวทมนตร์ของเจ้านั้น ให้คนอื่นร่ายแทนได้หรือไม่?”","หากสามารถทำได้ เช่นนั้นผู้เสียสละ ย่อมไม่ถึงคิวของดาวรุ่งแห่งเวทมนตร์อย่างลินน์อย่างแน่นอน","“เรื่องมันยังไม่เลวร้ายถึงขั้นนั้นหรอก...”","จู่ๆ ลินน์ก็เอ่ยขัดความคิดของทุกคนขึ้นมา","“พวกท่านยังจำได้หรือไม่ ว่าข้าให้พวกเขาอพยพออกไปโดยวิธีใด?”","เมื่อได้ยินเช่นนั้น ภายในใจของแฮร์รอฟและคนอื่นๆ ก็เกิดความเคลื่อนไหวขึ้นมา ทุกคนต่างก็รู้ดีว่า คำว่า ‘พวกเขา’ ที่ลินน์เอ่ยถึง หมายถึงบรรดาพ่อมดที่รับหน้าที่ดูแลค่ายกลเล่นแร่แปรธาตุของวิกโตริโอ","“นอกจากนี้ ท่านพอจะมีวิธีทำลายภาพฉายอาณาเขตแห่งสรวงสวรรค์นี้หรือไม่? ท่านประธานสภาแฮร์รอฟ...”","ลินน์เอ่ยถามขึ้นมาอีกครั้ง ซึ่งเรื่องนี้มีความสำคัญเป็นอย่างมาก","เขาจำได้ว่า ในตอนสงครามเมืองหลวงครั้งที่แล้ว แฮร์รอฟเป็นคนฟันอาณาเขตแห่งสรวงสวรรค์ที่เอ็ดเวลล์สร้างขึ้นจนขาดสะบั้น!","“ยาก ยากมาก!”","แฮร์รอฟขมวดคิ้วแน่น","แม้จะดูเหมือนว่านี่เป็นเพียงแค่ภาพฉายของอาณาจักรเทพบนโลกแห่งความเป็นจริง แต่ผู้ร่ายกลับเป็นถึงร่างจุติของเอลา ความแข็งแกร่งของมัน ย่อมไม่ใช่สิ่งที่อาณาเขตของเอ็ดเวลล์จะสามารถเทียบเคียงได้อย่างแน่นอน!","“แค่ยาก แต่ก็ไม่ได้หมายความว่าจะเป็นไปไม่ได้ไม่ใช่หรือ?”","ลินน์ย้ำขึ้นมาอีกครั้ง","“ต่อให้จะยากแค่ไหนก็ต้องทำให้ได้!”","ออโรร่าก็เอ่ยเสริมขึ้นมาเช่นกัน","ในขณะที่แฮร์รอฟกำลังจะเอ่ยปากตอบกลับ แสงสีแดงก็ลุกลามมาจากทางด้านหลังของพวกเขา ชั้นหินอันแข็งแกร่งใต้เท้าของพวกเขา กลายสภาพเป็นโคลนตมอันเน่าเหม็นในทันที พร้อมกับมือโครงกระดูกสีขาวผุดขึ้นมาจากใต้ดิน โดยหวังที่จะดึงลินน์และคนอื่นๆ ลงไป","กำแพงรอบด้านหลุดร่อนและผุพังอย่างต่อเนื่อง บนกำแพงที่พังทลาย ปรากฏใบหน้าของมนุษย์ที่บิดเบี้ยวโผล่ออกมา และที่ด้านหน้าของพวกเขา ซึ่งเป็นจุดที่สามารถมองเห็นได้ ก็มีปีศาจหน้าตาอัปลักษณ์นับสิบตัว คลานขึ้นมาจากพื้นดินที่เต็มไปด้วยโคลนตม และขวางทางของพวกเขาเอาไว้...","กลิ่นเหม็นเน่าอันรุนแรงพัดโชยเข้ามาปะทะใบหน้า ซึ่งมากพอที่จะทำให้ผู้คนรู้สึกหายใจไม่ออก และหวาดกลัว...","และนี่ก็คือนรกที่ถูกบรรยายเอาไว้ในพระคัมภีร์ ซึ่งได้จุติลงมาบนโลกมนุษย์แล้ว!"]},{"n":439,"t":"นี่คือเวทมนตร์บทสุดท้ายของข้า มหาเวทระเบิดนิวเคลียร์!","c":["[พระคัมภีร์ศักดิ์สิทธิ์บทนรก เล่มที่สาม บทที่สิบสอง ผู้ที่กระทำความผิดมหันต์ จะต้องถูกโยนลงสู่นรก และรับทัณฑ์ถลกหนัง!]","บันทึกเกี่ยวกับนรกในพระคัมภีร์ ผุดขึ้นมาในหัวของลินน์ ซึ่งหนึ่งในนั้นก็คือนรกถลกหนัง ที่ใช้สำหรับลงทัณฑ์ผู้ที่กระทำความผิดมหันต์!","และปีศาจที่อยู่ตรงหน้าเหล่านี้ ก็คือผู้ลงทัณฑ์ ใบหน้าของพวกมันโชกโชนไปด้วยเลือด จนแทบจะมองเห็นรูทั้งห้าบนใบหน้า ซึ่งก็คือดวงตาทั้งสองข้าง รูจมูก และปาก","แขนขาที่บิดเบี้ยว ผิวหนังราวกับถูกคนลอกออกไป ทั่วทั้งร่างเหลือเพียงแค่กล้ามเนื้อและกระดูกที่อาบชุ่มไปด้วยเลือด ในมือยังถือมีดที่ใช้สำหรับลงทัณฑ์ ราวกับฝูงซอมบี้ ที่กำลังเดินกะเผลกๆ ตรงเข้ามาหาพวกเขา...","หากเป็นชาวบ้านธรรมดา หรือพวกพ่อมดฝึกหัด ที่ได้เห็นภาพอันน่าสะพรึงกลัวเช่นนี้ ก็คงจะตกใจจนจิตใจพังทลาย แต่แฮร์รอฟและคนอื่นๆ กลับไม่มีปฏิกิริยาใดๆ เลย","พวกเขาต่างก็รู้ดีว่า นี่เป็นเพียงแค่หมากใช้แล้วทิ้ง ที่ลูเซียใช้เพื่อสกัดกั้นการเคลื่อนไหวของพวกเขาเท่านั้น!","แต่ศัตรูระดับนี้ริอาจคิดที่จะหยุดยั้งฝีเท้าของพวกเขาได้ นี่ก็ถือว่าประเมินพวกเขาต่ำเกินไปแล้ว!","“ลำแสงสลายโครงสร้าง!”","แฮร์รอฟเป็นฝ่ายลงมือ","เพียงแค่การโจมตีเพียงครั้งเดียว บรรดาผู้ลงทัณฑ์ที่ขวางทางอยู่เบื้องหน้า ก็ถูกพลังที่มองไม่เห็นฉีกกระชากเป็นชิ้นๆ และกลายเป็นกองเนื้อเละๆ แต่ก้อนเนื้อเหล่านี้ราวกับมีชีวิต แม้จะถูกสลายจนกลายเป็นก้อนเลือดที่เละเทะไปแล้ว แต่มันก็ยังคงดึงดูดเข้าหากัน ราวกับต้องการที่จะรวมตัวกันอีกครั้ง","โชคดีที่ก่อนที่มันจะรวมตัวกันได้ เพลิงอมตะที่ลุกโชนก็ม้วนตัวเข้ามา และแผดเผาก้อนเลือดเหล่านี้จนกลายเป็นเถ้าถ่าน...","คลอรีนไตรฟลูออไรด์ที่สามารถกลืนกินธาตุได้บางส่วน ย่อมเหมาะสมเป็นอย่างยิ่ง ที่จะใช้รับมือกับปีศาจที่สามารถฟื้นฟูตัวเองได้เหล่านี้!","แต่ไม่นาน ลินน์ก็พบว่า ท่ามกลางทะเลเพลิงที่พุ่งพล่านนั้น มีร่างสูงใหญ่พุ่งทะยานออกมา","มันเป็นปีศาจขนาดยักษ์ ซึ่งแตกต่างจากผู้ลงทัณฑ์ตัวอื่นๆ โดยรูปร่างของมันสูงใหญ่เป็นอย่างมาก จนเกือบจะแตะเพดานของเหมืองแร่ เพียงแต่ร่างกายอันกำยำของมัน ถูกเพลิงอมตะกัดกร่อนจนเหลือเพียงแค่โครงกระดูก แต่มันกลับไร้ความรู้สึกใดๆ มันถือค้อนยักษ์ที่ลุกโชนไปด้วยเปลวเพลิงยาวหลายเมตร ฟาดลงมาที่พวกเขา","“ผนึก!”","วิกโตริโอตะโกนเสียงต่ำ โซ่ที่สร้างขึ้นจากอักขระเล่นแร่แปรธาตุ ก็ยื่นออกมาจากอาณาเขตของเขา และพันธนาการแขน เอว และคอของปีศาจยักษ์เอาไว้","จากนั้นแฮร์รอฟก็ใช้ เวทมนตร์สลายโครงสร้างขั้นสูงระเบิดมันจนแหลกสลาย!","“ข้าสัมผัสได้ถึงพลังจิตวิญญาณและพลังของเทพมารจากปีศาจเหล่านี้”","วิกโตริโอเอ่ยด้วยความเคร่งขรึม","มีความเป็นไปได้สูงมาก ที่อีกฝ่ายจะกักขังวิญญาณของศัตรูที่เคยสังหารเอาไว้ที่นี่ และให้กำเนิดปีศาจเหล่านี้ขึ้นมา นรกที่ถูกฉายออกมานี้ เหมือนกับสิ่งที่ถูกบรรยายเอาไว้ในพระคัมภีร์ทุกประการ ซึ่งนั่นทำให้วิกโตริโอตกอยู่ในความกังวลอย่างหนัก","อีกฝ่ายก้าวไปถึงระดับไหนกันแน่ ขนาดเป็นแค่ร่างจุติยังแข็งแกร่งถึงเพียงนี้","ตึก...ตึก...","จู่ๆ เสียงฝีเท้าที่ชัดเจนก็ดังก้องขึ้นมาจากด้านหลังของพวกเขาทั้งสี่คน","สีหน้าของทุกคนที่อยู่ที่นั่นเปลี่ยนไปอย่างฉับพลัน","พื้นหินที่แข็งแกร่งใต้เท้า ตอนนี้ได้กลายเป็นหนองน้ำที่เต็มไปด้วยโคลนตมแล้ว ด้วยความแข็งแกร่งของลูเซีย หากเธอต้องการที่จะซ่อนตัว ย่อมไม่มีทางที่จะเปิดเผยร่องรอยให้เห็นชัดเจนถึงเพียงนี้อย่างแน่นอน","เว้นเสียแต่ว่า...อีกฝ่ายไม่ได้คิดที่จะปิดบังเลยแม้แต่น้อย หรือไม่ก็ตั้งใจที่จะสร้างแรงกดดันทางจิตใจให้กับพวกเขา!","เมื่อคิดถึงเรื่องนี้ พื้นที่ด้านหน้าที่เคยโล่งเตียน ก็บิดเบี้ยวไปมาอย่างกะทันหัน เส้นใยสีเลือดจำนวนนับไม่ถ้วน ผุดขึ้นมาจากกำแพง และปิดกั้นเส้นทางเดินหน้าอย่างมิดชิด","ในตอนนี้ ร่างของลูเซียได้มาปรากฏขึ้นที่ด้านหลังของทุกคนแล้ว และสกัดกั้นเส้นทางหลบหนีของพวกเขาเอาไว้","แฮร์รอฟและคนอื่นๆ ล้มเลิกความคิดที่จะหลบหนีต่อไปในทันที เห็นได้ชัดว่า ภูเขาทั้งหมดตกอยู่ภายใต้การควบคุมของอีกฝ่าย ต่อให้พวกเขาจะทุ่มสุดตัว ก็ไม่แน่ว่าจะสามารถหลบหนีออกไปได้","ยิ่งไปกว่านั้น พวกเขายังอุตส่าห์ทุ่มเทแรงกายแรงใจ กว่าจะหาโอกาสล่อสตรีศักดิ์สิทธิ์ของศาสนจักรคนนี้ออกมาได้ตามลำพัง ไม่ว่าจะอย่างไร ครั้งนี้พวกเขาจะต้องรั้งอีกฝ่ายเอาไว้ให้ได้!","ออโรร่ายกมือขึ้น แสงอัสนีก็สว่างวาบขึ้นมารอบกาย สนามแม่เหล็กอันน่าสะพรึงกลัวก่อตัวขึ้นในพริบตา ลูกกระสุนโลหะนับสิบลูก ลอยวนอยู่กลางอากาศ และถูกขับเคลื่อนด้วยพลังแม่เหล็กไฟฟ้า จนเกิดเสียงดังสนั่นหวั่นไหวราวกับแก้วหูจะฉีกขาด","นี่คือปืนใหญ่แม่เหล็กไฟฟ้าที่ลินน์เป็นคนประดิษฐ์ขึ้นมา!","ออโรร่าที่ได้ศึกษาทฤษฎีที่เกี่ยวข้อง ย่อมสามารถจำลองมันขึ้นมาได้อย่างแน่นอน แม้ว่าการร่ายเวทมนตร์จะเร่งรีบเกินไป ทำให้ความเร็วของปืนใหญ่แม่เหล็กไฟฟ้า ไม่สามารถไปถึงระดับยี่สิบห้าเท่าของความเร็วเสียงได้ ทำได้เพียงประมาณหกเท่าของความเร็วเสียง แต่มันก็รุนแรงพอที่จะคร่าชีวิตได้แล้ว!","เพลิงอมตะที่เพิ่งจะกลืนกินพวกปีศาจเข้าไป ก็ปะทุขึ้นในพริบตา มันเผาผลาญใบหน้ามนุษย์ที่ฝังอยู่บนกำแพงอุโมงค์จนเป็นเถ้าถ่าน และกลายเป็นเสาเพลิงอันร้อนระอุ พุ่งทะยานเข้าใส่ลูเซีย!","ปืนใหญ่แม่เหล็กไฟฟ้าเป็นฝ่ายพุ่งเข้าหาก่อน ภายใต้แรงผลักดันที่มากกว่าความเร็วเสียงถึงหกเท่า การก้าวข้ามระยะทางห้าสิบเมตรนั้น ใช้เวลาเพียง 0.025 วินาทีเท่านั้น!","แต่ในวินาทีที่ปืนใหญ่แม่เหล็กไฟฟ้าพุ่งทะยานออกไป ความเร็วของมันก็ลดลงจนเห็นได้ด้วยตาเปล่า แต่นั่นเป็นเพราะธาตุภายในภาพฉายอาณาเขตแห่งสรวงสวรรค์ กำลังขัดขวางความเร็วของกระสุนโลหะตามสัญชาตญาณ...","เมื่อต้องเผชิญกับกระสุนปืนใหญ่แม่เหล็กไฟฟ้านับสิบลูกที่พุ่งทะยานเข้ามา สีหน้าของลูเซียก็ยังคงราบเรียบ แต่เป็นเพลิงอมตะอันแปลกประหลาดนั่นต่างหาก ที่ทำให้เธอรู้สึกสนใจขึ้นมาเล็กน้อย","สำหรับเปลวเพลิงชนิดนี้ เธอเคยได้ยินมานานแล้ว และยังเคยสัมผัสกับมันมาแล้วหลายต่อหลายครั้ง เธอจึงรู้ดีถึงความร้ายกาจของมัน และ...วิธีรับมือ!","ลูเซียอ้าปากออก และพ่นลมหายใจออกมาเบาๆ!","แคร่ก...","ไอเย็นที่ราวกับจะสามารถแช่แข็งมิติเวลาได้ พ่นออกมาจากปากของลูเซีย จากนั้นก็แผ่ขยายออกไปรอบๆ อย่างรวดเร็ว ลูกกระสุนโลหะที่กำลังพุ่งทะยานเข้ามา ถูกแช่แข็งอยู่กลางอากาศโดยตรง และคลื่นเพลิงที่พุ่งเข้ามาอย่างบ้าคลั่ง ก็ถูกแช่แข็งอยู่ที่เดิม ก่อนจะสลายตัวไปอย่างรวดเร็ว...","และนี่ก็คือพลังศักดิ์สิทธิ์ระดับตำนาน แดนเยือกแข็งนิรันดร์กาล!","แม้ว่าด้วยพลังในตอนนี้ของเธอ จะยังไม่สามารถแช่แข็งธาตุทั้งหมดภายในอาณาเขตของเทพได้เหมือนกับร่างต้น แต่การใช้ในระยะทางใกล้ๆ ก็ยังพอจะทำได้!","หลังจากที่ลมหายใจเยือกแข็งที่สามารถแช่แข็งมิติเวลานี้ แผดเผาเพลิงอมตะไปแล้ว มันก็พุ่งทะยานไปข้างหน้าอย่างต่อเนื่อง และแช่แข็งทุกสิ่งที่ขวางหน้าอย่างรวดเร็ว!","วิกโตริโอเปลี่ยนท่าทางมือ โซ่อักขระนับไม่ถ้วนก็พุ่งทะยานออกมาจากความว่างเปล่า มันพัวพันและเชื่อมต่อเข้าด้วยกัน จนกลายเป็นกำแพงอันแข็งแกร่งขวางกั้นอยู่เบื้องหน้า","แต่การป้องกันนี้ กลับคงอยู่ได้ไม่ถึงสองวินาที อักขระบนนั้นก็ถูกแช่แข็งและพังทลายลง จนสูญเสียประสิทธิภาพที่ควรจะมีไป","โชคดีที่เวทมนตร์ของลินน์ได้เตรียมการเสร็จสิ้นแล้ว!","ลำแสงเลเซอร์อันรุนแรงพุ่งทะยานออกมาจากฝ่ามือของลินน์ และพุ่งทะลวงแดนเยือกแข็งนิรันดร์กาลด้วยอานุภาพที่ไม่อาจต้านทานได้...","ภายใต้การสนับสนุนของพลังการประมวลผลจากปัญญาประดิษฐ์สนับสนุน และอาศัยเวลาที่วิกโตริโอถ่วงเวลาเอาไว้ให้ เขาจึงสามารถร่ายลำแสงเลเซอร์ระดับพลังงานขั้นที่ห้าออกมาได้สำเร็จ!","ในพื้นที่ที่เป็นศูนย์สัมบูรณ์ ธาตุทุกชนิดจะถูกหยุดนิ่ง แต่ก็มีข้อยกเว้นอยู่ประการหนึ่ง...นั่นก็คือแสง!","แสงนั้นแตกต่างจากธาตุที่มีสถานะคงที่ โดยแสงคือควอนตัม ซึ่งมีคุณสมบัติเป็นทั้งอนุภาคและคลื่น มันจึงไม่ถูกจำกัดด้วยศูนย์สัมบูรณ์","ไม่เพียงเท่านั้น แสงยังคงส่งต่อพลังงานอย่างต่อเนื่อง เมื่อธาตุได้รับพลังงานจลน์กลับคืนมา มันก็จะทำลายศูนย์สัมบูรณ์ที่ไม่มีความมั่นคงแต่เดิมทิ้งไป!","และนี่ก็คือวิธีแก้ปัญหาที่เขาคิดค้นขึ้นมา!","ลำแสงเลเซอร์ระดับพลังงานขั้นที่ห้า ทะลวงผ่านอาณาเขตเยือกแข็งในชั่วพริบตา และทะลวงผ่านการป้องกันที่ลูเซียสร้างขึ้นรอบกาย และเจาะทะลุหว่างคิ้วของเธอโดยตรง!","“บ้าเอ๊ย!”","สีหน้าของลินน์เปลี่ยนไปในทันที ในวินาทีที่ลงมือสำเร็จ เขาก็พบกับความผิดปกติ เพราะแม้ว่าอาณาเขตศูนย์สัมบูรณ์ที่แผ่ขยายออกไปจะหยุดนิ่งแล้ว แต่สตรีศักดิ์สิทธิ์ที่ถูกลำแสงเลเซอร์ทะลวงร่าง กลับไม่ได้รับผลกระทบใดๆ เลย","เห็นได้ชัดว่า สิ่งที่ปรากฏอยู่ตรงหน้าพวกเขา เป็นเพียงแค่ภาพมายาเท่านั้น!","และอันที่จริงก็เป็นเช่นนั้น ลูเซียที่รู้ซึ้งถึงอานุภาพของเวทเลเซอร์เป็นอย่างดี ย่อมต้องระวังตัวอย่างแน่นอน เสียงฝีเท้าที่จงใจทำขึ้นก่อนหน้านี้ และภาพมายาที่อยู่ตรงหน้า เป็นเพียงแค่วิธีการที่ใช้หลอกล่อพวกเขาเท่านั้น!","เพียงแต่ในครั้งนี้ กระทั่งออโรร่าก็ยังมองไม่ออก!","เมื่อตระหนักถึงเรื่องนี้ สัญญาณเตือนภัยอันรุนแรงก็ดังขึ้นมาในใจ ลินน์ไม่ลังเลเลยแม้แต่น้อย เขาดึงธาตุภายในอาณาเขตออกมา โล่สีเงินก็ถูกสร้างขึ้นมาในพริบตา","“ประกายดารา!”","เสียงของลูเซียดังขึ้นมาจากทางด้านหน้า การต่อสู้ที่เกิดขึ้นอย่างต่อเนื่อง ทำให้สตรีศักดิ์สิทธิ์คนนี้ตระหนักได้ว่า ลินน์ที่อยู่ตรงหน้านี้คือภัยคุกคามที่ยิ่งใหญ่ที่สุด และเป็นคนแรกที่จะต้องถูกกำจัด!","ประกายไฟอันรุนแรงระเบิดออกในทันที และปกคลุมไปทั่วทั้งมิติ","โล่สีเงินบุบสลายจนมองเห็นได้ด้วยตาเปล่า แต่ภายใต้การโจมตีอย่างเต็มกำลังของลูเซีย มันกลับยังคงความเหนียวแน่นเอาไว้ได้!","เพราะสิ่งที่ประกอบมันขึ้นมาก็คือ ธาตุยูเรเนียม!","ยูเรเนียมเป็นธาตุที่มีความหนาแน่นสูง แถมความแข็งแกร่งของมันยังเป็นที่ประจักษ์ชัด หากยังไม่ถึงมวลวิกฤต การจะทำลายมันให้สิ้นซากนั้น ย่อมไม่ใช่เรื่องง่าย...","โดยลินน์จะกระจายมันเอาไว้ในอาณาเขตเวทมนตร์รอบกาย โดยไม่สนใจกระทั่งกัมมันตภาพรังสี เพื่อที่จะสามารถร่ายเวทระเบิดนิวเคลียร์ในเวลาที่เหมาะสมที่สุดได้","แต่ตอนนี้มันกลับถูกเขาเอามาใช้ เพื่อสกัดกั้นประกายดาราที่พุ่งเข้ามาในระยะประชิด!","ลูเซียก็ไม่คาดคิดมาก่อนเช่นกัน ว่าการโจมตีสุดกำลังของเธอ จะถูกจอมเวทผู้ยิ่งใหญ่อย่างลินน์สกัดเอาไว้ได้อย่างง่ายดาย โซ่อักขระนับไม่ถ้วนพุ่งทะยานออกมาจากความว่างเปล่า มันขัดขวางการเคลื่อนไหวของลูเซีย และปิดกั้นการเคลื่อนไหวของเธอเอาไว้","วิกโตริโอทุ่มเทสุดกำลัง เขาฝืนขยายอาณาเขตออกไป และร่วมมือกับเวทมนตร์พรางตาของออโรร่า เพื่อพันธนาการอีกฝ่ายเอาไว้อีกครั้ง!","“เจ้านี่คือร่างจริง แฮร์รอฟ!”","วิกโตริโอตะโกนออกมาสุดเสียง","“คมดาบมิติเวลา ตัด!”","หลังจากที่ลูเซียปรากฏตัวขึ้น แฮร์รอฟที่เตรียมพร้อมมานาน ในที่สุดก็ลงมือ เขารวบรวมพลังเวททั้งหมดไว้ที่เวทมนตร์ระดับตำนานบทนี้!","เส้นใยสีดำปรากฏขึ้นในความว่างเปล่าอันไร้ขอบเขต ทุกที่ที่มันพาดผ่าน มิติเวลาจะบิดเบี้ยว อาณาจักรเทพก็พังทลายลง แม้แต่แสงสว่างก็ยังถูกดึงเข้าไป สิ่งที่หลงเหลืออยู่ มีเพียงความมืดมิดอันไร้ที่สิ้นสุด!","เพียงแค่การโจมตีเพียงครั้งเดียว กำแพงหินทางด้านหลังก็ถูกตัดจนเป็นรูขนาดใหญ่ เสาสีดำที่ตัดผ่านฟ้าดินก็ปรากฏขึ้น!","ในฐานะเป้าหมายการโจมตีของคมดาบมิติเวลา หัวไหล่และมือขวาของลูเซีย จมดิ่งลงไปในวังวนมิติสีดำ และถูกพลังมิติอันแข็งแกร่งลบเลือนไป!","หากไม่มีคำเตือนจากวิกโตริโอ ที่ทำให้เธอต้องเบี่ยงตัวหลบก่อนที่การโจมตีจะมาถึง ร่างจุติร่างนี้ ก็คงจะได้รับบาดเจ็บสาหัสไปแล้ว...","แต่ทุกอย่างก็ต้องจบลงเพียงเท่านี้ การโจมตีสุดกำลังของแฮร์รอฟ ไม่สามารถทำลายภาพฉายอาณาเขตแห่งสรวงสวรรค์ได้อย่างสมบูรณ์ ‘เสาสีดำ’ ก็ค่อยๆ เลือนหายไปหลังจากที่คงอยู่ได้เพียงครู่เดียว พร้อมกับพื้นที่สีเลือดก็ค่อยๆ หดตัวกลับเข้าสู่ศูนย์กลาง","คลื่นพลังศักดิ์สิทธิ์อันน่าสะพรึงกลัวปะทุขึ้นมาจากร่างอันบอบบางของลูเซีย โซ่อักขระพังทลายลงในทันที ร่างกายซีกซ้ายที่ถูกพลังมิติลบเลือนไป ก็กำลังฟื้นฟูด้วยความเร็วที่มองเห็นได้ด้วยตาเปล่า","วิกโตริโอกระอักเลือดออกมาคำโต ภายใต้การสะท้อนกลับของเวทมนตร์อันรุนแรง","ออโรร่าก็หน้าซีดเผือด พวกเขาทำทุกอย่างที่ทำได้ไปแล้ว!","“จงรับการทำลายล้างไปซะเถอะ!”","ลูเซียลอยตัวอยู่กลางอากาศ ดวงตาราวกับดวงดาวเปล่งประกาย ธาตุทั่วทั้งอาณาเขตแห่งสรวงสวรรค์ ก็เกิดความผันผวนอย่างรุนแรง","ประกายแสงดาวอันเจิดจรัส ปรากฏขึ้นในทุกอณูของพื้นที่แห่งนี้ ไม่อาจหลบหลีก และไม่อาจซ่อนตัวได้...","แต่ในวินาทีที่เธอลงมือ ลูเซียก็หันหน้าขวับไปมอง","เสียงลมพัดหวิวๆ ดังก้องมาจากทางด้านหลัง","โดยรูที่ถูกเจาะทะลุนั้น กลับปรากฏใบพัดขนาดยักษ์ขึ้นตรงหน้าของเธอ!","สิ่งมีชีวิตขนาดยักษ์ที่มีปีกกว้างกว่าสิบเมตร กำลังพุ่งทะยานเข้ามาตามทางเดินที่ถูกสร้างขึ้นโดยคมดาบมิติเวลา ด้วยความเร็วสูงถึงสามร้อยหกสิบกิโลเมตรต่อชั่วโมง!","ฝาครอบใบพัดด้านหน้าสุด กระแทกเข้าที่ร่างของลูเซียอย่างจัง ด้วยน้ำหนักและความเร็วอันมหาศาล มันจึงพัดพาร่างของลูเซียให้พุ่งทะยานลึกเข้าไปในเหมืองแร่!","ปีกเครื่องบินอันกว้างใหญ่ บินโฉบผ่านศีรษะของพวกลินน์ไป สายลมที่พัดผ่าน ทำให้เสื้อผ้าของพวกเขาปลิวไสว","“ตอนนี้แหละ หนี!”","ลินน์ตะโกนออกมาอย่างร้อนรน เขาไม่มีเวลาอธิบายใดๆ ทั้งสิ้น เขาดึงทุกคนให้กระโดดลงไปในรูที่เครื่องบินรบเพิ่งจะบินผ่านเข้ามา!","โดยเบื้องล่างของภูเขาแร่ลูกนี้ ก็คือแม่น้ำสายใหญ่ที่ไหลเชี่ยวกราก!","...","ในเวลานี้ ภายในเหมืองแร่ เครื่องบินรบความเร็วสูงกำลังพุ่งชนร่างกายของลูเซีย และทะลวงผ่านกำแพงหินที่ไม่หนามากนัก เข้าสู่ส่วนลึกของเหมืองแร่","เครื่องบินรบลำนี้ มีเพียงแค่ร่างจำลองเวทมนตร์ของลินน์ที่เป็นผู้บังคับควบคุม หลังจากที่ได้รับข้อความจากร่างต้น เขาก็ใช้แผนสำรองนี้ โดยส่งลิเดียไปไว้ในที่ปลอดภัย แล้วรีบกลับมาอย่างรวดเร็ว!","จากนั้นเขาก็บินมาตามเส้นทางที่คมดาบมิติเวลาสร้างขึ้น โดยใช้การพุ่งชนที่ศัตรูคาดไม่ถึง และเรียบง่ายที่สุด!","เนื่องจากเครื่องบินรบไม่ได้อยู่ในรัศมีของอาณาเขตแห่งสรวงสวรรค์มาตั้งแต่แรก ย่อมสามารถหลอกล่อการรับรู้ของลูเซียได้อย่างแน่นอน ซึ่งจะสามารถพุ่งชนอีกฝ่ายอย่างจัง ในจังหวะที่อีกฝ่ายกำลังร่ายพลังศักดิ์สิทธิ์อย่างเต็มที่!","หากเป็นคนอื่น การถูกชนอย่างรุนแรงเช่นนี้ คงจะกลายเป็นก้อนเนื้อเละๆ ไปนานแล้ว แต่คู่ต่อสู้ของเขาคือสตรีศักดิ์สิทธิ์ของศาสนจักรลูเซีย ซึ่งเป็นร่างจุติของเอลา!","การป้องกันที่เธอสร้างขึ้นรอบกาย แม้แต่ลำแสงเลเซอร์ระดับพลังงานขั้นที่สี่ก็ยังยากที่จะทะลวงผ่านไปได้ แม้ว่าจะถูกแรงกระแทกพัดปลิวไป แต่เธอกลับไม่ได้รับบาดเจ็บใดๆ เลย สองมือของเธอจับที่ส่วนหน้าของเครื่องบิน และหักใบพัดออกด้วยมือเปล่า จากนั้นก็ใช้มันเป็นอาวุธ ฟาดเข้าใส่ตัวเครื่องบินทั้งลำ!","ภายในห้องนักบิน ลินน์ที่ดำรงอยู่เป็นร่างจำลองเวทมนตร์ ไม่ได้รู้สึกหวาดกลัวเลยแม้แต่น้อย โดยในมือของเขากำลังถือลูกบอลสีเงินที่ดูแปลกตาเอาไว้","ยูเรเนียม-235 ที่สกัดได้จากหินปีศาจนั้น เพียงพอที่จะปลดปล่อยเวทมนตร์ระเบิดนิวเคลียร์ได้ถึงสองครั้ง เพื่อความปลอดภัย เขาจึงเก็บครึ่งหนึ่งเอาไว้ในอาณาเขตของร่างต้น เพื่อดำเนินแผน A!","ส่วนอีกครึ่งหนึ่งก็ถูกเก็บเอาไว้บนเครื่องบินรบลำนี้ เพื่อเป็นหลักประกันและแผนสำรอง!","ในตอนนี้ มันได้ถูกเขาหยิบออกมาแล้ว เมื่อต้องเผชิญกับลูเซียที่พุ่งทะยานเข้ามา ลินน์ก็โยนมันออกไปโดยตรง!","“จงสัมผัสกับความโกรธเกรี้ยวของดวงอาทิตย์ซะเถอะ!”","ลินน์ตะโกนลั่น รายชื่อต่างๆ มากมายไม่ว่าจะเป็น แฟตแมน หรือลิตเติลบอย ค่อยๆ ไหลผ่านเข้ามาในหัวของเขา สุดท้ายเขาก็ตั้งชื่อให้เวทระเบิดนิวเคลียร์ลูกนี้ว่า","งั้นก็...เรียกว่าลิตเติลเกิร์ล (เด็กหญิงตัวน้อย) ก็แล้วกัน!","ในวินาทีที่สิ้นเสียง แหล่งกำเนิดนิวตรอนภายในยูเรเนียม-235 ก็เริ่มทำงาน นิวตรอนนับพันแตกกระจายออกมา ปฏิกิริยาลูกโซ่ก่อตัวขึ้นในพริบตา","มหาเวทระเบิดนิวเคลียร์ ทำงาน!"]},{"n":440,"t":"ดวงอาทิตย์ที่ลอยเด่นขึ้นสู่ท้องฟ้ายามค่ำคืน!","c":["จากการถลุงทองสัมฤทธิ์ไปจนถึงการหลอมเหล็กกล้า และนำไปสู่การพัฒนาอาวุธปืนและดินปืน ระดับเทคโนโลยีของมนุษย์ได้พัฒนาขึ้นอย่างต่อเนื่อง จนกระทั่งสามารถ ‘พิชิต’ ผืนดิน ท้องฟ้า และมหาสมุทรได้ในที่สุด...","แต่ต่อให้เป็นเสียงคำรามของปืนใหญ่ แต่เมื่อต้องเผชิญหน้ากับภัยพิบัติทางธรรมชาติอย่างแท้จริง เช่น แผ่นดินไหว อุกกาบาต และภูเขาไฟระเบิด มันก็ยังคงดูต่ำต้อยและไร้ค่าอยู่ดี!","จนกระทั่งในศตวรรษที่ยี่สิบ มนุษย์ได้ค้นพบการพัฒนาครั้งใหม่ในระดับจุลภาค และได้เริ่มศึกษาค้นคว้าเกี่ยวกับอะตอมอย่างลึกซึ้ง โดยอาศัยสมการมวล-พลังงานเป็นทฤษฎีหลัก จึงได้ประดิษฐ์ระเบิดปรมาณูขึ้นมา และทำให้มนุษย์ได้ครอบครองพลังที่ทัดเทียมกับภัยพิบัติทางธรรมชาติเป็นครั้งแรก!","และในตอนนี้ พลังอันยิ่งใหญ่ดังกล่าว ก็ได้ปรากฏขึ้นต่อสายตาของทุกคนอย่างแท้จริงเป็นครั้งแรก!","พลังอันแข็งแกร่งจนเกินกว่าจะบรรยาย ปะทุออกมาจากลูกบอลสีเงิน","ลูเซียสัมผัสได้เพียงความหวาดกลัวที่ฝังลึกเข้าไปถึงในจิตวิญญาณ จากนั้นเธอก็ตกอยู่ในความมืดมิด...แต่นี่ไม่ใช่ความมืดมิดที่เกิดจากการระเบิดของนิวเคลียร์","อันที่จริง แสงสว่างที่มันปลดปล่อยออกมานั้นสว่างไสวถึงขีดสุด ซึ่งสว่างยิ่งกว่าดวงอาทิตย์บนท้องฟ้าหลายร้อยเท่า!","ด้วยเหตุนี้ ดวงตาทั้งสองข้างของลูเซียจึงบอดสนิทในพริบตา แก้วหูของเธอก็ฉีกขาดจนทำให้สูญเสียประสาทสัมผัสทั้งห้าไปในทันที กระทั่งความสามารถในการรับรู้ด้วยพลังศักดิ์สิทธิ์ที่เ
