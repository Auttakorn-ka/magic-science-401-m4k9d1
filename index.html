หมื่นคนก็มารวมตัวกันที่หอคอยแห่งสรวงสวรรค์ พวกเขารอคอยคำอธิบายจากองค์สันตะปาปาด้วยความหวาดกลัวและกระวนกระวายใจ","แต่คำสั่งที่พวกเขาได้รับกลับมีเพียงข้อเดียว นั่นก็คือให้เริ่มการคัดเลือกสตรีศักดิ์สิทธิ์ และพิธีรับศีลจุ่มในทันที!","คำสั่งนี้กะทันหันเป็นอย่างมาก เพราะศาสนจักรไม่เคยมีสตรีศักดิ์สิทธิ์สองคนพร้อมกันมาก่อน เว้นเสียแต่ว่าคนก่อนหน้าจะได้กลับคืนสู่สรวงสวรรค์ หรือไม่ก็ประสบอุบัติเหตุใดๆ","ยิ่งไปกว่านั้น พิธีรับศีลจุ่มจะต้องจัดขึ้นภายใต้การเป็นพยานของผู้ศรัทธานับแสนคน แต่ตอนนี้เห็นได้ชัดว่าพวกเขาไม่สามารถสนใจเรื่องนั้นได้อีกต่อไปแล้ว พวกเขาจะต้องคัดเลือกสตรีศักดิ์สิทธิ์คนใหม่ให้เร็วที่สุดเท่าที่จะทำได้!","ภายใต้การจัดการของศาสนจักร เด็กสาวที่อายุน้อย งดงาม และมีพรสวรรค์คนหนึ่ง ก็ถูกคัดเลือกออกมาอย่างรวดเร็ว เธอได้ก้าวเข้าสู่หอคอยแห่งสรวงสวรรค์ ท่ามกลางสายตาแห่งความอิจฉาของทุกคน!","เสียงสวดมนต์อันดังกึกก้อง ดังกระหึ่มไปทั่วทั้งหอคอยแห่งสรวงสวรรค์อย่างรวดเร็ว","เด็กสาวผู้บริสุทธิ์ มาพร้อมกับความงดงาม ความหวัง และความศรัทธาอันแรงกล้าต่อพระผู้เป็นเจ้า เธอไปยืนอยู่ตรงกลางของค่ายกลพลังศักดิ์สิทธิ์ ราวกับเป็นเครื่องสังเวย","พร้อมกับพลังศักดิ์สิทธิ์ที่ถูกส่งเข้ามา แรงกดดันอันน่าสะพรึงกลัวก็พวยพุ่งขึ้นมาจากค่ายกลภายในหอคอย","ชั่วพริบตา แสงศักดิ์สิทธิ์ขนาดมหึมาก็พุ่งทะลวงชั้นฟ้า และปกคลุมร่างของเด็กสาวเอาไว้ ร่างกายของเธอค่อยๆ ลอยขึ้นไปบนอากาศ เสื้อผ้าปลิวไสวไปตามสายลม ดวงตาที่เต็มไปด้วยความหวังและความศรัทธา เริ่มปรากฏแสงสว่างที่เปล่งประกายราวกับดวงดาว","“ข้าแต่พระผู้เป็นเจ้าผู้ยิ่งใหญ่ ศักดิ์สิทธิ์ ยุติธรรม และเมตตากรุณา พระองค์คือดวงดาวที่เปล่งประกายที่สุดบนสรวงสวรรค์ และเป็นผู้สร้างสรรพสิ่ง!”","“สรรเสริญพระผู้เป็นเจ้า ขอพระองค์ทรงโปรดอภัยในบาปของข้า เพื่อที่หลังจากตายไปแล้ว ข้าจะได้กลับคืนสู่อาณาจักรเทพ!”","“โปรดประทานพลังที่จะเอาชนะความชั่วร้ายให้แก่ข้าด้วยเถิด...”","เสียงสารภาพบาปและเสียงสวดอ้อนวอนต่างๆ นานา หลั่งไหลเข้ามาในหัวของเด็กสาวอย่างไม่ขาดสาย ดวงตาทั้งสองข้างกลายเป็นความสับสนวุ่นวาย แต่ไม่นานเสียงเหล่านี้ก็ค่อยๆ แผ่วเบาลง แสงศักดิ์สิทธิ์ที่พุ่งทะลวงฟ้าดินก็จางหายไปอย่างกะทันหัน","ร่างกายที่ลอยอยู่กลางอากาศ ค่อยๆ ร่วงหล่นลงมาบนพื้น!","“สตรีศักดิ์สิทธิ์!”","บรรดาระดับสูงของศาสนจักรที่รั้งอยู่ในเมืองศักดิ์สิทธิ์ ต่างก็พากันคุกเข่าข้างหนึ่งเพื่อทำความเคารพ","เด็กสาวดูเหมือนจะยังไม่สามารถดึงสติกลับมาจากผลกระทบทางจิตใจเมื่อครู่นี้ได้ สมองของเธอสับสนวุ่นวาย ผ่านไปประมาณสามถึงห้าวินาที ดวงตาทั้งสองข้างถึงได้ค่อยๆ กลับมาแจ่มใสอีกครั้ง จากนั้นเธอก็มองไปยังคนเหล่านั้น และเอ่ยปากพูดขึ้น","“เจ้าทำได้ดีมาก อัลวิส การเลือกเจ้าเป็นสันตะปาปานั้น เป็นการตัดสินใจที่ถูกต้องจริงๆ!”","หากช้าไปกว่านี้อีกไม่กี่ชั่วโมง เกรงว่าจิตสำนึกของเธอคงจะถูกพิษแห่งความศรัทธากัดกร่อน และจมดิ่งลงไปในเสียงสวดอ้อนวอนอันไร้ที่สิ้นสุดอย่างสมบูรณ์","พลังศรัทธาของผู้คนนับสิบล้านคนนั้น ไม่ใช่สิ่งที่จะสามารถทนรับได้ง่ายๆ!","ต่อให้เป็นพลังการประมวลผลของเธอก็ตาม ก็ยังไม่อาจต้านทานการซัดสาดของจิตสำนึกจำนวนมหาศาลนี้ได้...","“ข้าเพียงแค่ปฏิบัติตามเจตนารมณ์ของพระองค์ และทำในสิ่งที่สมควรทำก็เท่านั้น”","สันตะปาปาอัลวิสไม่ได้มีเจตนาที่จะรับความดีความชอบ เขาเอ่ยตอบด้วยความเคารพ","ส่วนนักบุญแรนดัลที่อยู่ด้านข้าง กลับเอ่ยถามด้วยความไม่เข้าใจ","“องค์พระผู้เป็นเจ้า เกิดอะไรขึ้นกันแน่ ทำไมพระองค์ถึงได้...”","การคัดเลือกสตรีศักดิ์สิทธิ์อีกครั้ง ความหมายของมันมีเพียงอย่างเดียว นั่นก็คือสตรีศักดิ์สิทธิ์คนก่อนหน้าได้ตายไปแล้ว!","แต่ว่า...นี่มันจะเป็นไปได้อย่างไร?","แล้วใครกันที่จะสามารถฆ่าสตรีศักดิ์สิทธิ์ของศาสนจักร ซึ่งเป็นร่างจุติของพระผู้เป็นเจ้าได้?","“พลังของพวกพ่อมด แข็งแกร่งถึงเพียงนี้จริงๆ งั้นรึ?”","แรนดัลตกตะลึงเป็นอย่างมาก","“ไม่ พลังของพวกเขานั้นอ่อนแอจนทนรับการโจมตีไม่ได้แม้แต่ครั้งเดียว”","เอลาส่ายหน้า เธอเคยปะทะกับพ่อมดที่ได้ชื่อว่าเป็นระดับตำนานเหล่านั้นมาแล้ว แม้ว่าจะเป็นเวทมนตร์ลำแสงอันแปลกประหลาด แต่มันก็ยังไม่เพียงพอที่จะสร้างภัยคุกคามถึงชีวิตให้กับเธอได้","“เว้นเสียแต่เวทมนตร์บทนั้น ที่เป็นข้อยกเว้น!”","เมื่อพูดถึงตรงนี้ ดวงตาทั้งสองข้างของสตรีศักดิ์สิทธิ์ก็แปรเปลี่ยนเป็นเฉียบแหลมและอันตราย","สันตะปาปาอัลวิสใจสั่นสะท้าน เขานึกอะไรบางอย่างขึ้นมาได้ในทันที","เมื่อช่วงค่ำที่ผ่านมา เคานต์ป๊อปแห่งดินแดนชายแดน ได้เดินทางมาถึงเมืองศักดิ์สิทธิ์ หลังจากที่เร่งเดินทางมาตลอดทั้งวันทั้งคืน และนำข่าวที่น่าขันมาแจ้งให้ทราบ...นั่นก็คือพวกพ่อมด ได้ดึงเอาดวงอาทิตย์ลงมาจากชั้นฟ้า!"]},{"n":443,"t":"ทูตแห่งวันสิ้นโลกลินน์ ค่าหัวหนึ่งร้อยล้านเหรียญทองเซคัส!","c":["เคานต์ป๊อปที่พูดจาเหลวไหลในเมืองศักดิ์สิทธิ์ และพยายามทำให้จิตใจของผู้คนสั่นคลอน ถูกพวกเขาจับตัวเอาไว้ในทันที ซึ่งคำอธิบายของอีกฝ่ายทำได้เพียงใช้คำว่าน่าสะพรึงกลัวมาอธิบายเท่านั้น","แสงสว่างจ้าบาดตาสาดส่องไปทั่วทั้งท้องฟ้ายามค่ำคืน พื้นที่กว่าสิบกิโลเมตรกลายเป็นผืนดินที่ไหม้เกรียม และก่อตัวเป็นดินแดนแห่งความตาย ผู้ใดที่กล้าก้าวเข้าไปในนั้น ร่างกายจะเน่าเปื่อยและตายไปอย่างไม่ทราบสาเหตุ","ก่อนหน้านี้แรนดัลไม่ยอมเชื่ออย่างเด็ดขาด ลำพังแค่พวกพ่อมดที่ซ่อนตัวอยู่โพ้นทะเลราวกับหนูมานานหลายร้อยปี จะไปมีพลังอันยิ่งใหญ่เช่นนี้ได้อย่างไร?","แต่ในตอนนี้กลับต้องเชื่ออย่างเลี่ยงไม่ได้เสียแล้ว...อีกฝ่ายถึงกับสามารถฆ่าร่างจุติของพระผู้เป็นเจ้าได้!","“องค์พระผู้เป็นเจ้า ตอนนี้พระองค์ต้องการให้เรียกกองทัพปราบปรามกลับมา เพื่อรวบรวมกำลังทั้งหมดไปกวาดล้างผู้ลบหลู่เทพเจ้าพวกนี้หรือไม่?”","แรนดัลเอ่ยเสนอ","ก่อนหน้านี้ต่อให้อาณาจักรฮัดลาตาจะล่มสลาย แรนดัลก็ไม่เคยเห็นพวกพ่อมดเหล่านี้อยู่ในสายตาเลย แต่ตอนนี้ดูเหมือนว่าอีกฝ่ายจะมีพลังมากพอ ที่จะสั่นคลอนการปกครองของศาสนจักรและจักรวรรดิได้แล้ว!","จะต้องบดขยี้พวกมันให้เร็วที่สุด!","“ไม่ สงครามเต็มรูปแบบเกรงว่าจะไม่มีประโยชน์อะไรหรอก!”","สตรีศักดิ์สิทธิ์ส่ายหน้า และปฏิเสธข้อเสนอของแรนดัล","รัศมีของเวทมนตร์บทนั้นกว้างใหญ่จนเหลือเชื่อ อานุภาพของมันยิ่งทำได้เพียงใช้คำว่าน่าสะพรึงกลัวมาอธิบาย ต่อให้เป็นเพียงคลื่นกระแทกที่หลงเหลืออยู่ มันก็ไม่ใช่สิ่งที่นักบวชทั่วไปจะสามารถต้านทานได้","ภายใต้พลังเช่นนี้ จำนวนคนก็ไม่มีความหมายอะไรเลย รังแต่จะทำให้กองกำลังชั้นยอดทั้งหมดของศาสนจักรต้องมาทิ้งชีวิตไปอย่างเปล่าประโยชน์!","แรนดัลตระหนักถึงจุดนี้ได้อย่างรวดเร็ว สีหน้าแปรเปลี่ยนเป็นย่ำแย่อย่างถึงที่สุด","“พระองค์มีวิธีที่จะต้านทานเวทมนตร์บทนั้นหรือไม่?”","สันตะปาปาอัลวิสโพล่งถามขึ้นมากะทันหัน","บรรดาระดับสูงของศาสนจักรที่อยู่ในเหตุการณ์ ต่างก็มองไปยังสตรีศักดิ์สิทธิ์","สตรีศักดิ์สิทธิ์เงียบไปครู่หนึ่ง จากนั้นก็เอ่ยปากขึ้น","“หากข้าเป็นคนลงมือเอง ย่อมสามารถทำได้อย่างแน่นอน!”","แรนดัลและคนอื่นๆ ย่อมเข้าใจดี ว่าคำว่าทำด้วยตัวเองนั้น ไม่ได้หมายถึงร่างจุตินี้ แต่หมายถึงเทพีแห่งดวงจันทร์เอลา ตัวจริง!","เมื่อได้รับคำตอบที่แน่ชัด ทุกคนต่างก็ถอนหายใจออกมาอย่างโล่งอก เพราะสิ่งที่พวกเขาเป็นกังวลมากที่สุดก็คือ การที่พวกพ่อมดมาที่เมืองศักดิ์สิทธิ์ เพื่อปลดปล่อยเวทมนตร์อันน่าสะพรึงกลัวบทนั้น ในขณะที่พวกเขากลับไม่มีความสามารถที่จะตอบโต้ได้เลย","สันตะปาปาอัลวิสยิ่งจมดิ่งลงไปในการสารภาพบาปอย่างลึกซึ้ง เมื่อครู่นี้เขาถึงกับมีความคิดที่จะสั่นคลอนต่อพลังของพระผู้เป็นเจ้า!","“เวทมนตร์ที่ทรงพลังถึงเพียงนี้ ไม่มีทางที่พ่อมดที่ยังก้าวไม่ถึงระดับตำนานเหล่านี้ จะสามารถร่ายออกมาได้อย่างง่ายดายอย่างแน่นอน!”","เอลาเอ่ยอย่างหนักแน่น","ในนั้นจะต้องมีข้อจำกัดบางอย่างอยู่อย่างแน่นอน!","“เป็นไปได้ไหมว่า พวกมันจะค้นพบสมบัติแปลกประหลาดอะไรบางอย่างภายในดินแดนพ่อมด”","นักบุญแรนดัลเอ่ยด้วยจินตนาการที่เปิดกว้าง","เป็นไปได้มากว่าพลังนี้นี่แหละ ที่ทำให้พวกพ่อมดเหล่านี้เหิมเกริมขึ้นมา ถึงได้กล้าออกเดินทางจากเกาะเล็กๆ แห่งนั้น และมาท้าทายอำนาจของเทพเจ้า!","สตรีศักดิ์สิทธิ์พยักหน้า มีความเป็นไปได้นี้อยู่จริงๆ","ก่อนหน้านี้เป็นเพราะสถานการณ์ในสนามรบวิกฤตจนเกินไป ในระหว่างขั้นตอนการถ่ายโอนจิตสำนึกกลับไปยังร่างต้น เธอได้สูญเสียความทรงจำบางส่วนไป ดังนั้น เธอจึงมีเพียงความประทับใจคร่าวๆ เกี่ยวกับการต่อสู้ที่ผ่านไปเท่านั้น","ตัวอย่างเช่น ในช่วงสุดท้ายเธอถูกยานบินรูปแบบใหม่ของพวกพ่อมดชนจนปลิวไป และตัวอย่างเช่น คนที่ร่ายเวทก็คือพ่อมดที่ดูเหมือนจะอายุไม่มากนัก ที่มีชื่อว่าลินน์","“ส่งสายลับทั้งหมดออกไป เพื่อสืบหาข้อมูลของคนผู้หนึ่ง ข้าต้องการรู้ข้อมูลทั้งหมดเกี่ยวกับมัน!”","สตรีศักดิ์สิทธิ์เอ่ยสั่งการด้วยน้ำเสียงเย็นชา","“ใครกัน?”","สันตะปาปาอัลวิสเอ่ยถามอย่างจริงจัง เขาเข้าใจดีว่านี่จะต้องเป็นคนที่ใช้เวทมนตร์อันทรงพลังบทนั้น และฆ่าร่างจุติของพระผู้เป็นเจ้าอย่างแน่นอน","“ดาวรุ่งแห่งเวทมนตร์ที่พวกพ่อมดพูดถึง...ลินน์!”","เสียงของสตรีศักดิ์สิทธิ์ดังก้องขึ้นภายในหอคอยแห่งสรวงสวรรค์อีกครั้ง พระคัมภีร์อันเก่าแก่เล่มหนึ่งลอยออกมาจากเอวของแรนดัล มันเปิดไปยังบทคนบาปหน้าที่เจ็ดสิบสามโดยอัตโนมัติ ซึ่งชื่อและข้อมูลของลินน์ก็ปรากฏขึ้นตรงหน้าของคนทั้งหลายอย่างรวดเร็ว","“ข้าต้องการเห็นผลลัพธ์ภายในสิบวัน! แล้วก็ประธานผู้พิพากษาโจชัวด้วย ส่งคนไปค้นหาร่องรอยของเขา ข้าคิดว่าโจชัวน่าจะยังมีชีวิตอยู่ เป็นไปได้ว่าเขาอาจจะถูกพวกพ่อมดจับตัวไปแล้ว!”","สตรีศักดิ์สิทธิ์เอ่ยอย่างเย็นชา รับคำสั่ง","“รับคำสั่ง ข้าจะสั่งการลงไปเดี๋ยวนี้เลย!”","อัลวิสทำความเคารพอย่างนอบน้อม ในขณะที่กวาดสายตามองไป เขาก็สามารถดึงเอาข้อมูลสำคัญออกมาได้อย่างรวดเร็ว","รูปลักษณ์ของอีกฝ่ายมีอายุประมาณยี่สิบกว่าปี ผมสีน้ำตาล ปรากฏตัวขึ้นที่เมืองท่าเมื่อสองปีครึ่งที่แล้ว ต้องสงสัยว่ากำลังวางแผนสมรู้ร่วมคิด เพื่อล้มล้างศาสนจักรอย่างลับๆ หลังจากที่ถูกบิชอปในพื้นที่ค้นพบ เขาก็ใช้เวทมนตร์ระเบิดเมืองไปครึ่งหนึ่งโดยตรง ทำให้มีผู้บาดเจ็บล้มตายหลายพันคน ก่อนจะถูกเอ็ดเวลล์ที่ตามมาขับไล่ออกไป!","“องค์พระผู้เป็นเจ้า เรื่องการรวบรวมพลังศรัทธา จำเป็นจะต้องเร่งความเร็วให้มากกว่านี้หรือไม่?”","แรนดัลเอ่ยเตือนด้วยความกังวล","“ได้โปรดอภัยให้กับการล่วงเกินของข้าด้วยเถิด แต่ตอนนี้พระองค์จำเป็นจะต้องก้าวขึ้นสู่ตำแหน่งเทพเจ้าให้เร็วที่สุด!”","ไม่มีใครรู้เลยว่า มีพ่อมดกี่คนที่ครอบครองเวทมนตร์บทนี้ และมันจะสามารถใช้บ่อยๆ ได้หรือไม่","หากอีกฝ่ายเลือกที่จะทำการทำลายล้างครั้งใหญ่กับทั้งจักรวรรดิ เกรงว่าพวกเขาคงยากที่จะต้านทานได้!","การตายของผู้ศรัทธาจำนวนมหาศาล จะทำให้ความพยายามตลอดหลายร้อยปีของพวกเขาต้องสูญเปล่า...","ดังนั้น ในมุมมองของแรนดัล ต่อให้ต้องใช้วิธีการที่สกปรกโสมม เพื่อกระตุ้นความศรัทธา เขาก็ไม่เสียดายเลยสักนิด!","ตราบใดที่สามารถแก้ไขเรื่องพิษแห่งความศรัทธา และทำให้พระผู้เป็นเจ้าก้าวขึ้นสู่ตำแหน่งเทพเจ้าได้ พวกพ่อมดเหล่านี้ก็สามารถถูกกำจัดได้ด้วยการดีดนิ้ว!","สตรีศักดิ์สิทธิ์ครุ่นคิดอยู่ครู่หนึ่ง เพื่อพิจารณาถึงข้อดีและข้อเสียของการกระตุ้นความศรัทธา ซึ่งนี่ก็ไม่ต่างอะไรจากการจับปลาด้วยการสูบน้ำจนแห้งบ่อ แต่ตอนนี้เห็นได้ชัดว่าคงไม่สามารถสนใจเรื่องนั้นได้อีกต่อไปแล้ว การล่มสลายของอาณาจักรฮัดลาตา และความพ่ายแพ้อย่างต่อเนื่องของกองทัพปราบปรามแห่งศาสนจักร ทำให้จำนวนของผู้ศรัทธาที่เคร่งศาสนาลดลงไปอย่างน่าใจหาย...","หากปล่อยให้เป็นเช่นนี้ต่อไป ก็มีแต่จะยิ่งทำให้ห่างไกลจากเป้าหมายผู้ศรัทธาที่เคร่งศาสนาหนึ่งล้านคนออกไปเรื่อยๆ เท่านั้น","“ถ้าเช่นนั้นก็ปล่อยให้เจ้าเป็นคนจัดการก็แล้วกัน แรนดัล!”","สตรีศักดิ์สิทธิ์ตัดสินใจได้อย่างรวดเร็ว","“น้อมรับคำสั่ง!”","แรนดัลใช้มือขวาทุบอกเบาๆ และเอ่ยตอบด้วยความเคร่งขรึม","“พระองค์ แล้วเรื่องที่อาณาจักรฮัดลาตาล่มสลาย รวมถึงข่าวการพ่ายแพ้ของกองทัพปราบปราม จำเป็นจะต้องปิดต่อไปหรือไม่ขอรับ?”","สันตะปาปาอัลวิสเอ่ยถามขึ้นมา","ข่าวทั้งสองเรื่องนี้ล้วนเป็นเรื่องที่น่าตกใจอย่างไม่ต้องสงสัย หากถูกเปิดเผยออกไป ย่อมต้องทำให้เกิดความโกลาหลครั้งใหญ่ภายในจักรวรรดิอย่างแน่นอน และยังส่งผลกระทบอย่างรุนแรงต่อชื่อเสียงของศาสนจักร จนถึงขั้นทำให้ผู้ศรัทธาสั่นคลอนในความเชื่อที่มีต่อเทพเจ้า","แต่ผลกระทบของสงครามในครั้งนี้มันใหญ่หลวงเกินไปจริงๆ ดินแดนแห่งความตายที่แผ่ขยายออกไปกว่าสิบกิโลเมตร ย่อมไม่มีทางที่จะปิดบังเอาไว้ได้อย่างแน่นอน","“ไม่ ไม่มีความจำเป็นต้องปิดบังอีกต่อไปแล้ว!”","สตรีศักดิ์สิทธิ์เอ่ยด้วยน้ำเสียงเย็นชา","“จงไปบอกพวกมันว่าวันสิ้นโลกกำลังจะมาถึง และพวกพ่อมดนั่นแหละ ที่เป็นต้นเหตุทำให้เกิดภัยพิบัติแห่งวันสิ้นโลก!”","ภัยพิบัติแห่งวันสิ้นโลก?!","บรรดาระดับสูงของศาสนจักรที่อยู่ในเหตุการณ์ ต่างก็มีจิตใจที่สั่นสะท้าน แต่ไม่นานพวกเขาก็คิดได้ว่า นี่คือวิธีการ ‘ปลอบโยน’ ผู้ศรัทธาวิธีหนึ่งอย่างแน่นอน","ส่วนสตรีศักดิ์สิทธิ์ก็มองไปยังพระคัมภีร์ที่กางออก และยื่นมือออกไปลูบไล้บนหน้ากระดาษเบาๆ","ข้อมูลเกี่ยวกับลินน์ที่ถูกบันทึกเอาไว้ด้านบน ล้วนถูกเขียนขึ้นโดยเอ็ดเวลล์เมื่อหลายเดือนก่อน ซึ่งมันล้าสมัยไปนานแล้ว!","ภายใต้แสงศักดิ์สิทธิ์ที่พวยพุ่ง ข้อมูลใหม่ก็ปรากฏขึ้นบนหน้ากระดาษอย่างรวดเร็ว!","[ชื่อ: ลินน์","อันตรายระดับสูงสุด (ทูตแห่งวันสิ้นโลก)","ความผิด: ก่อให้เกิดภัยพิบัติแห่งวันสิ้นโลก, ทำลายกองทัพปราบปรามแห่งศาสนจักร, ทำให้อาณาจักรฮัดลาตาล่มสลาย!","ค่าหัว: เหรียญทองเซคัส...หนึ่งร้อยล้าน!]"]},{"n":444,"t":"ทำลายตำนานความไร้พ่ายของศาสนจักร!","c":["เวลาสามวันผ่านพ้นไปอย่างรวดเร็ว ข่าวเรื่องความพ่ายแพ้อย่างย่อยยับของกองทัพปราบปรามแห่งศาสนจักร การหายตัวไปของประธานผู้พิพากษา และการตายของอดีตสตรีศักดิ์สิทธิ์ลูเซีย ก็ได้แพร่กระจายไปทั่วพื้นที่กว่าครึ่งหนึ่งของจักรวรรดิอย่างรวดเร็ว","ข่าวลือต่างๆ นานาแพร่สะพัดไปทั่วเมืองศักดิ์สิทธิ์ บรรดาผู้ศรัทธาที่เคร่งศาสนาต่างก็ไม่อาจเชื่อได้ว่าข่าวนี้เป็นความจริง สตรีศักดิ์สิทธิ์และประธานผู้พิพากษาผู้แข็งแกร่งและสูงส่ง ซึ่งเปรียบเสมือนทูตของเทพเจ้าบนโลกมนุษย์ จะไปตายด้วยเงื้อมมือของสมุนปีศาจร้ายเหล่านั้นได้อย่างไร!","เหล่าพ่อมดและขุนนางที่ไม่พอใจในการปกครองของศาสนจักร ซึ่งซ่อนตัวอยู่ในเงามืด ต่างก็ช่วยกันโหมกระพือข่าวลือนี้ให้แพร่กระจายออกไป จนเวลาเพียงไม่กี่วัน ทุกคนในเมืองศักดิ์สิทธิ์ต่างก็รับรู้เรื่องนี้กันจนหมดสิ้น","เช้าของวันที่สาม สันตะปาปาอัลวิสได้อ่านโองการศักดิ์สิทธิ์ และประกาศข่าวอันน่าเศร้าสลดให้แก่ผู้ศรัทธาทุกคนทั่วทั้งจักรวรรดิได้รับรู้...นั่นก็คือการพิพากษาแห่งวันสิ้นโลกกำลังจะมาถึงแล้ว!","ทันทีที่คำพูดนี้ถูกกล่าวออกไป ไม่ว่าจะเป็นขุนนางหรือประชาชนของจักรวรรดิ ต่างก็ตกตะลึง และตื่นตระหนกตกใจเป็นอย่างมาก!","ทุกคนล้วนเข้าใจถึงความหมายของการพิพากษาแห่งวันสิ้นโลกเป็นอย่างดี...","ในบันทึกบทแห่งวันสิ้นโลกในหน้าสุดท้ายของพระคัมภีร์ศักดิ์สิทธิ์ ได้เขียนเอาไว้ว่า ความโลภและบาปในใจมนุษย์ จะดึงดูดสายตาของปีศาจร้าย และนำมาซึ่งความอดอยาก โรคระบาด และภัยพิบัติ!","หากบาปที่ก่อตัวขึ้นเหล่านี้ ทะลวงผ่านขีดจำกัดระดับหนึ่งไปได้ มันก็จะทำให้ปีศาจร้ายที่ถูกจองจำอยู่ในห้วงอเวจี เดินทางมาสู่โลกมนุษย์ เมื่อถึงเวลานั้นโลกทั้งใบจะถูกล้างบางครั้งใหญ่ วิญญาณของทุกคนจะถูกลากลงสู่นรก เพื่อรับการพิพากษาแห่งวันสิ้นโลก!","และในตอนนี้ มีเพียงการที่พระผู้เป็นเจ้าเสด็จลงมาบนโลกมนุษย์ด้วยพระองค์เองเท่านั้น ถึงจะสามารถหยุดยั้งภัยพิบัติแห่งวันสิ้นโลกนี้ได้!","“ขอให้พวกเราจงอุทิศความศรัทธาอันแรงกล้า แด่พระผู้เป็นเจ้าผู้ยิ่งใหญ่ ศักดิ์สิทธิ์ ยุติธรรม และเมตตากรุณาที่สุดของพวกเราด้วยเถิด!”","เสียงอันดังก้องของสันตะปาปาอัลวิสดังกระหึ่มไปทั่วทั้งเมืองศักดิ์สิทธิ์","ผู้ศรัทธานับแสนคนต่างพากันคุกเข่าลงกับพื้น บ้างก็ร้องเพลงสรรเสริญเสียงดังลั่น บ้างก็ร้องไห้คร่ำครวญสารภาพบาปของตัวเอง และสวดอ้อนวอนขอให้พระผู้เป็นเจ้าผู้ยิ่งใหญ่โปรดประทานการไถ่บาป เพื่อให้ตนเองรอดพ้นจากภัยพิบัติในห้วงอเวจี!","...","ในขณะที่ศาสนจักรกำลังแต่งเรื่องขึ้นมาเพื่อเป็นข้ออ้างสำหรับความพ่ายแพ้ของกองทัพปราบปราม ทางฝั่งของเมืองน้ำมันดิน สภาพ่อมดที่ได้รับชัยชนะในสงคราม ก็กำลังปวดหัวกับเรื่องจุกจิกต่างๆ มากมายเช่นเดียวกัน","เพราะหลังจากการต่อสู้ในครั้งนี้ พวกเขาเองก็ไม่ใช่ว่าจะไม่มีความสูญเสียใดๆ เรือเหาะกว่าร้อยลำที่รับหน้าที่หลอกล่อกองกำลังหลักของศาสนจักร ได้รับความเสียหายไปกว่าครึ่ง อีกทั้งยังมีผู้บาดเจ็บและล้มตายมากกว่าสองพันคน!","กองกำลังระดับแนวหน้าของสภา ก็แทบจะได้รับบาดเจ็บกันทุกคน!","แฮร์รอฟต้องรับการโจมตีอย่างสุดกำลังของลูเซียเข้าไปเต็มๆ ส่วนวิกโตริโอก็ตาบอดเพราะแสงสว่างจากระเบิดนิวเคลียร์ ตอนนี้ทั้งสองคนกำลังอยู่ในช่วงพักฟื้น","ส่วนลินน์ หลังจากที่เลื่อนระดับเป็นจอมเวทผู้ยิ่งใหญ่ระดับห้าวงแหวนแล้ว แม้ว่าการดึงพลังจากเครือข่ายเวทมนตร์ จะไม่ได้มีความเสี่ยงที่จะทำให้สมองตายอีกต่อไป แต่หากใช้เป็นเวลานาน มันก็ทำให้เกิดความเสียหายทางจิตวิญญาณไม่น้อยเช่นกัน","จอมเวทผู้ยิ่งใหญ่หลายคนที่บุกโจมตีเมืองน้ำมันดิน ก็ถูกประธานผู้พิพากษาโจชัวโจมตีจนแตกพ่ายไปคนละทิศคนละทาง และยังมีถึงสองคนที่ตายไปในที่เกิดเหตุ","นี่ขนาดยังเป็นเพราะแผนการอันยอดเยี่ยมของลินน์ ที่ทำให้พวกเขาไม่ต้องปะทะกับศาสนจักรตรงๆ ประกอบกับสตรีศักดิ์สิทธิ์ลูเซียที่ทรงพลัง และกองทัพปราบปรามแห่งศาสนจักรนับหมื่นคน ได้ถูกทำลายล้างไปในระเบิดนิวเคลียร์ทั้งหมด ไม่เช่นนั้นความสูญเสียคงจะเลวร้ายยิ่งกว่านี้อีก!","ดังนั้น หลังจากที่ได้รับชัยชนะ สภาจึงไม่ได้รีบร้อนที่จะไล่ตามตีศัตรู แต่เลือกที่จะพักฟื้นกองกำลังอยู่ช่วงหนึ่ง","การต่อสู้หลายครั้งติดต่อกันภายในเวลาหนึ่งปี และผู้บาดเจ็บจำนวนมหาศาล ทำให้ปริมาณยาวิเศษที่สภาสำรองเอาไว้ถูกใช้จนหมดเกลี้ยง ยิ่งไปกว่านั้นยังมีปัญหาเรื่องกัมมันตภาพรังสีที่อันตรายเป็นอย่างยิ่ง ที่จำเป็นต้องได้รับการแก้ไขอีกด้วย!","สถานที่ที่เมืองน้ำมันดินตั้งอยู่ อยู่ห่างจากเขตระเบิดนิวเคลียร์เพียงแค่ไม่ถึงเจ็ดกิโลเมตรเท่านั้น!","ระยะทางที่ใกล้ขนาดนี้ หมายความว่าพวกเขาจะได้รับผลกระทบจากกัมมันตภาพรังสีอย่างหลีกเลี่ยงไม่ได้ และน้ำในแม่น้ำที่อยู่ใกล้เคียงก็ไม่สามารถนำมาใช้ดื่มกินหรือรดน้ำต้นไม้ได้อีกต่อไป!","หลายวันมานี้ มีพ่อมดหลายคนเสนอให้ทิ้งเมืองแห่งนี้ไปโดยตรง หรือแม้กระทั่งทำลายมันทิ้งเสีย!","แต่ลินน์กลับปฏิเสธข้อเสนอนี้!","เพราะเมืองน้ำมันดินแห่งนี้มีประชากรอยู่เป็นจำนวนมาก และชาวเมืองก็มีอารมณ์ต่อต้านอย่างรุนแรง การอพยพผู้คนจำนวนมหาศาลจึงเป็นเรื่องที่ไม่ค่อยสมเหตุสมผลนัก","สิ่งที่สำคัญที่สุดก็คือ ตำแหน่งที่ตั้งทางภูมิศาสตร์ของมันค่อนข้างดี ซึ่งอยู่ไม่ไกลจากแหล่งน้ำมันมากนัก จึงคุ้มค่าที่จะเก็บรักษาเอาไว้","ด้วยเหตุนี้ ลินน์และบรรดานักเล่นแร่แปรธาตุจึงต้องเค้นสมองอย่างหนัก อาศัยคุณสมบัติของกัมมันตภาพรังสี มาสร้างม่านพลังเวทมนตร์ขึ้นมาครอบคลุมไปทั่วทั้งเมือง ซึ่งจะสามารถสกัดกั้นรังสีอันตรายเหล่านั้นเอาไว้ด้านนอกได้","ไม่กี่วันต่อมา ผู้คนที่ถูกส่งออกไปสืบข่าวก็ทยอยเดินทางกลับมา สภาพ่อมดจึงเรียกประชุมสมาชิกสภาอีกครั้ง","พ่อมดสายแปรสภาพเดล ได้สรุปรายงานสั้นๆ เกี่ยวกับข้อมูลที่เขารวบรวมมาได้ในช่วงหลายวันที่ผ่านมา","สิ่งที่ใช้ตัดสินผลแพ้ชนะของสงคราม นอกเหนือจากยุทธวิธีต่างๆ อย่างการระดมทรัพยากร และความสามารถในการต่อสู้ซึ่งหน้าแล้ว การรวบรวมข่าวสารก็เป็นสิ่งที่สำคัญมากเช่นเดียวกัน แน่นอนว่าทางสภาให้ความสำคัญกับเรื่องนี้เป็นอย่างมาก ดังนั้น พวกเขาจึงได้วางแผนบางอย่างเอาไว้ตั้งแต่เนิ่นๆ","บรรดาพ่อมดสายแปรสภาพที่เชี่ยวชาญด้านเวทมนตร์แปลงกายนั้น ย่อมมีความได้เปรียบในการรวบรวมข่าวสารมากกว่าใครอย่างไม่ต้องสงสัย","นอกจากการแปลงกายเป็นสิ่งมีชีวิตเฉพาะเจาะจงได้แล้ว พวกเขายังสามารถปรับเปลี่ยนรูปลักษณ์ของตัวเองได้ในระดับหนึ่งด้วย","หากสามารถหาคนที่มีรูปร่างและหน้าตาคล้ายคลึงกันได้ และอาศัยการค้นหาความทรงจำของพ่อมดสายพลังจิตวิญญาณ พวกเขาก็จะสามารถสวมรอยเป็นอีกฝ่าย และใช้ตัวตนที่ถูกกฎหมายในการเคลื่อนไหวอย่างลับๆ ได้โดยตรง","แน่นอนว่าการปลอมตัวเช่นนี้ใช่ว่าจะไม่สามารถถูกจับได้ เมื่อต้องเผชิญหน้ากับนักบวชที่แข็งแกร่ง พลังเวทมนตร์ในร่างกายของพวกเขาก็มีโอกาสสูงที่จะถูกตรวจพบ ดังนั้น เดลและคนอื่นๆ จึงไม่กล้าเข้าใกล้เมืองศักดิ์สิทธิ์มากนัก โดยทำได้เพียงสอบถามข่าวสารผ่านขบวนคาราวานพ่อค้าที่สัญจรไปมาเท่านั้น","เมื่อได้ยินว่าข่าวความพ่ายแพ้ของกองทัพปราบปราม ได้แพร่กระจายผ่านคาราวานพ่อค้าไปทั่วอาณาเขตกว่าครึ่งของจักรวรรดิ ลินน์และคนอื่นๆ ต่างก็รู้สึกประหลาดใจเป็นอย่างมาก","“ทำไมถึงได้เร็วขนาดนี้? หรือว่าศาสนจักรไม่ได้พยายามหยุดยั้งการแพร่กระจายของข่าวนี้เลยงั้นรึ?”","แฮร์รอฟขมวดคิ้ว และเอ่ยถามด้วยความสงสัย","“จากที่พวกเราทราบมา พวกเขาไม่ได้ทำอะไรเลย”","เดลแสดงสีหน้าลังเลออกมา","“พวกนักบวชและบิชอปกลับเป็นฝ่ายโหมกระพือเรื่องนี้เสียเอง โดยอาศัยข่าวลือนี้มาประกาศเรื่องการพิพากษาแห่งวันสิ้นโลกในพระคัมภีร์”","“การพิพากษาแห่งวันสิ้นโลก?”","แฮร์รอฟและคนอื่นๆ อดไม่ได้ที่จะชะงักไปครู่หนึ่ง เรื่องนี้มันไปเกี่ยวอะไรกับวันสิ้นโลกด้วย?","เดลรีบเล่าคำกล่าวอ้างเกี่ยวกับวันสิ้นโลกของบรรดาบิชอปและนักบวชของศาสนจักร ที่เขาไปสืบมาให้ทุกคนฟังอีกครั้ง","หลังจากที่ได้ฟัง บรรดาผู้คนที่อยู่ในเหตุการณ์ต่างก็พูดไม่ออก พวกเขาต้องยอมรับเลยว่า ความสามารถในการหลอกลวงผู้ศรัทธาของศาสนจักรนั้น ถือว่าไปถึงขีดสุดแล้วจริงๆ!","แบบนี้ก็ยังจะแถให้เข้าข้างตัวเองได้อีก!","“พวกเขานี่เก่งในการแต่งเรื่องจริงๆ!”","วิกโตริโอหัวเราะเยาะ และส่ายหน้าไปมา เขามองออกถึงแผนการของอีกฝ่ายแล้ว","แทนที่จะรอให้ข่าวแพร่กระจายมาถึง จนทำให้เกิดความวุ่นวายภายในจักรวรรดิ และสั่นคลอนความศรัทธาของผู้ศรัทธา สู้แต่งเรื่องที่ฟังดูมีเหตุผลเพื่อหลอกลวงผู้คนเสียตั้งแต่แรกยังจะดีกว่า","“ดูเหมือนว่าแผนการของเจ้าจะล้มเหลวแล้วล่ะ!”","ออโรร่าหันไปมองลินน์ และเอ่ยขึ้นมาด้วยความขบขัน","“ไม่เป็นไรหรอก ข่าวพวกนี้ไม่ได้มีไว้ให้พวกผู้ศรัทธาที่คลั่งไคล้อ่านเพียงอย่างเดียวเสียหน่อย!”","ลินน์ยักไหล่ โดยไม่ได้ใส่ใจอะไรมากนัก","ผู้คนทั้งจักรวรรดิไม่ได้เป็นน้ำหนึ่งใจเดียวกันเสียหน่อย ความขัดแย้งระหว่างอำนาจศักดิ์สิทธิ์ ขุนนาง และประชาชน ไม่ได้เป็นปัญหาที่เกิดขึ้นแค่ในอาณาจักรฮัดลาตาเท่านั้น","เพียงแต่ก่อนหน้านี้ อำนาจบารมีของศาสนจักรนั้นรุ่งโรจน์ถึงขีดสุด จึงสามารถกดการต่อต้านทั้งหมดเอาไว้ได้ ทำให้ปัญหาเหล่านี้ดูไม่ชัดเจนนัก แต่เมื่อใดก็ตามที่ศาสนจักรมีทีท่าว่าจะอ่อนแอลง ปัญหาเหล่านี้ก็จะปะทุขึ้นมาอีกครั้ง!","ดังนั้น ไม่ว่าบรรดานักบวชและบิชอปเหล่านั้นจะเปลี่ยนวิธีแก้ตัวอย่างไร พวกเขาก็ไม่สามารถเปลี่ยนแปลงความจริงอันหนักแน่นที่ว่า...กองทัพปราบปรามพ่ายแพ้ในการรบที่อาณาจักรอย่างต่อเนื่องได้!","พวกเขาได้ทำลายตำนานความไร้พ่ายของศาสนจักรลงแล้ว!"]},{"n":445,"t":"กุญแจสำคัญในการเลื่อนระดับเป็นตำนานก็คือ ข้าจะไม่เป็นมนุษย์อีกต่อไปแล้ว!","c":["อำนาจของศาสนจักรได้หยั่งรากลึกลงบนแผ่นดินผืนนี้มาอย่างยาวนาน การที่จะกวาดล้างพวกมันให้สิ้นซากนั้น ไม่ใช่เรื่องง่ายเลย","แต่การทำลายล้างอำนาจบารมีที่อีกฝ่ายสั่งสมมาหลายปีลงได้ ย่อมถือเป็นการเริ่มต้นที่ดีอย่างไม่ต้องสงสัย!","ลินน์เชื่อว่า ภายในจักรวรรดิจะต้องมีผู้คนที่ไม่พอใจการปกครองของศาสนจักรอยู่อีกเป็นจำนวนมากอย่างแน่นอน ไม่ต้องพูดถึงใครอื่น เอาแค่พวกพ่อมดเพียงอย่างเดียวก็มีนับหมื่นคนเข้าไปแล้ว!","หลังจากที่พวกเขายึดครองอาณาจักรฮัดลาตาได้ ก็มีพ่อมดทยอยเดินทางมาขอเข้าร่วมอย่างต่อเนื่อง แต่คนส่วนใหญ่ก็ยังคงรอดูสถานการณ์อยู่ ว่าพวกสภาจะถูกศาสนจักรบดขยี้จนแหลกสลาย หรือจะสามารถเดินหน้าต่อไปได้อย่างต่อเนื่อง!","และเมื่อข่าวแพร่กระจายออกไป ย่อมต้องมีพ่อมดจำนวนมากขึ้นเรื่อยๆ ที่เดินทางมายังอาณาจักรเพื่อแสวงหาทางรอดอย่างแน่นอน","แม้ว่าคนเหล่านี้ส่วนใหญ่จะไม่ได้รับการศึกษาด้านเวทมนตร์อย่างสมบูรณ์ และมีระดับความรู้ทางเวทมนตร์ศาสตร์ที่แตกต่างกันไป แต่ในโลกต่างมิตินี้ พวกเขาก็ถือว่าเป็นบุคลากรที่มีคุณภาพสูงแล้ว!","ในขณะที่ลินน์กำลังครุ่นคิดอยู่ บรรดาสมาชิกสภาภายในห้องประชุม ก็ได้เริ่มถกเถียงกันว่า พวกเขาควรจะเปิดฉากโจมตีสวนกลับจักรวรรดิและศาสนจักรต่อไปหรือไม่","ซึ่งจำนวนของผู้ที่เห็นด้วยนั้น มีมากกว่าผู้ที่คัดค้านอยู่หลายขุม เพราะหลังจากที่ได้เห็นอานุภาพของมหาเวทระเบิดนิวเคลียร์ พ่อมดหลายคนก็ตกอยู่ในอาการคลั่งไคล้นิวเคลียร์อย่างหนัก!","ก็พลังที่สามารถทำลายล้างเมืองทั้งเมืองได้ในการโจมตีเพียงครั้งเดียวนั้น มันช่างน่าหลงใหลเสียเหลือเกิน","ถึงขนาดมีพ่อมดบางคนคิดว่า ภายใต้พลังอันยิ่งใหญ่เช่นนี้ สิ่งที่เรียกว่าพระเจ้าจอมปลอมเอลาก็ไม่ได้มีอะไรน่ากลัวเลย พวกเขาถึงกับส่งเสียงเรียกร้องให้สั่งสอนศาสนจักรเสียบ้าง อย่างเช่นเอาระเบิดไปถล่มเมืองศักดิ์สิทธิ์ ซึ่งเป็นเหมือนกับหน้าตาของศาสนจักรทิ้งเสีย!","และยังมีบางคนเสนอให้ไล่ถล่มเมืองทุกเมืองในจักรวรรดิไปเลย เพื่อไล่ต้อนศัตรูที่กำลังพ่ายแพ้ และกวาดล้างศาสนจักรให้สิ้นซากไปในคราวเดียว!","แต่บรรดาประธานสภากลับมีท่าทีที่เยือกเย็นเป็นอย่างมาก เพราะพวกเขาเข้าใจดีว่า ยูเรเนียม-235 ที่สกัดออกมาจากหินปีศาจนั้น เหลือพอให้ใช้ร่ายเวทระเบิดนิวเคลียร์ได้อีกเพียงแค่ครั้งเดียวเท่านั้น และไม่สามารถนำมาใช้สุ่มสี่สุ่มห้าได้!","ส่วนเรื่องแร่ยูเรเนียมนั้น พวกเขาก็กำลังขุดกันอยู่ เพียงแต่ต้องคำนึงถึงเรื่องการรักษาความลับอย่างเข้มงวด ความคืบหน้าในการขุดจึงเป็นไปอย่างล่าช้ามาก","ได้ยินมาว่าทางสถาบันวิจัยการเล่นแร่แปรธาตุ กำลังคิดค้นเครื่องจักรเล่นแร่แปรธาตุ ที่ออกแบบมาสำหรับการขุดเหมืองโดยเฉพาะอยู่ ซึ่งก่อนที่ของพรรค์นั้นจะถูกสร้างขึ้นมาจนเสร็จ พวกเขาก็ทำได้เพียงเก็บเวทมนตร์รูปแบบใหม่ที่น่าสะพรึงกลัวบทนี้ เอาไว้เป็นไพ่ตายใบสุดท้ายเท่านั้น!","ในท้ายที่สุด การสนทนาทั้งหมดก็ย่อมต้องมาบรรจบอยู่ที่ลินน์ ผู้ซึ่งเป็นดาวรุ่งแห่งเวทมนตร์อย่างหลีกเลี่ยงไม่ได้","ลินน์ยกมือขึ้นเพื่อห้ามปรามเสียงถกเถียงที่ดังเซ็งแซ่ภายในห้องประชุม เขาไม่ได้รีบร้อนที่จะสรุปผล แต่กลับหันไปมองเดล และเอ่ยถามขึ้นมาว่า","“นอกจากเรื่องทฤษฎีวันสิ้นโลกที่ว่ามาแล้ว ทางเมืองศักดิ์สิทธิ์มีการเคลื่อนไหวอื่นๆ อีกหรือไม่?”","ในเมื่อร่างจุติของพระเจ้าจอมปลอมนั่นได้ตายไปแล้ว ตามการคาดเดาของเขา พวกระดับสูงของศาสนจักรก็ควรจะได้รับผลกระทบอะไรบางอย่างบ้างสิ","เดลลังเลอยู่ครู่หนึ่ง ก่อนจะเอ่ยตอบกลับไปว่า","“ข้าได้ยินมาว่า เมื่อไม่นานมานี้ ทางศาสนจักรได้คัดเลือกสตรีศักดิ์สิทธิ์คนใหม่ขึ้นมาแล้ว!”","“สตรีศักดิ์สิทธิ์คนใหม่? เร็วขนาดนั้นเชียว?”","แฮร์รอฟรู้สึกประหลาดใจเล็กน้อย และเมื่อเขาหันไปสบตากับประธานสภาคนอื่นๆ เขาก็สามารถมองเห็นถึงความเคร่งเครียดที่ฉายชัดอยู่ในดวงตาของแต่ละคนได้อย่างชัดเจน","“ดูเหมือนว่าสิ่งที่เราฆ่าไป จะเป็นเพียงแค่ร่างจุติเท่านั้น มันแทบจะไม่ได้ส่งผลกระทบอะไรต่อร่างต้นของพระเจ้าจอมปลอมนั่นเลย”","ออโรร่าทอดถอนใจ และเอ่ยขึ้นมา ดูเหมือนว่าแผนการจัดการกับศาสนจักรคงจะต้องเลื่อนออกไปก่อนเสียแล้ว","“ประธานสภาวิกโตริโอ แล้วท่านประธานผู้พิพากษาของศาสนจักรคนนั้นล่ะ?”","ลินน์โพล่งถามขึ้นมากะทันหัน","นักบวชระดับตำนานผู้นี้ ย่อมถือเป็นผลงานชิ้นโบแดงที่สุดในสงครามครั้งนี้อย่างไม่ต้องสงสัย!","เพราะการที่จะจับเป็นผู้ที่มีพลังระดับตำนานนั้นไม่ใช่เรื่องง่ายเลย และความสำเร็จในครั้งนี้ก็ถือว่าโชคช่วยล้วนๆ!","“ข้าขังมันเอาไว้ในสถานที่ลับแห่งหนึ่ง แต่ปากของเจ้านี่แข็งมาก แม้แต่เวทมนตร์สายพลังจิตวิญญาณของข้า ก็ยังไม่สามารถทะลวงผ่านการป้องกันทางจิตใจของมันไปได้...”","วิกโตริโอเอ่ยด้วยความปวดหัว","เมื่อสามวันก่อน หลังจากที่ดวงตาของเขากลับมามองเห็นได้อีกครั้ง วิกโตริโอก็เริ่มดำเนินการสอบสวนโจชัวในทันที","ในฐานะที่เป็นระดับสูงของศาสนจักร อีกฝ่ายจะต้องรู้ความลับมากมายเกี่ยวกับพระเจ้าจอมปลอมนั่นอย่างแน่นอน","แต่กระบวนการสอบสวนกลับไม่ราบรื่นเอาเสียเลย เพราะความแข็งแกร่งทางวิญญาณของอีกฝ่ายอยู่ในระดับที่สูงมาก และยังมีจิตใจที่เด็ดเดี่ยวอย่างหาที่เปรียบไม่ได้ ต่อให้เป็นการทรมานที่โหดร้ายทารุณมากเพียงใด ก็ยังไม่เพียงพอที่จะสั่นคลอนความเชื่อของอีกฝ่ายได้เลย","แน่นอนว่าหลังจากที่ทรมานมันอยู่หลายวัน เขาก็ไม่ใช่ว่าจะไม่ได้อะไรกลับมาเลย วิกโตริโอรู้สึกสนใจในความเป็นอมตะของนักบวชระดับตำนานเหล่านี้เป็นอย่างมาก ดังนั้น เขาจึงเฉือนเนื้อเยื่อของอีกฝ่ายออกมาส่วนหนึ่ง เพื่อนำไปทำการวิจัย","และผลลัพธ์ที่ได้ออกมา ก็ทำให้เขาตกตะลึงเป็นอย่างมาก!","หลังจากที่ใช้มหาเวทย่อยสลาย เพื่อวิเคราะห์ก้อนเนื้อเหล่านั้น วิกโตริโอก็คิดว่า เขาจะได้รับธาตุพื้นฐานที่ประกอบขึ้นเป็นเนื้อเยื่อของมนุษย์กลับมา แต่ผลปรากฏว่า...มันไม่มีอะไรเลย!","ก้อนเนื้อนี้ราวกับเป็นของปลอม เขาเพียงแค่สัมผัสได้ถึงความผันผวนของพลังศักดิ์สิทธิ์เท่านั้น!","“ท่านกำลังจะบอกว่า ร่างกายของประธานผู้พิพากษาผู้นั้น ถูกสร้างขึ้นมาจากพลังศักดิ์สิทธิ์ทั้งหมดเลยงั้นรึ?”","แฮร์รอฟขมวดคิ้วแน่น และเอ่ยถามด้วยน้ำเสียงที่เต็มไปด้วยความสงสัย","การใช้พลังเวทมนตร์จำลองรูปแบบของธาตุต่างๆ ถือเป็นความจริงที่พ่อมดทุกคนล้วนทราบกันดี","และธาตุที่ถูกจำลองขึ้นมาเหล่านี้ ก็แทบจะมีคุณสมบัติของสสารทุกประการ แต่มันก็ยังไม่สามารถเปลี่ยนแปลงความจริงที่ว่า แก่นแท้ของมันก็คือพลังเวทมนตร์ได้อยู่ดี...","“หรือว่าตอนนี้มันจะกลายเป็นร่างวิญญาณไปแล้ว?”","ออโรร่าเอ่ยตั้งข้อสันนิษฐาน","การใช้พลังเวทมนตร์เป็นตัวนำพาวิญญาณ ไม่ใช่เรื่องแปลกใหม่อะไร หากมีความแข็งแกร่งทางวิญญาณตั้งแต่ระดับจอมเวทผู้ยิ่งใหญ่ขึ้นไป และมีแหล่งพลังงานหล่อเลี้ยงมากพอ พวกเขาก็สามารถแยกตัวออกจากร่างกาย และดำรงอยู่เพียงลำพังได้","เวทมนตร์ร่างจำลองและเวทมนตร์ภาพสะท้อนที่เธอคิดค้นขึ้น ล้วนแต่ต้องใช้ทักษะที่เกี่ยวข้องกับเรื่องนี้ทั้งสิ้น เพียงแต่ทันทีที่เวทมนตร์เหล่านี้ถูกกระตุ้นขึ้นมา มันก็จะผลาญพลังเวทมนตร์เพื่อรักษาสติสัมปชัญญะเอาไว้อย่างไม่หยุดหย่อน","ยิ่งเป็นร่างวิญญาณที่แข็งแกร่งมากเท่าไหร่ อัตราการใช้พลังงานก็จะยิ่งน่าสะพรึงกลัวมากขึ้นเท่านั้น...","“ไม่ มันไม่ได้ง่ายดายขนาดนั้น”","วิกโตริโอส่ายหน้า ราวกับกำลังครุ่นคิดว่า ควรจะใช้คำพูดแบบไหนมาอธิบายดี ในท้ายที่สุด เขาก็ตัดสินใจเอ่ยออกมาว่า","“อันที่จริง ก่อนที่จะใช้เวทย่อยสลาย ข้าก็เคยคิดว่านี่คือก้อนเนื้อของมนุษย์จริงๆ”","“นี่แม้แต่ท่านก็ยังมองไม่ออกเลยงั้นรึ?”","แฮร์รอฟรู้สึกประหลาดใจเล็กน้อย ดูเหมือนว่าพวกระดับตำนานของศาสนจักรจะมีลูกเล่นบางอย่างซ่อนอยู่จริงๆ","อุปสรรคที่ใหญ่ที่สุดที่ขวางกั้นไม่ให้พวกเขาก้าวไปสู่ระดับที่สูงขึ้นได้ ก็คือข้อจำกัดของร่างกาย และการใช้พลังเวทมนตร์เพื่อแทนที่การทำงานของร่างกาย แล้วค้ำจุนร่างวิญญาณเอาไว้ อาจจะเป็นหนทางที่เป็นไปได้","แต่ปัญหาคือพวกเขาควรจะทำอย่างไร?","นี่ไม่ใช่แค่การใช้พลังเวทมนตร์จำลอง และสร้างร่างกายขึ้นมาใหม่เฉยๆ แน่นอน!","บรรดาสมาชิกสภาที่อยู่ในเหตุการณ์ต่างก็พากันถกเถียง ถึงการค้นพบอันแสนจะแปลกใหม่ในครั้งนี้ ในขณะที่ลินน์เองก็ตกอยู่ในภวังค์ความคิดเช่นเดียวกัน","เส้นแบ่งระหว่างสสารและพลังงานงั้นรึ?","ลินน์คิดอะไรบางอย่างขึ้นมาได้อย่างรวดเร็ว","ในเมื่อมวลสามารถเปลี่ยนเป็นพลังงานได้ ในทางกลับกัน พลังงานก็ย่อมสามารถเปลี่ยนเป็นมวลได้เช่นเดียวกัน หรือแม้กระทั่ง ขอเพียงแค่สลับสมการมวล-พลังงานเล็กน้อย พวกเขาก็จะสามารถหาค่าของมันได้แล้ว...","แน่นอนว่าคำกล่าวนั้นอาจจะไม่ถูกต้องเสียทีเดียว เพราะพลังงานและสสารล้วนเป็นสิ่งเดียวกัน เพียงแต่ดำรงอยู่ในรูปแบบที่แตกต่างกันเท่านั้น!","ยกตัวอย่างเช่น ไอน์สไตน์ผู้โด่งดังก็เคยกล่าวเอาไว้ว่า มวลของสสารก็คือการวัดปริมาณพลังงานของสสารนั่นเอง","แต่การที่จะทำเช่นนั้นได้ ไม่ใช่เรื่องง่ายเลย เพราะการเปลี่ยนพลังงานให้กลายเป็นมวล ถือเป็นสาขาวิชาที่ล้ำหน้าที่สุดของสหพันธรัฐในชาติก่อน และข้อมูลที่เกี่ยวข้องซึ่งถูกบันทึกเอาไว้ภายในปัญญาประดิษฐ์สนับสนุนก็มีอยู่อย่างจำกัด มันจึงไม่สามารถให้ความช่วยเหลือเขาได้มากนัก","แล้ว ‘เอลา’ ผู้ซึ่งมี ‘ระดับการศึกษาไม่สูงนัก’ สามารถทำเรื่องแบบนี้ได้อย่างไร?","ลินน์ชะงักไปครู่หนึ่ง จากนั้นก็มีคำสองคำผุดขึ้นมาในหัวของเขาอย่างช่วยไม่ได้...นั่นก็คือ เวทมนตร์ และ พลังจิตวิญญาณ!","มีเพียงแค่พลังทั้งสองสายนี้ ที่อยู่นอกเหนือระบบวิทยาศาสตร์ของสหพันธรัฐเท่านั้น ที่จะสามารถช่วยให้อีกฝ่ายทำเรื่องแบบนี้ได้สำเร็จ"]},{"n":446,"t":"ต่อให้เป็นเทพเจ้า แต่เมื่อต้องเผชิญหน้ากับเวทมนตร์บทใหม่ที่ข้าคิดค้นขึ้นมา มันก็ยังคงอ่อนแอจนทนรับการโจมตีไม่ได้แม้แต่ครั้งเดียวอยู่ดี!","c":["ลินน์ยังคงจำได้ดีว่า เมื่อสองปีครึ่งก่อน ตอนที่เขาเพิ่งจะทะลุมิติมาที่นี่ ปัญญาประดิษฐ์สนับสนุนได้ประเมินเวทมนตร์และพลังวิญญาณเอาไว้ว่าอย่างไร","ดูเหมือนพวกมันจะเป็นพลังงานรูปแบบหนึ่งเช่นเดียวกัน","ถ้าอย่างนั้น สมการมวล-พลังงาน จะสามารถนำมาใช้กับพลังจิตวิญญาณและเวทมนตร์ได้หรือไม่?","ยิ่งลินน์คิดลึกลงไปมากเท่าไหร่ เขาก็ยิ่งรู้สึกเลือนรางว่า เส้นทางสู่ระดับตำนานนั้น ดูเหมือนจะอยู่ตรงหน้าของเขานี่เอง!","สิ่งที่ขาดไป มีเพียงแค่ช่องโหว่สำคัญในการทะลวงผ่านเท่านั้น!","และช่องโหว่นั้น การจะไปค้นหาจากประธานผู้พิพากษาโจชัวที่เพิ่งจะถูกจับตัวมา ย่อมเป็นวิธีที่ง่ายที่สุดอย่างแน่นอน!","เมื่อคิดได้ดังนั้น ลินน์ก็หันไปมองวิกโตริโอ และเอ่ยถามขึ้นมา","“ท่านเคยลองใช้วิธีโจมตีทางความเชื่อดูบ้างหรือไม่ ประธานสภาวิกโตริโอ?”","สำหรับผู้ศรัทธาที่คลั่งไคล้นั้น สิ่งที่เรียกว่าการทรมานหรือการหยามเกียรติ ล้วนเป็นเพียงเรื่องเล็กน้อย ขอเพียงแค่ความเชื่อภายในใจของพวกเขาไม่สั่นคลอน ไม่ว่าจะทำอะไรก็เปล่าประโยชน์","“เรื่องนั้นข้ายังไม่ได้ลองเลย”","วิกโตริโอส่ายหน้า","เวลาสามวันนั้นสั้นเกินไป แถมเขายังต้องแบ่งเวลาไปวิจัยโครงสร้างร่างกายของโจชัวอีก เขาจึงเพิ่งจะลองใช้วิธีสอบสวนไปแค่ห้าวิธีเท่านั้น","“สรุปก็คือพวกเราสามารถลองเริ่มจากจุดนี้ดูได้!”","ลินน์เอ่ยเสนอ","“ข้าต้องการจะไปพบหน้าท่านประธานผู้พิพากษาผู้นั้นด้วยตัวเองสักหน่อย”","วิกโตริโอย่อมไม่มีความเห็นเป็นอย่างอื่น","การที่เขาเอาตัวโจชัวไปซ่อนในสถานที่ลับ ไม่ใช่เพื่อที่จะฮุบผลประโยชน์เอาไว้คนเดียว และแอบวิจัยอย่างลับๆ แต่เป็นเพราะเขากังวลว่าข่าวจะรั่วไหลออกไปต่างหาก","เพราะหากศาสนจักรรับรู้ว่าประธานผู้พิพากษาถูกพวกเขาจับตัวไป และสืบหาจนรู้สถานที่คุมขัง พวกมันจะต้องทุ่มกำลังทั้งหมด เพื่อมาช่วยเหลือนักบวชระดับตำนานผู้นี้อย่างแน่นอน!","“จริงสิ ข้ามีเรื่องหนึ่งจะบอก มันเป็นเรื่องที่เกี่ยวกับเจ้าด้วยนะ!”","วิกโตริโอหยิบหนังสือที่มีความหนาประมาณสี่นิ้วออกมาจากอกเสื้อ และวางลงบนโต๊ะ ก่อนจะหันไปมองลินน์ และเอ่ยขึ้นด้วยรอยยิ้ม","เพียงแค่ปราดตามอง ลินน์ก็ดูออกในทันทีว่า นี่คือพระคัมภีร์ศักดิ์สิทธิ์!","แต่สิ่งที่วิกโตริโอหยิบออกมานั้น แตกต่างจากฉบับคัดลอกที่พวกนักบวชและบิชอปทั่วไปพกติดตัวอยู่พอสมควร มันดูไม่ธรรมดาเป็นอย่างมาก และมีความเป็นไปได้ถึงเก้าในสิบส่วน ที่จะเป็นคัมภีร์ที่ประธานผู้พิพากษาโจชัวพกติดตัวเอาไว้!","ยังไม่ทันที่ลินน์จะได้เอ่ยถาม วิกโตริโอก็เป็นฝ่ายเปิดพระคัมภีร์เล่มนั้นออกเสียก่อน","“ศาสนจักรได้ออกประกาศจับเจ้าแล้วนะ!”","คราวนี้ไม่ใช่แค่ลินน์เท่านั้น แต่บรรดาสมาชิกสภาที่อยู่ในเหตุการณ์ต่างก็ให้ความสนใจ และพากันชะโงกหน้าเข้ามาดู ก่อนที่พวกเขาจะตกตะลึงกับเลขศูนย์ที่ยาวเป็นหางว่าว...","“หนึ่งร้อยล้าน...เหรียญทองเซคัสเนี่ยนะ?”","หลังจากตรวจสอบซ้ำแล้วซ้ำเล่า จนแน่ใจว่าตัวเองไม่ได้ตาฝาด สีหน้าของลินน์ก็เต็มไปด้วยความประหลาดใจ","ต้องรู้ก่อนว่า ภาษีที่อาณาจักรจัดเก็บได้ในหนึ่งปี ยังมีไม่ถึงสิบล้านเหรียญทองเซคัสเลยด้วยซ้ำ","ให้ตายเถอะ ถ้าจะพูดให้ถูกก็คือ ค่าหัวของเขามีมูลค่าเทียบเท่ากับภาษีของอาณาจักรนานนับสิบปีเลยทีเดียว!","ลินน์ถึงกับหัวเราะไม่ออก เขาไม่รู้ตัวเลยว่าจู่ๆ ตัวเองก็มีค่าหัวมหาศาลเทียบเท่ากับความมั่งคั่งของอาณาจักรไปเสียแล้ว!","แถมไอ้ทูตแห่งวันสิ้นโลกนี่มันอะไรกันอีก?","“สรุปก็คือ เจ้าควรจะระวังตัวเอาไว้ให้ดี เงินรางวัลที่สูงลิบลิ่วขนาดนี้ เกรงว่าจะดึงดูดสายตาของผู้คนจำนวนไม่น้อยเลยล่ะ...”","วิกโตริโอเอ่ยเตือน","แม้ว่าตอนนี้ลินน์จะเลื่อนระดับเป็นจอมเวทผู้ยิ่งใหญ่แล้ว และมีความสามารถในการต่อสู้ที่แข็งแกร่งมาก จนหาคนที่จะเอาชนะเขาได้ยาก แต่การลอบสังหารนั้นไม่ใช่การต่อสู้ซึ่งหน้า และเล่ห์เหลี่ยมสกปรกต่างๆ นานา ก็ล้วนเป็นเรื่องที่น่าปวดหัวทั้งสิ้น!","ต่อให้จะแข็งแกร่งแค่ไหน ก็ยังมีโอกาสพลาดท่าได้เสมอ!","...","การประชุมของสภาพ่อมดในครั้งนี้ กินเวลานานถึงสามชั่วโมงกว่าจะสิ้นสุดลง เนื่องจากศาสนจักรได้คัดเลือกสตรีศักดิ์สิทธิ์คนใหม่ขึ้นมาแล้ว หลังจากที่บรรดาประธานสภาได้ปรึกษาหารือกัน พวกเขาก็ตัดสินใจกดดันเสียงเรียกร้องของกลุ่มที่สนับสนุนการทำสงครามเอาไว้ก่อน โดยเลือกที่จะระงับปฏิบัติการโจมตีจักรวรรดิเอาไว้ชั่วคราว เพื่อสร้างความมั่นคงภายในให้ดีเสียก่อน","เพราะผลลัพธ์ที่พวกเขาได้รับในครั้งนี้ ถือว่ายิ่งใหญ่มากแล้ว นอกจากการยึดคืนพื้นที่ทั้งหมดของอาณาจักรฮัดลาตา พวกเขายังสามารถยึดครองดินแดนชายแดนของจักรวรรดิมาได้อีกหนึ่งแห่งด้วย!","สิ่งที่สำคัญที่สุดก็คือ ดินแดนใหม่ที่ยึดมาได้ทั้งหมด ล้วนผ่านการทำความสะอาดมาแล้วทั้งสิ้น ขุนนางในพื้นที่หากไม่ถูกจับแขวนคอ ก็ยอมรับการสวามิภักดิ์กันไปหมดแล้ว นอกเหนือจากการที่ต้องปฏิบัติตามคำสั่งของกษัตริย์ พวกเขาก็จะไม่ถูกแทรกแซงใดๆ ทั้งสิ้น ซึ่งมันเหมาะมากสำหรับการพัฒนาอุตสาหกรรมในวงกว้าง!","แต่สำหรับระดับสูงของสภาแล้ว สิ่งเหล่านี้ล้วนเป็นเพียงเรื่องเล็กน้อย เพราะลินน์เข้าใจดีว่า มหาเวทระเบิดนิวเคลียร์ สามารถใช้เป็นเพียงแค่เครื่องมือในการข่มขวัญเท่านั้น","มีเพียงการทะลวงระดับขึ้นเป็นตำนานที่แท้จริงเท่านั้น ถึงจะมีความหวังในการเอาชนะพระเจ้าจอมปลอมนั่นได้อย่างเด็ดขาด!","ดังนั้น หลังจากที่เลิกประชุม ลินน์จึงเดินตามวิกโตริโอไปยังสถานที่ลับที่ใช้คุมขังโจชัว","สถานที่แห่งนั้นอยู่ใกล้กว่าที่เขาคาดคิดเอาไว้มาก...มันอยู่ลึกลงไปใต้ดินของห้องประชุมนี่เอง!","“ห้องใต้ดินแห่งนี้เป็นความลับมาก ข้าค้นพบมันจากสมองของดยุกคนนั้น และไม่มีใครอื่นรู้เรื่องนี้อีก”","วิกโตริโอเอ่ยอธิบาย","นอกจากนี้ การคุมขังอีกฝ่ายเอาไว้ใต้ห้องประชุม ยังมีข้อดีอีกอย่างหนึ่ง นั่นก็คือการจัดเตรียมเวรยามจำนวนมากเอาไว้ที่นี่ จะไม่ทำให้คนอื่นเกิดความสงสัย","ที่พักของพวกเขาก็อยู่ห่างจากที่นี่ไม่ไกลนัก หากเกิดเหตุฉุกเฉินอะไรขึ้น พวกเขาก็สามารถรุดมาที่นี่ได้ในทันที!","วิกโตริโอพร่ำบ่นกับลินน์เกี่ยวกับความหัวแข็งของท่านประธานผู้พิพากษาผู้นี้ และหลังจากที่เปิดประตูเหล็กกล้าบานหนาหนักออก ลินน์ก็มองเห็นโจชัวที่ถูกคุมขังอยู่ด้านใน...","แตกต่างจากภาพลักษณ์ที่หยิ่งผยอง และมีสง่าราศีในตอนที่พบกันครั้งก่อนโดยสิ้นเชิง สภาพของประธานผู้พิพากษาในเวลานี้น่าเวทนาเป็นอย่างมาก ร่างกายของเขากำลังถูกพันธนาการเอาไว้ด้วยโซ่รูนเส้นหนาหลายเส้น","ทุกๆ สองสามวินาที โซ่รูนเหล่านี้ก็จะส่องแสงสว่างจ้า และปลดปล่อยสายฟ้าฟาดที่รุนแรงออกมา จนทำให้กล้ามเนื้อบนร่างกายของโจชัวสั่นกระตุก!","นี่คือวิธีการลงทัณฑ์รูปแบบใหม่ที่วิกโตริโอคิดค้นขึ้น นอกเหนือจากความเจ็บปวดอย่างรุนแรงแล้ว มันยังทำให้สภาพจิตใจของเป้าหมายตกอยู่ในความตึงเครียดอย่างหนักตลอดเวลาอีกด้วย","สำหรับคนปกตินั้น อย่าว่าแต่ให้ทนรับการลงทัณฑ์นี้ถึงสามวันเลย แค่สามชั่วโมง ก็เกรงว่าจะไม่มีใครทนไหวแล้ว!","แต่ท่านประธานผู้พิพากษาผู้นี้กลับแตกต่างออกไป เขาหลับตาสนิท ทำตัวราวกับเป็นท่อนไม้ ต่อให้สายฟ้าจะฟาดลงมารุนแรงแค่ไหน ก็ยังไม่สามารถทำให้เขาขมวดคิ้วได้เลยแม้แต่น้อย เขาอยู่นิ่งๆ ไม่ไหวติงราวกับคนตาย","“นับดูแล้ว นี่น่าจะเป็นการพบกันครั้งที่สองของพวกเราสินะ? ท่านประธานผู้พิพากษา?”","ลินน์เอ่ยทักทายออกไปอย่างไม่ใส่ใจนัก","หมอนี่ไม่มีทางตอบเจ้าหรอก...วิกโตริโอกำลังจะเอ่ยปากพูดประโยคนี้ออกไป แต่แล้วเขาก็มองเห็นโจชัวค่อยๆ ลืมตาขึ้น ดวงตาที่เฉียบคมราวกับเหยี่ยวของอีกฝ่าย จ้องเขม็งไปที่ลินน์ ก่อนจะเอ่ยกระซิบออกมาด้วยน้ำเสียงที่แหบแห้ง","“ดาวรุ่งแห่งเวทมนตร์ ผู้ลบหลู่เทพเจ้า...ลินน์...”","วิกโตริโอถึงกับสำลักคำพูดของตัวเอง และทำตัวไม่ถูกไปชั่วขณะ เขาอุตส่าห์ทรมานอีกฝ่ายมาตลอดสามวัน แต่โจชัวกลับแกล้งตาย และไม่ยอมพูดอะไรออกมาเลยสักคำ","ถ้าพูดกันตามตรงแล้ว ประธานสภาระดับตำนานอย่างเขา กลับดูไม่มีค่าอะไรเลยในสายตาของอีกฝ่าย เมื่อเทียบกับจอมเวทผู้ยิ่งใหญ่อย่างลินน์","แต่เมื่อนึกถึงมหาเวทระเบิดนิวเคลียร์อันน่าสะพรึงกลัวนั่น วิกโตริโอก็ทำได้เพียงยิ้มเจื่อนๆ ออกมา ดูเหมือนว่าเขาจะสู้ไม่ได้จริงๆ นั่นแหละ...","“ถูกต้อง เป็นข้าเอง!”","ลินน์พยักหน้ายอมรับ จากนั้นก็เอ่ยถามต่อไปว่า","“ท่านไม่อยากรู้จริงๆ งั้นรึ ว่าเหตุใดจู่ๆ ตัวเองถึงได้สูญเสียความคุ้มครองจากพระผู้เป็นเจ้าไป? และท่านพ่ายแพ้ในสงครามครั้งนี้ได้อย่างไร?”","โจชัวเงียบไป และราวกับจะกลับไปเป็นศพเดินได้อีกครั้ง","ลินน์ก็ไม่ได้ใส่ใจอะไร เขาเพียงแค่เล่าเรื่องที่ตัวเองใช้แผนลอบเข้าตีเมือง เพื่อปั่นหัวกองทัพปราบปรามแห่งศาสนจักรให้อีกฝ่ายฟังอย่างต่อเนื่อง","แต่โจชัวก็ยังคงนิ่งเงียบไม่ยอมพูดอะไร ราวกับคนที่ถูกปั่นหัวในเรื่องเล่าของลินน์นั้นไม่ใช่ตัวเอง","“น่าเสียดายที่ท่านไม่ได้เห็นภาพนั้น สตรีศักดิ์สิทธิ์ของพวกท่าน หรือก็คือร่างจุติของพระเจ้าจอมปลอมนั่น ถูกพวกเราล้อมโจมตี จนต้องฝืนใจเปิดประตูสวรรค์ออกมา แต่เรื่องนั้นก็เข้าทางข้าพอดี ต่อให้เป็นเทพเจ้า แต่เมื่อต้องเผชิญหน้ากับเวทมนตร์บทใหม่ที่ข้าคิดค้นขึ้นมาอย่างมหาเวทระเบิดนิวเคลียร์ มันก็ยังคงอ่อนแอจนทนรับการโจมตีไม่ได้แม้แต่ครั้งเดียวอยู่ดี”","ลินน์แสดงสีหน้าที่เต็มไปด้วยความเสียดาย เขายังคงจ้องมองไปที่โจชัวอย่างไม่วางตา และเอ่ยออกมาด้วยน้ำเสียงที่เด็ดขาด","“นั่นก็หมายความว่า พระผู้เป็นเจ้าของเจ้าได้ตายไปแล้ว พระองค์ตายอยู่ภายใต้เวทมนตร์ของข้า!”"]},{"n":447,"t":"ความยิ่งใหญ่ของพระผู้เป็นเจ้า ไม่ใช่สิ่งที่พวกเจ้าจะสามารถเข้าใจได้!","c":["เสียงของลินน์ดังก้องกังวานไปทั่วทั้งห้องลับ","สีหน้าของโจชัวค่อยๆ เปลี่ยนจากความนิ่งเฉย เป็นความโกรธเกรี้ยว","ในฐานะที่เป็นผู้ศรัทธาที่เคร่งศาสนาที่สุดของเทพีแห่งดวงจันทร์ เขาย่อมไม่อนุญาตให้ใครมาลบหลู่ตัวตนของพระผู้เป็นเจ้าอย่างแน่นอน!","แต่เมื่อได้ยินลินน์บอกว่า สตรีศักดิ์สิทธิ์ลูเซียได้ใช้ประตูสวรรค์ เพื่ออัญเชิญพระผู้เป็นเจ้าผู้ยิ่งใหญ่ลงมาจากสรวงสวรรค์ แต่พระองค์กลับต้องตายภายใต้น้ำมือของเวทมนตร์บทใหม่ของเขา สีหน้าของโจชัวกลับสงบลง และมีแววตาเย้ยหยันปรากฏขึ้นมาบนใบหน้าแทน","ลินน์คอยจับตาดูลักษณะท่าทางของโจชัวอยู่ตลอดเวลา","เพราะต่อให้อีกฝ่ายจะไม่ให้ความร่วมมือ เขาก็ยังสามารถมองเห็นเบาะแสบางอย่าง จากปฏิกิริยาตอบสนองในเสี้ยววินาทีของอีกฝ่ายได้","ตัวอย่างเช่น ตอนที่เขาเล่ารายละเอียดเกี่ยวกับสงคราม ซึ่งมีทั้งเรื่องจริงและเรื่องแต่งปะปนกันไป แถมยังมีจุดบกพร่องอย่างเห็นได้ชัด แต่โจชัวกลับไม่รู้สึกตัวเลย แต่เมื่อเขาพูดถึงความตายของเอลา สีหน้าของท่านประธานผู้พิพากษาผู้นี้ กลับสงบนิ่งอย่างน่าประหลาดใจ และไม่แสดงความหวาดกลัว หรือความกังวลออกมาเลยแม้แต่น้อย","เป็นเพราะคำพูดของเขามีช่องโหว่ที่ชัดเจนเกินไป อย่างเช่นการที่ลูเซียไม่จำเป็นต้องใช้ประตูสวรรค์ ก็สามารถอัญเชิญร่างจุติลงมาได้งั้นรึ?","หรือว่าเป็นเพราะโจชัวมีความมั่นใจในพลังของพระเจ้าจอมปลอมนั่นอย่างเต็มเปี่ยมกันแน่?","ไม่สิ ไม่น่าจะเป็นไปได้ทั้งสองอย่างนั่นแหละ","ลินน์รีบปฏิเสธความคิดนี้ในทันที","แม้ว่าในตอนที่ถูกจับตัว โจชัวจะอยู่ในเมืองน้ำมันดิน และไม่ได้เห็นด้วยตาตัวเองว่ามหาเวทระเบิดนิวเคลียร์ที่เขาร่ายออกมานั้น แข็งแกร่งมากเพียงใด แต่เขาก็ต้องสัมผัสได้ถึงแรงสั่นสะเทือนอันรุนแรงบนพื้นดิน และเห็นเมฆรูปเห็ดขนาดยักษ์ที่ลอยขึ้นสู่ท้องฟ้าอย่างแน่นอน...","ต่อให้จะโง่เขลาแค่ไหน อีกฝ่ายก็ต้องตระหนักได้ว่ากองทัพปราบปรามแห่งศาสนจักรพ่ายแพ้ไปแล้ว และพระผู้เป็นเจ้าของพวกเขาก็กำลังตกอยู่ในสถานการณ์ที่ย่ำแย่จนเอาตัวเองแทบไม่รอด","“ดูเหมือนว่าท่านจะสามารถยืนยันสถานะ หรือไม่ก็ความเป็นความตายของพระเจ้าจอมปลอมนั่นได้สินะ...”","ลินน์เผยรอยยิ้มออกมาบางๆ จากนั้นก็พูดต่อไปว่า","“ให้ข้าทายนะ นั่นคงเป็นเพราะ...”","“เพราะ...ท่านยังมีชีวิตอยู่งั้นสิ?”","ลินน์ก็คิดเรื่องนี้ขึ้นมาได้ในทันที","รูม่านตาของโจชัวหดเกร็ง ร่างกายของเขาสั่นสะท้านเล็กน้อย แม้ว่าเขาจะรีบดึงสติกลับมา และบังคับตัวเองให้ระงับการเปลี่ยนแปลงทางอารมณ์เอาไว้ แต่ความเปลี่ยนแปลงเพียงเล็กน้อยบนใบหน้านี้ ก็เพียงพอสำหรับลินน์แล้ว","ชัดเจนเลยว่า เขาเดาถูก!","ในตอนที่อารัดทำการทดลองกับบรรดาบิชอปและนักบวชที่ถูกจับมาตลอดทั้งคืน หลังจากที่สตรีศักดิ์สิทธิ์ลูเซียถูกเขาฆ่าตาย คนพวกนี้ก็ยังสามารถร่ายพลังศักดิ์สิทธิ์ออกมาได้ตามปกติ ในทางกลับกัน ท่านประธานผู้พิพากษาผู้นี้กลับได้รับผลกระทบอย่างหนัก จนถูกเวทมนตร์ธรรมดาๆ โค่นล้มลงได้","ลินน์จึงอดไม่ได้ที่จะตั้งข้อสันนิษฐานว่า ยิ่งเป็นนักบวชระดับสูงมากเท่าไหร่ ก็จะยิ่งมีความเชื่อมโยงกับเอลาอย่างใกล้ชิดมากเท่านั้น และเมื่อใดก็ตามที่พระเจ้าจอมปลอมนั่นร่วงหล่นลงมา บรรดาระดับสูงของศาสนจักร ก็มีแนวโน้มที่จะได้รับบาดเจ็บสาหัส หรือแม้กระทั่งตกตายตามไปด้วย!","สีหน้าของโจชัวกลับมาสงบนิ่งอีกครั้ง ดวงตาที่เฉียบคมราวกับเหยี่ยวของเขาจ้องมองไปที่คนทั้งสอง ก่อนจะเอ่ยออกมาด้วยน้ำเสียงที่แหบแห้ง และเย้ยหยัน","“การต่อต้านของพวกเจ้ามันเปล่าประโยชน์ พ่อมด! อีกไม่นาน อาณาจักรของพระผู้เป็นเจ้าก็จะทอดตัวลงมาจากสรวงสวรรค์ และปกคลุมไปทั่วทั้งผืนปฐพี!”","“และเมื่อถึงเวลานั้น แสงสว่างแห่งเทพเจ้าก็จะขับไล่ความชั่วร้ายทั้งหมดไปจนสิ้น!”","น้ำเสียงของโจชัวเต็มไปด้วยความศรัทธา และเด็ดเดี่ยว ราวกับกำลังประกาศคำสาบานอะไรบางอย่างอยู่","“โอ้ ความชั่วร้ายงั้นรึ?”","วิกโตริโอหัวเราะเยาะ ราวกับกำลังฟังเรื่องตลกที่ไร้สาระที่สุด","“พระผู้เป็นเจ้าที่เจ้าพูดถึง ในอดีตก็เคยเป็นหนึ่งในพ่อมด และยังเป็นผู้ใช้พลังจิตวิญญาณที่ชั่วร้ายที่สุด ซึ่งใช้ดวงวิญญาณเป็นสารอาหารในการเพิ่มพลังให้กับตัวเอง หรือก็คือเทพเจ้าชั่วร้ายที่พวกเจ้าเกลียดชังเข้าไส้นั่นแหละ”","“พูดง่ายๆ ก็คือ นางเป็นแค่เพชฌฆาต และคนดวงดีที่อาศัยพลังอำนาจ จนสามารถเอาชนะสงครามแห่งความศรัทธามาได้ แล้วก็ทำตัวหน้าด้านหน้าทน ลดทอนคุณค่าของ ‘เพื่อนร่วมเผ่าพันธุ์’ ในอดีตให้กลายเป็นความชั่วร้าย และสังหารพวกเขาทิ้งจนหมดสิ้นเท่านั้นแหละ...”","น้ำเสียงของวิกโตริโอดุดันขึ้นเรื่อยๆ เขาแฉความลับเบื้องหลังของเอลา ออกมาอย่างไม่หยุดหย่อน ด้วยความหวังว่าจะสามารถทำลายความศรัทธาในใจของประธานผู้พิพากษาผู้นี้ลงได้ในคราวเดียว","ไม่ว่าจะเป็นผู้ศรัทธาของเทพเจ้าองค์ใด เมื่อได้รู้ว่าเป้าหมายที่พวกเขาศรัทธานั้น แท้จริงแล้วคือพ่อมดที่ชั่วร้ายตามข่าวลือ หรือแม้กระทั่งเป็นเทพเจ้าชั่วร้ายเสียเอง พวกเขาก็จะต้องรู้สึกสะเทือนใจอย่างแน่นอน ไม่รีบเอ่ยปากโต้แย้ง ก็ต้องด่าทอว่าคำพูดเหล่านั้นเป็นการลบหลู่ความบริสุทธิ์ของเทพีแห่งดวงจันทร์...หรือไม่อย่างนั้น ความศรัทธาก็คงจะพังทลายลงไปโดยสมบูรณ์!","แต่สิ่งที่วิกโตริโอคาดหวังเอาไว้กลับไม่เกิดขึ้นเลย โจชัวเพียงแค่กล่าวออกมาด้วยน้ำเสียงที่เย็นชาว่า","“ความยิ่งใหญ่ของพระผู้เป็นเจ้า ไม่ใช่สิ่งที่พวกเจ้าจะสามารถเข้าใจได้!”","“ยิ่งใหญ่งั้นรึ? หรือว่านางจะสร้างโลกใบนี้ขึ้นมาได้เหมือนอย่างที่เขียนเอาไว้ในพระคัมภีร์จริงๆ ล่ะ?”","ลินน์กล่าวเยาะเย้ย","อย่ามาล้อเล่นน่า ก็แค่เอลา พระเจ้าจอมปลอมที่ติดแหงกอยู่บนดาวเคราะห์ดวงเล็กๆ เนี่ยนะ?","ขนาดแค่ระบบสุริยะที่ตัวเองอาศัยอยู่ นางยังออกไปไม่ได้เลย นับประสาอะไรกับการสร้างโลก นางมีคุณสมบัติอะไรมาเรียกตัวเองว่าผู้ยิ่งใหญ่กัน?","แต่ท่าทางที่นิ่งเฉยของโจชัว ก็ทำให้ลินน์รู้สึกประหลาดใจเช่นเดียวกัน","ดูเหมือนว่าระดับสูงของศาสนจักร จะแตกต่างจากบรรดาบิชอป และนักบวชทั่วไป พวกเขาไม่ได้ไร้ความรู้ความเข้าใจเกี่ยวกับเทพเจ้าที่พวกเขาศรัทธาไปเสียทั้งหมด","หรือจะพูดอีกอย่างก็คือ การจะเป็นระดับสูงของศาสนจักร และกลายเป็นนักบวชระดับตำนานได้นั้น เงื่อนไขข้อหนึ่งก็คือการยังคงรักษาความศรัทธาอันแรงกล้าเอาไว้ได้ แม้ว่าจะล่วงรู้ความจริงทั้งหมดแล้วก็ตาม...","ลินน์อดไม่ได้ที่จะเดาะลิ้น นี่มันต้องเป็นคนที่ศรัทธาอย่างบ้าคลั่งขนาดไหน ถึงจะสามารถรักษาความศรัทธาของตัวเองเอาไว้ได้โดยไม่สั่นคลอน แม้จะรู้ว่าพระผู้เป็นเจ้าที่ตัวเองศรัทธา ไม่ได้มีความแตกต่างอะไรไปจากพ่อมดที่ถูกตราหน้าว่าเป็นสัญลักษณ์แห่งความชั่วร้ายเลยแม้แต่น้อย...","ความสามารถในการล้างสมองของเอลา ช่างน่าสะพรึงกลัวเกินไปแล้ว!","เมื่อต้องเผชิญหน้ากับคำพูดเยาะเย้ยของลินน์และคนอื่นๆ โจชัวก็ไม่ยอมฟัง ไม่ยอมมอง ไม่ยอมปริปากพูดอะไรออกมาอีก...เขากลับคืนสู่สภาพเดิมก่อนที่พวกเขาจะเข้ามา ราวกับคนตายไปแล้วจริงๆ","แม้ว่าวิกโตริโอจะตั้งใจพูดจาดูหมิ่นเอลา แต่มันก็ไม่ทำให้โจชัวมีปฏิกิริยาตอบสนองใดๆ อีก เขาจึงทำได้เพียงหันไปมองลินน์","เห็นไหมล่ะ เจ้านี่มันรับมือยากขนาดไหน...","ลินน์ส่ายหน้าอย่างจนใจ เดิมทีเขาตั้งใจจะขุดคุ้ยความลับอันดำมืดของพระเจ้าจอมปลอมนั่น เพื่อใช้มันทำลายความเชื่อของอีกฝ่าย เพราะเมื่อใดก็ตามที่การป้องกันทางจิตใจพังทลายลง เขาก็จะสามารถค้นหาความทรงจำของอีกฝ่ายได้อย่างเป็นธรรมชาติ","เขาถึงกับเตรียมคำพูดเอาไว้เกลี้ยกล่อมอีกฝ่ายเรียบร้อยแล้ว แต่น่าเสียดายที่ท่าทีของโจชัวอยู่นอกเหนือความคาดหมายของเขา อีกฝ่ายสามารถยอมรับความจริงที่ว่า เอลาเคยเป็นพ่อมดมาก่อนได้อย่างหน้าตาเฉย","ซึ่งนั่นหมายความว่าแผนการก่อนหน้านี้ได้ล้มเหลวลงแล้ว","‘คลื่นสั่นสะเทือนมิติ’","จู่ๆ ลินน์ก็ยกมือขึ้น คลื่นที่ไร้รูปร่างและไร้ร่องรอยได้พุ่งแหวกอากาศออกไป และตัดผ่านแขนขวาของโจชัวในทันที ท่อนแขนตั้งแต่ช่วงศอกขาดกระเด็น เลือดสีแดงสดพุ่งกระฉูดออกมา แต่ก่อนที่ท่อนแขนนั้นจะร่วงหล่นลงสู่พื้น มันก็ลอยขึ้นมา และตกลงไปอยู่ในมือของลินน์","“มีเลือดไหลออกมาเหมือนกัน ช่างน่าอัศจรรย์จริงๆ”","ลินน์เดาะลิ้นด้วยความชื่นชม และเริ่มสงสัยว่า อีกฝ่ายสามารถเปลี่ยนพลังงานให้กลายเป็นสสารได้อย่างสมบูรณ์แบบแล้วจริงๆ หรือไม่","จากนั้นเปลวไฟก็ลุกโชนขึ้นกลางอากาศ ใช้ความร้อนสูงเพื่อห้ามเลือดให้กับประธานผู้พิพากษาผู้นี้ เพื่อป้องกันไม่ให้อีกฝ่ายเลือดไหลจนตายไปจริงๆ เสียก่อน","ส่วนท่อนแขนนี้ แน่นอนว่าเขาจะเอามันไปใช้ในการวิจัย...","ในเมื่อโจชัวไม่ยอมให้ความร่วมมือ ลินน์ก็ไม่คิดจะเสียเวลาเปล่าประโยชน์อีกต่อไป ในมือของเขาก็มีตัวอย่าง และทฤษฎีเกี่ยวกับการเปลี่ยนมวลให้เป็นพลังงานอยู่แล้ว เขาเชื่อว่าอีกไม่นาน เขาจะสามารถกู้คืนเส้นทางสู่การเลื่อนระดับเป็นตำนานกลับมาได้อย่างแน่นอน"]},{"n":448,"t":"อัศวินทัณฑ์ศักดิ์สิทธิ์ไอวีน่า!","c":["ทางตอนเหนือของจักรวรรดิ ภายในหมู่บ้านที่ห่างไกลความเจริญแห่งหนึ่ง บรรดาชาวบ้านต่างก็กำลังขยับร่างกายที่บิดเบี้ยวของตนเองอย่างชาชิน และเริ่มทำงานในแต่ละวันตามปกติ","ทั้งการทำไร่ไถนาอย่างขยันขันแข็ง ให้อาหารสัตว์ แบกหามสินค้า...","ภายในหมู่บ้านแห่งนี้เต็มไปด้วยภาพบรรยากาศที่แสนจะวุ่นวาย เพียงแต่การเคลื่อนไหวของทุกคนกลับดูแข็งทื่อไปเสียหน่อย","ชายวัยกลางคนในคราบของช่างตีเหล็ก กำลังกวัดแกว่งค้อนเหล็กในมืออย่างเลื่อนลอย และทุบลงไปบนตัวดาบที่แดงฉานซ้ำแล้วซ้ำเล่า","จู่ๆ ร่างกายที่โน้มไปข้างหน้าของเขาก็กระตุกขึ้นมาอย่างกะทันหัน เป็นผลให้ศีรษะที่กลมโตของเขาขาดกระเด็น และร่วงหล่นลงไปบนตัวดาบที่ร้อนระอุ แต่ทว่าช่างตีเหล็กกลับไม่รู้สึกตัวเลยแม้แต่น้อย เขายังคงทุบตีต่อไปเรื่อยๆ จนหลอมรวมเลือดเนื้อ และมันสมองเข้ากับดาบเหล็กสีแดงฉาน","จนกระทั่งถึงช่วงเที่ยงวัน หมู่บ้านที่เงียบสงบแห่งนี้ ก็ได้ต้อนรับกลุ่มแขกที่ไม่ได้รับเชิญ","ไอวีน่านำกองกำลังอัศวินทัณฑ์ศักดิ์สิทธิ์กลุ่มหนึ่งก้าวเข้ามาในหมู่บ้าน ทว่าในวินาทีที่ก้าวเข้ามา เด็กสาวก็สัมผัสได้ถึงความผิดปกติบางอย่างแล้ว","หมู่บ้านแห่งนี้ดูรกร้างและทรุดโทรมเป็นอย่างมาก บ้านเรือนหลายหลังพังทลาย ถนนหนทางก็เต็มไปด้วยโคลนตม จากร่องรอยหลายๆ อย่าง ทำให้สามารถมองออกได้ว่า สถานที่แห่งนี้เพิ่งจะผ่านพ้นไฟสงครามมาได้ไม่นาน","แต่ชาวบ้านในหมู่บ้านแห่งนี้กลับไม่ได้ทำการซ่อมแซมสถานที่ที่ทรุดโทรมเหล่านี้เลย และเมื่อเห็นพวกเธอมาถึง พวกเขาก็ไม่ได้หลบเลี่ยงเหมือนกับชาวบ้านทั่วไป แต่ยังคงก้มหน้าก้มตาทำงานของตัวเองต่อไปเรื่อยๆ","จู่ๆ อัศวินทัณฑ์ศักดิ์สิทธิ์นายหนึ่งก็ยื่นมือออกไปคว้าตัวผู้ชายที่เดินผ่านไปมาเอาไว้ และเมื่อได้เห็นใบหน้าที่เลื่อนลอย ดวงตาที่เหม่อลอยไร้แววตา และร่องรอยการถูกแทงด้วยของมีคมที่หน้าอกของอีกฝ่ายอย่างชัดเจน เขาก็อดไม่ได้ที่จะรู้สึกหนาวเหน็บขึ้นมาในใจ","“พวกเขาตายมาแล้วอย่างน้อยห้าวัน!”","อัศวินทัณฑ์ศักดิ์สิทธิ์กล่าวด้วยสีหน้าที่เคร่งเครียด","“ครึ่งเดือนต่างหาก!”","ไอวีน่าเอ่ยแก้ไข เธออาศัยการตัดสินจากร่องรอยของสงคราม","ในระหว่างที่พูด ไอวีน่าก็หยิบอุปกรณ์ตรวจจับพลังเวทมนตร์ออกมาด้วยสีหน้าที่เคร่งเครียด เข็มทิศหมุนไปรอบหนึ่ง ก่อนจะชี้ไปยังคฤหาสน์หลังหนึ่งที่อยู่ภายในหมู่บ้าน","บรรดาอัศวินทั้งยี่สิบกว่านายที่ก้าวเข้ามาในหมู่บ้าน ต่างก็พากันชักดาบที่เหน็บอยู่ข้างเอวออกมาในทันที","“สุนัขรับใช้ของศาสนจักรอีกแล้วงั้นรึ? ช่างตามติดเป็นวิญญาณอาฆาตเสียจริง!”","คำด่าทอที่เย็นชาดังแว่วออกมาจากคฤหาสน์ น้ำเสียงนั้นเต็มไปด้วยความดูถูกเหยียดหยาม","วินาทีต่อมา ใบหน้าที่แก่ชราและเหี่ยวย่นก็ปรากฏขึ้นมาในสายตาของทุกคน ชายชราในชุดคลุมสีดำมีผมสีดอกเลา ผิวหนังเหี่ยวย่นราวกับเปลือกไม้ ดูราวกับเป็นโครงกระดูกเดินได้อย่างไรอย่างนั้น","“ผู้ขโมยศพ วอลลี่!”","ไอวีน่าครุ่นคิดอยู่ครู่หนึ่ง ก่อนจะจดจำอีกฝ่ายได้อย่างรวดเร็ว เพราะข้อมูลของอีกฝ่ายถูกบันทึกเอาไว้ในใบประกาศจับของบทคนบาปในพระคัมภีร์!","ค่าหัวหนึ่งหมื่นห้าพันเหรียญทองเซคัส!","“ข้าเกลียดฉายาผู้ขโมยศพนั่นจริงๆ!”","พ่อมดชุดดำขมวดคิ้วด้วยความไม่พอใจ","ศพพวกนี้ล้วนเป็นผลผลิตจากสงครามทั้งนั้น หากไม่มีเขา พวกมันก็จะถูกทิ้งเอาไว้กลางป่าเขา ถูกสัตว์ป่าแทะกิน และในท้ายที่สุดก็จะไม่เหลือแม้แต่ซากกระดูก ซึ่งนั่นมันช่างเปล่าประโยชน์เหลือเกิน!","แต่เมื่ออยู่ในมือของเขา มันกลับแตกต่างออกไป พวกมันสามารถสร้างคุณค่าที่ยิ่งใหญ่กว่าเดิมได้!","เมื่อคิดได้ดังนั้น พ่อมดที่ชื่อว่าวอลลี่ก็กางแขนทั้งสองข้างออก ใบหน้าของเขาเต็มไปด้วยความตื่นเต้น และบ้าคลั่ง","“ดูสิว่าศพคืนชีพรูปแบบใหม่ที่ข้าวิจัยขึ้นมามันยอดเยี่ยมแค่ไหน! ในช่วงครึ่งเดือนที่ผ่านมา พวกมันผลิตเสบียงอาหารออกมาได้มากเท่าไหร่ สร้างเครื่องไม้เครื่องมือขึ้นมาได้กี่ชิ้น พวกมันไม่ต้องกินข้าว ไม่ต้องพักผ่อน รู้จักแต่ทำตามคำสั่งเท่านั้น...”","“สมบูรณ์แบบ...นี่มันช่างเป็นการดำรงอยู่ที่สมบูรณ์แบบที่สุดเลย!”","ผู้ขโมยศพกล่าวด้วยน้ำเสียงที่ดังก้อง","“ให้คนตายรับหน้าที่ทำงาน แล้วให้คนเป็นรับหน้าที่เสวยสุข มีโลกใบไหนที่จะงดงามไปกว่านี้อีกรึ?”","เมื่อในที่สุดพ่อมดชุดดำก็หาคนรับฟังได้ เขาก็เริ่มพรั่งพรูเกี่ยวกับการวิจัยอันยิ่งใหญ่ของตัวเองออกมาไม่หยุดหย่อน เขาใช้เวลาหลายปี ทำการทดลองนับครั้งไม่ถ้วน กว่าจะสามารถปลุกความทรงจำในอดีตของศพเหล่านี้ขึ้นมาได้ และทำให้พวกมันเริ่มทำไร่ไถนาและตีเหล็กได้เอง...","หลังจากนี้เขาจะสอนสิ่งต่างๆ ให้กับศพคืนชีพเหล่านี้มากขึ้น เพื่อให้พวกมันทำงานได้มากยิ่งขึ้นไปอีก!","เมื่อมองไปที่ซากศพที่เน่าเปื่อย เป็นแผลพุพอง และส่งกลิ่นเหม็นเน่าที่อยู่ภายในหมู่บ้าน สีหน้าของไอวีน่าและคนอื่นๆ ก็ยิ่งโกรธเกรี้ยวมากขึ้น พวกเขากระชับดาบยาวในมือแน่น และเอ่ยขัดจังหวะผู้ขโมยศพ","“เลิกพูดจาเหลวไหล แล้วยอมรับการพิพากษาแต่โดยดีเถอะ ไอคนบาป!”","เมื่อได้ยินคำว่าคนบาป สีหน้าของผู้ขโมยศพ วอลลี่ ก็เปลี่ยนเป็นไร้อารมณ์ความรู้สึก","“ดูเหมือนว่าพวกเจ้าจะไม่มีใครเข้าใจเลยสินะ ว่าการวิจัยของข้ามันยิ่งใหญ่แค่ไหน!”","“ในเมื่อเป็นเช่นนั้น พวกเจ้าก็จงอยู่ที่นี่ และร่วมเป็นส่วนหนึ่งในโครงการใหม่ของข้าเสียเถอะ!”","ผู้ขโมยศพแค่นเสียงหัวเราะออกมาอย่างเย็นชา จากนั้นหมอกสีดำเป็นกลุ่มๆ ก็เริ่มพวยพุ่งออกมาจากร่างกายของเขา","“อาณาเขตคนตาย!”","หลังจากที่ศพคืนชีพที่มีใบหน้าเลื่อนลอย และมีท่าทางที่แข็งทื่อเหล่านั้น สัมผัสกับหมอกสีดำ ดวงตาของพวกมันก็เปลี่ยนเป็นสีแดงก่ำในทันที ร่างกายของพวกมันบิดเบี้ยวและขยายใหญ่ขึ้น จนกลายเป็นศพคืนชีพที่มีกล้ามเนื้อปูดโปนและน่าสยดสยอง","“อาณาเขตงั้นรึ? นี่มันจอมเวทผู้ยิ่งใหญ่นี่!”","บรรดาอัศวินทัณฑ์ศักดิ์สิทธิ์ที่อยู่ในเหตุการณ์ต่างก็พากันหน้าถอดสี และตะโกนออกมาด้วยความตื่นตระหนกตกใจ นี่มันไม่ตรงกับข้อมูลที่เขียนเอาไว้ว่าอีกฝ่ายเป็นแค่พ่อมดระดับสามวงแหวนเลยนี่นา!","แม้ว่าระดับสามวงแหวนและสี่วงแหวน จะดูเหมือนห่างกันเพียงแค่ระดับเดียว แต่ความสามารถในการต่อสู้กลับแตกต่างกันราวฟ้ากับเหว!","“สู้!”","แต่บนใบหน้าของไอวีน่ากลับไม่มีความหวาดกลัวเลยแม้แต่น้อย เธอเป็นฝ่ายพุ่งทะยานเข้าไปก่อนเป็นคนแรก และตวัดดาบในมือออกไปในแนวนอน เพียงพริบตาเดียว ศพคืนชีพที่กำลังพุ่งเข้ามาหาเธอก็ถูกฟันขาดเป็นสองท่อน","“เวทระเบิดศพ!”","พ่อมดชุดดำหัวเราะออกมาอย่างชั่วร้าย และชี้มือออกไป ร่างกายของศพคืนชีพที่ถูกฟันขาดก็ระเบิดออกในทันที ละอองเลือดเหล่านี้เต็มไปด้วยพิษศพและโรคระบาด ต่อให้เป็นอัศวินทัณฑ์ศักดิ์สิทธิ์ที่เคยดื่มยาพรศักดิ์สิทธิ์มาก่อน ก็ไม่อาจจะต้านทานมันเอาไว้ได้","แต่ไอวีน่าก็ได้อาศัยความเร็วที่เหนือชั้น หายตัวไปจากรัศมีของละอองเลือดนั้นเรียบร้อยแล้ว","...","หลังจากผ่านการต่อสู้อย่างดุเดือดมานานกว่าครึ่งชั่วโมง อัศวินทัณฑ์ศักดิ์สิทธิ์กว่าสามสิบนายก็ล้มตายไปกว่าครึ่ง ส่วนบนร่างกายของไอวีน่าเองก็มีบาดแผลที่ปกคลุมไปด้วยหมอกสีดำเพิ่มขึ้นมาหลายแห่งเช่นเดียวกัน","แต่ศีรษะของผู้ขโมยศพ วอลลี่ได้ถูกเสียบทะลุด้วยดาบเรียวยาวเป็นที่เรียบร้อยแล้ว","เมื่อผู้ร่ายเวทมนตร์ตกตายไป ศพคืนชีพทั่วทั้งหมู่บ้านก็สูญเสียสิ่งยึดเหนี่ยว และพากันล้มลงกับพื้น ไอวีน่าที่เหนื่อยล้าจนแทบจะขาดใจถอนหายใจออกมาอย่างโล่งอก","“ครั้งนี้ต้องขอบคุณเจ้าจริงๆ นะ ไอวีน่า!”","อัศวินทัณฑ์ศักดิ์สิทธิ์นายหนึ่งมีสีหน้าที่เต็มไปด้วยความหวาดกลัวหลังรอดชีวิตมาได้ หากไม่ใช่เพราะวิธีการต่อสู้แบบไม่คิดชีวิตของเด็กสาว ที่ทำให้ผู้ขโมยศพเกิดความสับสน และสร้างโอกาสให้พวกเขาเข้าไปรุมโจมตีในระยะประชิดได้แล้วล่ะก็ พวกเขาทุกคนคงจะได้ทิ้งชีวิตเอาไว้ที่นี่ และกลายเป็นศพคืนชีพไปแล้ว","“น่าเสียดายที่พวกเขาต้อง...”","ไอวีน่าปรายตามองไปยังศพของเพื่อนร่วมงานที่อยู่รอบๆ แล้วถอนหายใจออกมา","“ในการต่อสู้กับพ่อมดพวกนี้ ความสูญเสียย่อมเป็นสิ่งที่หลีกเลี่ยงไม่ได้!”","อัศวินทัณฑ์ศักดิ์สิทธิ์กล่าวด้วยความโกรธแค้น และไร้หนทาง","อันที่จริง การที่พวกเขาต้องสูญเสียอัศวินทัณฑ์ศักดิ์สิทธิ์ไปไม่ถึงยี่สิบนาย เพื่อแลกกับการสังหารจอมเวทผู้ยิ่งใหญ่ได้หนึ่งคนนั้น ถือว่าเป็นความโชคดีอย่างมากแล้ว","อย่างน้อยพวกเขาก็สามารถปกป้องชาวจักรวรรดิให้รอดพ้นจากการถูกอีกฝ่ายทำร้ายได้มากขึ้น!","ไอวีน่าพยักหน้ารับ เธอฝืนพยุงร่างกายของตนเอง นำเพื่อนร่วมงานที่เหลือรอดชีวิต มารวบรวมศพเหล่านี้เข้าด้วยกัน แล้วจุดไฟเผาให้สิ้นซาก เพื่อป้องกันการแพร่กระจายของโรคระบาดที่อาจจะเกิดขึ้น","ไม่นานนัก บทเพลงสรรเสริญอันไพเราะก็ดังขึ้นมาภายในหมู่บ้าน","“ขอให้วิญญาณของพวกท่านรอดพ้นจากการร่วงหล่นลงสู่ไฟนรกชำระ และขอให้พวกท่านได้ขึ้นสวรรค์ เพื่อเสวยสุขไปชั่วนิรันดร์...”","ไอวีน่าสวดภาวนาด้วยน้ำเสียงที่แผ่วเบา ขณะที่เธอมองดูเปลวไฟที่กำลังลุกโชน เธอก็อดไม่ได้ที่จะนึกถึงเรื่องราวในอดีต","เมื่อสองปีกว่าก่อน ที่เมืองท่า ก็เป็นกองเพลิงแบบนี้แหละ ที่ทำให้เธอตื่นรู้ และตัดขาดจากครอบครัว จนได้เห็นโลกที่กว้างใหญ่มากยิ่งขึ้น","เหมือนดั่งที่ใครบางคนเคยพูดเอาไว้ โลกใบนี้กว้างใหญ่ กว้างใหญ่เสียจนยากที่จะจินตนาการได้ และตำแหน่งบารอนเล็กๆ นั่น ก็ไม่ได้สลักสำคัญอะไรเลย","ตำแหน่งบรรดาศักดิ์ที่สูงส่งราวกับเป็นแผ่นฟ้าในอดีตนั้น เคยบดบังวิสัยทัศน์ทั้งหมดของเธอเอาไว้ แต่ในตอนนี้ ตัวเธอเพียงแค่เอ่ยปากออกมาประโยคเดียว ก็สามารถตัดสินความเป็นความตายของบารอนคนหนึ่งได้แล้ว...","วิสัยทัศน์ ความยึดติด และความเคียดแค้นในตอนนั้น เมื่อนำมาคิดดูในตอนนี้แล้ว มันกลับดูน่าขันเป็นอย่างมาก","แต่ว่า...ทำไมเจ้าถึงได้กลายเป็นพ่อมดไปได้ล่ะ?"]},{"n":449,"t":"ข้าไม่อาจจินตนาการได้เลยว่า อาณาจักรที่ตกอยู่ภายใต้การปกครองของพ่อมดจะน่าสะพรึงกลัวมากเพียงใด!","c":["ในช่วงเวลาที่ออกจากเมืองท่า ไอวีน่าต้องเผชิญกับความสับสนและไร้หนทาง ทั้งยังต้องเผชิญกับอันตรายมากมาย","โชคดีที่วิชาดาบของเธอไม่ได้อ่อนแอ และเพียงพอที่จะรับมือกับภัยคุกคามส่วนใหญ่ได้ เธอจึงสามารถเอาชีวิตรอดมาได้ และเดินทางไปยังเมืองศักดิ์สิทธิ์ จากนั้นก็พยายามอย่างหนักจนผ่านการคัดเลือกของกองทัพทัณฑ์ศักดิ์สิทธิ์ จนได้รับโอกาสในการผลัดเปลี่ยนกระดูก และดื่มยาพรศักดิ์สิทธิ์!","ในช่วงสองปีที่ผ่านมา เพื่อให้ได้มาซึ่งข่าวคราวเกี่ยวกับลอธ ไอวีน่าได้เข้าร่วมกับหน่วยล่าแม่มดที่อันตรายที่สุดในกองทัพทัณฑ์ศักดิ์สิทธิ์ และได้เป็นพยานถึงความชั่วร้าย ความบ้าคลั่ง และความวิกลจริตของพวกพ่อมดด้วยตาของเธอเอง!","พวกเขาครอบครองเวทมนตร์ที่แข็งแกร่งและแปลกประหลาด แอบซุ่มซ่อนอยู่ในเงามืดเพื่อทำการวิจัยที่ไม่เปิดเผยให้ใครรู้ พวกเขาคือผู้แพร่กระจายโรคระบาด และเป็นต้นกำเนิดของความเจ็บปวด...","สิ่งที่ได้พบเห็นทั้งหมดนี้ ทำให้ไอวีน่ามีความเข้าใจอย่างลึกซึ้งเกี่ยวกับคำอธิบายของพ่อมดในพระคัมภีร์มากยิ่งขึ้น และทำให้เธอเกิดความเชื่อมั่นครั้งใหม่ นั่นก็คือการกวาดล้างสุนัขรับใช้ของเทพเจ้าชั่วร้ายเหล่านี้ให้สิ้นซาก เพื่อช่วยเหลือผู้คนให้ได้มากยิ่งขึ้น!","ความคิดอันวุ่นวายแล่นผ่านเข้ามาในหัวของไอวีน่า แต่ไม่นานมันก็ถูกขัดจังหวะด้วยแรงสั่นสะเทือนที่ส่งมาจากพื้นดิน...","นี่คือความรู้สึกของการเคลื่อนทัพของกองทหารขนาดใหญ่ ไอวีน่ารีบตื่นตัวขึ้นมาในทันที ที่บริเวณชายแดนทางตอนเหนือของจักรวรรดิ มักจะถูกพวกคนเถื่อนบุกโจมตีอยู่บ่อยครั้ง และหมู่บ้านที่อยู่ตรงหน้าเธอก็มีความเป็นไปได้สูงมากที่จะถูกอีกฝ่ายสังหารหมู่","แต่เมื่อมองเห็นธงตราสัญลักษณ์ศักดิ์สิทธิ์ที่โบกสะบัดอยู่ไกลๆ ความกังวลในใจของไอวีน่าก็มลายหายไปในทันที","ผู้ที่กำลังควบม้าพุ่งทะยานเข้ามาอย่างรวดเร็ว ก็คือกองกำลังอัศวินทัณฑ์ศักดิ์สิทธิ์แห่งศาสนจักรนั่นเอง","ไอวีน่ารีบขึ้นม้าและพาลูกน้องเข้าไปต้อนรับในทันที พร้อมกับรายงานสิ่งที่เกิดขึ้นภายในหมู่บ้านแห่งนี้ให้ฟังอย่างละเอียด","“เจ้าทำได้ดีมาก ไอวีน่า การที่สามารถสังหารจอมเวทผู้ยิ่งใหญ่ได้ ดูเหมือนว่าพลังของเจ้าจะเพิ่มขึ้นมาไม่น้อยเลยนะ”","กุสตาฟ ผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์มองไปที่เด็กสาววัยสิบแปดสิบเก้าปีที่อยู่ตรงหน้า และเอ่ยชมออกมาอย่างไม่ตระหนี่","ไอวีน่าน่าจะเป็นคนที่สามารถผสานพลังของยาพรศักดิ์สิทธิ์ได้อย่างสมบูรณ์แบบที่สุดในรอบหลายร้อยปีที่ผ่านมานี้ และสมรรถภาพทางร่างกายของเธอก็แข็งแกร่งกว่าอัศวินทัณฑ์ศักดิ์สิทธิ์ทั่วไปมากนัก","หากจะบอกว่ามีข้อบกพร่องเพียงอย่างเดียว ก็คือพรสวรรค์ด้านพลังศักดิ์สิทธิ์ของเธอนั้นธรรมดามาก","กุสตาฟหยิบพระคัมภีร์ที่เหน็บอยู่ข้างเอวออกมา และทำการแก้ไขเนื้อหาในบทคนบาปที่เกี่ยวกับผู้ขโมยศพใหม่ โดยเพิ่มคำว่า ‘ถูกประหารชีวิตแล้ว’ ลงไปที่ท้ายประโยค และเพิ่มค่าหัวของอีกฝ่ายเป็นสี่หมื่นเหรียญทอง!","ใบหน้าของไอวีน่าปรากฏความดีใจขึ้นมาเล็กน้อย","แม้ตัวเธอเองไม่ได้สนใจเรื่องเงินทองมากนัก เพราะเงินเดือนที่ได้รับในแต่ละวันก็เพียงพอสำหรับค่าใช้จ่ายประจำวันของเธอแล้ว","เพียงแต่ค่าหัวที่เพิ่มขึ้น หมายความว่าครอบครัวของอัศวินทัณฑ์ศักดิ์สิทธิ์ที่ตายไป จะได้รับเงินชดเชยมากยิ่งขึ้น","“ได้เวลาที่เราจะต้องกลับกันแล้ว กลับไปที่เมืองศักดิ์สิทธิ์!”","กุสตาฟเก็บพระคัมภีร์เข้าไว้ในอกเสื้อ และทอดสายตามองไปในทิศทางของเมืองศักดิ์สิทธิ์","“แต่ว่า ท่านผู้บัญชาการ ตามการสืบสวนของเรา การเคลื่อนไหวอย่างบ่อยครั้งของพวกพ่อมดทางตอนเหนือของจักรวรรดิ มีความเป็นไปได้สูงมากที่จะเกี่ยวข้องกับเทพเจ้าชั่วร้ายองค์หนึ่ง...”","ไอวีน่าเอ่ยออกมาด้วยความลังเล","ในช่วงเวลาที่เข้าร่วมกับหน่วยล่าแม่มด ไอวีน่าได้เข้าร่วมสงครามปราบปรามเทพเจ้าชั่วร้ายมาแล้วหลายครั้ง เธอจึงรู้ดีว่าสิ่งนี้สามารถสร้างความเสียหายได้มากเพียงใด หากไม่รีบกำจัดมันให้สิ้นซาก ก็อาจจะนำไปสู่การบาดเจ็บล้มตายของผู้คนนับหมื่นหรือหลายแสนคนได้!","“ข้าเข้าใจความกังวลของเจ้าเป็นอย่างดี ไอวีน่า แต่ตอนนี้พวกเรามีเรื่องที่สำคัญกว่าที่จะต้องทำ!”","สีหน้าของกุสตาฟเคร่งเครียดเป็นอย่างมาก","“เมื่อไม่นานมานี้ ข้าได้รับข่าวมาว่า เกิดโศกนาฏกรรมครั้งใหญ่ขึ้นภายในจักรวรรดิ...”","“กลุ่มพ่อมดที่เดิมทีหลบซ่อนตัวอยู่ในต่างแดน ได้บุกโจมตีอาณาจักรฮัดลาตา ที่ตั้งอยู่ทางฝั่งตะวันตกของจักรวรรดิ โดยใช้การแย่งชิงตำแหน่งมกุฎราชกุมารเป็นข้ออ้าง และยุยงให้องค์ชายรองฮัตตาร์กระทำการปลงพระชนม์บิดาของตนเอง ก่อนจะผลักดันให้อีกฝ่ายขึ้นครองบัลลังก์ในฐานะกษัตริย์หุ่นเชิด”","“ดังนั้นในตอนนี้ ทั้งอาณาจักรจึงได้ล่มสลายลงไปแล้ว ที่นั่นคงจะกลายเป็นสวนสนุกของพวกพ่อมดและปีศาจร้ายไปแล้ว...”","กุสตาฟถอนหายใจและกล่าวออกมา","ใบหน้าของไอวีน่าเต็มไปด้วยความตกตะลึง และอดไม่ได้ที่จะรู้สึกหนาวเหน็บขึ้นมาในใจ","เธอไม่อาจจินตนาการได้เลยว่า อาณาจักรที่ตกอยู่ภายใต้การปกครองของพ่อมดจะน่าสะพรึงกลัวมากเพียงใด และจะต้องเกิดโศกนาฏกรรมที่นองเลือดขึ้นอีกกี่ครั้งกัน!","ไอวีน่าเคยมีส่วนร่วมในการแก้ไขวิกฤตการณ์เทพเจ้าชั่วร้ายครั้งหนึ่ง บรรดาผู้ศรัทธาที่บ้าคลั่งของเทพเจ้าชั่วร้ายได้เข้าควบคุมเมืองที่แข็งแกร่งทางตอนเหนือ และทำการบูชายัญเลือดครั้งใหญ่ที่นั่น ทำให้ชาวบ้านผู้ยากไร้นับหมื่นคนถูกสังหารหมู่ และกลายเป็นสารอาหารในการเพิ่มพลังให้กับเทพเจ้าชั่วร้าย","ภาพอันน่าสะพรึงกลัวนั้นยังคงวนเวียนอยู่ในหัวของไอวีน่ามาจนถึงตอนนี้","“ท่านผู้บัญชาการ การที่เรากลับไปในครั้งนี้ ก็เพื่อไปปราบปรามพ่อมดพวกนั้นงั้นรึ?”","อัศวินทัณฑ์ศักดิ์สิทธิ์นายหนึ่งรีบเอ่ยถามขึ้น","ไอวีน่ากระชับดาบเรียวยาวในมือแน่น ถ้าเป็นอย่างที่ว่ามา วิกฤตการณ์ที่จักรวรรดิกำลังเผชิญอยู่ในตอนนี้ ก็ดูจะร้ายแรงยิ่งกว่าทางตอนเหนือเสียอีก","กุสตาฟส่ายหน้า","“ไม่หรอก อันที่จริงศาสนจักรได้ส่งกองทัพปราบปรามออกไปแล้วถึงสองครั้ง แต่ผลลัพธ์ก็คือ...”","“ผลลัพธ์ก็คือ สตรีศักดิ์สิทธิ์ลูเซียผู้ทรงเกียรติได้เสียชีวิตลงในสนามรบ ท่านประธานผู้พิพากษาถูกจับตัว และกองทัพปราบปรามทั้งหมดก็ถูกทำลายล้างจนสิ้นซาก!”","น้ำเสียงของกุสตาฟนั้นแผ่วเบา แต่กลับดังก้องราวกับสายฟ้าฟาดอยู่ข้างหูของทุกคน","บรรดาอัศวินทัณฑ์ศักดิ์สิทธิ์ที่อยู่ในเหตุการณ์ต่างก็เบิกตากว้าง แทบไม่อยากจะเชื่อในสิ่งที่ตัวเองได้ยิน!","ไอวีน่าก็ไม่มีข้อยกเว้น ในดวงตาของเธอมีแววตาแห่งความเหลือเชื่อส่องประกายออกมา","ที่ผ่านมา ไม่ว่าจะต้องเผชิญหน้ากับศัตรูแบบไหน ตราบใดที่ศาสนจักรมีความตั้งใจที่จะกวาดล้างพวกมัน พวกเขาก็จะได้รับชัยชนะอย่างแน่นอน","แต่ในครั้งนี้ กองทัพปราบปรามกลับต้องพ่ายแพ้อย่างย่อยยับ...","เธอไม่รู้ว่าสตรีศักดิ์สิทธิ์ผู้ทรงเกียรติ และท่านประธานผู้พิพากษาผู้นั้น แข็งแกร่งมากเพียงใด แต่เธอเคยเห็นกับตาตัวเองว่าผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์อย่างกุสตาฟลงมือต่อสู้อย่างไร","เทพเจ้าชั่วร้ายที่น่าสะพรึงกลัว ซึ่งดูดซับเลือดเนื้อของผู้คนนับหมื่นคนเป็นสารอาหาร ยังถูกกุสตาฟที่มีพลังแห่งเทพเจ้าสังหารได้อย่างง่ายดาย!","“ตามที่เทวโองการได้กล่าวเอาไว้ วันสิ้นโลก...ได้มาถึงแล้ว!”","กุสตาฟกล่าวด้วยสีหน้าที่เคร่งเครียด","“วันสิ้นโลกรึ?!”","ไอวีน่าพึมพำออกมาเสียงเบา","“ใช่แล้ว!”","กุสตาฟพยักหน้า ก่อนจะอธิบายต่อไปว่า","“เหมือนดั่งที่กล่าวเอาไว้ในพระคัมภีร์ บาปและความปรารถนาอันไร้ที่สิ้นสุดในใจของผู้คน จะนำพามาซึ่งภัยพิบัติในท้ายที่สุด และการที่เวทมนตร์อันชั่วร้ายของพวกพ่อมดแข็งแกร่งมากขึ้นเรื่อยๆ ก็คือลางบอกเหตุของวันสิ้นโลก!”","วันสิ้นโลกงั้นรึ?","หลังจากที่ไอวีน่าและบรรดาอัศวินทัณฑ์ศักดิ์สิทธิ์ ผ่านพ้นความตกใจและความตื่นตระหนกในตอนแรกมาได้ พวกเขาก็ค่อยๆ สงบสติอารมณ์ลง และมีเพียงความมุ่งมั่นปรากฏขึ้นมาในดวงตา","พวกเขาเอาชีวิตเข้าแลกมาตั้งนานแล้ว ไม่ว่ายังไงก็ต้องจัดการกับพวกพ่อมดที่แพร่กระจายความโกลาหลเหล่านี้ และหยุดยั้งไม่ให้วันสิ้นโลกมาถึงให้จงได้!","“ท่านสมเด็จพระสันตะปาปามีภารกิจที่สำคัญมากต้องการจะมอบหมายให้เจ้า!”","กุสตาฟมองไปที่ไอวีน่า และจู่ๆ ก็เอ่ยขึ้น","“เชิญท่านผู้บัญชาการสั่งมาได้เลย!”","ไอวีน่าตอบกลับด้วยความเคารพ","“เจ้าคอยรั้งอยู่แต่ในแดนเหนือมาตลอด และเพิ่งจะเคยดื่มยาพรศักดิ์สิทธิ์เท่านั้น ยังไม่ผ่านพิธีรับศีลล้างบาปแห่งพลังศักดิ์สิทธิ์ พ่อมดพวกนั้นไม่น่าจะมีวิธีตรวจสอบตัวตนของเจ้าได้ ดังนั้นเจ้าจึงเป็นตัวเลือกที่เหมาะสมที่สุด”","กุสตาฟค่อยๆ เอ่ยปากออกมา","“อีกไม่นาน พวกเราจะสร้างโอกาสให้เจ้า เพื่อให้เจ้าเข้าไปในอาณาจักรฮัดลาตา ในฐานะพ่อมด...”","“อาณาจักรที่ถูกปกครองโดยพวกพ่อมด!”"]},{"n":450,"t":"การค้นพบที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์เวทมนตร์  สมการแปรสภาพพลังเวท!","c":["“ท่านกุสตาฟ ท่านเปลี่ยนให้ข้าเป็นคนไปแทนดีกว่า!”","อัศวินทัณฑ์ศักดิ์สิทธิ์นายหนึ่งเสนอขึ้นมา เขาทำใจไม่ได้ที่จะให้เด็กสาวที่อายุน้อยอย่างไอวีน่าไปทำภารกิจที่อันตรายเช่นนี้","เขาไม่รู้ว่าพวกพ่อมดสร้างความปั่นป่วนให้กับอาณาจักรแห่งนั้นจนกลายเป็นสภาพแบบไหนไปแล้ว แต่แค่ลองคิดดู เขาก็รู้ได้ในทันทีว่าคำว่า ‘อันตราย’ คงไม่เพียงพอที่จะนำมาอธิบายสถานการณ์ในตอนนี้ได้!","ในหมู่ของอัศวินทัณฑ์ศักดิ์สิทธิ์ระดับล่าง มีหลายคนที่ขาดพรสวรรค์ด้านพลังศักดิ์สิทธิ์ จึงไม่มีความจำเป็นที่จะต้องเพาะเลี้ยง และไม่สามารถเข้ารับพิธีรับศีลล้างบาปแห่งพลังศักดิ์สิทธิ์ได้ ซึ่งเขาก็คือหนึ่งในคนเหล่านั้น!","“นี่ไม่ใช่การบังคับ เจ้าสามารถปฏิเสธได้ และจะไม่มีการลงโทษใดๆ ทั้งสิ้น ข้าจะไปขอคำชี้แนะจากสมเด็จพระสันตะปาปาให้ส่งคนอื่นไปแทน”","กุสตาฟไม่ได้มีเจตนาที่จะทำให้ไอวีน่าต้องลำบากใจ","หมากที่แฝงตัวเข้าไปในดินแดนของศัตรู หากไม่ได้ทำด้วยความสมัครใจ ก็มีแต่จะทำให้เสียเรื่องเท่านั้น!","“ไม่ ไม่จำเป็นต้องรบกวนคนอื่นหรอก ให้ข้าไปเถอะ!”","ไอวีน่ากล่าวด้วยสีหน้าที่มุ่งมั่น","หากไม่สามารถหยุดยั้งไม่ให้วันสิ้นโลกมาถึงได้ ทุกคนก็ต้องร่วงหล่นลงสู่นรก ในยามที่ต้องเผชิญกับวิกฤตการณ์เช่นนี้ ไม่มีใครสามารถหนีพ้นไปได้หรอก!","กุสตาฟรู้สึกพึงพอใจกับความตระหนักรู้ของเด็กสาวเป็นอย่างมาก เขาเอ่ยปลอบประโลมออกมาว่า","“เจ้าก็ไม่ต้องกังวลไปมากนัก ข้าคิดว่าพวกพ่อมดคงจะไม่ทำร้ายพ่อมดฝึกหัดหรอก”","เมื่อพูดถึงตรงนี้ กุสตาฟก็สั่งให้รองผู้บัญชาการที่อยู่ด้านข้าง นำเอกสารข้อมูลมามอบให้กับไอวีน่า","“นี่คือตัวตนที่เจ้าจะต้องใช้ในภารกิจนี้ และเป็นพ่อมดอีกไม่กี่คนที่เจ้าจะต้องคอยระวังตัวเอาไว้เป็นพิเศษ ในช่วงไม่กี่วันนี้ เจ้าควรจะเตรียมตัวให้พร้อมที่สุด...”","ไอวีน่าพยักหน้ารับอย่างหนักแน่น เธอรับข้อมูลเหล่านั้นมา และเปิดอ่านดู ภายในนั้นได้บันทึกเกี่ยวกับระบบการปกครองของพวกพ่อมด การแบ่งระดับ โครงสร้างบุคลากร และข้อมูลประจำตัวของประธานสภาทั้งหลาย","เด็กสาวจดจำข้อมูลเหล่านั้นไปทีละคน แต่เมื่อเธอพลิกไปที่หน้าสุดท้าย และได้เห็นข้อมูลที่อยู่บนนั้น เธอก็อดไม่ได้ที่จะนิ่งอึ้งไป","บนกระดาษแผ่นนั้นมีรูปวาดเหมือนที่วาดขึ้นโดยจิตรกรฝีมือดีที่สุดของจักรวรรดิ มันเป็นรูปของพ่อมดหนุ่มที่มีอายุประมาณยี่สิบปี มีผมสีน้ำตาล ดูอ่อนโยนเป็นอย่างมาก และไม่มีท่าทีที่บ้าคลั่ง หรืออันตรายเหมือนกับพวกพ่อมดคนอื่นๆ เลยแม้แต่น้อย แต่ค่าหัวของอีกฝ่ายกลับสูงลิ่วจนน่าตกใจ!","เงินรางวัลนำจับสูงถึงหนึ่งร้อยล้านเหรียญทองเซคัส!","ส่วนพวกพ่อมด ‘ระดับตำนาน’ ที่เป็นผู้ปกครองสภาเวทมนตร์พวกนั้น กลับมีค่าหัวเพียงแค่ระดับสิบล้านเท่านั้น","สิ่งที่ทำให้ไอวีน่าสนใจมากยิ่งกว่าก็คือประวัติของลินน์ ชายคนนี้เป็นผู้ที่ทำให้เกิดภัยพิบัติแห่งวันสิ้นโลก ทำลายล้างกองทัพปราบปรามแห่งศาสนจักร เป็นสาเหตุที่ทำให้อาณาจักรล่มสลาย และ...ทำลายเมืองท่าไปกว่าครึ่ง","“ผู้นำพาวันสิ้นโลก...ลินน์”","ไอวีน่าพึมพำออกมาเสียงเบา ประวัติของอีกฝ่าย ทำให้เธออดไม่ได้ที่จะนึกถึงลอธ พี่ชายของเธอขึ้นมา","แต่ไม่นาน ไอวีน่าก็แอบส่ายหน้า","จะเป็นไปได้ยังไง?","อย่างมากที่สุด ก็คงมีแค่อายุและสีผมที่คล้ายกันเล็กน้อยเท่านั้น","พ่อมดที่ชื่อว่าลินน์คนนี้ช่างแข็งแกร่งเหลือเกิน เขาสามารถสังหารสตรีศักดิ์สิทธิ์ของศาสนจักร และทำลายกองทัพปราบปรามแห่งศาสนจักรนับหมื่นคนลงได้เพียงแค่พลิกฝ่ามือ","เมื่อลองคิดดู บางทีพี่ชายของเธออาจจะเป็นแค่ลูกน้อง หรือพ่อมดฝึกหัดของอีกฝ่ายเท่านั้นแหละมั้ง","“เขาคือเป้าหมายที่สำคัญที่สุดในภารกิจของเจ้าในครั้งนี้ ลินน์ ผู้ซึ่งได้รับการยกย่องจากพวกพ่อมดให้เป็นดาวรุ่งแห่งเวทมนตร์!”","กุสตาฟกล่าวด้วยน้ำเสียงที่เคร่งขรึม","“ถ้าพวกเราเข้าใจไม่ผิด เขาคนนี้น่าจะเป็นต้นเหตุที่ทำลายเมืองท่า บ้านเกิดของเจ้าด้วยเช่นกัน!”","ตอนที่ไอวีน่าเพิ่งจะเข้ามาร่วมในกองทัพทัณฑ์ศักดิ์สิทธิ์ เขาก็ได้ทำการสืบสวนประวัติของอีกฝ่ายมาหมดแล้ว แน่นอนว่าเขาย่อมรู้ดีว่าลอธ พี่ชายของไอวีน่าได้เสียชีวิตลงในเหตุการณ์ความวุ่นวายครั้งนั้น และมีข่าวลือว่า บารอนเปโดรได้รับความกระทบกระเทือนทางจิตใจอย่างหนักจากเรื่องนี้","เรียกได้ว่าครอบครัวชนชั้นสูงที่เคยมีความสุข ต้องมาพังทลายลงก็เพราะเหตุการณ์ในครั้งนั้น...","“ข้าจะพยายามทำภารกิจนี้ให้สำเร็จอย่างสุดความสามารถค่ะ ท่านกุสตาฟ!”","ไอวีน่าเก็บเอกสารข้อมูลในมือลงไป ในดวงตาของเธอมีแววตาที่ซับซ้อนส่องประกายออกมา","“ดีมาก หากทำสำเร็จ เจ้าก็คือวีรสตรีที่ยิ่งใหญ่ที่สุดในการกอบกู้ชีวิตของประชาชนนับสิบล้านคนในจักรวรรดิ!”","ผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์กล่าวให้กำลังใจ","“น่าเสียดายจริงๆ ที่ท่านสมเด็จพระสันตะปาปาไม่เลือกเจ้าให้เป็นสตรีศักดิ์สิทธิ์คนใหม่!”","เมื่อพูดมาถึงตรงนี้ กุสตาฟก็ส่ายหน้าด้วยความเสียดาย","“พวกเขาประเมินศักยภาพของร่างกายเจ้าน้อยเกินไป...”","เขาไม่เคยเห็นใครที่มีพรสวรรค์ในการต่อสู้ที่โดดเด่นเท่านี้มาก่อนเลย","พวกพ่อมดอาจจะครอบครองเวทมนตร์ที่แข็งแกร่งและชั่วร้าย แต่ความเชี่ยวชาญในการต่อสู้ระยะประชิดของพวกเขากลับมีอยู่อย่างจำกัด หากเผลอเรอจนถูกดึงเข้าไปในการต่อสู้ระยะประชิด ต่อให้เป็นจอมเวทผู้ยิ่งใหญ่ก็อาจจะถูกตัดหัวเอาได้ง่ายๆ","แม้ข้อมูลที่รวบรวมมาได้ ว่าดาวรุ่งแห่งเวทมนตร์ผู้นั้นจะไม่ได้เป็นแค่จอมเวทผู้ยิ่งใหญ่ธรรมดาๆ ก็ตามที แต่ไอวีน่าก็ยังมีอาวุธที่ร้ายกาจอีกอย่างหนึ่ง นั่นก็คือความงาม!","หากนำมาใช้อย่างถูกวิธี มันจะอันตรายยิ่งกว่ายาพิษชนิดใดในโลกเสียอีก!","และเมื่อนำข้อดีเหล่านี้มารวมกัน นี่จึงเป็นเหตุผลว่าทำไมเขาถึงเสนอชื่อของไอวีน่าให้เป็นคนปฏิบัติภารกิจนี้ต่อท่านสมเด็จพระสันตะปาปา...","...","ณ ชายแดนของจักรวรรดิ ภายในเมืองน้ำมันดิน ลินน์ไม่รู้เลยว่าศาสนจักรได้แอบวางแผนที่จะรับมือกับเขาอย่างลับๆ เพราะตอนนี้ ชายหนุ่มนั้นกำลังทุ่มเทความสนใจทั้งหมดไปที่การวิจัยเรื่องพลังศักดิ์สิทธิ์และเวทมนตร์อย่างเต็มที่","“มหัศจรรย์ ช่างน่ามหัศจรรย์จริงๆ!”","ลินน์ใช้เวทมนตร์ขยายส่วนที่สามารถขยายภาพได้ถึงสองร้อยเท่า ทำการตรวจสอบแขนท่อนล่างของประธานผู้พิพากษาโจชัวอย่างละเอียด และเดาะลิ้นออกมาด้วยความชื่นชม","หลังจากทำการวิจัยมาได้ไม่กี่วัน เขาก็ได้ค้นพบสิ่งที่น่าสนใจมากมาย","อย่างที่เขาเคยคาดเดาเอาไว้ก่อนหน้านี้ ศาสนจักรจะต้องครอบครองวิธีการบางอย่าง ในการนำพลังพลังศักดิ์สิทธิ์มาใช้เป็นสื่อกลางในการแปรสภาพสสารอย่างแน่นอน ซึ่งคาดการณ์ได้เลยว่านี่คือวิธีที่สำคัญที่สุดในการเลื่อนระดับขึ้นเป็นตำนาน!","หากจะให้อธิบายเป็นคำพูดเพียงแค่ประโยคเดียวก็คือ เนื้อหนังนั้นอ่อนแอ แต่พลังงานนั้นสามารถโบยบินได้!","นอกจากนี้เขายังพบอีกว่า ในความเป็นจริงแล้ว พลังศักดิ์สิทธิ์และเวทมนตร์นั้นเป็นสิ่งเดียวกัน แต่สิ่งที่แตกต่างกันก็คือ พลังเวทของพวกพ่อมดแต่ละคนจะมีความแตกต่างกันเพียงเล็กน้อย","พ่อมดที่แข็งแกร่งมักจะสามารถระบุตัวตนของบุคคลได้ผ่านทางพลังเวท!","นี่คือเหตุผลที่ว่าทำไมในตอนนั้น เฮลรามถึงสามารถมองทะลุเวทมนตร์แปลงกายอันไร้ที่ติของเขาได้อย่างง่ายดาย","แต่พลังพลังศักดิ์สิทธิ์ที่นักบวช บิชอป และพระคาร์ดินัลทุกคนครอบครองอยู่นั้น กลับมีความคล้ายคลึงกันเป็นอย่างมาก จนไม่สามารถแยกแยะความแตกต่างได้เลย","ลินน์สงสัยว่า จุดเด่นของพลังพลังศักดิ์สิทธิ์ก็คือ การถูก ‘เอลล่า’ ประทับตราส่วนตัวเอาไว้ หรืออาจจะเป็นพลังเวทแบบพิเศษที่แฝงไปด้วยเจตจำนงของเธอ!","ในระหว่างที่ลินน์กำลังครุ่นคิดว่า เขาจะสามารถใช้เครือข่ายเวทมนตร์เพื่อทำเรื่องแบบเดียวกันนี้ได้หรือไม่ เขาก็จดจ่ออยู่กับการเขียนความคิดทั้งหมดในหัวลงบนม้วนกระดาษหนังแกะ","หัวข้อของมันก็คือ [รายงานการวิเคราะห์และวิจัยเกี่ยวกับพลังศักดิ์สิทธิ์!]","ลินน์ตั้งใจที่จะตีพิมพ์มันลงใน [วารสารเวทมนตร์รายสัปดาห์] ภายในสัปดาห์นี้ เพื่อช่วยทำลายความหวาดกลัวและความตื่นตระหนกที่พวกพ่อมดมีต่อพระผู้เป็นเจ้า","ส่วนข้างๆ กันนั้น ก็มี [ตารางธาตุ] ที่เพิ่งเขียนเสร็จไปเมื่อไม่นานมานี้ และปึกกระดาษร่างที่วางกองซ้อนกันอยู่เป็นจำนวนมาก!","บนกระดาษร่างนั้นเต็มไปด้วยสมการที่ยุ่งเหยิง รอยขีดข่วนที่เด่นชัด และเส้นทึบที่หยาบกระด้าง หากมีพ่อมดที่เชี่ยวชาญด้านคณิตศาสตร์อยู่ที่นี่ พวกเขาจะต้องมองออกอย่างแน่นอนว่า นี่คือสมการที่ยังไม่เสร็จสมบูรณ์","ลินน์เรียกมันว่า สมการแปรสภาพพลังเวท!","หากเขาสามารถทำให้มันสมบูรณ์แบบได้ นี่จะต้องเป็นการค้นพบที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์เวทมนตร์อย่างแน่นอน...","ที่สำคัญที่สุดก็คือ นี่คือทฤษฎีเวทมนตร์ที่เขาเป็นผู้คิดค้นขึ้นมาเองอย่างแท้จริง!","เป็นรากฐานของการเปิดเผยแก่นแท้ของเวทมนตร์ และเลื่อนระดับขึ้นเป็นตำนาน!"]},{"n":451,"t":"ร่างกายพลังงานและสมการมวล-พลังงาน","c":["นับตั้งแต่ทะลุมิติมายังโลกใบนี้ ลินน์ก็มักจะขบคิดอยู่เสมอว่า แท้จริงแล้วพลังเวทคืออะไรกันแน่?","หรืออาจจะพูดได้ว่า สิ่งนี้มีคุณสมบัติอะไรบ้าง...","การวิจัยของพวกพ่อมดตลอดหลายร้อยปีที่ผ่านมา ได้วางรากฐานบางอย่างให้กับเขา ซึ่งได้สรุปคุณสมบัติของพลังเวทออกมาได้หลายประการ ตัวอย่างเช่น สิ่งนี้สามารถถูกควบคุมได้โดยใช้พลังจิตวิญญาณ ได้รับอิทธิพลจากการจัดเรียงตัวของอักษรรูนแบบพิเศษ และที่สำคัญที่สุดก็คือ มันสามารถเปลี่ยนเป็นธาตุต่างๆ ได้!","ในระหว่างที่ลินน์กำลังจัดทำตารางธาตุ เขาก็ได้ผ่านการทดลองมาอย่างนับไม่ถ้วน และพบว่าเวลาที่พ่อมดร่ายเวทมนตร์เพื่อเปลี่ยนธาตุต่างๆ ปริมาณพลังเวทที่ถูกใช้ไป จะมีความสัมพันธ์เชิงบวกกับเลขอะตอม คาบ และหมู่ของธาตุนั้นๆ!","ในบรรดาสิ่งเหล่านี้ ปัจจัยที่มีผลกระทบมากที่สุดก็คือ เลขอะตอม หรือก็คือลำดับของธาตุในตารางธาตุ","ลำดับนี้จะถูกจัดเรียงตามจำนวนโปรตอน (ประจุบวก) ที่อยู่ภายในนิวเคลียสของอะตอม","ตัวอย่างเช่น ไฮโดรเจนมีเลขอะตอมเท่ากับหนึ่ง ซึ่งหมายความว่าจำนวนโปรตอนภายในนิวเคลียสของมันก็คือหนึ่ง ส่วนธาตุยูเรเนียมมีเลขอะตอมเท่ากับ 92 จำนวนโปรตอนภายในนิวเคลียสของมันก็คือเก้าสิบสอง!","ธาตุอื่นๆ ก็ใช้หลักการเดียวกันนี้","หากธาตุที่มีเลขอะตอมสูงกว่า สูญเสียมวลไปมากเกินไป ตำแหน่งของมันในตารางธาตุก็จะเปลี่ยนไป และกลายเป็นธาตุอีกชนิดหนึ่ง","ใช่แล้ว มันก็เหมือนกับตำนานการเล่นแร่แปรธาตุ ที่เปลี่ยนหินให้กลายเป็นทองคำ ซึ่งเป็นการเปลี่ยนแปลงคุณสมบัติของธาตุตั้งแต่ขั้นพื้นฐาน","การแตกตัวของนิวเคลียส และการสลายตัวของธาตุกัมมันตรังสีก็คือตัวอย่างที่ดีที่สุด!","ในทางกลับกัน นิวเคลียสของอะตอมเบาสองตัว ก็สามารถรวมตัวกันกลายเป็นนิวเคลียสของอะตอมที่หนักกว่าได้ ซึ่งนี่ก็คือสิ่งที่เรียกว่าปฏิกิริยานิวเคลียร์ฟิวชัน!","ในเมื่อมันมีกฎเกณฑ์ที่แน่นอน แน่นอนว่ามันย่อมมีความเป็นไปได้ที่จะสามารถคำนวณออกมาได้","ยกตัวอย่างเช่น ธาตุฮีเลียมที่มีเลขอะตอมเท่ากับสอง ซึ่งประกอบไปด้วยโปรตอนสองตัว และนิวตรอนสองตัว สมมติว่าพลังเวทที่ต้องใช้ในการเปลี่ยนมีค่าเท่ากับหก","ส่วนธาตุลิเทียมที่มีเลขอะตอมเท่ากับสาม โครงสร้างภายในของมันประกอบไปด้วยโปรตอนสามตัว และนิวตรอนสี่ตัว สมมติว่าพลังเวทที่ต้องใช้ในการเปลี่ยนมีค่าเท่ากับสิบเอ็ด","ถ้าเป็นอย่างนั้น ก็เพียงแค่ตั้งสมการง่ายๆ ขึ้นมา แล้วก็จะสามารถคำนวณออกมาได้ว่า พลังเวทที่ใช้ในการเปลี่ยนเป็นโปรตอนคือหนึ่ง และนิวตรอนคือสอง!","แน่นอนว่านี่คือแบบจำลองที่สมบูรณ์แบบและเรียบง่ายที่สุด แต่ในความเป็นจริง มันไม่ได้ง่ายดายขนาดนั้น เพราะการเปลี่ยนเป็นธาตุลิเทียมจะใช้พลังเวทมากกว่าฮีเลียมเพียงแค่ประมาณหกสิบเปอร์เซ็นต์เท่านั้น","เห็นได้ชัดว่า สิ่งที่ส่งผลกระทบต่อการใช้พลังเวทไม่ได้มีเพียงแค่มวลเท่านั้น","มีความเป็นไปได้ว่า ในตอนที่สร้างโครงสร้างของธาตุ จะต้องใช้พลังเวทส่วนหนึ่งไปกับการคำนวณจึงต้องลบค่าในส่วนนี้ออกไป และบางทีอาจจะต้องคำนึงถึงผลกระทบที่เกิดจากอิเล็กตรอนที่มีมวลเบาบาง ซึ่งโคจรรอบนิวเคลียสด้วย...","ลินน์จดบันทึกตัวแปรทั้งหมด ที่อาจจะส่งผลกระทบต่อการใช้พลังเวทลงไป ตราบใดที่เขาสามารถกำจัดผลกระทบของปัจจัยอื่นๆ ออกไปได้ เขาก็จะสามารถคำนวณค่าโดยประมาณของพลังเวทที่ใช้ในการแปรสภาพอนุภาคมูลฐานแต่ละตัวได้","โดยไม่ทันรู้ตัว กระดาษร่างทั้งแผ่นก็เต็มไปด้วยสูตรการคำนวณที่ซับซ้อนไปหมดแล้ว","แต่การคำนวณค่าเหล่านี้ออกมาได้ เป็นเพียงแค่จุดเริ่มต้นเท่านั้น","เขายังต้องแก้ไขปัญหาที่สองให้ได้ นั่นก็คือจะทำยังไงให้ธาตุที่เปลี่ยนออกมา กลายเป็นสสารที่มีอยู่จริง!","นี่คือความยากที่สุด...","ลินน์ขมวดคิ้วและครุ่นคิดอยู่ครู่หนึ่ง ก่อนจะคิดคำตอบขึ้นมาได้อย่างรวดเร็ว ซึ่งนั่นก็คือพลังงาน!","มีเพียงแค่พลังงานเท่านั้นที่จะสามารถทำแบบนี้ได้!","ลินน์รู้สึกเหมือนได้ตาสว่าง เขาจึงรีบเขียนสูตรสมการความเท่าเทียมกันของมวล-พลังงานลงบนกระดาษในทันที","m = E/c^2","ความหมายของมันก็คือ มวลเท่ากับพลังงานหารด้วยความเร็วแสงยกกำลังสอง!","ตามที่ลินน์คาดการณ์เอาไว้ ตราบใดที่เขาสามารถจัดหาพลังงานมาได้อย่างเพียงพอ จากนั้นก็ใช้ธาตุที่เปลี่ยนด้วยพลังเวทเป็นพื้นฐาน เขาก็จะสามารถบรรลุการแปรเปลี่ยนระหว่างพลังงานและมวลได้ และสามารถใช้สิ่งนี้เพื่อสร้างร่างกายพลังงานที่แข็งแกร่งพอจะรองรับจิตวิญญาณได้!","ระดับตำนาน...นี่ก็คือวิธีในการเลื่อนระดับขึ้นเป็นตำนาน!","เมื่อได้มองเห็นหนทางที่อยู่เบื้องหน้า ใบหน้าของลินน์ก็อดไม่ได้ที่จะปรากฏความตื่นเต้นขึ้นมา แต่หลังจากที่ลองใช้ปากกาคำนวณดูอย่างละเอียดแล้ว เขาก็พบกับปัญหาที่ใหญ่มากๆ ในทันที","นั่นก็คือ พลังงานที่จำเป็นต้องใช้ในการแปลงมวลนั้น มีจำนวนมหาศาลจนแทบไม่น่าเชื่อ!","ตามการคำนวณของสมการความเท่าเทียมกันของมวล-พลังงาน มวลหนึ่งกรัมจะเทียบเท่ากับพลังงานเก้าสิบล้านล้านจูล ซึ่งเทียบเท่ากับการระเบิดของทีเอ็นทีสองหมื่นตัน หรือการระเบิดของนิวเคลียร์ในมวลวิกฤตหนึ่งครั้ง!","ส่วนตัวเขามีน้ำหนักประมาณหกสิบกว่าโล หากเปลี่ยนร่างกายเป็นพลังงานทั้งหมด มันย่อมต้องเป็นตัวเลขทางดาราศาสตร์อย่างแน่นอน!","จะต้องมีอะไรบางอย่างที่เขามองข้ามไปแน่ๆ...","ลินน์ขมวดคิ้วและเริ่มครุ่นคิด เขาเหยียดมือออกไป ธาตุไฮโดรเจนที่พื้นฐานที่สุดก็ควบแน่นเป็นรูปเป็นร่างขึ้นมาในทันที ตามมาด้วยฮีเลียม ลิเทียม เบริลเลียม...","ไม่นานนัก ธาตุทั้งสี่สิบเก้าชนิดก็ลอยอยู่เหนือฝ่ามือของเขา และโคจรหมุนวนรอบกันและกันอย่างไม่หยุดหย่อน","ลินน์หยิบปากกาขึ้นมาจดลงบนกระดาษอีกครั้ง","ตัวพลังเวทเองก็เป็นพลังงานพิเศษรูปแบบหนึ่ง และการนำมันมาใช้เพื่อแปรสภาพเป็นธาตุต่างๆ ก็ควรจะถือว่าเป็นการใช้พลังงานก้อนใหญ่ ดังนั้น พลังงานที่จำเป็นต้องใช้ ก็ควรจะน้อยกว่าค่าที่คำนวณออกมาได้มาก","ส่วนสาเหตุที่ว่าทำไมพลังเวทถึงมีคุณสมบัติเช่นนี้นั้น ยังต้องทำการวิจัยเพิ่มเติมต่อไป","แต่ถึงแม้ว่าท้ายที่สุดแล้ว พลังงานที่ต้องใช้จะเหลือเพียงแค่หนึ่งในสิบของที่คาดการณ์เอาไว้ แต่มันก็ยังคงเป็นตัวเลขที่ไม่น้อยเลย","ลินน์ลูบคางของตนเอง","เขาพอจะนึกถึงอุปกรณ์ที่สามารถให้พลังงานมหาศาลขนาดนี้ได้หลายอย่าง และอุปกรณ์ที่มีประสิทธิภาพสูงที่สุดก็คือ อุปกรณ์ทำลายล้างปฏิสสาร!","เพียงแต่ในตอนนี้เขาไม่มีอุปกรณ์ที่จะสามารถสกัดปฏิสสารออกมาได้ ดังนั้น จึงทำได้เพียงแค่ถอยกลับมาตั้งหลัก และเลือกใช้เตาปฏิกรณ์นิวเคลียร์ฟิวชันแทน!","ลินน์คำนวณหากำลังไฟฟ้าที่ต้องใช้จากเตาปฏิกรณ์นิวเคลียร์ เพื่อนำมาใช้เป็นพลังงาน จากนั้นเขาก็นึกขึ้นมาได้ว่า ร่างกายของเขาเองก็มีมวลอยู่จำนวนมาก บางทีเขาอาจจะสามารถใช้เวทมนตร์บางอย่าง เพื่อดึงมันมาใช้งาน ซึ่งจะเป็นการลดการใช้พลังงานลงไปได้อีกก้าวหนึ่ง...","“แปลกจัง แล้วเทพเจ้าจอมปลอมนั่นไปเอาพลังงานมากมายขนาดนั้นมาจากไหนกัน?”","ลินน์รู้สึกสับสนเป็นอย่างมาก เพื่อที่จะสร้างร่างกายที่มีโครงสร้างเป็นพลังเวท และเต็มไปด้วยพลังงาน เขาต้องใช้สมองอย่างหนัก และถึงกับต้องพึ่งพาเตาปฏิกรณ์นิวเคลียร์ฟิวชันด้วยซ้ำ แต่เขาก็ยังคงกังวลว่ามันจะไม่เพียงพอต่อการใช้งาน","แล้ว ‘เอลล่า’ ทำยังไงถึงได้เลื่อนระดับขึ้นเป็นตำนานได้ล่ะ?","“หรือว่าจะใช้พลังจิตวิญญาณ?”","จู่ๆ ลินน์ก็นึกถึงความเป็นไปได้นี้ขึ้นมา และในทันใดนั้นเขาก็สัมผัสได้ถึงความหนาวเหน็บที่แล่นพล่านจากฝ่าเท้าขึ้นมายังหัวใจ","ตอนที่อยู่ที่เมืองท่า ปัญญาประดิษฐ์สนับสนุนก็เคยเสนอให้เขาใช้พลังจิตวิญญาณเป็นพลังงานสำรอง เพื่อชดเชยส่วนที่เสียไปมาแล้ว","‘071 ตามสมการของข้า การสร้างร่างกายพลังงานจะต้องใช้จิตวิญญาณของมนุษย์จำนวนเท่าไหร่?’","ลินน์เอ่ยถามด้วยความอยากรู้อยากเห็น","[หากไม่คำนวณรวมการสูญเสียพลังงาน จำเป็นต้องใช้พลังจิตวิญญาณของคนสองแสนคน หรือไม่ก็พ่อมดฝึกหัดห้าหมื่นคน หรือพ่อมดเต็มตัวหนึ่งหมื่นคน]","เมื่อได้ยินตัวเลขนี้ ลินน์ก็สูดลมหายใจเข้าลึกๆ","นี่ขนาดไม่ได้นับรวมการสูญเสียพลังงานเข้าไปด้วยนะ...ไม่อย่างนั้นมันอาจจะเพิ่มขึ้นเป็นสองเท่า หรืออาจจะเพิ่มขึ้นหลายเท่าตัวเลยก็ได้!","ต้องรู้ก่อนนะว่า ทั่วทั้งดินแดนของพ่อมดก็ยังหาพ่อมดเต็มตัวหนึ่งหมื่นคนไม่ได้เลย และอีกฝ่ายก็คงไม่สามารถลงมือกับบาทหลวงและบิชอปได้ ถ้าอย่างนั้นก็เหลือแค่เป้าหมายเดียว นั่นก็คือบรรดาชาวบ้านผู้ยากไร้!","ต้องยอมรับเลยว่า ‘เอลล่า’ เจ้ามันโหดเหี้ยมจริงๆ!","ถ้าอย่างนั้น การที่เขากำจัดร่างจำลองของอีกฝ่ายไปได้หนึ่งร่าง ก็เท่ากับเป็นการผลาญพลังจิตวิญญาณสำรองที่เทพเจ้าจอมปลอมนั่นสะสมเอาไว้หลายแสนดวงเลยน่ะสิ","แค่ไม่รู้ว่าตลอดหลายปีที่ผ่านมา ‘เอลล่า’ ได้เก็บเกี่ยวจิตวิญญาณไปมากเท่าไหร่แล้ว","หลายล้านดวง? หลายสิบล้านดวง? หรือหลายร้อยล้านดวง?","ลินน์ครุ่นคิดอยู่ครู่หนึ่ง และรู้สึกว่ามันไม่น่าจะเวอร์ขนาดนั้น ศาสนจักรไม่น่าจะสามารถเก็บเกี่ยวจิตวิญญาณของทุกคนที่ตายไปได้ อย่างน้อยที่สุดพวกเขาก็ต้องเป็นผู้ศรัทธาเสียก่อน มิฉะนั้นพลังที่อีกฝ่ายครอบครองอยู่มันก็คงจะน่าสะพรึงกลัวเกินไปแล้ว"]},{"n":452,"t":"การช่วยเหลือจากทางไกล การล่าพ่อมดของจักรวรรดิ","c":["ณ เมืองน้ำมันดิน ภายในห้องทดลองของคฤหาสน์ ลินน์กำลังขบคิดพร้อมกับเขียนสูตรสมการต่างๆ ลงไปอย่างต่อเนื่อง โดยไม่รู้ตัว เวลาค่ำคืนก็ผ่านพ้นไป จนกระทั่งถึงช่วงเช้า ความคิดของเขาก็ถูกขัดจังหวะด้วยเสียงเคาะประตู","“เข้ามาได้”","ลินน์นวดขมับของตนเองเบาๆ ค่อยๆ ดึงสติกลับมาจากสูตรสมการจำนวนมหาศาล และมองไปยังประตูห้อง","“ท่านศาสตราจารย์”","คนที่เดินเข้ามาก็คือเพียร์ซ","“มีธุระอะไรหรือเปล่า?”","ลินน์เอ่ยถามขึ้น","“เป็นข่าวคราวจากภายในจักรวรรดิครับ ท่านประธานแฮร์รอฟให้ข้ามาถามความคิดเห็นของท่าน”","เพียร์ซกล่าวออกมาด้วยความลังเล","“จักรวรรดิงั้นรึ?”","ลินน์อดไม่ได้ที่จะชะงักไปเล็กน้อย ในหัวของเขามีข้อสันนิษฐานผุดขึ้นมามากมาย","คงไม่ใช่ว่าศาสนจักรเปิดฉากบุกโจมตีครั้งใหญ่อีกแล้วหรอกนะ?","ถ้าเป็นอย่างนั้นก็หมายความว่า ‘เอลา’ ค้นพบวิธีรับมือกับเวทมนตร์ระเบิดนิวเคลียร์ได้แล้ว ซึ่งนี่นับว่าเป็นข่าวร้ายที่สุดอย่างไม่ต้องสงสัย","โชคดีที่เพียร์ซรีบอธิบายต่ออย่างรวดเร็ว ว่าไม่ได้เป็นเพราะศาสนจักรเปิดฉากบุกโจมตี แต่เป็นเพราะการโฆษณาชวนเชื่อของบรรดานักบวชและบิชอปภายในจักรวรรดิ ทำให้เกิดการเคลื่อนไหวเพื่อล่าพ่อมดที่น่าสะพรึงกลัวที่สุดในประวัติศาสตร์!","แต่เดิม แม้ว่าพวกพ่อมดจะถูกตามล่าและไม่เป็นที่ต้อนรับภายในจักรวรรดิ แต่ตราบใดที่พวกเขาไม่แสดงเวทมนตร์ออกมาให้ใครเห็น ไม่ทำการทดลองมนุษย์ที่ชั่วร้าย หรือการบูชายัญที่น่าสะพรึงกลัว พ่อมดที่มีความสามารถก็ยังพอจะเอาชีวิตรอดต่อไปได้อย่างยากลำบาก","คนที่ทำตัวกลมกลืนได้ดีหน่อย ก็จะร่วมมือกับขุนนางในพื้นที่ เพื่อช่วยจัดการกับเรื่องสกปรกที่ไม่อาจเปิดเผยได้ ส่วนคนที่ทำได้แย่กว่านั้น ก็คงจะเหมือนกับโคร อาจารย์ของเขา ที่สร้างตัวตนปลอมขึ้นมาเพื่อหลอกเอาเงินจากพ่อมดฝึกหัดที่มีฐานะร่ำรวย มาสนับสนุนการวิจัยเวทมนตร์ของตัวเอง","แต่เมื่อทฤษฎีวันสิ้นโลกแพร่กระจายออกไป ความหวาดกลัวที่ผู้ศรัทธาและชาวบ้านธรรมดามีต่อพวกพ่อมดก็ทวีความรุนแรงมากขึ้น บรรดาขุนนางก็ไม่กล้าแบกรับความเสี่ยงมหาศาลเพื่อร่วมมือกับพวกเขาอีกต่อไป ส่งผลให้พ่อมดที่หลบซ่อนตัวอยู่ในเงามืดจำนวนมากถูกขุดคุ้ยออกมา","ตามรายงานของสายลับ เพียงแค่ในเขตตะวันตกเขตเดียว ก็เกิดเหตุการณ์สังหารหมู่พ่อมดขึ้นนับสิบครั้งแล้ว","“ในตอนนี้มีพ่อมดจำนวนมากเตรียมตัวที่จะหลบหนีไปที่อาณาจักรฮัดลาตา ในเขตตะวันตกถึงกับมีการก่อตั้งองค์กรช่วยเหลือซึ่งกันและกันของพวกพ่อมดขึ้นมาด้วย ทางสภากำลังพิจารณาอยู่ว่าควรจะส่งเรือเหาะไปรับพวกเขาดีหรือไม่”","เพียร์ซรายงานข่าวทั้งหมดที่เขาสืบมาได้อย่างตรงไปตรงมา","ลินน์ลังเลอยู่ครู่หนึ่ง การส่งเรือเหาะเข้าไปในจักรวรรดิ ถือว่าเป็นการกระทำที่อันตรายมาก!","ในตอนนี้พวกเขายังคงอยู่ในช่วงสงครามกับศาสนจักร แต่ในช่วงครึ่งเดือนที่ผ่านมา อีกฝ่ายกลับไม่มีทีท่าว่าจะตอบโต้กลับครั้งใหญ่เลย และดูเหมือนจะเอนเอียงไปทางสงบศึกชั่วคราวเสียมากกว่า","เห็นได้ชัดว่า นี่คือความหวาดกลัวที่เกิดจากเวทมนตร์ระเบิดนิวเคลียร์ ทำให้ศาสนจักรเกิดความหวาดระแวง และไม่กล้าเปิดฉากโจมตีอย่างสุ่มสี่สุ่มห้า ในขณะที่ยังไม่รู้เบื้องลึกเบื้องหลังของพวกเขาอย่างถ่องแท้","ส่วนทางฝั่งของสภาก็เช่นเดียวกัน ในตอนนี้ไพ่ตายเพียงใบเดียวที่เขาถืออยู่ก็คือเวทมนตร์ระเบิดนิวเคลียร์ และปริมาณของยูเรเนียม-235 ที่มีอยู่ ก็เพียงพอให้ร่ายเวทมนตร์ระเบิดนิวเคลียร์ได้อีกแค่ครั้งเดียวเท่านั้น จึงไม่อาจนำมาใช้พร่ำเพรื่อได้","ยิ่งยื้อเวลาได้นานเท่าไหร่ ก็ยิ่งเป็นผลดีต่อพวกเขามากเท่านั้น ไม่ว่าจะเป็นในแง่ของการขุดเหมืองแร่ยูเรเนียม หรือในแง่ของการเตรียมพร้อมสำหรับสงคราม และการเลื่อนระดับขึ้นเป็นตำนาน","หากส่งเรือเหาะเข้าไปในจักรวรรดิตอนนี้ ก็มีความเป็นไปได้สูงมากที่จะไปยั่วยุศาสนจักร และอาจจะนำไปสู่การปะทุของสงครามครั้งใหม่ได้โดยตรง","“ท่านศาสตราจารย์ ถ้าอย่างนั้นเราควรจะปฏิเสธการช่วยเหลือนี้ดีไหมครับ?”","เอล็อคเอ่ยถามอย่างระมัดระวัง","การตัดสินใจของลินน์นั้นสำคัญเป็นอย่างมาก แม้ว่าในตอนนี้สมาชิกสภาส่วนใหญ่จะเห็นพ้องต้องกันว่าควรส่งคนไปช่วยเหลือ แต่หากท่านศาสตราจารย์ยืนกรานที่จะคัดค้าน ก็มีโอกาสสูงมากที่จะไม่ผ่านการอนุมัติ","เพราะลินน์ผู้ที่สามารถร่ายเวทมนตร์ระเบิดนิวเคลียร์ และสังหารร่างสถิตของเทพเจ้าจอมปลอมได้ ซึ่งกลายมาเป็นไพ่ตายของพวกพ่อมดไปแล้ว บางครั้งคำพูดของเขาก็มีน้ำหนักยิ่งกว่าท่านประธานสภาเสียอีก","“ยังไงก็ต้องช่วย!”","ลินน์ครุ่นคิดอยู่ครู่หนึ่ง ก่อนจะตัดสินใจออกมา","“ถ้าหากว่าพวกเราไม่กล้าแม้แต่จะส่งคนเข้าไปช่วยเหลือ ศาสนจักรก็จะคิดว่าพวกเราแค่ทำตัวข่มขู่ไปอย่างนั้นเอง”","“บางทีนี่อาจจะเป็นการหยั่งเชิงจากอีกฝ่าย และพวกเราก็ต้องโต้กลับไป!”","ลินน์กล่าวด้วยน้ำเสียงที่หนักแน่น","“ได้เลยครับ!”","เอล็อคดีใจเป็นอย่างมาก และรีบกลับไปรายงานในทันที","ในฐานะพ่อมดฝ่ายหัวก้าวหน้า แน่นอนว่าเขาย่อมเห็นด้วยกับการตอบโต้ศาสนจักรที่กล้าสังหารหมู่พวกพ่อมดอย่างสาสม","เมื่อได้รับคำตอบยืนยันจากลินน์ สภาก็ไม่รอช้าอีกต่อไป พวกเขาส่งเรือเหาะกว่ายี่สิบลำ พร้อมด้วยเครื่องบินรบรูปแบบใหม่คอยคุ้มกัน มุ่งหน้าเข้าไปช่วยเหลือในจักรวรรดิทันที!","...","เวลาเที่ยงตรง ณ เขตตะวันตกของจักรวรรดิ ภายในป่าทึบแห่งหนึ่งเต็มไปด้วยผู้คน เสียงกรีดร้อง เสียงโอดครวญ และเสียงของการเข่นฆ่าดังขึ้นอย่างไม่ขาดสาย","“ฆ่าสุนัขรับใช้ของปีศาจร้ายพวกนี้ ฆ่าผู้แพร่กระจายวันสิ้นโลก...”","บิชอปผู้เป็นหัวหน้าตะโกนเสียงดังลั่น อัศวินจำนวนมากที่อยู่ข้างกายได้ง้างหน้าไม้เตรียมพร้อมเอาไว้แล้ว ในพริบตาเดียว ห่าฝนลูกศรที่แหลมคมก็พุ่งทะยานเข้าใส่ป่าทึบแห่งนั้น","ลูกศรส่วนใหญ่ถูกสกัดกั้นเอาไว้ด้วยเวทมนตร์ ไม่ก็พุ่งไปปักอยู่ตามลำต้นของต้นไม้และพุ่มไม้ แต่ก็ใช่ว่าจะไม่มีใครได้รับบาดเจ็บเลย พ่อมดฝึกหัดที่มีรูปร่างเล็กคนหนึ่งหลบไม่พ้น จึงถูกลูกศรหน้าไม้หลายดอกพุ่งทะลุแผ่นหลัง ร่างของเขาล้มกลิ้งลงไปกับพื้น และสิ้นใจไปในชั่วพริบตา","“อาม่อน!”","แม่มดวัยกลางคนเบิกตากว้างด้วยความโกรธแค้น เปลวไฟรอบกายปะทุขึ้นมาอย่างรุนแรง ควบแน่นกลายเป็นลูกไฟหลายลูก และพุ่งทะยานออกไปด้วยเสียงหวีดร้องที่แสบแก้วหู","แรงระเบิดที่รุนแรงฉีกกระชากร่างของอัศวินสิบกว่าคนที่อยู่ด้านหน้าจนแหลกละเอียด แต่ในวินาทีต่อมา ลูกศรหน้าไม้จำนวนมหาศาลก็พุ่งทะลุกลุ่มควันและเปลวไฟออกมา พร้อมกับคลื่นกระแทกแสงศักดิ์สิทธิ์ที่ถูกร่ายโดยบิชอปทั้งสาม ทำลายการป้องกันรอบกายของแม่มด และระเบิดร่างของเธอจนกลายเป็นละอองเลือด","เมื่อเห็นพ่อมดเต็มตัวต้องมาสละชีวิต โดยที่ไม่สามารถหยุดยั้งการโจมตีของอีกฝ่ายได้เลยแม้แต่น้อย พ่อมดที่กำลังหลบหนีก็พากันหวาดกลัวจนตัวสั่น","ห่าฝนลูกศรยังคงโปรยปรายลงมาอย่างต่อเนื่อง อาจเป็นเพราะหวาดกลัวต่อเวทมนตร์ที่แข็งแกร่งและแปลกประหลาดของพวกพ่อมด บรรดาอัศวินจึงไม่ยอมเข้ามาต่อสู้ในระยะประชิด พวกเขาเอาแต่ใช้หน้าไม้ระดมยิงมาจากระยะไกล เพื่อผลาญพลังเวทของพวกพ่อมด","มีคนหมดแรงจนตามไม่ทัน และมีคนถูกลูกศรยิงจนล้มลงอยู่เป็นระยะๆ","“ท่านลูคัส พวกเราควรจะทำยังไงกันดี?”","พ่อมดหลายคนที่กำลังหลบหนีเอ่ยถามด้วยความหวาดวิตก พวกเขาทุกคนต่างก็รู้ดีว่า หากขืนเป็นแบบนี้ต่อไป ทุกคนจะต้องตายกันหมดแน่","“ไอ้พวกคนทรยศบัดซบ!”","พ่อมดที่ชื่อลูคัสสบถด่าออกมา","แต่เดิมพวกเขาได้ก่อตั้งสมาคมช่วยเหลือซึ่งกันและกันขึ้นมา เพื่อรับมือกับการตามล่าของศาสนจักรที่ทวีความรุนแรงมากขึ้นทุกวัน และวางแผนว่าควรจะหลบหนีไปยังอาณาจักรฮัดลาตาที่ว่ากันว่าอยู่ภายใต้การปกครองของพวกพ่อมดได้อย่างไรให้ปลอดภัยที่สุด","แต่นึกไม่ถึงเลยว่า จะมีคนทรยศขายสถานที่นัดพบของพวกเขา ศาสนจักรจึงส่งคนมาดักซุ่มรออยู่ที่นั่นตั้งแต่แรก และฉวยโอกาสที่พวกเขากำลังปรึกษาหารือกันอยู่ บุกเข้ามาโจมตีอย่างไม่ทันตั้งตัว หลังจากผ่านการต่อสู้ที่ดุเดือด พ่อมดกว่าสามร้อยคนและพ่อมดฝึกหัดจำนวนมากก็ล้มตายลงอย่างน่าอนาถ เหลือเพียงแค่ร้อยกว่าคนเท่านั้นที่หลบหนีออกมาได้","ลูคัสโกรธจนแทบจะเป็นบ้า แต่ก็ไม่สามารถทำอะไรได้ จึงทำได้เพียงแค่เอ่ยปลอบใจว่า","“ทุกคน อดทนอีกสักนิด ตราบใดที่พวกเราหนีไปถึงเมืองน้ำมันดิน พวกเราก็จะปลอดภัยแล้ว ที่นั่นคืออาณาเขตของพวกพ่อมด”","“เมื่อไปถึงที่นั่น พวกเราก็จะไม่ต้องกังวลว่าจะถูกศาสนจักรตามล่าอีก และไม่ต้องปิดบังตัวตนอีกต่อไป สามารถร่ายเวทมนตร์ได้อย่างเปิดเผย...”","ลูคัสพร่ำบอกถึงชีวิตที่สวยงามในวันข้างหน้าอย่างไม่ขาดปาก","แม้ว่าในตอนนี้เขาเองก็ยังไม่แน่ใจว่าข่าวนั้นเป็นความจริงหรือไม่ แต่ตอนนี้เ
