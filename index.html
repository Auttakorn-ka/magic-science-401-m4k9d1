<script>
const CHAPTERS = [{"n":401,"t":"วิธีควบคุมธาตุยูเรเนียมและเปลี่ยนระเบิดนิวเคลียร์ให้เป็นเวทมนตร์!","c":["การจะสกัดยูเรเนียม-235 ที่มีอยู่น้อยนิดออกมาจากแร่ยูเรเนียมความเข้มข้นสูงให้ได้นั้น ถือเป็นก้าวแรกของการสร้างอาวุธนิวเคลียร์","โดยทั่วไปแล้ว วิธีที่นิยมใช้กันก็คือ วิธีการแพร่แก๊ส, วิธีหมุนเหวี่ยง, วิธีหัวฉีด, วิธีเลเซอร์และอื่นๆ ซึ่งสองวิธีแรกเป็นวิธีที่เหมาะสมที่สุดสำหรับการนำไปใช้ในระดับอุตสาหกรรมขนาดใหญ่","แต่สิ่งที่ลินน์เลือกใช้ในครั้งนี้คือ วิธีการแยกด้วยแม่เหล็กไฟฟ้า ซึ่งมีค่าสัมประสิทธิ์การแยกสูงกว่าเครื่องหมุนเหวี่ยงแก๊สมาก และที่สำคัญที่สุดคือ พวกพ่อมดมีพลังในการควบคุมสายฟ้า ซึ่งนั่นจะทำให้กระบวนการทั้งหมดสะดวกและง่ายดายขึ้นมาก","สายฟ้าอันบ้าคลั่งอัดแน่นอยู่เต็มวงเวทเล่นแร่แปรธาตุ พร้อมกับอุณหภูมิที่พุ่งสูงขึ้นอย่างต่อเนื่อง จนกระทั่งถึงจุดหลอมเหลวของยูเรเนียม ภายใต้สายตาที่จับจ้องของทุกคน หินปีศาจอันแข็งแกร่งก็ค่อยๆ หลอมละลายจากการถูกสายฟ้าฟาดซ้ำแล้วซ้ำเล่า จนกลายเป็นของเหลวหนืดสีแดงฉาน...","ลินน์ไม่สนใจสิ่งใด เขาเพียงแค่เพิ่มพลังของสายฟ้าให้มากขึ้น ภายใต้อุณหภูมิที่สูงกว่าสี่พันองศาเซลเซียส ยูเรเนียมที่กลายเป็นของเหลวก็ระเหิดกลายเป็นแก๊สอย่างรวดเร็ว และสุดท้ายก็กลายเป็นพลาสมา ผสมผสานเข้ากับสายฟ้าอันบ้าคลั่งอย่างสมบูรณ์","บาเรียเวทมนตร์ที่มองไม่เห็นก่อตัวขึ้นจากขอบของวงเวท วินาทีต่อมา วงเวทเล่นแร่แปรธาตุทั้งหมดก็กลายสภาพเป็นกระบอกทรงกลมขนาดยักษ์ พลาสมายูเรเนียมที่อยู่ด้านในเริ่มหมุนด้วยความเร็วสูงลิบลิ่ว และภายใต้ผลของแรงเหวี่ยงหนีศูนย์กลาง ไอโซโทปของยูเรเนียมที่มีมวลมากกว่า ก็จะค่อยๆ ไปรวมตัวกันหนาแน่นอยู่ที่ขอบด้านนอก ด้วยวิธีนี้ ไอโซโทปหลายชนิดที่มีมวลแตกต่างกันเพียงเล็กน้อย ก็จะถูกแยกออกจากกัน!","แต่กระบวนการนี้มันไม่ได้ง่ายดายเหมือนที่พูดเลยแม้แต่น้อย เพราะลินน์ต้องดึงพลังประมวลผลทั้งหมดที่มีออกมาใช้ ถึงขั้นที่ต้องเปิดใช้งาน ‘โหมดโอเวอร์โหลด’ เพื่อยกระดับพลังจิตวิญญาณจากระดับสี่ให้กลายเป็นระดับห้า ถึงจะสามารถควบคุมสถานการณ์เอาไว้ได้อย่างหวุดหวิด","เอล็อคที่ยืนอยู่ข้างๆ เฝ้ามองทุกอย่างด้วยความตึงเครียด เพราะพลังสายฟ้าอันบ้าคลั่งภายในวงเวท ทำให้เขารู้สึกหวาดผวาจนใจสั่น หากพ่อมดเต็มตัวอย่างพวกเขาถูกดึงเข้าไปพัวพันล่ะก็ รับรองได้เลยว่าไม่มีทางรอดกลับมาแน่ๆ!","กระบวนการทั้งหมดดำเนินไปนานกว่าสี่สิบนาที ก่อนที่พลังสายฟ้าภายในวงเวทจะเริ่มสลายตัวลง ลินน์ลืมตาขึ้น ทุกสิ่งทุกอย่างกลับคืนสู่ความสงบ ที่ใจกลางของวงเวทเล่นแร่แปรธาตุ เหลือเพียงลูกบอลเวทมนตร์ขนาดใหญ่หนึ่งลูก และขนาดเล็กอีกสองลูกเท่านั้น","เพียงลินน์ขยับความคิด ลูกบอลเวทมนตร์ก็ลอยเข้ามาหาและลอยวนอยู่รอบตัวเขา ภายในลูกบอลเหล่านั้นคือธาตุทั้งสามชนิดที่อยู่ในสถานะแก๊ส","ลูกบอลเวทมนตร์ที่มีขนาดใหญ่ที่สุดคือยูเรเนียม-238 รองลงมาคือยูเรเนียม-235 และลูกสุดท้ายคือความประหลาดใจที่คาดไม่ถึง...ธาตุเรเดียม!","ใช่แล้ว เขาไม่พบยูเรเนียม-234 ในหินปีศาจก้อนเล็กๆ นี้เลย เพราะปริมาณของมันในธรรมชาตินั้นมีน้อยมากจริงๆ แต่โชคดีที่การค้นพบธาตุเรเดียม ทำให้ลินน์รู้สึกประหลาดใจยิ่งกว่า","นี่ก็เป็นธาตุกัมมันตรังสีอีกชนิดหนึ่ง และมันก็มีความสำคัญมากเช่นกัน เพราะเรเดียมมีครึ่งชีวิตเพียง 1,600 ปี ซึ่งเร็วกว่ายูเรเนียมถึงหลายแสนเท่า ซึ่งแสดงให้เห็นว่ากัมมันตภาพรังสีของมันรุนแรงแค่ไหน และการค้นพบรังสีหลายๆ ชนิด ก็ล้วนเกี่ยวข้องกับธาตุเรเดียมทั้งสิ้น","สำหรับธาตุที่อันตรายอย่างยูเรเนียมและเรเดียม ลินน์ก็ไม่กล้าประมาทมันเลยแม้แต่น้อย ทันทีที่แยกพวกมันออกมาได้ เขาก็ใช้ลูกบอลเวทมนตร์ห่อหุ้มพวกมันเอาไว้ทันที ส่วนเรื่องที่ว่าพลังเวทจะสามารถป้องกันรังสีได้หรือไม่นั้น ก็ยังต้องรอดูผลการวิจัยและตรวจสอบเพิ่มเติมต่อไป","ในตอนนี้ก็ถือว่าทำไปเพื่อความสบายใจก็แล้วกัน...","เรื่องที่สองที่ทำให้ลินน์รู้สึกยินดีก็คือ แม้ว่าเขาจะไม่สามารถใช้ ‘เวทแยกแยะวัสดุขั้นสูง’ เพื่อวิเคราะห์และจำลองธาตุกัมมันตรังสีเหล่านี้ได้ แต่การจะควบคุมพวกมันแบบพื้นฐานก็ไม่ได้มีปัญหาอะไร","เพียงแต่ความรู้สึกตอนที่ควบคุมพวกมัน มันเหมือนกับตอนที่เขายังเป็นแค่พ่อมดฝึกหัดที่พยายามควบคุมธาตุต่างๆ โดยรู้สึกเหนื่อยล้าและรู้สึกเหมือนว่าพลังมันไม่พอ ซึ่งมันกินพลังเวทและพลังจิตวิญญาณของเขาไปมหาศาลมาก","เมื่อเห็นว่าการทดลองแยกธาตุประสบความสำเร็จ พวกเอล็อคก็เริ่มเฉลิมฉลองกันแล้ว บางทีพวกเขาอาจจะเป็นมนุษย์กลุ่มแรก ที่สามารถแยกธาตุเหล่านี้ออกมาจากหินปีศาจได้","“ทุกคน ตอนนี้ยังเร็วไปที่จะมาฉลองกัน การแยกธาตุเป็นเพียงแค่ก้าวแรกเท่านั้น ขั้นตอนต่อไป เรายังต้องทดสอบคุณสมบัติ มวล มวลโมเลกุล และความหนาแน่นของพวกมันอีก...”","ลินน์เอ่ยปากระงับความตื่นเต้นของทุกคน พร้อมกับแจกจ่ายรายการทดสอบเหล่านั้นให้แต่ละคนไปทำ ส่วนตัวเขาก็หยิบกระดาษขึ้นมาแผ่นหนึ่ง และเริ่มขบคิดหาวิธีสร้างโครงสร้างเวทมนตร์สำหรับ ‘เวทมนตร์ระเบิดนิวเคลียร์’ ...","การจะสร้างระเบิดปรมาณูขึ้นมาสักลูกโดยใช้วิธีการทางวิทยาศาสตร์แบบร้อยเปอร์เซ็นต์นั้น มันยุ่งยากเกินไป และมีปัญหาทางวิศวกรรมมากมายนับไม่ถ้วนที่ต้องแก้ไข ดังนั้น การนำหลักการของระเบิดนิวเคลียร์มาประยุกต์ใช้กับเวทมนตร์ จึงเป็นทางเลือกที่ดีและรวดเร็วที่สุดอย่างไม่ต้องสงสัย...","ประการแรกคือ จะทำยังไงถึงจะนำยูเรเนียม-235 ปริมาณมากมารวมกันได้","การใช้แม่เหล็กไฟฟ้ากักเก็บอาจจะพอเป็นไปได้...แต่หลังจากคิดดูดีๆ แล้ว ลินน์ก็ขีดฆ่าวิธีนี้ทิ้งไป เพราะสนามแม่เหล็กไฟฟ้าที่รุนแรง อาจจะส่งผลกระทบต่อการเกิดปฏิกิริยาลูกโซ่ได้","ลินน์ครุ่นคิดอยู่ครู่หนึ่ง แล้วก็ตัดสินใจที่จะใช้พลังเวทจำลองธาตุที่แข็งแกร่งชนิดหนึ่งขึ้นมาทำเป็นเปลือกหุ้ม โดยเกราะเกล็ดงูประหลาดนั่นก็น่าจะใช้ได้ แม้จะไม่รู้ว่าตอนนั้นมันจำลองโครงสร้างร่างกายมาจากสัตว์เวทมนตร์ชนิดไหน แต่มันแข็งแกร่งกว่าเหล็กกล้ามาก...","ต่อมาก็คือ ‘แหล่งกำเนิดนิวตรอน’ จะต้องใช้วิธีทางเวทมนตร์แบบไหน ถึงจะสร้างมันขึ้นมาได้ ซึ่งนี่คือหัวใจสำคัญในการจุดระเบิดอาวุธนิวเคลียร์...","และสุดท้าย เขายังต้องหาวิธีที่จะขว้างเจ้านี่ออกไปให้ไกลพอ ไม่อย่างนั้นมันก็ไม่ต่างอะไรกับการตายตกไปตามกันกับศัตรู!","ปัญหามากมายผุดขึ้นมาในหัวของลินน์ ต่อให้จะมีปัญญาประดิษฐ์สนับสนุนคอยช่วยเหลือ และมีทฤษฎีความรู้อย่างละเอียดจากฐานข้อมูลของสหพันธ์ แต่การจะเปลี่ยนระเบิดนิวเคลียร์ให้กลายเป็นเวทมนตร์นั้น ก็ทำให้ลินน์รู้สึกปวดหัวไม่น้อยเลย...","...","ในช่วงหลายวันที่ผ่านมา การวิจัยเกี่ยวกับธาตุชนิดใหม่และโครงสร้างภายในของธาตุ ได้กลายเป็นหัวข้อที่พวกพ่อมดทุกคนกำลังพูดคุยกันอย่างกระตือรือร้น ซึ่งมันก็สร้างความวุ่นวายได้ไม่น้อยเลย เพราะแค่อุบัติเหตุจากการทดลองนี้ ก็เกิดขึ้นไปแล้วกว่าสามสิบครั้ง","โชคดีที่พวกพ่อมดที่คลั่งไคล้ในการทดลอง ต่างก็ชินชากับ ‘อุบัติเหตุเล็กๆ น้อยๆ’ เหล่านี้ไปเสียแล้ว ไม่ว่าจะเป็นพ่อมดเต็มตัวที่เป็นคนคุมการทดลอง หรือพวกพ่อมดฝึกหัดที่เป็นลูกมือ ทันทีที่เห็นว่าท่าไม่ดี พวกเขาก็จะวิ่งหนีกันเร็วกว่าใครเพื่อน แถมยังเตรียมการป้องกันรูปแบบต่างๆ เอาไว้เป็นอย่างดี จนถึงตอนนี้จึงยังไม่มีใครต้องตายเพราะเรื่องพวกนี้เลย","มีเพียงพ่อมดโชคร้ายคนหนึ่ง ที่พยายามใช้การระเบิดเพื่อบดขยี้อะตอมแต่ดันคำนวณปริมาณผิดพลาด จนทำให้แขนข้างหนึ่งถูกระเบิดจนขาดกระเด็น แต่หลังจากดื่มยาเวทมนตร์ต่ออวัยวะเข้าไป เขาก็ไม่ได้หยุดพักเลยแม้แต่น้อย และกลับเข้าไปทำการทดลองต่อทันที...","จนกระทั่งถึงช่วงเย็นของวันที่สาม เมื่อสภาได้เรียกทุกคนมารวมตัวกันเพื่อแลกเปลี่ยนผลการวิจัยล่าสุด พวกพ่อมดถึงได้ยอมเดินออกมาจากห้องทดลองด้วยความอาลัยอาวรณ์","ช่วงนี้การประชุมหารือกันเริ่มบ่อยขึ้นเรื่อยๆ วิธีเดิมๆ ที่แต่ละคนเอาแต่หมกมุ่นอยู่กับการวิจัยและค่อยๆ ศึกษาไปตามลำพัง เริ่มจะไม่เหมาะสมกับสถานการณ์ในตอนนี้แล้ว","ท้ายที่สุด ภัยคุกคามจากศาสนจักรก็มาจ่ออยู่ที่หน้าประตูแล้ว การค้นพบใหม่ๆ ล้วนมีความสำคัญอย่างยิ่ง และการพูดคุยแลกเปลี่ยนกันบ่อยๆ ก็มีส่วนช่วยให้เกิดแรงบันดาลใจใหม่ๆ ได้","ด้วยประโยชน์จากการแลกเปลี่ยนและการทดลองที่เกิดขึ้นบ่อยครั้ง นับตั้งแต่มีการนำเสนอทฤษฎีการแยกอะตอม ภายในเวลาเพียงแค่หนึ่งสัปดาห์ ก็มีคนสองคนได้รับการเสนอชื่อให้รับ ‘เหรียญตราดาวประกายพฤกษ์’ แล้ว ซึ่งนี่ก็แสดงให้เห็นว่าทางสภาให้ความสำคัญกับเรื่องนี้มากแค่ไหน","เมื่อลินน์มาถึงห้องประชุม ที่นี่ก็คลาคล่ำไปด้วยผู้คน โดยพ่อมดหลายคนมีสภาพผมเผ้ายุ่งเหยิงและมีขอบตาดำคล้ำอย่างเห็นได้ชัด ซึ่งไม่ต้องบอกก็รู้ว่าเป็นเพราะพวกเขาอดหลับอดนอนทำการทดลองมาเป็นเวลานาน และเขาก็ดันเป็นคนสุดท้ายที่มาถึงซะด้วย..."]},{"n":402,"t":"นี่จะไม่ปล่อยให้คนอื่นได้มีที่ยืนบ้างเลยหรือไง?","c":["เมื่อเห็นว่าดาวแห่งเวทมนตร์ผู้โด่งดังอย่างลินน์มาถึง บรรดาพ่อมดที่มารวมตัวกันอยู่ในห้องประชุมต่างก็พากันหลีกทางให้ และจอมเวทผู้ยิ่งใหญ่ที่คุ้นเคยกันดีอย่างราฟาเอลและคนอื่นๆ ก็เดินเข้ามาต้อนรับทันที","“ท่านปรมาจารย์ลินน์ ดาวแห่งเวทมนตร์ของเรา เป็นอย่างไรบ้าง หมู่นี้พอจะมีเบาะแสอะไรเกี่ยวกับการวิจัยโครงสร้างของธาตุและธาตุชนิดใหม่บ้างไหม?”","ราฟาเอลหัวเราะและเอ่ยถามขึ้น","“ก็พอจะได้อะไรติดไม้ติดมือมาบ้างครับ”","ลินน์ยิ้มบางๆ และตอบกลับ","“ข้ากำลังเตรียมที่จะใช้ธาตุชนิดใหม่นี้ในการคิดค้นเวทมนตร์รูปแบบใหม่ แต่ตอนนี้ยังขาดกุญแจสำคัญที่สุดที่ยังแก้ไม่ตกน่ะครับ”","เขาใช้เวลาค้นคว้ามาถึงสามวัน และตอนนี้ก็เหลือเพียงขั้นตอนสุดท้ายแล้ว ที่เขามาเข้าร่วมการประชุมในครั้งนี้ ก็เพื่อดูว่าจะสามารถอาศัยความช่วยเหลือจากเหล่าพ่อมดเพื่อบรรลุเป้าหมายในจุดนี้ได้หรือไม่!","“เรื่องการคิดค้นเวทมนตร์บทใหม่มันรีบร้อนไม่ได้หรอกนะ!”","ราฟาเอลพูดปลอบใจด้วยรอยยิ้ม","“วิธีการแยกธาตุด้วยแม่เหล็กไฟฟ้าที่ท่านเสนอมานั้นยอดเยี่ยมมาก การที่ท่านสามารถแยกธาตุชนิดใหม่ถึงสองชนิดออกมาจากหินปีศาจได้ เพียงแค่นี้มันก็มากพอที่จะทำให้ท่านได้รับเหรียญตราดาวประกายพฤกษ์ไปครองได้อย่างสบายๆ แล้ว”","ก่อนหน้านี้ หลังจากที่หินปีศาจถูกส่งมาที่สภา เหล่าจอมเวทผู้ยิ่งใหญ่หลายคนก็ได้ทำการตรวจสอบมันทันที จากนั้นพวกเขาก็พบว่าธาตุประหลาดชนิดนี้ ไม่สามารถถูกย่อยสลายด้วย ‘เวทแยกแยะวัสดุขั้นสูง’ ได้ แม้แต่พวกสมาชิกระดับสภาก็ยังไม่สามารถทำซ้ำหรือจำลองมันขึ้นมาได้เลย","การค้นพบนี้จุดประกายความตื่นเต้นให้กับกลุ่มพ่อมดในพริบตา ความสำคัญที่สภามีต่อธาตุชนิดใหม่นี้ก็พุ่งสูงขึ้นอย่างต่อเนื่อง","ใครก็ตามที่สามารถแยกธาตุชนิดใหม่ออกมาจากหินปีศาจและวิเคราะห์คุณสมบัติของมันได้ คนผู้นั้นก็จะได้รับสิทธิ์ในการตั้งชื่อให้กับธาตุชนิดใหม่ ซึ่งนี่ถือเป็นเกียรติยศที่มากพอจะได้รับการจารึกไว้ในหน้าประวัติศาสตร์ และเป็นเกียรติยิ่งกว่าการได้รับเหรียญตราดาวประกายพฤกษ์เสียอีก!","ทว่าในขณะที่พวกเขากำลังเตรียมลงมือวิจัยอยู่นั้น พวกเขาก็ได้รับข่าวว่า ท่านปรมาจารย์ลินน์ หรือดาวแห่งเวทมนตร์แห่งดินแดนพ่อมด ได้ใช้วิธีการแยกด้วยแม่เหล็กไฟฟ้าเพื่อแยกธาตุทั้งสองชนิดที่อยู่ภายในหินปีศาจออกมาได้สำเร็จ แถมยังทำการทดสอบข้อมูลเบื้องต้นเสร็จเรียบร้อยแล้ว และตั้งชื่อให้พวกมันว่า ยูเรเนียม และ เรเดียม!","เมื่อได้ยินข่าวนี้เป็นครั้งแรก ราฟาเอลและคนอื่นๆ ต่างก็พากันคลุ้มคลั่ง","ใช้เวลาแค่วันเดียว ทำไมถึงได้เร็วขนาดนี้?","นี่จะไม่ปล่อยให้คนอื่นได้มีที่ยืนบ้างเลยหรือไง?","ดังนั้น เมื่อได้ยินว่าท่านปรมาจารย์ลินน์ยังไม่มีความก้าวหน้าครั้งสำคัญใดๆ ในการวิจัยธาตุชนิดใหม่ เหล่าพ่อมดที่อยู่ในห้องก็พากันถอนหายใจด้วยความโล่งอก เพราะสิ่งที่พวกเขาเป็นกังวลมากที่สุดก็คือ การที่โครงการวิจัยของตัวเองดันไปซ้ำรอยกับดาวแห่งเวทมนตร์ผู้นี้เข้า ไม่อย่างนั้นความพยายามตลอดหลายวันที่ผ่านมาก็คงจะสูญเปล่าไปฟรีๆ","“ท่านปรมาจารย์ราฟาเอล ดูเหมือนว่าการวิจัยช่วงนี้ของท่านจะมีความคืบหน้าไปมากเลยนะครับ”","แน่นอนว่าลินน์สามารถมองเห็นสีหน้ายินดีของราฟาเอลได้ ซึ่งเห็นได้ชัดว่าอีกฝ่ายน่าจะมีการค้นพบอะไรใหม่ๆ","ราฟาเอลพูดด้วยความภาคภูมิใจว่า","“ใช่แล้ว ถึงแม้การค้นพบนี้จะเทียบไม่ได้กับวิธีแยกธาตุของท่าน แต่ข้าคิดว่ามันก็น่าจะเพียงพอที่จะสร้างกระแสใหม่ๆ ขึ้นมาได้...”","ด้วยผลงานวิจัยของเขา การจะได้รับเหรียญตราดาวประกายพฤกษ์สักเหรียญคงเป็นเรื่องที่ง่ายดายมาก และบางทีเขาอาจจะทำเงินได้มหาศาลจนสามารถแก้ปัญหาเรื่องงบวิจัยไม่พอไปได้เลยก็ได้","“ถ้าอย่างนั้นก็ขอแสดงความยินดีด้วยนะครับ!”","ลินน์ยิ้มและเอ่ยแสดงความยินดี","“มันก็แค่ความโชคดีเท่านั้นแหละ”","ราฟาเอลโบกมืออย่างถ่อมตัว แต่เขาก็ไม่ได้มีท่าทีว่าจะอธิบายรายละเอียดเพิ่มเติม เขาจงใจอุบเงียบเอาไว้เพื่อรอทำผลงานให้โดดเด่นตอนที่การประชุมเริ่มต้นขึ้น","ท่ามกลางเสียงพูดคุยชื่นชมและถกเถียงกันอย่างกระตือรือร้น ลินน์ก็เดินฝ่าฝูงชนไปจนถึงที่นั่งแถวหน้าสุด ซึ่งเป็นที่นั่งเฉพาะของเหล่าจอมเวทผู้ยิ่งใหญ่ และแน่นอนว่าเขาได้นั่งอยู่ในตำแหน่งแรกสุด!","“เอาล่ะทุกคน เงียบกันก่อน”","เมื่อเห็นว่าทุกคนมากันครบแล้ว แฮร์รอฟที่เป็นประธานในการประชุมก็กระแอมไอเบาๆ และพูดด้วยน้ำเสียงดังก้องไปทั่วห้องประชุม","เสียงอื้ออึงในห้องประชุมค่อยๆ เงียบลง พ่อมดที่อยู่ในห้องต่างพากันมองไปที่แฮร์รอฟอย่างพร้อมเพรียง เพื่อรอฟังวาระการประชุมต่อไป","“ตอนนี้ก็ผ่านไปหนึ่งสัปดาห์แล้วนับตั้งแต่การหารือเรื่องทฤษฎีการแยกอะตอมครั้งล่าสุด และก็ผ่านไปสามสี่วันแล้วนับตั้งแต่มีการค้นพบธาตุชนิดใหม่ ข้าคิดว่าทุกคนน่าจะพอมีผลงานอะไรออกมาบ้างแล้ว”","แฮร์รอฟกวาดสายตามองไปรอบๆ ก่อนจะพูดต่อ","“การประชุมครั้งนี้ไม่ใช่การสัมมนาทางวิชาการอย่างเป็นทางการ ทุกคนสามารถพูดคุยแลกเปลี่ยนความคิดเห็นกันได้อย่างอิสระ ต่อให้จะเป็นทฤษฎีทางวิชาการที่ยังไม่ได้รับการพิสูจน์ หรือจะเป็นแค่ข้อสันนิษฐานที่มีหลักฐานอ้างอิงบ้าง ก็สามารถนำมาพูดคุยกันได้เลย...”","เวลาเจ็ดวันท้ายที่สุดแล้วก็ยังสั้นเกินไป การจะสร้างทฤษฎีที่สมบูรณ์แบบขึ้นมานั้นเป็นเรื่องที่ค่อนข้างยาก แฮร์รอฟจึงได้ลดมาตรฐานของการสัมมนาในครั้งนี้ลง เพื่อให้ทุกคนสามารถพูดคุยได้อย่างอิสระ เพราะต่อให้เป็นเพียงแค่ข้อสันนิษฐานลอยๆ แต่มันก็อาจจะเป็นแรงบันดาลใจให้กับคนอื่นๆ ได้","หากไม่ใช่เพราะความร้อนรนที่จะค้นหาวิธีแก้ปัญหาจากทั้งสองเรื่องนี้ แฮร์รอฟก็คงจะไม่รีบร้อนขนาดนี้","เขาได้รับรายงานลับมาว่า ดูเหมือนทางศาสนจักรจะมีความเคลื่อนไหวอีกครั้ง ซึ่งสามารถคาดเดาได้เลยว่าสงครามครั้งต่อไปคงจะเกิดขึ้นในอีกไม่ช้า ก่อนหน้านี้พวกเขาได้เปิดเผยข้อมูลเกี่ยวกับอาวุธใหม่ๆ ไปมากเกินไปแล้ว ในครั้งนี้ศัตรูจะต้องเตรียมตัวมาอย่างดีแน่นอน","แฮร์รอฟถอนหายใจเงียบๆ แต่ก็ไม่ได้แสดงความกังวลออกมาให้เห็นบนใบหน้า ในไม่ช้าเขาก็เลือกพ่อมดเต็มตัวคนหนึ่งขึ้นมา เพื่อให้อีกฝ่ายขึ้นมาอธิบายทฤษฎีของตัวเองบนเวที","นี่ถือเป็นการดูแลเหล่าน้องใหม่ โดยเปิดโอกาสให้กับพ่อมดเต็มตัวระดับล่างๆ มากขึ้น เนื่องจากการวิจัยในครั้งนี้ถูกจำกัดอยู่แค่โครงสร้างภายในของธาตุและธาตุชนิดใหม่ ดังนั้นจึงเป็นเรื่องที่หลีกเลี่ยงไม่ได้ที่ผลการวิจัยบางส่วนจะซ้ำซ้อนกัน","ด้วยพลังของจอมเวทผู้ยิ่งใหญ่ พวกเขามักจะสามารถวิจัยได้ลึกซึ้งกว่า และยังสามารถเพิ่มเติมข้อมูลในภายหลังได้ แต่ถ้าทำกลับกัน พ่อมดเต็มตัวส่วนใหญ่ก็คงจะไม่มีโอกาสได้พูดเลยด้วยซ้ำ","แม่มดสาววัยยี่สิบเศษๆ คนหนึ่งเดินขึ้นไปบนเวทีสูง หลังจากทำความเคารพสมาชิกระดับสภาและเหล่าจอมเวทผู้ยิ่งใหญ่แล้ว นางก็พูดขึ้นด้วยความประหม่าเล็กน้อยว่า","“ท่านสมาชิกระดับสภาทุกท่าน หัวข้อการวิจัยของข้าคือคุณสมบัติของธาตุยูเรเนียมค่ะ จากการทดลอง ข้าพบว่าธาตุชนิดใหม่นี้สามารถทำปฏิกิริยากับน้ำเดือดและไอน้ำได้ ทำให้เกิดผลึกสีน้ำตาลดำซึ่งมีพิษร้ายแรงมาก หากนำมันมาบดให้เป็นผง ก็อาจจะมีความเสี่ยงที่จะติดไฟได้เองอีกด้วย...”","ระหว่างที่พูด แม่มดสาวก็เปิดผ้าที่ห่อสารผลึกประหลาดนั้นออกให้ทุกคนดู และทำการทดลองซ้ำให้ทุกคนดูอีกครั้ง","เหล่าพ่อมดในห้องประชุมมองดูการทดลองพลางพูดคุยกันไปมา เรื่องที่สารประกอบยูเรเนียมมีพิษนั้น หลายคนก็ได้ทำการทดลองจนรู้ผลลัพธ์นี้มาแล้ว พวกเขาจึงไม่ได้รู้สึกแปลกใจอะไรมากนัก และนี่ก็น่าจะเป็นเหตุผลที่ของสิ่งนี้ถูกเรียกว่าหินปีศาจ","การพกของที่มีพิษร้ายแรงขนาดนี้ติดตัวไว้ตลอดเวลา จะไม่ได้รับผลกระทบอะไรเลยก็คงเป็นไปไม่ได้","เมื่อแม่มดสาวพูดจบ เสียงปรบมือก็ดังขึ้นทั่วทั้งห้องประชุม แม้ว่าสิ่งที่นางวิจัยออกมาจะเป็นเพียงคุณสมบัติพื้นฐานและไม่ได้มีความพิเศษอะไร แต่เมื่อพิจารณาจากเวลาที่จำกัด การสามารถพิสูจน์สิ่งเหล่านี้ออกมาได้ก็ถือว่าดีมากแล้ว","ยิ่งไปกว่านั้น หินปีศาจที่โยลันด์ยึดมาได้ ก็มีขนาดเพียงครึ่งกำปั้นเท่านั้น แถมยังถูกแบ่งออกเป็นยี่สิบกว่าส่วนอีกต่างหาก","จอมเวทผู้ยิ่งใหญ่ที่อยู่ในเมืองหลวงต่างก็ได้รับตัวอย่างกันไปคนละส่วน ส่วนที่เหลือก็ถูกนำไปแจกจ่ายให้กับพ่อมดเต็มตัวหลายคนที่มีพรสวรรค์ด้านการวิจัยสูง","ตัวอย่างแต่ละชิ้นมีขนาดไม่เท่ากัน โดยพื้นฐานแล้วยิ่งมีระดับสูงเท่าไหร่ ก็ยิ่งได้รับความคาดหวังมากเท่านั้น ทำให้ได้รับตัวอย่างชิ้นใหญ่ขึ้นตามไปด้วย อย่างเช่นชิ้นที่ลินน์ได้รับ ก็มีขนาดพอๆ กับที่สมาชิกระดับสภาหลายคนได้รับ ส่วนชิ้นที่พวกพ่อมดเต็มตัวได้รับนั้น มีขนาดเท่ากับนิ้วก้อยเท่านั้นเอง..."]},{"n":403,"t":"นี่ท่านกะจะลอบสังหารคนทั้งสภาเลยหรือไง!","c":["การอธิบายทฤษฎีของเหล่าพ่อมดเต็มตัวกินเวลาไปประมาณสี่ชั่วโมง และการประชุมสัมมนาก็ลากยาวมาตั้งแต่ช่วงพลบค่ำจนกระทั่งถึงตอนดึก","หลังจากผ่านไปหนึ่งสัปดาห์ ด้วยความพยายามร่วมกันของพ่อมดหลายร้อยคน ข้อมูลพื้นฐานอย่างมวล ความหนาแน่น และมวลโมเลกุลของธาตุทั้งสี่สิบเก้าชนิดก็ถูกวิจัยออกมาได้สำเร็จ และเรื่องที่ว่าควรใช้ข้อมูลใดเป็นมาตรฐานในการจัดเรียงตารางธาตุ ก็กลายเป็นหัวข้อที่มีการพูดคุยถกเถียงกันอย่างดุเดือด","การถกเถียงกันอย่างดุเดือดตลอดหลายชั่วโมง ไม่ได้ทำให้คนที่อยู่ในห้องประชุมรู้สึกเหนื่อยล้าเลยแม้แต่น้อย เพราะทุกคนต่างก็รู้ดีว่า การสัมมนาที่แท้จริงเพิ่งจะเริ่มต้นขึ้นเท่านั้น","ณ ที่นั่งของจอมเวทผู้ยิ่งใหญ่ ราฟาเอลก็ค่อยๆ ลุกขึ้นยืนและเดินไปที่หน้าเวที ก่อนจะเอ่ยปากพูดขึ้นว่า","“สิ่งที่ข้าจะพูดต่อไปนี้ คือเรื่องคุณสมบัติบางอย่างของธาตุชนิดใหม่ที่ชื่อว่าเรเดียม ขอให้ทุกท่านช่วยปิดหลอดไฟเวทมนตร์สักครู่...”","แฮร์รอฟพยักหน้ารับ เขาดีดนิ้วเพื่อตัดกระแสไฟฟ้าที่ส่งไปยังหลอดไฟบนเพดานของห้องประชุม หลังจากที่หลอดไฟกระพริบสองสามครั้ง รอบด้านก็มืดสนิทลงในทันที","แต่ภายในห้องประชุมที่มืดมิด กลับมีเพียงจุดเดียวที่เป็นข้อยกเว้น นั่นก็คือเสื้อผ้าของราฟาเอล ซึ่งกำลังเปล่งแสงเรืองรองสีเหลืองอมเขียวออกมา ดูโดดเด่นและตระการตาเป็นอย่างมาก...","“ไม่มีความผันผวนของพลังเวทเลยงั้นหรือ?”","แฮร์รอฟพูดด้วยความประหลาดใจ แน่นอนว่าเขาสามารถสัมผัสได้ว่าแสงเรืองรองอันแปลกประหลาดนี้ ไม่ได้เกิดจากเวทมนตร์บทไหนเลย","“ใช่แล้ว นี่คือพลังของธาตุเรเดียม!”","ราฟาเอลพูดด้วยความภาคภูมิใจ","“ในระหว่างการวิจัย ข้าพบว่าเมื่อธาตุชนิดใหม่นี้ไปผสมเข้ากับสารบางชนิด มันจะสามารถเปล่งแสงเรืองรองอันนุ่มนวลออกมาได้เอง และข้าก็ลองทิ้งมันไว้สองคืนเต็มๆ แต่แสงของมันก็ไม่ได้มีทีท่าว่าจะอ่อนลงเลย...”","“จากข้อสันนิษฐานของข้า ข้าคิดว่าแสงแบบนี้อาจจะคงอยู่ได้นานหลายปี หรืออาจจะนานนับสิบปีเลยทีเดียว!”","ราฟาเอลพูดอย่างมั่นใจ","“แล้วพลังในการเปล่งแสงของมันมาจากไหนล่ะ?”","วิกตอริโอที่อยู่ข้างๆ ครุ่นคิดและเอ่ยถามขึ้น","การที่มันสามารถเปล่งแสงออกมาได้เองโดยไม่ต้องอาศัยพลังเวท ปรากฏการณ์นี้ทำให้เหล่าพ่อมดในห้องประชุมต่างก็รู้สึกประหลาดใจเป็นอย่างมาก","ส่วนพ่อมดที่เชี่ยวชาญด้านการเล่นแร่แปรธาตุและสมุนไพรศาสตร์ ก็นึกไปถึงพืชเวทมนตร์ชนิดหนึ่ง นั่นคือ เห็ดเรืองแสง!","พืชเวทมนตร์ชนิดนี้มักจะเติบโตอยู่ในใต้ดินที่มืดมิด และมีความสามารถในการเรืองแสงด้วยตัวเองเช่นกัน แต่สิ่งที่ต่างออกไปก็คือ มันจำเป็นต้องใช้พลังเวทในการหล่อเลี้ยง หากขาดพลังเวทไป มันก็จะเหี่ยวเฉาลงอย่างรวดเร็ว","“ข้าสันนิษฐานว่า นี่น่าจะเกิดจากการที่ธาตุเรเดียมทำปฏิกิริยากับสารประกอบบางอย่าง เหมือนกับปฏิกิริยาการเผาไหม้ที่ทำให้เกิดแสงและความร้อน เพียงแต่กระบวนการของปฏิกิริยานี้มันช้ามาก แสงที่ออกมาจึงดูนุ่มนวล และมันก็อาจจะต้องใช้เวลานานมากๆ กว่าพลังงานของมันจะหมดไป...”","ราฟาเอลเอ่ยข้อสันนิษฐานของตัวเอง","เนื่องจากเวลาสามวันมันสั้นเกินไป เขาจึงยังไม่มีเวลาทำการทดลองที่เจาะลึกกว่านี้ จึงทำได้เพียงคาดเดาจากทฤษฎีเวทมนตร์ที่อยู่ในหัวเท่านั้น","แม้ว่าความเข้าใจของเขาเกี่ยวกับธาตุเรเดียมจะยังไม่ลึกซึ้งนัก แต่เพียงแค่คุณสมบัติในการเรืองแสงด้วยตัวเองเพียงอย่างเดียว ก็มากพอที่จะตอกย้ำถึงความสำคัญของธาตุชนิดใหม่นี้ได้แล้ว","เพราะของสิ่งนี้จะช่วยให้พวกเขาสามารถมองเห็นในความมืดได้โดยไม่ต้องสูญเสียพลังเวทใดๆ หากนำไปใช้ในการต่อสู้ตอนกลางคืน มันจะต้องให้ผลลัพธ์ที่ดีเยี่ยมอย่างแน่นอน","ราฟาเอลถึงกับคิดไปว่า ในอนาคตอาจจะมีการนำสารเคลือบเรืองแสงชนิดนี้ ไปทาไว้บนกำแพงของเมืองหลวงให้ทั่ว ถ้าเป็นแบบนั้น ปัญหาเรื่องแสงสว่างในตอนกลางคืนก็จะถูกแก้ไปโดยปริยาย แถมยังไม่ต้องเปลืองไฟฟ้าเลยแม้แต่น้อย","ราฟาเอลพูดคุยอย่างออกรสออกชาติเกี่ยวกับขอบเขตการนำธาตุเรเดียมไปใช้ประโยชน์ ในขณะที่ลินน์ซึ่งนั่งอยู่ด้านล่างเวทีนั้นมีสีหน้าแปลกประหลาด เขาเหมือนมีอะไรอยากจะพูด แต่ก็ต้องกลืนคำพูดนั้นลงไป เพราะตอนนี้ยังไม่ถึงตาที่เขาจะได้พูด","สุดท้าย ราฟาเอลก็หยิบแก้วน้ำที่ทาด้วยสารเคลือบเรืองแสงออกมาวางไว้ตรงหน้าของทุกคน","แก้วน้ำใสแจ๋วที่เปล่งแสงเรืองรองชวนให้หลงใหล สามารถดึงดูดสายตาของพ่อมดทุกคนได้ในพริบตา พวกแม่มดที่อยู่ด้านล่างเวทีต่างพากันร้องอุทานด้วยความชื่นชม","“สวยจังเลย...ช่างเป็นแสงที่งดงามอะไรขนาดนี้!”","เมื่อเห็นว่าผลงานวิจัยของตัวเองได้รับการยอมรับจากทุกคน มุมปากของราฟาเอลก็ยกยิ้มขึ้นมาอย่างห้ามไม่อยู่ ดูเหมือนว่าการตัดสินใจก่อนหน้านี้ของเขาจะถูกต้องจริงๆ ในเมื่อธาตุยูเรเนียมมีอันตรายและความไม่แน่นอนสูงมาก งั้นเขาก็สู้ทุ่มเทเวลาไปกับการวิจัยธาตุเรเดียม ซึ่งมีปริมาณน้อยกว่าในหินปีศาจยังจะดีเสียกว่า!","ด้วยแนวคิดนี้ ราฟาเอลจึงได้เลียนแบบวิธีการแยกธาตุด้วยแม่เหล็กไฟฟ้าของลินน์ เพื่อสกัดธาตุเรเดียมออกมาจากหินปีศาจก้อนเล็กๆ","เดิมทีเขาเพียงแค่ต้องการทดสอบคุณสมบัติต่างๆ ของธาตุเรเดียมเท่านั้น แต่เขากลับค้นพบโดยบังเอิญในระหว่างการทดลองว่า เมื่อของสิ่งนี้ไปรวมเข้ากับสารบางชนิด มันจะเกิดคุณสมบัติที่ทำให้เปล่งแสงออกมาอย่างต่อเนื่อง ซึ่งสารเคลือบที่ทำจากมัน แทบจะสามารถนำไปใช้เคลือบลงบนสิ่งของใดๆ ก็ได้ เพื่อให้พวกมันเปล่งแสงสีเหลืองอมเขียวออกมาในตอนกลางคืน ราวกับว่าสิ่งของเหล่านั้นถูกร่ายเวทมนตร์เอาไว้","นี่คือโอกาสในการทำเงินก้อนโตอย่างไม่ต้องสงสัย ราฟาเอลรู้ดีว่าของแปลกใหม่แบบนี้ จะต้องสร้างกระแสความนิยมในหมู่พ่อมดได้อย่างแน่นอน...","การวิจัยเกี่ยวกับคุณสมบัติการเรืองแสงของธาตุเรเดียม ได้รับเสียงตอบรับอย่างดีเยี่ยมจากบรรดาพ่อมด ราฟาเอลได้มอบเครื่องแก้วบางส่วนที่ทาด้วยสารเคลือบเรืองแสงให้กับสมาชิกระดับสภาและเหล่าจอมเวทผู้ยิ่งใหญ่ ก่อนจะเดินกลับไปนั่งที่ของตัวเองด้วยความภาคภูมิใจ","จากนั้น แอนโธนี่ก็ลุกขึ้นยืน และเริ่มอธิบายทฤษฎีโครงสร้างอะตอมแบบ ‘ลูกพลัม’ ของเขาบ้าง","มันเป็นที่แน่ชัดแล้วว่า ภายในของธาตุนั้นมีประจุไฟฟ้าอยู่ นี่คือสิ่งที่ไม่อาจปฏิเสธได้ และการทดลองแยกธาตุด้วยแม่เหล็กไฟฟ้าที่ลินน์เป็นผู้นำเมื่อหลายวันก่อน ซึ่งได้เปลี่ยนธาตุใหม่ทั้งสองชนิดจากสถานะแก๊สให้กลายเป็นพลาสมาแบบพิเศษ ก็เป็นหลักฐานชิ้นสำคัญที่พิสูจน์เรื่องนี้ได้เป็นอย่างดี!","ดังนั้น หลังจากที่ ‘วารสารเวทมนตร์รายวัน’ ได้ตีพิมพ์ข่าวนี้ออกไป มอเตอร์ไฟฟ้าทั้งหมดที่สถาบันวิจัยการเล่นแร่แปรธาตุสร้างขึ้น ก็ถูกขายจนหมดเกลี้ยงในพริบตา!","นี่คือยุคที่ทุกคนต่างก็แย่งชิงกันเป็นราชันแห่งสายฟ้า เพราะหากทฤษฎีของแอนโธนี่ถูกต้อง สายฟ้าก็จะเป็นรากฐานของเวทมนตร์ทั้งปวง และพ่อมดทุกคนที่ต้องการค้นหาสัจธรรม ก็จำเป็นที่จะต้องเชี่ยวชาญมันให้ได้!","หลังจากที่จอมเวทผู้ยิ่งใหญ่กว่าสิบคนได้ผลัดกันอธิบายผลงานวิจัยของตัวเองจนจบ ในที่สุดก็ถึงตาของลินน์ ซึ่งเขาถูกจัดให้อยู่เป็นคนสุดท้าย","แต่นี่ไม่ใช่การละเลยแต่อย่างใด แต่เป็นเพราะพวกเขาให้ความสำคัญกับเขามากต่างหาก!","อย่างไรก็ตาม แฮร์รอฟที่เป็นคนจัดลำดับ ก็อดไม่ได้ที่จะมองไปที่ลินน์ด้วยสายตาที่เต็มไปด้วยความรู้สึกผิด เพราะดูเหมือนว่าจอมเวทผู้ยิ่งใหญ่คนอื่นๆ จะพูดในสิ่งที่ควรพูดไปจนหมดแล้ว!","แต่โชคดีที่สถานการณ์น่าอึดอัดที่คาดคิดไว้ไม่ได้เกิดขึ้น ลินน์ลุกขึ้นยืนด้วยสีหน้าเรียบเฉย และภายใต้สายตาที่จับจ้องของทุกคน เขาก็เอ่ยปากพูดขึ้นว่า","“จากการวิจัยและการทดลองของข้า ธาตุชนิดใหม่ทั้งสองอย่างยูเรเนียมและเรเดียม ไม่เหมือนกับธาตุใดๆ ที่พวกเราเคยสัมผัสมาก่อน พวกมันมีคุณสมบัติร่วมกันอย่างหนึ่ง ซึ่งควรจะถูกจัดอยู่ในหมวดหมู่ที่แยกออกมาจากธาตุโลหะและอโลหะ”","“โดยข้าจะเรียกพวกมันว่า ธาตุกัมมันตรังสี!”","คำพูดของลินน์ทำเอาทุกคนถึงกับตกตะลึง และทำให้บรรดาพ่อมดที่เริ่มง่วงเหงาหาวนอนจากการประชุมที่ลากยาวมาครึ่งค่อนวัน กลับมาตื่นตัวอีกครั้ง","“ธาตุกัมมันตรังสีงั้นหรือ?”","วิกตอริโอขมวดคิ้ว และครุ่นคิดถึงชื่อเรียกนี้อย่างละเอียด โดยให้ความสำคัญกับงานวิจัยของลินน์เป็นอย่างมาก","เพราะสิ่งนี้น่าจะเกี่ยวข้องกับเหตุผลที่ว่า ทำไมพวกเขาถึงไม่สามารถควบคุมหรือวิเคราะห์ธาตุพิเศษทั้งสองชนิดนี้ได้อย่างอิสระ ซึ่งนี่ก็เป็นปัญหาที่คอยรบกวนจิตใจของพ่อมดทุกคนมาตั้งแต่ตอนที่ได้รับหินปีศาจมาแล้ว"]},{"n":404,"t":"รังสีนี่มันของบำรุงชั้นดีชัดๆ...","c":["ท่ามกลางเสียงพูดคุยกระซิบกระซาบของเหล่าพ่อมด ลินน์ก็เอ่ยปากอธิบายขึ้นว่า","“โดยปกติแล้ว โครงสร้างภายในของธาตุจะมีความเสถียรและไม่เปลี่ยนแปลงไปโดยง่าย แต่ธาตุชนิดใหม่อย่างยูเรเนียมและเรเดียมนั้นต่างออกไป โดยโครงสร้างของพวกมันมักจะอยู่ในสภาวะที่ไม่เสถียรอยู่เสมอ...”","“ท่านหมายความว่า เปลือกนอกของธาตุส่วนหนึ่งไม่สามารถรองรับพลังงานภายในเอาไว้ได้ ดังนั้น พลังแห่งสายฟ้าที่ประกอบขึ้นเป็นธาตุ จึงปลดปล่อยออกมาสู่ภายนอกอย่างต่อเนื่องงั้นหรือ?”","หลังจากที่ลินน์อธิบาย วิกตอริโอก็เข้าใจในแบบของตัวเองได้อย่างรวดเร็ว","เพราะถ้าเป็นแบบนั้น มันก็จะสามารถอธิบายเรื่องการเรืองแสงของธาตุเรเดียมได้","“ไม่ ไม่ใช่แค่อิเล็กตรอน ข้าเชื่อว่าภายในของธาตุนอกจากจะมีอิเล็กตรอนอยู่แล้ว ก็ยังมีสสารอื่นๆ อยู่อีก!”","ลินน์พูดด้วยน้ำเสียงหนักแน่นเด็ดขาด","“ท่านปรมาจารย์ลินน์ หรือว่าท่านจะผ่าธาตุพวกนั้น และมองเห็นความลับที่ซ่อนอยู่ข้างในแล้วงั้นหรือ?”","เมื่อเห็นว่าลินน์พูดด้วยความมั่นใจขนาดนั้น พ่อมดชายคนหนึ่งที่อยู่ด้านล่างเวทีก็ถามขึ้นด้วยความตื่นเต้นทันที","“น่าเสียดาย แม้ว่าข้าจะคิดหาวิธีแยกธาตุออกมาได้แล้ว แต่ก็ยังมีปัญหาสำคัญอีกข้อหนึ่งที่ยังแก้ไม่ตก”","ลินน์ส่ายหน้าและตอบอย่างจนใจ","แฮร์รอฟรู้สึกอยากรู้มากว่าวิธีแยกธาตุที่ลินน์พูดถึงนั้นคืออะไร เพราะในช่วงหลายวันที่ผ่านมา พวกเขาก็ได้ทำการทดลองไปหลายวิธี ทั้งการใช้อุณหภูมิสูง ไฟฟ้าช็อต ไปจนถึงการใช้แรงดันสูง แทบจะงัดเอาทุกวิถีทางออกมาใช้หมดแล้ว แต่ตัวธาตุก็ยังคงแข็งแกร่งมาก และไม่มีทีท่าว่าจะถูกทำลายลงเลยแม้แต่น้อย","แต่ยังไม่ทันที่แฮร์รอฟจะได้เอ่ยถาม ลินน์ก็พูดขึ้นมาเสียก่อน","“ลำดับต่อไป ข้าจะแสดงให้พวกท่านเห็นอย่างชัดเจนเลยว่า ธาตุเรเดียมปลดปล่อยพลังของมันออกมาสู่ภายนอกได้อย่างไร!”","ในระหว่างที่พูด ลินน์ก็ยกมือขึ้นเพื่อสร้างอาณาเขตสุญญากาศ แล้วขับไล่ธาตุชนิดอื่นๆ ที่อยู่ในพื้นที่นั้นออกไปจนหมด โดยเหลือไว้เพียงไอน้ำจำนวนมาก จากนั้นก็เปิดขวดเหล้ากลั่นที่มีความเข้มข้นสูงออก","กลิ่นหอมของเหล้าโชยไปทั่วห้องประชุม ซานเชซสูดจมูกดมกลิ่น และกลืนน้ำลายลงคออย่างอดไม่ได้","“ท่านปรมาจารย์ลินน์กำลังจะทำอะไรน่ะ? หรือว่าจะให้พวกเราชิมเหล้าเรืองแสงที่ผสมธาตุเรเดียมลงไปงั้นหรือ?”","ราฟาเอลหัวเราะและเอ่ยเดาขึ้นมา","ธาตุคืออะไร?","มันคือแก่นแท้ที่ประกอบขึ้นเป็นสสารทุกชนิดบนโลก และการที่ธาตุเรเดียมชนิดใหม่นี้สามารถปลดปล่อยพลังของตัวเองออกมาสู่ภายนอกได้ นั่นก็หมายความว่ามันคือแก่นแท้ของแก่นแท้ และเป็นพลังต้นกำเนิดของเวทมนตร์ หากได้ดื่มมันเข้าไป บางทีมันอาจจะช่วยบำรุงร่างกายได้ดีเยี่ยมเลยก็ได้...","ในขณะที่ราฟาเอลกำลังคิดว่า ควรจะกลับไปทำเหล้าธาตุเรเดียมสักขวดดีไหมนั้น ลินน์ก็ได้สลายเหล้ากลั่นความเข้มข้นสูงให้ลอยระเหยขึ้นไปในอากาศ และผสานเข้ากับไอน้ำที่หนาแน่น","จากนั้น ลินน์ก็นำลูกกลมตะกั่วออกมาอย่างระมัดระวัง ซึ่งมันถูกสร้างขึ้นมาเพื่อกักเก็บรังสีโดยเฉพาะ เมื่อชั้นป้องกันนี้ถูกเปิดออก ธาตุเรเดียมที่อยู่ข้างในก็ลอยขึ้นไปบนอากาศ และแผ่กัมมันตภาพรังสีอันรุนแรงออกมาทันที!","อนุภาคพลังงานสูงที่มองไม่เห็นด้วยตาเปล่า ได้แผ่กระจายออกมาจากเรเดียมอย่างต่อเนื่อง และพุ่งทะลุเข้าไปในไอน้ำที่หนาแน่น ทำให้เกิดเป็นเส้นทางหมอกที่มองเห็นได้อย่างชัดเจน...ราวกับว่ามีดอกไม้หนามบานสะพรั่งอยู่ในอากาศ!","“นี่มัน...”","วิกตอริโอจ้องมองภาพเบื้องหน้าตาไม่กระพริบ บรรดาพ่อมดที่อยู่ในห้องประชุมต่างก็พากันลุกขึ้นยืนด้วยความตกตะลึง และมองดูสายหมอกที่พวยพุ่งออกมาอย่างไม่หยุดหย่อนด้วยความตกใจและสงสัย","“นี่คือเส้นทางที่อนุภาครังสีพุ่งทะลุผ่านหมอกน้ำไป!”","ลินน์พูดด้วยน้ำเสียงตื่นเต้น","จอมเวทผู้ยิ่งใหญ่ที่นั่งอยู่แถวหน้าอดไม่ได้ที่จะเดินขึ้นไปบนเวที โดยใช้มือสัมผัสกับเส้นทางหมอกที่พุ่งผ่านอาณาเขตนั้นอย่างรวดเร็ว นี่คือพลังที่ทะลักออกมาจากภายในของธาตุ!","และนี่ก็คือพลังต้นกำเนิดของเวทมนตร์ในระดับที่ลึกซึ้งยิ่งขึ้น!","“ท่านทำได้ยังไงกัน ท่านปรมาจารย์ลินน์? เคล็ดลับก็คือเหล้าพวกนั้นใช่ไหม?”","จอมเวทผู้ยิ่งใหญ่คนหนึ่งถามขึ้นอย่างร้อนรน","พวกเขาไม่สามารถมองเห็น หรือแม้แต่สัมผัสถึงรังสีที่แผ่ออกมาจากธาตุเหล่านี้ได้เลย แต่ตอนนี้มันกลับถูกนำเสนอให้เห็นอย่างชัดเจนในอีกรูปแบบหนึ่ง","“ข้าเรียกมันว่า ห้องหมอก!”","ลินน์ดีดนิ้วหนึ่งครั้ง หมอกที่กระจายตัวอยู่ก็หายวับไปทันที จากนั้นเขาก็ยิ้มและพูดว่า","“พวกท่านรู้ไหมว่าหมอกก่อตัวขึ้นมาได้ยังไง?”","“เพราะอุณหภูมิที่ลดต่ำลง ธาตุน้ำที่กระจายตัวอยู่ในอากาศจึงเกิดการควบแน่น และเปลี่ยนจากสถานะแก๊สเป็นของเหลว...”","ราฟาเอลตอบกลับไปตามสัญชาตญาณ ซึ่งนี่เป็นทฤษฎีที่พ่อมดทุกคนเข้าใจกันดีอยู่แล้ว","“ถูกต้อง!”","ลินน์พยักหน้า","“แต่การก่อตัวของหมอกยังต้องการอีกสิ่งหนึ่ง นั่นก็คือแกนกลางในการควบแน่น พวกมันจะดึงดูดให้ไอน้ำที่กระจายตัวอยู่มารวมตัวกัน...”","การลดอุณหภูมิ (อุณหภูมิและความดันต่ำ), การเพิ่มความชื้น (ไอน้ำที่อิ่มตัว), แกนกลางการควบแน่น...นี่คือสามองค์ประกอบหลักในการเกิดหมอก ยกตัวอย่างเช่น การเกิดหมอกในตอนเช้า ก็เป็นเพราะไอน้ำที่ลอยอยู่ในอากาศได้รับความเย็น และไปสัมผัสเข้ากับฝุ่นละอองจนเกิดการควบแน่น","อย่างไรก็ตาม สิ่งที่สามารถทำหน้าที่เป็นแกนกลางการควบแน่นได้นั้น ไม่ได้มีแค่ฝุ่นละอองเท่านั้น ไอออนที่เกิดจากอนุภาคพลังงานสูงต่างๆ ก็สามารถทำหน้าที่เป็นแกนกลางให้กับไอน้ำได้เช่นกัน ดังนั้น ภายใต้สภาพแวดล้อมที่มีอุณหภูมิต่ำและมีความชื้นสูงในอาณาเขต เมื่ออนุภาคเหล่านี้พุ่งผ่านไป มันจึงเกิดเป็นเส้นทางหมอกสีขาวขึ้นมา!","ส่วนการผสมแอลกอฮอล์ลงไปในไอน้ำ ก็เพื่อให้เส้นทางหมอกปรากฏให้เห็นชัดเจนขึ้น และคงอยู่ได้นานขึ้นด้วย!","“ไม่คิดเลยว่าทฤษฎีมันจะง่ายดายขนาดนี้”","หลังจากได้ฟังคำอธิบายของลินน์ ซานเชซก็อดไม่ได้ที่จะถอนหายใจออกมาด้วยความประทับใจ","แค่เวทควบแน่นหมอกน้ำธรรมดาๆ ลินน์กลับสามารถนำมาประยุกต์ใช้ได้อย่างน่าทึ่ง...","ต้องยอมรับเลยว่า ดาวรุ่งแห่งเวทมนตร์ก็สมกับเป็นดาวรุ่งแห่งเวทมนตร์จริงๆ เพราะทักษะการสังเกตและจินตนาการของเขานั้นยอดเยี่ยมมาก!","เมื่อต้องเผชิญกับคำชื่นชมและคำยกยอจากเหล่าพ่อมดในห้องประชุม ลินน์ก็ตอบรับด้วยท่าทีที่สงบนิ่ง ซึ่งก็ไม่ได้มีอะไรให้น่าตื่นเต้นนัก เพราะนี่มันก็เป็นเพียงแค่ความรู้ที่เขายืมคนอื่นมาใช้เท่านั้น","ผู้ที่คิดค้นห้องหมอกก็คือ ชาร์ลส์ วิลสัน แม้ว่าชื่อเสียงของเขาอาจจะไม่ได้โด่งดังมากนัก และอาจจะเทียบไม่ได้กับยอดอัจฉริยะทางวิทยาศาสตร์อย่าง เทสลา, แมกซ์เวลล์ หรือนิวตัน แต่เขาก็ได้สร้างผลงานเอาไว้มากมายจริงๆ","เขาไม่ได้เพียงแค่คิดค้นอุปกรณ์ตรวจจับรังสีในยุคแรกๆ เท่านั้น แต่เขายังมุ่งมั่นศึกษาเกี่ยวกับสนามไฟฟ้าในชั้นบรรยากาศและการก่อตัวของเมฆฝนฟ้าคะนอง จนได้รับผลลัพธ์ที่ยอดเยี่ยมมาแล้ว เรียกได้ว่านี่คือจุดสูงสุดที่อัจฉริยะทางวิทยาศาสตร์ทั่วไปจะสามารถทำได้ตลอดทั้งชีวิต...","“งานวิจัยของท่านมีความสำคัญมาก ท่านปรมาจารย์ลินน์ บางทีนี่อาจจะเป็นก้าวสำคัญที่จะช่วยให้พวกเราไขความลับในระดับจุลภาคได้!”","วิกตอริโอกล่าวชื่นชมอย่างไม่ปิดบัง จากนั้นเขาก็หันไปปรึกษากับแฮร์รอฟและออโรร่าว่า ควรจะมอบเหรียญตราดาวประกายพฤกษ์ หรือเหรียญตราจันทร์สีเงินให้กับลินน์ดี...","เมื่อเทียบกับราฟาเอลที่ค้นพบเรื่องการเรืองแสงของธาตุเรเดียมและประดิษฐ์สารเคลือบเรืองแสงออกมา ลินน์นั้นก้าวไปไกลกว่าอย่างเห็นได้ชัด เพราะเขาได้เปิดเผยความลับว่าทำไมธาตุชนิดใหม่นี้ถึงสามารถเรืองแสงได้ อีกทั้งเขายังใช้การทดลองห้องหมอก เพื่อพิสูจน์ให้เห็นว่าโครงสร้างของธาตุกัมมันตรังสีนั้นไม่เสถียร และยังมีการปลดปล่อยพลังของตัวเองออกมาสู่ภายนอกอย่างต่อเนื่อง","ด้วยผลงานที่ยิ่งใหญ่ขนาดนี้ เหรียญตราดาวประกายพฤกษ์ก็ดูจะไม่คู่ควรกับเขาอีกต่อไป ดังนั้น หลังจากที่หารือกัน สมาชิกระดับสภาหลายคนก็ตัดสินใจอย่างรวดเร็วว่า จะมอบเหรียญตราจันทร์สีเงินให้กับลินน์...","การที่ลินน์ได้รับเหรียญตราจันทร์สีเงินอีกครั้ง ทำให้เหล่าสมาชิกระดับสภาในห้องประชุมต่างก็รู้สึกอิจฉา แต่ในขณะเดียวกันก็ต้องยอมรับเขาจากใจจริง...","ราฟาเอลแอบรู้สึกโล่งใจที่ตัวเองเป็นคนพูดก่อน ไม่อย่างนั้นเขาคงไม่กล้าเอาผลงานวิจัยของตัวเองออกมาพูดแน่ๆ","เมื่อดูจากการที่ดาวรุ่งแห่งเวทมนตร์ผู้นี้ ศึกษาเกี่ยวกับธาตุเรเดียมได้อย่างทะลุปรุโปร่งขนาดนี้แล้ว เขาก็คงจะค้นพบปรากฏการณ์เรืองแสงของมันแล้วแน่ๆ","แต่เดี๋ยวนะ นี่คือสิ่งที่เรียกว่า ‘พอจะได้อะไรติดไม้ติดมือมาบ้าง’ งั้นหรือ?","เมื่อนึกถึงคำพูดถ่อมตัวของอีกฝ่ายตอนที่เพิ่งเข้ามาในห้องประชุม สีหน้าของราฟาเอลก็ดูแปลกประหลาดขึ้นมาทันที","หากการได้รับเหรียญตราจันทร์สีเงินยังถือเป็นแค่ ‘เรื่องเล็กน้อย’ แล้วอะไรล่ะถึงจะถือว่าเป็นเรื่องใหญ่?","ในขณะที่ราฟาเอลกำลังคิดอยู่นั้น จู่ๆ เสียงของลินน์ก็ดังขึ้น","“โปรดรอก่อนเถิด ท่านสมาชิกระดับสภาทั้งหลาย...”","“มีอะไรหรือ? ท่านปรมาจารย์ลินน์?”","แฮร์รอฟเอ่ยถามด้วยความสงสัย","“มันยังเร็วเกินไปที่จะบอกว่างานวิจัยจบลงแล้ว”","ลินน์ส่ายหน้าและมองไปที่พ่อมดทุกคนที่อยู่ในห้อง","“เรื่องกัมมันตภาพรังสีของธาตุ ข้าเชื่อว่าทุกท่านน่าจะพอมีความเข้าใจกันบ้างแล้ว ข้าขอเรียกสิ่งที่แผ่ออกมาจากภายในของอะตอมนี้ว่า อนุภาคแอลฟา!”","“และการทดลองที่ข้ากำลังจะทำต่อไปนี้ ก็เป็นจริงขึ้นมาได้โดยอาศัยอนุภาคชนิดนี้...”","คำพูดของลินน์ทำเอาแฮร์รอฟและคนอื่นๆ ถึงกับชะงักไป","พวกเขาอุตส่าห์คิดว่าห้องหมอกที่สามารถแสดงให้เห็นรังสีได้อย่างเป็นรูปธรรมนี้ คือผลงานวิจัยของดาวรุ่งแห่งเวทมนตร์ผู้นี้แล้ว แต่คาดไม่ถึงเลยว่ามันจะเป็นแค่บทนำของการทดลองเท่านั้น..."]},{"n":405,"t":"อนุภาคแอลฟาที่มีความเร็ว 20,000 กิโลเมตรต่อวินาที","c":["ภายใต้คำสั่งของลินน์ เอล็อคและคนอื่นๆ ที่รออยู่ด้านล่างเวที ก็รีบนำอุปกรณ์ที่ใช้สำหรับการทดลองในครั้งนี้ขึ้นมาอย่างรวดเร็ว","มันดูเรียบง่ายมาก โดยรวมแล้วมีของอยู่เพียงแค่สามอย่างเท่านั้น!","กล่องตะกั่วขนาดเท่าฝ่ามือหนึ่งใบ และอุปกรณ์ตรวจจับรูปร่างคล้ายวงแหวนอีกหนึ่งชิ้น","และสุดท้ายก็คือ แผ่นทองคำเปลวที่มีความหนาเพียง 0.1 ไมโครเมตร!","เพื่อสร้างของสิ่งนี้ขึ้นมา มันกินเวลาของลินน์ไปถึงหนึ่งวันเต็มๆ หากเขาไม่ได้กลายเป็นจอมเวทผู้ยิ่งใหญ่ การจะสร้างแผ่นทองคำที่มีความละเอียดขนาดนี้ด้วยเทคโนโลยีที่มีอยู่ในปัจจุบัน มันก็คงไม่ต่างอะไรกับเรื่องเพ้อฝัน...","หลังจากที่อุปกรณ์การทดลองถูกเตรียมจนพร้อมแล้ว ลินน์ก็ไม่ได้ลีลาอะไรอีก เขากวาดสายตามองพ่อมดทุกคนในห้องประชุม และพูดขึ้นด้วยน้ำเสียงจริงจังว่า","“ทุกท่าน ข้อสันนิษฐานเกี่ยวกับแบบจำลองอะตอมที่พวกท่านเสนอมาเมื่อครู่นี้ล้วนยอดเยี่ยมมาก แต่สุดท้ายแล้ว ทฤษฎีที่ว่ามานั้นจะสอดคล้องกับความเป็นจริงหรือไม่ มันก็ต้องพิสูจน์ให้เห็นด้วยการทดลอง!”","“นั่นเป็นเรื่องที่แน่นอนอยู่แล้ว!”","แอนโธนี่พยักหน้ารับ","แม้เขาจะมีความมั่นใจในแบบจำลองลูกพลัมของตัวเองมาก แต่เขาก็ต้องยอมรับว่า ข้อสันนิษฐานที่สมาชิกระดับสภาบางคนเสนอมานั้น ก็น่าสนใจไม่แพ้กันเลย","ยกตัวอย่างเช่น จอมเวทผู้ยิ่งใหญ่แห่งเปลวเพลิงอย่างอเดลา นางก็เชื่อว่าอิเล็กตรอนที่อยู่ภายในธาตุ ถูกจัดเรียงแบบสลับขั้วบวกและขั้วลบ ดังนั้น พวกมันจึงสามารถเกาะติดกันได้อย่างแน่นหนา โดยไม่เกิดการผลักกันเองเพราะมีประจุไฟฟ้าเหมือนกัน จนทำให้พวกมันรวมตัวกันเป็นอะตอมที่แข็งแกร่ง","นอกจากนี้ ยังมีทฤษฎีอื่นๆ อีกกว่าสิบรูปแบบที่แตกต่างกันออกไป เช่น แบบจำลองหยดน้ำ, แบบจำลองการกระจายตัวสู่ภายนอก, แบบจำลองธาตุทรงตัน และอื่นๆ ซึ่งแต่ละแบบก็มีความสมเหตุสมผลในระดับหนึ่ง...","แต่ปัญหาที่ทำให้พ่อมดทุกคนที่เสนอแบบจำลองอะตอมต้องปวดหัวมากที่สุด ก็คือเรื่องที่ว่าจะตรวจสอบทฤษฎีเหล่านี้ได้อย่างไร","เพราะตัวธาตุเองนั้นมีขนาดเล็กเกินไป และลองมานับครั้งไม่ถ้วน แต่ก็ไม่สามารถทุบทำลายมันได้เลย แม้ว่าจะมีพ่อมดที่นำทฤษฎีของเลนส์เว้าและเลนส์นูนมาประยุกต์ใช้เพื่อสร้างเวทมนตร์ขยายภาพระดับสูงขึ้นมา แต่พวกเขาก็ยังมองไม่เห็นอะไรอยู่ดี ดังนั้น ทุกคนจึงรู้สึกอยากรู้มากว่า ดาวรุ่งแห่งเวทมนตร์ผู้นี้จะใช้วิธีไหนในการพิสูจน์เรื่องนี้","ลินน์ไม่ได้ทำให้ทุกคนต้องรอนาน เขาเริ่มอธิบายเรื่องนี้ทันที","อนุภาคแอลฟานั้นถูกปล่อยออกมาจากภายในของธาตุเรเดียม นั่นหมายความว่ามันมีขนาดเล็กกว่าธาตุหลายชนิดมาก แถมยังมีความเร็วที่สูงมากอีกต่างหาก และที่สำคัญที่สุดก็คือ มันมีพลังมากพอที่จะหลุดพ้นจากการควบคุมของธาตุต้นกำเนิดได้","“จากการคำนวณของข้า ความเร็วของอนุภาคแอลฟาน่าจะอยู่ที่ประมาณสองหมื่นกิโลเมตรต่อวินาที...”","ลินน์เอ่ยปากอธิบาย","“สองหมื่นกิโลเมตร...”","ซานเชซถึงกับเดาะลิ้น เขาตกใจมากเมื่อได้ยินตัวเลขที่ดูเกินจริงนี้","แม้พวกเขาจะเคยคำนวณความเร็วแสงที่ดูเกินจริงกว่านี้มาแล้ว แต่ความเร็วในระดับหมื่นกิโลเมตรต่อวินาทีแบบนี้ มันก็ยังคงเป็นสิ่งที่พวกเขายากจะเอื้อมถึงอยู่ดี...","แอนโธนี่เองก็รู้สึกประหลาดใจมากเช่นกัน เมื่อนึกถึงร่องรอยของสายหมอกภายใน [ห้องหมอก] เมื่อครู่นี้ ที่พวยพุ่งออกมาในชั่วพริบตาเดียว เร็วเสียจนจอมเวทผู้ยิ่งใหญ่อย่างพวกเขาตั้งตัวไม่ทัน นั่นก็มากพอที่จะพิสูจน์ได้แล้วว่า ลินน์ไม่ได้พูดจาโอ้อวดเกินจริงแต่อย่างใด!","“ดังนั้น ท่านก็เลยเตรียมที่จะใช้อนุภาคชนิดใหม่นี้ ไปพุ่งชนและทำลายเปลือกนอกของธาตุอย่างนั้นหรือ?”","แฮร์รอฟคิดเชื่อมโยงได้อย่างรวดเร็ว","โดยทั่วไปแล้ว ยิ่งวัตถุมีความเร็วมากเท่าไหร่ พลังทำลายของมันก็จะยิ่งสูงขึ้นตามไปด้วย ข้อได้เปรียบของอนุภาคแอลฟาก็คือมันมีขนาดเล็กมาก บางทีมันอาจจะสามารถพุ่งชนเปลือกนอกของธาตุ และทำให้ธาตุแตกออกได้","“ไม่ ข้าคิดว่าอะตอมนั้นไม่ได้มีเปลือกนอก และทุกสิ่งทุกอย่างของมันก็ล้วนเปิดเผยออกสู่ภายนอก...”","ลินน์ส่ายหน้าและพูดด้วยน้ำเสียงจริงจัง","“เรื่องแบบนั้นจะเป็นไปได้ยังไง?”","วิกตอริโอขมวดคิ้วและพูดแย้งขึ้นมาทันที","“ธาตุทุกชนิดล้วนมีการเคลื่อนไหวอยู่ตลอดเวลา หากไม่มีเปลือกนอกคอยปกป้อง ผ่านไปหลายพันหลายหมื่นปี สิ่งที่อยู่ข้างในจะไม่ถูกเหวี่ยงออกไปจนหมดเลยหรือไง...”","พ่อมดที่อยู่ด้านล่างเวทีก็เริ่มพูดคุยและถกเถียงกันเช่นกัน เพราะคำพูดของลินน์มันฟังดูเกินจริงเกินไป หากไม่ใช่เพราะดาวรุ่งแห่งเวทมนตร์ผู้นี้ ได้พิสูจน์ให้เห็นถึงพรสวรรค์ในการวิจัยเวทมนตร์ของเขามาครั้งแล้วครั้งเล่าล่ะก็ ป่านนี้ก็คงจะมีคนลุกขึ้นมาโต้แย้งเขาไปนานแล้ว","และในจินตนาการของพวกเขา ธาตุน่าจะมีลักษณะคล้ายกับทรงกลม ที่ถูกห่อหุ้มด้วยเปลือกนอกอันแข็งแกร่งทนทาน ด้วยวิธีนี้เท่านั้น มันจึงจะสามารถปกป้องสสารที่อยู่ภายในไม่ให้ได้รับความเสียหายเมื่อเวลาผ่านไปได้","เมื่อต้องเผชิญกับสายตาที่เต็มไปด้วยความสงสัยของทุกคน ลินน์ก็ยิ้มและถามกลับไปว่า","“ธาตุประกอบ (โมเลกุล) ก็ไม่มีเปลือกนอกเหมือนกันไม่ใช่หรือ แล้วพวกมันสามารถคงอยู่ได้ยาวนานเหมือนกันไม่ใช่หรือไง?”","ตามทฤษฎีที่มีอยู่ในดินแดนพ่อมด เหตุผลที่ธาตุประกอบเหล่านั้นสามารถเกาะติดกันได้อย่างแน่นหนา ก็เป็นเพราะพวกมันถูกเชื่อมต่อกันด้วยสิ่งที่เรียกว่า ‘พันธะธาตุ’ ซึ่งทำให้พวกมันไม่สามารถแยกออกจากกันได้ง่ายๆ หากจะพูดให้เข้าใจง่ายๆ มันก็คือพันธะเคมีนั่นแหละ เพียงแต่ในโลกทั้งสองใบนี้มีชื่อเรียกที่ต่างกันเท่านั้น","เมื่อได้ยินเช่นนั้น วิกตอริโอและคนอื่นๆ ก็ชะงักไปครู่หนึ่ง ก่อนจะเริ่มครุ่นคิดว่า ภายในของธาตุอาจจะมีพลังงานที่คล้ายคลึงกัน ที่คอยพันธนาการสสารภายในเอาไว้อย่างแน่นหนาหรือไม่","ลินน์ไม่ได้อธิบายทฤษฎียืดยาวอะไรอีก เพราะคำพูดที่ปราศจากหลักฐานย่อมไม่มีน้ำหนัก และความจริงก็คือข้อพิสูจน์ที่ดีที่สุด","ในระหว่างที่พวกเขาพูดคุยกัน พวกเอล็อคก็ได้ติดตั้งแท่นทดลองเสร็จเรียบร้อยแล้ว ซึ่งจริงๆ แล้วมันก็แค่การใช้เวทมนตร์ทำให้แผ่นทองคำเปลวลอยอยู่ตรงกลางอุปกรณ์ตรวจจับเท่านั้น","จากนั้น เขาก็หันกล่องตะกั่วไปทางแผ่นทองคำเปลว โดยเจาะรูเล็กๆ ไว้ที่ด้านหน้า และใส่ธาตุเรเดียมจำนวนหนึ่งเข้าไปข้างใน เนื่องจากตะกั่วสามารถป้องกันรังสีได้อย่างมีประสิทธิภาพ อนุภาคแอลฟาจึงพุ่งออกมาจากรูเล็กๆ ของกล่องตะกั่วได้เท่านั้น จนกลายเป็นรังสีอนุภาคพลังงานสูงที่พุ่งเข้าใส่แผ่นทองคำเปลวอย่างต่อเนื่อง","ส่วนรอบๆ แผ่นทองคำเปลว ก็มีอุปกรณ์ตรวจจับรูปร่างคล้ายวงแหวนวางอยู่ ซึ่งมันถูกทาด้วยสารเคลือบเรืองแสง ทันทีที่มันสัมผัสกับอนุภาคแอลฟา มันก็จะเปล่งแสงออกมา ซึ่งสิ่งนี้จะช่วยให้พวกเขาสามารถระบุทิศทางการเคลื่อนที่ของอนุภาคได้","ส่วนเรื่องที่ว่าทำไมถึงต้องใช้ทองคำ นั่นก็เป็นเพราะมันมีความสามารถในการยืดขยายสูงมาก โดยทองคำบริสุทธิ์เพียง 1 กรัม สามารถดึงให้เป็นเส้นลวดที่ยาวได้ถึงหลายกิโลเมตร ซึ่งจะช่วยให้มั่นใจได้ว่า รังสีที่พุ่งผ่านธาตุในแนวเส้นตรงนั้นจะมีปริมาณที่จำกัด และช่วยลดการรบกวนให้เหลือน้อยที่สุด...","หลังจากอธิบายขั้นตอนการทดลองคร่าวๆ แล้ว ลินน์ก็เปิดรูเล็กๆ บนกล่องตะกั่ว และรังสีที่มองไม่เห็นด้วยตาเปล่าก็พุ่งเข้าใส่แผ่นทองคำเปลวทันที","ไม่ว่าจะเป็นอนุภาคแอลฟาหรืออะตอมของทองคำ ต่างก็มีขนาดเล็กมากจนไม่สามารถมองเห็นได้ด้วยตาเปล่า แต่บรรดาพ่อมดก็ย่อมมีวิธีในแบบของพ่อมด โดยเฉพาะความสามารถในการรับรู้ที่แข็งแกร่งของจอมเวทผู้ยิ่งใหญ่ ซึ่งทำให้พวกเขาสามารถสัมผัสได้ถึงความเปลี่ยนแปลงอันละเอียดอ่อนในระดับอะตอมได้","หลังจากที่พวกเขากางอาณาเขตเวทมนตร์ออก แผ่นทองคำเปลวทั้งแผ่นก็เปลี่ยนไปเป็นอีกรูปแบบหนึ่งในสายตาของพวกเขา โดยมีธาตุทองคำแต่ละตัวถูกจัดเรียงอย่างเป็นระเบียบ ราวกับกำแพงอันแข็งแกร่งที่ขวางกั้นอยู่เบื้องหน้า","แต่กำแพงนี้กลับไม่ได้แข็งแกร่งอย่างที่พวกเขาคิด เพราะในไม่ช้า จุดแสงเล็กๆ ก็เริ่มปรากฏขึ้นบนอุปกรณ์ตรวจจับที่อยู่ด้านหลัง ซึ่งนั่นหมายความว่า อนุภาคแอลฟาได้ทะลุผ่านแผ่นทองคำเปลว และไปสัมผัสกับสารเรืองแสงที่อยู่ด้านหลังแล้ว","“มันทะลุผ่านไปได้โดยตรงเลยงั้นหรือเนี่ย!”","แฮร์รอฟพึมพำเสียงเบา ตำแหน่งของจุดแสงที่สว่างขึ้น กับทิศทางของรูเล็กๆ บนกล่องตะกั่วนั้นอยู่ตรงกันพอดี โดยไม่มีการเบี่ยงเบนไปเลยแม้แต่น้อย","แอนโธนี่ที่สังเกตเห็นเรื่องนี้เช่นกันก็อดไม่ได้ที่จะขมวดคิ้ว เพราะนี่มันต่างไปจากสิ่งที่เขาคาดคิดไว้","อย่าลืมนะว่า อนุภาคแอลฟาก็มีการตอบสนองต่อสนามแม่เหล็กเช่นกัน ซึ่งนั่นก็หมายความว่า หากมันไปสัมผัสเข้ากับอิเล็กตรอนที่มีประจุบวกและประจุลบ มันก็ย่อมต้องถูกรบกวนอย่างแน่นอน"]},{"n":406,"t":"สรรพสิ่งล้วนมีกฎเกณฑ์การขับเคลื่อนในตัวมันเอง ไม่ว่าจะเป็นดวงดาวที่ยิ่งใหญ่ หรือธาตุที่เล็กจิ๋วก็ไม่มีข้อยกเว้น!","c":["แอนโธนี่ขบคิดเท่าไหร่ก็คิดไม่ออก แต่ความจริงก็ปรากฏอยู่ตรงหน้า เขาจึงทำได้เพียงคาดเดาว่า อนุภาคชนิดนี้มีความเร็วที่สูงมากจนสามารถทะลวงผ่านธาตุได้ในชั่วพริบตา ดังนั้น มันจึงสามารถพุ่งผ่านภายในของธาตุที่เต็มไปด้วยอิเล็กตรอนที่มีประจุบวกและประจุลบ โดยไม่ได้รับผลกระทบใดๆ เลย","หรือไม่อย่างนั้น อนุภาคแอลฟาเหล่านี้ก็อาจจะโชคดีมากๆ ที่พุ่งผ่านช่องว่างอันละเอียดอ่อนระหว่างอะตอมกับอะตอมไปได้พอดี","แอนโธนี่คาดเดาไปต่างๆ นานา แต่แล้วในวินาทีต่อมา จินตนาการเหล่านั้นก็มลายหายไปจนหมดสิ้น เพราะมีจุดเล็กๆ ที่แทบจะมองไม่เห็นจุดหนึ่ง สว่างขึ้นที่ด้านบนของหน้าจอตรวจจับแบบวงแหวน ซึ่งนั่นก็หมายความว่า มีอนุภาคแอลฟาบางส่วนที่ถูกรบกวนและเบี่ยงเบนออกไปจากเส้นทางเดิม เหมือนอย่างที่เขาได้คาดการณ์ไว้ก่อนหน้านี้...","“ดูเหมือนว่าแบบจำลองธาตุแบบกระจายตัวของข้า จะเป็นสิ่งที่ถูกต้องนะ”","จอมเวทผู้ยิ่งใหญ่คนหนึ่งพูดขึ้นมาด้วยความภาคภูมิใจ","เนื่องจากอิเล็กตรอนที่มีประจุบวกและประจุลบจะดึงดูดเข้าหากัน ในขณะที่อิเล็กตรอนที่มีประจุเหมือนกันจะผลักกันเอง เขาจึงคาดเดาว่า อิเล็กตรอนที่อยู่ภายในของธาตุ ไม่น่าจะรวมตัวกันอย่างหนาแน่น แต่จะเป็นการจับคู่กันของประจุบวกและประจุลบ และกระจายตัวกันอยู่อย่างกระจัดกระจายมากกว่า","สมาชิกระดับสภาหลายคนที่อยู่ในห้องต่างก็พยักหน้าเห็นด้วย เพราะในพื้นที่ที่ตรงกับรูของกล่องตะกั่วนั้น ได้เกิดจุดแสงที่หนาแน่นและสว่างไสวขึ้นมาแล้ว มีเพียงอนุภาคแอลฟาส่วนน้อยเท่านั้นที่ถูกผลักออกไปยังทิศทางอื่น ซึ่งนี่ก็เป็นข้อพิสูจน์ที่ชัดเจนแล้วว่า ภายในของธาตุนั้นว่างเปล่าจริงๆ","แต่ในไม่ช้าพวกเขาก็พบว่า แบบจำลองนี้ก็ไม่ได้ถูกต้องไปเสียทั้งหมด เพราะมีอนุภาคแอลฟาบางส่วนที่หลังจากพุ่งชนกับธาตุทองคำแล้ว พวกมันกลับสะท้อนกลับมา 180 องศา หรือเกือบจะเรียกได้ว่าสะท้อนกลับมาตามเส้นทางเดิมเลยทีเดียว ยิ่งไปกว่านั้น อนุภาคที่เบี่ยงเบนทิศทางเหล่านี้ยังไปรวมตัวกันอยู่บริเวณใจกลางของอะตอม และมีการกระจายตัวค่อนข้างเป็นระเบียบ ซึ่งทฤษฎีแบบจำลองธาตุกว่าสิบรูปแบบที่มีอยู่ในปัจจุบัน ไม่สามารถอธิบายปรากฏการณ์ประหลาดนี้ได้เลย","บนใบหน้าของลินน์เผยให้เห็นถึงความเข้าใจอย่างถ่องแท้ เพราะผลการทดลองนั้นไม่ได้เหนือไปจากความคาดหมายของเขาเลย ซึ่งนั่นก็หมายความว่า โครงสร้างอะตอมของโลกทั้งสองใบนั้นเหมือนกัน และไม่ได้มีการเปลี่ยนแปลงใดๆ ที่ไม่รู้จักเกิดขึ้นจากผลกระทบของพลังเวท","วิกตอริโอที่นั่งอยู่ตรงที่นั่งในห้องประชุมมีสีหน้าเคร่งเครียด เขาพยายามสร้างแบบจำลองที่สอดคล้องกับรูปแบบการกระจายตัวของสารเรืองแสงขึ้นมาในหัว และใช้เวลาเพียงแค่หนึ่งหรือสองวินาที เขาก็สามารถคำนวณมุมที่อนุภาคแต่ละตัวเบี่ยงเบนออกไปได้สำเร็จ!","“ตรงกลางของธาตุ น่าจะมีแกนกลางที่มีขนาดเล็กมากแต่กลับมีพลังมหาศาลอยู่ ดูเหมือนว่าจะมีแค่อนุภาคแอลฟาที่พุ่งชนแกนกลางนี้เท่านั้นที่จะสะท้อนกลับมา ส่วนอนุภาคอื่นๆ จะสามารถทะลุผ่านไปได้อย่างราบรื่น”","จู่ๆ วิกตอริโอก็เอ่ยปากพูดขึ้น","เมื่อได้ยินเช่นนั้น แอนโธนี่และคนอื่นๆ ก็ตระหนักขึ้นมาได้ทันที เพราะมีเพียงวิธีนี้เท่านั้นที่จะอธิบายได้ว่า ทำไมการกระจายตัวของอนุภาคที่เบี่ยงเบนทิศทาง ถึงได้ดูแปลกประหลาดขนาดนี้","“ถูกต้อง ข้าเรียกมันว่า นิวเคลียสของอะตอม!”","ในตอนนั้นเอง เสียงของลินน์ก็ดังเข้าหูของทุกคน","“นิวเคลียสของอะตอม? แกนกลางของอะตอมงั้นหรือ?”","เหล่าสมาชิกระดับสภาต่างก็พึมพำชื่อนี้ซ้ำๆ","“และนี่ก็คือแบบจำลองธาตุที่ข้าสร้างขึ้นมา!”","ลินน์ยกมือขึ้น ลูกบอลพลังเวทหลายลูกก็ปรากฏขึ้นบนฝ่ามือของเขา โดยลูกบอลพลังเวทที่มีขนาดใหญ่ที่สุดลอยอยู่ตรงกลาง ในขณะที่ลูกบอลพลังเวทลูกอื่นๆ ลอยวนรอบๆ มันด้วยความเร็วสูง","“นี่มันเหมือนกับภาพจำลองของระบบดาวเคราะห์เลยไม่ใช่หรือไง?”","ออโรร่าพูดด้วยความประหลาดใจ","นิวเคลียสของอะตอมนั้นเปรียบเสมือนดวงอาทิตย์ ส่วนอิเล็กตรอนที่หมุนรอบตัวมันก็เปรียบเสมือนดาวเคราะห์ต่างๆ ยิ่งไปกว่านั้น ตามที่ลินน์ได้แสดงให้เห็น ‘อิเล็กตรอน’ เหล่านี้ยังสามารถหมุนรอบตัวเองได้อีกด้วย นี่มันไม่ต่างอะไรกับระบบดาวเคราะห์ขนาดเล็กเลย!","“ถูกต้อง!”","ลินน์พยักหน้า เนื่องจากไม่มีทฤษฎีควอนตัมเป็นพื้นฐาน เขาจึงไม่ได้รีบร้อนที่จะนำเสนอทฤษฎีกลุ่มหมอกอิเล็กตรอนที่สอดคล้องกับความเป็นจริงมากกว่าออกมา เพราะของพรรค์นั้นมันยากเกินกว่าจะเข้าใจได้ เขาจึงทำได้เพียงถอยออกมาหนึ่งก้าว และอธิบายเรื่องนี้ด้วยแบบจำลองวงโคจรของดาวเคราะห์ที่เข้าใจง่ายกว่าแทน","“การที่ดาวฤกษ์สามารถยึดเหนี่ยวเส้นทางของดวงดาวดวงอื่นๆ เอาไว้ได้ เป็นเพราะแรงโน้มถ่วงที่เกิดจากมวลอันมหาศาลของมัน แล้วอะตอมล่ะ ใช้อะไรในการยึดเหนี่ยวอิเล็กตรอนพวกนี้เอาไว้? หรือว่าจะเป็นแรงโน้มถ่วงเหมือนกัน?”","แฮร์รอฟถามขึ้นด้วยความสงสัย เพราะจากทิศทางของอนุภาคแอลฟาที่ถูกผลักออกไป มันดูเหมือนว่าจะเกิดจากแรงผลักมากกว่า","“สสารที่อยู่ภายในนิวเคลียสของอะตอมมีประจุบวก ส่วนอิเล็กตรอนที่โคจรรอบๆ มีประจุลบ ดังนั้น ทั้งสองจึงดึงดูดซึ่งกันและกัน เพียงแต่แรงดึงดูดนี้จะเกิดความสมดุลกับความเร็วของตัวอิเล็กตรอนเอง ซึ่งมันก็ค่อนข้างคล้ายคลึงกับแรงโน้มถ่วง...”","ลินน์พยายามอธิบายให้กระชับและเข้าใจง่ายที่สุด","อันที่จริงแล้ว การใช้ทฤษฎีกลุ่มหมอกความน่าจะเป็น จะสามารถอธิบายปรากฏการณ์นี้ได้ง่ายกว่า แต่ถ้าจะทำแบบนั้น เขาคงต้องอธิบายทฤษฎีควอนตัมให้พวกพ่อมดเข้าใจเสียก่อน","“อย่างไรก็ตาม ความสมดุลนี้สามารถถูกทำลายลงได้ หากพวกมันดูดซับพลังงานเข้าไปมากพอ โดยอิเล็กตรอนที่โคจรอยู่รอบๆ เหล่านี้ ก็จะกระโดดไปสู่วงโคจรอื่นๆ ได้...”","ลินน์อธิบายเพิ่มเติม ซึ่งนี่ก็เป็นหลักการเดียวกับแรงโน้มถ่วง หากดวงดาวที่อยู่ในสภาวะสมดุลถูกเร่งความเร็วอย่างกะทันหัน มันก็จะหลุดพ้นออกจากวงโคจรเดิม","เนื่องจากการโปรโมตอย่างต่อเนื่องของวารสารเวทมนตร์รายวัน กฎแรงโน้มถ่วงสากลจึงแพร่หลายในหมู่พ่อมดเป็นอย่างมาก แม้แต่พ่อมดที่ไม่ค่อยสนใจเวทมนตร์ประเภทสนามพลัง ก็ยังมีความรู้ความเข้าใจเกี่ยวกับกฎทั้งสามข้อที่ก่อให้เกิดวงโคจรของดวงดาวอยู่บ้าง ดังนั้น พวกเขาจึงสามารถทำความเข้าใจเรื่องนี้ได้ไม่ยากนัก","“นี่คือสิ่งที่เรียกว่า ‘ระดับพลังงาน’ ในเวทมนตร์เลเซอร์อย่างนั้นหรือ?”","ออโรร่าพึมพำกับตัวเอง ก่อนหน้านี้ตอนที่ลินน์กำลังปรับปรุงเวทมนตร์เลเซอร์ เขาก็ได้พูดถึงแนวคิดนี้ขึ้นมา","ในตอนนั้น นางก็รู้สึกสนใจปรากฏการณ์ระดับพลังงานนี้มาก แต่เนื่องจากเวลามันสั้นเกินไป นางจึงยังไม่ทันได้ทำความเข้าใจถึงหลักการของมัน แต่ตอนนี้ หลังจากที่ลินน์อธิบายโครงสร้างภายในของธาตุให้ฟัง นางก็เข้าใจเรื่องนี้ได้อย่างแจ่มแจ้งทันที ระดับพลังงานทั้งห้า ก็คือวงโคจรทั้งห้าของอิเล็กตรอนที่หมุนรอบนิวเคลียสนั่นเอง ยิ่งดูดซับพลังงานเข้าไปมากเท่าไหร่ อิเล็กตรอนก็จะยิ่งกระโดดไปสู่วงโคจรชั้นนอกที่ไกลออกไปมากขึ้นเท่านั้น","และความแข็งแกร่งของเวทมนตร์เลเซอร์ ก็เป็นเพราะมันพุ่งเป้าไปที่แก่นแท้ของธาตุโดยตรง มิน่าล่ะ พลังของมันถึงได้รุนแรงจนสามารถตัดเรือรบใบที่ใหญ่โต ให้ขาดสะบั้นราวกับตัดกระดาษได้เลย","“ทำไมถึงมีแค่ห้าระดับพลังงานล่ะ? แล้วถ้าอิเล็กตรอนพวกนี้ดูดซับพลังงานเข้าไปเกินขีดจำกัดล่ะ จะเกิดอะไรขึ้น?”","จู่ๆ ออโรร่าก็นึกถึงปัญหานี้ขึ้นมา จึงได้เอ่ยถามด้วยความสงสัย","“ถ้าเป็นแบบนั้น มันก็จะหลุดพ้นจากการยึดเหนี่ยวของนิวเคลียสอะตอม และกลายเป็นอิเล็กตรอนอิสระ ซึ่งนี่ก็คือสถานะพลาสมาของธาตุยังไงล่ะ!”","ลินน์อธิบายพร้อมกับรอยยิ้ม","“เปรียบเทียบง่ายๆ ก็เหมือนกับดาวเคราะห์ที่จู่ๆ ก็มีความเร็วเพิ่มขึ้นอย่างผิดปกติ จนสามารถดิ้นหลุดจากแรงโน้มถ่วงของดาวฤกษ์ แล้วพุ่งทะยานออกไปในอวกาศอันกว้างใหญ่ได้นั่นแหละ”","“อ๋อ อย่างนี้นี่เอง!”","ออโรร่าถึงกับตาสว่าง","แบบจำลองธาตุวงโคจรดาวเคราะห์ชุดนี้ สามารถอธิบายการก่อตัวของสถานะพลาสมา, หลักการของเวทมนตร์เลเซอร์, และปัญหาการกระเจิงของอนุภาคแอลฟาได้อย่างสมบูรณ์แบบเกือบจะไร้ที่ติ","และที่สำคัญที่สุดคือ มันทั้งดูงดงาม เป็นระเบียบเรียบร้อย และสอดคล้องกับสิ่งที่พ่อมดทุกคนจินตนาการเอาไว้เกี่ยวกับธาตุอย่างสมบูรณ์แบบ!","“ช่างเป็นข้อสันนิษฐานที่รัดกุมและยอดเยี่ยมจริงๆ!”","แฮร์รอฟเอ่ยปากชื่นชม ก่อนจะถอนหายใจและพูดต่อ","“ไม่คิดเลยว่า โครงสร้างภายในของธาตุจะแสดงให้เห็นถึงภาพจำลองของดวงดาวได้...”","สรรพสิ่งล้วนมีกฎเกณฑ์การขับเคลื่อนในตัวมันเอง ไม่ว่าจะเป็นดวงดาวที่ยิ่งใหญ่ หรือภายในของธาตุที่เล็กจิ๋วก็ไม่มีข้อยกเว้น ความคล้ายคลึงนี้อาจจะเป็นสิ่งสะท้อนให้เห็นถึงกฎเกณฑ์การขับเคลื่อนของโลกใบนี้ก็ได้!","แอนโธนี่, อเดลา และพ่อมดคนอื่นๆ ที่เคยนำเสนอแบบจำลองธาตุมาก่อนหน้านี้ ต่างก็มองดูแบบจำลองธาตุรูปวงโคจรของดวงดาวที่อยู่ในมือลินน์ พร้อมกับถอนหายใจออกมาอย่างต่อเนื่อง เมื่อนำมาเปรียบเทียบกันแล้ว แบบจำลองธาตุอันหยาบกระด้างที่พวกเขาสร้างขึ้นมา แทบจะเอามาเทียบไม่ได้เลยแม้แต่น้อย..."]},{"n":407,"t":"ข้ามีเวทมนตร์ที่สามารถสังหารทวยเทพได้!","c":["แบบจำลองธาตุแบบวงโคจรของลินน์ เอาชนะใจเหล่าพ่อมดที่อยู่ในห้องประชุมได้อย่างรวดเร็ว ไม่ต้องพูดถึงเรื่องอื่นเลย แค่ความสมบูรณ์แบบของทฤษฎี มันก็ทิ้งห่างข้อสันนิษฐานอื่นๆ ไปไกลลิบลับแล้ว!","นอกจากนี้ การที่วงโคจรของระบบดวงดาวที่ยิ่งใหญ่ที่สุด มีความคล้ายคลึงกับโครงสร้างของอะตอมที่เล็กที่สุดอย่างน่าอัศจรรย์ใจ มันก็ถือเป็นความโรแมนติกอันเป็นเอกลักษณ์ของศาสตร์แห่งเวทมนตร์เช่นกัน อเดลายังถึงกับจินตนาการไปไกลว่า บางทีระบบดวงดาวของพวกเขาอาจจะเป็น ‘อะตอมของจักรวาล’ และ ‘อะตอมของจักรวาล’ จำนวนนับไม่ถ้วน ก็รวมตัวกันจนกลายเป็นจักรวาลทั้งหมดที่พวกเขามองเห็นได้!","“ถ้าอย่างนั้น สสารที่สำคัญที่สุดในการประกอบขึ้นเป็นธาตุ ก็คือแกนกลางของมันน่ะสิ!”","แฮร์รอฟนึกเชื่อมโยงไปถึงผลการทดลองการกระเจิงของอนุภาคเมื่อครู่นี้ และตระหนักถึงจุดนี้ได้อย่างรวดเร็ว","อิเล็กตรอนที่หมุนรอบนิวเคลียสมีจำนวนน้อยมาก แถมยังมีความแข็งแกร่งต่ำ จึงไม่สามารถหยุดยั้งการทะลวงผ่านของอนุภาคแอลฟาได้เลย แม้แต่จะสร้างผลกระทบเพียงเล็กน้อยก็ยังทำได้ยาก แต่นิวเคลียสของอะตอมนั้นต่างออกไป แรงแม่เหล็กไฟฟ้าอันทรงพลังของมัน สามารถหักเหเส้นทางของอนุภาคที่พุ่งมาด้วยความเร็วสองหมื่นกิโลเมตรต่อวินาที หรือแม้กระทั่งสะท้อนมันกลับไปทางเดิมได้เลย","“แล้วสสารที่ประกอบขึ้นเป็นแกนกลางของธาตุล่ะ มันคืออะไรกันแน่?”","จู่ๆ แฮร์รอฟก็นึกถึงปัญหานี้ขึ้นมาได้","“หรือว่ามันก็คืออนุภาคแอลฟาพวกนี้?”","วิกตอริโอลองคาดเดาดู เนื่องจากอนุภาคประหลาดชนิดนี้ ถูกปลดปล่อยออกมาจากธาตุเรเดียม ในเมื่อมันไม่ได้เป็นแค่อิเล็กตรอนธรรมดาๆ งั้นมันก็คงจะมีแต่มันกระเด็นหลุดออกมาจากนิวเคลียสของอะตอมเท่านั้นแหละ","“ก็ถือว่าใช่...”","ลินน์พยักหน้าและไม่ได้พูดปฏิเสธ เพราะคำพูดนั้นก็ไม่ได้ถือว่าผิดอะไร","อนุภาคแอลฟาคือผลผลิตจากการสลายตัวของนิวเคลียสธาตุเรเดียม ซึ่งประกอบไปด้วยนิวตรอนสองตัวและโปรตอนสองตัว โดยมีโครงสร้างเหมือนกับนิวเคลียสของธาตุฮีเลียมที่มีมวลเบากว่า ซึ่งนั่นก็หมายความว่า ในทุกๆ วินาที ธาตุเรเดียมกำลังขับไล่มวลที่เทียบเท่ากับนิวเคลียสของอะตอมฮีเลียมออกมาอย่างต่อเนื่อง!","อย่างไรก็ตาม สิ่งที่ถูกปลดปล่อยออกมาจากธาตุเรเดียมนั้น นอกจากอนุภาคแอลฟาแล้ว ก็ยังมีอนุภาคบีตาอยู่อีกด้วย เพียงแต่ ‘ผลงานการวิจัย’ ที่เขานำออกมาในครั้งนี้ มันมีมากเกินไปแล้ว ด้วยตัวเขาเพียงคนเดียว เขาสามารถดึงให้พวกพ่อมดก้าวข้ามจากโลกมหภาคเข้าสู่โลกจุลภาคได้สำเร็จ และช่วยผลักดันความก้าวหน้าของศาสตร์แห่งเวทมนตร์ไปข้างหน้าได้นับร้อยปีเลยทีเดียว!","หากคนๆ เดียวเอาแต่พูดอยู่ฝ่ายเดียว และกอบโกยเอาเกียรติยศความดีความชอบทั้งหมดไปไว้ที่ตัวเองคนเดียว มันก็อาจจะเป็นการทำลายความกระตือรือร้นในการวิจัยของพ่อมดคนอื่นๆ ได้...","แม้ลินน์คิดเช่นนั้นในใจ แต่ปากก็ยังคงพูดต่อไป","“ดังนั้น เป้าหมายในตอนนี้ของพวกเราจึงเหลือเพียงแค่อย่างเดียวเท่านั้น นั่นก็คือการแยกนิวเคลียสของอะตอมออกมา เพื่อให้เข้าใจถึงแก่นแท้ที่แท้จริงของเวทมนตร์!”","“แต่จะทำแบบนั้นได้ยังไงกันล่ะ?”","วิกตอริโอขมวดคิ้วแน่น อย่างน้อยพวกเขาก็ยังสามารถรับรู้ถึงธาตุได้ และสามารถใช้อนุภาคแอลฟาที่มีขนาดเล็กกว่าพุ่งทะลวงมันได้ แต่นิวเคลียสของอะตอมนั้นมีขนาดเล็กกว่าตัวธาตุมาก แถมพลังของมันก็ยังสามารถเบี่ยงเบนและสะท้อนอนุภาคที่พุ่งมาด้วยความเร็วสองหมื่นกิโลเมตรต่อวินาทีได้อย่างง่ายดาย ความแข็งแกร่งระดับนี้ มันช่างน่ากลัวจริงๆ!","ออโรร่าและแฮร์รอฟเองก็ตกอยู่ในภวังค์ความคิดเช่นกัน ความลับของธาตุอยู่ใกล้แค่เอื้อม ขอเพียงแค่ผลักประตูบานสุดท้ายที่อยู่ตรงหน้านี้ออกไปได้เท่านั้น!","แต่ประตูบานนี้กลับทำขึ้นมาจากเหล็กกล้า ไม่สิ ควรจะบอกว่ามันแข็งแกร่งยิ่งกว่ากระดองหลังของโกเลมหิน (สิ่งของที่แข็งแกร่งที่สุดเท่าที่โลกเวทมนตร์รู้จัก) เสียอีก!","โชคดีที่ลินน์ไม่ได้คาดหวังให้บรรดาพ่อมด คิดหาวิธีแก้ปัญหาได้ภายในเวลาเพียงไม่กี่วัน เขาจึงพูดขึ้นอย่างตรงไปตรงมาว่า","“อันที่จริง ข้ามีแผนการอยู่ในใจแล้วล่ะ แต่ยังมีปัญหาสำคัญอีกข้อหนึ่งที่ยังแก้ไม่ตก...”","“ด้วยการพึ่งพาทฤษฎีนี้ ข้าได้พัฒนาเวทมนตร์รูปแบบใหม่ที่ทรงพลังยิ่งกว่าเดิมขึ้นมา โดยข้าเชื่อว่า มันคือกุญแจสำคัญที่จะทำให้พวกเราเอาชนะศาสนจักรได้!”","ลินน์พูดด้วยน้ำเสียงหนักแน่นเด็ดขาด เสียงอันดังก้องของเขาดังกังวานไปทั่วห้องประชุม","คำพูดเหล่านี้เปรียบเสมือนก้อนหินก้อนใหญ่ที่ถูกโยนลงไปในทะเลสาบ มันทำให้เกิดระลอกคลื่นแห่งความปั่นป่วนขึ้นมาทันที ราฟาเอลและคนอื่นๆ ต่างก็ลุกพรวดขึ้นมาจากที่นั่งด้วยความตื่นเต้น และจ้องมองไปที่ลินน์ตาไม่กระพริบ","การค้นหาความหวังที่จะเอาชนะศาสนจักรจากภายในของธาตุ คือเส้นทางที่เหล่าพ่อมดระดับตำนานของ ‘สมาคมเวทมนตร์เร้นลับ’ ชี้แนะให้กับพวกเขา แต่ในช่วงที่ผ่านมา พ่อมดหลายคนกลับเริ่มตั้งข้อสงสัยว่า การวิจัยอย่างไร้จุดหมายเช่นนี้ มันเป็นสิ่งที่ถูกต้องจริงๆ หรือ?","ก่อนที่ศาสนจักรจะบุกโจมตีครั้งใหญ่ พวกเขาจะสามารถค้นพบพลังที่จะเอาชนะเทพเจ้านั่น จากภายในของธาตุได้จริงๆ หรือ?","เพราะเวลาที่เหลืออยู่ของพวกเขามันช่างสั้นนัก ในขณะที่ศัตรูกลับแข็งแกร่งจนน่าเหลือเชื่อ!","จนมีบางคนที่มองโลกในแง่ร้าย และเชื่อว่าพ่อมดระดับตำนานของ ‘สมาคมเวทมนตร์เร้นลับ’ มั่นใจว่าพวกเขาจะไม่มีทางเอาชนะศาสนจักรได้ จึงได้หาข้ออ้างมาหลอกลวงพวกเขา เพื่อที่จะได้ไม่ต้องลงมือเอง","แฮร์รอฟและวิกตอริโอที่เคยเผชิญหน้ากับ ‘เอลา’ มาแล้ว ในเวลานี้ต่างก็รู้สึกตกตะลึงจนพูดไม่ออก เพราะพวกเขานั้นรู้ซึ้งถึงความน่ากลัวของ ‘เอลา’ เป็นอย่างดี แม้แต่เวทมนตร์ระดับตำนาน อีกฝ่ายก็แค่ขยับนิ้วนิดเดียว ก็สามารถทำลายมันทิ้งได้อย่างง่ายดาย!","แต่ลินน์กลับมีความมั่นใจมากพอที่จะพูดว่า เขาสามารถเอาชนะศาสนจักรได้!","ถ้าเป็นคนอื่นพูด แฮร์รอฟคงคิดว่าอีกฝ่ายกำลังโอ้อวดเกินจริง แต่สำหรับลินน์แล้วมันต่างออกไป เพราะการที่เขาสร้างปาฏิหาริย์ครั้งแล้วครั้งเล่านี่แหละ ถึงทำให้เขาได้รับการขนานนามว่าดาวรุ่งแห่งเวทมนตร์!","“เวทมนตร์นั่นคืออะไรกันแน่ ปรมาจารย์ลินน์?”","วิกตอริโอเอ่ยถามด้วยความตื่นเต้น จนลืมไปเลยว่าการถามถึงหลักการของเวทมนตร์ชนิดใหม่ เป็นข้อห้ามร้ายแรงในหมู่พ่อมด","“ข้าบอกได้แค่ว่า นั่นแหละคือพลังที่แท้จริงของธาตุ!”","ลินน์ส่ายหน้าและพูดทิ้งท้ายไว้ให้สงสัย","แม้ว่าพ่อมดที่อยู่ที่นี่ ล้วนเป็นยอดฝีมือที่ได้รับการยอมรับจากสภา และได้สร้างผลงานอันยิ่งใหญ่เอาไว้ในศึกปกป้องเมืองหลวง ซึ่งโอกาสที่พวกเขาจะทรยศนั้นมีน้อยมาก แต่ตราบใดที่มันยังคงมีความเป็นไปได้ เขาก็ไม่อาจลดความระมัดระวังลงได้","“พลังที่แท้จริงของธาตุงั้นหรือ?”","แฮร์รอฟครุ่นคิดว่า เวทมนตร์แบบไหนกันนะที่คู่ควรกับคำเรียกขานนี้","หรือว่าพลังของมันจะเหนือกว่าเวทมนตร์ระดับตำนานเสียอีก?","เมื่อออโรร่าเห็นว่าลินน์ไม่มีความคิดที่จะเปิดเผยเรื่องนี้ต่อหน้าทุกคน นางก็พูดขึ้นอย่างจนใจว่า","“ถ้าอย่างนั้น เจ้าก็บอกมาตรงๆ เถอะว่าปัญหาที่ว่านั่นคืออะไร ปัญหาแบบไหนกันแน่ที่แม้แต่ดาวรุ่งแห่งเวทมนตร์อย่างเจ้าก็ยังแก้ไม่ตก”","“ข้าต้องการรวบรวมพลังของสภา และสติปัญญาของทุกท่าน เพื่อช่วยกันแก้ปัญหาเรื่องหนึ่งให้สำเร็จ!”","ลินน์พูดด้วยน้ำเสียงจริงจัง","เขามีวิธีแยกยูเรเนียม-235 ความเข้มข้นสูงแล้ว ส่วนเรื่องวัตถุดิบสำหรับทำนิวเคลียร์ ก็แค่ต้องรอให้คนที่ไปสำรวจเหมืองแร่กลับมาเท่านั้น ตอนนี้สิ่งที่ขาดไปมีเพียงอย่างเดียว นั่นก็คือแหล่งกำเนิดนิวตรอนที่สามารถควบคุมได้ ซึ่งมันก็คือวิธีการปลดปล่อยนิวตรอนออกมานั่นเอง!","สิ่งนี้สามารถทำความเข้าใจง่ายๆ ว่าเป็นเหมือนเครื่องจุดระเบิดนิวเคลียร์ แม้ว่าหากไม่มีมัน ระเบิดก็ยังสามารถทำงานได้ แต่มันจะระเบิดเมื่อไหร่ และจะระเบิดยังไงนั้น เป็นสิ่งที่ไม่สามารถควบคุมได้เลย!","ซึ่งเห็นได้ชัดว่า นี่ไม่ใช่สิ่งที่ลินน์ต้องการ!","โดยทั่วไปแล้ว วิธีการสร้างแหล่งกำเนิดนิวตรอนนั้นจะมีอยู่ด้วยกัน 3 วิธี...","วิธีแรกก็คือแหล่งกำเนิดนิวตรอนแบบไอโซโทปกัมมันตรังสี หลักการของมันคือการใช้รังสีพลังงานสูงที่ถูกปล่อยออกมาในขณะที่ธาตุกัมมันตรังสีเกิดการสลายตัว ไปยิงใส่สสารเป้าหมายบางชนิด เพื่อให้เกิดปฏิกิริยานิวเคลียร์ และปลดปล่อยนิวตรอนออกมา","ยกตัวอย่างเช่น การใช้อนุภาคแอลฟายิงใส่ธาตุเบริลเลียม","ธาตุหายากชนิดนี้ เมื่อถูกอนุภาคและรังสีชนิดต่างๆ พุ่งชนหรือสาดส่อง มันก็จะสร้างนิวตรอนขึ้นมา ซึ่งถือเป็นเป้าหมายที่ดีมาก","แต่ในเมื่อมันได้ชื่อว่าเป็นธาตุหายาก ก็เห็นได้ชัดว่ามันไม่ใช่สิ่งที่จะหาพบได้ง่ายๆ อย่างน้อยที่สุด ในตอนนี้เขาก็ยังไม่เห็นแม้แต่เงาของมันเลย","อันที่จริง การที่เขาสามารถค้นพบแร่ยูเรเนียมได้ ก็นับว่าเป็นโชคดีอย่างมากแล้ว!","ส่วนโอกาสที่เทพเจ้าแห่งโชคชะตาจะเข้าข้างเขาเป็นครั้งที่สองนั้น มันมีน้อยมากซะจนแทบจะเป็นไปไม่ได้เลย..."]},{"n":408,"t":"แหล่งกำเนิดนิวตรอนกับรังสีอันน่าสะพรึงกลัว!","c":["วิธีที่สองคือแหล่งกำเนิดนิวตรอนแบบเครื่องปฏิกรณ์ ซึ่งก็ตรงตามชื่อของมันเลย นั่นก็คือการใช้เครื่องปฏิกรณ์นิวเคลียร์ฟิชชัน เพื่อสร้างนิวตรอนจำนวนมหาศาลขึ้นมา","แต่ถ้าตอนนี้เขาสามารถสร้างเครื่องปฏิกรณ์นิวเคลียร์ขึ้นมาได้ล่ะก็ เขาก็คงไม่ต้องมานั่งกลุ้มใจเรื่องวิธีการ ‘จุดระเบิด’ นิวเคลียร์แล้ว!","ดังนั้น วิธีนี้จึงถูกปัดตกไป!","ส่วนวิธีที่สาม คือแหล่งกำเนิดนิวตรอนแบบเครื่องเร่งอนุภาค ซึ่งเป็นการใช้เครื่องเร่งอนุภาคที่มีประจุชนิดต่างๆ เพื่อเร่งความเร็วของโปรตอนหรือดิวเทอรอน (นิวเคลียสของดิวเทอเรียม) ให้ไปพุ่งชนกับนิวเคลียสเป้าหมาย และสร้างนิวตรอนขึ้นมา ข้อดีของวิธีนี้ก็คือ นิวตรอนที่ได้จะมีความเข้มข้นมากกว่าแหล่งกำเนิดนิวตรอนแบบไอโซโทปกัมมันตรังสีมาก แถมยังสามารถผลิตนิวตรอนพลังงานเดี่ยวในระดับพลังงานที่กว้างมากได้อีกด้วย","พูดง่ายๆ ก็คือ หลักการของวิธีเหล่านี้ล้วนเหมือนกันหมด นั่นก็คือการใช้อนุภาคหรือรังสีไปพุ่งชนธาตุที่เป็นเป้าหมาย เพื่อกระแทกเอานิวตรอนที่อยู่ข้างในออกมา!","ใช่แล้ว มัน ‘ง่าย’ ขนาดนั้นเลย ไม่อย่างนั้นคงไม่มีใครพูดหรอกว่า ความก้าวหน้าของอาวุธมนุษย์ ก็คือการค้นหาวิธีที่จะขว้าง ‘หิน’ ให้เร็วและแม่นยำยิ่งขึ้นนั่นแหละ เพียงแต่ธาตุที่เหมาะสมจะนำมาทำเป็นเป้าหมายนั้น มีอยู่ไม่มากนัก","หลังจากที่ลินน์ศึกษาข้อมูลอย่างละเอียด เขาก็คิดวิธีแก้ปัญหาที่ค่อนข้างซับซ้อนขึ้นมาได้วิธีหนึ่ง","นั่นก็คือการใช้อนุภาคแอลฟายิงใส่นิวเคลียสของไนโตรเจนเพื่อสร้างโปรตอนขึ้นมาก่อน จากนั้นก็ใช้โปรตอนพลังงานสูงพุ่งชนเป้าหมายที่เป็นโลหะหนัก เพื่อให้ได้นิวตรอนออกมา!","ด้วยวิธีนี้ จำนวนธาตุที่สามารถนำมาทำเป็นเป้าหมายได้ ก็จะเพิ่มขึ้นมาอย่างมหาศาลในพริบตา ไม่ว่าจะเป็นทองคำ, ทังสเตน, แทนทาลัม, โมลิบดีนัม หรือธาตุอื่นๆ ก็ล้วนสามารถนำมาเป็นเป้าหมายได้ทั้งสิ้น","ปัญหาเดียวก็คือ มันจะทำให้กระบวนการทั้งหมดซับซ้อนและยุ่งยากมาก เพราะพวกเขาจะต้องสร้างโปรตอนจำนวนมากขึ้นมาก่อน จากนั้นก็ใช้สนามแม่เหล็กอันทรงพลังเพื่อเร่งความเร็วของพวกมัน แล้วค่อยนำไปพุ่งชนเป้าหมายที่เป็นโลหะหนักเพื่อสร้างนิวตรอน ก่อนจะนำไปสู่การจุดระเบิดนิวเคลียร์ในท้ายที่สุด!","ปัญหาที่ตามมาก็คือ เขาจะออกแบบเวทมนตร์ระเบิดนิวเคลียร์อันซับซ้อนนี้ ให้สามารถทำงานให้เสร็จสิ้นได้ภายในเวลาไม่ถึง 10 วินาที ได้อย่างไร","ในช่วงหลายวันที่ผ่านมา ปัญหานี้ทำเอาเขาคิดจนหัวแทบระเบิด...","หลังจากที่ลินน์คิดทบทวนดูแล้ว เขาก็ตัดสินใจที่จะโยนปัญหาที่ยากลำบากนี้ไปให้เหล่าพ่อมดในสภา เพราะหลายหัวย่อมดีกว่าหัวเดียว","แม้แฮร์รอฟและคนอื่นๆ อาจจะสู้เขาไม่ได้ในเรื่องการวิจัยทางวิทยาศาสตร์ แต่พวกเขาก็มีประสบการณ์ในการพัฒนาเวทมนตร์มาอย่างโชกโชน ดังนั้น พวกเขาอาจจะสามารถค้นหาวิธีแก้ปัญหาจากมุมมองของเวทมนตร์ได้","ด้วยเหตุนี้ ลินน์จึงเริ่มแจกจ่าย ‘ภารกิจ’ ให้กับแต่ละคน","ออโรร่ารับหน้าที่ทดลองใช้อนุภาคแอลฟาพุ่งชนนิวเคลียสของไนโตรเจนเพื่อสร้างโปรตอน ส่วนวิกตอริโอ, แอนโธนี่ และจอมเวทผู้ยิ่งใหญ่ที่เรียนรู้เวทมนตร์สายฟ้าอีกสองสามคน ให้ไปวิจัยเรื่องเครื่องเร่งอนุภาค ในขณะที่ตัวเขาและแฮร์รอฟ จะเป็นคนจัดการเรื่องแหล่งกำเนิดนิวตรอนเอง!","สำหรับพ่อมดเต็มตัวคนอื่นๆ เขาสั่งให้ทุกคนไปตามหาธาตุดิวเทอเรียมให้หมด!","ดิวเทอเรียมคือไอโซโทปของไฮโดรเจน หรือที่รู้จักกันในชื่อ ไฮโดรเจนหนัก ซึ่งมันเป็นสิ่งสำคัญที่สุดในการอัปเกรดระเบิดปรมาณูให้กลายเป็นระเบิดไฮโดรเจน!","ในชาติก่อนของเขา สิ่งนี้สามารถพบได้ทั้งในน้ำทะเลและน้ำจืดทั่วไป เพียงแต่มันมีปริมาณน้อยมาก โดยมีสัดส่วนเพียงแค่ 0.015% บนโลกเท่านั้น","ภายใต้การจัดการของลินน์ พ่อมดแทบทุกคนต่างก็มีงานทำ และพวกเขาก็ทุ่มเทแรงกายแรงใจทั้งหมดให้กับการสำรวจโลกจุลภาคอย่างเต็มที่","“ถ้าอย่างนั้น เรื่องการพิจารณารางวัลสำหรับผลงานการวิจัย ก็รอให้ผลลัพธ์ออกมาเป็นรูปเป็นร่างก่อนแล้วกัน”","แฮร์รอฟพูดขึ้นหลังจากที่ครุ่นคิดอยู่ครู่หนึ่ง","ลินน์เล่นจัดฉากซะใหญ่โตขนาดนี้ จนทำให้พ่อมดทั้งสภาต้องเข้ามามีส่วนร่วม แถมยังประกาศกร้าวว่าเวทมนตร์ที่จะพัฒนาขึ้นมานั้น สามารถเอาชนะเทพเจ้านั่นได้อีกต่างหาก เห็นได้ชัดว่า แค่เหรียญตราจันทร์สีเงินเพียงเหรียญเดียว คงไม่พอที่จะตอบแทนผลงานนี้แน่ๆ","ส่วนการจะมอบเหรียญตราโคโรนาให้ ก็ต้องพิจารณาอย่างรอบคอบ แต่ในเมื่อลินน์ไม่ได้ตั้งใจที่จะอธิบายหลักการของเวทมนตร์รูปแบบใหม่ให้ฟัง พวกเขาจึงยากที่จะประเมินค่าของมันได้ ดังนั้น ทางเดียวก็คือต้องยืดเวลาออกไปก่อน รอให้มีผลงานออกมาก่อนแล้วค่อยตัดสินใจ เพื่อป้องกันไม่ให้เกิดความผิดพลาด จนทำให้รางวัลนี้กลายเป็นเรื่องตลกขบขัน","ลินน์พยักหน้ารับ อันที่จริงเขาไม่ได้สนใจเรื่องเหรียญตราอะไรนี่สักเท่าไหร่เลย เพราะสิ่งสำคัญที่สุดสำหรับพ่อมดก็คือความแข็งแกร่งและความรู้ ส่วนเกียรติยศก็เป็นเพียงแค่ผลพลอยได้จากสองสิ่งนี้เท่านั้น","“ถ้าอย่างนั้น การประชุมในวันนี้ก็ขอจบลงเพียงเท่านี้เถอะ!”","วิกตอริโอประกาศกร้าว ในตอนนี้เขาแทบจะอดใจรอไม่ไหว ที่จะไปวิจัยไอ้สิ่งที่เรียกว่าเครื่องเร่งอนุภาคแล้ว","แต่สมาชิกสภาที่เข้าร่วมการประชุมต่างก็รู้สึกยังไม่หนำใจ ในขณะที่ลุกขึ้นยืน พวกเขาก็ยังคงพูดคุยเกี่ยวกับแบบจำลองธาตุรูปวงโคจรกันอยู่เลย แถมบางคนยังคาดเดาด้วยว่า ดาวรุ่งแห่งเวทมนตร์ผู้นี้ลงทุนจัดฉากซะใหญ่โตขนาดนี้ เวทมนตร์ใหม่ที่เขาพัฒนาขึ้นมาจะอยู่ในระดับไหนกันแน่","ในขณะที่ทุกคนกำลังพูดคุยกันอยู่นั้น ลินน์ที่เป็นหัวข้อสนทนา ก็กำลังเก็บรวบรวมธาตุเรเดียมที่ใช้ในการทดลองกลับมา และบรรจุพวกมันลงในกล่องตะกั่วอย่างระมัดระวัง","“ปรมาจารย์ลินน์ กล่องพวกนี้คืออุปกรณ์ที่ใช้สำหรับเก็บรักษาธาตุชนิดใหม่โดยเฉพาะอย่างนั้นหรือ?”","ราฟาเอลสังเกตเห็นการกระทำของลินน์ จึงได้เอ่ยถามด้วยความสงสัย","ในความคิดของเขา กล่องนี้น่าจะเป็นวิธีการยับยั้งไม่ให้ธาตุเรเดียมสลายตัว เพื่อไม่ให้ธาตุชนิดใหม่สูญเสียพลังงาน และสามารถเก็บรักษาเอาไว้ได้นานขึ้น","“ไม่หรอก พูดให้ถูกก็คือ มันใช้สำหรับแยกกัมมันตภาพรังสีต่างหาก!”","ลินน์ส่ายหน้าและเอ่ยอธิบาย ก่อนจะตบหน้าผากตัวเองเบาๆ และหันไปหาบรรดาพ่อมดที่ยังไม่ได้ออกไปจากห้องประชุม พร้อมกับเอ่ยเตือนด้วยน้ำเสียงจริงจังว่า","“อ้อ จริงสิ เมื่อกี้ข้าลืมบอกไปเลย ว่าธาตุชนิดใหม่ทั้งสองชนิดที่สกัดออกมาจากศิลาปีศาจนั้นอันตรายมาก อนุภาคที่มันแผ่ออกมาก็อันตรายมากเช่นกัน ดังนั้น เวลาที่พวกท่านทำการทดลอง ก็อย่าลืมป้องกันให้ดีด้วยล่ะ มิฉะนั้นผลที่ตามมามันจะร้ายแรงมาก...”","“นั่นมันฟังดูเกินจริงไปหน่อยไหม ปรมาจารย์ลินน์?”","ราฟาเอลขมวดคิ้ว และไม่ค่อยอยากจะเชื่อคำตัดสินของลินน์สักเท่าไหร่นัก","อนุภาคแอลฟานั้นบินออกมาจากนิวเคลียสของธาตุ มันคือพลังต้นกำเนิดของเวทมนตร์เชียวนะ...","ยิ่งไปกว่านั้น แม้ว่ามันจะมีความเร็วสูงมาก แต่การทดลองเมื่อครู่นี้ก็พิสูจน์ให้เห็นแล้วว่า มันสามารถพุ่งผ่านธาตุไปได้อย่างไร้อุปสรรค หรือไม่ก็แค่ถูกนิวเคลียสของอะตอมสะท้อนกลับมาเท่านั้น โดยไม่ได้สร้างความเสียหายใดๆ เลย","ลินน์เหลือบมองราฟาเอลแวบหนึ่ง ก่อนจะตบมือและพูดขึ้นว่า","“พอดีเลย ข้าได้ทำการทดลองเอาไว้ด้วย พวกท่านลองดูก็ได้ นี่คือสภาพของหนู หลังจากที่มันถูกรังสีของธาตุชนิดใหม่ฉายใส่ติดต่อกันหลายวัน!”","เพียร์ซรีบนำกรงหนูทั้งสิบกรงเข้ามาทันที","ราฟาเอลและคนอื่นๆ ชะโงกหน้าเข้าไปดูด้วยความสงสัย แต่แล้วสีหน้าของพวกเขาก็เปลี่ยนไปอย่างฉับพลัน เพราะหนูที่ถูกขังอยู่ในกรงนั้นมีสภาพที่ดูไม่ได้เลย ในจำนวนนั้นมีเจ็ดตัวที่ดูเหมือนกำลังจะตาย ร่างกายของพวกมันบวมเป่ง ผิวหนังและเนื้อเริ่มเน่าเปื่อย แถมอวัยวะภายในก็ยังกลายพันธุ์เป็นเซลล์มะเร็ง...","ส่วนอีกสามตัวที่เหลือ แม้จะมีสภาพที่ดูดีกว่าหน่อย แต่มันก็เริ่มแสดงอาการคล้ายๆ กันออกมาบ้างแล้ว","ภาพอันน่าสะพรึงกลัวนี้ ทำให้ทุกคนที่อยู่ในห้องประชุมถึงกับรู้สึกหนาวสั่นไปถึงขั้วหัวใจ","“ดูเหมือนว่ากัมมันตภาพรังสีที่แผ่ออกมาจากธาตุยูเรเนียม จะน่ากลัวมากจริงๆ”","ราฟาเอลฝืนทำใจดีสู้เสือ และแสร้งพูดด้วยท่าทีสงบนิ่ง","ยูเรเนียมคิดเป็นมวลส่วนใหญ่ของหินปีศาจ ในขณะที่เรเดียมคิดเป็นสัดส่วนเพียงเล็กน้อยเท่านั้น ดังนั้น ในสายตาของราฟาเอล มันจะต้องเป็นความผิดของยูเรเนียมอย่างแน่นอน!","“ไม่ ตรงกันข้ามเลย ปรมาจารย์ราฟาเอล!”","ลินน์พูดด้วยน้ำเสียงหยอกล้อ","“ข้าสงสัยว่า ธาตุเรเดียมชนิดนี้นี่แหละ ที่เป็นต้นเหตุทำให้พวกคนงานเหมืองหมดสติ ล้มป่วยอย่างหนัก และเสียชีวิต เพราะความเข้มข้นของรังสีของมัน สูงกว่ายูเรเนียมถึงหลายร้อยเท่าเลยทีเดียว!”","หลายร้อยเท่า?!","เมื่อได้ยินเช่นนั้น ใบหน้าของราฟาเอลก็ซีดเผือดลงทันที ส่วนแม่มดคนหนึ่งที่กำลังลูบคลำแก้วเรืองแสงอยู่ ก็ถึงกับกรีดร้องออกมา แล้วรีบโยนแก้วเรืองแสงในมือทิ้งไปให้ไกลที่สุดเท่าที่จะทำได้ อย่างไม่ลังเลเลยแม้แต่น้อย..."]},{"n":409,"t":"แหล่งกำเนิดนิวตรอนแบบสปอลเลชันและรังสีอันน่าสะพรึงกลัว!","c":["“ปรมาจารย์ลินน์ ในเมื่อธาตุชนิดใหม่ทั้งสองชนิดนี้มันอันตรายขนาดนั้น ทำไมท่านถึงไม่บอกพวกเราให้เร็วกว่านี้เล่า?”","ซานเชซอดไม่ได้ที่จะเอ่ยถามขึ้นมา พร้อมน้ำเสียงของเขาแฝงไว้ด้วยความไม่พอใจเล็กน้อย","“ข้าคิดว่า การด่วนสรุปคุณสมบัติของธาตุชนิดใหม่ โดยที่ไม่ผ่านการทดลองตรวจสอบอย่างเข้มงวดเสียก่อน มันเป็นการกระทำที่ไม่เหมาะสมอย่างยิ่ง”","ลินน์ยักไหล่เบาๆ ขืนเขาบอกไปตั้งแต่ตอนที่เพิ่งได้หินปีศาจมาว่าเจ้านี่คือธาตุกัมมันตรังสี และมีรังสีที่รุนแรงแผ่ออกมา มันก็ดูจะน่าสงสัยเกินไปหน่อย","เหล่าสมาชิกระดับสภาที่อยู่ในห้องต่างก็รู้สึกหวาดเสียวไปตามๆ กัน และพวกเขาก็หันไปมองราฟาเอลด้วยสายตาที่ไม่ค่อยเป็นมิตรนัก เพราะพวกเขาจำได้ดีว่า ก่อนหน้านี้ใครบางคนยังคิดจะเอาสีเรืองแสงที่ทำจากเรเดียม ไปทาตามกำแพงเมืองหลวงอยู่เลย","จนบางคนเริ่มสงสัยแล้วว่า ราฟาเอลอาจจะเป็นสายลับที่ศาสนจักรส่งมาแฝงตัวอยู่หรือเปล่า!","นี่กะจะทำลายสภาจากภายในเลยใช่ไหมเนี่ย!","ข้าไม่ใช่ ข้าไม่ได้ทำ...ราฟาเอลถึงกับพูดไม่ออก โชคดีที่ลินน์ช่วยพูดอธิบายให้ว่า","“ไม่ต้องกังวลไปหรอกทุกท่าน แม้ว่าธาตุเรเดียมจะมีกัมมันตภาพรังสีสูงมาก แต่ปริมาณเรเดียมในหินปีศาจหนึ่งก้อนก็มีอยู่อย่างจำกัด แถมมันยังถูกแบ่งออกเป็นชิ้นเล็กๆ กว่ายี่สิบชิ้นด้วย ดังนั้น การสัมผัสกับมันในระยะเวลาสั้นๆ จึงไม่ก่อให้เกิดอันตรายหรอก”","เขาได้ทำการตรวจสอบเรื่องนี้มาอย่างดีแล้ว ประกอบกับร่างกายของพ่อมดมีความแข็งแกร่งมาก แถมพลังเวทในตัวก็ยังมีความสามารถในการป้องกันรังสีได้ระดับหนึ่ง นี่จึงเป็นเหตุผลว่าทำไมลินน์ถึงไม่รีบเตือนพวกเขาตั้งแต่แรก","แน่นอนว่า หากใครคิดจะทำการวิจัยธาตุชนิดนี้เป็นเวลานาน โดยที่ไม่สวมอุปกรณ์ป้องกันใดๆ เลย นั่นก็เท่ากับเป็นการรนหาที่ตายชัดๆ!","“ปรมาจารย์ราฟาเอล ท่านรีบไปเปลี่ยนชุดเถอะ”","ลินน์มองดูชุดคลุมที่เปล่งแสงสีเหลืองอมเขียวของอีกฝ่ายด้วยสีหน้าประหลาดใจ โดยเขานั้นนับถือในความกล้าหาญของอีกฝ่ายจริงๆ ที่กล้าเอาเรเดียมที่มีรังสีรุนแรงขนาดนั้น มาทาลงบนเสื้อผ้าของตัวเอง!","ราฟาเอลเหลือบมองดูหนูที่ดูอิดโรยและมีสภาพน่าเกลียดน่ากลัวในกรง แล้วก็อดไม่ได้ที่จะยิ้มเจื่อนๆ ออกมา","“อาการบาดเจ็บที่เกิดจากรังสีกัมมันตรังสีพวกนี้ น่าจะมีวิธีรักษาใช่ไหม?”","เขาใส่เสื้อตัวนี้มาทั้งวันแล้ว แถมต่างจากคนอื่นๆ ตรงที่ตลอดหลายวันที่ผ่านมา เพื่อที่จะศึกษาคุณสมบัติการเรืองแสงด้วยตัวเองของธาตุเรเดียม เขาต้องคลุกคลีอยู่กับอนุภาคแอลฟาทุกวันเลย","ซึ่งนั่นก็หมายความว่า เขาอาจจะโดนรังสีเข้าไปเต็มๆ แล้ว...","“ถ้ารักษาตั้งแต่เนิ่นๆ ก็ยังพอช่วยได้ มันก็แค่เซลล์ถูกทำลายหรือกลายพันธุ์เป็นเซลล์มะเร็งเท่านั้นเอง”","ลินน์พูดปลอบใจ","อาการบาดเจ็บทั่วร่างกายที่เกิดจากรังสีแบบนี้ หากใช้เทคโนโลยีทางวิทยาศาสตร์ในการรักษาก็คงจะยุ่งยากสักหน่อย เพราะต้องใช้ตู้รักษาโรคเพื่อฟื้นฟูร่างกายทั้งหมด ไม่อย่างนั้นผลข้างเคียงต่างๆ ก็มากพอที่จะทำให้คนตายได้","แต่ในแง่ของเวทมนตร์นั้น มันจัดการได้ง่ายกว่ามาก เพราะจอมเวทผู้ยิ่งใหญ่ที่เชี่ยวชาญเวทมนตร์สายแปรสภาพ น่าจะมีความสามารถพอที่จะจัดการกับเซลล์ที่ผิดปกติพวกนั้นได้ และถ้าได้ยาวิเศษที่สามารถทำให้แขนขาที่ขาดงอกกลับมาใหม่ได้ล่ะก็ ตราบใดที่ยังไม่ถึงขั้นที่เซลล์มะเร็งลุกลามไปทั่วทั้งร่างกาย ก็ยังสามารถช่วยชีวิตกลับมาได้อยู่","เพียงแต่ต้องทนทุกข์ทรมานไปสักพักใหญ่ๆ เท่านั้นเอง!","เมื่อได้ฟังคำอธิบายของลินน์ ราฟาเอลก็ถอนหายใจออกมาด้วยความโล่งอก ยังมีทางรอดก็ดีแล้ว...","แต่นี่ก็หมายความว่า แผนการกอบโกยเงินทองจากสีเรืองแสงที่ทำจากเรเดียมของเขา ต้องถูกยกเลิกไปโดยปริยาย...","“แล้วพวกเราจะป้องกันรังสีจากธาตุกัมมันตรังสีพวกนี้ได้ยังไง?”","วิกตอริโอเอ่ยถามขึ้น ในเมื่อพวกเขาต้องทำการวิจัยธาตุชนิดใหม่นี้ การหลีกเลี่ยงไม่ให้สัมผัสกับมันจึงเป็นเรื่องที่เป็นไปไม่ได้","“ธาตุที่มีความหนาแน่นสูง มักจะมีความสามารถในการต้านทานรังสีได้ดีเยี่ยม อย่างเช่นตะกั่วก็เป็นตัวเลือกที่ดีมาก!”","ลินน์แนะนำ","ตะกั่วมีเลขอะตอม 82 และมีความหนาแน่น 11.3437 กรัมต่อลูกบาศก์เซนติเมตร ซึ่งคือธาตุที่ไม่มีกัมมันตภาพรังสีที่มีมวลอะตอมสูงที่สุด แถมยังเป็นธาตุที่พบได้ทั่วไปและมีปริมาณสำรองจำนวนมาก จึงถูกนำมาใช้อย่างแพร่หลายในการป้องกันรังสี","เมื่อพูดมาถึงตรงนี้ ลินน์ก็ไม่ลืมที่จะกำชับสมาชิกระดับสภาที่อยู่ที่นี่ ว่าให้ระมัดระวังเรื่องความปลอดภัยให้ดีในระหว่างการวิจัย...","แม้ว่าสำหรับพ่อมดแล้ว รังสีจะไม่ใช่โรคร้ายที่รักษาไม่หาย แต่มันก็ต้องจ่ายในราคาที่สูงลิ่วเพื่อที่จะรักษามันให้หายขาด ที่เขาพูดถึงมันอย่างสบายๆ ได้แบบนี้ ก็เป็นเพราะว่าราฟาเอลเป็นถึงจอมเวทผู้ยิ่งใหญ่และมีฐานะร่ำรวยต่างหาก","...","การประชุมสัมมนาเรื่องเวทมนตร์ในครั้งนี้ ดำเนินมาจนถึงเวลาตีสี่ ซึ่งกินเวลาไปเกือบสิบชั่วโมงเลยทีเดียว!","แต่เหล่าสมาชิกระดับสภาที่เดินออกมาจากห้องประชุม กลับดูกระปรี้กระเปร่ากันทุกคน ไม่ว่าจะเป็นเรื่องที่ดาวรุ่งแห่งเวทมนตร์อ้างว่า เขาได้พัฒนาเวทมนตร์ใหม่ที่สามารถเอาชนะศาสนจักรได้ หรือว่าจะเป็นเรื่องแบบจำลองธาตุรูปวงโคจรดวงดาวอันวิจิตรตระการตา ล้วนแล้วแต่เป็นข่าวที่น่าตื่นตะลึงทั้งสิ้น ซึ่งข่าวเหล่านี้ก็แพร่สะพัดออกไปอย่างรวดเร็ว ผ่านการพูดคุยของสมาชิกระดับสภาแต่ละคน","ไม่ต้องสงสัยเลยว่า ตั้งแต่วันนี้เป็นต้นไป ศาสตร์แห่งเวทมนตร์จะก้าวเข้าสู่ยุคใหม่ หรือแม้กระทั่งรากฐานของเวทมนตร์ทั้งหมดอาจจะถูกเขียนขึ้นมาใหม่เลยด้วยซ้ำ เพราะลินน์ได้พิสูจน์ให้เห็นแล้วว่า ธาตุไม่ใช่สสารพื้นฐานที่สุดที่ประกอบขึ้นเป็นสรรพสิ่ง","มันไม่เพียงแต่สามารถแบ่งย่อยลงไปได้อีกเท่านั้น แต่รูปร่างของมันก็ไม่ได้เป็นทรงกลมเหมือนอย่างที่ทฤษฎีทั่วไปกล่าวอ้าง และไม่มีสิ่งที่เรียกว่าเปลือกนอกด้วย!","อนุภาคแอลฟาและอิเล็กตรอนที่ประกอบกันเป็นนิวเคลียสของอะตอม ได้กลายมาเป็นสสารต้นกำเนิดชนิดใหม่ ในสายตาของเหล่าพ่อมดไปเสียแล้ว","และอีกไม่นาน พวกเขาก็จะได้รู้ว่าไอ้อนุภาคแอลฟาที่ว่านั่นคืออะไร และพวกเขาจะได้ครอบครองพลังที่แท้จริงของธาตุจากมัน!","ส่วนพ่อมดที่เน้นหนักไปทางการต่อสู้ และไม่ได้เข้าร่วมการประชุมในครั้งนี้ พอได้ฟังเพื่อนร่วมงานบรรยายถึงความยอดเยี่ยมของทฤษฎีโครงสร้างธาตุแบบใหม่ด้วยความตื่นเต้น พวกเขาก็อดไม่ได้ที่จะรู้สึกเสียใจ ที่ตัวเองไม่ได้เป็นพยานในเหตุการณ์ครั้งประวัติศาสตร์นี้","แน่นอนว่า การเผยแพร่และพูดคุยอย่าง ‘กว้างขวาง’ นี้ จำกัดอยู่แค่ในหมู่พ่อมดเต็มตัวเท่านั้น เพราะในตอนนี้พวกเขากำลังอยู่ในช่วงสงคราม ดังนั้น พวกเขาจึงต้องระมัดระวังเรื่องการรักษาความลับของข้อมูลสำคัญเหล่านี้เป็นอย่างมาก","และด้วยกระแสความตื่นตัวในการวิจัยเวทมนตร์ จึงทำให้มีพ่อมดจำนวนมาก หันมาให้ความสนใจกับการทดลอง ถ้าไม่ใช่เพราะพ่อมดที่ถูกส่งไปสำรวจเหมืองยูเรเนียม แล้วสามารถค้นพบหินปีศาจและแร่ยูเรเนียมจำนวนมากกลับมาได้สำเร็จล่ะก็ มันก็คงจะมีไม่พอแบ่งให้ทุกคนทำการทดลองแน่ๆ","ในเวลาเดียวกัน ชาวเมืองหลวงก็พบเห็นความผิดปกติบางอย่าง นั่นคือมีน้ำทะเลจำนวนมหาศาลถูกขนส่งจากท่าเรือที่อยู่ห่างออกไปหลายร้อยกิโลเมตร เข้ามายังเมืองหลวงอย่างต่อเนื่อง แถมราคาของแร่ตะกั่วก็ยังพุ่งสูงขึ้นอย่างรวดเร็วอีกด้วย...","บรรดาสายลับที่แฝงตัวอยู่ในเงามืด ซึ่งถูกส่งมาโดยจักรวรรดิ ต่างก็รู้สึกงุนงงกับเหตุการณ์ประหลาดนี้","เรื่องแร่ตะกั่วนั้นยังพอเข้าใจได้ จากข้อมูลที่พวกเขารวบรวมมา เจ้านี่ถูกนำไปใช้ในการผลิตกระสุนปืนไฟ เพื่อเตรียมพร้อมสำหรับสงคราม การที่ความต้องการแร่ชนิดนี้เพิ่มสูงขึ้นจึงเป็นเรื่องปกติ แต่การที่พวกเขาขนส่งน้ำทะเลปริมาณมหาศาลมาจากที่ไกลแสนไกลขนาดนั้น มันหมายความว่ายังไงกันล่ะ?","หรือว่าระบบประปาของเมืองหลวงจะมีปัญหา?","ต่อให้สายลับของจักรวรรดิจะคิดจนหัวแทบระเบิด พวกเขาก็คงไม่มีทางรู้ได้เลยว่า การที่เหล่าพ่อมดขนส่งน้ำทะเลหลายตันเข้ามานั้น มันก็แค่เพื่อนำมาแยกธาตุ และค้นหาธาตุดิวเทอเรียมที่ลินน์พูดถึงเท่านั้น...","ภายใต้ความพยายามร่วมกันของพ่อมดเต็มตัวกว่าพันคนในสภา ปัญหาใหญ่ทั้งสามข้อที่กวนใจลินน์มาตลอด ก็ได้รับการแก้ไขไปทีละข้ออย่างรวดเร็ว","ในช่วงพลบค่ำของวันที่ห้า ลินน์ที่เพิ่งสร้างแบบจำลอง ‘เวทมนตร์ระเบิดนิวเคลียร์ลูกใหญ่’ เสร็จสมบูรณ์ ก็ได้พาสมาชิกสภาหลายคน ไปยังเหมืองแร่ที่ถูกขุดจนกลวงแห่งหนึ่ง เพื่อทำการทดลองจุดระเบิด","เพื่อความปลอดภัย พวกเขาจึงใช้มวลวิกฤตที่ต่ำที่สุดเท่านั้น","ไม่มีใครรู้ว่าเกิดอะไรขึ้นที่นั่นบ้าง แต่ในวันนั้นเอง ภูเขาที่ตั้งของเหมืองแร่ทั้งลูกก็ได้ถล่มลงมา แถมแรงสั่นสะเทือนจากแผ่นดินไหวยังรุนแรงไปไกลถึงเมืองหลวงที่อยู่ห่างออกไปหลายสิบกิโลเมตรเลยทีเดียว","และข่าวลือก็ได้แพร่สะพัดไปทั่วเมืองหลวง โดยชาวเมืองบางคนที่กำลังตื่นตระหนกตกใจ ถึงกับคิดว่านี่คือการลงทัณฑ์จากสวรรค์ มันคือความพิโรธของพระผู้เป็นเจ้า!"]},{"n":410,"t":"พวกเราต้องเชื่อมั่นในวิทยาศาสตร์ โอ๊ะ ไม่สิ ต้องเชื่อมั่นในเวทมนตร์ต่างหาก!","c":["ภายในเมืองหลวง ข่าวลือที่ว่าแผ่นดินไหวครั้งใหญ่คือความพิโรธของพระผู้เป็นเจ้า เริ่มแพร่กระจายและทวีความรุนแรงขึ้นอย่างรวดเร็ว จนในที่สุดก็รู้ไปถึงหูของเหล่าสมาชิกสภา","แน่นอนว่าบรรดาพ่อมดที่กำลังหมกมุ่นอยู่กับการวิจัย ต่างก็หัวเราะเยาะกับข่าวลือพรรค์นี้ แม้ว่าแผ่นดินไหวจะไม่ใช่เรื่องที่เกิดขึ้นบ่อยนัก แต่มันก็ไม่มีทางเกี่ยวข้องกับเทพเจ้าจอมปลอมนั่นอย่างเด็ดขาด","ในขณะเดียวกัน จอมเวทผู้ยิ่งใหญ่อย่างแอนโธนี่และคนอื่นๆ ก็ได้รับข่าวลับมาว่า ในวันเกิดเหตุ ลินน์และประธานสภาทั้งหลายต่างก็เดินทางออกจากเมืองหลวงไปอย่างลับๆ โดยไม่มีใครรู้ว่าพวกเขาไปที่ไหน และหลังจากนั้นไม่นาน แผ่นดินไหวครั้งใหญ่ก็เกิดขึ้น","นี่อาจจะเกี่ยวข้องกับเวทมนตร์รูปแบบใหม่ ที่ดาวรุ่งแห่งเวทมนตร์ผู้นี้กำลังแอบซุ่มพัฒนาอยู่ก็เป็นได้","อย่างไรก็ตาม สภาเวทมนตร์กลับให้ความสำคัญกับข่าวลือที่ไร้มูลความจริง แต่กลับแพร่กระจายไปอย่างรวดเร็วนี้เป็นอย่างมาก โดยลินน์นั้นคาดเดาได้ทันทีว่า จะต้องมีใครบางคนอยู่เบื้องหลังเรื่องนี้ และกำลังฉวยโอกาสสร้างความปั่นป่วน","เขาจึงสั่งให้เรย์เดลนำกองทหารปืนคาบศิลาบางส่วน แฝงตัวเข้าไปปะปนกับฝูงชน พร้อมกับตั้งรางวัลนำจับก้อนโต ซึ่งก็ทำให้พวกเขาสามารถจับกุมสายลับของจักรวรรดิที่คอยปล่อยข่าวลือได้มากกว่าสิบคน ในเวลาเพียงไม่นาน","และเพื่อเป็นการระงับความตื่นตระหนกของชาวเมืองหลวง ลินน์จึงได้ลงมือเขียนบทความ ‘ว่าด้วยผลกระทบของการเคลื่อนตัวของเปลือกโลก’ ขึ้นมาด้วยตัวเอง โดยอธิบายสาเหตุของการเกิดแผ่นดินไหวจากมุมมองทางวิทยาศาสตร์ ว่ามันเป็นเพียงปรากฏการณ์ทางธรรมชาติที่แสนจะธรรมดา ไม่ใช่ความพิโรธหรือการลงทัณฑ์จากพระผู้เป็นเจ้าแต่อย่างใด เพื่อขอให้ชาวเมืองหลวงอย่าได้ตื่นตระหนกจนเกินไป...","พวกเขาจะต้องเชื่อมั่นในวิทยาศาสตร์ โอ๊ะ ไม่สิ ต้องเชื่อมั่นในเวทมนตร์ต่างหาก!","...","เที่ยงวันของวันต่อมา ในที่สุดลินน์ก็ได้มีเวลาว่างมานั่งตากแดดพักผ่อนหย่อนใจ อยู่ที่ลานบ้านในคฤหาสน์ของตัวเองเสียที ช่วงครึ่งเดือนที่ผ่านมานี้ เขาแทบจะยุ่งจนหัวหมุนเลยทีเดียว","การมีตัวตนอยู่ของ ‘เอลา’ เทพเจ้าจอมปลอมผู้สูงส่ง เปรียบเสมือนดาบแห่งดาโมคลีสที่แขวนอยู่เหนือหัวของพวกเขา มันพร้อมที่จะร่วงหล่นลงมาฟาดฟันพวกเขาได้ทุกเมื่อ โดยที่เขาไม่สามารถทำอะไรเพื่อต่อต้านมันได้เลย","แต่ในตอนนี้ อย่างน้อยพวกเขาก็พอจะมีพลังที่จะต่อกรกับอีกฝ่ายได้แล้ว!","แม้ว่ามันจะยังอยู่ในวงจำกัดก็ตาม...","นั่นก็เป็นเพราะว่า หลังจากที่พวกเขาสกัดหินปีศาจจำนวนหลายร้อยก้อนจนหมดเกลี้ยง พวกเขาก็ได้เชื้อเพลิงนิวเคลียร์มาเพียงแค่ประมาณ 50 กิโลกรัมเท่านั้น","และมวลวิกฤตที่ใช้ในการจุดระเบิดนิวเคลียร์ของยูเรเนียม-235 ก็อยู่ที่ประมาณ 15 กิโลกรัม ซึ่งนั่นก็หมายความว่า ต่อให้เขาจะใช้ปริมาณขั้นต่ำสุด เวทมนตร์ระเบิดนิวเคลียร์ลูกใหญ่ของเขา ก็จะสามารถใช้งานได้เพียงแค่สามครั้งเท่านั้น","และเมื่อวานนี้ เพื่อเป็นการทดสอบเวทมนตร์ เขาได้ใช้โอกาสนั้นไปแล้วหนึ่งครั้ง โดยผลลัพธ์ที่ได้ก็พิสูจน์ให้เห็นแล้วว่า ทฤษฎีและแบบจำลองเวทมนตร์ระเบิดนิวเคลียร์ลูกใหญ่ของเขานั้นถูกต้องอย่างไม่มีที่ติ สมการความสมมูลระหว่างมวลและพลังงาน สามารถนำมาใช้ในต่างโลกแห่งนี้ได้อย่างสมบูรณ์แบบ!","เพื่อความปลอดภัย แฮร์รอฟ, ออโรร่า และวิกตอริโอที่ตามไปสังเกตการณ์ด้วย จึงไม่ได้เห็นภาพการระเบิดของนิวเคลียร์ด้วยตาตัวเอง แต่พวกเขาก็ได้เห็นสภาพอันน่าสะพรึงกลัวหลังจากที่ระเบิดทำงานเสร็จสิ้นแล้ว...","เวทมนตร์ป้องกันทั้งหมดที่พวกเขาติดตั้งไว้ใต้ดินเพื่อใช้ในการทดสอบ ถูกทำลายล้างจนหมดสิ้นในชั่วพริบตา พร้อมกับภูเขาที่ตั้งของเหมืองแร่ทั้งลูกก็พังทลายลงมา แม้กระทั่งแรงสั่นสะเทือนจากคลื่นกระแทกของมัน ก็ยังส่งผลกระทบไปถึงเมืองหลวงที่อยู่ห่างออกไปหลายสิบกิโลเมตร จนก่อให้เกิดความตื่นตระหนกครั้งใหญ่","สภาพของพื้นที่หลังจากเกิดการระเบิด ยิ่งทำให้แฮร์รอฟและคนอื่นๆ รู้สึกหวาดกลัวยิ่งขึ้นไปอีก เพราะหลังจากที่พวกเขาเคลื่อนย้ายก้อนหินขนาดยักษ์บางส่วนที่ทับถมกันอยู่ออกไป พวกเขาก็พบว่าพื้นที่บริเวณศูนย์กลางการระเบิดทั้งหมด ได้กลายสภาพเป็นผืนดินที่ไหม้เกรียม โดยความร้อนระอุที่อยู่ภายในนั้น มากพอที่จะย่างสดมนุษย์ให้กลายเป็นศพแห้งกรังได้ในชั่วพริบตา แถมยังมีอนุภาคกัมมันตรังสีที่รุนแรง แผ่กระจายอยู่เต็มพื้นที่ไปหมด...","หากพวกเขาปลดเวทมนตร์ป้องกันรังสีออกล่ะก็ อนุภาคกัมมันตรังสีอันน่าสะพรึงกลัวเหล่านี้ ก็จะพุ่งเข้าจู่โจมพวกเขาในทันที และทำลายล้างร่างกายของพวกเขาตั้งแต่ระดับอะตอมเลยทีเดียว","เมื่ออยู่ต่อหน้าพลังอำนาจระดับนี้ เวทมนตร์สี่วงแหวนอย่าง ‘เขตหวงห้ามแห่งชีวิต’ หรือแม้กระทั่งเวทมนตร์หกวงแหวนที่ทรงพลังกว่าอย่าง ‘อาณาเขตแห่งความตาย’ ก็กลายเป็นเพียงแค่เวทมนตร์เด็กเล่นไปเลย เพราะสิ่งที่อยู่ตรงหน้านี้ ถึงจะเรียกได้ว่าเป็นขุมนรกที่แท้จริง!","จนถึงขนาดที่ตอนเดินออกมาจากเหมืองแร่ที่ถล่มลงมา ขาของแฮร์รอฟยังสั่นเทา และไม่สามารถปกปิดแววตาที่เต็มไปด้วยความตื่นเต้นเอาไว้ได้","ในขณะที่ลินน์ไม่ได้รู้สึกแปลกใจกับผลลัพธ์ที่ออกมาเลยสักนิด แม้ว่าอัตราการเปลี่ยนมวลให้กลายเป็นพลังงานของการระเบิดนิวเคลียร์ จะมีค่าไม่ถึงหนึ่งในพัน ซึ่งเทียบไม่ได้เลยกับการทำลายล้างของสสารและปฏิสสาร แต่อย่างไรเสีย มันก็คือพลังในระดับอะตอมอยู่ดี!","การแตกตัวของยูเรเนียมเพียงหนึ่งกิโลกรัม สามารถปลดปล่อยพลังงานออกมาได้เทียบเท่ากับแรงระเบิดของทีเอ็นทีถึง 20,000 ตัน!","และครั้งแรกในประวัติศาสตร์มนุษยชาติ ที่มีการนำอาวุธชนิดนี้มาใช้งาน ก็เหมือนกับการทดลองจุดระเบิดในครั้งนี้ คือใช้มวลวิกฤตเพียงไม่กี่สิบกิโลกรัม ก็สามารถทำลายเมืองทั้งเมืองให้ราบเป็นหน้ากลองได้แล้ว!","แต่เมื่อนึกถึงพลังอันน่าสะพรึงกลัวของ ‘เอลา’ ที่สามารถควบคุมอะตอมเพื่อแช่แข็งทุกสรรพสิ่งได้ ลินน์ก็ประเมินว่า เขาจะต้องหลอกล่อให้อีกฝ่ายเข้ามาอยู่ในรัศมีศูนย์กลางของการระเบิดนิวเคลียร์ให้ได้เสียก่อน ถึงจะสามารถสังหารหรือสร้างบาดแผลฉกรรจ์ให้กับเทพเจ้าจอมปลอมองค์นี้ได้","และเมื่อดูจากปริมาณเชื้อเพลิงนิวเคลียร์ที่เหลืออยู่ในตอนนี้ เขาก็มีโอกาสที่จะลงมือได้เพียงแค่สองครั้งเท่านั้น!","ซึ่งนี่ก็ต้องยกความดีความชอบให้กับ ‘สิ่งปฏิกูล’ ของสัตว์เวทมนตร์ ที่สามารถกลืนกินแร่ยูเรเนียมเข้าไปได้ โดยทิ้งหินปีศาจเอาไว้ให้พวกเขาถึงพันกว่าก้อน ไม่อย่างนั้น กว่าพวกเขาจะค่อยๆ ขุดหาแร่ยูเรเนียม และนำมาสกัดแยกธาตุออกมาได้ ก็คงต้องใช้เวลาอย่างน้อยๆ ก็หนึ่งปีเลยทีเดียว และนี่คือระยะเวลาที่คำนวณจากการใช้เวทมนตร์เข้าช่วยแล้วนะ!","ปริมาณยูเรเนียมที่อยู่ในแร่ยูเรเนียมนั้นมีน้อยมากอยู่แล้ว ยิ่งเป็นยูเรเนียม-235 ก็ยิ่งมีน้อยเข้าไปใหญ่ หากต้องการจะได้ยูเรเนียม-235 ระดับอาวุธนิวเคลียร์สัก 1 กิโลกรัม พวกเขาก็ต้องขุดแร่ยูเรเนียมให้ได้อย่างน้อยๆ 200 ตันขึ้นไป แต่ถ้าจะเอามวลวิกฤตที่ 15 กิโลกรัม ก็เท่ากับว่าต้องใช้แร่ยูเรเนียมถึง 3,000 ตัน!","แถมการขุดแร่ยูเรเนียมก็ยังมีความเสี่ยงสูงมาก เพราะแร่จำนวนสามพันตัน ต่อให้ใช้เวทมนตร์เข้าช่วย ก็คงต้องใช้เวลาขุดนานหลายเดือนเลยทีเดียว ซึ่งนี่ยังไม่รวมถึงเวลาที่ต้องใช้ในขั้นตอนการสกัดและแยกธาตุอีกนะ","ส่วนเรื่องระเบิดไฮโดรเจน แม้ว่าเจ้านี่จะสามารถเพิ่มอานุภาพการทำลายล้างของการระเบิดนิวเคลียร์ และกำจัดกัมมันตภาพรังสีได้ แต่มันก็มีข้อเสียตรงที่ต้องใช้ระเบิดปรมาณูเป็นตัวจุดชนวนอยู่ดี...","เว้นเสียแต่ว่า เขาจะสามารถเลื่อนขั้นกลายเป็นพ่อมดระดับตำนานที่แท้จริงได้สำเร็จ เมื่อถึงเวลานั้น เขาอาจจะสามารถใช้ธาตุทริเทียมมาเป็นสื่อกลาง ในการร่ายเวทมนตร์ระเบิดนิวเคลียร์ลูกใหญ่ได้โดยตรงเลย!","แต่ตอนนี้ ความหวังเดียวของเขาก็คือ พ่อมดกลุ่มที่สองที่ทางสภาส่งไป จะสามารถตามหาสัตว์เวทมนตร์ ที่กลืนกินธาตุกัมมันตรังสีเป็นอาหาร ในถ้ำแร่ยูเรเนียมที่ทั้งซับซ้อนและแสนจะอันตรายนั่นจนพบ แล้วถ้าหากพวกเขาสามารถทำให้มันเชื่องได้ โรงงานผลิตเชื้อเพลิงนิวเคลียร์ในโลกเวทมนตร์ ก็จะไม่ใช่แค่ความฝันอีกต่อไป!","“ท่านศาสตราจารย์ลินน์...”","ในขณะที่ลินน์กำลังจมอยู่ในความคิดของตัวเอง ลิเดียก็วิ่งหน้าตั้งออกมาจากลานบ้านด้วยท่าทางดีอกดีใจ พร้อมใบหน้าเล็กๆ ที่แสนจะไร้เดียงสาของนางนั้นเปรอะเปื้อนไปด้วยฝุ่นควัน แต่สิ่งเหล่านี้ก็ไม่อาจปกปิดความตื่นเต้นที่ฉายชัดอยู่บนใบหน้าของนางได้เลย","“ดูเหมือนว่าเครื่องบินของเจ้าจะสร้างเสร็จแล้วสินะ...”","เมื่อลินน์นึกขึ้นได้ เขาก็รู้ทันทีว่าทำไมเด็กสาวถึงได้ดูตื่นเต้นขนาดนี้","“ใช่แล้วๆ วันนี้พวกเราจะเริ่มทดสอบการบินกันแล้ว!”","ลิเดียพยักหน้าหงึกหงัก พร้อมด้วยน้ำเสียงของนางที่เต็มไปด้วยความปีติยินดี นางรีบคว้าแขนของลินน์และลากเขาออกไปข้างนอกทันที","เครื่องบินรุ่นใหม่นี้ต่างจากเรือเหาะที่อาศัยแรงยกจากก๊าซฮีเลียมในการบินขึ้น เพราะมันจำเป็นต้องใช้รันเวย์เป็นทางวิ่งเพื่อช่วยในการทะยานขึ้นสู่ท้องฟ้า และเพื่อเป็นการรักษาความลับ สนามบินจึงถูกสร้างเอาไว้ที่นอกเมือง","หากการทดสอบบินในครั้งนี้ผ่านไปได้ด้วยดี ไม่แน่ว่าพวกเขาก็อาจจะผลิตมันออกมาได้ทันเวลา สำหรับเข้าร่วมการต่อสู้ในศึกครั้งต่อไปก็เป็นได้","ฮัตตาร์ กษัตริย์องค์ใหม่แห่งอาณาจักรฮัดลาตา ได้ส่งคนมาเร่งรัดพวกเขานานนับเดือนแล้ว แทบจะเรียกได้ว่าเขาส่งคนมาถามทุกวันเลย ว่าเมื่อไหร่พวกสภาเวทมนตร์ถึงจะเริ่มเปิดฉากโจมตีโต้กลับ เพื่อทวงคืนดินแดนของอาณาจักรกลับมาเสียที","และหลังจากที่ประธานสภาทั้งหลาย ได้ประจักษ์ถึงอานุภาพของการระเบิดนิวเคลียร์กับตาตัวเองแล้ว พวกเขาก็ลงความเห็นตรงกันว่า ถึงเวลาแล้วที่พวกเขาจะต้องเปิดฉากโจมตีกลับ แล้วตอบตกลงแผนการของกษัตริย์ฮัตตาร์ในที่สุด!","และเพื่อเป็นการลดความสูญเสียให้เหลือน้อยที่สุด พวกเขาจึงจำเป็นต้องผลักดันให้สมรภูมิรบ เข้าไปอยู่ในเขตแดนของจักรวรรดิให้ได้!","เพราะการระเบิดนิวเคลียร์เพียงครั้งเดียว ก็มากพอที่จะทำให้เมืองทั้งเมืองหายวับไปกับตาได้แล้ว หากพวกเขาเลือกที่จะทำสงครามในเมืองหลวงของตัวเอง พวกเขาก็คงจะขาดทุนย่อยยับแน่ๆ!"]},{"n":411,"t":"เครื่องบินรบเวทมนตร์รุ่นใหม่","c":["ณ หุบเขาลับแห่งหนึ่งทางตอนใต้ของเมืองหลวง พ่อมดเต็มตัวกว่าร้อยคนที่เชี่ยวชาญศาสตร์แห่งธาตุ ได้ร่วมมือกันใช้เวทมนตร์หนึ่งวงแหวนอย่างเวทมนตร์เปลี่ยนโคลนเป็นหิน เพื่อสร้างรันเวย์ที่ราบเรียบไร้รอยต่อ และมีความยาวถึงสามกิโลเมตรขึ้นมาในชั่วข้ามคืน!","และที่ปลายสุดของรันเวย์นั้น ก็มีเครื่องบินรบขนาดมหึมาลำหนึ่งตั้งตระหง่านอยู่ โดยรูปลักษณ์โดยรวมของมันถูกออกแบบมาให้มีความเพรียวลม ดูสวยงามและประณีตราวกับพญาอินทรีที่กำลังสยายปีก...","“ไม่คิดเลยว่า เครื่องบินแบบนี้จะถูกสร้างขึ้นมาได้จริงๆ!”","ธีโอดอร์พูดขึ้นด้วยความรู้สึกเหลือเชื่อ","ภาพการทดสอบการบินของลิเดียที่เมืองท่าอิเยตาเมื่อสองปีก่อน ยังคงตราตรึงอยู่ในความทรงจำของเขา โดยในตอนนั้น มันยังเป็นแค่โครงสร้างไม้ที่ดูหยาบๆ เหมือนกับของเล่นเด็กชิ้นใหญ่ที่เกิดจากจินตนาการอันเพ้อฝันเท่านั้น","และผลลัพธ์ก็เป็นไปตามที่เขาคาดไว้ หลังจากที่มันบินขึ้นไปบนฟ้าได้เพียงไม่กี่วินาที เครื่องบินทั้งลำก็แตกสลายพังทลายลงมา หากปรมาจารย์เฮลรามไม่ยื่นมือเข้ามาช่วยเอาไว้ได้ทันเวลา เด็กสาวเผ่าฮาล์ฟลิงคนนี้ก็คงจะตกลงมากลายเป็นเนื้อบดไปแล้ว...","แต่เครื่องบินรบรุ่นปรับปรุงใหม่ที่อยู่ตรงหน้านี้กลับแตกต่างออกไปอย่างสิ้นเชิง โดยโครงสร้างทั้งหมดของมันถูกเปลี่ยนจากไม้เป็นเหล็กกล้า ส่วนเปลือกนอกที่เคยดูหยาบกระด้างก็กลายเป็นความประณีตงดงาม และความก้าวหน้าอันก้าวกระโดดนี้ ก็ทำให้ยากที่จะเชื่อว่าทั้งสองสิ่งนี้คือเครื่องบินชนิดเดียวกัน...","“กัปตันลิเดียขอรายงาน ตอนนี้เราได้ทำการตรวจสอบชิ้นส่วนต่างๆ ของเครื่องบินรบรุ่นแรกเสร็จสิ้นแล้ว ทุกอย่างเป็นปกติ!”","หลังจากที่เดินตรวจดูรอบๆ เครื่องบินรบแล้ว ลิเดียก็แสร้งทำเป็นรายงานสถานการณ์ด้วยท่าทางขึงขัง","อันที่จริง นางแทบจะอดใจรอที่จะทำการทดสอบบินไม่ไหวแล้ว แต่ลินน์ก็สั่งเอาไว้อย่างเด็ดขาดว่า ก่อนจะขึ้นบินทุกครั้ง จะต้องทำการตรวจสอบชิ้นส่วนสำคัญต่างๆ ของเครื่องบินอย่างละเอียดเสียก่อน","ลิเดียได้แต่แอบบ่นงึมงำในใจ ว่าท่านศาสตราจารย์ช่างเป็นคนที่ระมัดระวังตัวเกินไปจริงๆ ทั้งๆ ที่เมื่อวานนางก็เพิ่งจะตรวจสอบมันอย่างละเอียดไปแล้วแท้ๆ","“เริ่มได้เลย!”","ลินน์พยักหน้า","“รับทราบ!”","เมื่อได้รับอนุญาต ลิเดียก็รีบปีนเข้าไปในห้องนักบินทันที นางสวมอุปกรณ์ป้องกันต่างๆ อย่างทะมัดทะแมง ก่อนจะสับสวิตช์ควบคุม","ภายใต้การขับเคลื่อนของเครื่องยนต์สันดาปภายในพลังงานไฮโดรเจนอันทรงพลัง ใบพัดที่อยู่ด้านหน้าก็เริ่มหมุนด้วยความเร็วสูงทันที","กระแสลมอันรุนแรงพัดพาฝุ่นผงบนพื้นดินให้ปลิวว่อน ท่ามกลางสายตาของเหล่าพ่อมดที่จับจ้องมองมา เครื่องบินใบพัดรุ่นแรกก็พุ่งทะยานออกไปข้างหน้าอย่างรวดเร็ว...","“เร็วมาก!”","วิกตอริโอที่ยืนอยู่ข้างๆ หรี่ตาลงเล็กน้อย และอดไม่ได้ที่จะอุทานออกมา เพียงแค่สิบวินาทีสั้นๆ ความเร็วของเครื่องบินรบก็พุ่งสูงขึ้นจนแซงหน้าความเร็วสูงสุดของรถแร่แปรธาตุไปแล้ว","มันพุ่งทะยานไปราวกับสายลม เมื่อมันบินโฉบผ่านไป ทุกคนต่างก็สัมผัสได้ถึงแรงกดดันอันมหาศาล","ส่วนลิเดียที่นั่งอยู่ภายในห้องนักบิน ยิ่งสัมผัสได้ถึงความเร็วนั้นอย่างชัดเจน โดยสิ่งต่างๆ รอบตัวนั้นพุ่งผ่านไปอย่างรวดเร็วจนกลายเป็นเพียงภาพติดตา ซึ่งความเร็วระดับนี้ มันเร็วกว่าเรือเหาะมากนัก...","ใบพัดที่อยู่ด้านหน้าหมุนเร็วเสียจนเกิดภาพลวงตาเหมือนกับว่ามันกำลังหมุนกลับด้าน และในวินาทีต่อมา เครื่องบินรบก็เริ่มเชิดหัวขึ้น ก่อนจะพุ่งทะยานขึ้นสู่ท้องฟ้าอันกว้างใหญ่ในชั่วพริบตา","ลิเดียสัมผัสได้ถึงความแตกต่างระหว่างการบังคับเครื่
