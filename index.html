สมาชิกสภาต่างก็รู้สึกกังวลใจเป็นอย่างมาก","แม้ว่าพ่อมดส่วนใหญ่จะไม่มีพื้นฐานทางทฤษฎีเศรษฐศาสตร์ แต่พวกเขาก็รู้ดีถึงความสำคัญของเสบียงอาหาร ประชาชนอาจจะใส่เสื้อผ้าขาดๆ หรือไม่ซื้อสิ่งประดิษฐ์เล่นแร่แปรธาตุแปลกใหม่ได้ แต่พวกเขาจะอดข้าวไม่ได้เด็ดขาด!","หลังจากครุ่นคิดอยู่ครู่หนึ่ง ราฟาเอลก็เสนอให้ใช้ระบบปันส่วน โดยกำหนดให้แต่ละคนสามารถซื้อขนมปังได้จำกัดจำนวน หากใครฝ่าฝืน ก็จะถูกลงโทษ","สมาชิกสภาบางคน ถึงกับเสนอให้ลดปริมาณอาหารกลางวันในโรงงาน เพื่อประหยัดเสบียงอาหารส่วนหนึ่ง","ก่อนหน้านี้ เขาเคยได้ยินพ่อมดในโรงงานเล่นแร่แปรธาตุบ่นให้ฟัง ว่าเนื่องจากสภามีกฎหมายบังคับให้จัดหาอาหารกลางวันให้หนึ่งมื้อ คนยากจนที่ขี้เหนียวมากๆ หลายคน จึงตั้งใจที่จะไม่กินอาหารเช้าและอาหารเย็น แต่จะมากินอาหารกลางวันในโรงงาน จนกว่าจะอิ่มแปล้","“ไม่ได้เด็ดขาด การทำแบบนั้นจะยิ่งสร้างความตื่นตระหนก และเป็นการยืนยัน ว่าเสบียงอาหารในมือของพวกเราไม่พอแล้วจริงๆ!”","แฮร์รอฟปฏิเสธข้อเสนอนี้ทันที เขารู้ดีว่ากลยุทธ์การลดการจัดสรรเสบียงอาหารทั้งหมดในตอนนี้ จะยิ่งส่งผลให้ราคาขนมปังพุ่งสูงขึ้นไปอีก","ออโรร่าหันไปมองลินน์ ก่อนจะถามอย่างใคร่ครวญ ว่าตอนนี้พวกเขายังมีข้าวสาลีเหลืออยู่อีกเท่าไหร่ และมันเพียงพอที่จะจัดสรรให้กับทั้งอาณาจักรหรือไม่?","เมื่อไม่นานมานี้ เธอได้รับรายงานว่า พื้นที่เพาะปลูกขนาดใหญ่ในภาคตะวันออกของอาณาจักร ดูเหมือนจะถูกปล่อยทิ้งร้างไปหมดแล้ว","“ไม่ได้ถูกปล่อยทิ้งร้างหรอก ความจริงแล้ว ข้ากำลังวางแผนที่จะรวบรวมที่ดินเหล่านี้ เพื่อปลูกพืชเศรษฐกิจต่างหากล่ะ”","ลินน์อธิบาย","ฮาดลาตาได้รับฉายาว่าเป็นอาณาจักรบนภูเขาแร่ ซึ่งนี่คือข้อได้เปรียบ แต่ในบางครั้ง มันก็เป็นข้อเสียเปรียบเช่นกัน","การมีภูเขาเยอะ หมายความว่าพื้นที่ราบที่เหมาะสำหรับการเพาะปลูกขนาดใหญ่มีน้อย","พื้นที่เพาะปลูกที่กระจัดกระจายอยู่ทั่วอาณาจักรนั้น ไม่สามารถใช้ประโยชน์จากการทำเกษตรกรรมด้วยเครื่องจักรได้อย่างเต็มที่","ลินน์มองว่าการนำที่ดินเหล่านี้มาปลูกข้าวสาลี มันไม่คุ้มค่า สู้เอาไปปลูกต้นไม้ผล เพื่อเพิ่มความหลากหลายให้กับอาหารของชาวเมือง และยังช่วยแก้ปัญหาโรคตาบอดกลางคืน (การขาดวิตามินเอ) ที่คนในอาณาจักรมักจะเป็นกัน จะดีกว่า","นอกจากนี้ นี่ก็ยังเป็นการเปิดโอกาสให้ชาวนาบางส่วน สามารถทำรายได้ใกล้เคียงกับประชาชนที่ทำงานในโรงงานอีกด้วย ไม่อย่างนั้น ใครจะอยากไปทำนากันล่ะ?","ส่วนเรื่องเสบียงอาหาร แน่นอนว่ามันเพียงพออยู่แล้ว!","ตั้งแต่ที่บุกยึดดินแดนทางตอนใต้ของอาณาจักรได้เมื่อปีก่อน ลินน์ก็ได้เริ่มวางแผนเอาไว้แล้ว เพราะดินแดนแถบนี้ มีที่ราบลุ่มแม่น้ำเพียงแห่งเดียวในอาณาจักร เขาจึงให้หน่วยปืนคาบศิลา ร่วมมือกับทาสเหมืองที่ได้รับการปลดปล่อย บุกเบิกพื้นที่เพาะปลูกแห่งใหม่ขึ้นมามากมายที่นั่น เพื่อทำฟาร์มขนาดใหญ่ที่ใช้เครื่องจักรกลอย่างเต็มรูปแบบ!","จนถึงตอนนี้ เสบียงอาหารกว่าเจ็ดในสิบส่วนของอาณาจักร ล้วนถูกผลิตมาจากซูเปอร์ฟาร์มแห่งนี้ทั้งสิ้น...","แม้ว่าสมาชิกสภาที่อยู่ที่นั่น จะไม่รู้ว่าฟาร์มเครื่องจักรกลที่ลินน์พูดถึง มันมีหน้าตาเป็นอย่างไร แต่พวกเขาก็พอจะเข้าใจได้ ว่าเสบียงอาหารในมือของพวกเขานั้นยังเพียงพออยู่","เมื่อตระหนักได้ถึงจุดนี้ แฮร์รอฟและคนอื่นๆ ก็ถอนหายใจด้วยความโล่งอก ก่อนจะเอ่ยถามด้วยความสงสัย","“ในเมื่อเสบียงอาหารเพียงพอ แล้วทำไมพวกเราถึงต้องไปกว้านซื้อข้าวสาลีจำนวนมหาศาลมาจากจักรวรรดิด้วยล่ะ?”","“ก็เพื่อป้องกันปัญหาความอดอยาก ที่เกิดจากผู้อพยพจำนวนมากยังไงล่ะ”","ลินน์พูดอย่างสบายๆ","“การมีเสบียงอาหารสำรองเอาไว้เยอะๆ มันก็ปลอดภัยกว่าไม่ใช่หรือ?”","เมื่อใดที่พวกเขาสามารถเอาชนะศาสนจักรได้ พวกเขาก็จะต้องรับมือกับคนยากจนนับสิบล้านคนในจักรวรรดิ ดังนั้น การเตรียมตัวตั้งแต่เนิ่นๆ ย่อมดีกว่าการเตรียมตัวล่าช้า!","ลินน์เองก็คาดไม่ถึง ว่าการกระทำของเขาที่รวบรวมพื้นที่เพาะปลูกในภาคตะวันออก และกว้านซื้อเสบียงอาหารอย่างบ้าคลั่งจากจักรวรรดิ จะทำให้บางคนเกิดความเข้าใจผิด จนนำไปสู่การก่อสงครามเสบียงอาหารเช่นนี้","“ลอดด์ เจ้าสืบรู้หรือยัง ว่าใครเป็นคนบงการอยู่เบื้องหลังเรื่องนี้?”","ลินน์ชะงักไปครู่หนึ่ง ก่อนจะเอ่ยถามขึ้นมา","“ข้าสงสัยว่า น่าจะเกี่ยวข้องกับบรรดาขุนนางภายในอาณาจักร”","ลอดด์ตอบอย่างลังเล","เนื่องจากตอนนี้มีคนจำนวนมากที่กว้านซื้อข้าวสาลี ไม่ว่าจะเป็นพ่อค้าหรือแม้กระทั่งประชาชนทั่วไป ทำให้ในระยะเวลาอันสั้น เขาจึงไม่สามารถระบุได้ ว่าใครคือผู้บงการอยู่เบื้องหลัง และใครเป็นเพียงแค่พวกที่ตามกระแส เพื่อหวังจะกอบโกยผลประโยชน์ แต่สิ่งที่สามารถยืนยันได้ก็คือ จะต้องมีบรรดาขุนนางของอาณาจักรจำนวนมาก เข้าไปมีส่วนเกี่ยวข้องด้วยอย่างแน่นอน","แต่เขาก็ได้ส่งพ่อมดจิตวิญญาณออกไปสืบสวนแล้ว และเชื่อว่าอีกไม่นาน ก็คงจะได้เรื่อง","“พวกขุนนาง...”","สีหน้าของลินน์เปลี่ยนเป็นเย็นชาในทันที","ช่วงนี้เขามัวแต่วุ่นอยู่กับการรับมือกับจักรวรรดิและศาสนจักร จนเกือบจะลืมไปเลย ว่าภายในอาณาจักร ยังมีกลุ่มปลิงดูดเลือดที่คอยสูบเลือดสูบเนื้อจากดินแดนของตนเอง โดยที่ไม่ต้องทำงานทำการอะไรเลย","ก่อนหน้านี้ สาเหตุที่เขาไม่จัดการเก็บกวาดคนพวกนี้ให้สิ้นซาก ก็เป็นเพราะพวกพ่อมดเพิ่งจะเข้ามายึดครองอาณาจักรได้ไม่นาน ยังไม่ได้รับความไว้วางใจจากประชาชน หากผลีผลามจัดการกับคนพวกนี้ มันอาจจะทำให้สถานการณ์ที่เพิ่งจะสงบลง กลับมาวุ่นวายอีกครั้ง","อีกอย่าง ไม่ใช่ว่าขุนนางทุกคนจะหัวโบราณไปเสียหมด ลูกหลานขุนนางบางคนที่รู้จักปรับตัวและมีความรู้ ก็ยังยินดีที่จะโอบรับยุคสมัยใหม่ ดังนั้น การจะฆ่าคนพวกนี้ทิ้งให้หมด จึงไม่ใช่เรื่องที่สมควรทำนัก","ลินน์ครุ่นคิดอยู่ครู่หนึ่ง ก่อนจะออกคำสั่ง","“ในเมื่อพวกเขายินดีที่จะรับซื้อเสบียงอาหารในราคาสูง งั้นก็ปล่อยให้พวกเขารับซื้อต่อไปเถอะ พวกเราก็ค่อยๆ ปล่อยเสบียงอาหารสำรองออกไปทีละส่วนก็แล้วกัน!”","เขาไม่ได้ตั้งใจจะส่งคนไปจับกุมบรรดาพ่อค้าที่กักตุนข้าวสาลีทั้งหมด เพราะหนึ่งคือคนมันเยอะเกินไป และสองก็คือ อาณาจักรยังไม่มีกฎหมายข้อนี้","แต่นั่นก็ไม่ได้หมายความว่า เขาจะไม่มีวิธีอื่นในการจัดการกับคนพวกนี้","นี่ก็ถือเป็นโอกาสดี ที่จะทำให้บรรดาพ่อค้าที่อยากจะตามกระแส และกอบโกยผลประโยชน์จากความยากลำบากของอาณาจักร ได้รู้ว่าการค้าเสรีนั้นก็มีขีดจำกัด หากข้ามเส้นเมื่อไหร่ ก็ต้องรับผลที่ตามมาให้ได้!","‘071 ช่วยดึงข้อมูลเทคโนโลยีแป้งสังเคราะห์ออกมาให้ข้าที...’","ลินน์นึกในใจ เดิมที เขาไม่คิดที่จะงัดเอาเทคโนโลยีนี้ออกมาใช้เร็วขนาดนี้เลยนะเนี่ย"]},{"n":466,"t":"พวกเราได้ทำลายตำนานความไร้เทียมทานของพวกพ่อมดลงแล้ว!","c":["การที่ลินน์สั่งให้ลอดด์ทยอยนำเสบียงอาหารออกไปขายทีละล็อตนั้น ทำให้บรรดาสมาชิกสภาที่อยู่ที่นั่นต่างก็รู้สึกสับสนเป็นอย่างมาก เพราะวิธีที่จะแก้ไขวิกฤตการณ์ในปัจจุบันได้ดีที่สุด ก็คือการทุ่มเสบียงอาหารราคาถูกจำนวนมากลงสู่ตลาดในรวดเดียว เพื่อให้บรรดาขุนนางและพ่อค้าเสบียงเหล่านั้นรู้ตัวว่าคิดผิดและยอมถอยไปเองต่างหาก","“หรือว่าเจ้าตั้งใจจะฉวยโอกาสนี้ กวาดเอาเงินเก็บของพวกขุนนางและพ่อค้าผู้มั่งคั่งมาให้หมดเลยงั้นรึ?”","ราฟาเอลเอ่ยคาดเดา","“จะว่าอย่างนั้นก็ได้”","ลินน์พยักหน้า ในมุมมองของเขา นี่อาจจะเป็นโอกาสที่หาได้ยากยิ่ง","หากคนพวกนี้เอาแต่นั่งอยู่เฉยๆ ในดินแดนของตนเอง และทำตัวเป็นเจ้าของที่ดินอย่างสงบเสงี่ยม ตัวเขาเองก็คงจะหาเหตุผลมากำจัดเศษซากของยุคสมัยเก่าเหล่านี้ได้ยากเหมือนกัน","“แต่ถ้าทำแบบนั้น ราคาอาหารที่พุ่งสูงขึ้น ก็อาจจะส่งผลกระทบต่อความมั่นคงของทั้งอาณาจักรได้นะ”","สมาชิกสภาคนหนึ่งพูดด้วยความขมวดคิ้ว ตอนนี้ราคาขนมปังหนึ่งก้อน ได้พุ่งขึ้นไปถึงห้าเท่าของราคาเดิมแล้ว","หากมันพุ่งขึ้นไปถึงสิบเท่า หรือยี่สิบเท่า จะต้องเกิดความวุ่นวายขึ้นอย่างแน่นอน","“เรื่องนี้ไม่ต้องกังวลไป ขอเพียงแค่พวกเราเพิ่มการจัดหาอาหารให้กับพวกโรงงาน เหมืองแร่ และสถาบันเวทมนตร์ จากเดิมวันละหนึ่งมื้อ เป็นวันละสามมื้อก็พอแล้ว!”","ลินน์พูดด้วยน้ำเสียงหนักแน่น","“อาณาจักรนี้ไม่มีทางวุ่นวายหรอก!”","ตอนนี้ ประชาชนส่วนใหญ่ของอาณาจักร ล้วนถูกผนวกรวมเข้าสู่ระบบการทำงานของเมืองเวทมนตร์ไปหมดแล้ว ไม่ว่าจะเป็นกองทัพ การก่อสร้างทางรถไฟ โรงงานต่างๆ รวมถึงสถาบันเวทมนตร์สำหรับคนทั่วไป ซึ่งครอบคลุมประชากรมากกว่าเก้าในสิบส่วน ของดินแดนทางภาคตะวันออก ภาคกลาง และภาคใต้ของอาณาจักร ที่อยู่ภายใต้การปกครองของพวกพ่อมด!","ส่วนพวกขุนนางและพ่อค้าที่เหลือนั้น ไม่ได้อยู่ภายใต้การควบคุมของพวกเขา และคนเหล่านี้ต่างก็มีทรัพย์สินอยู่ไม่น้อย จึงไม่จำเป็นที่พวกเขาจะต้องไปเป็นกังวลแทน","แผนการแจกจ่ายอาหารให้กับประชาชนทุกคนอย่างใจป้ำของลินน์ ทำให้ราฟาเอลถึงกับอ้าปากค้าง","หากตามโรงงานต่างๆ มีอาหารให้กินครบสามมื้อ แล้วใครมันจะยังไปซื้อข้าวสาลีและขนมปังกันอีกล่ะ?","แน่นอนว่าก็ต้องเป็นคนที่พยายามจะปั่นราคาอาหารยังไงล่ะ...","จู่ๆ ราฟาเอลก็คิดถึงจุดนี้ขึ้นมาได้","สิ่งที่ลินน์ทำ เทียบเท่ากับการควบคุมขอบเขตความรุนแรงของสงครามเสบียงอาหาร ให้อยู่ในระดับที่กำหนดไว้ หรือจะพูดอีกอย่างหนึ่งก็คือ เป็นการตัดขาดจากประชาชนทั่วไปโดยสิ้นเชิง และเปลี่ยนให้มันกลายเป็นการเผชิญหน้ากันโดยตรง ระหว่างสภาเวทมนตร์กับบรรดาขุนนางและพ่อค้าผู้มั่งคั่ง!","“แต่ด้วยเสบียงอาหารที่พวกเรามีอยู่ในมือ มันจะเพียงพอจริงๆ หรือ?”","จอมเวทผู้ยิ่งใหญ่อารัดเอ่ยถามด้วยความกังวล","ทางหนึ่ง สภาเวทมนตร์จะต้องรับผิดชอบในการจัดหาเสบียงอาหารให้กับคนทั้งอาณาจักร ส่วนอีกทางหนึ่ง ก็ยังต้องแบ่งเสบียงอาหารจำนวนมาก เพื่อไปทำสงครามราคากับบรรดาพ่อค้าและขุนนางเหล่านั้นอีก","“หากพึ่งพาแค่ข้าวสาลีเพียงอย่างเดียว แน่นอนว่ามันย่อมไม่พอหรอก”","มุมปากของลินน์เผยรอยยิ้มบางๆ ออกมา ก่อนจะพูดขึ้น","“แต่โชคดีที่พวกเราสามารถใช้เวทมนตร์ ในการสร้างขนมปังขึ้นมาได้!”","ใช้เวทมนตร์สร้างขนมปังงั้นรึ?","คำพูดนี้ ทำให้บรรดาสมาชิกสภาที่อยู่ที่นั่น ต่างก็ตกตะลึงกันไปตามๆ กัน","“ท่านลินน์ ตอนนี้ไม่ใช่เวลามาพูดเล่นนะ!”","อารัดอดไม่ได้ที่จะพูดแทรกขึ้นมา","แม้ว่าเวทมนตร์จะสามารถทำอะไรได้หลายอย่าง และถึงขั้นจำลององค์ประกอบธาตุต่างๆ ขึ้นมาได้ แต่มันก็ไม่อาจนำมาใช้ทดแทนสสารที่มีอยู่จริงได้หรอก!","การจะพึ่งพาเวทมนตร์ เพื่อมาแก้ปัญหาเรื่องเสบียงอาหารโดยตรง มันก็เป็นแค่เรื่องเพ้อฝันชัดๆ!","ส่วนบรรดาท่านประธานสภา ต่างก็มีสีหน้าเคร่งขรึม เพราะรู้ดีว่าดาวรุ่งแห่งเวทมนตร์ผู้นี้ กำลังทำการวิจัยเกี่ยวกับการเปลี่ยนพลังงานให้กลายเป็นสสารอยู่ การใช้เวทมนตร์มาแก้ปัญหาเรื่องอาหาร จึงไม่ใช่สิ่งที่เป็นไปไม่ได้เสียทีเดียว","แต่ตามที่ลินน์เคยพูดเอาไว้ การจะสร้างสสารขึ้นมาเพียงหนึ่งกรัม จะต้องใช้พลังงานเทียบเท่ากับการร่ายเวทมนตร์ระเบิดนิวเคลียร์หนึ่งครั้ง การจะพึ่งพาสิ่งนี้ เพื่อนำมาเลี้ยงประชากรกว่าสามล้านคนของอาณาจักร จึงดูเหมือนจะเป็นเรื่องที่เป็นไปไม่ได้เลย","“เอาเป็นว่า ข้ามีรูปแบบเวทมนตร์ในการสร้างขนมปังอยู่แล้ว ขอเวลาอย่างมากที่สุดแค่หนึ่งสัปดาห์ ข้าก็จะสามารถทำให้มันสมบูรณ์แบบได้อย่างแน่นอน!”","ลินน์พูดรับประกันด้วยความมั่นใจ","เพื่อตอบสนองความต้องการในการเดินทางข้ามดวงดาว ทางสหพันธ์ได้ทุ่มเทความพยายามอย่างมาก ในการพัฒนาเทคโนโลยีการสังเคราะห์แป้งเทียม และการเพาะเลี้ยงเซลล์เนื้อสัตว์ ซึ่งงานวิจัยแต่ละอย่าง ล้วนมีความก้าวหน้าเป็นอย่างมาก การจะนำเทคโนโลยีเหล่านี้มาดัดแปลงให้เป็นเวทมนตร์ จึงไม่ใช่เรื่องยากเลย แถมวัตถุดิบที่ต้องใช้ ก็ยังหาได้ง่ายตามท้องถิ่นทั่วไปอีกด้วย","เมื่อเห็นลินน์มีความมั่นใจเช่นนั้น ราฟาเอลและคนอื่นๆ ก็หันมามองหน้ากัน","การใช้เวทมนตร์เพื่อสร้างอาหารขึ้นมา ซึ่งเป็นสิ่งที่ขัดแย้งกับสามัญสำนึกโดยสิ้นเชิง แต่เมื่อมันออกมาจากปากของดาวรุ่งแห่งเวทมนตร์ผู้นี้ มันกลับดูเหมือนว่า เพียงแค่ทำการวิจัยสักหน่อย ก็จะสามารถพัฒนามันขึ้นมาได้แล้ว","บรรดาท่านประธานสภาต่างก็รู้สึกจนปัญญาที่จะพูด","ทำได้เพียงแค่บอกว่า ความเร็วในการพัฒนาเวทมนตร์บทใหม่ของคนบางคนนั้น มันเร็วเกินไปจริงๆ","ตัวอย่างเช่น สมการแปรสภาพเวทมนตร์ ที่ใช้สำหรับการเลื่อนระดับขึ้นเป็นตัวตนระดับตำนาน นับตั้งแต่ตอนที่พวกเขาจับกุมตัวผู้พิพากษาสูงสุดโจชัวมาได้ ก็ใช้เวลาเพียงแค่เดือนกว่าๆ เท่านั้น แถมเขายังสามารถแบ่งเวลา ไปวาดพิมพ์เขียวของดวงอาทิตย์เทียมออกมาได้อีก...","ไม่รู้จริงๆ ว่าสมองของเขาถูกสร้างขึ้นมายังไง...","แฮร์รอฟแอบทอดถอนใจอยู่เงียบๆ ก่อนจะตัดสินใจพูดขึ้นมา","“ในเมื่อเจ้ามีความมั่นใจเต็มเปี่ยม ว่าจะสามารถแก้ปัญหาเรื่องเสบียงอาหารได้ งั้นก็เอาตามที่เจ้าว่ามาก็แล้วกัน!”","...","ในวันรุ่งขึ้นหลังจากที่การประชุมเสร็จสิ้น ภายใต้การจัดการของลอดด์ ข้าวสาลีล็อตแรกจำนวนสิบห้าตัน ก็ถูกนำออกมาขายในราคาที่ต่ำกว่าราคาตลาดเล็กน้อย นั่นก็คือกิโลกรัมละแปดเหรียญทองแดง และหลังจากนั้นเพียงแค่ครึ่งชั่วโมง มันก็ถูกกวาดซื้อไปจนหมดเกลี้ยง!","ตามมาด้วยข้าวสาลีจำนวนยี่สิบตัน สามสิบตัน...ห้าสิบตัน และราคาของมันก็ค่อยๆ เพิ่มสูงขึ้นเรื่อยๆ จนกระทั่งไปหยุดอยู่ที่ราคายี่สิบเหรียญทองแดง!","แต่ถึงกระนั้น ทันทีที่ข้าวสาลีถูกขนส่งไปยังเมืองต่างๆ มันก็ยังคงถูกแย่งชิงกันซื้อไปจนหมดอยู่ดี นั่นก็เพราะราคาตลาดของอาหารในตอนนี้ มันสูงกว่าราคาขายของลอดด์มาก ขอเพียงแค่นำมันไปขายต่อ พวกเขาก็จะได้รับผลกำไรเป็นเท่าตัวแล้ว!","บรรดาพ่อค้าผู้มั่งคั่งและขุนนางใหญ่ของอาณาจักร แต่ละคนต่างก็กว้านซื้อเสบียงราวกับคนบ้า หลายคนถึงขั้นยอมทุ่มเงินเก็บทั้งหมดที่มี เพื่อนำมาซื้อเสบียงอาหาร!","เวลาเพียงแค่ไม่กี่วัน ราคาข้าวสาลีหนึ่งกิโลกรัม ก็ได้พุ่งสูงขึ้นเป็นห้าสิบเหรียญทองแดง ซึ่งเพิ่มขึ้นจากเดิมถึงยี่สิบห้าเท่าตัว!","และราคาของขนมปังขาวหนึ่งถุง ก็พุ่งทะยานไปถึงหนึ่งเหรียญเงิน!","แม้แต่ขนมปังดำที่เมื่อไม่กี่วันก่อน ที่แม้แต่สุนัขก็ไม่ยอมกิน ก็ยังมีราคาสูงถึงสี่สิบเหรียญทองแดง!","นั่นหมายความว่า คนงานที่ทำงานอย่างหนักหน่วงอยู่ในโรงงานเวทมนตร์ ค่าจ้างตลอดทั้งเดือนของพวกเขา จะสามารถนำมาซื้อขนมปังขาวได้เพียงแค่ไม่กี่ถุงเท่านั้น ซึ่งมันไม่พอแม้แต่จะเลี้ยงปากท้องของตัวเองด้วยซ้ำ","ในขณะเดียวกัน ภายในป้อมปราการของเมืองหลวง มาร์ควิสมอร์แทนก็ชูแก้วไวน์ขึ้นสูง เขามองไปยังบรรดาขุนนางที่มาร่วมการประชุมลับในครั้งนี้ ก่อนจะพูดด้วยน้ำเสียงฮึกเหิม","“ทุกท่าน ตอนนี้พวกเราได้รับชัยชนะอย่างสมบูรณ์แบบแล้ว ป่านนี้ สภาเวทมนตร์คงจะกำลังหัวหมุนกันอยู่เป็นแน่?”","เอิร์ลเฮลเดอร์รีบพูดสนับสนุนขึ้นมาทันที","“สติปัญญาของท่านมาร์ควิสมอร์แทน จะไปเทียบกับพวกพ่อมดที่เอาแต่วิจัยศาสตร์มืดเหล่านั้นได้อย่างไรกันล่ะ คนพวกนั้นคงจะไม่รู้ด้วยซ้ำว่าเศรษฐกิจคืออะไร...”","ขุนนางคนอื่นๆ ต่างก็เอ่ยปากยกย่องแผนการอันแยบยลของมาร์ควิสมอร์แทนกันอย่างพร้อมเพรียง บางคนถึงกับแอบเสียใจ ที่ตัวเองระมัดระวังมากเกินไป หากพวกเขาเปลี่ยนทรัพย์สินทั้งหมดให้เป็นเสบียงอาหารตั้งแต่เนิ่นๆ ป่านนี้ ผลกำไรของพวกเขาก็คงจะเพิ่มขึ้นเป็นหลายสิบเท่าแล้ว!","ท่ามกลางเสียงเยินยอและเสียงสนับสนุน มอร์แทนก็มีรอยยิ้มอย่างพึงพอใจปรากฏขึ้นบนใบหน้า เขาจิบไวน์แดงในแก้วเบาๆ ก่อนจะเอ่ยถามถึงสถานการณ์การกว้านซื้อข้าวสาลีในปัจจุบัน","คนรับใช้ที่ยืนอยู่ด้านข้าง รีบตอบกลับด้วยความตื่นเต้น","“เรียนท่านมาร์ควิสมอร์แทน ตอนนี้พวกเราใช้เหรียญทองของจักรวรรดิไปทั้งหมดเจ็ดหมื่นเหรียญ เพื่อกว้านซื้อเสบียงอาหารให้เพียงพอต่อประชากรทั้งอาณาจักรเป็นเวลาสองเดือน นอกจากนี้ ยังมีบรรดาพ่อค้าที่กว้านซื้อตามกระแส หรือพวกที่หวังจะกอบโกยผลประโยชน์จำนวนมาก ก็กำลังกว้านซื้อเสบียงอาหารอย่างบ้าคลั่งเช่นกัน ซึ่งหากประเมินอย่างระมัดระวังที่สุด ตอนนี้พวกเราก็ได้กว้านซื้อข้าวสาลีไปมากพอ ที่จะเลี้ยงประชากรกว่าสามล้านคน เป็นเวลาครึ่งปีแล้วขอรับ!”","“ดี ดีมาก!”","มอร์แทนพยักหน้าด้วยความพอใจ","“แต่ว่าท่านมอร์แทน มันไม่เหมือนกับที่พวกเราคาดการณ์เอาไว้เลยนะขอรับ บรรดาคนยากจนภายในเมืองหลวง ดูเหมือนจะไม่มีทีท่าว่าจะก่อความวุ่นวายขึ้นมาเลย”","ไวส์เคานต์สเคอร์พูดอย่างลังเล","ตามการคาดการณ์ของพวกเขาก่อนหน้านี้ ตอนนี้พวกคนยากจนที่ซื้อข้าวสาลีไม่ไหว ควรจะทนไม่ได้กันแล้วถึงจะถูก","“ในสายตาของข้า ต่อให้ต้องอดตาย พวกชั้นต่ำเหล่านั้น ก็คงจะไม่กล้าลุกขึ้นมาต่อต้านพวกพ่อมดที่ครอบครองศาสตร์มืดหรอก ต่อให้จะซื้อขนมปังขาวไม่ไหว พวกเขาก็สามารถซื้อขนมปังดำมาผสมกับหญ้ากินประทังชีวิตไปวันๆ ได้ หรือถ้าแย่กว่านั้น ก็แค่แทะหญ้ากิน ไม่ใช่ว่าจะอยู่ไม่ได้สักหน่อย?”","เอิร์ลเบลล์ส่ายหน้า","เขารู้สึกว่ามอร์แทนและคนอื่นๆ ประเมินความอดทนและความสามารถในการปรับตัวของพวกคนยากจนต่ำเกินไป ในอดีต ตอนที่ดินแดนของเขาเกิดความอดอยาก เขาไม่เคยมอบเสบียงอาหารให้พวกมันเลยแม้แต่เมล็ดเดียว แต่พวกมันบางคนก็ยังสามารถเอาชีวิตรอดมาได้ไม่ใช่หรือ?","“ดูเหมือนว่าตอนนี้ ราคาของข้าวสาลีจะยังสูงไม่พอสินะ!”","มอร์แทนแกว่งแก้วไวน์ในมือไปมา พร้อมกับพูดด้วยความขบขัน","พวกคนยากจนเหล่านั้น ยังสามารถซื้อขนมปังดำมากินได้ แบบนี้มันจะไปใช้ได้ยังไงล่ะ?","เฮลเดอร์และคนอื่นๆ ต่างก็ส่งเสียงเรียกร้อง ให้เพิ่มราคาของขนมปังดำให้สูงกว่าหนึ่งเหรียญเงิน เพื่อให้พวกชั้นต่ำเหล่านั้น ต่อให้ทำงานจนตาย ก็ไม่มีปัญญาซื้อได้แม้แต่ไม่กี่ก้อน","อันที่จริง พวกเขาต่างก็รู้สึกไม่พอใจกับสถานการณ์ในปัจจุบันของเมืองหลวงมาตั้งนานแล้ว ต้องรู้ก่อนนะ ว่าในอดีต ขนมปังขาวเคยเป็นอาหารสุดพิเศษ สำหรับพวกขุนนางเท่านั้น แต่หลังจากที่พวกพ่อมดมาถึง แม้แต่สุนัขในเมืองหลวง ก็ยังสามารถกินขนมปังขาวได้ ดังนั้น ตอนนี้สิ่งที่พวกเขาทำ ก็เป็นเพียงแค่การทำให้พวกคนยากจนเหล่านั้น กลับไปใช้ชีวิตแบบเดิมก็เท่านั้น","ท่ามกลางเสียงตะโกนด้วยความตื่นเต้นของฝูงชน คนรับใช้ผู้นั้นกลับพูดขึ้นมาอย่างลังเล","“ท่านมาร์ควิสมอร์แทน ตอนที่ข้าให้กองคาราวานสินค้าไปกว้านซื้อเสบียงอาหาร ข้าได้สืบทราบข้อมูลบางอย่างมาขอรับ”","“ข้าได้ยินพวกคนงานพูดกัน ว่าโรงงานของพวกพ่อมด ยินดีที่จะจัดหาอาหารให้กินฟรีครบทั้งสามมื้อเลยขอรับ”","คนรับใช้พูดด้วยความระมัดระวัง","รอยยิ้มบนใบหน้าของมอร์แทนชะงักไปเล็กน้อย เขาเลิกคิ้วขึ้นเล็กน้อย แต่ไม่นานก็กลับมาเป็นปกติ พร้อมกับสีหน้าเยาะเย้ยที่รุนแรงยิ่งกว่าเดิม","“ดูเหมือนว่าเพื่อรักษาความมั่นคงของอาณาจักร สภาเวทมนตร์จะคิดหาวิธีที่มีประโยชน์ออกมาได้จริงๆ สินะ แค่ไม่รู้ว่ากับคนหลายล้านคนนี้ พวกเขาจะสามารถเลี้ยงปากท้องของคนพวกนี้ไปได้อีกนานแค่ไหนกัน!”","บรรดาขุนนางที่อยู่ที่นั่น ไม่ได้รู้สึกหวาดกลัวต่อแผนการจัดหาอาหารให้ประชาชนทุกคนอย่างใจป้ำของสภาเวทมนตร์เลยแม้แต่น้อย เพราะท้ายที่สุด จากการที่อีกฝ่ายมักจะนำข้าวสาลีจำนวนมาก ออกมาขายในราคาถูกอยู่บ่อยๆ ก็สามารถมองออกได้เลย ว่าสภาเวทมนตร์ยังคงต้องการที่จะกดราคาอาหารให้ต่ำลงอยู่!","ไวส์เคานต์สเคอร์ก็รายงานข่าวดีให้ทุกคนได้ทราบเช่นกัน","“พวกท่านอาจจะยังไม่รู้ สายลับที่ข้าส่งไปสืบมาได้ความว่า หลังจากที่พวกพ่อมดปล่อยข้าวสาลีรวมทั้งหมดหนึ่งร้อยตัน ออกมายังเมืองต่างๆ ของอาณาจักรในช่วงเช้าแล้ว พอตกดึก พวกเขาก็แอบส่งคนออกมากว้านซื้อเสบียงอาหารกลับไป...”","“เห็นไหมล่ะ นึ่เป็นข้อพิสูจน์ได้เป็นอย่างดี ว่าสิ่งที่พวกเราคาดการณ์นั้นถูกต้อง เสบียงอาหารในมือของสภาเวทมนตร์นั้นไม่เพียงพอแล้วจริงๆ”","มอร์แทนหัวเราะเสียงดัง","ในเมื่อสภาเวทมนตร์ไม่มีข้าวสาลีเพียงพอ และต้องการที่จะสร้างความสมดุลให้กับราคาอาหาร วิธีเดียวที่จะทำได้ ก็คือการแอบออกมากว้านซื้อเสบียงอาหาร เพื่อทำทีว่าพวกเขายังมีเสบียงอาหารสำรองอยู่อย่างเพียงพอ","“แล้วพวกมันเตรียมที่จะใช้เงินเท่าไหร่ในการซื้อคืนล่ะ?”","เฮลเดอร์เอ่ยถามด้วยรอยยิ้มเย้ยหยัน","พวกพ่อมดได้สังหารขุนนางในดินแดนภาคตะวันออกของอาณาจักรไปตั้งมากมาย แถมยังปล้นชิงทรัพย์สินของพวกเขาไปอีก ตอนนี้ถึงเวลาที่จะต้องทวงคืนแล้ว!","“กิโลกรัมละยี่สิบห้าเหรียญทองแดงขอรับ!”","สเคอร์พูดด้วยสีหน้าประหลาดใจ","เอิร์ลเฮลเดอร์แทบจะคิดว่าตัวเองฟังผิดไป","ส่วนขุนนางคนอื่นๆ ต่างก็มีสีหน้าตกตะลึงเช่นกัน","“ล้อกันเล่นหรือเปล่า พวกพ่อมดพวกนี้เป็นบ้าไปแล้วงั้นรึ?”","เอิร์ลเฮลเดอร์พูดด้วยความไม่อยากจะเชื่อ","ตอนนี้ ราคาของข้าวสาลีหนึ่งกิโลกรัม ได้พุ่งทะลุห้าสิบเหรียญทองแดงไปนานแล้ว แม้แต่ราคาที่ทางสภาเวทมนตร์ปล่อยออกมาเอง ก็ยังสูงกว่าสี่สิบห้าเหรียญทองแดง แต่ตอนนี้ อีกฝ่ายกลับต้องการที่จะซื้อมันกลับไป ในราคาเพียงแค่ครึ่งเดียวเนี่ยนะ...","คนโง่ที่ไหนมันจะไปยอมขายให้ล่ะ?","คนที่คิดเรื่องนี้ขึ้นมาได้ สมองคงจะมีปัญหาเป็นแน่!","“พวกพ่อมดนี่มันช่างโง่เขลาเบาปัญญา และโลภมากซะจริง...”","มอร์แทนพูดเหน็บแนม แต่เมื่อลองคิดดู มันก็เป็นเรื่องปกติ กลุ่มคนชั้นต่ำที่เดิมทีเอาแต่หลบซ่อนตัวอยู่ในมุมมืด แต่จู่ๆ ก็ได้ขึ้นมาปกครองอาณาจักร จะไปคิดหน้าคิดหลังให้รอบคอบได้อย่างไรกัน?","ดังนั้น พวกเขาถึงได้คิดอะไรออกก็ทำอย่างนั้น โดยไม่มีตรรกะใดๆ เลยแม้แต่น้อย","เมื่อตระหนักได้ถึงจุดนี้ มอร์แทนก็รู้สึกโล่งใจเป็นอย่างมาก เขาจึงดื่มไวน์แดงในแก้วจนหมด ก่อนจะพูดถึงอนาคตของอาณาจักร ภายใต้การปกครองของบรรดาขุนนางอย่างพวกเขาด้วยเสียงอันดัง","ขุนนางเพียงไม่กี่คน กลับรู้สึกว่าการกระทำอันผิดปกติในการรับซื้อเสบียงอาหารราคาถูกของสภาเวทมนตร์ อาจจะไม่ได้เรียบง่ายอย่างที่คิด แต่ท่ามกลางบรรยากาศแห่งชัยชนะอันน่าหลงใหลนี้ ความกังวลเพียงเล็กน้อยของพวกเขา ก็ถูกลืมเลือนไปอย่างรวดเร็ว","ไม่ว่าจะพูดอย่างไร พวกเขาก็ได้รับชัยชนะครั้งยิ่งใหญ่อย่างที่ไม่เคยมีมาก่อน แถมยังไม่ต้องกังวล ว่าจะถูกกวาดล้างอีกด้วย","ในตอนนี้ คนที่กว้านซื้อข้าวสาลี ไม่ได้มีแค่ขุนนางอย่างพวกเขาเพียงกลุ่มเดียว พวกที่แอบปั่นราคาอาหารในตอนแรก ก็ถูกจัดการไปหมดแล้ว พวกพ่อมดก็คงจะสืบมาไม่ถึงตัวของพวกเขาในเร็วๆ นี้หรอก","ต่อให้ในกรณีที่เลวร้ายที่สุด สภาเวทมนตร์สามารถสืบหาความจริงได้ แต่ในขณะที่อาณาจักรกำลังจะเกิดความวุ่นวายครั้งใหญ่ขึ้น พวกเขาจะยังกล้าลงมือกับบรรดาขุนนางที่มีจำนวนมากขนาดนี้เชียวหรือ?","ดีไม่ดี พวกนั้นอาจจะต้องมาพึ่งพา ให้พวกเขาช่วยบริจาคเสบียงอาหารเพื่อกอบกู้อาณาจักรด้วยซ้ำ...","“แด่เกียรติยศของขุนนาง!”","มอร์แทนที่กำลังมึนเมา ชูแขนขวาขึ้นสูง แล้วตะโกนด้วยความฮึกเหิม","เฮลเดอร์เองก็ชูแก้วไวน์ขึ้นด้วยความตื่นเต้น และดื่มรวดเดียวจนหมดแก้ว ก่อนจะตะโกนตามเสียงดัง","“แด่เกียรติยศของขุนนาง!”","...","ในขณะที่บรรดาขุนนางในเมืองหลวง กำลังจัดงานเลี้ยงฉลองกันอยู่นั้น ภายในเมืองน้ำมันดิน ลอดด์ที่เพิ่งจะรวบรวมข้อมูลเสร็จ ก็ก้าวเท้าเข้าไปในคฤหาสน์หลังใหญ่","ที่นี่เคยเป็นคฤหาสน์ของเอิร์ลผู้ยิ่งใหญ่ในพื้นที่ ซึ่งถูกสร้างขึ้นมาอย่างหรูหราอลังการ แต่เจ้าของคนก่อนของมัน กลับถูกจับแขวนคออยู่ที่หอคอยของเมืองไปนานแล้ว และตอนนี้ มันก็กลายเป็นคฤหาสน์ชั่วคราวของดาวรุ่งแห่งเวทมนตร์","แต่สิ่งที่แตกต่างไปจากตอนที่เขามาครั้งที่แล้ว ก็คือที่หน้าประตู กลับมีป้ายโผล่ขึ้นมาป้ายหนึ่ง ซึ่งมีข้อความเขียนเอาไว้ว่า","【ระวังสุนัขดุ ห้ามบุคคลภายนอกเข้า】","“ท่านลินน์เริ่มเลี้ยงสุนัขตั้งแต่เมื่อไหร่กัน”","ลอดด์แอบพึมพำกับตัวเองด้วยความแปลกใจ พร้อมกับครุ่นคิดอยู่ในใจ ว่าครั้งหน้าที่มา เขาควรจะหาสุนัขมาให้ท่านลินน์สักตัวดีหรือไม่","เขาเคยได้ยินมาว่า พวกขุนนางใหญ่บางคนของจักรวรรดิ ก็มีความชอบในการเลี้ยงสุนัขดุร้ายอยู่บ้าง แถมมันยังไม่ใช่สุนัขสายพันธุ์ธรรมดา แต่เป็นสุนัขที่มีสายเลือดของสัตว์เวทมนตร์ปะปนอยู่ ซึ่งรูปลักษณ์ของพวกมัน ก็ดูน่าเกรงขามเป็นอย่างมาก","แต่ความคิดนี้ ก็ต้องพังทลายลงในทันที ที่เขาก้าวเท้าเข้าไปในคฤหาสน์ เพราะลอดด์พบว่า ‘สุนัขดุ’ ตามป้ายบอกนั้น กลับกลายเป็นสัตว์ร้ายขนาดยักษ์สีน้ำเงิน ที่มีความสูงกว่าสองเมตร และมีความยาวกว่าห้าเมตร","สิ่งที่น่าประหลาดที่สุด ก็คือร่างกายของมันเป็นแบบกึ่งโปร่งใส และบนพื้นผิวของมัน ก็มีสิ่งที่คล้ายกับเปลวไฟที่ไหลเวียนอยู่ตลอดเวลา ซึ่งทำหน้าที่เป็น ‘เส้นขน’ โดยก้อนอิฐที่เท้าทั้งสี่ของมันเหยียบลงไป ถึงกับถูกความร้อนสูงเผาไหม้จนกลายเป็นลาวา กลิ่นอายอันน่าสะพรึงกลัวที่แผ่ออกมา ทำให้ลอดด์อดไม่ได้ที่จะกลืนน้ำลายลงคอด้วยความยากลำบาก","โชคดีที่มูโตไม่มีความสนใจในสัตว์สองขา ที่ไม่มีแม้แต่พลังเวทมนตร์อยู่ในร่างกายเลยแม้แต่น้อย เมื่อเห็นว่าอีกฝ่ายไม่น่าจะมีภัยคุกคามอะไร มันก็หลับตาลงอย่างเกียจคร้าน","ลอดด์เช็ดเหงื่อเย็นๆ บนหน้าผากออก แล้วเดินอ้อมไปอีกทางอย่างระมัดระวัง หลังจากที่เดินเข้าไปในห้องด้านใน ไม่นานเขาก็ได้ยินเสียงถกเถียงกันดังระงม ซึ่งหนึ่งในนั้น ก็คือเสียงของลินน์","“พวกท่านคิดว่าอาหารคืออะไร ทำไมมันถึงสามารถรักษากิจวัตรประจำวันของสิ่งมีชีวิตเอาไว้ได้ และมันเติบโตขึ้นมาได้อย่างไร?”"]},{"n":467,"t":"นี่คือสุดยอดผลงานระหว่างเวทมนตร์และเทคโนโลยี ความลับขั้นสุดยอดของสงครามเสบียงอาหาร เวทมนตร์สร้างขนมปัง!","c":["ช่วงบ่าย พ่อมดจากสถาบันอิเยตานับสิบคนกำลังมารวมตัวกันอยู่ภายในห้องทดลองเวทมนตร์อันกว้างขวาง โดยพวกเขากำลังครุ่นคิดถึงความหมายที่แฝงอยู่ในคำพูดของดาวรุ่งแห่งเวทมนตร์ผู้นี้","แต่เอล็อคที่ยังหนุ่มแน่นและเต็มไปด้วยความกระตือรือร้น กลับไม่ได้มีความกังวลมากมายขนาดนั้น เขารีบพูดตอบกลับไปในทันที","“อาหารก็ต้องเป็นข้าวสาลี ถั่ว และข้าวโพดยังไงล่ะ...”","ลิเดียเองก็ชูมือขึ้นสูง แล้วเอ่ยตอบเช่นกัน","“พวกเราต้องเอาเมล็ดพันธุ์ไปปลูกลงในดิน จากนั้นก็รดน้ำ ใส่ปุ๋ย และทำซ้ำไปเรื่อยๆ จนกว่ามันจะเติบโตขึ้นมาจากดิน!”","“ไม่เลว จะพูดแบบนั้นก็ได้!”","ลินน์พยักหน้า จากนั้นก็ยิ้ม แล้วถามต่อไปว่า","“แล้วพวกเจ้ารู้หรือไม่ ว่าพืชเปลี่ยนองค์ประกอบธาตุต่างๆ ให้กลายเป็นสารอาหารที่พวกเราสามารถดูดซึมได้ด้วยวิธีใด?”","เอล็อคและลิเดียถึงกับพูดไม่ออกในทันที แม้แต่พ่อมดระดับสามวงแหวนที่เชี่ยวชาญด้านธาตุอย่างฟิลิป ก็ยังต้องชะงักไปกับคำถามของลินน์","ในยามปกติ พวกเขาไม่เคยให้ความสนใจเลยจริงๆ ว่าในกระบวนการเจริญเติบโต ข้าวสาลีมันดูดซับธาตุต่างๆ ในดิน แล้วกลายมาเป็นอาหารที่กินได้ในท้ายที่สุดได้อย่างไร","โชคดีที่ลินน์ก็ไม่ได้คาดหวังให้พวกเขาตอบได้อยู่แล้ว เขาจึงเฉลยคำตอบออกมาโดยตรง","“มันคือการพึ่งพากระบวนการสังเคราะห์ด้วยแสง!”","นี่คือสามัญสำนึกที่ทุกคนในสหพันธ์เมื่อชาติก่อน ต่างก็รู้กันดี!","ในฐานะสิ่งมีชีวิตที่อยู่ล่างสุดของระบบนิเวศ พืชได้ใช้กระบวนการสังเคราะห์ด้วยแสง เพื่อเปลี่ยนคาร์บอนไดออกไซด์และน้ำ ให้กลายเป็นสารอินทรีย์ที่กักเก็บพลังงานเอาไว้ ซึ่งนี่ก็คือแหล่งที่มาของพลังงานขับเคลื่อนสิ่งมีชีวิต!","ในยุคโบราณกาลอันห่างไกล มนุษย์ก็เหมือนกับสัตว์ป่า ที่ต้องพึ่งพาการเก็บของป่าและล่าสัตว์ เพื่อให้ได้มาซึ่งอาหาร พวกเขาได้รับผลกระทบจากสภาพแวดล้อม สภาพอากาศ และโชคชะตาเป็นอย่างมาก ทำให้มันไม่มีความมั่นคงเลยแม้แต่น้อย การต้องทนทุกข์ทรมานจากความหิวโหย จึงถือเป็นเรื่องที่เกิดขึ้นอยู่บ่อยครั้ง","จนกระทั่งได้มีการค้นพบทักษะการทำเกษตรกรรมและการปศุสัตว์ ทำให้พวกเขามีความสามารถในการจัดหาอาหารได้อย่างมั่นคง ซึ่งนี่ก็ได้กลายมาเป็นรากฐานอันแข็งแกร่ง สำหรับการรวมกลุ่มกันเป็นสังคมขนาดใหญ่ และก่อตั้งเป็นประเทศขึ้นมาในภายหลัง","แต่ความมั่นคงแบบนี้ ก็มีขีดจำกัดเช่นกัน บางที แค่เกิดภัยแล้งสักครั้ง หรือเกิดสงครามครั้งใหญ่ขึ้น มันก็สามารถทำลายทุกสิ่งทุกอย่างให้พังทลายลงได้แล้ว!","จนกระทั่งถึงศตวรรษที่ยี่สิบเอ็ด มนุษย์ก็ได้ทำการสังเคราะห์แป้งขึ้นมาโดยตรงภายในห้องทดลองได้เป็นครั้งแรก โดยการใช้เพียงแค่คาร์บอนไดออกไซด์ น้ำ ไฟฟ้า (แสง) และเอนไซม์ตัวเร่งปฏิกิริยาพิเศษอีกชนิดหนึ่งเท่านั้น!","ความสำเร็จนี้ ถือเป็นการปฏิวัติวงการอย่างไม่ต้องสงสัย!","ซึ่งมันหมายความว่า นับตั้งแต่นี้เป็นต้นไป การผลิตอาหารจะหลุดพ้นจากการพึ่งพาดิน แสงแดด และสภาพแวดล้อมโดยตรง เพราะพวกเขาสามารถผลิตมันออกมาเป็นล็อตๆ ได้ เหมือนกับการทำงานในสายพานการผลิต!","แถมประสิทธิภาพยังถูกยกระดับขึ้นไปอีกหลายขั้น!","ต้องรู้ก่อนนะ ว่ากระบวนการสังเคราะห์ด้วยแสงตามธรรมชาติของพืช เพื่อเปลี่ยนสารอนินทรีย์ให้กลายเป็นสารอินทรีย์นั้น จะต้องผ่านปฏิกิริยาทางชีวเคมีที่ซับซ้อนอย่างยิ่งหลายสิบขั้นตอน และต้องใช้เวลาหลายเดือน ซึ่งในทางทฤษฎีแล้ว ประสิทธิภาพในการเปลี่ยนพลังงานของมันก็ต่ำมาก โดยจะอยู่ที่ประมาณร้อยละสองเท่านั้น","แต่การสังเคราะห์แป้งเทียม จะใช้เพียงแค่สิบเอ็ดขั้นตอนเท่านั้น และประสิทธิภาพในการเปลี่ยนพลังงาน ก็ยังเพิ่มขึ้นเป็นร้อยละเจ็ดด้วย","หลังจากเข้าสู่ศตวรรษที่ยี่สิบสอง ด้วยความต้องการในการเดินทางข้ามดวงดาว และการสร้างเตาปฏิกรณ์นิวเคลียร์ฟิวชัน เทคโนโลยีการสังเคราะห์แป้งเทียม ก็ได้นำมาซึ่งการปฏิวัติทางเทคโนโลยีแบบก้าวกระโดดอีกครั้ง ซึ่งอัตราการใช้พลังงานก็ได้พุ่งทะยานขึ้นไปถึงร้อยละยี่สิบ และยังสามารถลดขั้นตอนจากสิบเอ็ดขั้นตอน ให้เหลือเพียงหกขั้นตอนได้ด้วย!","นอกจากนี้ ภายในปัญญาประดิษฐ์สนับสนุน ก็ยังมีเทคโนโลยีเกี่ยวกับการสังเคราะห์แป้งสาลีเทียม แป้งข้าวโพดเทียม และอื่นๆ อีกด้วย ท้ายที่สุดแล้ว พูดง่ายๆ สิ่งเหล่านี้ก็เป็นเพียงแค่การสังเคราะห์จากสารอนินทรีย์บางชนิดก็เท่านั้น แม้ว่าความยากทางเทคโนโลยีจะสูงกว่า 但โดยรวมแล้ว หลักการของมันก็ไม่ได้ต่างกันเลย!","ลินน์อธิบายหลักการของเวทมนตร์ไปด้วย พร้อมกับยื่นมือขวาออกมา","ไอน้ำและคาร์บอนไดออกไซด์ที่มีอยู่ในอากาศ ถูกสกัดออกมาอย่างรวดเร็ว ตามมาด้วยแสงสายฟ้าอันเจิดจ้าที่สว่างวาบขึ้น จากนั้น ธาตุอาหารรองต่างๆ ก็หลอมรวมเข้าด้วยกัน ภายใต้การควบคุมของพลังจิต","ใช้ความว่างเปล่าเป็นหม้อ ใช้พลังเวทมนตร์เป็นตะหลิว เพื่อเปลี่ยนสารอนินทรีย์ให้กลายเป็นสารอินทรีย์...","และลินน์ ก็ได้แสดงเวทมนตร์สร้างขนมปังเทียมของตนเอง ให้พ่อมดนับสิบคนได้เห็นเช่นนั้น!","ผ่านไปประมาณสิบห้าวินาที ผงแป้งละเอียดเล็กๆ ก็เริ่มปรากฏขึ้นกลางอากาศ โดยพวกมันลอยมาบรรจบกัน แล้วรวมตัวกันจนกลายเป็นก้อนกลมๆ","ภาพการสร้างสรรค์สิ่งของจากความว่างเปล่านี้ ทำให้บรรดาพ่อมดจากสถาบันอิเยตา ต่างก็ประหลาดใจเป็นอย่างมาก!","“น้ำ!”","ลินน์เอ่ยปากขึ้นอีกครั้ง ไอน้ำจำนวนมากถูกเปลี่ยนให้กลายเป็นน้ำของเหลว แล้วไหลทะลักเข้าไปในผงแป้ง จากนั้น เขาก็ใช้หัตถ์เวทเพื่อทำการนวดก้อนแป้งอย่างรวดเร็ว ก้อนแป้งกลมๆ บิดเบี้ยวและเปลี่ยนรูปทรงไปมา ภายใต้แรงกดอันมหาศาล และสุดท้าย เขาก็ใช้เทคโนโลยีการให้ความร้อนด้วยไมโครเวฟ เพื่อทำการอบมันโดยตรง","ก้อนแป้งที่เดิมทีมีความหนาเพียงแค่นิ้วเดียว ก็พองตัวขึ้นเมื่อได้รับความร้อน จนกลายมาเป็นขนมปังก้อนสี่เหลี่ยมจัตุรัส ที่มีความหนาถึงสี่นิ้วมือในทันที!","ตั้งแต่ต้นจนจบ เขาใช้เวลาไปเพียงแค่สามนาทีนิดๆ เท่านั้น!","“นี่ก็คือขนมปังเวทมนตร์ของข้าล่ะ!”","ลินน์กระตุ้นการทำงานของหัตถ์เวทเพื่อวางก้อนขนมปังลงบนโต๊ะสี่เหลี่ยม","เอล็อค เควิน ฟิลิป และคนอื่นๆ รีบเข้ามามุงดูทันที สายตานับสิบดวงต่างก็จ้องเขม็งไปยังก้อนขนมปังบนโต๊ะ พวกเขารู้สึกประหลาดใจกับสุดยอดเวทมนตร์ที่ลินน์สร้างขึ้นมาเป็นอย่างมาก...","“มันกินได้หรือเปล่าคะ?”","ลิเดียเอื้อมมือไปจิ้มดู มันสัมผัสได้ถึงความนุ่มนิ่ม ซึ่งไม่เหมือนกับขนมปังที่เธอเคยซื้อตามตลาด ที่ทั้งแข็งจนสามารถนำมาใช้เป็นโล่หรืออาวุธได้เลย","“แน่นอนสิ!”","ลินน์พูดด้วยความขบขัน ไม่อย่างนั้น เขาจะสร้างของพรรค์นี้ขึ้นมาทำไมล่ะ","เมื่อได้ยินคำตอบยืนยันของลินน์ ลิเดียก็รีบฉีกมันออกมาหนึ่งชิ้น แล้วอมเอาไว้ในปากทันที","“เป็นยังไงบ้าง รสชาติพอใช้ได้ไหม?”","ลินน์รีบเอ่ยถาม แม้ว่าเขาจะใส่ธาตุอาหารรองลงไปมากมาย เพื่อเพิ่มคุณค่าทางโภชนาการ แต่มันก็พูดยากว่ารสชาติของมันจะออกมาเป็นเช่นไร","ลิเดียขมวดคิ้ว เธอครุ่นคิดอยู่นานกว่าจะหาคำคุณศัพท์มาอธิบายได้","“กินแล้วรู้สึกเหมือนกำลังกินก้อนเมฆเลยค่ะ!”","คำวิจารณ์ของหญิงสาว ทำให้ฟิลิปและคนอื่นๆ รู้สึกสงสัยเป็นอย่างมาก พวกเขาจึงแบ่งกันชิมคนละคำ จากนั้น พวกเขาก็เข้าใจว่าทำไมลิเดียถึงพูดเช่นนั้น","เพราะขนมปังชนิดนี้ เวลากัดลงไป มันจะให้ความรู้สึกนุ่มฟู ไม่มีความแข็งเลยแม้แต่น้อย และรสสัมผัสของมันถึงขั้นดีกว่าขนมปังขาวเสียด้วยซ้ำ โดยข้อเสียเพียงอย่างเดียว ก็คือมันไม่ค่อยมีรสชาติสักเท่าไหร่นัก","หากสามารถนำไปจิ้มกับซอสถั่วกินคู่กันได้ มันจะต้องเป็นเมนูที่อร่อยล้ำเลิศอย่างแน่นอน!","“ดูเหมือนว่านับตั้งแต่นี้เป็นต้นไป พวกเราก็ไม่จำเป็นต้องมานั่งกลุ้มใจเรื่องเสบียงอาหารอีกแล้วล่ะ!”","ฟิลิปพูดด้วยความตื่นเต้นสุดขีด","เวทมนตร์สร้างขนมปังของลินน์ มันยอดเยี่ยมเกินไปแล้ว ซึ่งนี่ก็หมายความว่า ในอนาคต เมื่อบรรดาพ่อมดต้องเดินทางไกล พวกเขาก็ไม่จำเป็นต้องพกเสบียงอาหารใดๆ ติดตัวไปอีก เพราะหิวเมื่อไหร่ ก็แค่ร่ายเวทสร้างขนมปัง กระหายเมื่อไหร่ ก็แค่ดึงน้ำในอากาศออกมาใช้ มันช่างสะดวกสบายเสียจริงๆ","“ไม่ทราบว่านี่ถือเป็นเวทมนตร์ระดับกี่วงแหวนหรือ? พ่อมดฝึกหัดสามารถใช้งานมันได้หรือไม่? และต้องใช้พลังเวทมนตร์ไปมากน้อยเพียงใด?”","เควินเอ่ยถามถึงปัญหาที่แท้จริง ซึ่งนั่นก็คือความสามารถในการนำไปใช้งานอย่างแพร่หลาย","เรื่องนี้เกี่ยวข้องกับขอบเขตในการใช้งานของเวทมนตร์บทนี้โดยตรง","“จากระดับความยากในการร่ายเวท การจะร่ายเวทสร้างขนมปังเวทมนตร์ให้สมบูรณ์แบบได้ น่าจะถือเป็นเวทมนตร์ระดับสามวงแหวนล่ะมั้ง!”","ลินน์ครุ่นคิด ก่อนจะพูดออกมา","คิ้วของเควินขมวดเข้าหากันเล็กน้อย เพราะพ่อมดระดับสามวงแหวนในสภาเวทมนตร์ เมื่อรวมกันแล้วก็มีเพียงแค่สองพันกว่าคนเท่านั้น ต่อให้พวกเขาทั้งหมด จะมาร่วมกันร่ายเวทมนตร์บทนี้ มันก็ยังไม่เพียงพอที่จะจัดหาอาหารให้กับทั้งอาณาจักรได้อยู่ดี!","โชคดีที่ลินน์รีบพูดต่ออย่างรวดเร็ว","“แต่พวกเราสามารถแยกขั้นตอนต่างๆ ออกจากกัน และสร้างรูปแบบวงเวทเล่นแร่แปรธาตุที่สอดคล้องกันขึ้นมาเพื่อใช้ในการผลิตได้ ซึ่งนั่นก็จะช่วยลดระดับความยากลงไปได้มากเลยทีเดียว”","“หากเป็นเพียงแค่การสังเคราะห์แป้งละก็ แบบนั้นมันก็จะยิ่งง่ายเข้าไปใหญ่เลยล่ะ!”","แน่นอนว่าการพึ่งพาแค่แป้งเพียงอย่างเดียว ย่อมไม่สามารถนำมาสร้างเป็นขนมปังได้ แต่มันกลับไม่มีปัญหาเลยสักนิด หากจะนำมาใช้เป็นอาหารในชีวิตประจำวันของคนยากจน!","เพียงแค่ต้องใช้คาร์บอนไดออกไซด์ น้ำ ไฟฟ้า และเวทมนตร์ก็พอแล้ว!","สองอย่างแรกมีอยู่ทั่วไปทุกหนทุกแห่ง ส่วนสองอย่างหลัง ก็จำเป็นต้องใช้หินสายฟ้า และคริสตัลเวทมนตร์ที่ทางสภาเวทมนตร์สำรองเอาไว้","“แต่ว่า...การทำแบบนั้น มันจะไม่เป็นการสิ้นเปลืองมากเกินไปหรือ?”","เควินพูดด้วยความลังเลอีกครั้ง เสบียงอาหารสำหรับประชากรกว่าสามล้านคนในแต่ละวัน พลังงานที่ต้องสูญเสียไป จะต้องไม่ใช่จำนวนน้อยๆ อย่างแน่นอน!","“วางใจเถอะ อีกไม่นาน พวกเราก็ไม่จำเป็นต้องมานั่งคิดถึงปัญหาเรื่องพลังงานกันอีกแล้วล่ะ”","ลินน์ตบบ่าของฟิลิป พร้อมกับพูดด้วยรอยยิ้ม","เมื่อไม่นานมานี้ พวกเขาเพิ่งจะค้นพบเหมืองคริสตัลเวทมนตร์แห่งใหม่ ส่วนเรื่องพลังงานไฟฟ้า พวกเขาก็กำลังจะมีเตาปฏิกรณ์นิวเคลียร์ฟิวชันที่ใกล้จะสร้างเสร็จแล้วไม่ใช่หรือ?","อันที่จริง เทคโนโลยีอาหารสังเคราะห์ของสหพันธ์ ก็เพิ่งจะถูกนำมาใช้อย่างแพร่หลายอย่างแท้จริง หลังจากที่มีการพัฒนาเทคโนโลยีนิวเคลียร์ฟิวชัน และเทคโนโลยีการทำลายล้างของสสารและปฏิสสารสำเร็จแล้วนั่นเอง!","หลังจากที่ขจัดความสงสัยของเควินและคนอื่นๆ ไปได้แล้ว ลินน์ก็หันหน้าไปมองยังประตู ก่อนจะเอ่ยปากพูดขึ้น","“ลอดด์ เข้ามาสิ!”","เมื่อได้รับคำสั่ง ลอดด์ที่รออยู่ด้านนอกมาเป็นเวลานาน ก็ใช้ขาเทียมของเขาก้าวเดินเข้ามาอย่างรวดเร็ว","หลังจากที่เดินเข้ามา สายตาแรกของเขาก็มองไปยังขนมปังที่ถูกฉีกจนเหลือเพียงครึ่งเดียวบนโต๊ะสี่เหลี่ยม","ในสายตาของลอดด์ ที่มีความรู้ความเข้าใจเกี่ยวกับเวทมนตร์อย่างจำกัด และขนมปังก้อนนี้ ก็คือสิ่งที่ลินน์ใช้เวทมนตร์เสกขึ้นมาจากความว่างเปล่า!","มันคือปาฏิหาริย์แห่งการสร้างสรรค์จากความว่างเปล่า!","มิน่าล่ะ ก่อนหน้านี้ท่านลินน์ถึงได้กล้าสั่งให้เขานำข้าวสาลีสำรองเกือบครึ่งหนึ่ง ออกมาเทขายจนหมดเกลี้ยง ภายในเวลาเพียงไม่กี่วัน!","“เจ้าเองก็มาลองชิมดูสิ!”","ลินน์ยื่นมือออกไป แล้วยัดขนมปังครึ่งก้อนที่เหลือใส่มือของลอดด์","ลอดด์รู้สึกตื่นเต้นเป็นอย่างมาก เขาหักขนมปังออกมาหนึ่งชิ้น แล้วนำเข้าปากโดยตรง ความนุ่มฟูของมัน แทบจะละลายในปากในทันที","“เหมือนกำลังกินก้อนเมฆเลยจริงๆ ด้วย!”","ลอดด์พูดด้วยความทอดถอนใจ","“หากพวกเราสามารถนำขนมปังเวทมนตร์ชนิดนี้ ออกไปวางขายในตลาดได้เป็นจำนวนมากละก็ คงจะไม่มีใครยอมไปซื้อข้าวสาลีกันอีกแน่ๆ”","แค่ไม่รู้ว่า เมื่อบรรดาพ่อค้าและขุนนาง ที่กำลังกว้านซื้อเสบียงกันอย่างบ้าคลั่ง ได้มาเห็นของสิ่งนี้ พวกเขาจะแสดงสีหน้าออกมาแบบไหนกันนะ?","ลอดด์แอบคิดอยู่ในใจ แต่เขาก็ยังไม่ลืมเรื่องสำคัญ เขารีบหยิบซองจดหมายลับออกมาจากอกเสื้อในทันที","“ท่านลินน์ นี่คือรายชื่อคนที่เหล่าพ่อมดจิตวิญญาณของสภาเวทมนตร์รวบรวมมาได้ขอรับ พวกมันก็คือตัวการสำคัญ ที่แอบปั่นราคาอาหาร เพื่อสร้างความวุ่นวายให้กับอาณาจักรในครั้งนี้ขอรับ”","บรรดาขุนนางเหล่านั้นแอบซ่อนตัวอยู่เบื้องหลัง โดยอาศัยการสั่งการให้กองคาราวานสินค้าต่างๆ ไปกว้านซื้อข้าวสาลีจำนวนมาก พวกเขาถึงขั้นลงมือสังหารคนสนิทที่รับหน้าที่ดำเนินการไปหลายคน เพื่อหวังจะตัดความเป็นไปได้ ที่พวกพ่อมดจะสืบสาวมาถึงต้นตอได้","แต่ภายใต้การค้นหาวิญญาณ มันย่อมไม่มีความลับใดๆ ให้ปิดบัง บรรดาพ่อมดจิตวิญญาณเหล่านั้น ต้องใช้เวลาไปหลายวัน กว่าจะสืบสาวไปตามสายจนเจอตัวผู้บงการได้ เพราะท้ายที่สุด บรรดาขุนนางก็ยังคงต้องการที่จะสร้างเรื่องต่อไป พวกเขาจึงหลีกเลี่ยงไม่ได้ที่จะต้องส่งคนไปติดต่อกับกองคาราวานสินค้า","แกรนด์ดยุกการ์ด มาร์ควิสมอร์แทน เอิร์ลเบลล์ เอิร์ลเฮลเดอร์...","รายชื่อในนี้ยาวเหยียดมาก ซึ่งครอบคลุมบรรดาขุนนางใหญ่ทั้งหมดในทางตอนเหนือของอาณาจักรแทบจะทุกคนเลยทีเดียว หากเป็นเมื่อหนึ่งปีก่อน รายชื่อบนนี้แต่ละคน ล้วนมีอิทธิพลมากพอ ที่จะส่งผลกระทบต่อความมั่นคงของทั้งอาณาจักรได้","“นอกจากนี้ ยังมีข้อมูลเกี่ยวกับคนผู้นั้นด้วย จากการตรวจสอบของท่านพ่อมด ดูเหมือนว่าเขาก็จะมีส่วนร่วมในแผนการสร้างความวุ่นวายให้กับอาณาจักรในครั้งนี้ด้วยเหมือนกันขอรับ!”","ลอดด์พูดอย่างมีนัยยะแอบแฝง","ลินน์พยักหน้า เขาไม่ได้รู้สึกแปลกใจอะไรมากนัก หากไม่ได้รับการยินยอมจากอีกฝ่าย บรรดาขุนนางเหล่านั้น จะกล้าทำให้เรื่องราวมันใหญ่โตถึงเพียงนี้ได้อย่างไร","แต่ก็ดีเหมือนกัน แบบนี้เขาจะได้ไม่ต้องเสียเวลาไปหาเหตุผลอีก...","“ตอนนี้พวกเราปล่อยเสบียงอาหารออกไปเท่าไหร่แล้ว?”","ลินน์เก็บม้วนเอกสารในมือลง แล้วเอ่ยถามอย่างสบายๆ","“ข้าวสาลีประมาณเก้าหมื่นตัน รวมเป็นเงินทั้งสิ้นหนึ่งแสนเจ็ดหมื่นสามพันหกร้อยเหรียญทองของจักรวรรดิขอรับ...”","ลอดด์รายงานด้วยความตื่นเต้น","นี่มันปล้นกันชัดๆ!","สิ่งที่สำคัญที่สุดก็คือ ตอนนี้มันเพิ่งจะเริ่มต้นขึ้นเท่านั้น พวกเขายังเหลือข้าวสาลีอีกกว่าครึ่งที่ยังไม่ได้ถูกเทขายออกไป ซึ่งนั่นต่างหากคือของจริง เพราะท้ายที่สุด ตามสถานการณ์ที่เป็นอยู่ในตอนนี้ การที่ราคาของข้าวสาลีหนึ่งกิโลกรัม จะพุ่งสูงขึ้นไปเป็นร้อยหรือสองร้อยเท่า มันไม่ใช่เรื่องง่ายๆ หรอกหรือ?","ลินน์ครุ่นคิดอยู่ครู่หนึ่ง แล้วรู้สึกว่ามันก็น่าจะเพียงพอแล้ว","แม้ว่าบรรดาขุนนางเหล่านั้นจะสะสมความมั่งคั่งมาหลายชั่วอายุคน แต่เงินสดที่พวกเขาสามารถนำออกมาใช้ได้ ก็น่าจะอยู่ที่ประมาณหนึ่งล้านเหรียญทองของจักรวรรดิ ซึ่งบางที พวกเขาอาจจะไม่สามารถซื้อข้าวสาลีทั้งหมดไปได้ด้วยซ้ำ","หลังจากที่พูดถึงข้อมูลอันน่าพึงพอใจจบแล้ว ลอดด์ก็ครุ่นคิด ก่อนจะรายงานข่าวร้ายให้ฟัง","“เนื่องจากราคาข้าวสาลีที่พุ่งสูงขึ้นอย่างบ้าคลั่ง ทำให้ดินแดนทางภาคตะวันตกและภาคเหนือของอาณาจักร เริ่มเกิดภาวะอดอยากครั้งใหญ่ขึ้นแล้วขอรับ”","แม้ในทางทฤษฎี สภาเวทมนตร์จะปกครองทั้งอาณาจักรเอาไว้ แต่ในความเป็นจริง พวกเขามีอำนาจควบคุมอย่างเบ็ดเสร็จ เพียงแค่ดินแดนทางตอนใต้ ตอนกลาง และภาคตะวันออกที่เพิ่งจะยึดมาได้ ที่ได้รับการ ‘เก็บกวาด’ ไปแล้วเท่านั้น ส่วนพื้นที่อื่นๆ ล้วนยังคงอยู่ภายใต้การควบคุมของบรรดาขุนนาง","และตอนนี้ บรรดาขุนนางก็กำลังยุ่งอยู่กับการกว้านซื้อข้าวสาลีเพื่อหาเงิน จึงเป็นธรรมดาที่จะไม่มีใครสนใจความเป็นความตายของพวกคนยากจนในดินแดนของตนเอง","ซึ่งลอดด์นั้นรู้ดีว่าดาวรุ่งแห่งเวทมนตร์ผู้นี้ ยังคงให้ความสนใจกับพวกคนยากจนอยู่ ดังนั้น เมื่อพูดถึงฉากที่ผู้หิวโหยเกลื่อนกลาดไปทั่วทุกหนทุกแห่ง จนถึงขั้นต้องแทะต้นหญ้าและเปลือกไม้กิน เขาจึงพยายามใช้คำพูดอย่างระมัดระวังที่สุด","อย่างไรก็ตาม สิ่งที่เหนือความคาดหมายของเขาก็คือ ลินน์ไม่ได้มีทีท่าว่าจะโกรธเคืองหรือกังวลเลยแม้แต่น้อย ตรงกันข้าม เขากลับยิ้มแล้วสั่งการ","“ก็ดีเลย ให้เรย์เดลไปจัดการก็แล้วกัน นำเสบียงอาหารไปให้พวกเขาสักหน่อย แล้วก็เอาปืนคาบศิลาที่ถูกปลดประจำการแล้ว ไปแจกจ่ายให้กับพวกเขาสะ!”","นี่...นี่...แจกปืนงั้นรึ?","ลอดด์ตกตะลึงเป็นอย่างมาก เขาคาดไม่ถึงเลยว่าลินน์จะใช้วิธีการที่ป่าเถื่อนเช่นนี้ เพื่อแก้ปัญหา","หรือจะพูดอีกอย่างหนึ่งก็คือ นับตั้งแต่การค่อยๆ ปล่อยเสบียงอาหารออกไป เพื่อผลักดันให้บรรดาขุนนางเหล่านั้นเข้ามาติดกับ ดาวรุ่งแห่งเวทมนตร์ผู้นี้ ก็น่าจะวางแผนรับมือกับเรื่องที่จะเกิดขึ้นตามมาเอาไว้หมดแล้ว","“สติปัญญาของท่านช่างกว้างใหญ่ไพศาลยิ่งนัก...”","ลอดด์รีบประจบประแจง แต่ในน้ำเสียงนั้น ก็แฝงไปด้วยความจริงใจอยู่หลายส่วน","การกระทำอันไร้สาระของพวกขุนนางในครั้งนี้ เทียบเท่ากับการสูญเสียความศรัทธาจากประชาชนไปจนหมดสิ้น เมื่อรวมกับการปล่อยเสบียงอาหารและการแจกจ่ายปืน พวกเขาก็สามารถยึดดินแดนทางภาคตะวันตกและภาคเหนือของอาณาจักร กลับคืนมาได้อย่างง่ายดาย แถมยังสามารถรวบรวมใจคนเอาไว้ได้อีกด้วย","ลินน์ไม่ได้ใส่ใจกับคำเยินยอของลอดด์ เขาเอ่ยถามต่อไป ถึงแผนการรับซื้อเสบียงอาหารที่ตนได้สั่งการลงไป ว่าดำเนินการไปถึงไหนแล้ว","“มีกองคาราวานสินค้าบางส่วน ที่ยอมขายเสบียงอาหารในมือออกมาจริงๆ ขอรับ แต่ที่เยอะกว่าก็คือประชาชนในอาณาจักร ที่นำเสบียงอาหารมาขายให้กับพวกเราในราคาถูก”","ลอดด์ตอบกลับไปตามความจริง","“เรื่องนี้ช่าง...ทำให้ข้าประหลาดใจจริงๆ”","ลินน์ถึงกับไม่รู้ว่าจะหัวเราะหรือร้องไห้ดี แต่สิ่งนี้ก็ได้พิสูจน์ให้เห็นแล้ว ว่ากลยุทธ์ในการยกระดับคุณภาพชีวิตของประชาชน ที่พวกเขาทำมาโดยตลอดนั้น บรรลุผลสำเร็จได้เป็นอย่างดี","ต้องรู้ก่อนนะ ว่าราคาข้าวสาลีในตลาดตอนนี้ สูงกว่าราคารับซื้อของพวกเขากว่าหลายเท่าตัว แต่บรรดาประชาชน ก็ยังคงเต็มใจที่จะขายเสบียงอาหาร ให้กับพวกเขาในราคาถูกอยู่ดี","รอยยิ้มบางๆ ปรากฏขึ้นบนใบหน้าของลินน์ ก่อนที่จู่ๆ เขาจะพูดด้วยน้ำเสียงเย็นชา","“คืนนี้ ลดราคารับซื้อข้าวสาลีลงเหลือ กิโลกรัมละสิบห้าเหรียญทองแดงก็แล้วกัน!”","“ขอรับ ท่านลินน์”","ลอดด์อดไม่ได้ที่จะเช็ดเหงื่อเย็นๆ บนหน้าผากออก ก่อนหน้านี้ เขายังไม่เข้าใจเลย ว่าทำไมดาวรุ่งแห่งเวทมนตร์ผู้นี้ ถึงต้องการที่จะรับซื้อเสบียงอาหาร ในราคาที่ต่ำกว่าท้องตลาดมากนัก แต่ตอนนี้ ทุกอย่างมันกระจ่างแจ้งแล้ว","นี่มันใช่ราคาสำหรับรับซื้อเสบียงอาหารที่ไหนกัน มันคือการนับถอยหลัง สู่การยกมีดขึ้นมาเชือดชำแหละต่างหากล่ะ!"]},{"n":468,"t":"ข้าวสาลีที่ไร้ค่า กับบรรดาขุนนางอาณาจักรที่กำลังพังทลาย!","c":["เดือนกันยายนได้มาเยือนอย่างเงียบๆ สถานีรถไฟและรางรถไฟที่เชื่อมต่อพื้นที่ต่างๆ ซึ่งถูกเร่งสร้างขึ้น ในที่สุดก็สร้างเสร็จสมบูรณ์ ภายใต้ความร่วมมือของบรรดาพ่อมดและคนงานนับแสนคน","แต่บรรดาพ่อค้าผู้มั่งคั่งและขุนนางในอาณาจักร กลับตกอยู่ในความบ้าคลั่งเนื่องจากราคาเสบียงอาหารที่พุ่งสูงขึ้น ภายในเวลาเพียงแค่หนึ่งเดือน ราคาของเสบียงอาหารก็ได้เพิ่มขึ้นถึงห้าร้อยเท่า!","ในทุกๆ เช้าตรู่ จะมีกองคาราวานสินค้านับไม่ถ้วน มารออยู่ที่หน้าโรงนา โดยข้าวสาลีที่ถูกขนส่งมาโดยเรือเหาะ แทบจะไม่ต้องขนถ่ายลงมาด้วยซ้ำ มันก็จะถูกกว้านซื้อไปจนหมดเกลี้ยง!","เพราะเพียงแค่แย่งชิงเสบียงอาหารมาไว้ในมือได้สำเร็จ แล้วรอไปสักหนึ่งหรือสองวัน พวกเขาก็จะสามารถทำกำไรได้หลายเท่าตัว ภายใต้ผลกำไรอันน่าสะพรึงกลัวนี้ คนส่วนใหญ่ต่างก็บ้าคลั่งจนขาดสติไปแล้ว!","แต่ความบ้าคลั่งนี้ ก็มีขีดจำกัดเช่นกัน นั่นเป็นเพราะเสบียงอาหารในมือของสภาเวทมนตร์ ราวกับมีให้ใช้อย่างไม่มีวันหมด เสบียงอาหารที่ถูกส่งมาในทุกๆ วัน ล้วนมีราคาเพิ่มสูงขึ้นเรื่อยๆ และตอนนี้ ในแต่ละวัน จะมีเสบียงอาหารหลายพันตัน ถูกเทขายเข้าสู่ตลาด!","และการจะกว้านซื้อเสบียงอาหารเหล่านี้ทั้งหมด จำเป็นต้องใช้เหรียญทองของจักรวรรดินับแสนเหรียญ แต่เงินในมือของพวกเขากลับถูกใช้ไปจนเกือบหมดแล้ว พ่อค้าผู้มั่งคั่งบางคน ถึงขั้นยอมจำนองทรัพย์สินทั้งหมดของตนเองเลยทีเดียว!","แต่ทุกคนก็รู้ดี ว่าพวกเขาจะต้องซื้อเสบียงอาหารทั้งหมดไปให้ได้ ไม่อย่างนั้น ทันทีที่ราคาข้าวสาลีพังทลายลง ความมั่งคั่งของพวกเขาก็จะมลายหายไปในพริบตา!","เพราะท้ายที่สุด เสบียงอาหารล็อตนี้ก็ถูกแบ่งขายให้กับกองคาราวานสินค้าหลายสิบกลุ่มไปอย่างหลีกเลี่ยงไม่ได้!","หลังจากที่ซื้อเสบียงอาหารไปแล้ว บรรดาพ่อค้าผู้มั่งคั่งและขุนนางใหญ่ ต่างก็นั่งไม่ติดเก้าอี้ พวกเขารีบส่งคนออกไป เพื่อเตรียมตรวจสอบดูว่า พวกพ่อมดเหล่านั้น ยังมีเสบียงอาหารเหลืออยู่อีกเท่าไหร่กันแน่!","ซึ่งการจะลักลอบเข้าไปในโรงนาของเมืองต่างๆ ภายใต้การตรวจสอบด้วยเวทมนตร์ เพื่อตรวจสอบเรื่องนี้ให้แน่ชัด เห็นได้ชัดว่ามันไม่ใช่เรื่องง่ายๆ ท้ายที่สุด บรรดาสายลับก็คิดหาวิธีขึ้นมาได้วิธีหนึ่ง นั่นก็คือการเข้าไปตรวจสอบภายในโรงงาน","พวกพ่อมดจำเป็นต้องจัดหาอาหารให้คนงานกินครบทั้งสามมื้อ หากเสบียงอาหารในมือของพวกเขาไม่เพียงพอละก็ ปริมาณอาหารที่จะนำมาแจกจ่าย ก็จะต้องลดลงอย่างแน่นอน!","หลังจากการตรวจสอบ พวกเขาก็ได้รับข่าวที่น่าตกตะลึงมาข่าวหนึ่งจริงๆ แต่มันกลับตรงกันข้ามกับสิ่งที่พวกเขาคิดเอาไว้ก่อนหน้านี้อย่างสิ้นเชิง นั่นก็คือโรงงานเวทมนตร์ในเมืองต่างๆ กำลังวางแผนที่จะเพิ่มมื้อดึก ให้กับคนงานที่ทำงานในกะกลางคืน เพื่อเป็นรางวัลสำหรับความขยันขันแข็งของพวกเขา!","ในวันรุ่งขึ้น สภาเวทมนตร์ยังได้เทขายข้าวสาลีรวมแล้วกว่าห้าพันตัน เข้าสู่เมืองต่างๆ ของอาณาจักรในรวดเดียว ซึ่งนั่นก็ทำให้กองคาราวานสินค้าทั้งหมด ที่ต้องการจะรับซื้อข้าวสาลี ถึงกับต้องชะงักไปในทันที!","“เป็นไปไม่ได้! พวกมันไปเอาเสบียงอาหารมากมายขนาดนั้นมาจากไหนกัน?”","มาร์ควิสมอร์แทนดึงคอเสื้อของคนรับใช้ที่เข้ามารายงานเอาไว้แน่น พร้อมกับคำรามออกมาด้วยความโกรธเกรี้ยว!","บรรดาเอิร์ลของจักรวรรดิอย่างเฮลเดอร์และคนอื่นๆ ก็ไม่ได้มีท่าทางมั่นใจในชัยชนะ และวางแผนการอย่างรอบคอบเหมือนเมื่อหลายวันก่อนอีกต่อไป โดยแต่ละคนต่างก็มีดวงตาแดงก่ำ และไม่อาจเชื่อในความจริงข้อนี้ได้เช่นกัน","ในช่วงเกือบหนึ่งเดือนที่ผ่านมา พวกเขาได้กว้านซื้อเสบียงอาหาร ที่มากพอจะเลี้ยงประชากรกว่าสามล้านคนไปได้นานกว่าครึ่งปีจนหมดเกลี้ยงแล้ว ส่วนบรรดาพ่อค้าผู้มั่งคั่งคนอื่นๆ ที่ต้องการจะฉวยโอกาสกอบโกยผลประโยชน์ ก็กว้านซื้อไปไม่น้อยไปกว่าพวกเขาเลย แล้วพวกพ่อมดเหล่านั้น จะสามารถนำข้าวสาลีกว่าห้าพันตัน ออกมาในรวดเดียวอีกครั้งได้อย่างไร?","“ท่านมอร์แทน ตอนนี้พวกเราควรจะทำอย่างไรดี?”","ไวส์เคานต์สเคอร์เอ่ยถามด้วยความลนลาน เพื่อสนับสนุนแผนการของมอร์แทน เขาถึงขั้นทุ่มเททรัพย์สินทั้งหมดที่มีไปจนหมดแล้ว!","“ไม่อย่างนั้น พวกเราก็เอาเสบียงอาหารไปขายกันตอนนี้เลยดีไหม?”","จู่ๆ เอิร์ลเบลล์ก็เสนอขึ้นมา","คำแนะนำของเบลล์ ทำให้บรรดาขุนนางต่างก็รู้สึกหวั่นไหวเป็นอย่างมาก ตอนนี้ราคาของข้าวสาลีหนึ่งกิโลกรัม พุ่งสูงถึงห้าร้อยเหรียญทองแดงแล้ว หากพวกเขาสามารถขายเสบียงอาหารทั้งหมด ที่กว้านซื้อมาก่อนหน้านี้ออกไปได้ ทุกคนที่อยู่ที่นี่ ก็จะร่ำรวยเทียบเท่ากับอาณาจักรหนึ่งเลยทีเดียว!","“เจ้าโง่! เจ้าคิดว่าตอนนี้ พวกเราจะยังขายข้าวสาลีออกไปได้อีกงั้นรึ?”","มาร์ควิสมอร์แทนตบโต๊ะประชุมอย่างแรง แล้วคำรามด้วยความโกรธเกรี้ยว","อย่าว่าแต่การขายตามราคาตลาด ที่กิโลกรัมละห้าร้อยเหรียญทองแดงเลย ต่อให้จะลดราคาลงมาเหลือหนึ่งร้อยเหรียญทองแดง ก็ไม่มีใครชายตามองด้วยซ้ำ!","มาร์ควิสมอร์แทนไม่เข้าใจว่าคำศัพท์ที่เรียกกันว่า ‘การตีกลองส่งดอกไม้’ (ตีกลองส่งดอกไม้ เป็นสำนวนที่เปรียบเปรยถึงการโยนความเสี่ยงไปให้คนถัดไปเรื่อยๆ จนกว่าฟองสบู่จะแตก) คืออะไร แต่เขาก็รู้ดี ว่าการที่สภาเวทมนตร์จัดหาอาหารให้พวกคนยากจนกินครบทั้งสามมื้อ มันทำให้ตอนนี้ ภายในตลาด นอกจากพวกเขาที่กำลังรับซื้อเสบียงอาหารอยู่แล้ว ก็ไม่มีใครยอมซื้อข้าวสาลีในราคาสูงลิ่วแบบนี้เลยแม้แต่เมล็ดเดียว!","พ่อค้าคนอื่นๆ ก็ไม่ใช่คนโง่ ภายใต้สถานการณ์ที่ไม่ชัดเจนเช่นนี้ ใครมันจะยังกล้ากว้านซื้อเสบียงอาหารอยู่อีก?","การที่สภาเวทมนตร์เทขายเสบียงอาหารกว่าห้าพันตันออกมาตั้งแต่เช้า และกองทิ้งเอาไว้จนถึงตอนนี้ โดยที่ยังขายไม่ได้เลยแม้แต่น้อย ก็เป็นข้อพิสูจน์ที่ชัดเจนที่สุดแล้ว!","หากพวกพ่อมดเทขายเสบียงอาหารจำนวนมากออกมาอีก ราคาของข้าวสาลีก็จะพังทลายลงในพริบตา และเมื่อถึงตอนนั้น มันก็จะทำให้เกิดการแห่ถอนเงินครั้งใหญ่ แถมยังทำให้ข้าวสาลีในมือของพวกเขากลายเป็นของไร้ค่าอีกด้วย!","เบลล์ถึงกับลนลานขึ้นมาทันที เขารีบพูดว่า","“แต่ว่า พวกพ่อมดเหล่านั้นก็กำลังรับซื้อเสบียงอาหารอยู่ไม่ใช่หรือ? พวกเราก็เอาเสบียงอาหารทั้งหมดไปขายให้พวกเขาซะสิ!”","มอร์แทนมองไปที่เบลล์ด้วยสายตาเย็นชา ก่อนจะหันไปมองคนรับใช้ที่กำลังนอนตัวสั่นเทาอยู่บนพื้น","“เจ้าพูดมาสิ!”","“จนถึงเมื่อคืนนี้ ราคารับซื้อข้าวสาลีของสภาเวทมนตร์คือ...สิบกิโลกรัมต่อหนึ่งเหรียญทองแดงขอรับ!”","คนรับใช้พูดด้วยความระมัดระวัง","เมื่อได้ยินข่าวนี้ เบลล์ก็แทบจะสลบไปในทันที","ล้อกันเล่นหรือเปล่า สิบกิโลกรัมต่อหนึ่งเหรียญทองแดงเนี่ยนะ?","นี่หมายความว่า ข้าวสาลีที่เขายอมทุ่มเททรัพย์สินทั้งหมดที่มี และจ่ายเงินไปกว่าหนึ่งแสนเหรียญทองของจักรวรรดิเพื่อซื้อมา ซึ่งในตอนนี้มันมีมูลค่ามากกว่าหนึ่งล้านเหรียญทองของจักรวรรดิ พวกพ่อมดกลับต้องการที่จะซื้อมันกลับไป ในราคาเพียงแค่สองร้อยเหรียญทองเนี่ยนะ!","นี่มันบ้าไปแล้วชัดๆ!","“ไม่จริง ข้าจำได้ว่าเมื่อหลายวันก่อน ไวส์เคานต์สเคอร์เพิ่งจะบอกไป ว่าราคารับซื้อข้าวสาลีของพวกเขา น่าจะอยู่ที่กิโลกรัมละยี่สิบเหรียญทองแดงไม่ใช่หรือ!”","เบลล์ตะโกนออกมาอย่างเสียสติ","หากมันเป็นราคายี่สิบเหรียญทองแดง แม้ว่าเขาจะสูญเสียทรัพย์สินไปกว่าครึ่งหนึ่ง แต่มันก็ยังพอรับได้","ภายใต้สายตาอันดุร้ายราวกับจะกินเลือดกินเนื้อของเอิร์ลเบลล์ คนรับใช้ก็อธิบายด้วยน้ำเสียงตะกุกตะกัก ว่าราคารับซื้อเสบียงอาหารของสภาเวทมนตร์ แทบจะลดลงในทุกๆ วัน จากเดิมกิโลกรัมละยี่สิบเหรียญทองแดง ก็ลดลงเหลือสิบห้าเหรียญทองแดง จากนั้นก็เป็นสิบเหรียญทองแดง ห้าเหรียญทองแดง สองเหรียญทองแดง...","และเมื่อคืนนี้ ราคาของมันก็ได้ลดลงสู่จุดต่ำสุดในประวัติศาสตร์ของอาณาจักร นั่นก็คือสิบกิโลกรัมต่อหนึ่งเหรียญทองแดง!","ไวส์เคานต์สเคอร์และขุนนางคนอื่นๆ ต่างก็ไม่อาจยอมรับราคาอันน่าขันนี้ได้เช่นกัน ซึ่งนี่ก็หมายความว่า ทรัพย์สินที่พวกเขามีอยู่ในปัจจุบัน จะหดหายลงไปเหลือเพียงแค่หนึ่งในห้าพัน ของราคาที่ซื้อมาในพริบตา!","เบลล์คำรามออกมาสุดเสียง","“นี่มันคือการยั่วยุกันชัดๆ นี่มันคือสงคราม!”","“โรงนาของพวกมันอยู่ที่ไหน? ข้าจะส่งคนไปเผาเสบียงอาหารของพวกพ่อมดนั่นให้หมดเดี๋ยวนี้แหละ!”","บรรดาขุนนางที่อยู่ที่นั่น ต่างก็โกรธเป็นฟืนเป็นไฟ และแสดงท่าทีราวกับเตรียมจะล้มล้างอาณาจักรแห่งนี้ลงได้ทุกเมื่อ","“เผาบ้าอะไรล่ะ!”","เฮลเดอร์สบถออกมาด้วยความโกรธเกรี้ยว ราวกับเป็นการสาดน้ำเย็นเข้าใส่ทุกคน","เสบียงอาหารกว่าห้าพันตัน ถูกกระจายออกไปตามเมืองต่างๆ กว่าสี่สิบเมืองทั่วทั้งอาณาจักร นอกจากจะมีทหารคอยคุ้มกันอย่างแน่นหนาแล้ว บรรดาพ่อมดที่ประจำอยู่ตามเมืองต่างๆ ก็มีจำนวนไม่น้อยเลย แล้วพวกเขาจะเอาอะไรไปเผาล่ะ?","คิดจริงๆ หรือ ว่าพวกพ่อมดจะใช้เวทมนตร์ดับไฟไม่เป็น?","ในความเป็นจริง พวกเขาไม่เพียงแต่จะสามารถเสกน้ำจำนวนมหาศาลออกมาจากความว่างเปล่าได้เท่านั้น แต่ยังสามารถเรียกพายุฝนและสายฟ้าออกมาได้อย่างง่ายดายอีกด้วย!","เมื่อนึกถึงเหตุการณ์เมื่อหนึ่งปีก่อน ที่มีใครบางคนโบกมือเรียกพายุฝนและเสกสายฟ้าอันน่าสะพรึงกลัวลงมาที่เมืองหลวง ภายในใจของเฮลเดอร์ ก็เกิดความหวาดกลัวที่ยากจะอธิบายขึ้นมาทันที เขาอดไม่ได้ที่จะรู้สึกเสียใจ ที่ตนเองไปหลงเชื่อคำพูดของมอร์แทน และเข้าไปต่อกรกับพวกพ่อมด ที่ครอบครองพลังเวทมนตร์อันน่ากลัวเหล่านี้","สายตาที่เบลล์ สเคอร์ และคนอื่นๆ มองไปยังมอร์แทน เริ่มแฝงไปด้วยความมุ่งร้ายมากยิ่งขึ้น","เห็นได้ชัดว่าอีกฝ่ายรู้สึกได้ถึงบรรยากาศที่เริ่มตึงเครียดขึ้นมา เขาจึงพูดด้วยน้ำเสียงเย็นชาทันที","“อย่าลืมนะ ทุกท่าน ตอนนี้พวกเราลงเรือลำเดียวกันแล้ว การตายของข้า มันไม่เป็นผลดีต่อพวกท่านหรอกนะ!”","“ตอนนี้ พวกเราเหลือแค่วิธีเดียวเท่านั้น!”","เมื่อพูดมาถึงตรงนี้ มาร์ควิสมอร์แทนก็ชะงักไปเล็กน้อย ก่อนจะอ้าปากพูดลอดไรฟันออกมา","“นั่นก็คือการ...ซื้อเสบียงอาหารต่อไป!”","ขอเพียงแค่สามารถกว้านซื้อข้าวสาลีทั้งหมดของสภาเวทมนตร์มาได้ อำนาจในการตัดสินใจก็จะกลับมาอยู่ในมือของพวกเขาอีกครั้ง!","“ข้าไม่เชื่อหรอก ว่าเสบียงอาหารในมือของพวกพ่อมดนั่นจะมีใช้อย่างไม่มีวันหมด!”","เสียงอันกึกก้องของมาร์ควิสมอร์แทนดังก้องไปทั่วทั้งปราสาท","พวกพ่อมดเพิ่งจะยึดครองดินแดนทางตอนใต้และตอนกลางของอาณาจักรไปได้เพียงแค่ปีกว่าๆ เท่านั้น ต่อให้พวกมันจะเริ่มบุกเบิกที่ดินทำกินตั้งแต่ตอนนั้น พวกมันจะปลูกเสบียงอาหารออกมาได้สักเท่าไหร่กันเชียว?","มอร์แทนเชื่อมั่นอย่างสุดหัวใจ ว่าข้าวสาลีกว่าห้าพันตันนี้ จะต้องเป็นเสบียงอาหารสำรองล็อตสุดท้ายของสภาเวทมนตร์อย่างแน่นอน การที่พวกมันเทขายออกมาในรวดเดียว ก็เพื่อต้องการข่มขวัญพวกเขาเท่านั้น!","และข่าวลือเรื่องโรงงานนั่น ก็ต้องเป็นสิ่งที่พวกมันจงใจปล่อยออกมา เพื่อทำให้พวกเขาสับสนอย่างแน่นอน!","ท้ายที่สุดแล้ว ไอ้เรื่องมื้อดึกอะไรนั่น เขาไม่เคยได้ยินมาก่อนเลย พวกพ่อมดจะมาใจบุญสุนทาน ในช่วงที่ขาดแคลนเสบียงอาหาร แล้วปล่อยให้พวกคนงานกินอาหารเพิ่มขึ้นอีกหนึ่งมื้อได้อย่างไร","นี่จะต้องเป็นสิ่งที่พวกมันตั้งใจนำมาใช้เพื่อหลอกลวงพวกเขาอย่างแน่นอน!","ภายใต้การวิเคราะห์ของมอร์แทน เบลล์และคนอื่นๆ ก็ราวกับได้คว้าฟางเส้นสุดท้ายเอาไว้ ไม่ว่าพวกเขาจะเต็มใจเชื่อหรือไม่ก็ตาม เรื่องนี้ก็จะต้องเป็นเรื่องจริงเท่านั้น!","แต่ไม่นาน ทุกคนก็ตระหนักได้ถึงอีกปัญหาหนึ่ง","เสบียงอาหารกว่าห้าพันตัน การจะซื้อด้วยราคาปัจจุบัน ต้องใช้เงินถึงสองแสนห้าหมื่นเหรียญทองของจักรวรรดิเชียวนะ!","นี่มันเอาชีวิตพวกเขาไปทิ้งชัดๆ!","ตอนนี้ทรัพย์สินของทุกคนต่างก็ถูกนำไปจำนอง ไม่ก็ถูกใช้ไปจนหมดเกลี้ยงตั้งแต่ตอนที่กว้านซื้อเสบียงอาหารครั้งก่อนแล้ว พวกเขาจะไปหาเงินมากมายขนาดนั้นมาจากไหน?","เมื่อคิดถึงจุดนี้ เฮลเดอร์และคนอื่นๆ ก็เริ่มถอดใจกันแล้ว","มอร์แทนรู้ดีว่าหากตนไม่ทำตัวเป็นแบบอย่าง พันธมิตรขุนนางก็คงจะต้องล่มสลายลงในวันนี้เป็นแน่ เขาจึงกัดฟันพูดขึ้น","“เอาคฤหาสน์ของข้าไปจำนองซะ น่าจะรวบรวมเงินมาได้สักสองหมื่นเหรียญทองของจักรวรรดิ!”","“ทุกท่าน ตอนนี้มันถึงคราวเป็นคราวตายแล้วนะ!”","“ลองคิดดูสิ ขอเพียงแค่สามารถผ่านพ้นอุปสรรคในครั้งนี้ไปได้ เสบียงอาหารในมือของพวกเรา ก็จะสามารถนำไปแลกเป็นความมั่งคั่งอันนับไม่ถ้วนได้ แต่หากพ่ายแพ้ สิ่งที่ตระกูลของพวกเราสั่งสมมาหลายชั่วอายุคน ก็จะมลายหายไปในพริบตา...”","ภายใต้คำพูดปลุกใจของมอร์แทน บรรดาขุนนางที่อยู่ที่นั่น ก็จำเป็นต้องชำระบัญชีทรัพย์สินที่เหลืออยู่เพียงน้อยนิดของตนเองอย่างไม่เต็มใจนัก ท้ายที่สุดแล้ว หากถอยหลังไปหนึ่งก้าว มันก็คือหุบเหวไร้ก้น แต่หากก้าวต่อไปข้างหน้า พวกเขาก็อาจจะได้ครอบครองทุกสิ่งทุกอย่าง!","พวกเขาไม่มีทางเลือกอื่น นอกจากต้องเดิมพันในครั้งนี้!","ผ่านไปประมาณครึ่งชั่วโมง ขุนนางกว่าสี่สิบคน ก็รวบรวมเงินสองแสนห้าหมื่นเหรียญทองของจักรวรรดิมาได้อย่างยากลำบาก ด้วยการนำโฉนดที่ดินไปจำนอง หลังจากนั้น มอร์แทนก็รีบสั่งให้คนสนิทที่ไว้ใจได้ นั่งเรือเหาะไปยังเมืองต่างๆ ทั่วทั้งอาณาจักร เพื่อกว้านซื้อเสบียงอาหารกว่าห้าพันตันนั้นมาให้หมดในทันที!","หลังจากที่สูญเสียทรัพย์สินเพียงน้อยนิดที่เหลืออยู่ไปแล้ว ก็ไม่มีขุนนางคนใดเดินออกจากห้องลับแห่งนี้เลยแม้แต่คนเดียว ทุกคนต่างก็กำลังรอคอยข่าวคราวที่จะถูกส่งมาด้วยความร้อนใจ","พวกเขารอคอยเช่นนั้นอยู่เป็นเวลาถึงหนึ่งชั่วโมง กว่าจะมีทหารองครักษ์เดินเข้ามาจากนอกประตู","“เป็นอย่างไรบ้าง? ภายในเมืองหลวงเกิดความวุ่นวายขึ้นแล้วใช่หรือไม่?”","เฮลเดอร์และคนอื่นๆ รีบเดินเข้าไปล้อมรอบชายผู้นั้น แล้วเอ่ยถามด้วยความร้อนใจในทันที","แต่มอร์แทนกลับรู้ดีว่านี่เพิ่งจะผ่านไปเพียงแค่หนึ่งชั่วโมง คนสนิทที่เขาส่งไปกว้านซื้อเสบียงอาหารตามเมืองต่างๆ ทั่วทั้งอาณาจักร น่าจะยังอยู่ระหว่างการเดินทางเท่านั้น","หรือบางที พวกพ่อมดอาจจะทนไม่ไหวแล้ว และตั้งใจที่จะเจรจาต่อรองกับพวกเขาก็เป็นได้...","ทหารองครักษ์ที่เข้ามาเพื่อรายงานข่าว ไม่ได้ตอบคำถามของทุกคน เขาทำเพียงแค่ยื่นหนังสือพิมพ์ฉบับหนึ่งให้ ด้วยมือที่สั่นเทา","“ท่านมาร์ควิสมอร์แทน นี่คือ หนังสือพิมพ์ฉบับวันนี้ขอรับ...”","เมื่อมองไปยังใบหน้าที่เต็มไปด้วยความหวาดกลัวของทหารองครักษ์ ภายในใจของมอร์แทน ก็เกิดความรู้สึกกระวนกระวายใจขึ้นมาเล็กน้อย เขาดึง หนังสือพิมพ์ในมือของอีกฝ่ายมาเปิดอ่านในทันที","หลังจากที่ได้เห็นพาดหัวข่าวอันโดดเด่น ที่ถูกขยายให้ใหญ่ขึ้นเป็นพิเศษบนหน้าแรก รูม่านตาของมอร์แทนก็หดเล็กลง เลือดลมในร่างกายพลุ่งพล่านอย่างควบคุมไม่ได้ ความโกรธเกรี้ยวและร้อนรนพุ่งปรี๊ดขึ้นสมอง จนทำให้เขาสลบเหมือดไปในทันที","“ท่านมาร์ควิสมอร์แทน...”","บรรดาขุนนางที่อยู่ที่นั่นถึงกับตกตะลึงไปตามๆ กัน เบลล์เป็นคนแรกที่แย่งหนังสือพิมพ์ฉบับนั้นมา หลังจากที่กวาดสายตามองไปได้ไม่กี่บรรทัด เขาก็สัมผัสได้ถึงความหนาวเหน็บที่แล่นปลาบขึ้นมาจากฝ่าเท้า และตะโกนออกมาด้วยความหวาดกลัว","“เร็วเข้า รีบส่งคนไปพาตัวคนที่ถูกส่งไปซื้อเสบียงอาหารกลับมาเดี๋ยวนี้!”","...","ห้านาทีก่อนหน้านี้ ภายในเมืองน้ำมันดิน ณ สถาบันเวทมนตร์ที่เพิ่งถูกสร้างขึ้นใหม่","ไอวีน่าตักข้าวสาลีประมาณสิบกิโลกรัม ออกมาจากลังไม้ที่ใช้สำหรับเก็บเสบียงอาหาร แล้วนำไปใส่ไว้ในถุงผ้ากระสอบที่แข็งแรง ก่อนจะเตรียมตัวออกไปข้างนอก","“เจ้าจะไปขายข้าวสาลีที่โรงนาอีกแล้วงั้นรึ?”","ภายในห้องนั่งเล่น มอนโรที่กำลังสวดมนต์ตามปกติ จู่ๆ ก็ลืมตาขึ้น แล้วเรียกเด็กสาวที่เตรียมจะออกไปข้างนอกเอาไว้","“ใช่ เมื่อวานนี้พวกพ่อมดเพิ่งจะลดราคาเสบียงอาหารลงมาอีกครั้ง ข้าคิดว่าเรื่องนี้อาจจะมีความหมายแอบแฝงบางอย่างซ่อนอยู่ก็เป็นได้”","ไอวีน่าตอบกลับไปอย่างเป็นธรรมชาติ","“ความหมายแอบแฝงงั้นรึ? เกรงว่าสภาเวทมนตร์คงจะเงินทุนไม่พอเสียมากกว่าน่ะสิ?”","มอนโรพูดด้วยรอยยิ้มเยาะ","ด้วยความช่วยเหลือจากการลอบสืบสวนของไอวีน่า ทำให้เขา ‘เข้าใจ’ ถึงเหตุผล ที่พวกพ่อมดสามารถยืนหยัดต่อสู้ ในสงครามเสบียงอาหารมาได้จนถึงตอนนี้แล้ว!","สภาเวทมนตร์กำลังใช้วิธีการกว้านซื้อเสบียงอาหารอันน้อยนิด ที่อยู่ในมือของพวกคนยากจนกลับคืนมาด้วยราคาที่ต่ำเตี้ยเรี่ยดิน เพื่อนำมาใช้ประคับประคองสงครามเสบียงอาหารในครั้งนี้ และรักษาหน้าตาของตนเองเอาไว้!","แต่นี่มันก็เป็นเพียงแค่การแก้ปัญหาเฉพาะหน้าเท่านั้น พวกมันคงจะทนได้อีกไม่นานหรอก!","มอนโรถึงขั้นเชื่อว่า วันนี้ก็คือวันที่พวกพ่อมดจะต้องเผยธาตุแท้ออกมา และข้าวสาลีกว่าห้าพันตันนั้น ก็น่าจะเป็นเสบียงอาหารสำรองล็อตสุดท้ายแล้ว","ไอวีน่าเม้มริมฝีปาก เธอไม่ได้มีความคิดเห็นที่ตรงกับมอนโร แต่ก็ไม่ได้ตั้งใจที่จะโต้แย้งเช่นกัน หลังจากที่หยิบข้าวสาลีทั้งสิบกิโลกรัมนั้นขึ้นมา เธอก็เดินออกไปข้างนอกทันที","ตลอดทางไม่มีใครเข้ามาขัดขวาง หรือเอ่ยปากตั้งคำถามใดๆ ท้ายที่สุดแล้ว นี่ก็ไม่ใช่วันแรกที่เธอออกไปขายเสบียงอาหาร และในช่วงเวลานี้ คนที่กว้านซื้อและนำข้าวสาลีมาขาย ก็ไม่ได้มีแค่พวกเขาสองคนเท่านั้น","บรรดาพ่อมดจำนวนไม่น้อย ต่างก็มองว่านี่เป็นโอกาสอันดีที่จะทำกำไรก้อนโต เพียงแต่พวกเขาไม่มีพื้นที่เพียงพอสำหรับกักเก็บข้าวสาลี และกำลังทรัพย์ของพวกเขาก็สู้พวกพ่อค้าผู้มั่งคั่งและขุนนางไม่ได้ ดังนั้น โดยปกติแล้ว พวกเขาจึงทำได้เพียงแค่ซื้อมาในราคาถูก และขายออกไปในราคาแพง เพื่อทำกำไรส่วนต่างเท่านั้น","เมื่อไอวีน่ามาถึงหน้าโรงนา ที่นี่ก็มีคนมาต่อคิวกันอย่างยาวเหยียดแล้ว แม้ว่าราคารับซื้อข้าวสาลีของสภาเวทมนตร์ จะลดลงในทุกๆ วัน แต่จำนวนคนที่นำเสบียงอาหารมาขาย กลับไม่ได้ลดน้อยลงเลย หนำซ้ำมันกลับเพิ่มมากขึ้นเรื่อยๆ ด้วย!","เรื่องนี้ก็ทำให้ไอวีน่ารู้สึกประหลาดใจอยู่ไม่น้อย ต้องรู้ก่อนนะ ว่าราคารับซื้อของพวกพ่อมดกับราคาตลาด มันแตกต่างกันถึงห้าพันเท่าเชียวนะ!","หรือจะพูดอีกอย่างหนึ่งก็คือ การนำข้าวสาลีสิบกิโลกรัมมาขายให้กับสภาเวทมนตร์ พวกเขาจะได้รับเงินเพียงแค่หนึ่งเหรียญทองแดงเท่านั้น แต่หากเต็มใจที่จะนำไปขายให้กับบรรดาพ่อค้าเสบียงรายใหญ่ พวกเขาก็จะได้เงินถึงห้าสิบเหรียญเงินเลยทีเดียว!","หลังจากที่เก็บความสงสัยเอาไว้มานานเกือบเดือน ในที่สุด ไอวีน่าก็ทนไม่ไหว จนต้องเอ่ยปากถามออกมา","เมื่อได้ยินคำถามของเด็กสาว บรรดาชาวเมืองที่กำลังต่อคิวรออยู่หน้าโรงนา ต่างก็มองไปยังไอวีน่าด้วยสายตาที่เต็มไปด้วยความอิจฉา จนกระทั่งเด็กสาวตั้งใจจะเอ่ยปากถามขึ้นอีกครั้ง ซูซานที่ใช้เสื้อผ้าขาดๆ ห่อข้าวสาลีเก่าเก็บจำนวนเล็กน้อยเอาไว้ ก็ถอนหายใจ แล้วพูดขึ้น","“ท่านไม่เคยเผชิญกับความอดอยากมาก่อนเลยสินะ ท่านพ่อมด?”"]},{"n":469,"t":"การสร้างเสบียงอาหารจากความว่างเปล่า นั่นคือสิ่งที่เทพเจ้าเท่านั้นที่จะทำได้","c":["คำถามที่โพล่งออกมาอย่างกะทันหันของซูซาน ทำให้ไอวีน่าถึงกับชะงักไป","เธออาศัยอยู่ในดินแดนทางตอนเหนือ ซึ่งเป็นพื้นที่ที่ทุรกันดารที่สุดของอาณาจักรมานานถึงสองปี ย่อมเคยเห็นภาวะอดอยากมาบ้าง และถึงขั้นเคยมีส่วนร่วม ในปฏิบัติการแจกจ่ายเสบียงอาหารเพื่อช่วยเหลือผู้คนของศาสนจักรมาแล้ว แต่เธอก็ยังไม่เคยสัมผัสความรู้สึกแบบนั้นด้วยตัวเองจริงๆ เลยสักครั้ง...","ซูซานไม่ได้รอให้ไอวีน่าตอบคำถาม เธอถอนหายใจแล้วพูดต่อ","“เมื่อสิบเอ็ดปีก่อน ดินแดนทางภาคตะวันตกเกิดสงครามขึ้นอย่างต่อเนื่อง ทำให้ผลผลิตทางการเกษตรลดลงอย่างมหาศาล จากนั้น พวกนายท่านขุนนางและพ่อค้าผู้มั่งคั่งเหล่านั้น ก็เริ่มกว้านซื้อเสบียงอาหารจำนวนมาก เหมือนกับในวันนี้ แม้ว่ามันจะไม่ได้น่ากลัวเท่ากับครั้งนี้ แต่มันก็ไม่ใช่ราคาที่พวกเราจะสามารถหาซื้อได้อยู่ดี...”","ในตอนนั้น เธอกับสามีอาศัยอยู่ในสลัม และอาศัยการรับจ้างแบกหามหรือทำงานจิปาถะ เพื่อแลกกับรายได้อันน้อยนิด หลังจากหักส่วนแบ่งที่ต้องจ่ายให้กับพวกแก๊งอันธพาลแล้ว ในแต่ละเดือน พวกเขาหาเงินได้ไม่ถึงหนึ่งเหรียญเงินด้วยซ้ำ ซึ่งภายใต้ราคาอาหารที่พุ่งสูงขึ้น ต่อให้พวกเขาจะใช้เงินเก็บจนหมด มันก็ซื้อขนมปังดำได้เพียงแค่ไม่กี่ก้อนเท่านั้น","“แล้วทางศาสนจักรกับทางอาณาจักร ไม่ได้เข้ามาแทรกแซงหรือให้ความช่วยเหลือเลยหรือ?”","ไอวีน่าขมวดคิ้ว แล้วเอ่ยถามด้วยความไม่เข้าใจ แต่ไม่นานเธอก็รู้สึกตัว ว่าคำพูดของตนนั้นมีบางอย่างที่ไม่เหมาะสม จึงรีบเอ่ยปากแก้ไขทันที","“ข้าหมายถึง...บรรดาบิชอปมักจะพูดอยู่เสมอไม่ใช่หรือ ว่าองค์พระผู้เป็นเจ้าทรงเมตตาต่อมวลมนุษย์?”","“ท่านบิชอปที่อยู่สูงส่งปานนั้น จะมาสนใจพวกเราได้อย่างไร...”","ชายวัยกลางคนที่มีผิวคล้ำ ส่ายหน้าพร้อมกับหัวเราะเยาะตัวเอง","เมื่อสิบเอ็ดปีก่อน ทรัพยากรอันล้ำค่าอย่างน้ำมันดิน ยังไม่ได้ถูกค้นพบ เมืองแห่งนี้จึงไม่ได้มีความสำคัญเหมือนในปัจจุบัน โดยมันเป็นเพียงแค่เมืองเล็กๆ ธรรมดาๆ เมืองหนึ่ง ในภาคตะวันตกเท่านั้น ส่วนพวกเขาก็เป็นเพียงคนยากจน ที่ไม่เคยอยู่ในสายตาของผู้ใดภายในเมืองแห่งนี้","ทางอาณาจักรได้แจกจ่ายเสบียงอาหารเพื่อช่วยเหลือผู้ประสบภัยมาบ้างจริงๆ แต่มันก็ถูกพวกขุนนางและพ่อค้าผู้มั่งคั่งในท้องถิ่น หักส่วยไปจนเกือบหมดตั้งแต่ระหว่างทางแล้ว ส่วนที่เหลือเพียงน้อยนิด ก็ไม่มีทางตกมาถึงมือของพวกเขาได้เลย","ซูซานพูดสะอื้นไห้ ในตอนนั้น ลูกคนหนึ่งของเธอ เพิ่งจะเกิดมาได้ไม่นาน ก็ต้องมาอดตายไปทั้งเป็น นั่นก็เป็นเพราะตัวเธอหิวมากเกินไป จนไม่สามารถผลิตน้ำนมออกมาได้อย่างเพียงพอ ทำได้เพียงแค่นำรากหญ้าและเปลือกไม้มาบดให้ละเอียด แล้วนำไปต้มเป็นน้ำซุป เพื่อป้อนให้เด็กกินทีละน้อย...","แต่ผลสุดท้าย...ลูกของเธอก็ทนอยู่ได้ไม่ถึงสองวันด้วยซ้ำ","“รากหญ้า...เปลือกไม้... ของพวกนี้มันกินได้ด้วยหรือ?”","ไอวีน่าเอ่ยปากถามด้วยความตกตะลึง","“หากเป็นรากหญ้าละก็ ส่วนใหญ่มันก็พอกินได้ ส่วนเปลือกไม้ ก็ต้องดูด้วยว่ามันเป็นต้นไม้อะไร...”","ชายวัยกลางคนบ่นพึมพำ","เนื่องจากฐานะความเป็นพ่อมดของไอวีน่า ได้รับความรู้สึกดีๆ จากผู้คนมาไม่น้อย เมื่อรวมกับการร้องไห้และการระบายความในใจของซูซาน บรรดาชาวเมืองกว่าร้อยคน ที่มารวมตัวกันอยู่หน้าโรงนา ก็อดไม่ได้ที่จะแบ่งปันประสบการณ์ และการก้าวผ่านภาวะอดอยากของตนเองให้ฟัง","บางคนด่าทอถึงความเลือดเย็นและการเพิกเฉยของพวกขุนนาง บางคนก็เล่าให้ไอวีน่าฟังด้วยความโศกเศร้า ว่าเมื่อหลายปีก่อน น้องชายของตนเอง ถูกกลุ่มชาวเมืองที่หิวจนคลุ้มคลั่งแย่งชิงกินเขาทั้งเป็น เด็กหนุ่มที่อายุยังไม่ถึงยี่สิบปีคนหนึ่ง ถึงขั้นเล่าให้ฟัง ว่าในตอนนั้น เขาอาศัยการกินดินเหลืองชนิดหนึ่ง เพื่อเอาชีวิตรอดผ่านช่วงเวลาที่ยากลำบากที่สุดมาได้...","แต่น่าเสียดาย ที่พ่อของเขาไม่สามารถผ่านมันไปได้!","หากไม่ต้องการที่จะแทะเปลือกไม้ หรือกินดิน ก็ได้เช่นกัน งั้นพวกเขาก็ทำได้เพียงแค่เสี่ยงชีวิต เข้าไปในป่าลึก เพื่อค้นหาอาหารจากในนั้น แต่มันก็มีความเป็นไปได้สูง ว่าพวกเขาจะกลายไปเป็นอาหาร ของสัตว์เวทมนตร์อันดุร้ายตัวใดตัวหนึ่งเสียแทน!","เมื่อได้ฟังชาวเมืองกว่าร้อยคน กำลังถกเถียงกันว่าเปลือกไม้ชนิดไหนอร่อยที่สุด และหญ้าชนิดไหนที่ไม่มีพิษแถมยังกินแล้วอยู่ท้อง ภายในใจของไอวีน่าก็รู้สึกสั่นสะท้านเป็นอย่างมาก","ในฐานะที่เติบโตมาในตระกูลขุนนางตั้งแต่เด็ก เธอไม่เคยคิดมาก่อนเลย ว่ารากหญ้า ใบไม้ หรือแม้กระทั่งดิน จะสามารถนำเข้าปากเพื่อใช้เป็นอาหารได้","แม้ว่าดินแดนทางตอนเหนือที่เธอเคยอาศัยอยู่ จะเคยเกิดภาวะอดอยาก และถึงขั้นเคยเห็นฉากที่ผู้คนแลกเปลี่ยนลูกกันกินกับตาตนเอง แต่กุสตาฟก็เคยบอกกับเธอเอาไว้ ว่าคนพวกนั้นถูกพลังของปีศาจกัดกิน และวิญญาณของพวกเขาก็กำลังจะตกลงสู่นรก พวกเขาถึงได้ทำเรื่องที่ชั่วร้ายและน่าสะพรึงกลัวเช่นนั้นออกมา","“มีเพียงแค่พวกท่านพ่อมดเท่านั้น ที่คอยคำนึงถึงพวกเรา ว่าจะได้กินอิ่มหรือไม่...”","ชาวเมืองชราคนหนึ่ง ที่กำลังถือข้าวสาลีจำนวนเล็กน้อย พูดด้วยน้ำเสียงสั่นเครือ","การรับประกันว่าจะมีอาหารให้กินครบทั้งสามมื้อ สำหรับลินน์แล้ว มันก็เป็นเพียงแค่สวัสดิการพื้นฐานของคนงาน และยังสามารถช่วยยับยั้งความวุ่นวายภายในอาณาจักรได้อีกด้วย แต่สำหรับพวกคนยากจนแล้ว มันกลับแตกต่างออกไป","พวกเขาไม่เคยได้รับการเอาใจใส่เช่นนี้มาก่อนเลย!","ในมุมมองของซูซาน การที่พวกท่านพ่อมด ผู้ปกครองเมืองน้ำมันดินแห่งนี้ จู่ๆ ก็ประกาศจัดหาอาหารให้คนงานกินครบทั้งสามมื้อ นั่นก็เป็นเพราะพวกเขารู้ดี ว่าพวกคนยากจนอย่างพวกเขา ไม่มีปัญญาหาซื้อข้าวสาลีที่ราคาพุ่งสูงขึ้นได้ ความเมตตากรุณานี้ ทำให้เธอกับสามีรู้สึกซาบซึ้งใจเป็นอย่างมาก","มีเพียงคนที่เคยเผชิญกับภาวะอดอยากเท่านั้น ถึงจะเข้าใจว่ามันเป็นสถานการณ์ที่น่าสะพรึงกลัวมากเพียงใด โดยครั้งที่แล้ว พวกเขาโชคดีที่สามารถเอาชีวิตรอดมาได้ แล้วครั้งนี้ล่ะ?","ดังนั้น หลังจากที่ปรึกษากับสามีแล้ว ซูซานจึงตัดสินใจที่จะนำเสบียงอาหารส่วนหนึ่ง มาขายให้กับสภาเวทมนตร์","ก่อนหน้านี้ ในตอนที่ราคาอาหารกำลังพุ่งสูงขึ้น ด้วยความช่วยเหลือจากคำเตือนที่ร้านขนมปัง พวกเขาจึงนำเงินเก็บทั้งหมดที่มี ออกมาซื้อข้าวสาลีเอาไว้กว่าหนึ่งร้อยกิโลกรัม และก่อนหน้านี้ พวกเขาก็ได้แบ่งขายออกไปครึ่งหนึ่งแล้ว...","ครึ่งแรกนั้นเป็นส่วนของเธอกับสามี ส่วนอีกครึ่งหนึ่ง ถูกเตรียมเอาไว้สำหรับลูกๆ ทั้งสองคน เดิมที ซูซานไม่ได้ตั้งใจจะนำมันมาขาย แต่เมื่อวานนี้ จู่ๆ เธอก็ได้ยินมา ว่าสาเหตุที่สภาเวทมนตร์ ต้องลดราคารับซื้อลงเรื่อยๆ นั่นก็เป็นเพราะเงินทุนสำรองของพวกเขาเริ่มจะไม่เพียงพอแล้ว เธอถึงได้นำข้าวสาลีส่วนนี้ออกมา","ความสามารถของเธอมีจำกัด เธอจึงทำได้เพียงแค่ช่วยเหลือเพียงเล็กน้อยเท่านั้น...ไม่แน่ว่า ภายในขนมปังที่พวกเขากินอยู่ที่โรงงาน อาจจะมีส่วนผสมจากข้าวสาลีของตนเองรวมอยู่ด้วยก็เป็นได้!","บรรดาชาวเมืองคนอื่นๆ ก็ผลัดกันเล่าถึงประสบการณ์ของตนเองเช่นกัน พวกเขาก็เหมือนกับซูซาน ที่เพิ่งจะเคยสัมผัสได้ถึงความรู้สึกของการถูกให้ความสำคัญเป็นครั้งแรก ที่แท้ก็มีคนให้ความสนใจในความเป็นอยู่ ของพวกคนยากจนที่อยู่ต่ำต้อยที่สุดอย่างพวกเขาจริงๆ","ผู้คนต่างก็ยกย่องสรรเสริญถึงความแข็งแกร่งของเวทมนตร์ และความเมตตากรุณาของพวกพ่อมด และเนื่องจากไอวีน่าเองก็มีฐานะเป็นพ่อมดคนหนึ่ง คำยกย่องสรรเสริญจำนวนไม่น้อย จึงถูกส่งมาที่ตัวของเธอเช่นกัน","ไอวีน่าเงียบไป คำยกย่องสรรเสริญเหล่านั้น ราวกับมีดแหลมคม ที่ทิ่มแทงเข้าไปในหัวใจของเธอ เพราะไม่มีใครรู้ดีไปกว่าเธออีกแล้ว ว่าไอ้สงครามเสบียงอาหารอะไรนี่ มอนโรเป็นคนคิดมันขึ้นมา และข่าวลือที่แพร่สะพัดไปทั่วทั้งอาณาจักร ก็เป็นพวกเธอเองที่เป็นคนปล่อยมันออกมา","“ถ้าไม่มีพวกขุนนางเหล่านั้นก็คงจะดี ที่นี่มันแทบจะไม่ต่างอะไรกับสรวงสวรรค์เลยจริงๆ!”","ซูซานอดไม่ได้ที่จะพูดขึ้น","“สรวงสวรรค์งั้นหรือ?”","ไอวีน่าไม่รู้ว่าตนเองควรจะแสดงสีหน้าแบบไหนออกมา และคาดไม่ถึงเลยจริงๆ ว่าคำๆ นี้ จะถูกนำมาใช้กับดินแดน ที่อยู่ภายใต้การปกครองของพวกพ่อมดเช่นนี้","ในขณะที่ไอวีน่ากำลังลังเลอยู่นั้น ในที่สุด ประตูของโรงนาที่ถูกปิดสนิท ก็ถูกเปิดออก เมื่อซูซานและคนอื่นๆ เห็นเช่นนั้น พวกเขาก็รีบเข้าไปล้อมเอาไว้ แล้วเอ่ยปากพูดด้วยความร้อนรน","“ท่านพ่อมด วันนี้ราคาข้าวสาลีลดลงเหลือเท่าไหร่แล้ว?”","“เสบียงอาหารสำรองของสภาเวทมนตร์ยังเพียงพออยู่หรือไม่?”","“นี่คือข้าวสาลีบางส่วนที่ข้าเก็บสะสมเอาไว้ แม้ว่ามันจะไม่มาก แต่ขอให้ท่านช่วยรับมันเอาไว้ด้วยเถิด”","บรรดาชาวเมืองกว่าร้อยคน ที่มารวมตัวกันอยู่หน้าโรงนา ต่างก็พูดคุยกันอย่างจอแจ พร้อมกับยื่นข้าวสาลี ที่ถูกห่อด้วยผ้ากระสอบชนิดต่างๆ ในมือของตนเองส่งไปให้ บางคนถึงขั้นรู้สึกว่า การที่สภาเวทมนตร์จัดหาอาหารให้พวกเขากินครบทั้งสามมื้อ มันดูจะมากเกินไปเสียด้วยซ้ำ อันที่จริง การกินแค่วันละมื้อ มันก็ไม่ได้เลวร้ายอะไร ซึ่งนั่นก็จะช่วยประหยัดเสบียงอาหารไปได้มากเลยทีเดียว","ท่ามกลางความคาดหวังอันแรงกล้าของผู้คน เพียร์ซกลับไม่ได้ยื่นมือไปรับข้าวสาลีเหล่านั้นมา ตรงกันข้าม เขากลับพูดด้วยความรู้สึกผิด","“ขอบคุณสำหรับความช่วยเหลือของพวกเจ้า แต่ตั้งแต่วันนี้เป็นต้นไป สภาเวทมนตร์ไม่ได้เตรียมการที่จะรับซื้อข้าวสาลีอีกแล้วล่ะ!”","“ทำไมล่ะ ท่านพ่อมด? หรือว่าเงินทุนสำรองของพวกท่านจะไม่เพียงพอแล้วจริงๆ?”","ซูซานรีบเอ่ยถาม","ชาวเมืองคนอื่นๆ ต่างก็มีสีหน้าที่เต็มไปด้วยความกังวล","“ไม่ ไม่ใช่อย่างที่พวกเจ้าคิดหรอก!”","เพียร์ซส่ายหน้าอย่างขบขัน จากนั้น บนใบหน้าของเขาก็เผยให้เห็นถึงความภาคภูมิใจออกมา","“อันที่จริง ท่านศาสตราจารย์ลินน์ ได้แก้ไขปัญหาการขาดแคลนเสบียงอาหาร ได้อย่างสมบูรณ์แบบแล้ว...นับตั้งแต่นี้เป็นต้นไป ทุกคนก็ไม่จำเป็นต้องมาเป็นกังวลเรื่องปัญหาความอดอยากอีกต่อไป!”","ลินน์...ดาวรุ่งแห่งเวทมนตร์ผู้นั้นน่ะหรือ?","ไอวีน่ารู้สึกประหลาดใจเป็นอย่างมาก ภายในเมืองน้ำมันดินแห่งนี้ เธอเคยได้ยินชื่อนี้มานับครั้งไม่ถ้วนแล้ว ดูเหมือนว่าการเปลี่ยนแปลงทุกสิ่งทุกอย่างในโลกเวทมนตร์ ล้วนมีความเกี่ยวข้องกับอีกฝ่ายเสมอ","ตอนนี้มันยิ่งเกินจริงเข้าไปใหญ่ ดาวรุ่งแห่งเวทมนตร์ผู้นี้ ถึงกับกล้าพูดว่าตนเอง สามารถแก้ไขปัญหาความอดอยากได้อย่างสมบูรณ์แบบเลยงั้นรึ","ชั่วขณะหนึ่ง ไอวีน่าก็ไม่สามารถแน่ใจได้ ว่านี่เป็นข่าวปลอมที่สภาเวทมนตร์ตั้งใจปล่อยออกมา หรือว่าเป็นเรื่องจริงกันแน่","ซูซานและคนอื่นๆ ก็มีสีหน้าตกตะลึงเช่นกัน พวกเขาล้วนรู้สึกไม่อยากจะเชื่อในสิ่งที่ได้ยิน","“หากพวกเจ้าสนใจ ทำไมไม่ลองไปดูด้วยตาของตนเองดูล่ะ...”","เพียร์ซชี้ไปทางสถานีรถไฟ แล้วพูดทิ้งท้ายเอาไว้ให้คิด","“วันนี้รถไฟเปิดให้บริการแล้วนะ!”","ไอวีน่าเดินออกจากหน้าโรงนาด้วยความสับสนมึนงง เธอเดินไปพร้อมกับซูซานและคนอื่นๆ ที่มีความสงสัยแบบเดียวกัน มุ่งหน้าไปยังสถานที่ ที่เคยเป็นที่ตั้งของโบสถ์ ซึ่งก็คือทิศทางของสถานีรถไฟในตอนนี้นั่นเอง","ที่นั่นเนืองแน่นไปด้วยผู้คนมาตั้งแต่แรกแล้ว บรรดาชาวเมืองนับหมื่นคน มารวมตัวกันอยู่ที่จัตุรัสหน้าสถานีรถไฟ แต่ละคนต่างก็เขย่งเท้า และชะเง้อคอมองเข้าไปดูสถานการณ์ภายในสถานี","ไอวีน่าเองก็รู้สึกอยากรู้อยากเห็นเป็นอย่างมาก เธอต้องการจะเข้าไปดูให้เห็นกับตา และด้วยเข็มกลัดพ่อมดที่ติดอยู่บนหน้าอกของเธอ ทำให้ตลอดทาง บรรดาชาวเมืองต่างก็พร้อมใจกันหลีกทางให้เธอเดินเข้าไป","ไม่นาน รถไฟสีเงินขาวขนาดมหึมาหลายขบวน ก็ปรากฏขึ้นเบื้องหน้าของเด็กสาว!","พวกมันมีความสูงถึงสามเมตรกว่า และมีความยาวกว่าเจ็ดสิบเมตร ดูราวกับงูยักษ์ที่ขดตัวอยู่ภายในเมือง...","รูปร่างอันเพรียวลมของมัน ทำให้บรรดาพ่อมดและชาวเมืองทุกคน ที่ได้เห็นมันเป็นครั้งแรก ต่างก็ต้องอุทานออกมาจากก้นบึ้งของหัวใจ","ช่างเป็นสิ่งประดิษฐ์ที่งดงามเสียจริง...","แต่สิ่งที่ทำให้ไอวีน่ารู้สึกตกตะลึงมากยิ่งกว่า ก็คือลังสินค้าที่กองสูงเป็นภูเขาภายในสถานีรถไฟ ด้วยสายตาอันเฉียบแหลมของเธอ ทำให้เธอสามารถมองเห็นได้อย่างชัดเจน ว่าภายในลังไม้ที่ยังไม่ได้ถูกปิดผนึกเหล่านั้น ล้วนเต็มไปด้วยขนมปังก้อนและผงแป้งสีขาวบริสุทธิ์ชนิดหนึ่ง","ไอวีน่าที่ไม่รู้จักแป้งเทียม จึงเข้าใจผิดคิดว่ามันคือแป้งสาลีที่เกิดจากการบดข้าวสาลี","ตู้โดยสารขนาดมหึมาสิบตู้แรก ถูกบรรจุเอาไว้จนเต็มเอี๊ยดแล้ว ส่วนบรรดาคนงานภายในสถานี ก็ยังคงทำงานอย่างหนัก เพื่อขนส่งลังสินค้าจำนวนมากขึ้น ไปยังตู้โดยสารที่อยู่ด้านหลัง","พวกพ่อมดยังมีเสบียงอาหารเหลืออยู่อีกมากมายขนาดนี้เชียวหรือ!","ทุกสิ่งทุกอย่างที่เธอได้เห็นอยู่ตรงหน้า มันอยู่เหนือความคาดหมายของไอวีน่าไปอย่างสิ้นเชิง","เสียงพูดคุยและเสียงอุทานอันดังลั่นรอบๆ ตัว ดังเข้าหูของไอวีน่าอย่างต่อเนื่อง บางคนก็รู้สึกประหลาดใจ กับสิ่งประดิษฐ์ชิ้นใหม่ของพวกพ่อมด บางคนก็ร้องไห้ออกมาอย่างเสียสติ เมื่อได้เห็นขนมปังและเสบียงอาหารที่กองสูงเป็นภูเขาเหล่านั้น","แต่เสียงส่วนใหญ่ กลับเป็นการยกย่องสรรเสริญ ต่อสิ่งประดิษฐ์ชิ้นใหม่ของดาวรุ่งแห่งเวทมนตร์ผู้นั้น พวกเขาต่างก็ถือหนังสือพิมพ์เอาไว้ในมือ พร้อมกับถกเถียงกัน ว่าจะใช้เวทมนตร์เพื่อสร้างขนมปังขึ้นมาได้อย่างไร...","ไอวีน่าขมวดคิ้ว เธอแทบจะสงสัย ว่าตนเองหูฝาดไปหรือเปล่า การใช้เวทมนตร์สร้างขนมปังขึ้นมาจากความว่างเปล่าเนี่ยนะ? ล้อกันเล่นหรือไง?","ต่อให้จะเป็นท่านพระสันตะปาปา ก็ไม่อาจทำเรื่องเช่นนี้ได้ บางที อาจจะมีเพียงแค่เทพีแห่งดวงจันทร์เท่านั้น ที่จะสามารถแสดงปาฏิหาริย์เช่นนี้ได้","“ท่านผู้นี้ พอจะให้ข้าขอยืมอ่านหนังสือพิมพ์ฉบับนี้สักหน่อยได้หรือไม่?”","ไอวีน่าอดไม่ได้ที่จะเอ่ยปากร้องขอ","พ่อมดชายคนหนึ่งที่ถูกขัดจังหวะการสนทนา หันหน้ามาด้วยความไม่พอใจ แต่หลังจากที่ได้เห็นหน้าตาอันสะสวยของเด็กสาว เขาก็เปลี่ยนท่าทีให้ดูอ่อนโยนลงในทันที พร้อมกับพูดด้วยความใจกว้าง","“แน่นอน ไม่มีปัญหา ฉบับนี้ข้ายกให้เจ้าเลยก็แล้วกัน ยังไงข้าก็อ่านจบ และจดจำเนื้อหาทั้งหมดเอาไว้แล้วล่ะ”","ไอวีน่ากล่าวขอบคุณอย่างมีมารยาท หลังจากที่รับมันมา เธอก็เหลือบมองดู แล้วก็ต้องชะงักไปกับพาดหัวข่าวในนั้นทันที!","[การวิจัยและการวิเคราะห์ เกี่ยวกับกระบวนการสังเคราะห์ด้วยแสงของพืช ถกเถียงถึงความเป็นไปได้ของ (เวทมนตร์สร้างขนมปัง)!]","ผู้เขียน ก็คือ ดาวรุ่งแห่งเวทมนตร์ ลินน์ อย่างชัดเจน!","ส่วนบทความความยาวหลายพันตัวอักษร ที่กินพื้นที่หน้ากระดาษไปจนหมด ไอวีน่าไม่สามารถทำความเข้าใจเนื้อหาเหล่านั้นได้เลย แต่โชคดี ที่พ่อมดชายที่อยู่ด้านข้าง ได้อาสาอธิบายให้เธอฟังด้วยความกระตือรือร้น","ช่วงครึ่งแรกของบทความ เป็นการอธิบาย ว่าพืชทำการสังเคราะห์ด้วยแสงอย่างไร เพื่อเปลี่ยนธาตุต่างๆ ให้กลายเป็นสารอาหารที่ร่างกายสามารถดูดซึมได้ ส่วนในครึ่งหลัง ก็เป็นการวิจัย ว่าจะทำอย่างไร ถึงจะสามารถใช้เวทมนตร์ เพื่อจำลองกระบวนการนี้ขึ้นมาได้","และน่าจะเป็นเพราะเหตุผลเรื่องความลับ บนนั้นจึงไม่ได้ระบุรูปแบบของวงเวทที่แน่ชัดเอาไว้ แต่ถึงกระนั้น มันก็ได้เน้นย้ำถึงความสำคัญของสิ่งของสามอย่าง","วิธีการสร้างเสบียงอาหารที่ง่ายที่สุด ก็คือการพึ่งพาเพียงแค่น้ำ คาร์บอนไดออกไซด์ และไฟฟ้า ก็เพียงพอแล้ว!","“ท่านปรมาจารย์ลินน์ ช่างสมกับที่เป็นดาวรุ่งแห่งเวทมนตร์จริงๆ ถึงกับสามารถคิดหาวิธีการเช่นนี้ เพื่อนำมาใช้แก้ปัญหาการขาดแคลนเสบียงอาหารได้”","พ่อมดชายผู้นั้นพูดด้วยความเคารพเลื่อมใส","ไอวีน่าคาดไม่ถึงเลยจริงๆ ว่าพวกพ่อมด จะสามารถใช้เวทมนตร์ เพื่อสร้างเสบียงอาหารขึ้นมาได้จริงๆ!","เธอเคยเรียนวิชาเคมีมาบ้าง จึงรู้ดีว่าคาร์บอนไดออกไซด์คืออะไร ซึ่งเรียกได้ว่าทุกคน ล้วนเป็นเครื่องจักรที่สามารถผลิตคาร์บอนไดออกไซด์ออกมาได้อย่างมหาศาล จึงไม่จำเป็นต้องเป็นกังวล เรื่องการขาดแคลนวัตถุดิบเลยแม้แต่น้อย","ส่วนเรื่องน้ำ ก็ยิ่งไม่ต้องพูดถึง อาณาจักรแห่งนี้ไม่ได้ขาดแคลนน้ำเลย แถมพวกพ่อมด ก็ยังสามารถควบคุมสายฟ้าได้อีกด้วย หรือจะพูดอีกอย่างหนึ่งก็คือ ขอเพียงแค่ต้องการ อีกฝ่ายก็จะสามารถสร้างเสบียงอาหารจำนวนมหาศาลออกมาได้อย่างไม่หยุดหย่อน ลังสินค้าที่กองเป็นภูเขาอยู่ภายในสถานีรถไฟนั่น ก็คือหลักฐานชั้นดี!","แต่คนที่ตอบสนองต่อเรื่องนี้มากที่สุด กลับไม่ใช่ไอวีน่า แต่เป็นบรรดาขุนนางและพ่อค้าผู้มั่งคั่ง ที่เพิ่งจะกว้านซื้อเสบียงอาหารไปเป็นจำนวนมากก่อนหน้านี้ต่างหาก!","พวกเขาบางคนถึงกับทรุดตัวลงไปนั่งกองกับพื้นด้วยความสิ้นหวัง บางคนก็ร้องตะโกนออกมาอย่างเสียสติ","เพราะทุกคนต่างก็รู้ดี ว่าทันทีที่รถไฟขบวนนี้ ขนส่งตู้โดยสารที่เต็มไปด้วยขนมปัง ไปยังเมืองต่างๆ ของอาณาจักร ข้าวสาลีในมือของพวกเขา ก็จะกลายเป็นของไร้ค่าในพริบตา!","ต่อให้ผลลัพธ์มันจะออกมาดีที่สุด ทรัพย์สินของพวกเขาก็จะต้องหดหายไปหลายร้อยเท่าอย่างแน่นอน!","ภายในใจของพ่อค้าผู้มั่งคั่งคนหนึ่ง ถึงขั้นเกิดความคิด ที่จะระเบิดรถไฟขบวนนี้ และเผาทำลายขนมปังที่กองเป็นภูเขาเหล่านั้น ให้เป็นจุลไปให้หมดเลยด้วยซ้ำ","แต่เรือเหาะคุ้มกันกว่ายี่สิบลำ เครื่องบินรบห้าลำ และรถหุ้มเกราะอีกกว่าห้าสิบคัน โดยปากกระบอกปืนอันดำมืดของพวกมัน ก็เพียงพอที่จะทำให้ความคิดอันไม่สงบสุขเหล่านั้น หายวับไปจากหัวของพวกเขาได้ในทันที!","เสียงร้องไห้อันสิ้นหวังของบรรดาขุนนางและพ่อค้าผู้มั่งคั่ง ไม่สามารถเรียกความเห็นใจจากผู้คนได้เลยแม้แต่น้อย ตรงกันข้าม มันกลับได้รับสายตาที่เต็มไปด้วยความเย้ยหยันและเหยียดหยามแทน บางคนถึงขั้นส่งเสียงเชียร์ชื่อของดาวรุ่งแห่งเวทมนตร์ เพื่อเฉลิมฉลองให้กับชัยชนะในครั้งนี้ด้วยซ้ำ","ห่างออกไปราวห้าร้อยเมตร ลินน์ที่กำลังถูกผู้คนกล่าวขวัญถึง ก็ยืนอยู่บนหลังคาบ้านของชาวบ้านคนหนึ่ง เขากำลังมองดูรถไฟขนาดมหึมา ที่กำลังแล่นห่างออกไปไกล ท่ามกลางเสียงคำรามกึกก้อง!","รถไฟเจ็ดขบวน บรรทุกแป้งเทียมและขนมปังรวมทั้งหมดกว่าหกพันตัน และเมื่อรวมกับเสบียงอาหารกว่าห้าพันตันที่เพิ่งถูกปล่อยออกไปก่อนหน้านี้ มันก็เพียงพอที่จะกลายเป็นฟางเส้นสุดท้าย ที่จะบดขยี้อูฐตัวนั้นให้จมดินได้แล้ว!","“แจ้งให้ลอดด์ทราบ ให้พวกเขาเริ่มทวงหนี้ได้แล้ว!”","ลินน์สั่งการ","“ขอรับ ท่านศาสตราจารย์ลินน์!”","เอล็อคที่ยืนอยู่ด้านข้าง พูดด้วยความเคารพเลื่อมใส จากนั้น เขาก็ทำการส่งสัญญาณคลื่นแม่เหล็กไฟฟ้า เพื่อแจ้งเรื่องการทวงหนี้ออกไปในทันที","ตลอดช่วงเกือบหนึ่งเดือนที่ผ่านมา สภาเวทมนตร์ได้ใช้กองคาราวานสินค้ากว่าสิบกลุ่ม เป็นตัวแทนในการปล่อยเงินกู้ โดยมีทรัพย์สินของพ่อค้าผู้มั่งคั่งและขุนนางเหล่านั้น เป็นสิ่งค้ำประกัน ซึ่งคิดเป็นเงินหลายสิบล้านเหรียญทองของอาณาจักร  โดยเงินที่ปล่อยกู้ออกไปเหล่านั้น ก็คือเงินที่คนพวกนี้ใช้ซื้อเสบียงอาหารมาตั้งแต่แรกนั่นเอง!","ท้ายที่สุด เงินเหล่านั้นก็วนกลับมาอยู่ในมือของพวกเขาอีกครั้ง แถมมันยังพ่วงมาด้วยทรัพย์สิน คฤหาสน์ ทาส และแม้กระทั่งชาวเมืองของพวกมันอีกด้วย!","การพนันมันไม่เข้าใครออกใครจริงๆ...ลินน์ถอนหายใจกับตัวเอง ทันทีที่หน้ามืดตามัว จุดจบของมันก็คือการสิ้นเนื้อประดาตัว ผลกำไรนับร้อยเท่า ก็เพียงพอที่จะทำให้คนเราบ้าคลั่งจนขาดสติ และยอมทุ่มเททุกสิ่งทุกอย่างที่ตนมี เพื่อแลกกับชัยชนะที่ไม่มีอยู่จริง..."]},{"n":470,"t":"เหตุใดฝ่าบาทถึงต้องการจะก่อกบฏด้วยล่ะ?!","c":["ณ เมืองหลวงของฮัดลาตา ภายในป้อมปราการอันหรูหราแห่งหนึ่ง จู่ๆ มอร์แทนก็สะดุ้งตื่นขึ้นมาบนเตียง ร่างกายของเขาเปียกโชกไปด้วยเหงื่อเย็น","เขาฝันเห็นพวกพ่อมดใช้เวทมนตร์สร้างขนมปังออกมาเป็นจำนวนมหาศาล จากนั้น ข้าวสาลีในมือของเขาก็กลายเป็นของไร้ค่า...","แต่มันจะเป็นไปได้อย่างไร?","การใช้เวทมนตร์สร้างขนมปัง มันเป็นเรื่องไร้สาระชัดๆ!","มอร์แทนใช้มือที่สั่นเทาเช็ดเหงื่อบนหน้าผาก และพยายามฝืนลุกขึ้นนั่งบนเตียง แต่ไม่นานเขาก็สังเกตเห็นถึงความผิดปกติบางอย่าง","“บาคัส...บาคัส!”","มอร์แทนตะโกนเรียกชื่อพ่อบ้านประจำคฤหาสน์อย่างต่อเนื่อง แต่กลับไม่ได้รับการตอบรับใดๆ ผ่านไปพักใหญ่ กว่าจะมีอัศวินคนหนึ่งรีบวิ่งเข้ามา","“ท่านมอร์แทน ท่านตื่นแล้วหรือขอรับ?”","“บาคัสล่ะ? เขาไปไหนแล้ว?!”","มอร์แทนจับแขนของอัศวินเอาไว้แน่น แล้วเอ่ยปากคาดคั้นด้วยความกระวนกระวายใจ","“เขาจากไปตั้งแต่เมื่อครึ่งชั่วโมงก่อนแล้วขอรับ...แถม...แถมยังฉวยโอกาสหยิบเหยือกแก้วหลากสีใบโปรดของท่านติดมือไปด้วย...”","อัศวินผู้นั้นพูดตะกุกตะกักอยู่นาน กว่าจะกล้าพูดความจริงออกมา และยังมีอีกหลายเรื่องที่เขายังไม่ได้บอก นั่นก็คือตอนนี้ ของมีค่าจำนวนไม่น้อยภายในป้อมปราการ ล้วนถูกพวกคนรับใช้ที่หลบหนีไป ขโมยติดมือไปด้วย โดยพวกเขาไม่สามารถหยุดยั้งคนพวกนั้นได้ทัน และไม่มีความสามารถพอที่จะหยุดยั้งได้เลย","“บาคัส ข้าเลี้ยงดูมันมานานถึงสี่สิบปี มันกล้าดีอย่างไร?”","มอร์แทนที่กำลังโกรธจัด สมองขาวโพลนไปชั่วขณะ และแทบจะสลบไปอีกรอบ แต่สิ่งที่ทำให้เขารู้สึกหนาวเหน็บไปทั้งตัวมากยิ่งกว่า ก็คือความหมายที่แฝงอยู่เบื้องหลังเรื่องนี้","“แล้วหนังสือพิมพ์ฉบับวันนี้ล่ะ? ไปเอาหนังสือพิมพ์มาให้ข้าเดี๋ยวนี้!”","มอร์แทนพูดด้วยความร้อนรน","“แล้วก็ รีบส่งคนไปที่เมืองน้ำมันดิน ใช้ทุกวิถีทางเพื่อตรวจสอบมาให้ข้า ข้าอยากจะรู้ ว่าในมือของพวกพ่อมดนั่น ยังมีเสบียงอาหารเหลืออยู่อีกหรือไม่!”","ท่ามกลางเสียงตวาดของมอร์แทน อัศวินผู้นั้นกลับไม่ขยับเขยื้อน เขาพูดด้วยความระมัดระวัง","“ท่านมอร์แทน ตอนนี้เกรงว่าจะไม่จำเป็นต้องตรวจสอบอีกแล้วล่ะขอรับ”","เมื่อหนึ่งชั่วโมงก่อน รถไฟที่เดินทางมาจากเมืองน้ำมันดิน ได้มาถึงเมืองหลวงแล้ว ตอนนี้ ภายในสถานีรถไฟ เสบียงอาหารที่ถูกขนถ่ายลงมา ได้กองสูงเป็นภูเขาเลากาไปนานแล้ว และโรงงานบางแห่ง ก็เริ่มใช้นโยบายจัดหาอาหารให้กินวันละสี่มื้ออย่างเป็นทางการแล้วด้วย","หลักฐานทั้งหมดได้บ่งชี้ให้เห็นถึงสิ่งหนึ่ง นั่นก็คือสภาเวทมนตร์ไม่ได้ขาดแคลนเสบียงอาหารเลย แถมยังมีมากเท่าที่พวกเขาต้องการเสียด้วยซ้ำ!","ตอนนี้ บรรดาขุนนางใหญ่และพ่อค้าผู้มั่งคั่งทั่วทั้งเมืองหลวงต่างก็แทบจะบ้าคลั่งไปแล้ว ซึ่งมีคนจำนวนไม่น้อย ที่ต้องการจะเทขายเสบียงอาหารในมือของตนเองออกไปอย่างบ้าคลั่ง แต่เนื่องจากสภาเวทมนตร์ได้จัดหาอาหารและที่พักให้ครบทั้งสามมื้อ จึงไม่มีใครยอมรับซื้อเสบียงอาหารในปริมาณมากๆ อีกต่อไป","นั่นทำให้ ราคาของข้าวสาลี จากที่เคยสูงถึงห้าร้อยเหรียญทองแดง ก็ลดลงมาเหลือเพียงแค่หนึ่งเหรียญทองแดงต่อห้ากิโลกรัม ในพริบตา แต่ก็ยังไม่มีใครชายตามองด้วยซ้ำ","ข่าวลือแพร่สะพัดไปทั่วตลาด โดยมีข่าวลือว่าพวกพ่อมด สามารถเสกอากาศให้กลายเป็นขนมปัง และเสกน้ำในทะเลสาบให้กลายเป็นเหล้าชั้นดีได้ เสบียงอาหารในมือของพวกเขา จึงกลายเป็นของไร้ค่าอย่างสิ้นเชิง เพราะนับตั้งแต่นี้เป็นต้นไป สภาเวทมนตร์จะเป็นผู้รับผิดชอบ เรื่องอาหารและที่พักของทุกคนในอาณาจักร...","ส่วนเส้นทางการค้าที่มุ่งหน้าไปยังจักรวรรดิ ก็ถูกปิดกั้นทั้งสองทางแล้ว โดยพวกเขาที่ไม่มีกำลังในการขนส่งมากพอ และยิ่งเป็นไปไม่ได้เลย ที่จะสามารถหลอกลวงสภาเวทมนตร์ เพื่อขนส่งเสบียงอาหารจำนวนมากขนาดนี้ ออกไปนอกอาณาจักรได้","คำพูดแต่ละประโยคของอัศวินผู้นั้น ราวกับดาบยาว ที่แทงทะลุเข้าไปในหน้าอกของมอร์แทนโดยตรง","เขาเข้าใจแล้วว่าตนเองจบสิ้นแล้ว ทุกสิ่งทุกอย่างพังทลายลงไปหมดแล้ว...","“กุสตาฟ เจ้าหลอกข้า!”","มอร์แทนคำรามออกมาด้วยความโกรธเกรี้ยว แต่เห็นได้ชัดว่า ผู้บัญชาการกองทัพทัณฑ์ศักดิ์สิทธิ์ที่เขาพูดถึง ไม่สามารถช่วยเหลือเขาได้อีกต่อไปแล้ว","ในขณะนั้นเอง จู่ๆ ด้านนอกป้อมปราการก็มีเสียงจอแจดังขึ้น ตามมาด้วยเสียงการโต้เถียงกันอย่างรุนแรง","สีหน้าของมอร์แทนเปลี่ยนไปอย่างกะทันหัน เขาแทบจะกลิ้งตกลงมาจากเตียง","อัศวินผู้นั้นไม่ได้รอให้มอร์แทนเอ่ยถาม เขาชิงพูดขึ้นก่อน","“น่าจะเป็นพวกพ่อค้าที่มาทวงหนี้ เดินทางมาถึงแล้วล่ะขอรับ!”","ความโกรธเกรี้ยวภายในใจของมอร์แทนพุ่งปรี๊ดขึ้นมาทันที ตั้งแต่เมื่อไหร่กัน ที่พวกพ่อค้าต่ำต้อยเพียงไม่กี่คน ถึงได้มีโอกาสกล้าบุกรุกเข้ามาในคฤหาสน์ของมาร์ควิสแห่งอาณาจักรเช่นนี้?","แม้เขาจะรับมือกับพวกพ่อมดไม่ได้ แต่เขาจะรับมือกับพ่อค้าผู้มั่งคั่งเพียงไม่กี่คนไม่ได้เชียวหรือ?","มอร์แทนที่กำลังโกรธจัด จึงชักดาบที่เหน็บอยู่ที่เอวของอัศวินออกมา เขาไม่ได้แม้แต่จะสวมรองเท้า ก็บุกออกไปด้วยความโกรธเกรี้ยว","ภายในห้องโถงด้านหน้าของป้อมปราการ ทหารองครักษ์ผู้ภักดีกว่าสิบคน กำลังเผชิญหน้ากับกลุ่มแขกที่ไม่ได้รับเชิญ ที่บุกรุกเข้ามา","ชายที่เป็นผู้นำดูเป็นคนใจดีและเป็นมิตร อายุราวๆ สี่สิบปี เขากำลังหรี่ตาลงเล็กน้อย และมีรูปร่างที่อวบอ้วนสมบูรณ์","“สแตนฟอร์ด?! ใครให้ความกล้าแก่เจ้า ในการบุกรุกเข้ามาในคฤหาสน์ของข้า!”","มอร์แทนที่ถือดาบเดินเท้าเปล่าเข้ามาในห้องโถงด้านหน้าของป้อมปราการ พูดด้วยน้ำเสียงเย็นชา","“คฤหาสน์ของท่านงั้นหรือ?”","บนใบหน้าของสแตนฟอร์ด เผยให้เห็นถึงความประหลาดใจเล็กน้อย จากนั้น เขาก็ล้วงเอาโฉนดที่ดินใบหนึ่งออกมาจากอกเสื้ออย่างช้าๆ แล้วพูดด้วยน้ำเสียงเป็นมิตร","“ท่านน่าจะขี้ลืมไปหน่อยกระมัง ท่านมาร์ควิสมอร์แทน คฤหาสน์หลังนี้มันกลายเป็นของข้าไปแล้ว!”","“แน่นอน ท่านสามารถเลือกที่จะนำเงินสามหมื่นเหรียญทองมาเพื่อซื้อมันกลับไปก็ได้นะ!”","สแตนฟอร์ดพูดอย่างไม่ใส่ใจ","เมื่อเห็นอีกฝ่ายหยิบโฉนดที่ดินออกมาให้ดูโดยตรง มอร์แทนก็ถึงกับพูดไม่ออกไปชั่วขณะ เขาทำได้เพียงแค่ข่มความโกรธเอาไว้ แล้วเอ่ยปากโต้แย้ง","“ข้าจำได้ว่ากำหนดเวลาบนนั้น น่าจะเป็นหนึ่งเดือนไม่ใช่หรือ!”","“นี่มันเงินตั้งสามหมื่นเหรียญทองของจักรวรรดิเลยนะ ท่านมาร์ควิส ภายในหนึ่งเดือน ข้าเกรงว่าท่านคงจะไม่สามารถหาเงินก้อนนี้มาจ่ายได้หรอก ดังนั้น เพื่อป้องกันไม่ให้เกิดเหตุการณ์ไม่คาดฝันขึ้น ข้าจึงทำได้เพียงแค่มาเก็บหนี้ก่อนกำหนดเท่านั้น!”","สแตนฟอร์ดพูดด้วยความรู้สึกผิด จากนั้น เขาก็ชี้ไปที่ตัวอักษรขนาดเล็กเท่าแมลงวันบนสัญญา","“ข้อนี้มันถูกระบุเอาไว้ในสัญญาอย่างชัดเจนแล้วนะ!”","มอร์แทนถึงกับโกรธจนหัวเราะออกมา เขาไม่เคยถูกดูหมิ่นเช่นนี้มาก่อนเลย เขานั้นเป็นถึงมาร์ควิสผู้ยิ่งใหญ่แห่งอาณาจักรเชียวนะ ถึงกับมีคนคิดว่าตนเอง ไม่มีปัญญาจ่ายเงินเพียงแค่สามหมื่นเหรียญทองของจักรวรรดิเนี่ยนะ!","แม้ว่าตอนนี้เขาจะไม่มีเงินเก็บเหลืออยู่แล้ว แต่ในดินแดนของเขา ยังคงมีที่ดิน เหมืองแร่ ทาส และแม้กระทั่งชาวเมืองอยู่อีกมากมาย...","แต่เขายังไม่ทันได้เอ่ยปาก สแตนฟอร์ดก็ราวกับคาดเดาเอาไว้ล่วงหน้าแล้ว โดยใบรับเงินใบแล้วใบเล่า ก็ปรากฏขึ้นในมือของเขา และท้ายที่สุด มันก็กองรวมกันจนกลายเป็นสมุดเล่มเล็กๆ","และนั่นก็คือใบรับรองการจำนำทรัพย์สินต่างๆ ภายในดินแดนของมาร์ควิส!","สีหน้าของมอร์แทนเปลี่ยนไปในพริบตา เขาไม่ได้รู้สึกแปลกใจกับใบรับรองการจำนำเหล่านี้ ท้ายที่สุดแล้ว นี่เป็นสิ่งที่เขาสั่งให้คนนำไปจำนำด้วยตัวเอง แต่สิ่งที่ทำให้เขาตกตะลึงอย่างแท้จริง ก็คือการที่ใบรับรองจำนวนมากขนาดนี้ กลับไปตกอยู่ในมือของสแตนฟอร์ดเพียงคนเดียวได้อย่างไร","“เจ้าคือคนของสภาเวทมนตร์!”","รูม่านตาของมอร์แทนหดเล็กลง","เขาเข้าใจขึ้นมาในทันที ว่าทำไมสแตนฟอร์ดถึงกล้าบุกรุกเข้ามาในคฤหาสน์ของเขาโดยตรง ทำไมพวกพ่อค้าเหล่านั้น ถึงยอมให้เขาจำนำเหมืองแร่และทรัพย์สินในดินแดนของตนเอง ในราคาที่สูงลิ่ว...","ก่อนหน้านี้ มอร์แทนที่ถูกผลกำไรก้อนโตทำให้หน้ามืดตามัว ไม่ได้คิดอะไรให้รอบคอบ เขาคิดแค่ว่าอีกฝ่ายรู้ว่าตนเอง มีข้าวสาลีราคาแพงอยู่ในมือเป็นจำนวนมาก ดังนั้น พวกเขาถึงได้ยอมให้จำนำในราคาที่สูงกว่าปกติ","ตอนนี้ดูเหมือนว่า นี่มันจะเป็นหลุมพรางตั้งแต่ต้นจนจบเลยนี่นา!","“แน่นอนสิ ท่านมาร์ควิส ตลอดเวลาที่ผ่านมา พวกเราทุกคน ล้วนทำงานให้กับพวกท่านพ่อมดไม่ใช่หรือ?” สแตนฟอร์ดไม่ได้มีความคิดที่จะปิดบัง เขาจึงยอมรับออกมาอย่างตรงไปตรงมา","มอร์แทนแทบจะกัดฟันจนแหลกละเอียด แต่เนื่องจากเขายังมีความหวาดระแวงอยู่ เขาจึงไม่กล้าผลีผลามลงมือ และทำได้เพียงแค่เอ่ยปากพูดขึ้นอีกครั้ง “นอกจากทรัพย์สินเหล่านี้แล้ว ข้ายังมีข้าวสาลีอยู่อีกนับไม่ถ้วน...”","“อย่าพูดเป็นเล่นไปเลย ข้าวสาลีในตอนนี้ มันไม่มีค่าอะไรหรอกนะ!” สแตนฟอร์ดพูดแทรกขึ้นมาด้วยน้ำเสียงเย็นชา ตอนนี้ ทั่วทั้งอาณาจักร เต็มไปด้วยพ่อค้าที่นำเสบียงอาหารมาขาย ภายในตลาด มีเสบียงอาหารรวมกันแล้วกว่าล้านตันเชียวนะ!","นอกจากสภาเวทมนตร์แล้ว ใครมันจะไปกว้านซื้อมาได้หมด? แล้วใครมันจะสามารถขนส่งออกไปได้?","“แต่มันก็ยังพอจะเอามาหักลบกลบหนี้ได้บ้างล่ะนะ... ส่วนเรื่องราคา ก็เอาเป็นว่า ยี่สิบกิโลกรัมต่อหนึ่งเหรียญทองแดงก็แล้วกัน!” สแตนฟอร์ดพูดด้วยรอยยิ้ม “ท่านมีข้าวสาลีอยู่ในมือทั้งหมดสองแสนตัน หากคิดตามราคาตลาดในตอนนี้ ก็จะเท่ากับหนึ่งพันเหรียญทองของจักรวรรดิ!”","ทหารองครักษ์ที่อยู่ด้านหลัง หยิบถุงเงินออกมาทีละใบ แล้วโยนลงบนพื้น","“นั่นไง อยู่ตรงนั้นทั้งหมดแล้ว!”","เจ้าพูดจาเหลวไหล...","มอร์แทนแทบจะโกรธตายอยู่ตรงนั้น คำพูดลอยๆ เพียงประโยคเดียวของสแตนฟอร์ด กลับต้องการจะรับซื้อข้าวสาลีมูลค่าหลายสิบล้าน กลับไปในราคาเพียงแค่หนึ่งพันเหรียญทองเนี่ยนะ","ยี่สิบกิโลกรัมต่อหนึ่งเหรียญทองแดง มันเป็นเรื่องไร้สาระชัดๆ ต่อให้ภายในตลาด จะไม่มีใครรับซื้อเสบียงอาหารแล้ว เขาก็ยังสามารถนำมันไปหมักเป็นเบียร์ หรือนำไปทำเป็นอาหารสัตว์ หรือแม้กระทั่งนำเสบียงอาหารบางส่วนไปขายให้กับจักรวรรดิ เพื่อชดเชยการขาดทุนเพียงเล็กน้อยนี้ได้!","เพียงแต่สองวิธีแรก หากต้องการจะทำกำไรให้ได้มากพอ เห็นได้ชัดว่ามันไม่ใช่สิ่งที่จะสามารถทำได้ภายในระยะเวลาเพียงแค่หนึ่งเดือน คนที่มีความคิดแบบเดียวกับเขา ก็ไม่ได้มีจำนวนน้อยๆ อย่างแน่นอน ไม่แน่ว่าอาจจะเกิดปรากฏการณ์แห่กันไปขายของ จนทำให้ราคาตกต่ำลงไปอีกก็ได้","ส่วนการนำไปขายให้กับจักรวรรดิ มันก็สามารถทำได้เพียงแค่แบบลับๆ เท่านั้น มอร์แทนไม่ได้โง่พอ ที่จะพูดเรื่องนี้ออกมาโต้งๆ ไม่อย่างนั้น เขาอาจจะถูกยัดข้อหาสมรู้ร่วมคิดกับศัตรูเพิ่มขึ้นมาอีกข้อหาหนึ่งก็ได้!","“น่าเสียดาย ที่เงินหนึ่งพันเหรียญทองนี้ ก็ไม่สามารถมอบให้กับท่านได้นะ ท่านมาร์ควิส!” สแตนฟอร์ดส่ายหน้า แล้วสั่งให้ทหารองครักษ์เก็บถุงเงินทั้งสิบใบนั้นกลับคืนมา ก่อนจะถอนหายใจแล้วพูดต่อ “ท่านกู้ยืมเงินจากกองคาราวานสินค้ากลุ่มต่างๆ ไปรวมเป็นเงินทั้งสิ้นห้าล้านเหรียญทองของจักรวรรดิ แต่ต่อให้จะนำทรัพย์สินที่ถูกนำมาจำนองเหล่านี้ ไปขายจนหมดเกลี้ยง มันก็สามารถชดใช้หนี้ได้เพียงแค่เจ็ดส่วนเท่านั้น ท่านยังคงเป็นหนี้อยู่อีกมากเลยทีเดียว”","ใบหน้าของมอร์แทนแดงก่ำ เขาเข้าใจดีว่าวันนี้ตนเองคงจะจบไม่สวยอย่างแน่นอน","สิ่งเดียวที่ทำให้เขารู้สึกโชคดีอยู่บ้าง ก็คือทหารองครักษ์ที่สแตนฟอร์ดพามาด้วย แม้ว่าจะมีจำนวนมาก แต่บนตัวของพวกเขากลับดูเหมือนจะไม่ได้พกพาสิ่งประดิษฐ์เล่นแร่แปรธาตุที่เรียกว่าปืนคาบศิลามาด้วย ด้วยพละกำลังของตนเอง ก็ใช่ว่าจะไม่สามารถจัดการกับคนพวกนี้ได้ทั้งหมด!","เมื่อคิดถึงจุดนี้ มอร์แทนก็ยกมือขึ้นมาทำสัญลักษณ์ ทหารองครักษ์ที่กำลังเผชิญหน้ากับสแตนฟอร์ดและคนอื่นๆ ก็พุ่งเข้าไปหาราวกับหมาป่าที่หิวโหยในทันที","พวกเขาล้วนเป็นทหารองครักษ์ ที่ถูกตระกูลมอร์แทนเลี้ยงดูมาตั้งแต่เด็ก พวกเขาได้ละทิ้งความเป็นความตายไปนานแล้ว และจะไม่มีทางตั้งข้อสงสัยใดๆ ต่อคำสั่งของมาร์ควิสอย่างเด็ดขาด","แต่สิ่งที่เร็วกว่าความเร็วในการแกว่งดาบของพวกเขาก็คือ...วิชาชักปืน!","ท่ามกลางสายตาอันตกตะลึงของบรรดาอัศวินและทหารองครักษ์ ทหารองครักษ์ที่อยู่ด้านหลังของสแตนฟอร์ด ก็ชักปืนคาบศิลาลำกล้องสั้นออกมาจากเอวทีละกระบอก!","อาวุธปืนที่มีความประณีต และพกพาสะดวกเช่นนี้ ถูกลิเดียสร้างขึ้นมาตั้งแต่เมื่อหนึ่งปีก่อนแล้ว แต่โดยปกติแล้ว จะมีเพียงแค่สายลับที่ปฏิบัติภารกิจพิเศษเท่านั้น ถึงจะมีสิทธิ์ได้ใช้งานพวกมัน!","ท้ายที่สุดแล้ว ในการปฏิบัติภารกิจแทรกซึมและลอบสืบสวน ปืนคาบศิลาลำกล้องสั้น จะมีความสะดวกในการพกพา แถมยังมีความสามารถในการซ่อนเร้น และความสามารถในการจู่โจมอย่างกะทันหันที่ยอดเยี่ยมเป็นอย่างมาก สายลับจำนวนไม่น้อย ล้วนได้รับการฝึกฝนวิชาชักปืนอันยอดเยี่ยมมาแล้วทั้งสิ้น!","ซึ่งผู้ที่โดดเด่นในหมู่พวกเขา ถึงขั้นสามารถชักปืน เล็ง และยิงให้เสร็จสิ้นได้ ภายในเวลาเพียงแค่ศูนย์จุดหนึ่งวินาทีเท่านั้น!","วินาทีต่อมา เสียงปืนอันดุดันก็ดังก้องไปทั่วห้องโถงด้านหน้าของป้อมปราการ","แม้ว่าทหารองครักษ์กว่าสิบคน จะสวมชุดเกราะที่ยอดเยี่ยม แต่พวกเขาจะสามารถต้านทานการโจมตี ของกระสุนเจาะเกราะได้อย่างไร พวกเขาถูกยิงจนร่างพรุนเป็นรังผึ้ง โดยที่ยังไม่ทันจะได้ทำการตอบโต้อย่างมีประสิทธิภาพเลยด้วยซ้ำ!","มอร์แทนยิ่งตกใจจนวิญญาณแทบจะหลุดออกจากร่าง แม้ว่าเขาจะเป็นอัศวินสายเลือด แต่เขาก็ไม่มีความมั่นใจเลยสักนิด ว่าตนเองจะสามารถใช้ร่างกาย เพื่อต้านทานการโจมตีของปืนคาบศิลาจำนวนมากขนาดนี้ได้ ไม่นาน เขาก็ถูกกระสุนหลายนัดยิงเข้าที่แขนและต้นขา ทำให้เขาทรุดลงไปกองกับพื้น ท่ามกลางแอ่งเลือดของตนเอง","“รักษาแผลให้เขาหน่อยสิ อย่าปล่อยให้เขาตายไปเสียก่อนล่ะ ข้าสงสัยว่าเขาอาจจะทรยศต่ออาณาจักรไปแล้ว พากลับไปให้คนสอบสวนดูดีๆ ก็แล้วกัน!” สแตนฟอร์ดเก็บปืนคาบศิลาในมือกลับไป เมื่อครู่นี้ ก็เป็นเขาที่ใช้ทักษะการยิงปืนอันยอดเยี่ยม ยิงเข้าที่แขนขาของอีกฝ่าย จนทำให้พวกมันหักสะบั้นลง","บรรดาสายลับเริ่มจัดการกับสถานที่เกิดเหตุอย่างเชี่ยวชาญ และจัดการกับศพทั้งหมดทิ้ง ส่วนสแตนฟอร์ดก็นำวิทยุเวทมนตร์ออกมา เพื่อส่งข่าวสารออกไป","เอิร์ลเบลล์ตายแล้ว ไวส์เคานต์สเคอร์ถูกจับขังคุก มาร์ควิสมอร์แทนถูกจับเป็น...","ข้อมูลข่าวสารจำนวนมหาศาล ถูกส่งไปถึงมือของลอดด์ ผ่านสัญญาณคลื่นแม่เหล็กไฟฟ้า เนื่องจากการพังทลายลงอย่างกะทันหันของราคาเสบียงอาหาร ทำให้บรรดาขุนนางและพ่อค้าผู้มั่งคั่ง ที่ถูกพวกเขาจับกุมตัวได้ในครั้งนี้ มักจะจมอยู่กับจินตนาการ ว่าตนเองนั้นร่ำรวยเทียบเท่ากับอาณาจักรหนึ่งเมื่อวินาทีก่อน แต่ในวินาทีต่อมา พวกเขากลับถูกริบทรัพย์สินไปจนหมดเกลี้ยง โดยที่ไม่มีโอกาสได้ตอบสนองเลยแม้แต่น้อย","ซึ่งนี่ก็ทำให้ปฏิบัติการจับกุมตัวส่วนใหญ่ เป็นไปอย่างราบรื่นมาก จะมีก็เพียงแค่ข้อกเว้นเดียวเท่านั้น นั่นก็คือแกรนด์ดยุกการ์ดหลบหนีไปได้!","เรื่องนี้ ลอดด์เองก็รู้สึกจนปัญญาเช่นกัน ตลอดช่วงหนึ่งเดือนที่ผ่านมา พวกเขาจำเป็นต้องจับตาดูเป้าหมายหลายร้อยเป้าหมาย แถมยังต้องลงมือพร้อมๆ กันอีกด้วย กำลังคนของพวกเขามันไม่เพียงพอจริงๆ","ยิ่งไปกว่านั้น คนส่วนใหญ่ที่พวกเขากำลังรับมือด้วย ล้วนเป็นพ่อค้าผู้มั่งคั่งและขุนนาง ซึ่งมีอำนาจอยู่ในมือระดับหนึ่ง การจะจับกุมตัวคนพวกนั้นได้ทั้งหมดโดยไม่มีตกหล่นเลยนั้น มันไม่ใช่เรื่องง่ายๆ อย่างแน่นอน","โชคดีที่คนที่หลบหนีไปได้ เป็นเพียงแค่ดยุกแห่งอาณาจักร ที่สูญเสียดินแดนและทรัพย์สมบัติไปจนหมดแล้วเท่านั้น เขาไม่สามารถสร้างคลื่นลมอะไรได้อีกหรอก แถมเป้าหมายที่สำคัญที่สุดของพวกเขา ก็ยังคงไม่มีความสามารถพอที่จะหลบหนีไปได้อีกด้วย!","“ไปกันเถอะ พวกเราไปที่พระราชวังกัน!” ลอดด์เก็บข้อมูลข่าวสารที่อยู่ในมือกลับไปทีละ
