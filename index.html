างส่วนไปซะแล้ว...","ลูเซียกัดฟันแน่น โดยเธอส่งต่อความทรงจำส่วนที่สำคัญที่สุด กลับไปยังร่างต้น วินาทีต่อมา จิตวิญญาณของเธอก็ถูกทำลายล้างจนสิ้นซากท่ามกลางอุณหภูมิสูงหลายสิบล้านองศา และภาพฉายอาณาเขตแห่งสรวงสวรรค์ที่ปกคลุมอยู่ภายนอกก็พังทลายลงในพริบตา!","นับตั้งแต่วินาทีที่ระเบิดนิวเคลียร์ปะทุขึ้น จนถึงตอนที่จิตวิญญาณของลูเซียถูกทำลาย ล้วนเกิดขึ้นในชั่วพริบตา หลังจากที่อาณาเขตแห่งสรวงสวรรค์หายไป คลื่นกระแทกที่พกพาอุณหภูมิสูง เปลวเพลิง และกัมมันตภาพรังสี ก็แผ่ขยายออกไปทุกทิศทุกทาง!","ภูเขาที่ถูกขุดจนกลวงแต่แรก ได้ระเบิดออกเสียงดังสนั่นหวั่นไหว หินก้อนยักษ์จำนวนนับไม่ถ้วนที่ยังไม่ทันร่วงหล่นลงมา ก็ถูกอุณหภูมิสูงห่อหุ้มเอาไว้ และกลายเป็นลาวาอันร้อนระอุ...","“ป้องกันให้ดี ห้ามลืมตาเด็ดขาด!”","ลินน์ที่กระโดดลงมาจากภูเขาแร่ล่วงหน้าตะโกนเตือนเสียงดังลั่น","เมื่อแฮร์รอฟและออโรร่าได้ยินเช่นนั้น พวกเขาก็หลับตาแน่น และใช้พลังเวทที่เหลืออยู่เพียงน้อยนิด เพื่อสร้างเกราะป้องกันรอบกาย","มีเพียงวิกโตริโอที่อยากรู้อยากเห็นเท่านั้น ที่หรี่ตาขึ้นเล็กน้อย และพยายามจะมองดู แต่หลังจากนั้น เลือดก็ไหลซึมออกมาจากดวงตาทั้งสองข้าง ภายใต้แสงสว่างอันน่าสะพรึงกลัว!","แต่ก่อนที่จะสูญเสียการมองเห็น วิกโตริโอก็เห็นได้อย่างชัดเจนว่า คลื่นพลังงานอุณหภูมิสูงที่ส่งต่อด้วยความเร็วหลายเท่าของความเร็วเสียง ได้ไล่ตามพวกเขามาแล้ว!","โชคดีที่ภาพฉายอาณาเขตแห่งสรวงสวรรค์ และภูเขาแร่ที่ถูกขุดจนกลวง ช่วยถ่วงเวลาให้พวกเขาได้มากพอ ก่อนที่คลื่นกระแทกจากการระเบิดของนิวเคลียร์จะมาถึง พวกเขาทั้งสี่คนก็พุ่งลงไปในแม่น้ำลึกพร้อมกัน!","วินาทีต่อมา คลื่นพลังงานอุณหภูมิสูงก็พัดผ่านผิวน้ำ ทำให้เกิดคลื่นยักษ์ถาโถม น้ำในแม่น้ำนับหมื่นตันระเหยกลายเป็นไอในชั่วพริบตา คลื่นน้ำยังคงม้วนตัวอย่างบ้าคลั่ง และไม่นาน คลื่นกระแทกก็พัดพาไปตามสายน้ำ ปลาและกุ้งภายในแม่น้ำต่างก็ถูกแรงกระแทกจนตายเกลื่อน ผิวน้ำเต็มไปด้วยซากศพลอยฟ่องอย่างรวดเร็ว...","โชคดีที่คลื่นกระแทกระดับนี้ สำหรับพ่อมดระดับตำนานแล้ว พวกเขายังคงพอจะต้านทานมันเอาไว้ได้!","และนี่ก็เป็นเหตุผลที่ลินน์เจาะจงเลือกที่นี่ให้เป็นสนามรบ!","...","ในขณะเดียวกัน ภายในป่าทึบที่อยู่ห่างออกไปหลายกิโลเมตร แร็กนาร์ก็กำลังนำพากองทัพของศาสนจักรเดินทางอย่างสุดกำลัง","เพื่อให้สามารถไปช่วยเหลือสตรีศักดิ์สิทธิ์ได้ทันเวลา กองทัพแห่งนี้จึงเร่งความเร็วในการเดินทัพจนถึงขีดสุด แต่ด้วยการเดินทัพในตอนกลางคืน ประกอบกับการเร่งรีบเดินทางอย่างต่อเนื่อง ทำให้ทหารของจักรวรรดินับพันนายต้องร่วงหล่นอยู่เบื้องหลัง","แต่เห็นได้ชัดว่าแร็กนาร์ไม่สามารถสนใจพวกเขาได้อีกต่อไป เพราะเขาเห็นสถานการณ์การต่อสู้บนท้องฟ้าก่อนหน้านี้อย่างชัดเจน แม้ว่าลูเซียที่ขี่กริฟฟอนจะสามารถยิงเรือเหาะของพวกพ่อมดตกได้ แต่เธอก็ถูกลำแสงเลเซอร์ยิงเข้าใส่ จนตกอยู่ในสถานการณ์ที่อันตรายเป็นอย่างมากเช่นกัน","“ไม่ต้องกังวลไปหรอกท่านแร็กนาร์ สตรีศักดิ์สิทธิ์ได้รับการชี้นำจากพระผู้เป็นเจ้าแล้ว นางจะต้องเอาชนะสมุนของพวกปีศาจร้าย และคว้าชัยชนะในท้ายที่สุดมาได้อย่างแน่นอน!”","อาร์ชบิชอปที่อยู่ข้างๆ ทำท่าสวดภาวนา และเอ่ยด้วยความมั่นใจ","แร็กนาร์ข่มความกังวลในใจเอาไว้ แต่ไม่นานมันก็ถูกแทนที่ด้วยสัญญาณเตือนภัยที่ผุดขึ้นมาในหัว","แสงสว่างอันเจิดจ้าถึงขีดสุดสว่างขึ้นที่ด้านหน้า โดยลอดผ่านร่มเงาของต้นไม้ในป่า","นี่มันเช้าแล้วงั้นรึ?","ความสงสัยนี้ผุดขึ้นมาในใจของทุกคน แต่ตอนที่พวกเขาออกเดินทาง มันก็เป็นเวลาประมาณตีหนึ่งเท่านั้น ซึ่งยังห่างไกลจากเวลาที่ดวงอาทิตย์จะขึ้น","แต่แสงสว่างกลับยิ่งทวีความเจิดจ้ามากขึ้นเรื่อยๆ ในเวลาเพียงแค่หนึ่งวินาที ท้องฟ้าก็ถูกอาบไปด้วยแสงสีแดงก่ำ แม้แต่แสงอาทิตย์ในตอนเที่ยงวัน ก็ยังไม่สว่างเจิดจ้าถึงเพียงนี้!","“อ๊าก~ ตาข้า!”","เสียงร้องโหยหวนดังขึ้นมาอย่างต่อเนื่องในแถวของทหาร รังสีความร้อนอันรุนแรง แม้จะอยู่ห่างออกไปหลายกิโลเมตร แต่ก็ยังคงทรงพลัง บรรดาทหารที่เงยหน้ามองท้องฟ้า ต่างก็รู้สึกปวดแสบปวดร้อนที่ดวงตา","จากนั้น พื้นดินทั้งหมดก็สั่นสะเทือนอย่างรุนแรง ท่ามกลางเสียงดังกึกก้องราวกับแก้วหูจะแตกสลาย เมฆรูปเห็ดขนาดยักษ์ก็ลอยเด่นขึ้นสู่ท้องฟ้า!","แม้จะมีต้นไม้ขวางกั้น จึงทำให้พวกเขาไม่สามารถมองเห็นได้อย่างชัดเจนว่าเกิดอะไรขึ้นเบื้องหน้า แต่ความหวาดกลัวก็แผ่ซ่านเข้าไปในใจของทุกคนอย่างหลีกเลี่ยงไม่ได้","บางคนถึงกับคิดว่านี่คือลางบอกเหตุของวันสิ้นโลก!","“อย่าเพิ่งตื่นตระหนก!”","แร็กนาร์ตะโกนเสียงดัง เพื่อเรียกสติของทุกคนกลับมา","“นี่จะต้องเป็นพลังของพระผู้เป็นเจ้าอย่างแน่นอน!”","“เทพีแห่งดวงจันทร์อันยิ่งใหญ่ ผู้สร้างสรรพสิ่งกำลังลงทัณฑ์พวกปีศาจร้าย!”","เมื่อพูดถึงตรงนี้ น้ำเสียงของแร็กนาร์ก็ยิ่งหนักแน่นมากขึ้น","บรรดาบิชอป นักบวช และผู้ศรัทธาต่างก็เชื่อในทันที เพราะในความเข้าใจของพวกเขา มีเพียงพระผู้เป็นเจ้าเท่านั้น ที่สามารถใช้พลังอันน่าสะพรึงกลัว ที่ทำให้ฟ้าดินเปลี่ยนสีเช่นนี้ได้!","และก็ไม่มีใครอยากจะเชื่อด้วยว่า พลังอันแข็งแกร่งเช่นนี้ จะเป็นฝีมือของพวกปีศาจร้าย!","“อ๊า! สรรเสริญพระองค์ พระผู้เป็นเจ้าผู้ยิ่งใหญ่ พลังของพระองค์ทำให้ดวงดาวยังต้องหมองหม่น!”","บิชอปคนหนึ่งตะโกนออกมาด้วยความคลั่งไคล้","นักบวชที่คลั่งไคล้บางคน ถึงกับลงจากหลังม้าและคุกเข่าสวดภาวนา","แสงอันเจิดจ้าเข้าใกล้พวกเขามากขึ้นเรื่อยๆ อาร์ชบิชอปคนนั้นถึงกับกางแขนออก เพื่อต้อนรับแสงศักดิ์สิทธิ์ที่กำลังจะมาถึง!","แต่แร็กนาร์กลับพบสิ่งผิดปกติ เพราะในแสงสว่างที่สาดส่องเข้ามาหาพวกเขา มันกลับแฝงไปด้วยอุณหภูมิสูงจนยากจะทนทาน และที่สำคัญที่สุดก็คือ เขาไม่สามารถสัมผัสได้ถึงพลังศักดิ์สิทธิ์จากมันเลย","นี่ไม่ใช่พลังของพระผู้เป็นเจ้าอย่างแน่นอน!","ใบหน้าของแร็กนาร์ปรากฏความหวาดกลัวขึ้นมา แต่ในวินาทีต่อมา เปลวเพลิงอันเจิดจ้าและคลื่นกระแทกพลังงานสูง ก็ได้พัดผ่านป่าทึบแห่งนี้ไปแล้ว...","ต้นไม้ใหญ่ถูกฉีกกระชากในพริบตา พื้นดินอันหนาทึบกลายเป็นผืนดินที่ไหม้เกรียมอันไร้ขอบเขต อาร์ชบิชอปที่กางแขนโอบรับแสงศักดิ์สิทธิ์ ก็กลายเป็นศพไหม้เกรียมในวินาทีที่เปลวเพลิงพัดผ่าน","คนที่น่าสงสารยิ่งกว่าบรรดาบิชอปเหล่านี้ ก็คือทหารของจักรวรรดิ ด้วยร่างกายที่ปราศจากการป้องกันของพวกเขา พวกเขาจึงระเหยกลายเป็นไอไปพร้อมกับชุดเกราะ และกลายเป็นส่วนหนึ่งของธรรมชาติ","และที่ด้านบนของพวกเขา ซึ่งอยู่ห่างออกไปประมาณสามกิโลเมตร เรือเหาะที่เหลือเพียงหกสิบกว่าลำ ก็กำลังสั่นสะเทือนอย่างรุนแรงท่ามกลางแรงลมมหาศาล","“เร่งความเร็ว เร่งความเร็วเข้า อย่าหยุดนะ!”","บนเรือเหาะลำหนึ่ง ฟิลิปกำลังเร่งเร้าอย่างร้อนรน ด้วยความเร็วระดับนี้ พวกเขามีโอกาสสูงมากที่จะถูกคลื่นกระแทกไล่ตามทัน","“นี่เป็นความเร็วสูงสุดแล้วขอรับ ท่านพ่อมด!”","นักบินหันหลังให้ และมุ่งความสนใจไปที่การควบคุมเรือเหาะ โดยไม่กล้าหันกลับไปมองแสงสว่างเหล่านั้นเลย","มีเพียงฟิลิปและคนอื่นๆ ที่สวมแว่นตาเล่นแร่แปรธาตุเท่านั้น ที่สามารถมองเห็นความยิ่งใหญ่ของการระเบิดนิวเคลียร์ได้...","ตามคำกล่าวของศาสตราจารย์ลินน์ แสงสว่างเหล่านี้เจิดจ้าเกินกว่าที่จะมองด้วยตาเปล่าได้ แต่ถ้าหากสวมแว่นตาเล่นแร่แปรธาตุ ที่สามารถต้านทานรังสีอัลตราไวโอเลตได้ในระดับหนึ่ง ก็ยังพอจะมองเห็นได้","แต่ถึงแม้ว่าความสว่างของแสงจะลดลงไปหลายสิบเท่าแล้วก็ตาม แต่ดวงตาทั้งสองข้างของพวกเขาก็ยังคงปวดแสบปวดร้อนจนน้ำตาไหลออกมาอยู่ดี","“นี่คือเวทมนตร์บทใหม่ของศาสตราจารย์ลินน์งั้นรึ?”","ทิคมองดูภูเขาที่ถล่มทลาย แม่น้ำที่ระเหยกลายเป็นไอ และพื้นดินที่กลายเป็นเศษแก้วไหม้เกรียม ท่ามกลางคลื่นกระแทกอุณหภูมิสูงอันน่าสะพรึงกลัว น้ำเสียงของเขาสั่นเครือเล็กน้อย","“นี่มันช่าง...”","ทิคถึงกับพูดไม่ออกไปชั่วขณะ ผ่านไปพักใหญ่เขาก็เอ่ยปากขึ้นมา","“เหมือนกับว่าดวงอาทิตย์ที่ร่วงหล่นลงมาจากท้องฟ้าเลย!”","คำพูดของทิคสื่อถึงความรู้สึกของทุกคน นอกจากคำว่าดวงอาทิตย์ร่วงหล่นแล้ว พวกเขาก็หาคำอธิบายอื่นไม่ได้อีกแล้ว","นี่คือพลังที่เวทมนตร์สามารถมีได้จริงๆ งั้นรึ?","ความสงสัยผุดขึ้นมาในใจของทุกคน","และนี่ก็เป็นเพียงแค่คลื่นกระแทกเท่านั้น อานุภาพที่ใจกลางของมัน จะต้องน่าสะพรึงกลัวยิ่งกว่านี้อย่างแน่นอน","บางทีอาจจะต้องใช้พลังที่แข็งแกร่งถึงเพียงนี้เท่านั้น ถึงจะสามารถต่อกรกับเทพจอมปลอมองค์นั้นได้!","โชคดีที่ทิคพบว่า ความเร็วของคลื่นกระแทกด้านล่าง กำลังลดลงอย่างช้าๆ ตามขอบเขตที่แผ่ขยายออกไป มันไม่ได้รุนแรงเหมือนเมื่อก่อนอีกแล้ว ดังนั้น ด้วยความเร็วประมาณหนึ่งร้อยกิโลเมตรต่อชั่วโมงของเรือเหาะ หากหลบหลีกได้ทันเวลา ก็คงจะสามารถหลบหนีออกจากรัศมีของการระเบิดนิวเคลียร์ได้อย่างแน่นอน","...","ในวินาทีที่ระเบิดนิวเคลียร์ดังกึกก้อง เมืองน้ำมันดินที่อยู่ห่างออกไปหลายสิบกิโลเมตร การต่อสู้ก็เข้าสู่จุดเดือดแล้ว!","การบุกโจมตีของแอนโธนี่และคนอื่นๆ ประสบความสำเร็จเป็นอย่างมาก เนื่องจากกำลังหลักถูกดึงตัวไป ทำให้เมืองน้ำมันดินที่ขาดกองกำลังป้องกัน และไม่สามารถต้านทานพวกเขาได้ถึงสิบนาที ก็ถูกยึดครองได้อย่างราบรื่น แต่โจชัวที่นำกองทัพทัณฑ์ศักดิ์สิทธิ์นับพันนายมาถึงในภายหลัง กลับทำให้พวกเขาตั้งตัวไม่ติด!","ช่องว่างระหว่างระดับตำนาน และจอมเวทผู้ยิ่งใหญ่นั้น ราวกับฟ้ากับเหว","เพียงแค่สามนาทีของการปะทะ จอมเวทผู้ยิ่งใหญ่เจ็ดคนที่รุมล้อมโจชัว ก็ได้ตกตายไปแล้วถึงสองคน!","ส่วนอีกห้าคนที่เหลือก็ล้วนได้รับบาดเจ็บกันถ้วนหน้า","แอนโธนี่ได้รับบาดเจ็บสาหัสที่สุด โดยที่หน้าอกของเขานั้น มีรอยแผลลึกจนเห็นกระดูก","แต่โจชัวกลับดูผ่อนคลาย มีเพียงเสื้อคลุมด้านขวาที่ถูกเผาไหม้ไปครึ่งหนึ่ง และคทาในมือที่หักไปครึ่งหนึ่งเท่านั้น","บรรดาจอมเวทผู้ยิ่งใหญ่ที่เข้าร่วมการล้อมกรอบ แม้จะทุ่มเทอย่างสุดกำลัง แต่ก็ยังมองไม่เห็นโอกาสที่จะเอาชนะอีกฝ่ายได้เลย พวกเขาจึงอดไม่ได้ที่จะคิดถอยหนี","“ทุกคน อีกไม่นาน ท่านประธานสภาทั้งหลายก็จะจัดการสตรีศักดิ์สิทธิ์คนนั้น และกลับมาช่วยเหลือพวกเราแล้ว!”","แอนโธนี่ปลุกระดมขวัญกำลังใจ","แม้ว่าแผนการของพวกเขาจะเกิดความผิดพลาดไปบ้าง แต่ตราบใดที่พวกเขาสามารถถ่วงเวลาประธานผู้พิพากษาคนนี้เอาไว้ที่นี่ได้ มันก็จะช่วยลดความกดดันของพวกลินน์ลงไปได้มาก และทำให้แผนการดำเนินไปได้อย่างราบรื่นมากยิ่งขึ้น!","“ช่วยเหลือเรอะ?”","โจชัวแค่นเสียงหัวเราะ ก่อนจะเอ่ยออกมา","“พวกเจ้าไม่รู้ด้วยซ้ำ ว่าคู่ต่อสู้ที่พวกเขากำลังเผชิญหน้าอยู่ เป็นตัวตนแบบไหน!”","บรรดาบิชอปและนักบวชของศาสนจักร มักจะคิดว่าสตรีศักดิ์สิทธิ์ของศาสนจักร เป็นเพียงแค่หญิงรับใช้ที่ถูกเลือกมาคอยรับใช้พระผู้เป็นเจ้า และเป็นเพียงแค่แจกันดอกไม้ที่สวยงามเท่านั้น","แต่มีเพียงแค่ระดับสูงอย่างพวกเขาเท่านั้น ที่เข้าใจถึงเหตุผลที่สตรีศักดิ์สิทธิ์ต้องมีตัวตนอยู่","เพราะนั่นคือร่างจุติของพระผู้เป็นเจ้า!","สิ่งที่เรียกว่า ‘ระดับตำนาน’ ของพวกพ่อมดเหล่านี้ ต่อให้จะมีมากกว่านี้อีกหลายเท่าตัว ก็จะต้องถูกพลังอันยิ่งใหญ่ของพระผู้เป็นเจ้าบดขยี้จนแหลกสลายไปโดยตรงอย่างแน่นอน!","“ทุกอย่างจบลงเพียงเท่านี้แหละ!”","น้ำเสียงของโจชัวเย็นชาเป็นอย่างมาก","ดูเหมือนว่าหากไม่เรียกใช้พลังจากอาณาเขตแห่งสรวงสวรรค์สักหน่อย ก็คงจะไม่สามารถจัดการกับพวกพ่อมดเหล่านี้ ได้ในระยะเวลาอันสั้นสินะ!","“ที่นี่คืออาณาเขตแห่งเทพ ความชั่วร้ายทั้งหมดจงสูญสลายไป!”","โจชัวสวดภาวนาเสียงดัง","พรรคพวกของแอนโธนี่ต่างก็มีสีหน้าเคร่งขรึม พวกเขารู้ดีถึงความแข็งแกร่งของอาณาเขตแห่งสรวงสวรรค์ ซึ่งเป็นพลังที่พวกเขาไม่อาจต่อต้านได้","แต่สิ่งที่เหนือความคาดหมายของทุกคนก็คือ เมื่อเสียงของโจชัวดังขึ้น กลับไม่มีนิมิตใดๆ เกิดขึ้นเลย","จนทำให้พ่อมดที่อยู่ที่นั่นต่างก็สับสน และคาดเดาว่า อีกฝ่ายตั้งใจที่จะข่มขู่พวกเขางั้นรึ?","ใบหน้าของโจชัวกลายเป็นน่าเกลียดเป็นอย่างมาก โดยเขาถูกพลังศักดิ์สิทธิ์สะท้อนกลับอย่างรุนแรง จนกระอักเลือดออกมาคำโต และสิ่งที่ทำให้เขาหวาดกลัวยิ่งกว่าก็คือ พลังศักดิ์สิทธิ์ในร่างกายของเขากำลังถูกดึงออกไป...","พระผู้เป็นเจ้าที่ยิ่งใหญ่ ได้ตัดการจ่ายพลังงานให้กับเขาอย่างกะทันหัน ส่งผลให้อาณาเขตแห่งสรวงสวรรค์ที่ยังไม่ทันเป็นรูปเป็นร่าง ก็พังทลายลงในพริบตา","“โซ่สายฟ้า!”","แม้ว่าแอนโธนี่จะไม่รู้ว่าเหตุใดอีกฝ่ายถึงหยุดโจมตีกะทันหัน แต่เขาก็ไม่ยอมปล่อยโอกาสนี้ให้หลุดลอยไป สายฟ้าสีน้ำเงินอมม่วง พุ่งทะยานเข้าฟาดฟันโจชัวจนล้มลงไปกองกับพื้นในพริบตา","จอมเวทผู้ยิ่งใหญ่คนอื่นๆ มองดูประธานผู้พิพากษาของศาสนจักร ที่เมื่อครู่ยังคงสำแดงเดช และทุบตีพวกเขาจนไม่มีแรงจะตอบโต้ กลับถูกเวทมนตร์โจมตีเข้าใส่ ต่างก็มีสีหน้างุนงง และถึงกับสงสัยว่า นี่เป็นพลังศักดิ์สิทธิ์ประเภทสร้างภาพหลอน ที่ต้องการให้พวกเขาลดความระมัดระวังลงหรือไม่","ในขณะที่ทุกคนกำลังสับสนอยู่นั้น คลื่นพลังงานอันแข็งแกร่งจนน่าขนลุก ก็แผ่ซ่านมาจากแดนไกล จนทำแอนโธนี่ต้องหันขวับไปมอง แล้วเขาก็ได้เห็นว่า บนท้องฟ้ายามค่ำคืน...กลับมีดวงอาทิตย์ปรากฏขึ้น!"]},{"n":441,"t":"อาณาเขตแห่งการทำลายล้างของระเบิดนิวเคลียร์!","c":["การระเบิดของนิวเคลียร์อันน่าสะพรึงกลัวดำเนินไปนานกว่าหนึ่งชั่วโมง ถึงค่อยๆ สงบลง พื้นที่ในรัศมีสิบกิโลเมตรล้วนกลายเป็นผืนดินที่ไหม้เกรียม ดินที่ผ่านการหลอมละลายจากอุณหภูมิสูงค่อยๆ เย็นตัวลง และแข็งตัวจนกลายเป็นสสารคล้ายแก้ว เมฆฝุ่นที่ลอยฟุ้งอยู่บนท้องฟ้ายังคงไม่จางหายไปเป็นเวลานาน...","ด้วยการอาศัยน้ำในแม่น้ำเป็นเกราะกำบัง ทำให้ลินน์ที่รอดชีวิตจากการระเบิดนิวเคลียร์ บินพุ่งออกมาจากแม่น้ำที่กำลังเดือดพล่าน ซึ่งประธานสภาทั้งสามก็ไม่ต่างกัน","“ช่างเป็นอานุภาพที่น่าสะพรึงกลัวจริงๆ!”","แฮร์รอฟเอ่ยด้วยความทอดถอนใจ","พวกเขาลอยตามกระแสน้ำมาไกลถึงเจ็ดแปดกิโลเมตร ซึ่งถือเป็นบริเวณรอบนอกสุดของการระเบิดนิวเคลียร์ แต่สิ่งที่เห็นนั้นถูกทำลายจนหมดสิ้น เหลือเพียงแค่เปลวไฟที่ลุกโชน ราวกับฉากในวันสิ้นโลก","แม้ว่าคราวก่อนลินน์จะเคยแสดงพลานุภาพของระเบิดนิวเคลียร์ให้พวกเขาได้เห็นแล้ว แต่การระเบิดในครั้งนั้นเกิดขึ้นที่ส่วนลึกใต้ดิน ทำให้รัศมีผลกระทบมีจำกัด และพวกเขาก็ยังไม่ได้เห็นอานุภาพของเวทมนตร์บทนี้ด้วยตาของตนเอง","แต่ครั้งนี้แตกต่างออกไป เพราะมันถูกจุดระเบิดบนพื้นดิน!","ภูเขาแร่ที่ถูกขุดจนกลวงเพียงลูกเดียว ย่อมไม่สามารถต้านทานคลื่นกระแทกของระเบิดนิวเคลียร์ได้อย่างมีประสิทธิภาพอยู่แล้ว","ออโรร่าที่มีสภาพดีที่สุด ได้ขยายอาณาเขตออกไปในทันที โดยเธอใช้พลังเวทสร้างวงแหวนขึ้นที่รอบนอกของทุกคน ซึ่งมันก่อตัวจากธาตุตะกั่วที่เรียงตัวกันอย่างหนาแน่น โดยปิดกั้นกัมมันตภาพรังสีเอาไว้ภายนอก","แม้ว่าความแข็งแกร่งของพวกเขา จะสามารถสร้างอาณาเขตเวทมนตร์เพื่อป้องกันตัวได้ แต่หากอยู่ในเขตที่มีกัมมันตภาพรังสีเป็นเวลานาน ร่างกายก็ย่อมต้องได้รับบาดเจ็บจนยากที่จะเยียวยาได้อยู่ดี","“ตาของท่านเป็นอะไรไป วิกโตริโอ?”","ออโรร่าหันหน้าไปมองวิกโตริโอที่หลับตาแน่นมาตลอด พร้อมกับขมวดคิ้วเอ่ยถาม","“ข้าน่าจะเคยบอกท่านแล้วนะ ว่าอย่ามองดูการระเบิดในครั้งนี้ ท่านประธานสภาวิกโตริโอ”","ลินน์ส่ายหน้าอย่างจนใจ แน่นอนว่าเขาสามารถดูออกว่า อาการบาดเจ็บที่ดวงตาของอีกฝ่ายนั้น เกิดจากการถูกแสงอันเจิดจ้าแผดเผา","แสงสว่างที่เกิดจากการระเบิดของนิวเคลียร์นั้นเจิดจ้าจนหาที่เปรียบไม่ได้ แถมยังมาพร้อมกับรังสีพลังงานสูงมากมายหลายชนิด ซึ่งถือว่าอันตรายเป็นอย่างมาก","วิกโตริโอยิ้มขื่นๆ ก่อนหน้านี้สิ่งที่ลินน์พูดมันดูเกินจริงไปมาก จนทำให้เขารู้สึกอยากรู้อยากเห็นเป็นอย่างมาก ว่ามันคือพลังแบบไหนกันแน่ ขนาดพ่อมดระดับตำนานอย่างพวกเขาก็ยังไม่สามารถมองตรงๆ ได้ ดังนั้นเขาจึงแอบมองดูเพียงแวบเดียว แต่ใครจะไปคิดว่าเพียงแค่ชั่วพริบตา ดวงตาทั้งสองข้างก็บอดสนิทไปเลย!","โชคดีที่นี่ไม่ใช่อาการบาดเจ็บที่รักษาไม่ได้ และด้วยความสามารถในการรับรู้ของเขา ต่อให้ไม่มีการมองเห็น มันก็ไม่ได้ส่งผลกระทบต่อการเคลื่อนไหว เพียงแต่คงต้องพักฟื้นไปอีกสักพักใหญ่","“นางน่าจะตายแล้วใช่ไหม?”","แฮร์รอฟมองไกลออกไปยังใจกลางของระเบิดนิวเคลียร์ ซึ่งเดิมทีตรงนั้นเคยเป็นภูเขาแร่ แต่ตอนนี้ภูเขาทั้งลูกได้หายไปแล้ว เหลือเพียงแค่หลุมขนาดมหึมา","“ก็หวังว่าจะเป็นเช่นนั้น! ถ้าถึงขนาดนี้ยังจัดการกับอีกฝ่ายไม่ได้ พวกเราก็คงทำได้แค่นอนรอความตายแล้วล่ะ!”","ลินน์เอ่ยด้วยสีหน้าเคร่งขรึม","ความแข็งแกร่งของสตรีศักดิ์สิทธิ์ของศาสนจักรคนนี้ เหนือล้ำความคาดหมายของพวกเขาไปมาก การร่วมมือกันของประธานสภาระดับตำนานทั้งสามคน บวกกับเขาที่ใช้เครือข่ายเวทมนตร์ ก็ทำได้เพียงพ่ายแพ้และหลบหนีไปต่อหน้าของอีกฝ่าย...","หากไม่ใช่เพราะเขาได้เตรียมแผนสำรองเอาไว้ล่วงหน้า เกรงว่าตอนนี้คนที่ตายคงจะเป็นพวกเขาแล้ว!","เพียงแต่ไม่รู้ว่า อีกฝ่ายมีพลังของร่างต้นอยู่กี่ส่วนกันแน่...","ลินน์ที่มีความกังวลอยู่บ้าง หลังจากที่จัดการป้องกันเสร็จเรียบร้อยแล้ว เขาจึงบินกลับไปยังใจกลางระเบิดนิวเคลียร์พร้อมกับแฮร์รอฟและคนอื่นๆ เพื่อยืนยันว่าอีกฝ่ายไม่เหลือแม้แต่เศษซาก และไม่มีความจำเป็นต้องลงมือซ้ำ จากนั้นพวกเขาถึงได้เดินทางกลับอย่างวางใจ","แม้ว่าการต่อสู้ทางฝั่งนี้จะจบลงแล้ว แต่การหายตัวไปอย่างกะทันหันของประธานผู้พิพากษาแห่งศาสนจักร ทำให้ลินน์รู้สึกกังวลใจเป็นอย่างมาก และเป็นไปได้ว่าอีกฝ่ายอาจจะมองออกถึงแผนการลอบโจมตีเมืองน้ำมันดินของพวกเขา จึงได้กลับไปช่วยเหลือ!","เกรงว่าแอนโธนี่และคนอื่นๆ คงยากที่จะจัดการกับคู่ต่อสู้แบบนี้","เมื่อนึกถึงเรื่องนี้ พวกเขาทุกคนที่ล้วนได้รับบาดเจ็บ ต่างก็ไม่สนที่จะพักผ่อน และรีบบินกลับไปด้วยความเร็วสูงสุดในทันที","ที่ด้านนอกเขตการทำลายล้างของระเบิดนิวเคลียร์ในรัศมีสิบกิโลเมตร บรรดาทหารของจักรวรรดิที่รั้งท้ายและไม่ได้ก้าวเข้ามาในรัศมีของการระเบิดนิวเคลียร์ แม้โชคดีที่ยังรักษาชีวิตเอาไว้ได้ แต่มันก็น่าเวทนาอย่างถึงที่สุด","มีทหารบางนายที่ถูกเปลวไฟแผดเผา หรือไม่ก็ตาบอดเพราะแสงสว่าง พวกเขาล้มลงไปกองกับพื้น และร้องโหยหวนด้วยความเจ็บปวด นอกจากนี้ยังมีทหารที่คุกเข่าอธิษฐานอย่างบ้าคลั่ง เพื่อวิงวอนขอให้เทพเจ้ามาช่วยเหลือ","ออโรร่าถอนหายใจออกมา โดยเธอตัดสินใจลงมือปลิดชีพของอีกฝ่าย เพื่อไม่ให้พวกเขาต้องทนทุกข์ทรมาน เพราะภายใต้สถานการณ์เช่นนี้ โอกาสที่จะรอดชีวิตมีเพียงน้อยนิด","ทหารส่วนใหญ่ที่อยู่ไกลออกไป ต่างก็ทิ้งชุดเกราะและอาวุธ แล้วพากันหลบหนีอย่างบ้าคลั่ง","แฮร์รอฟยื่นมือออกไป เขาต้องการที่จะกำจัดทหารของจักรวรรดิเหล่านี้ทิ้งไว้ที่นี่ เพื่อทำลายกองกำลังของศัตรูให้สิ้นซาก แต่กลับถูกลินน์ห้ามเอาไว้","“ปล่อยพวกเขาไปเถอะ เราไม่สามารถตามฆ่าคนที่หลบหนีได้ทุกคนหรอก!”","“อีกอย่าง คนพวกนี้ก็สูญเสียขวัญกำลังใจไปจนหมดสิ้นแล้ว ในใจมีเพียงความหวาดกลัว ปล่อยให้พวกเขากลับไปยังจักรวรรดิ ไม่แน่ว่าอาจจะทำให้เกิดความโกลาหลที่ใหญ่ขึ้นกว่าเดิมก็ได้”","ลินน์เอ่ยอธิบาย","ผลการต่อสู้ที่เมืองหลวงในคราวก่อน ถูกศาสนจักรปิดผนึกเอาไว้ ทำให้ทั้งจักรวรรดิยังคงมีแต่ความสงบสุข และชาวบ้านส่วนใหญ่ก็ไม่รู้ด้วยซ้ำว่าเมืองหลวงได้ล่มสลายไปแล้ว","แต่ครั้งนี้ ไม่ว่าอย่างไรก็ปิดบังเอาไว้ไม่ได้อย่างแน่นอน การบาดเจ็บล้มตายครั้งใหญ่ขนาดนี้ บวกกับมีพยานรู้เห็นมากมายที่พากันหลบหนีกลับไปยังเมืองศักดิ์สิทธิ์ เกรงว่าข่าวคงจะแพร่สะพัดไปทั่วจักรวรรดิในไม่ช้า","พระผู้เป็นเจ้าในพระคัมภีร์นั้นยิ่งใหญ่และไม่อาจเอาชนะได้ และนักบวชที่ปฏิบัติตามเจตนารมณ์ของพระผู้เป็นเจ้า ก็จะต้องได้รับชัยชนะอย่างแน่นอน!","แต่ความจริงก็คือ กองทัพปราบปรามกลับต้องพ่ายแพ้ที่นี่อย่างต่อเนื่อง กระทั่งสตรีศักดิ์สิทธิ์ก็ยังมาตายด้วยน้ำมือของพวกเขา หากข่าวนี้แพร่ออกไป มันย่อมต้องสั่นคลอนระบอบเทวธิปไตยได้อย่างมหาศาล","ลินน์ยิ่งรู้สึกอยากรู้อยากเห็นมากขึ้นไปอีก ว่าศาสนจักรจะจัดการกับทหารที่คอยปล่อยข่าวสร้างความหวาดกลัวเหล่านี้อย่างไร!","จากใจกลางของระเบิดนิวเคลียร์ พวกเขาบินมุ่งหน้าไปยังเมืองน้ำมันดิน โดยใช้เวลาประมาณยี่สิบนาที และเมื่อเห็นว่าที่นี่ทุกอย่างยังคงปกติ สีหน้าที่ตึงเครียดของทุกคนก็ผ่อนคลายลงในทันที","พ่อมดที่ประจำการอยู่ที่เมืองน้ำมันดินเอง ก็ถอนหายใจออกมาอย่างโล่งอกเช่นกัน","ในวินาทีที่พวกเขาเห็นพวกลินน์กลับมา พวกเขาก็เข้าใจได้ทันทีว่ารู้ผลแพ้ชนะแล้ว!","แอนโธนี่นำพาลินน์และประธานสภาทั้งสามคน มาที่คฤหาสน์ดยุกที่ถูกทำความสะอาดแล้ว จากนั้นก็เอ่ยถามขึ้นมา","“ดูเหมือนว่าสถานการณ์ทางฝั่งของพวกท่าน คงจะเป็นไปอย่างราบรื่นสินะ?”","อย่างน้อยลินน์ผู้เป็นดาวรุ่งแห่งเวทมนตร์ และประธานสภาก็ยังอยู่กันครบ ไม่เหมือนกับทางฝั่งของพวกเขาที่ต้องสูญเสียจอมเวทผู้ยิ่งใหญ่ไปถึงสองคน","“จะเรียกว่าราบรื่นก็ไม่ได้หรอก!”","ลินน์ส่ายหน้า จากนั้นก็เอ่ยอธิบายถึงเหตุการณ์ที่เกิดขึ้น","เมื่อได้ยินว่าสตรีศักดิ์สิทธิ์ของศาสนจักรคนนั้น คือร่างจุติของเทพีแห่งดวงจันทร์ บรรดาพ่อมดที่อยู่ในเหตุการณ์ต่างก็ตกใจจนเหงื่อเย็นผุดขึ้นมาเต็มแผ่นหลัง","แม้ว่าพวกเขาจะดูแคลนคำเรียกที่ว่าเทพ และยังเรียกเอลาว่าเทพจอมปลอมอย่างเปิดเผย แต่ความแข็งแกร่งของอีกฝ่ายนั้นย่อมเป็นที่ประจักษ์ชัดอยู่แล้ว!","กระทั่งประธานสภาระดับตำนานร่วมมือกัน ก็ยังยากที่จะต่อกรด้วย!","“การที่พวกเรายังคงมีชีวิตอยู่มาจนถึงตอนนี้ได้ ส่วนหนึ่งต้องยกความดีความชอบให้กับโชคชะตา ส่วนอีกครึ่งหนึ่งก็คือเวทมนตร์บทใหม่ของปรมาจารย์ลินน์!”","แฮร์รอฟเอ่ยด้วยความรู้สึกทอดถอนใจ","“เวทมนตร์บทใหม่? ใช่ดวงอาทิตย์ที่เพิ่งจะปรากฏขึ้นบนท้องฟ้าเมื่อสักครู่นี้หรือเปล่า?”","อารัดเอ่ยถามด้วยความอยากรู้อยากเห็นเป็นอย่างมาก","แน่นอนว่าพวกเขาทั้งหมดต่างก็มองเห็นแสงสว่างจ้าขนาดมหึมาที่จู่ๆ ก็ปรากฏขึ้นบนท้องฟ้า พร้อมกับเมฆรูปเห็ดที่ลอยเด่นขึ้นมา แต่เป็นเพราะระยะทางที่อยู่ห่างไกลเกินไป ทำให้แสงที่ส่องผ่านมาระดับความสว่างลดลง จนไม่ถึงขั้นทำให้คนตาบอดได้ ซึ่งมันมีความสว่างพอๆ กับดวงอาทิตย์ในตอนเที่ยงวัน ที่ทั้งสว่างไสวและเจิดจ้าบาดตา","และมันก็มาพร้อมกับแรงสั่นสะเทือนอย่างรุนแรงบนพื้นดิน จนทำให้มีคนสงสัยว่า ปรมาจารย์ลินน์ได้ดึงเอาดวงอาทิตย์บนท้องฟ้าลงมาหรือเปล่า!"]},{"n":442,"t":"เมืองศักดิ์สิทธิ์ที่สั่นสะเทือน","c":["สำหรับข่าวลือเรื่องดาวฤกษ์ร่วงหล่นนั้น พ่อมดที่มีการศึกษาค้นคว้าเกี่ยวกับดาราศาสตร์ ล้วนเข้าใจดีว่า นี่มันเป็นเรื่องไร้สาระทั้งเพ!","ตามการคำนวณของสถาบันพยากรณ์ มวลของดวงอาทิตย์มีมากกว่าดวงดาวที่อยู่ใต้เท้าของพวกเขาถึงหลายแสนเท่า แล้วใครจะสามารถสั่นคลอนสิ่งมหึมาเช่นนี้ได้?","“ถูกต้อง นั่นคือเวทมนตร์บทใหม่ที่ข้าค้นคว้าออกมา ข้าเรียกมันว่า มหาเวทระเบิดนิวเคลียร์!”","ลินน์พยักหน้า มาถึงขั้นนี้แล้ว ก็ไม่มีความจำเป็นต้องปิดบังอีกต่อไป","“ส่วนสตรีศักดิ์สิทธิ์ของศาสนจักรคนนั้น นางได้ตายอยู่ภายใต้เวทมนตร์บทใหม่ของศาสตราจารย์ลินน์ไปแล้ว ตอนนี้ก็คงไม่เหลือแม้แต่เถ้ากระดูกแล้วล่ะ!”","ออโรร่ากล่าวเสริม","แม้จะคาดเดาเอาไว้แล้ว แต่เมื่อได้รับการยืนยัน บรรดาพ่อมดที่อยู่ในเหตุการณ์ต่างก็ยังคงรู้สึกเหลือเชื่ออยู่ดี","มหาเวทระเบิดนิวเคลียร์ในสายตาของพวกเขา ได้ก้าวข้ามขอบเขตของเวทมนตร์ไปแล้ว และทำได้เพียงใช้คำว่าภัยพิบัติทางธรรมชาติมาอธิบายเท่านั้น!","ต้องรู้ก่อนว่าลินน์ที่เป็นผู้ร่ายเวทมนตร์บทนี้ เพิ่งจะเลื่อนระดับเป็นจอมเวทผู้ยิ่งใหญ่ระดับสี่วงแหวนเมื่อไม่กี่เดือนก่อนเองนะ!","ดาวรุ่งแห่งเวทมนตร์คนนี้ จะแข็งแกร่งเกินไปหน่อยแล้วมั้ง","แอนโธนี่คิดในใจ โดยเขาคิดว่า ลินน์อาจจะฟื้นฟูพลังในอดีตกลับมาแล้ว ถึงได้สามารถใช้เวทมนตร์ที่ราวกับภัยพิบัติเช่นนี้ออกมาได้","ส่วนอารัดและคนอื่นๆ ก็คิดขึ้นมาได้ทันที ว่าเวทมนตร์บทใหม่นี้น่าจะมีความเกี่ยวข้องกับทฤษฎีนิวเคลียสของอะตอม และธาตุชนิดใหม่ที่ถูกค้นพบก่อนหน้านี้อย่างแน่นอน","ลินน์ไม่ได้อธิบายเกี่ยวกับหลักการของเวทระเบิดนิวเคลียร์มากนัก เพราะเวทมนตร์บทนี้อันตรายเกินไป และยังไม่เหมาะที่จะเปิดเผยในตอนนี้ ดังนั้น เขาจึงเปลี่ยนหัวข้อสนทนา และเอ่ยถามถึงความคืบหน้าของอีกฝั่งว่าราบรื่นดีหรือไม่","“ก่อนที่พวกเราจะยึดเมืองน้ำมันดินได้ ทุกอย่างก็เป็นไปตามที่ท่านคาดการณ์เอาไว้ทุกประการ เพียงแต่หลังจากนั้น พวกเราก็ได้พบกับประธานผู้พิพากษาโจชัว ที่นำกองทัพทัณฑ์ศักดิ์สิทธิ์กลับมาช่วยเหลือ...”","แอนโธนี่อธิบายเรื่องราวตั้งแต่ต้นจนจบให้กระชับที่สุดเท่าที่จะทำได้","เมื่อได้ยินว่าโจชัวที่กำลังเป็นฝ่ายได้เปรียบอย่างเห็นได้ชัด จู่ๆ ก็สูญเสียความสามารถในการต่อต้านไป จนถูกจอมเวทผู้ยิ่งใหญ่หลายคนจับเป็น ประธานสภาทั้งสามคนก็สบตากัน และตระหนักได้ในทันทีว่า นั่นคือผลกระทบจากการที่พวกเขาสังหารสตรีศักดิ์สิทธิ์ลูเซีย","นี่ถือเป็นข่าวดีอย่างไม่ต้องสงสัย มันเป็นการพิสูจน์ให้เห็นว่าข้อสันนิษฐานของแฮร์รอฟนั้นถูกต้อง ร่างจุติร่างนี้ของเอลาสำคัญเป็นอย่างมาก กระทั่งส่งผลกระทบต่อระดับสูงของศาสนจักรอย่างประธานผู้พิพากษาเลยทีเดียว!","ออโรร่าครุ่นคิดอยู่ครู่หนึ่ง จู่ๆ เธอก็เอ่ยถามขึ้นมา","“ปรมาจารย์อารัด คืนนี้คงต้องรบกวนท่านให้เหนื่อยหน่อยแล้วล่ะ ช่วยหาวิธีทดสอบดูที ว่าบรรดานักบวชและบิชอปที่ถูกจับกุมมา ยังสามารถใช้พลังศักดิ์สิทธิ์ได้อยู่หรือไม่!”","นี่ถือเป็นวิธีที่ดีที่สุด ในการประเมินสถานะของอีกฝ่ายอย่างไม่ต้องสงสัย","...","ค่ำคืนที่ไม่สงบสุขผ่านพ้นไปอย่างรวดเร็ว แต่ผลกระทบที่เกิดจากเวทมนตร์ระเบิดนิวเคลียร์กลับยิ่งทวีความรุนแรงมากขึ้นเรื่อยๆ","ดินแดนชายแดนทางตะวันตกของจักรวรรดิทั้งหมด ล้วนสัมผัสได้ถึงแรงสั่นสะเทือนอันรุนแรงนั้น เมฆรูปเห็ดขนาดมหึมาที่ลอยเด่นขึ้นสู่ท้องฟ้ายามค่ำคืน แม้จะอยู่ห่างออกไปหลายสิบกิโลเมตร ก็ยังสามารถมองเห็นได้อย่างชัดเจน","เคานต์ป๊อปที่อยู่ใกล้ที่สุด รีบส่งคนสนิทไปตรวจสอบในทันที แต่ตอนที่สายลับเหล่านี้กลับมา พวกเขากลับหวาดกลัวจนสติแตก และหลังจากที่ท่านเคานต์ผู้ยิ่งใหญ่คนนี้ได้ยินคำอธิบายของพวกเขา เขาก็หวาดกลัวจนต้องรีบเก็บข้าวของ และหลบหนีไปยังเมืองศักดิ์สิทธิ์ในชั่วข้ามคืน...","และข่าวการพ่ายแพ้ของกองทัพปราบปรามแห่งศาสนจักร รวมถึงการตายของสตรีศักดิ์สิทธิ์ลูเซีย ก็ได้แพร่สะพัดไปทั่วทุกสารทิศราวกับสายลม พร้อมกับการหลบหนีของทหารจักรวรรดิจำนวนมหาศาล...","ในเวลานี้ เมืองศักดิ์สิทธิ์ของจักรวรรดิได้ตกอยู่ในความโกลาหลเป็นที่เรียบร้อยแล้ว","ภายในเมือง ดอกไม้ที่ได้ชื่อว่าไม่มีวันเหี่ยวเฉาภายใต้พลังอันยิ่งใหญ่ของเทพเจ้า ก็เริ่มร่วงโรยและเหี่ยวเฉาลง","นักบวชยิ่งระดับสูงมากเท่าไหร่ ก็ยิ่งสามารถสัมผัสได้ถึงความไม่สบายใจนี้ได้มากเท่านั้น","ไม่นาน บิชอปนับหมื่นคนก็มารวมตัวกันที่หอคอยแห่งสรวงสวรรค์ พวกเขารอคอยคำอธิบายจากองค์สันตะปาปาด้วยความหวาดกลัวและกระวนกระวายใจ","แต่คำสั่งที่พวกเขาได้รับกลับมีเพียงข้อเดียว นั่นก็คือให้เริ่มการคัดเลือกสตรีศักดิ์สิทธิ์ และพิธีรับศีลจุ่มในทันที!","คำสั่งนี้กะทันหันเป็นอย่างมาก เพราะศาสนจักรไม่เคยมีสตรีศักดิ์สิทธิ์สองคนพร้อมกันมาก่อน เว้นเสียแต่ว่าคนก่อนหน้าจะได้กลับคืนสู่สรวงสวรรค์ หรือไม่ก็ประสบอุบัติเหตุใดๆ","ยิ่งไปกว่านั้น พิธีรับศีลจุ่มจะต้องจัดขึ้นภายใต้การเป็นพยานของผู้ศรัทธานับแสนคน แต่ตอนนี้เห็นได้ชัดว่าพวกเขาไม่สามารถสนใจเรื่องนั้นได้อีกต่อไปแล้ว พวกเขาจะต้องคัดเลือกสตรีศักดิ์สิทธิ์คนใหม่ให้เร็วที่สุดเท่าที่จะทำได้!","ภายใต้การจัดการของศาสนจักร เด็กสาวที่อายุน้อย งดงาม และมีพรสวรรค์คนหนึ่ง ก็ถูกคัดเลือกออกมาอย่างรวดเร็ว เธอได้ก้าวเข้าสู่หอคอยแห่งสรวงสวรรค์ ท่ามกลางสายตาแห่งความอิจฉาของทุกคน!","เสียงสวดมนต์อันดังกึกก้อง ดังกระหึ่มไปทั่วทั้งหอคอยแห่งสรวงสวรรค์อย่างรวดเร็ว","เด็กสาวผู้บริสุทธิ์ มาพร้อมกับความงดงาม ความหวัง และความศรัทธาอันแรงกล้าต่อพระผู้เป็นเจ้า เธอไปยืนอยู่ตรงกลางของค่ายกลพลังศักดิ์สิทธิ์ ราวกับเป็นเครื่องสังเวย","พร้อมกับพลังศักดิ์สิทธิ์ที่ถูกส่งเข้ามา แรงกดดันอันน่าสะพรึงกลัวก็พวยพุ่งขึ้นมาจากค่ายกลภายในหอคอย","ชั่วพริบตา แสงศักดิ์สิทธิ์ขนาดมหึมาก็พุ่งทะลวงชั้นฟ้า และปกคลุมร่างของเด็กสาวเอาไว้ ร่างกายของเธอค่อยๆ ลอยขึ้นไปบนอากาศ เสื้อผ้าปลิวไสวไปตามสายลม ดวงตาที่เต็มไปด้วยความหวังและความศรัทธา เริ่มปรากฏแสงสว่างที่เปล่งประกายราวกับดวงดาว","“ข้าแต่พระผู้เป็นเจ้าผู้ยิ่งใหญ่ ศักดิ์สิทธิ์ ยุติธรรม และเมตตากรุณา พระองค์คือดวงดาวที่เปล่งประกายที่สุดบนสรวงสวรรค์ และเป็นผู้สร้างสรรพสิ่ง!”","“สรรเสริญพระผู้เป็นเจ้า ขอพระองค์ทรงโปรดอภัยในบาปของข้า เพื่อที่หลังจากตายไปแล้ว ข้าจะได้กลับคืนสู่อาณาจักรเทพ!”","“โปรดประทานพลังที่จะเอาชนะความชั่วร้ายให้แก่ข้าด้วยเถิด...”","เสียงสารภาพบาปและเสียงสวดอ้อนวอนต่างๆ นานา หลั่งไหลเข้ามาในหัวของเด็กสาวอย่างไม่ขาดสาย ดวงตาทั้งสองข้างกลายเป็นความสับสนวุ่นวาย แต่ไม่นานเสียงเหล่านี้ก็ค่อยๆ แผ่วเบาลง แสงศักดิ์สิทธิ์ที่พุ่งทะลวงฟ้าดินก็จางหายไปอย่างกะทันหัน","ร่างกายที่ลอยอยู่กลางอากาศ ค่อยๆ ร่วงหล่นลงมาบนพื้น!","“สตรีศักดิ์สิทธิ์!”","บรรดาระดับสูงของศาสนจักรที่รั้งอยู่ในเมืองศักดิ์สิทธิ์ ต่างก็พากันคุกเข่าข้างหนึ่งเพื่อทำความเคารพ","เด็กสาวดูเหมือนจะยังไม่สามารถดึงสติกลับมาจากผลกระทบทางจิตใจเมื่อครู่นี้ได้ สมองของเธอสับสนวุ่นวาย ผ่านไปประมาณสามถึงห้าวินาที ดวงตาทั้งสองข้างถึงได้ค่อยๆ กลับมาแจ่มใสอีกครั้ง จากนั้นเธอก็มองไปยังคนเหล่านั้น และเอ่ยปากพูดขึ้น","“เจ้าทำได้ดีมาก อัลวิส การเลือกเจ้าเป็นสันตะปาปานั้น เป็นการตัดสินใจที่ถูกต้องจริงๆ!”","หากช้าไปกว่านี้อีกไม่กี่ชั่วโมง เกรงว่าจิตสำนึกของเธอคงจะถูกพิษแห่งความศรัทธากัดกร่อน และจมดิ่งลงไปในเสียงสวดอ้อนวอนอันไร้ที่สิ้นสุดอย่างสมบูรณ์","พลังศรัทธาของผู้คนนับสิบล้านคนนั้น ไม่ใช่สิ่งที่จะสามารถทนรับได้ง่ายๆ!","ต่อให้เป็นพลังการประมวลผลของเธอก็ตาม ก็ยังไม่อาจต้านทานการซัดสาดของจิตสำนึกจำนวนมหาศาลนี้ได้...","“ข้าเพียงแค่ปฏิบัติตามเจตนารมณ์ของพระองค์ และทำในสิ่งที่สมควรทำก็เท่านั้น”","สันตะปาปาอัลวิสไม่ได้มีเจตนาที่จะรับความดีความชอบ เขาเอ่ยตอบด้วยความเคารพ","ส่วนนักบุญแรนดัลที่อยู่ด้านข้าง กลับเอ่ยถามด้วยความไม่เข้าใจ","“องค์พระผู้เป็นเจ้า เกิดอะไรขึ้นกันแน่ ทำไมพระองค์ถึงได้...”","การคัดเลือกสตรีศักดิ์สิทธิ์อีกครั้ง ความหมายของมันมีเพียงอย่างเดียว นั่นก็คือสตรีศักดิ์สิทธิ์คนก่อนหน้าได้ตายไปแล้ว!","แต่ว่า...นี่มันจะเป็นไปได้อย่างไร?","แล้วใครกันที่จะสามารถฆ่าสตรีศักดิ์สิทธิ์ของศาสนจักร ซึ่งเป็นร่างจุติของพระผู้เป็นเจ้าได้?","“พลังของพวกพ่อมด แข็งแกร่งถึงเพียงนี้จริงๆ งั้นรึ?”","แรนดัลตกตะลึงเป็นอย่างมาก","“ไม่ พลังของพวกเขานั้นอ่อนแอจนทนรับการโจมตีไม่ได้แม้แต่ครั้งเดียว”","เอลาส่ายหน้า เธอเคยปะทะกับพ่อมดที่ได้ชื่อว่าเป็นระดับตำนานเหล่านั้นมาแล้ว แม้ว่าจะเป็นเวทมนตร์ลำแสงอันแปลกประหลาด แต่มันก็ยังไม่เพียงพอที่จะสร้างภัยคุกคามถึงชีวิตให้กับเธอได้","“เว้นเสียแต่เวทมนตร์บทนั้น ที่เป็นข้อยกเว้น!”","เมื่อพูดถึงตรงนี้ ดวงตาทั้งสองข้างของสตรีศักดิ์สิทธิ์ก็แปรเปลี่ยนเป็นเฉียบแหลมและอันตราย","สันตะปาปาอัลวิสใจสั่นสะท้าน เขานึกอะไรบางอย่างขึ้นมาได้ในทันที","เมื่อช่วงค่ำที่ผ่านมา เคานต์ป๊อปแห่งดินแดนชายแดน ได้เดินทางมาถึงเมืองศักดิ์สิทธิ์ หลังจากที่เร่งเดินทางมาตลอดทั้งวันทั้งคืน และนำข่าวที่น่าขันมาแจ้งให้ทราบ...นั่นก็คือพวกพ่อมด ได้ดึงเอาดวงอาทิตย์ลงมาจากชั้นฟ้า!"]},{"n":443,"t":"ทูตแห่งวันสิ้นโลกลินน์ ค่าหัวหนึ่งร้อยล้านเหรียญทองเซคัส!","c":["เคานต์ป๊อปที่พูดจาเหลวไหลในเมืองศักดิ์สิทธิ์ และพยายามทำให้จิตใจของผู้คนสั่นคลอน ถูกพวกเขาจับตัวเอาไว้ในทันที ซึ่งคำอธิบายของอีกฝ่ายทำได้เพียงใช้คำว่าน่าสะพรึงกลัวมาอธิบายเท่านั้น","แสงสว่างจ้าบาดตาสาดส่องไปทั่วทั้งท้องฟ้ายามค่ำคืน พื้นที่กว่าสิบกิโลเมตรกลายเป็นผืนดินที่ไหม้เกรียม และก่อตัวเป็นดินแดนแห่งความตาย ผู้ใดที่กล้าก้าวเข้าไปในนั้น ร่างกายจะเน่าเปื่อยและตายไปอย่างไม่ทราบสาเหตุ","ก่อนหน้านี้แรนดัลไม่ยอมเชื่ออย่างเด็ดขาด ลำพังแค่พวกพ่อมดที่ซ่อนตัวอยู่โพ้นทะเลราวกับหนูมานานหลายร้อยปี จะไปมีพลังอันยิ่งใหญ่เช่นนี้ได้อย่างไร?","แต่ในตอนนี้กลับต้องเชื่ออย่างเลี่ยงไม่ได้เสียแล้ว...อีกฝ่ายถึงกับสามารถฆ่าร่างจุติของพระผู้เป็นเจ้าได้!","“องค์พระผู้เป็นเจ้า ตอนนี้พระองค์ต้องการให้เรียกกองทัพปราบปรามกลับมา เพื่อรวบรวมกำลังทั้งหมดไปกวาดล้างผู้ลบหลู่เทพเจ้าพวกนี้หรือไม่?”","แรนดัลเอ่ยเสนอ","ก่อนหน้านี้ต่อให้อาณาจักรฮัดลาตาจะล่มสลาย แรนดัลก็ไม่เคยเห็นพวกพ่อมดเหล่านี้อยู่ในสายตาเลย แต่ตอนนี้ดูเหมือนว่าอีกฝ่ายจะมีพลังมากพอ ที่จะสั่นคลอนการปกครองของศาสนจักรและจักรวรรดิได้แล้ว!","จะต้องบดขยี้พวกมันให้เร็วที่สุด!","“ไม่ สงครามเต็มรูปแบบเกรงว่าจะไม่มีประโยชน์อะไรหรอก!”","สตรีศักดิ์สิทธิ์ส่ายหน้า และปฏิเสธข้อเสนอของแรนดัล","รัศมีของเวทมนตร์บทนั้นกว้างใหญ่จนเหลือเชื่อ อานุภาพของมันยิ่งทำได้เพียงใช้คำว่าน่าสะพรึงกลัวมาอธิบาย ต่อให้เป็นเพียงคลื่นกระแทกที่หลงเหลืออยู่ มันก็ไม่ใช่สิ่งที่นักบวชทั่วไปจะสามารถต้านทานได้","ภายใต้พลังเช่นนี้ จำนวนคนก็ไม่มีความหมายอะไรเลย รังแต่จะทำให้กองกำลังชั้นยอดทั้งหมดของศาสนจักรต้องมาทิ้งชีวิตไปอย่างเปล่าประโยชน์!","แรนดัลตระหนักถึงจุดนี้ได้อย่างรวดเร็ว สีหน้าแปรเปลี่ยนเป็นย่ำแย่อย่างถึงที่สุด","“พระองค์มีวิธีที่จะต้านทานเวทมนตร์บทนั้นหรือไม่?”","สันตะปาปาอัลวิสโพล่งถามขึ้นมากะทันหัน","บรรดาระดับสูงของศาสนจักรที่อยู่ในเหตุการณ์ ต่างก็มองไปยังสตรีศักดิ์สิทธิ์","สตรีศักดิ์สิทธิ์เงียบไปครู่หนึ่ง จากนั้นก็เอ่ยปากขึ้น","“หากข้าเป็นคนลงมือเอง ย่อมสามารถทำได้อย่างแน่นอน!”","แรนดัลและคนอื่นๆ ย่อมเข้าใจดี ว่าคำว่าทำด้วยตัวเองนั้น ไม่ได้หมายถึงร่างจุตินี้ แต่หมายถึงเทพีแห่งดวงจันทร์เอลา ตัวจริง!","เมื่อได้รับคำตอบที่แน่ชัด ทุกคนต่างก็ถอนหายใจออกมาอย่างโล่งอก เพราะสิ่งที่พวกเขาเป็นกังวลมากที่สุดก็คือ การที่พวกพ่อมดมาที่เมืองศักดิ์สิทธิ์ เพื่อปลดปล่อยเวทมนตร์อันน่าสะพรึงกลัวบทนั้น ในขณะที่พวกเขากลับไม่มีความสามารถที่จะตอบโต้ได้เลย","สันตะปาปาอัลวิสยิ่งจมดิ่งลงไปในการสารภาพบาปอย่างลึกซึ้ง เมื่อครู่นี้เขาถึงกับมีความคิดที่จะสั่นคลอนต่อพลังของพระผู้เป็นเจ้า!","“เวทมนตร์ที่ทรงพลังถึงเพียงนี้ ไม่มีทางที่พ่อมดที่ยังก้าวไม่ถึงระดับตำนานเหล่านี้ จะสามารถร่ายออกมาได้อย่างง่ายดายอย่างแน่นอน!”","เอลาเอ่ยอย่างหนักแน่น","ในนั้นจะต้องมีข้อจำกัดบางอย่างอยู่อย่างแน่นอน!","“เป็นไปได้ไหมว่า พวกมันจะค้นพบสมบัติแปลกประหลาดอะไรบางอย่างภายในดินแดนพ่อมด”","นักบุญแรนดัลเอ่ยด้วยจินตนาการที่เปิดกว้าง","เป็นไปได้มากว่าพลังนี้นี่แหละ ที่ทำให้พวกพ่อมดเหล่านี้เหิมเกริมขึ้นมา ถึงได้กล้าออกเดินทางจากเกาะเล็กๆ แห่งนั้น และมาท้าทายอำนาจของเทพเจ้า!","สตรีศักดิ์สิทธิ์พยักหน้า มีความเป็นไปได้นี้อยู่จริงๆ","ก่อนหน้านี้เป็นเพราะสถานการณ์ในสนามรบวิกฤตจนเกินไป ในระหว่างขั้นตอนการถ่ายโอนจิตสำนึกกลับไปยังร่างต้น เธอได้สูญเสียความทรงจำบางส่วนไป ดังนั้น เธอจึงมีเพียงความประทับใจคร่าวๆ เกี่ยวกับการต่อสู้ที่ผ่านไปเท่านั้น","ตัวอย่างเช่น ในช่วงสุดท้ายเธอถูกยานบินรูปแบบใหม่ของพวกพ่อมดชนจนปลิวไป และตัวอย่างเช่น คนที่ร่ายเวทก็คือพ่อมดที่ดูเหมือนจะอายุไม่มากนัก ที่มีชื่อว่าลินน์","“ส่งสายลับทั้งหมดออกไป เพื่อสืบหาข้อมูลของคนผู้หนึ่ง ข้าต้องการรู้ข้อมูลทั้งหมดเกี่ยวกับมัน!”","สตรีศักดิ์สิทธิ์เอ่ยสั่งการด้วยน้ำเสียงเย็นชา","“ใครกัน?”","สันตะปาปาอัลวิสเอ่ยถามอย่างจริงจัง เขาเข้าใจดีว่านี่จะต้องเป็นคนที่ใช้เวทมนตร์อันทรงพลังบทนั้น และฆ่าร่างจุติของพระผู้เป็นเจ้าอย่างแน่นอน","“ดาวรุ่งแห่งเวทมนตร์ที่พวกพ่อมดพูดถึง...ลินน์!”","เสียงของสตรีศักดิ์สิทธิ์ดังก้องขึ้นภายในหอคอยแห่งสรวงสวรรค์อีกครั้ง พระคัมภีร์อันเก่าแก่เล่มหนึ่งลอยออกมาจากเอวของแรนดัล มันเปิดไปยังบทคนบาปหน้าที่เจ็ดสิบสามโดยอัตโนมัติ ซึ่งชื่อและข้อมูลของลินน์ก็ปรากฏขึ้นตรงหน้าของคนทั้งหลายอย่างรวดเร็ว","“ข้าต้องการเห็นผลลัพธ์ภายในสิบวัน! แล้วก็ประธานผู้พิพากษาโจชัวด้วย ส่งคนไปค้นหาร่องรอยของเขา ข้าคิดว่าโจชัวน่าจะยังมีชีวิตอยู่ เป็นไปได้ว่าเขาอาจจะถูกพวกพ่อมดจับตัวไปแล้ว!”","สตรีศักดิ์สิทธิ์เอ่ยอย่างเย็นชา รับคำสั่ง","“รับคำสั่ง ข้าจะสั่งการลงไปเดี๋ยวนี้เลย!”","อัลวิสทำความเคารพอย่างนอบน้อม ในขณะที่กวาดสายตามองไป เขาก็สามารถดึงเอาข้อมูลสำคัญออกมาได้อย่างรวดเร็ว","รูปลักษณ์ของอีกฝ่ายมีอายุประมาณยี่สิบกว่าปี ผมสีน้ำตาล ปรากฏตัวขึ้นที่เมืองท่าเมื่อสองปีครึ่งที่แล้ว ต้องสงสัยว่ากำลังวางแผนสมรู้ร่วมคิด เพื่อล้มล้างศาสนจักรอย่างลับๆ หลังจากที่ถูกบิชอปในพื้นที่ค้นพบ เขาก็ใช้เวทมนตร์ระเบิดเมืองไปครึ่งหนึ่งโดยตรง ทำให้มีผู้บาดเจ็บล้มตายหลายพันคน ก่อนจะถูกเอ็ดเวลล์ที่ตามมาขับไล่ออกไป!","“องค์พระผู้เป็นเจ้า เรื่องการรวบรวมพลังศรัทธา จำเป็นจะต้องเร่งความเร็วให้มากกว่านี้หรือไม่?”","แรนดัลเอ่ยเตือนด้วยความกังวล","“ได้โปรดอภัยให้กับการล่วงเกินของข้าด้วยเถิด แต่ตอนนี้พระองค์จำเป็นจะต้องก้าวขึ้นสู่ตำแหน่งเทพเจ้าให้เร็วที่สุด!”","ไม่มีใครรู้เลยว่า มีพ่อมดกี่คนที่ครอบครองเวทมนตร์บทนี้ และมันจะสามารถใช้บ่อยๆ ได้หรือไม่","หากอีกฝ่ายเลือกที่จะทำการทำลายล้างครั้งใหญ่กับทั้งจักรวรรดิ เกรงว่าพวกเขาคงยากที่จะต้านทานได้!","การตายของผู้ศรัทธาจำนวนมหาศาล จะทำให้ความพยายามตลอดหลายร้อยปีของพวกเขาต้องสูญเปล่า...","ดังนั้น ในมุมมองของแรนดัล ต่อให้ต้องใช้วิธีการที่สกปรกโสมม เพื่อกระตุ้นความศรัทธา เขาก็ไม่เสียดายเลยสักนิด!","ตราบใดที่สามารถแก้ไขเรื่องพิษแห่งความศรัทธา และทำให้พระผู้เป็นเจ้าก้าวขึ้นสู่ตำแหน่งเทพเจ้าได้ พวกพ่อมดเหล่านี้ก็สามารถถูกกำจัดได้ด้วยการดีดนิ้ว!","สตรีศักดิ์สิทธิ์ครุ่นคิดอยู่ครู่หนึ่ง เพื่อพิจารณาถึงข้อดีและข้อเสียของการกระตุ้นความศรัทธา ซึ่งนี่ก็ไม่ต่างอะไรจากการจับปลาด้วยการสูบน้ำจนแห้งบ่อ แต่ตอนนี้เห็นได้ชัดว่าคงไม่สามารถสนใจเรื่องนั้นได้อีกต่อไปแล้ว การล่มสลายของอาณาจักรฮัดลาตา และความพ่ายแพ้อย่างต่อเนื่องของกองทัพปราบปรามแห่งศาสนจักร ทำให้จำนวนของผู้ศรัทธาที่เคร่งศาสนาลดลงไปอย่างน่าใจหาย...","หากปล่อยให้เป็นเช่นนี้ต่อไป ก็มีแต่จะยิ่งทำให้ห่างไกลจากเป้าหมายผู้ศรัทธาที่เคร่งศาสนาหนึ่งล้านคนออกไปเรื่อยๆ เท่านั้น","“ถ้าเช่นนั้นก็ปล่อยให้เจ้าเป็นคนจัดการก็แล้วกัน แรนดัล!”","สตรีศักดิ์สิทธิ์ตัดสินใจได้อย่างรวดเร็ว","“น้อมรับคำสั่ง!”","แรนดัลใช้มือขวาทุบอกเบาๆ และเอ่ยตอบด้วยความเคร่งขรึม","“พระองค์ แล้วเรื่องที่อาณาจักรฮัดลาตาล่มสลาย รวมถึงข่าวการพ่ายแพ้ของกองทัพปราบปราม จำเป็นจะต้องปิดต่อไปหรือไม่ขอรับ?”","สันตะปาปาอัลวิสเอ่ยถามขึ้นมา","ข่าวทั้งสองเรื่องนี้ล้วนเป็นเรื่องที่น่าตกใจอย่างไม่ต้องสงสัย หากถูกเปิดเผยออกไป ย่อมต้องทำให้เกิดความโกลาหลครั้งใหญ่ภายในจักรวรรดิอย่างแน่นอน และยังส่งผลกระทบอย่างรุนแรงต่อชื่อเสียงของศาสนจักร จนถึงขั้นทำให้ผู้ศรัทธาสั่นคลอนในความเชื่อที่มีต่อเทพเจ้า","แต่ผลกระทบของสงครามในครั้งนี้มันใหญ่หลวงเกินไปจริงๆ ดินแดนแห่งความตายที่แผ่ขยายออกไปกว่าสิบกิโลเมตร ย่อมไม่มีทางที่จะปิดบังเอาไว้ได้อย่างแน่นอน","“ไม่ ไม่มีความจำเป็นต้องปิดบังอีกต่อไปแล้ว!”","สตรีศักดิ์สิทธิ์เอ่ยด้วยน้ำเสียงเย็นชา","“จงไปบอกพวกมันว่าวันสิ้นโลกกำลังจะมาถึง และพวกพ่อมดนั่นแหละ ที่เป็นต้นเหตุทำให้เกิดภัยพิบัติแห่งวันสิ้นโลก!”","ภัยพิบัติแห่งวันสิ้นโลก?!","บรรดาระดับสูงของศาสนจักรที่อยู่ในเหตุการณ์ ต่างก็มีจิตใจที่สั่นสะท้าน แต่ไม่นานพวกเขาก็คิดได้ว่า นี่คือวิธีการ ‘ปลอบโยน’ ผู้ศรัทธาวิธีหนึ่งอย่างแน่นอน","ส่วนสตรีศักดิ์สิทธิ์ก็มองไปยังพระคัมภีร์ที่กางออก และยื่นมือออกไปลูบไล้บนหน้ากระดาษเบาๆ","ข้อมูลเกี่ยวกับลินน์ที่ถูกบันทึกเอาไว้ด้านบน ล้วนถูกเขียนขึ้นโดยเอ็ดเวลล์เมื่อหลายเดือนก่อน ซึ่งมันล้าสมัยไปนานแล้ว!","ภายใต้แสงศักดิ์สิทธิ์ที่พวยพุ่ง ข้อมูลใหม่ก็ปรากฏขึ้นบนหน้ากระดาษอย่างรวดเร็ว!","[ชื่อ: ลินน์","อันตรายระดับสูงสุด (ทูตแห่งวันสิ้นโลก)","ความผิด: ก่อให้เกิดภัยพิบัติแห่งวันสิ้นโลก, ทำลายกองทัพปราบปรามแห่งศาสนจักร, ทำให้อาณาจักรฮัดลาตาล่มสลาย!","ค่าหัว: เหรียญทองเซคัส...หนึ่งร้อยล้าน!]"]}];

function render(){
  const ch=CHAPTERS[idx];
  const paras=ch.c.map(function(p){return '<p>'+escapeHtml(p)+'</p>';}).join('');
  const isLast=idx===CHAPTERS.length-1;
  const endNote='';
  document.getElementById('reader').innerHTML=
    '<h2 class="chap-title">บทที่ '+ch.n+' : '+escapeHtml(ch.t)+'</h2>'+
    '<div class="body">'+paras+'</div>'+
    '<div class="nav">'+
      '<button class="btn" onclick="go(-1)" '+(idx===0?'disabled':'')+'>← ตอนก่อนหน้า</button>'+
      '<button class="btn" onclick="go(1)" '+(isLast?'disabled':'')+'>ตอนถัดไป →</button>'+
    '</div>'+endNote;
  location.hash=idx+1;buildTOC();window.scrollTo(0,0);
}
function go(d){const n=idx+d;if(n>=0&&n<CHAPTERS.length){idx=n;render();}}
function buildTOC(){document.getElementById('toc').innerHTML=CHAPTERS.map(function(ch,i){return '<li class="'+(i===idx?'active':'')+'" onclick="jump('+i+')"><span class="n">'+ch.n+'</span>'+escapeHtml(ch.t)+'</li>';}).join('');}
function jump(i){idx=i;render();toggleTOC();}
function toggleTOC(){document.getElementById('overlay').classList.toggle('open');}
function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';}
let fs=19;
function changeFont(d){fs=Math.min(30,Math.max(15,fs+d*2));document.documentElement.style.setProperty('--reader-size',fs+'px');}
function escapeHtml(s){return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
initIdx();render();
['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();return false;});});
document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','a','s','u','p'].includes(k))e.preventDefault();if(k==='f12')e.preventDefault();});
</script></body></html>
