ขาจำเป็นจะต้องรักษาความมั่นคงของสถานการณ์เอาไว้ให้ได้ หากทุกคนสูญเสียความหวังไป พวกเขาก็คงจะจบเห่จริงๆ"]},{"n":453,"t":"ไอวีน่าที่แฝงตัวเข้าไปในค่ายศัตรู ความตื่นตะลึงที่เกิดจากเรือเหาะและเครื่องบินรบ","c":["อาณาจักรของพวกพ่อมด มีสถานที่แบบนั้นอยู่จริงๆ งั้นรึ?","แม้ว่าบรรดาพ่อมดที่อยู่ที่นี่จะได้ยินข่าวนี้มาบ้างแล้ว แต่เนื่องจากข่าวลือนั้นมันฟังดูเกินจริงไปมาก พวกเขาจึงอดไม่ได้ที่จะรู้สึกกึ่งเชื่อกึ่งสงสัย และบางคนก็ถึงกับคิดว่านี่อาจจะเป็นหลุมพรางที่ศาสนจักรสร้างขึ้นมา เพื่อหลอกล่อให้พวกเขามาติดกับด้วยซ้ำ","ท่ามกลางความเงียบงัน ลูคัสได้นำทางทุกคนวิ่งหนีหัวซุกหัวซุน โดยอาศัยป่าไม้และพุ่มไม้เป็นเครื่องกำบัง","แต่สิ่งที่ทำให้บรรดาพ่อมดรู้สึกสิ้นหวังก็คือ หลังจากที่พวกเขาวิ่งทะลุออกมาจากป่าทึบแห่งนี้แล้ว ด้านนอกกลับเป็นพื้นที่รกร้างที่กว้างใหญ่ไพศาลสุดลูกหูลูกตา ซึ่งนั่นก็หมายความว่าพวกเขาจะไม่มีที่ให้ซ่อนตัวอีกต่อไป!","ในตอนนั้นเองลูคัสถึงได้ตระหนักว่า พวกอัศวินจงใจต้อนพวกเขาให้มาทางนี้นี่เอง","และในเสี้ยววินาทีที่เขากำลังเสียสมาธินั้นเอง ลูกศรที่เปล่งประกายด้วยแสงศักดิ์สิทธิ์นับสิบดอก ก็พุ่งทะยานออกมาจากป่าทึบทางด้านหลัง","“รีบหลบเร็วเข้า!”","ท่ามกลางเสียงตะโกนอย่างร้อนรน ลูคัสก็สัมผัสได้ถึงอันตรายที่กำลังใกล้เข้ามา และในชั่วพริบตานั้น โล่เวทมนตร์ก็ถูกร่ายขึ้นมาคลุมร่างของเขาเอาไว้","อย่างไรก็ตาม โล่เวทมนตร์ที่แข็งแกร่ง กลับแทบจะไม่สามารถต้านทานลูกศรที่แฝงไปด้วยพลังศักดิ์สิทธิ์ทำลายล้างเหล่านี้ได้เลย และมันก็ถูกทำลายลงอย่างรวดเร็ว","หนึ่งในลูกศรนั้นพุ่งทะลุโล่เวทมนตร์เข้ามา และปักทะลุเข้าไปในหัวไหล่ของเขาอย่างจัง","ใบหน้าของลูคัสบิดเบี้ยวด้วยความเจ็บปวด แต่สิ่งที่แสดงออกมามากกว่านั้นก็คือความหวาดกลัว เพราะลูกศรทำลายเวทมนตร์ที่เหลืออีกหลายดอก กำลังพุ่งตรงมาที่หน้าอกของเขา","“ตัด!”","ในจังหวะนั้นเอง เสียงตวาดแผ่วเบาของเด็กสาวก็ดังขึ้น ใบดาบเรียวยาวตวัดผ่านร่างของลูคัสไป ประกายไฟสาดกระเซ็น ลูกศรทำลายเวทมนตร์สามดอกถูกปัดทิ้งไปอย่างแรง","ลูคัสที่ยังคงตื่นตระหนกถอยหลังไปหลายก้าว ก่อนจะพบว่าคนที่ลงมือช่วยเหลือเขาคือเด็กสาวผมสีน้ำตาลที่ดูอายุยังน้อย แต่กลับเปรอะเปื้อนไปด้วยฝุ่นละออง และระหว่างคิ้วก็เผยให้เห็นถึงความเย็นชา","“ขอบใจเจ้ามากที่ช่วยเหลือ”","ลูคัสกล่าวขอบคุณด้วยความซาบซึ้งใจ สมองของเขาคิดทบทวนอย่างรวดเร็ว และไม่นานก็จำเด็กสาวที่อยู่ตรงหน้าได้","ไอวีน่า แม่มดจากสถาบันพิราบขาว ผู้เชี่ยวชาญด้านเวทมนตร์แปรสภาพ ว่ากันว่าก่อนที่จะมาเป็นแม่มด เธอเคยเป็นลูกหลานของชนชั้นสูงมาก่อน และมีวิชาดาบที่ไม่ธรรมดาเลย","แต่เมื่อวานนี้ ฐานที่มั่นของสถาบันพิราบขาวเพิ่งจะถูกเหล่านักล่าแม่มดกลุ่มใหญ่บุกโจมตี จนเกือบจะถูกกวาดล้างจนหมดสิ้น เหลือเพียงแค่สองคนเท่านั้นที่หนีรอดออกมาได้ และมาร่วมกับสมาคมช่วยเหลือซึ่งกันและกัน","ลูคัสอดไม่ได้ที่จะถอนหายใจออกมา ในช่วงนี้มีสถาบันเวทมนตร์จำนวนมากที่ถูกโจมตีอย่างหนัก หรือแม้กระทั่งถูกกวาดล้างจนหมดสิ้น สถาบันพิราบขาวของไอวีน่าไม่ใช่สถาบันแรก และก็ไม่ใช่สถาบันสุดท้ายด้วย","“คำขอบคุณเอาไว้ค่อยพูดทีหลังเถอะ ตอนนี้ไม่ใช่เวลามาคุยเรื่องนี้”","ไอวีน่าตอบกลับด้วยน้ำเสียงเรียบเฉย และตวัดดาบตัดก้านลูกศรที่ปักอยู่บนไหล่ของลูคัสทิ้ง","เพื่อป้องกันไม่ให้เสียเลือดมาก ไอวีน่าจึงไม่ได้ดึงลูกศรออกมา และที่นี่ก็ไม่ใช่สถานที่ที่เหมาะจะทำแผลด้วย","“ข้ารู้ว่ามีหมู่บ้านแห่งหนึ่งอยู่ไม่ไกลจากพื้นที่รกร้างนี้ บางทีเราอาจจะสลัดศัตรูพวกนี้หลุดที่นั่นได้”","ไอวีน่าปรายตามองกลุ่มอัศวินที่พุ่งออกมาจากป่าทึบ และพูดต่อด้วยความรวดเร็ว","บรรดาพ่อมดที่อยู่ที่นั่นต่างก็ดีใจขึ้นมาในทันที แต่ความดีใจนั้นก็คงอยู่ได้เพียงแค่ชั่วพริบตา เพราะทุกคนต่างก็รู้ดีว่า พวกเขาไม่มีทางวิ่งหนีทหารม้าบนพื้นที่รกร้างนี้พ้น นอกเสียจากว่าจะทิ้งคนส่วนหนึ่งไว้ข้างหลังเพื่อถ่วงเวลา!","ลูคัสกัดฟันแน่น เขารู้ดีว่าตอนนี้มีทางเลือกแค่สองทาง คือตายกันหมด หรือไม่ก็ต้องยอมสละคนส่วนหนึ่งไป","“ดูสิ นั่นมันอะไรน่ะ?”","จู่ๆ พ่อมดคนหนึ่งก็ชี้ไปบนท้องฟ้าพร้อมกับร้องอุทานออกมา ทำให้สายตาของบรรดาพ่อมดต่างก็หันไปมองตามทิศทางที่เขาชี้","ณ สุดปลายสายตา มีจุดสีดำปรากฏขึ้นที่ขอบฟ้าอันไกลโพ้น และกำลังเคลื่อนที่เข้ามาใกล้ด้วยความรวดเร็ว","“เรือ ดูเหมือนเรือที่บินอยู่บนฟ้าเลย...”","ไอวีน่าที่มีสายตาดีที่สุดพึมพำออกมา","ก็เป็นอย่างที่ไอวีน่าพูด เมื่อวัตถุบินได้เหล่านั้นเข้ามาใกล้ มันก็ดูราวกับเรือลำยักษ์ที่กำลังโบยบินอยู่บนท้องฟ้า","ตัวเรือเป็นสีฟ้าน้ำทะเล ด้านบนมีถุงลมทรงรีขนาดใหญ่ติดตั้งอยู่ และถูกยึดเอาไว้ด้วยโซ่ที่แข็งแรงหลายสิบเส้น เผยให้เห็นถึงความงดงามทางอุตสาหกรรม","นี่คือเรือเหาะงั้นรึ?","ไอวีน่าตกตะลึงเป็นอย่างมาก แม้ว่าเธอจะเคยเห็นข้อมูลของสิ่งนี้ในเอกสารรายงานมาบ้างแล้ว แต่เมื่อได้มาเห็นของจริงด้วยตาของตนเอง เธอก็ยังไม่อาจปกปิดความตื่นตะลึงในใจได้อยู่ดี","ของที่ใหญ่โตขนาดนี้ กลับสามารถบินอยู่บนท้องฟ้าได้!","คนที่มองเห็นเจ้าแห่งท้องฟ้าเหล่านี้ไม่ได้มีแค่พวกพ่อมดเท่านั้น บรรดาอัศวินของศาสนจักรเองก็สังเกตเห็นเรือเหาะที่ปรากฏตัวขึ้นมาอย่างกะทันหันเช่นกัน แต่ความเร็วในการไล่ล่าของพวกเขากลับไม่ได้ลดลงเลยแม้แต่น้อย แต่กลับยิ่งเร่งความเร็วมากขึ้นไปอีก ราวกับต้องการจะกวาดล้างลูคัสและคนอื่นๆ ให้สิ้นซาก ก่อนที่กำลังเสริมของพวกพ่อมดจะมาถึง!","“ทุกคน อดทนเอาไว้ กำลังเสริมของพวกเรามาถึงแล้ว!”","ลูคัสตะโกนปลุกขวัญกำลังใจ แต่บรรดาพ่อมดเต็มตัวและพ่อมดฝึกหัดที่อยู่รอบกาย กลับยังคงมีสีหน้าที่หนักอึ้ง","เพราะสิ่งที่อยู่ตรงหน้าพวกเขา ก็คือกองทหารม้ากว่าสี่พันนายที่นำโดยบิชอปหลายสิบคน!","เสียงกีบเท้าม้าที่กระทบพื้นดินดังใกล้เข้ามาเรื่อยๆ ฝุ่นควันที่ฟุ้งกระจายราวกับคลื่นยักษ์กำลังมุ่งหน้าเข้ามาหาพวกเขา","ลูกศรหน้าไม้แต่ละดอกถูกง้างเตรียมพร้อมอีกครั้ง ปลายลูกศรที่แหลมคมสะท้อนแสงแดดยามเที่ยงวัน เผยให้เห็นประกายแสงที่เย็นยะเยือก","ไอวีน่ามีสีหน้าที่เคร่งเครียด เธอจับดาบเรียวในมือแน่น เพื่อให้แผนการแฝงตัวเป็นไปอย่างสมบูรณ์แบบ เธอจึงไม่ได้รู้จักหรือมีความเกี่ยวข้องใดๆ กับบิชอปที่มาร่วมกันไล่ล่าพ่อมดในครั้งนี้เลย พวกเขาเพียงแค่เตรียมแผนการหลบหนีที่เกี่ยวข้องเอาไว้เท่านั้น","ตัวอย่างเช่น ในหมู่บ้านที่เธอเพิ่งจะพูดถึงไป มีเส้นทางลับที่สามารถใช้หลบหนีจากการไล่ล่าได้ และถือโอกาสนี้ทำให้พวกพ่อมดที่ร่วมทางมาด้วยเกิดความเชื่อใจ","แต่ในขณะเดียวกัน มันก็หมายความว่าตัวเธอเอง ก็จะต้องถูกพวกเดียวกันไล่ล่าอย่างไม่ลดละเช่นกัน!","ด้วยห่าฝนลูกศรที่หนาแน่นขนาดนี้ ไอวีน่าเองก็ไม่มีความมั่นใจเต็มร้อย ว่าจะสามารถป้องกันเอาไว้ได้ทั้งหมด","ในขณะที่เหล่านักล่าแม่มดบรรจุลูกศรเสร็จสิ้น และเตรียมพร้อมที่จะยิงออกไปนั้นเอง เสียงคำรามดังกึกก้องก็ดังขึ้นเหนือหัวของทุกคน ตามมาด้วยแสงที่บิดเบี้ยว เครื่องบินรบสองลำที่มีความยาวปีกกว่าสิบเมตร ก็ปรากฏขึ้นมาตรงหน้าของทุกคน","มันดูเหมือนกับเหยี่ยวที่ถูกขยายขนาดขึ้นหลายเท่าตัว และสร้างขึ้นจากเหล็กกล้าทั้งลำ มันบินโฉบผ่านเหนือหัวของพวกลูคัสไปด้วยความเร็วที่เหลือเชื่อ กระแสลมที่พัดมาจากปีกขนาดใหญ่ พัดเอาฝุ่นควันที่ลอยฟุ้งอยู่รอบๆ ให้กระจายหายไป ก่อนจะพุ่งเข้าใส่กองทหารม้ากว่าสี่พันนายที่อยู่ตรงหน้า","เครื่องบินรบเหล็กกล้าที่พุ่งเข้ามาอย่างรวดเร็ว ดึงดูดความสนใจของเหล่านักล่าแม่มดได้ในทันที หน้าไม้แต่ละคันถูกเล็งขึ้นไปบนท้องฟ้า แต่ความเร็วของเครื่องบินรบนั้นรวดเร็วเกินไป ด้วยความเร็วสามร้อยหกสิบกิโลเมตรต่อชั่วโมง ทำให้ยากที่จะเล็งเป้าหมายได้อย่างแม่นยำ","ในวินาทีต่อมา เสียงปืนกลที่ดังกึกก้องก็ดังขึ้นข้างหูของทุกคน ราวกับจะทำให้แก้วหูฉีกขาด","เปลวไฟพุ่งออกมาจากปากกระบอกปืนกล ห่ากระสุนที่รุนแรงสาดซัดเข้าใส่ร่างของเหล่านักล่าแม่มด เจาะทะลุเกราะเหล็ก และเปลี่ยนร่างกายที่เป็นเลือดเนื้อให้กลายเป็นรังผึ้งในชั่วพริบตา","เลือดสีแดงฉานสาดกระเซ็นไปทั่วสมรภูมิ เสียงร้องโหยหวนด้วยความเจ็บปวดดังระงมไปทั่ว พื้นดินที่เครื่องบินรบโฉบผ่าน หลงเหลือเพียงเส้นทางสายเลือดที่น่าสะพรึงกลัว!","เพียงแค่สิบกว่าวินาที ในการพุ่งชนเพียงครั้งเดียว นักล่าแม่มดหลายร้อยคนก็ล้มลงไปกองกับกองเลือด ซากศพและแขนขาที่ขาดวิ่นเกลื่อนกลาดไปทั่วสมรภูมิ กลิ่นคาวเลือดอันเข้มข้นลอยคละคลุ้งไปทั่วทั้งอากาศ..."]},{"n":454,"t":"นี่ไม่ใช่เวทมนตร์แล้ว แต่มันคือทัณฑ์สวรรค์ชัดๆ!","c":["ภายใต้การกราดยิงอย่างต่อเนื่องของเครื่องบินรบทั้งสองลำ เพียงแค่สิบกว่าวินาที นักล่าแม่มดเกือบหนึ่งในห้าก็ล้มลงไปกองกับพื้นสมรภูมิ","“ปีศาจ นี่มันของที่สร้างจากปีศาจชัดๆ!”","เมื่อได้เห็นสหายร่วมรบหลายคนถูกกระสุนปืนกลสาดซัดจนร่างกายขาดเป็นท่อนๆ ด้วยตาของตนเอง นักล่าแม่มดคนหนึ่งก็ตกใจกลัวจนตัวสั่น และถึงกับฉี่ราดกางเกง","แต่นี่เป็นเพียงแค่จุดเริ่มต้นเท่านั้น เพราะวัตถุทรงกลมหลายลูกกำลังร่วงหล่นลงมาจากท้องฟ้า","ท่ามกลางสายตาของไอวีน่าและบรรดาพ่อมด ระเบิดฟอสฟอรัสขาวก็ระเบิดออกกลางอากาศ มันจุดประกายไฟลุกท่วม และกลายเป็นดอกไม้ไฟอันงดงามที่ปกคลุมไปทั่วทั้งสมรภูมิ!","อัศวินกว่าสามพันคนที่เหลืออยู่ถูกกลืนกินเข้าไปในทะเลเพลิงฟอสฟอรัสขาวในชั่วพริบตา","เปลวไฟฟอสฟอรัสขาวที่มีทั้งความร้อนสูง กัดกร่อนสูง และมีพิษร้ายแรง ราวกับไฟนรกในตำนานที่อยู่ลึกลงไปในขุมนรก มันสามารถกลืนกินทุกสรรพสิ่ง เมื่อติดหนึบเข้ากับสิ่งใดแล้ว มันก็จะเกาะติดราวกับหนอน กัดกร่อนทะลุชุดเกราะ และเผาผลาญเลือดเนื้อจนมอดไหม้...","พื้นที่สมรภูมิแห่งนี้กลายสภาพเป็นนรกในพริบตา อัศวินที่ถูกไฟคลอกร่วงหล่นลงมาจากหลังม้าทีละคน พร้อมกับส่งเสียงร้องโหยหวนด้วยความเจ็บปวดทรมาน พื้นดินถูกเผาไหม้จนกลายเป็นเถ้าถ่าน และมีกลิ่นฉุนรุนแรงลอยฟุ้งขึ้นมาอย่างต่อเนื่อง","“ถอยทอย ถอยทัพเร็ว!”","บิชอปผู้เป็นหัวหน้าตะโกนสั่งการอย่างบ้าคลั่ง เหล่านักล่าแม่มดที่ขวัญหนีดีฝ่อต่างก็รีบควบม้าหนีตายกลับไปที่ป่าทึบแห่งนั้น","แต่เครื่องบินรบทั้งสองลำไม่มีทางปล่อยพวกเขาไปง่ายๆ พวกมันบินไล่กวดตามหลังไปติดๆ และสาดกระสุนปืนกลทั้งหมดเข้าใส่ ราวกับรู้สึกว่ายังไม่สะใจพอ พวกมันถึงกับบินโฉบลงมาในระดับต่ำ และใช้อาวุธเลเซอร์ตัดร่างของนักล่าแม่มดที่กำลังวิ่งหนีจนขาดเป็นสองท่อน...","พวกลูคัสได้แต่มองดูเหล่านักล่าแม่มดที่พุ่งเข้ามาราวกับหมาป่าหิวโซ หมายจะกวาดล้างพวกเขาให้สิ้นซาก กลับต้องมาพ่ายแพ้อย่างราบคาบ และล้มตายลงบนพื้นที่รกร้าง ซึ่งห่างจากพวกเขาเพียงแค่เจ็ดสิบเมตรเท่านั้น หลังจากถูกโจมตีเพียงไม่กี่ระลอก","“ช่างเป็นอาวุธที่น่าสะพรึงกลัวจริงๆ...”","ท่ามกลางฝูงชน พ่อมดชายที่สวมเสื้อผ้าเรียบง่ายคนหนึ่งพึมพำออกมาด้วยน้ำเสียงที่สั่นเครือ","ทางด้านไอวีน่าเองก็เข้าใจแล้วว่า ทำไมกองทัพปราบปรามแห่งศาสนจักรถึงพ่ายแพ้ให้กับพวกพ่อมดเหล่านี้","ในขณะที่เครื่องบินรบทั้งสองลำกำลังไล่ล่ากองทหารที่เหลืออยู่นั้น บนท้องฟ้า เรือเหาะนับสิบลำก็ค่อยๆ ลดระดับลงมา และจอดเรียงรายกันอย่างเป็นระเบียบบนพื้นที่รกร้างแห่งนี้","เมื่อสิ่งประดิษฐ์เล่นแร่แปรธาตุเหล่านี้ร่อนลงมาจากท้องฟ้า ทุกคนก็เพิ่งจะตระหนักได้ว่า พวกเขาประเมินความยิ่งใหญ่ของเรือเหาะต่ำเกินไป เพราะมันมีความสูงเทียบเท่ากับบ้านสี่ถึงห้าชั้น หรือใหญ่กว่าบ้านทั้งหลังเสียอีก!","เดลเดินนำทหารปืนไฟกว่าร้อยนายลงมาจากเรือเหาะ เมื่อเห็นลูคัสในสภาพที่มอมแมม เขาก็รีบอ้าแขนเดินเข้าไปหา และสวมกอดอีกฝ่ายอย่างกระตือรือร้น","“เป็นยังไงบ้าง? พวกเรามาทันเวลาพอดีใช่ไหม เพื่อนยาก?”","“แน่นอน ทันเวลา ทันเวลามากเลยล่ะ!”","ลูคัสตื่นเต้นจนอธิบายเป็นคำพูดไม่ถูก หากเรือเหาะพวกนี้มาช้าไปเพียงแค่ครึ่งนาที พวกเขาก็คงจะถูกนักล่าแม่มดพวกนี้เหยียบย่ำจนแหลกเหลวไปแล้ว","“น่าเสียดายที่พวกเจ้าไม่ได้มาเร็วกว่านี้สักวันสองวัน”","ลูคัสกล่าวด้วยความเสียดาย พร้อมกับเล่าเหตุการณ์สังหารหมู่ครั้งใหญ่ที่เกิดขึ้นในเขตตะวันตกของจักรวรรดิในช่วงไม่กี่วันที่ผ่านมาให้ฟัง","เมื่อได้ฟังเรื่องราวทั้งหมด เดลก็โกรธจัด หากไม่ใช่เพราะครั้งนี้เขาพาคนมาไม่พอ และมีกระสุนจำกัด เขาคงอยากจะบุกไปที่เมืองศักดิ์สิทธิ์ แล้วระเบิดรูปปั้นเทพเจ้าจอมปลอมนั่นให้แหลกเป็นผุยผงไปแล้ว","“อีกไม่ช้า พวกเราจะต้องกวาดล้างศาสนจักรและจักรวรรดิให้สิ้นซาก วันนั้นอีกไม่ไกลหรอก!”","เดลกล่าวด้วยน้ำเสียงที่ดุดัน","หากเป็นเมื่อห้านาทีก่อน มีคนมาบอกพวกเขาเกี่ยวกับการกวาดล้างศาสนจักรและจักรวรรดิ ลูคัสคงจะคิดว่านั่นเป็นเพียงแค่ความเพ้อฝันของคนโง่เขลา แต่ตอนนี้ภายในใจของเขากลับมีความรู้สึกคาดหวังเกิดขึ้นมา","ภายใต้การเชื้อเชิญของเดล พ่อมดเต็มตัวกว่าร้อยคนและพ่อมดฝึกหัดของพวกเขา ได้ทยอยขึ้นไปบนเรือเหาะ","เมื่อถุงลมรองถูกเติมลมจนเต็มอีกครั้ง เรือเหาะที่มีขนาดใหญ่กว่าบ้าน ก็ได้บรรทุกพ่อมดเหล่านี้ลอยขึ้นสู่ท้องฟ้า","“นี่มันคือเวทมนตร์อะไรกัน ถึงสามารถทำให้ของชิ้นใหญ่ขนาดนี้ลอยขึ้นไปบนฟ้าได้อย่างอิสระ!”","ลูคัสเอ่ยถามด้วยความประหลาดใจ ก่อนจะหันไปมองเครื่องบินรบรุ่นแรกที่กำลังบินกลับมา","“แล้วก็นกเหล็กพวกนั้นด้วย ความเร็วของพวกมันเร็วกว่าเหยี่ยวด็อกการ์ดที่เร็วที่สุดซะอีก”","“ไม่สิ เหยี่ยวด็อกการ์ดเทียบไม่ได้แม้แต่ครึ่งปีกของมันด้วยซ้ำ!”","ลูคัสกล่าวด้วยความทึ่ง","“สิ่งประดิษฐ์เล่นแร่แปรธาตุที่อยู่ใต้เท้าของพวกเรา เรียกว่าเรือเหาะ และเครื่องบินรบรูปแบบใหม่พวกนั้น ก็ล้วนเป็นผลงานของท่านปรมาจารย์ลินน์!”","เดลกล่าวด้วยความภาคภูมิใจ","“คือดาวรุ่งแห่งเวทมนตร์คนนั้นน่ะรึ?”","ลูคัสชะงักไปเล็กน้อย","ก่อนหน้านี้เขาเคยติดต่อกับเดล ที่ถูกส่งเข้ามาสืบข่าวในจักรวรรดิอยู่หลายครั้ง ทำให้พอจะรู้เรื่องราวของสภาเวทมนตร์มาบ้าง และนั่นก็เป็นเหตุผลที่ทำให้เขาตัดสินใจก่อตั้งสมาคมช่วยเหลือซึ่งกันและกัน เพื่อร่วมกันหลบหนีไปยังอาณาจักร ดังนั้น เขาจึงเคยได้ยินชื่อเสียงอันโด่งดังของดาวรุ่งแห่งเวทมนตร์คนนี้มาบ้าง","“ใช่แล้ว”","เดลพยักหน้า","“ด้วยสิ่งประดิษฐ์เล่นแร่แปรธาตุที่ทรงพลังเหล่านี้ มิน่าล่ะกองทัพปราบปรามแห่งศาสนจักรถึงได้พ่ายแพ้ให้กับพวกเจ้า แม้แต่สตรีศักดิ์สิทธิ์ลูเซียก็ยังต้องตายในสนามรบ”","ลูคัสอดไม่ได้ที่จะเอ่ยชมออกมา","พ่อมดคนอื่นๆ ก็พากันหันไปมองเดลเป็นตาเดียว พวกเขาทุกคนต่างก็เคยได้ยินข่าวการพ่ายแพ้ของกองทัพปราบปรามมาแล้วเช่นกัน","“เจ้าเข้าใจผิดแล้วล่ะ”","เดลส่ายหน้า","“เรือเหาะ เครื่องบินรบ และอาวุธรูปแบบใหม่อื่นๆ แม้จะทรงพลังมาก แต่ก็ไม่สามารถบดขยี้กองทัพปราบปรามที่นำโดยสองผู้ใช้พลังศักดิ์สิทธิ์ระดับตำนานได้อย่างราบคาบหรอกนะ”","“ในการต่อสู้ครั้งแรก พวกเราต้องสูญเสียกำลังคนไปไม่น้อย สุดท้ายก็ต้องพึ่งพาท่านปรมาจารย์ลินน์ ที่ร่ายเวทมนตร์อันทรงพลังอย่างเหลือเชื่อ เพื่อกวาดล้างสตรีศักดิ์สิทธิ์แห่งศาสนจักร และกองทัพปราบปรามนับหมื่นนายให้สิ้นซาก!”","ทุกคนที่อยู่ที่นั่นต่างก็มองหน้ากันด้วยความงุนงง ทำไมยิ่งฟังก็ยิ่งดูเกินจริงไปกันใหญ่...พวกเขาไม่อาจจินตนาการได้เลยว่า พลังแบบไหนกันที่จะสามารถสังหารกองทหารชั้นยอดนับหมื่นคนได้ในคราวเดียว","“ส่วนความรุนแรงของเวทมนตร์นั้น อีกเดี๋ยวพวกเจ้าก็จะได้เห็นเอง!”","เดลยักไหล่ ก่อนที่เขาจะได้เห็นความจริงด้วยตาของตนเอง เขาก็แทบจะไม่กล้าเชื่อเหมือนกัน","ลูคัสเต็มไปด้วยความสงสัย แต่ครึ่งชั่วโมงต่อมา เขาก็เข้าใจความหมายในคำพูดของเดลได้อย่างถ่องแท้ เพราะเรือเหาะได้บินมาถึงน่านฟ้าเหนือพื้นที่ที่ถูกระเบิดนิวเคลียร์ ด้านล่างคือภาพที่น่าสะพรึงกลัวเป็นอย่างยิ่ง สุดปลายสายตามีเพียงแค่ผืนดินที่ถูกเผาไหม้จนดำเป็นตอตะโก!","พื้นที่รัศมีสิบกว่ากิโลเมตรถูกหลอมละลาย และแข็งตัวจนกลายเป็นก้อนแก้ว บริเวณรอบนอกยังสามารถมองเห็นซากศพจำนวนนับไม่ถ้วน ทั้งทหารของจักรวรรดิที่ถูกความร้อนระเหยจนแห้งตาย และ ‘แม่น้ำเหล็ก’ ที่ถูกหลอมละลายจนหมดสิ้น ก่อนจะเย็นตัวลงและเกาะติดเป็นเนื้อเดียวกับผืนดิน","“ดูนั่นสิ เมื่อยี่สิบวันก่อน ตรงนั้นยังเป็นภูเขาเหมืองแร่ใหญ่อยู่เลย!”","เดลชี้ไปทางใจกลางพื้นที่ระเบิดนิวเคลียร์","ลูคัสมองไปที่ใจกลางพื้นที่ระเบิด ตรงจุดที่อีกฝ่ายชี้ไปนั้น ไม่มีภูเขาเหมืองแร่อะไรเลย มีเพียงหลุมอุกกาบาตขนาดยักษ์ที่ลึกจนมองไม่เห็นก้น ราวกับว่ามันเชื่อมต่อไปยังขุมนรก...","“นี่ก็คือ...เวทมนตร์งั้นรึ?”","ไอวีน่าเอ่ยออกมาด้วยน้ำเสียงที่สั่นเครือ","ภาพอันน่าสะพรึงกลัวตรงหน้า เกินกว่าจินตนาการเกี่ยวกับเวทมนตร์ที่น่ากลัวที่สุดในใจของเธอไปมาก ต่อให้เป็นพลังศักดิ์สิทธิ์ที่ทรงพลังที่สุดที่ท่านกุสตาฟเคยร่ายออกมา ความรุนแรงก็ยังไม่ถึงหนึ่งในพันของเวทมนตร์นี้เลยด้วยซ้ำ","นี่ไม่ใช่เวทมนตร์แล้ว แต่มันคือทัณฑ์สวรรค์ชัดๆ!"]},{"n":455,"t":"ความตกตะลึงของไอวีน่า และความเจริญรุ่งเรืองของเมืองน้ำมันดิน","c":["มีพ่อมดจำนวนไม่น้อยที่รู้สึกหวาดกลัวต่ออานุภาพของเวทมนตร์ระเบิดนิวเคลียร์เหมือนกับไอวีน่า","หากไม่ใช่เพราะมีข่าวการพ่ายแพ้อย่างย่อยยับของศาสนจักรมาก่อน พวกเขาคงคิดว่าที่นี่จะต้องเกิดภัยพิบัติทางธรรมชาติ อย่างเช่นอุกกาบาตพุ่งชน หรือไม่ก็ลาวาภูเขาไฟปะทุอย่างแน่นอน ถึงได้สร้างภาพที่น่าสะพรึงกลัวได้ขนาดนี้","“อ้อ ข้าต้องขอเตือนพวกเจ้าไว้ก่อนเลยนะ ว่าอย่าได้เข้าใกล้พื้นที่บริเวณนี้เด็ดขาด!”","เดลกล่าวด้วยสีหน้าเคร่งเครียด","“เมื่อไม่นานมานี้ มีพ่อมดธาตุหลายคนที่ไม่ยอมฟังคำเตือน พวกเขาอยากจะเข้าไปวิจัยองค์ประกอบของธาตุในอากาศบริเวณนั้น ผลก็คือ หลังจากเข้าไปในพื้นที่ใจกลางได้เพียงไม่กี่วัน ผิวหนังที่โผล่พ้นเสื้อผ้าออกมาก็เริ่มเปื่อยยุ่ย จนต้องถูกส่งตัวไปรับการรักษาอย่างเร่งด่วน ตอนนี้ก็ไม่รู้ว่าอาการเป็นยังไงบ้างแล้ว”","น่ากลัวขนาดนั้นเชียวรึ?","ลูคัสอดไม่ได้ที่จะเดาะลิ้น เวลาผ่านไปนานขนาดนี้แล้ว แต่แค่ผลกระทบที่หลงเหลืออยู่ของเวทมนตร์ ก็ยังสามารถทำให้พ่อมดเต็มตัวหลายคนได้รับบาดเจ็บสาหัสได้ ไม่อยากจะคิดเลยว่าตอนที่เวทมนตร์นี้ปะทุขึ้นมา มันจะน่าสะพรึงกลัวมากขนาดไหน","ท่ามกลางฝูงชน พ่อมดชายวัยกลางคนรูปร่างผอมสูงคนหนึ่งสบตากับไอวีน่า ทั้งคู่ต่างก็มองเห็นความเคร่งเครียดในแววตาของกันและกัน จากนั้นพ่อมดชายคนนั้นก็เอ่ยถามขึ้นมาอย่างกะทันหัน","“ในเมื่อท่านปรมาจารย์ลินน์ครอบครองเวทมนตร์ที่ทรงพลังขนาดนี้ แล้วทำไมถึงไม่บุกโจมตีจักรวรรดิต่อ และกวาดล้างศาสนจักรที่เป็นศัตรูของพวกพ่อมดให้สิ้นซากไปเลยล่ะ?”","พ่อมดชายที่เอ่ยถามมีชื่อว่ามอนโร เขาเป็นสายลับที่ศาสนจักรส่งแฝงตัวเข้ามาในกลุ่มพ่อมดเหมือนกับไอวีน่า","พวกเขาทั้งสองอาศัยเส้นสายของศาสนจักรในพื้นที่ แฝงตัวเข้ามาในสมาคมช่วยเหลือซึ่งกันและกันได้สำเร็จ และอาศัยช่วงเวลาที่สถานการณ์กำลังวุ่นวาย แอบอ้างชื่อของสถาบันที่ถูกกวาดล้างจนหมดสิ้น เพื่อให้ได้รับความไว้วางใจจากลูคัสและคนอื่นๆ ในเบื้องต้น","และหนึ่งในจุดประสงค์ของการสอดแนมในครั้งนี้ ก็คือการสืบหาเบื้องลึกเบื้องหลังของพวกพ่อมด","หลังจากที่ยึดครองเมืองน้ำมันดิน และเอาชนะกองทัพปราบปรามได้สำเร็จ ตามความคาดหมายของเบื้องบนแห่งศาสนจักร พ่อมดเหล่านี้น่าจะเปิดฉากโจมตีครั้งใหญ่ต่อไป ทำให้จักรวรรดิต้องรวบรวมกำลังพลเพื่อเตรียมพร้อมรับมือกับการทำสงคราม ถึงขนาดต้องเรียกตัวกองทัพทัณฑ์ศักดิ์สิทธิ์ ที่ถูกส่งไปสืบสวนเรื่องราวของเทพเจ้านอกรีตที่ชายแดนทางเหนือกลับมาอย่างเร่งด่วน","ท่านสมเด็จพระสันตะปาปาเองก็เตรียมพร้อมที่จะปกป้องเมืองศักดิ์สิทธิ์ และรับมือกับเวทมนตร์วันสิ้นโลกอันน่าสะพรึงกลัวนั้น โดยการจัดพิธีสวดภาวนาที่รวบรวมผู้คนกว่าแสนคนขึ้นมา เพื่อเตรียมพร้อมสำหรับการอัญเชิญเทพจุติได้ทุกเมื่อ","แต่พวกพ่อมดกลับไม่มีทีท่าว่าจะบุกโจมตีครั้งใหญ่เลยแม้แต่น้อย ทำให้การเตรียมการทั้งหมดของศาสนจักรต้องสูญเปล่า และการกระทำที่ผิดปกติของอีกฝ่ายเช่นนี้ ก็ทำให้บรรดาเบื้องบนของศาสนจักรต่างก็พากันงุนงงไปตามๆ กัน","ลูคัสและคนอื่นๆ เองก็สนใจในคำถามของมอนโรเช่นกัน พวกเขาหันไปมองเดลด้วยความอยากรู้อยากเห็น","“เรื่องนี้น่ะรึ...”","เดลชะงักไปเล็กน้อย","ความจริงแล้วเขาเองก็สงสัยในเรื่องนี้เช่นกัน สมาชิกสภาต่างก็มีการคาดเดาไปต่างๆ นานา ถึงเหตุผลที่เบื้องบนสั่งยุติสงคราม แต่เดลก็ไม่ได้โง่พอที่จะเปิดเผยข้อมูลเหล่านี้ให้พ่อมดที่ยังไม่รู้หัวนอนปลายเท้าฟัง เขาจึงเปลี่ยนเรื่องและอธิบายให้ทุกคนฟังในอีกมุมมองหนึ่งแทน","ตามคำพูดของท่านปรมาจารย์ลินน์ คนเราไม่อาจกินจนอ้วนได้ในคำเดียว หากนับตั้งแต่ตอนที่พวกเขาบุกยึดเมืองหลวงของอาณาจักรฮัดลาตา เวลาก็เพิ่งจะผ่านไปได้แค่ปีเดียวเท่านั้น","ก่อนหน้านี้ การอาศัยอำนาจของราชวงศ์และร่วมมือกับขุนนางในพื้นที่ เพื่อปกครองทางอ้อม ทำให้ประหยัดแรงไปได้มาก แต่ตอนนี้เมื่อพวกพ่อมดต้องมาปกครองดินแดนทางตะวันออกของอาณาจักรทั้งหมดด้วยตนเอง ลำพังแค่ทหารปืนไฟสามหมื่นนาย และพ่อมดอีกไม่กี่พันคนนั้นไม่เพียงพอเลย เป็นเหตุให้บรรดาผู้ศรัทธาในพื้นที่ห่างไกลก่อความวุ่นวายขึ้นมามากมาย จนทำให้พวกเขาต้องปวดหัวกันไม่เว้นแต่ละวัน","นั่นก็หมายความว่า ในช่วงเวลาสั้นๆ ขอบเขตการปกครองของพวกเขาได้มาถึงขีดจำกัดแล้ว และจำเป็นต้องใช้เวลาในการย่อยสลายสักระยะหนึ่ง รอให้ภายในมีความมั่นคงเสียก่อน แล้วค่อยเปิดฉากโจมตีต่อก็ยังไม่สาย","คำพูดของเดลช่วยปัดเป่าความสงสัยในใจของบรรดาพ่อมดส่วนใหญ่ไปได้ แต่สำหรับมอนโรแล้ว เขายังคงรู้สึกกึ่งเชื่อกึ่งสงสัย","คำอธิบายนี้ฟังดูมีเหตุผลอยู่บ้าง แต่เมื่อลองคิดดูให้ดีแล้ว มันก็ยังมีอีกหลายจุดที่ไม่สมเหตุสมผลอยู่ดี","ช่วงเวลาที่พวกพ่อมดเอาชนะกองทัพปราบปรามได้ คือช่วงเวลาที่จักรวรรดิอ่อนแอที่สุด กองกำลังหลักส่วนใหญ่ถูกกวาดล้าง สตรีศักดิ์สิทธิ์ลูเซียสิ้นชีพในสนามรบ ท่านประธานผู้พิพากษาก็ถูกจับเป็นเชลย ในช่วงเวลาสั้นๆ ท่านสมเด็จพระสันตะปาปาย่อมไม่มีทางระดมกองทัพที่กระจายอยู่ทั่วจักรวรรดิมาได้ทันอย่างแน่นอน","และระยะทางจากเมืองน้ำมันดินไปยังเมืองศักดิ์สิทธิ์ ก็ห่างกันเพียงแค่สามร้อยกิโลเมตรเท่านั้น ด้วยสิ่งประดิษฐ์เล่นแร่แปรธาตุของพวกพ่อมด ใช้เวลาเพียงแค่ไม่กี่ชั่วโมงก็สามารถเดินทางไปถึงได้แล้ว อีกฝ่ายย่อมมีศักยภาพมากพอที่จะใช้เวทมนตร์อันทรงพลังนั้น สร้างความเสียหายอย่างหนักให้กับศาสนจักร แทนที่จะรักษาสถานการณ์ตึงเครียดเอาไว้แบบนี้","มอนโรอดไม่ได้ที่จะเกิดข้อสันนิษฐานขึ้นมาในใจ บางทีพวกพ่อมดอาจจะแค่แสร้งทำเป็นเก่งกาจ แต่ความจริงแล้วพวกเขาไม่มีความสามารถที่จะร่ายเวทมนตร์นั้นได้อีกแล้ว!","หรือบางที สิ่งที่สามารถสร้างพลังทำลายล้างที่น่าสะพรึงกลัวได้ขนาดนี้ อาจจะไม่ใช่เวทมนตร์เลยด้วยซ้ำ แต่มันคือภัยพิบัติทางธรรมชาติ และพวกพ่อมดก็แค่อาศัยวิธีการบางอย่าง และใช้ประโยชน์จากมันล่วงหน้าต่างหาก","ยิ่งคิดมอนโรก็ยิ่งรู้สึกว่ามันมีความเป็นไปได้สูงมาก","เขาไม่มีทางเชื่อเด็ดขาด ว่าพวกพ่อมดจะสามารถใช้เวทมนตร์ที่น่าสะพรึงกลัวเช่นนี้ได้ เพราะมันอยู่นอกเหนือความเข้าใจเกี่ยวกับเวทมนตร์ของเขาไปไกลลิบลับ","นั่นมันคือพลังอำนาจที่พระผู้เป็นเจ้าผู้ทรงเกียรติเท่านั้นที่จะครอบครองได้!","มอนโรจมอยู่กับความคิดของตนเอง แต่เพียงแค่ข้อสันนิษฐาน ย่อมไม่เพียงพอที่จะโน้มน้าวท่านสมเด็จพระสันตะปาปาได้อย่างแน่นอน เขาจำเป็นต้องรวบรวมหลักฐานให้มากกว่านี้","ไม่นานนัก เครื่องบินรบรูปแบบใหม่สองลำที่บินลาดตระเวนอยู่ ก็บินกลับมา เครื่องรับสัญญาณคลื่นแม่เหล็กไฟฟ้าที่ติดตั้งอยู่บนเรือเหาะ ก็ส่งเสียง ‘ติ๊ด ติ๊ด’ ดังขึ้นมาในทันที","“ท่านเดล ทุกอย่างปลอดภัยดีครับ จักรวรรดิไม่ได้ส่งกองอัศวินกริฟฟอนมาไล่ล่าหรือสกัดกั้นพวกเราเลย”","นักบินที่ทำหน้าที่รับส่งสัญญาณวิทยุรายงานสถานการณ์","“สกัดกั้นงั้นรึ? พวกมันต้องมีความกล้ามากพอด้วยนะถึงจะทำได้!”","เดลกล่าวด้วยน้ำเสียงดูแคลน","กองอัศวินกริฟฟอนของจักรวรรดิ เมื่ออยู่ต่อหน้าเครื่องบินรบรูปแบบใหม่ ก็เป็นได้แค่เป้านิ่งเท่านั้น นอกเสียจากว่าพวกมันจะสามารถเสกมังกรไฟออกมาได้อีกตัว ไม่อย่างนั้นต่อให้ส่งมามากแค่ไหน ก็เป็นแค่การเอาผลงานมาประเคนให้พวกเขาเท่านั้น","น้ำเสียงที่ดูแคลนของเดล ทำให้มอนโรรู้สึกไม่พอใจเป็นอย่างมาก แต่เขาก็ต้องข่มอารมณ์เอาไว้ และหันไปให้ความสนใจกับเครื่องรับสัญญาณที่กำลังกะพริบอยู่บนเรือเหาะ พร้อมกับแกล้งถามถึงการทำงานของมันอ้อมๆ","เดลไม่มีความคิดที่จะอธิบายเลยแม้แต่น้อย เพราะในตอนนี้เวทมนตร์สื่อสารด้วยคลื่นแม่เหล็กไฟฟ้า ยังคงเป็นความลับที่ไม่สามารถเปิดเผยได้","พื้นที่รกร้างที่พวกเขากำลังหลบหนีอยู่นั้น ห่างจากเมืองน้ำมันดินเพียงแค่ร้อยกว่ากิโลเมตร ภายใต้ความเร็วสูงสุดของเรือเหาะ เพียงแค่หนึ่งชั่วโมง พวกเขาก็เดินทางมาถึงสนามบินแห่งใหม่ที่ถูกสร้างขึ้นภายในเมือง","ที่บอกว่าเป็นสนามบิน ความจริงแล้วมันก็คือจัตุรัสที่กว้างใหญ่ไพศาลแห่งหนึ่ง ซึ่งถูกถูกปรับแต่งด้วยเวทมนตร์จนราบเรียบ สามารถรองรับเรือเหาะให้จอดเทียบท่าได้มากกว่าสองร้อยลำ ตรงกลางยังมีรันเวย์ยาว สำหรับให้เครื่องบินรบรูปแบบใหม่บินขึ้นและลงจอดได้อีกด้วย","สีหน้าของไอวีน่าตึงเครียดจนถึงขีดสุด เพราะนั่นหมายความว่าพวกเขาได้เข้าสู่เมืองที่อยู่ภายใต้การปกครองของพวกพ่อมดอย่างเป็นทางการแล้ว","ก่อนหน้านี้ เธอเคยจินตนาการเอาไว้ว่า เมืองสำคัญทางตะวันออกที่ถูกยึดครองแห่งนี้ จะตกอยู่ในสภาพแบบไหนเมื่อตกอยู่ในเงื้อมมือของพวกพ่อมด","คงจะมีศพแขวนอยู่บนกำแพงเมือง ถนนหนทางคงจะเต็มไปด้วยคราบเลือดที่ยังล้างไม่ออก ชาวเมืองต่างก็หลบซ่อนตัวอยู่ในบ้านด้วยความหวาดกลัว และมีพ่อมดที่สวมเสื้อคลุมยาว มีท่าทางลึกลับเดินไปมา บางทีในอากาศก็อาจจะอบอวลไปด้วยกลิ่นแปลกๆ ของยาวิเศษ...","แต่เมื่อก้าวเข้าสู่เมืองแห่งนี้ สิ่งที่ปรากฏแก่สายตาของเธอ กลับทำให้เธอรู้สึกประหลาดใจเป็นอย่างมาก","ถนนหนทางในเมืองน้ำมันดินดูกว้างขวางมาก ผู้คนที่สัญจรไปมาก็มีมากมายนับไม่ถ้วน สัตว์พาหนะที่บรรทุกสินค้ากล่องแล้วกล่องเล่า กำลังก้าวเดินด้วยฝีเท้าที่หนักอึ้งภายใต้การเร่งเร้าของคนขับรถม้า แต่ในพริบตาเดียว พวกมันก็ถูกกล่องเหล็กสี่เหลี่ยมที่บรรทุกหินจนเต็มแซงหน้า และถูกทิ้งห่างออกไปไกล","ไอวีน่ามีความทรงจำเกี่ยวกับกล่องเหล็กรูปร่างแปลกประหลาดนี้อยู่บ้าง จากข้อมูลที่เธอได้รับมา สิ่งนี้ถูกพวกพ่อมดเรียกว่ารถเวทมนตร์ มันคืออาวุธสงครามที่ร้ายกาจมาก","ตัวถังด้านนอกสร้างขึ้นจากเหล็กกล้า หน้าไม้และดาบของทหารไม่มีทางเจาะทะลุได้เลย ความเร็วของมันก็เร็วกว่าม้าศึกมาก เมื่อพุ่งเข้าชนในสนามรบ มันสามารถบดขยี้ทหารม้าที่มีจำนวนมากกว่าสิบเท่าได้อย่างง่ายดาย...","แต่ตอนนี้ดูเหมือนว่า นอกจากการทำสงครามแล้ว สิ่งนี้ยังสามารถใช้ขนส่งสินค้าได้อีกด้วย","ตลอดเส้นทาง ไอวีน่าไม่เห็นภาพที่เต็มไปด้วยเลือด ความโหดร้าย และความมืดมิด อย่างที่เธอจินตนาการเอาไว้เลย ที่นี่กลับดูเหมือนเมืองที่เจริญรุ่งเรืองมากเมืองหนึ่ง ทุกคนที่เธอเห็นต่างก็กำลังทำงาน ไม่ว่าจะเป็นพ่อมดหรือคนยากจนก็ไม่มีข้อยกเว้น มองไม่ออกเลยสักนิดว่าที่นี่คือสถานที่ที่เพิ่งถูกบุกยึดครองเมื่อยี่สิบวันก่อน","บนท้องถนนถึงกับมีป้ายประกาศติดเอาไว้ว่า [ห้ามอุจจาระและปัสสาวะบนถนนในเมือง ผู้ฝ่าฝืนจะถูกเฆี่ยนสิบที]","เพื่อให้คนยากจนที่ไม่รู้หนังสือสามารถเข้าใจความหมายของป้ายประกาศได้ จึงมีการวาดรูปภาพประกอบเอาไว้อย่างใส่ใจ และยังมีเครื่องหมายกากบาทขนาดใหญ่ทับเอาไว้อีกด้วย!","“พวกเขากำลังทำอะไรกันน่ะ?”","ไอวีน่าชี้ไปข้างหน้า คนงานหลายคนที่สวมเสื้อผ้าเรียบง่าย กำลังช่วยกันตั้งเสาเรียวยาวขึ้นที่บริเวณสี่แยกอย่างยากลำบาก","โดยบนยอดเสามีสิ่งของที่มีรูปร่างกลมใสแขวนอยู่ ดูประณีตงดงามมาก","มันคือของประดับตกแต่งงั้นรึ? หรือว่าเป็นจุดศูนย์รวมสำหรับการร่ายเวทมนตร์บางอย่าง...","ไอวีน่าแอบคาดเดาอยู่ในใจ แต่ในวินาทีต่อมา เธอก็ได้ยินเดลอธิบายว่า","“นี่คือเสาไฟถนน ใช้สำหรับให้แสงสว่างในเวลากลางคืน ดังนั้น ในตอนกลางคืน เมืองน้ำมันดินก็จะสว่างไสวเหมือนกับตอนกลางวันเลยล่ะ!”","ลูคัสและคนอื่นๆ ต่างก็พากันเดาะลิ้นด้วยความทึ่ง รูปแบบการเล่นแร่แปรธาตุที่สามารถให้แสงสว่างแก่เมืองทั้งเมืองได้อย่างต่อเนื่อง พวกเขาไม่เคยได้ยินเรื่องแบบนี้มาก่อนเลย นี่มันต้องใช้พลังเวทมากมายขนาดไหนกันเนี่ย?","ส่วนมอนโรที่อยู่ด้านข้าง ก็จดบันทึกเรื่องนี้เอาไว้ในใจอย่างเงียบๆ พวกพ่อมดได้ติดตั้งเวทมนตร์ให้แสงสว่างเอาไว้ทั่วทั้งเมือง เพื่อใช้เตรียมพร้อมสำหรับการต่อสู้ในเวลากลางคืน...","จากนั้นมอนโรก็กวาดสายตามองไปรอบๆ เมือง และจดบันทึกการเปลี่ยนแปลงทุกอย่างเอาไว้","แม้ว่าเมืองน้ำมันดินทั้งเมืองจะดูเจริญรุ่งเรืองมาก แต่เขาเชื่อมั่นว่านี่เป็นเพียงแค่ภาพลวงตาเท่านั้น การที่พวกพ่อมดพยายามรักษาความเจริญรุ่งเรืองจอมปลอมนี้เอาไว้ จะต้องมีจุดประสงค์แอบแฝงอย่างแน่นอน","โชคดีที่ไม่นานนัก มอนโรก็ได้เห็นในสิ่งที่เขาอยากเห็น","พ่อมดหลายคนกำลังใช้เวทมนตร์ทำลายบ้านเรือนที่ทรุดโทรมจนพังทลายลงมา จากนั้นก็ตะโกนสั่งให้คนยากจนขนเศษซากปรักหักพังขึ้นรถบรรทุก","เมื่อเห็นภาพนี้ มอนโรก็ถอนหายใจพร้อมกับส่ายหน้า ก่อนจะจดบันทึกเพิ่มลงไปในใจอีกเรื่องหนึ่ง พวกพ่อมดได้ทำลายบ้านเรือนของคนยากจนอย่างโหดเหี้ยม และกดขี่ข่มเหงผู้ศรัทธาของพระผู้เป็นเจ้า บังคับให้พวกเขาสร้างคฤหาสน์อันหรูหรา และสิ่งอำนวยความสะดวกทางการทหารต่างๆ ให้กับเบื้องบนของสภาเวทมนตร์","แตกต่างจากมอนโรที่มีอคติบังตา แม้ว่าไอวีน่าจะยังคงระแวดระวังพวกพ่อมดอยู่ แต่เธอก็สังเกตเห็นได้อย่างรวดเร็วว่า คนยากจนที่กำลังทำงานหนักเหล่านี้ ไม่มีท่าทีหวาดกลัวหรือวิตกกังวลบนใบหน้าเลย ในทางกลับกัน เธอกลับมองเห็น...รอยยิ้ม?","ในระหว่างที่กำลังครุ่นคิด เดลก็เริ่มบ่นออกมาว่า ก่อนหน้าที่พวกเขาจะยึดเมืองน้ำมันดินแห่งนี้ได้ บริเวณสลัมมีกลิ่นเหม็นเน่าโชยไปทั่ว จนแทบจะทนดูไม่ได้เลย","ประกอบกับในช่วงที่มีการลอบโจมตี บ้านเรือนจำนวนมากก็ได้รับความเสียหาย ซึ่งส่งผลกระทบต่อภาพลักษณ์ของเมืองเป็นอย่างมาก ดังนั้น ท่านปรมาจารย์ลินน์จึงเสนอให้มีการปรับปรุงเมืองแห่งนี้ครั้งใหญ่ และถือโอกาสนี้ขยายและซ่อมแซมถนน เพื่อให้รถเวทมนตร์สามารถวิ่งบนท้องถนนได้อย่างสะดวกสบาย","“แล้วคนยากจนที่ไม่มีบ้านอยู่ พวกเขาจะไปอยู่ที่ไหนกันล่ะ?”","ไอวีน่าขมวดคิ้วถาม","“นั่นไงล่ะ”","เดลชี้ไปที่พื้นที่ที่ถูกเคลียร์เรียบร้อยแล้ว ซึ่งมีบ้านพักชั่วคราวที่เพิ่งสร้างเสร็จ ดูเป็นระเบียบเรียบร้อยและกว้างขวาง","ภายใต้การจับตามองของไอวีน่า รถเวทมนตร์ได้บรรทุกหินมาที่นี่ทีละคัน จากนั้นก็มีพ่อมดธาตุคอยร่ายเวทมนตร์ เพื่อช่วยคนงานในการสร้างโครงสร้างของตัวบ้าน","ผนังบ้านสร้างขึ้นจากคอนกรีตและหินล้วนๆ เนื่องจากเหล็กขาดแคลนและไม่สะดวกในการร่ายเวทมนตร์ ภายในจึงไม่มีโครงสร้างเหล็กเส้นรองรับ แต่ถ้าเทียบกับบ้านไม้และกระท่อมฟางที่ทรุดโทรมของพวกคนยากจนแล้ว มันก็ถือว่าดีกว่ากันมาก","ตอนที่เข้ามาในสลัมแห่งนี้ ไอวีน่าก็สังเกตเห็นบ้านเรือนที่กำลังก่อสร้างอยู่แล้ว แต่เธอไม่คาดคิดเลยว่าบ้านที่สวยงามแบบนี้ จะถูกสร้างขึ้นมาเพื่อให้คนยากจนอยู่อาศัย","แต่ถึงอย่างนั้น การสร้างก็ยังช้ากว่าการรื้อถอนอยู่ดี ชาวเมืองที่สูญเสียบ้านและไม่มีที่อยู่ชั่วคราว จึงถูกจัดให้ไปพักอาศัยอยู่ในคฤหาสน์และที่ดินของพวกขุนนางเป็นการชั่วคราว","ที่นั่นกว้างขวางมาก และมีห้องมากมาย สามารถรองรับคนได้หลายร้อยคนอย่างสบายๆ","เมื่อได้ฟังคำอธิบายของเดล มอนโรก็แทบจะไม่อยากเชื่อหูตัวเอง พ่อมดพวกนี้ยอมให้พวกคนยากจนต่ำต้อย เข้าไปอาศัยอยู่ในคฤหาสน์ของพวกขุนนางเนี่ยนะ...","แต่เพียงไม่นาน มอนโรก็เลิกใส่ใจกับเรื่องเล็กน้อยนี้ เพราะความโกรธเกรี้ยวได้พุ่งปรี๊ดขึ้นสมองของเขาในทันที เมื่อเขาพบว่าโบสถ์ในเมืองน้ำมันดินแห่งนี้ถูกพวกพ่อมดรื้อถอนจนราบเป็นหน้ากลอง รูปปั้นของพระผู้เป็นเจ้าก็ถูกสับเป็นชิ้นๆ แล้วขนขึ้นรถบรรทุกไป","ตามคำพูดของพวกพ่อมด รูปปั้นนี้จะถูกโยนเข้าไปในเตาหลอมที่มีความร้อนสูง เพื่อหลอมให้กลายเป็นน้ำทองแดง จากนั้นก็นำทองแดงเหล่านี้ไปใช้ในสถานที่ที่สำคัญกว่า อย่างเช่นการนำไปทำเป็นเสาไฟถนน...","การกระทำที่ลบหลู่พระผู้เป็นเจ้าเช่นนี้ ทำให้มอนโรแทบจะโกรธจนสลบไปตรงนั้น","ในขณะที่เดลยังคงกล่าวด้วยรอยยิ้มต่อไป","“ก่อนหน้านี้ข้าได้ยินมาว่า เจ้าเมืองของเมืองน้ำมันดินแห่งนี้ เป็นคนสร้างรูปปั้นเทพเจ้านี้ขึ้นมา เพื่อแสดงให้เห็นถึงความศรัทธาอันแรงกล้าของตนเอง โดยตัวรูปปั้นนั้นหล่อขึ้นมาจากทองคำ ทำให้พวกนักเล่นแร่แปรธาตุพากันดีใจอยู่ตั้งนาน แต่ผลปรากฏว่าพอทุบให้แตก ถึงได้รู้ว่ามันแค่เคลือบทองเอาไว้ข้างนอกเท่านั้น ส่วนข้างในเป็นทองแดงล้วนๆ!”","“แต่ว่าทำเลที่ตั้งของโบสถ์แห่งนี้ค่อนข้างดีทีเดียว พวกเรากำลังเตรียมตัวที่จะรื้อถอนมันทั้งหมด แล้วสร้างเป็นสถานีรถไฟขึ้นมาแทน!”","เดลชี้ไปที่สถานีรถไฟที่ยังสร้างกำแพงไม่เสร็จ และกล่องเหล็กสี่เหลี่ยมขนาดใหญ่ ที่ถูกขนย้ายมาที่นี่ด้วยความร่วมมือของเรือเหาะหลายลำ พร้อมกับอธิบายให้ทุกคนฟังถึงสิ่งประดิษฐ์เล่นแร่แปรธาตุ ที่สถาบันวิจัยเวทมนตร์เพิ่งจะคิดค้นขึ้นมาเมื่อเร็วๆ นี้ด้วยความภาคภูมิใจ","“สิ่งที่พวกเจ้าเห็นอยู่นี้ คือหัวรถจักรของขบวนรถไฟ ซึ่งใช้สำหรับให้พลังงานในการขับเคลื่อน ส่วนตู้โดยสารที่อยู่ด้านหลัง สามารถใช้สำหรับบรรทุกผู้คนและสินค้าได้!”","“รถไฟหนึ่งขบวนจะมีตู้โดยสารมาตรฐานทั้งหมดสิบห้าตู้ ตู้โดยสารหนึ่งตู้สามารถบรรจุคนได้ประมาณร้อยคน หรือบรรทุกสินค้าได้ประมาณหกสิบตัน!”","ตอนนี้ภายในอาณาจักรกำลังมีการก่อสร้างทางรถไฟอยู่ และอีกไม่นาน รถไฟขบวนนี้ก็จะสามารถเดินทางไปได้ทั่วทั้งอาณาจักร","“แล้วความเร็วของมันล่ะ? ถ้าเทียบกับเรือเหาะแล้วเป็นยังไงบ้าง?”","ไอวีน่าเอ่ยถามด้วยสีหน้าเคร่งเครียด","“ถ้าบรรทุกสินค้าจนเต็ม ความเร็วย่อมไม่มีทางเทียบกับเรือเหาะได้อยู่แล้ว แต่ก็น่าจะอยู่ที่ประมาณเก้าสิบกิโลเมตรต่อชั่วโมงล่ะมั้ง”","เดลตอบกลับอย่างไม่ใส่ใจ","เมื่อได้ยินดังนี้ เหงื่อเย็นๆ ก็ผุดขึ้นมาบนหน้าผากของมอนโร เขาคำนวณดูคร่าวๆ หากเดลไม่ได้โกหก สิ่งที่เรียกว่ารถไฟนี้ จะสามารถบรรทุกสินค้าได้ถึงเก้าร้อยตัน หรือขนส่งกองทัพทหารได้ถึงหนึ่งพันห้าร้อยคน จากเมืองน้ำมันดินไปยังเมืองหลวงได้ภายในวันเดียว","แม้ว่ามอนโรจะรู้สึกว่าพวกพ่อมดอาจจะพูดเกินจริงไปบ้าง แต่ต่อให้สิ่งที่เรียกว่ารถไฟนี้ มีประสิทธิภาพเพียงแค่หนึ่งในสามของที่อีกฝ่ายพูด มันก็ยังคงเป็นภัยคุกคามที่น่าสะพรึงกลัวเป็นอย่างยิ่ง เขาจะต้องรีบส่งข่าวนี้ออกไปให้เร็วที่สุด!"]},{"n":456,"t":"ทฤษฎีการล่มสลายของพ่อมดของมอนโร!","c":["ภายใต้คำอธิบายอย่างต่อเนื่องของเดล บรรดาพ่อมดที่อยู่ที่นั่นต่างก็ยิ่งตั้งตารอคอยรถไฟเวทมนตร์ที่กำลังอยู่ในระหว่างการก่อสร้างขบวนนี้มากขึ้นไปอีก","รอให้สร้างทางรถไฟเสร็จสมบูรณ์ พวกเขาก็จะสามารถเดินทางไปยังเมืองใดก็ได้ในอาณาจักรแห่งนี้ภายในสามวัน ด้วยรถไฟขบวนนี้","และรถไฟแบบนี้ก็จะถูกสร้างขึ้นมาอีกถึงห้าสิบขบวน เพื่อใช้สำหรับการขนส่งและการเดินทางภายในอาณาจักร","“ช่างยอดเยี่ยมจริงๆ!”","ลูคัสกล่าวด้วยความทึ่ง เขาจินตนาการถึงภาพรถไฟขบวนใหญ่ที่เหมือนกับงูยักษ์ กำลังแล่นฉิวไปบนพื้นที่รกร้าง เสียงล้อที่บดขยี้กับรางรถไฟดังสนั่นหวั่นไหว พร้อมกับขนส่งสินค้าจำนวนมหาศาลไปยังทุกซอกทุกมุมของอาณาจักร","ภายในเวลาสั้นๆ เพียงแค่ชั่วโมงกว่าๆ นี้ เขาก็ได้พบกับเรื่องที่น่าตกตะลึงมากมายเหลือเกิน","เรือเหาะที่ใหญ่กว่าบ้าน แต่กลับสามารถบรรทุกคนนับสิบให้ลอยขึ้นไปบนท้องฟ้าได้ เครื่องบินรบที่มีความเร็วสูงสุดขีดและสามารถยิงลำแสงออกมาได้ เวทมนตร์ที่ทรงพลังจนสามารถทำลายล้างกองทัพปราบปรามได้ในการโจมตีเพียงครั้งเดียว จนทำให้พื้นที่รัศมีสิบกว่ากิโลเมตรกลายเป็นเถ้าถ่าน...","และยังมีรถไฟเวทมนตร์ขบวนนี้ ที่สามารถขนส่งกองทัพทหารทั้งกองทัพไปยังพื้นที่ต่างๆ ของอาณาจักรได้ภายในเวลาอันสั้น ด้วยระยะทางหลายร้อยกิโลเมตร ลูคัสรู้สึกเหมือนกับว่าตนเองกำลังฝันไป","นอกจากมอนโรและไอวีน่าที่มีความคิดเป็นของตัวเองแล้ว พ่อมดคนอื่นๆ ก็ต่างตื่นเต้นไม่แพ้กัน","เมื่อก่อน ตอนที่พวกเขาอยู่ในจักรวรรดิ พวกเขาต้องใช้ชีวิตแบบหลบๆ ซ่อนๆ หากฐานะพ่อมดถูกเปิดเผย พวกเขาก็จะถูกศาสนจักรไล่ล่า และถูกมองด้วยสายตาที่หวาดกลัวและหวาดระแวง จนหลายคนเริ่มสงสัยว่า เส้นทางการเรียนรู้เวทมนตร์ และการแสวงหาความจริงของโลกนั้น เป็นสิ่งที่ถูกต้องหรือไม่","ศาสนจักรที่อยู่สูงส่งราวกับภูเขาลูกใหญ่ที่กดทับอยู่บนหัวของทุกคน มันยิ่งใหญ่จนทำให้ผู้คนแทบจะหายใจไม่ออก!","จนกระทั่งตอนนี้ พวกเขาถึงเพิ่งตระหนักได้ว่า ศาสนจักรก็ไม่ได้ยิ่งใหญ่อะไรขนาดนั้นเลย ในเมื่อพวกพ่อมดก็สามารถแข็งแกร่งได้ถึงขนาดนี้!","เมื่อเห็นท่าทางตื่นเต้นตกใจของทุกคน เดลก็อดไม่ได้ที่จะส่ายหน้าพร้อมกับหัวเราะเบาๆ นี่แค่ในเมืองน้ำมันดินที่เพิ่งจะยึดครองมาได้เท่านั้น ถ้าไปถึงเมืองหลวงล่ะก็ จะมีของแปลกใหม่ให้ตื่นตาตื่นใจยิ่งกว่านี้อีกเยอะ ขนาดตัวเขาเองยังรู้สึกประหลาดใจอยู่บ่อยๆ เลย...","“ที่นี่คือที่พักของพวกเจ้าต่อจากนี้!”","เดลพาทุกคนเดินทางมาจนถึงสถาบันที่กำลังปรับปรุงใหม่ในเขตตะวันตกของเมือง","เดิมทีที่นี่เคยเป็นโรงเรียนของศาสนจักร ที่สร้างขึ้นมาเพื่อลูกหลานของขุนนาง และเพื่อฝึกฝนแม่ชี แต่ตอนนี้มันถูกปรับปรุงใหม่ แม้ว่าจุดประสงค์หลักจะยังคงเป็นสถานที่สำหรับการเรียนการสอนเหมือนเดิม แต่สิ่งที่สอนจะไม่ใช่พระคัมภีร์อีกต่อไป แต่เป็นเวทมนตร์ต่างหาก!","แม้ว่าลูคัสและคนอื่นๆ จะเป็นพ่อมด แต่เนื่องจากเพิ่งจะมาถึงที่นี่เป็นครั้งแรก เดลจึงไม่ได้พาพวกเขาไปยังที่พักโดยตรง แต่กลับพาไปทดสอบระดับเวทมนตร์ก่อน","เมื่อเข้าไปในสถาบันแห่งนี้ ไอวีน่าถึงเพิ่งตระหนักว่าพวกเขาไม่ใช่กลุ่มแรกที่มาถึง ที่นี่มีผู้คนพลุกพล่าน มีพ่อมดอย่างน้อยนับพันคน ซึ่งดูเหมือนว่าทั้งหมดจะหนีมาจากจักรวรรดิเพื่อมายังเมืองน้ำมันดินแห่งนี้ ผ่านช่องทางต่างๆ","“เนื่องจากตอนนี้เป็นช่วงเวลาที่ค่อนข้างละเอียดอ่อน ดังนั้น จึงต้องมีการทดสอบเล็กๆ น้อยๆ เกิดขึ้น...”","พูดมาถึงตรงนี้ เดลก็ชะงักไปเล็กน้อย จากนั้นก็สั่งให้คนนำกระดาษปึกหนึ่งมาแจกจ่ายให้กับทุกคนที่อยู่ที่นั่น","“ต่อจากนี้ พวกเจ้าแค่ต้องอ่านข้อความบนกระดาษแผ่นนี้ก็พอแล้ว!”","ไอวีน่าเอื้อมมือไปรับกระดาษแผ่นนั้นมา เมื่อเห็นข้อความที่เขียนอยู่บนนั้น ม่านตาของเธอก็หดเกร็งเล็กน้อย และมีสีหน้าแปลกประหลาดปรากฏขึ้นมาบนใบหน้า","ทางด้านมอนโรถึงกับอึ้งไปเลย เขาไม่คาดคิดเลยว่า พวกพ่อมดจะสามารถคิดค้นวิธีที่เจ้าเล่ห์และชั่วร้ายแบบนี้ขึ้นมาได้","“นี่ถือเป็นการแสดงความไม่ไว้ใจพวกเราอย่างนั้นรึ?”","แม่มดสาวที่มีหน้าตาสะสวยคนหนึ่งเม้มริมฝีปากเบาๆ ก่อนจะเอ่ยถามด้วยรอยยิ้ม","“ไม่หรอก นี่เป็นความแค้นส่วนตัวของท่านปรมาจารย์ลินน์ ดังนั้น ทุกคนที่เข้ามาในเมือง จะต้องด่าประโยคนี้ออกมาคนละประโยค”","เดลยักไหล่ เขาไม่กล้ารับหน้าที่เป็นแพะรับบาปในเรื่องนี้หรอกนะ","มีเพียงดาวรุ่งแห่งเวทมนตร์ท่านนั้นเท่านั้นแหละที่มีความกล้ามากพอ","ความจริงแล้ว การอาศัยกลเม็ดเล็กๆ น้อยๆ นี้ ทำให้พวกเขาสามารถจับสายลับของศาสนจักรได้หลายสิบคนแล้ว","“เทพีแห่งดวงจันทร์ เอลา เป็นแค่ยายแก่ใจร้ายจอมหลอกลวง สักวันหนึ่งนางจะต้องชดใช้ในสิ่งที่ตัวเองก่อเอาไว้...”","ลูคัสอ่านข้อความบนกระดาษอย่างไม่ลังเล น้ำเสียงของเขาแฝงไปด้วยความรู้สึกสะใจและโกรธแค้น","จากนั้น พ่อมดคนอื่นๆ ก็เริ่มทยอยอ่านข้อความบนกระดาษออกมาทีละคน","ข้อความบนกระดาษแต่ละแผ่นจะไม่เหมือนกัน แต่ไม่ต้องสงสัยเลยว่ามันคือคำด่าทอทั้งสิ้น","พ่อมดฝึกหัดหลายคนรู้สึกลังเลในตอนแรก เพราะก่อนที่พวกเขาจะกลายเป็นพ่อมด พวกเขาก็เคยเป็นชาวเมืองของจักรวรรดิมาก่อน ทำให้พวกเขามีความรู้สึกหวาดกลัวต่อเทพีแห่งดวงจันทร์ผู้สูงส่ง และพระผู้เป็นเจ้าที่ศาสนจักรคอยพร่ำบอกอยู่เสมอ","แต่ภายใต้บรรยากาศเช่นนี้ พวกเขาก็สามารถเอาชนะความหวาดกลัวต่อเทพเจ้าของศาสนจักรได้อย่างรวดเร็ว บางคนถึงกับรู้สึกว่ายังด่าไม่สะใจพอ จึงยิ่งด่าทอด้วยถ้อยคำที่รุนแรงมากขึ้นไปอีก","ความโกรธเกรี้ยวในใจของมอนโรแทบจะพุ่งทะลุขีดจำกัด แต่เมื่อเดลกวาดสายตามามอง ความโกรธทั้งหมดก็มลายหายไป กลายเป็นความหนาวเหน็บที่ทิ่มแทงเข้าไปถึงกระดูก","เหงื่อเย็นๆ ผุดขึ้นมาบนหน้าผากของมอนโร เขามองดูข้อความอันแสนชั่วร้ายบนกระดาษในมือ ก่อนจะตกอยู่ในสถานการณ์ที่กลืนไม่เข้าคายไม่ออก","จะด่า หรือไม่ด่า นี่คือปัญหาใหญ่...","...","ช่วงเย็น ณ สถาบันเวทมนตร์ในเมืองน้ำมันดิน ไอวีน่าและมอนโรที่ผ่านการทดสอบระดับเวทมนตร์เสร็จสิ้นแล้ว ก็ได้เดินเข้าไปในที่พักของสถาบันที่พวกเขาได้รับมอบหมาย","หลังจากปิดประตูห้อง มอนโรก็เริ่มตรวจสอบภายในห้องอย่างละเอียดทันที จากนั้นก็หยิบลูกแก้วคริสตัลออกมาจากอกเสื้อ เมื่อเห็นว่ามันไม่ได้เรืองแสงขึ้นมา เขาก็ถอนหายใจออกมาด้วยความโล่งอก ดูเหมือนว่าพวกพ่อมดจะไม่ได้ร่ายเวทมนตร์แปลกประหลาดอะไรเอาไว้ในห้องนี้","จนกระทั่งตอนนี้ ความโกรธที่มอนโรสะสมมาตลอดทั้งวัน ก็ได้ถูกระเบิดออกมาในที่สุด","“ลูกสมุนของพวกปีศาจร้าย พวกคนบ้าที่สมควรตาย บังอาจมาลบหลู่พระผู้เป็นเจ้าอันยิ่งใหญ่!”","มอนโรคำรามเสียงต่ำ พร้อมกับทุบกำปั้นลงบนกำแพงอย่างแรง หลังจากระบายอารมณ์เสร็จ เขาก็รีบหลับตาลง ทำสัญลักษณ์ภาวนา และสารภาพบาปต่อพระผู้เป็นเจ้าอันยิ่งใหญ่ในใจ","ไอวีน่าเองก็กำลังสวดภาวนาและสารภาพบาปอยู่ในใจอย่างเงียบๆ เช่นกัน เธอเองก็รู้สึกโกรธเคืองกับวิธีการที่ต่ำช้าของพวกพ่อมดไม่แพ้กัน","ก่อนที่จะเข้าร่วมกองทัพทัณฑ์ศักดิ์สิทธิ์อย่างเป็นทางการ แม้ว่าไอวีน่าจะเคยไปสวดภาวนาที่โบสถ์ในพื้นที่อยู่บ้างเป็นครั้งคราว แต่เธอก็ไม่ได้ถือว่าเป็นผู้ศรัทธาที่เคร่งครัดในเทพีแห่งดวงจันทร์แต่อย่างใด ประกอบกับการที่ไม่ได้รับความสนใจจากผู้เป็นพ่อ เธอจึงไม่ได้เข้าเรียนในโรงเรียนของศาสนจักร เหมือนกับลอธ พี่ชายของเธอ เพื่อศึกษาหาความรู้เกี่ยวกับพระคัมภีร์อย่างจริงจัง","แต่หลังจากที่ได้ไปฝึกฝนที่ชายแดนทางเหนือเป็นเวลาสองปี เธอก็ค่อยๆ สัมผัสได้ถึงความยิ่งใหญ่ของพระผู้เป็นเจ้า และความสำคัญในการดำรงอยู่ของศาสนจักร","เหล่าเทพเจ้านอกรีต พ่อมด และปีศาจร้ายต่างๆ ที่ข้ามประตูมิติมา ล้วนเป็นภัยคุกคามต่อความอยู่รอดของชาวเมืองในจักรวรรดิทั้งสิ้น ยิ่งไปกว่านั้น ก่อนที่ศาสนจักรจะก่อตั้งขึ้น ทั่วทั้งทวีปเต็มไปด้วยอาณาจักรน้อยใหญ่ที่ถูกเทพเจ้านอกรีตทำลายล้างจนย่อยยับ","อาจจะเป็นเพราะความเมตตาของพระผู้เป็นเจ้า ในช่วงเวลาที่สถานการณ์วิกฤตที่สุด เทพเจ้าก็ได้จุติลงมา!","เทพเจ้านอกรีตที่สร้างความเดือดร้อนไปทั่วทั้งทวีปถูกสังหารไปทีละคน อาณาจักรที่เคยกระจัดกระจายก็กลายเป็นอดีต จักรวรรดิอันยิ่งใหญ่ที่ไม่เคยมีมาก่อนได้ถูกก่อตั้งขึ้นที่ใจกลางของทวีป ชาวเมืองทุกคนต่างก็ได้รับการคุ้มครองภายใต้ความรุ่งโรจน์ของพระผู้เป็นเจ้า","ด้วยเหตุนี้เอง หลังจากที่ได้เห็นความวุ่นวายที่เกิดจากเทพเจ้านอกรีตและพวกพ่อมดที่ชายแดนทางเหนือ ความศรัทธาของไอวีน่าก็เริ่มหนักแน่นขึ้นเรื่อยๆ และเธอก็เชื่อมั่นมากขึ้นว่าพวกพ่อมดคือลูกสมุนของปีศาจร้าย คือตัวแทนของความชั่วร้าย และเป็นเป้าหมายที่ต้องถูกกวาดล้างให้สิ้นซาก","จนกระทั่งการเดินทางมายังเมืองน้ำมันดินในครั้งนี้ เมืองที่อยู่ภายใต้การปกครองของพวกพ่อมด ภาพทุกอย่างที่ได้เห็น กลับทำให้ไอวีน่าต้องตกอยู่ในความสับสนอีกครั้ง...","“ท่านคิดยังไงกับเมืองที่พวกพ่อมดปกครองเมืองนี้ล่ะ มอนโร?”","ไอวีน่ามองไปที่มอนโรที่กำลังสวดภาวนาอยู่ด้วยความสับสน และเอ่ยถามขึ้นมา","สำหรับครูฝึกของกองทัพทัณฑ์ศักดิ์สิทธิ์ผู้นี้ เด็กสาวรู้สึกเคารพเขาเป็นอย่างมาก ภารกิจในครั้งนี้ก็มีมอนโรเป็นผู้นำ ส่วนเธอก็มีหน้าที่แค่ทำตามคำสั่งเท่านั้น","หลังจากสารภาพบาปต่อพระผู้เป็นเจ้าอันยิ่งใหญ่ มอนโรก็ลืมตาขึ้น อารมณ์ของเขากลับมาสงบเยือกเย็นอีกครั้ง เขากล่าวด้วยสีหน้าเคร่งเครียดว่า","“ความเร็วในการสร้างอาวุธรูปแบบใหม่ของพวกพ่อมดนั้น เหนือความคาดหมายของข้าจริงๆ โดยเฉพาะสิ่งประดิษฐ์เล่นแร่แปรธาตุที่เรียกว่ารถไฟนั่น ข้าจะยอมให้พวกพ่อมดสร้างทางรถไฟได้สำเร็จอย่างง่ายดายไม่ได้เด็ดขาด...”","ไม่อย่างนั้นความเร็วในการรวบรวมกองทัพของอีกฝ่ายจะน่ากลัวมาก ในยามสงคราม พวกเขาก็สามารถระดมเสบียงจากที่ต่างๆ ได้อย่างรวดเร็วเช่นกัน","เขาจะต้องหาทางจัดตั้งกลุ่มผู้ศรัทธาภายในอาณาจักรเพื่อทำการก่อวินาศกรรมให้ได้","ในขณะที่มอนโรกำลังเค้นสมองคิดหาวิธีทำลายอาวุธสงครามของพวกพ่อมดอยู่นั้น ไอวีน่าก็เอ่ยขึ้นมาอย่างลังเลว่า","“ข้าหมายถึง เมืองน้ำมันดินแห่งนี้ ดูเหมือนจะแตกต่างไปจากที่เราคิดเอาไว้...”","ไม่มีการสังหารหมู่อย่างโหดเหี้ยม ไม่มีการกดขี่ข่มเหงอย่างทารุณ ในทางกลับกัน เมืองน้ำมันดินกลับดูเจริญรุ่งเรืองมาก ทั่วทั้งเมืองมีป้ายประกาศรับสมัครคนงานติดอยู่เต็มไปหมด ค่าแรงของคนงานทั่วไปอยู่ที่ห้าเหรียญเงิน และถ้าหากมีความรู้ทางด้านช่าง หรือโชคดีได้เข้าไปทำงานในโรงงานผลิต ก็จะได้รับค่าตอบแทนถึงเจ็ดถึงสิบห้าเหรียญเงินต่อเดือน","ค่าตอบแทนที่สูงลิ่วเช่นนี้ แม้แต่พ่อมดฝึกหัด หรือพ่อมดเต็มตัวหลายคนก็ยังรู้สึกสนใจ","ต้องรู้ก่อนว่า ปกติแล้วชาวเมืองที่อยู่บริเวณชายแดนทางเหนือของจักรวรรดิ ต้องทำงานหนักตลอดทั้งเดือน ถึงจะได้ค่าตอบแทนเพียงแค่หนึ่งถึงสองเหรียญเงินเท่านั้น ยิ่งไปกว่านั้น ยังต้องถูกเจ้าหน้าที่เก็บภาษี และพวกอันธพาลในพื้นที่รีดไถอีก ทำให้แค่จะกินให้อิ่มท้องก็ยังยากลำบากเลย","สิ่งที่ทำให้ไอวีน่ารู้สึกเหลือเชื่อมากที่สุดก็คือ พวกพ่อมดยังช่วยซ่อมแซมบ้านเรือนให้กับคนยากจนอีกด้วย ถ้าหากเธอไม่ได้เห็นด้วยตาตัวเอง เธอคงไม่มีทางเชื่อเลยว่า นี่คือการกระทำของลูกสมุนเทพเจ้านอกรีต","“เจ้าคิดง่ายเกินไปแล้วนะ ไอวีน่า บางทีสิ่งที่เจ้าเห็นด้วยตา อาจจะไม่ใช่ความจริงเสมอไปหรอก!”","มอนโรย่อมมองเห็นความสับสนของเด็กสาว เขาจึงเอ่ยอธิบายด้วยน้ำเสียงเยาะเย้ย","“ต้องยอมรับเลยว่า การสร้างภาพลักษณ์ภายนอกของพวกพ่อมดนั้นทำออกมาได้ดีมาก และมันก็สร้างความสับสนได้ดีทีเดียว น่าเสียดายที่พวกมันไม่มีความรู้เรื่องเศรษฐกิจ และยิ่งขาดประสบการณ์ในการบริหารจัดการ ขืนปล่อยให้เป็นแบบนี้ต่อไป สิ่งที่รอคอยอาณาจักรแห่งนี้อยู่ ก็คือความอดอยากครั้งใหญ่!”","ไอวีน่าชะงักไปเล็กน้อย เธอไม่ค่อยเข้าใจว่าทำไมจู่ๆ มอนโรถึงพูดแบบนี้","“เจ้าลองคิดดูสิ เมืองน้ำมันดินมีประชากรประมาณสองแสนคน สมมติว่ามีคนครึ่งหนึ่งไปเป็นคนงาน เพื่อช่วยพวกพ่อมดผลิตอาวุธสงครามต่างๆ นั่นหมายความว่าในหนึ่งเดือน พวกเขาจะต้องจ่ายเงินหลายพันเหรียญทองจักรวรรดิ และถ้าเป็นหนึ่งปี ก็จะเป็นเงินหลายหมื่นเหรียญทอง! นี่แค่เมืองเดียวนะ ถ้าขยายไปทั่วทั้งอาณาจักรล่ะ? พวกเขาจะต้องใช้เงินมากขนาดไหนกัน?”","มอนโรกล่าวพร้อมกับหัวเราะเยาะ","เขารู้ดีว่าพวกพ่อมดกำลังพยายามใช้เงินก้อนโต เพื่อซื้อความศรัทธาในใจของชาวเมือง จากสิ่งที่เขาได้ยินมา วิธีการนี้ก็ได้ผลดีในระดับหนึ่งเลยทีเดียว","แต่พวกพ่อมดจะไปเอาเงินมาจากไหนเยอะแยะขนาดนั้นล่ะ?!","ในช่วงแรก บางทีอาจจะพอประทังไปได้จากการปล้นชิงขุนนางในพื้นที่ แต่ในระยะยาวแล้ว มันเป็นไปไม่ได้อย่างแน่นอน","“ความจริงแล้ว สิ่งที่สำคัญที่สุดก็คือเสบียงอาหารต่างหาก!”","มอนโรกล่าวต่อด้วยสีหน้าเคร่งเครียด","พวกพ่อมดที่บ้าสงครามเหล่านี้ บังคับให้คนยากจนจำนวนมากเข้าไปทำงานในโรงงานผลิต ซึ่งนั่นจะทำให้ผลผลิตทางการเกษตรลดลงอย่างแน่นอน ในขณะที่ค่าแรงที่เพิ่มสูงขึ้น จะทำให้คนยากจนสามารถซื้อเสบียงอาหารได้มากขึ้น ส่งผลให้เสบียงอาหารถูกบริโภคเร็วขึ้นไปอีก","และเสบียงอาหารก็เป็นสิ่งที่ไม่เคยมีเพียงพออยู่แล้ว เมื่อมีคนกินเยอะขึ้น ก็ย่อมต้องมีคนกินน้อยลง!","ดังนั้น ตามการคาดการณ์ของมอนโร ภายใต้การบริหารจัดการที่ฟุ่มเฟือยและไร้ระเบียบของพวกพ่อมด ไม่เกินหนึ่งปี อาณาจักรแห่งนี้จะต้องล่มสลายอย่างแน่นอน และเมื่อถึงตอนนั้น ทั่วทั้งอาณาจักรก็จะเต็มไปด้วยความอดอยาก และมีคนหิวตายเกลื่อนถนน","ถึงตอนนั้น พวกพ่อมดก็จะถอดหน้ากากที่จอมปลอมออก และเผยให้เห็นถึงความชั่วร้ายที่แท้จริง","หลังจากที่ผลิตอาวุธสงครามออกมาได้มากพอแล้ว ประโยชน์เพียงอย่างเดียวของพวกคนยากจน ก็คือการถูกจับไปเป็นเครื่องสังเวย!","ไอวีน่าเข้าใจประเด็นของมอนโรได้อย่างรวดเร็ว การบริโภคที่เพิ่มขึ้นและการผลิตที่ลดลง ไม่ช้าก็เร็วจะต้องเกิดปัญหาขึ้นอย่างแน่นอน","เด็กสาวหันไปมองนอกหน้าต่าง พระอาทิตย์ยามเย็นได้ลับขอบฟ้าไปแล้ว แต่ทั่วทั้งเมืองกลับยังคงมีความเคลื่อนไหว ในสายตาของเธอ คนงานยังคงทำงานสร้างบ้านใหม่กันอย่างขะมักเขม้น ใบหน้าของพวกเขาเต็มไปด้วยความเหน็ดเหนื่อยและรอยยิ้ม บางทีพวกเขาอาจจะกำลังดีใจที่กำลังจะได้ย้ายเข้าบ้านใหม่ในเร็วๆ นี้","แต่ตามข้อสันนิษฐานของมอนโร ความเจริญรุ่งเรืองเช่นนี้ คงจะคงอยู่ได้อีกไม่นาน","ความมืดมิดในยามค่ำคืนเริ่มปกคลุม ทั่วทั้งเมืองค่อยๆ ถูกความมืดมิดกลืนกิน เหมือนกับอนาคตของมัน","แต่ทันใดนั้น แสงสว่างที่เจิดจ้าก็สว่างวาบขึ้นภายในเมือง จากนั้นแสงสว่างอันแสบตาก็เริ่มสาดส่องไปทั่วทุกซอกทุกมุมของเมือง ขับไล่ความมืดมิดที่อยู่รอบๆ ให้หายไป","ในตอนนั้นเองไอวีน่าถึงเพิ่งค้นพบว่า สิ่งที่เปล่งประกายอยู่นั้นไม่ใช่ดวงดาว แต่เป็นเสาไฟถนนแต่ละต้นต่างหาก","ที่แท้พวกพ่อมดก็ไม่ได้โกหก กลางคืนในเมืองน้ำมันดิน สว่างไสวเหมือนกับตอนกลางวันจริงๆ!","...","ห่างออกไปหลายร้อยเมตร ภายในห้องทดลองเวทมนตร์แห่งหนึ่ง ลินน์กำลังตวัดปากกาขนนกในมืออย่างไม่หยุดพัก เขาเขียนสูตรสมการลงบนกระดาษร่างแผ่นแล้วแผ่นเล่า บนพื้นห้องเต็มไปด้วยเศษกระดาษร่างที่เขียนผิดจนเต็มไปหมด ทำให้เดลที่เปิดประตูเข้ามาแทบจะไม่มีที่ให้ยืนเลย","เดลค่อยๆ ขยับตัวอย่างระมัดระวัง เขาไม่กล้าทำลายหรือเหยียบย่ำลงบนกระดาษร่างที่มีสูตรสมการเขียนอยู่เต็มไปหมดเหล่านี้","เขารู้ดีว่าท่านปรมาจารย์ลินน์ขลุกตัวอยู่ในห้องทดลองแห่งนี้มาสี่วันเต็มๆ แล้ว แม้จะไม่มีใครรู้ว่าดาวรุ่งแห่งเวทมนตร์ท่านนี้กำลังทำอะไรอยู่ แต่มันจะต้องเป็นงานวิจัยเวทมนตร์ที่สำคัญมากอย่างแน่นอน!","ดังนั้น นอกจากการส่งอาหารตามปกติ และเรื่องที่สำคัญมากๆ แล้ว ก็ไม่มีใครกล้าเข้ามาขัดจังหวะเลย","เดลเองก็ไม่กล้าขัดจังหวะความคิดของดาวรุ่งแห่งเวทมนตร์ท่านนี้เช่นกัน เมื่อเข้ามาในห้อง เขาก็ถือรายงานเอาไว้ในมือ และรอให้อีกฝ่ายทำงานเสร็จอย่างเงียบๆ แต่ด้วยความอยากรู้อยากเห็นที่พุ่งปรี๊ด เดลจึงแอบเหลือบมองกระดาษร่างที่วางอยู่บนโต๊ะ สมการที่ซับซ้อนบนนั้น ทำให้เขารู้สึกตาลายและเวียนหัวขึ้นมาทันที","ผ่านไปประมาณสิบนาที ลินน์ก็เขียนสัญลักษณ์ตัวสุดท้ายลงบนกระดาษ ก่อนจะถอนหายใจออกมาอย่างโล่งอก ร่างกายของเขาผ่อนคลายลงอย่างเห็นได้ชัด ในที่สุดสมการแปรสภาพพลังเวทของเขาก็เสร็จสมบูรณ์เสียที!","ซึ่งต้องยกความดีความชอบให้กับไอน์สไตน์ ที่การอนุมานสมการพลังงานของเขา ได้มอบแรงบันดาลใจให้กับลินน์มากมาย ไม่อย่างนั้นลำพังตัวเขาเอง อย่าว่าแต่สี่วันเลย ต่อให้เป็นหลายเดือนก็อาจจะยังคิดไม่ออกด้วยซ้ำ","นี่คือความรู้สึกของการได้ยืนอยู่บนไหล่ของยักษ์ใหญ่งั้นรึ?","โคตรจะสะใจเลย!","หลังจากนี้ เขาก็แค่ต้องรวบรวมเชื้อเพลิงนิวเคลียร์ให้ได้มากพอ ก็จะสามารถเริ่มต้นสร้างเตาปฏิกรณ์นิวเคลียร์ฟิวชัน และเตรียมพร้อมสำหรับพิธีเลื่อนขั้นระดับตำนานได้แล้ว!","น่าเสียดายที่เขาเพิ่งจะเลื่อนขั้นเป็นจอมเวทระดับห้าวงแหวนมาได้ไม่นาน จึงยังไม่เข้าเกณฑ์การเป็นพ่อมดระดับตำนาน","แต่นี่ก็ไม่ได้มีแต่ข้อเสียไปซะหมด ในเมื่อพิธีเลื่อนขั้นระดับตำนานนี้มีความเสี่ยงสูงมาก และเขาก็ยังไม่มีความมั่นใจเต็มร้อย พอดีเลย ให้คนอื่นเป็นหนูทดลองไปก่อนก็แล้วกัน"]},{"n":457,"t":"ตำนานโดยกำเนิด สัตว์ร้ายขนาดยักษ์ที่กลืนกินทุกสิ่ง!","c":["ลินน์กำลังครุ่นคิดอยู่ในใจ ว่าเตาปฏิกรณ์นิวเคลียร์ฟิวชันควรจะใช้วิธีการควบคุมแบบไหนดี ผ่านไปครู่ใหญ่ เขาก็เพิ่งจะสังเกตเห็นว่าเดลยืนรออยู่ข้างๆ ตลอดเวลา","เมื่อเห็นว่าดาวรุ่งแห่งเวทมนตร์ผู้นี้ ได้หลุดออกจากภวังค์ความคิดแล้ว เดลก็รีบเอ่ยรายงานขึ้นมาทันที","“ท่านปรมาจารย์ พ่อมดจากทางตะวันตกของจักรวรรดิที่ถูกศาสนจักรไล่ล่า ได้เดินทางมาถึงเมืองน้ำมันดินอย่างปลอดภัยแล้วครับ”","“นี่คือข้อมูลของคนบางส่วนที่พวกเราต้องจับตามองเป็นพิเศษครับ!”","เดลกล่าวพร้อมกับยื่นรายชื่อแผ่นหนึ่งส่งให้","ลินน์ยื่นมือไปรับมา บนนั้นมีรายชื่อคนจำนวนหนึ่งเขียนเอาไว้ และมีชื่อของคนประมาณยี่สิบคน ที่ถูกทำเครื่องหมายสีเหลืองหรือสีแดงเอาไว้","แม้ว่าสภาเวทมนตร์จะครอบครองวิธีการตรวจสอบพลังศักดิ์สิทธิ์ เพื่อให้แน่ใจว่าคนที่เข้ามาในเมืองน้ำมันดินจะเป็นพ่อมดอย่างแน่นอนมาตั้งนานแล้ว แต่ลินน์ก็ไม่มีทางประมาท ‘เพื่อนร่วมเผ่าพันธุ์’ เหล่านี้อย่างเด็ดขาด","เมื่อประมาณสองปีก่อน ภัยพิบัติที่เกิดจากพ่อมดชั่วร้ายเมิร์คในดินแดนพ่อมด ยังคงแจ่มชัดอยู่ในความทรงจำ ต้นเหตุของเรื่องทั้งหมดนี้ เกิดจากพระคาร์ดินัลคนหนึ่งที่ใช้วิธีการย้ายร่าง โดยปลอมตัวเป็นพ่อมดและแฝงตัวเข้ามา","เมื่อมีบทเรียนจากเรื่องนี้แล้ว สภาเวทมนตร์ก็ย่อมต้องป้องกันเอาไว้ ดังนั้น ตามข้อเสนอของลินน์ พวกเขาจึงเพิ่มการทดสอบเล็กๆ น้อยๆ เข้าไป โดยให้พ่อมดพลังจิตวิญญาณแอบใช้เวทมนตร์ตรวจสอบความผันผวนทางอารมณ์ และบรรดาพ่อมดที่มีปฏิกิริยารุนแรง ในระหว่างที่อ่านข้อความบนกระดาษ ก็จะถูกจัดให้เป็นเป้าหมายที่ต้องสงสัย","เพราะยิ่งเป็นผู้ศรัทธาที่เคร่งศาสนามากเท่าไหร่ ก็ยิ่งรู้สึกโกรธเกรี้ยวกับข้อความด่าทอบนกระดาษมากขึ้นเท่านั้น ไม่ต้องพูดถึงเลยว่าพวกเขาจะต้องเป็นคนอ่านมันออกมาด้วยตัวเอง","แต่วิธีการนี้ก็ไม่ได้แม่นยำร้อยเปอร์เซ็นต์ เพราะยังไงเสีย เทพเจ้าจอมปลอมองค์นั้นก็มีอิทธิพลอย่างมากในจักรวรรดิ พ่อมดและบรรดาพ่อมดฝึกหัดบางคนในจักรวรรดิถึงกับไม่กล้าเอ่ยพระนามของอีกฝ่ายด้วยซ้ำ และก็มีบางคนที่ไม่กล้าพูดออกมาเพราะความหวาดกลัวอย่างรุนแรง ดังนั้น วิธีการนี้จึงใช้เป็นเพียงแค่ข้อมูลอ้างอิง เพื่อคัดกรองเป้าหมายที่น่าสงสัยออกมาเท่านั้น","สายตาของลินน์กวาดมองไปบนรายชื่ออย่างรวดเร็ว และเขาก็รู้สึกประหลาดใจเป็นอย่างมาก ที่ได้เห็นชื่อที่คุ้นเคยอยู่บนนั้น เขาชะงักไปเล็กน้อย และมีร่องรอยของความประหลาดใจปรากฏขึ้นบนใบหน้า","“ไอวีน่า...”","ลินน์พึมพำออกมาเบาๆ","“ท่านลินน์ นางเป็นคนรู้จักของท่านงั้นรึครับ?”","เดลเอ่ยถามอย่างระมัดระวัง","เขาย่อมรู้ดีว่า ก่อนที่ดาวรุ่งแห่งเวทมนตร์ผู้นี้จะเดินทางมาถึงดินแดนพ่อมด เขาเคยทำกิจกรรมอยู่ในจักรวรรดิมาก่อน การจะมีคนรู้จักเก่าสักสองสามคนก็เป็นเรื่องปกติ","อายุและหน้าตาที่ไม่ธรรมดาของอีกฝ่าย ทำให้เดลเกิดข้อสันนิษฐานแปลกๆ ขึ้นมาในใจ","“ก็คงจะใช่”","ลินน์พยักหน้า ลำพังแค่ชื่อเขายังไม่สามารถยืนยันได้ แต่ในเมื่อทั้งอายุและสีผมก็ตรงกัน งั้นแปดในสิบส่วนก็คงจะเป็นคนที่เขารู้จักนั่นแหละ","ตอนที่เพิ่งทะลุมิติมาใหม่ๆ เพื่อลอบเข้าไปในเมืองท่าเรือ และตามหาลอดด์ขาเป๋ที่หลบซ่อนตัวอยู่ เพื่อให้ได้ตั๋วเรือสำหรับเดินทางไปยังดินแดนพ่อมด เขาจึงจำเป็นต้องยืมตัวตนของลอธ เปโดร พี่ชายของอีกฝ่ายมาใช้","แต่สุดท้าย เขาก็หาคนไม่พบ ซ้ำยังถูกพ่อบ้านจับได้คาหนังคาเขา จนถูกบังคับให้เข้าไปในคฤหาสน์ของเปโดร","โชคดีที่ความสัมพันธ์ภายในครอบครัวขุนนางที่ตกต่ำตระกูลนี้ค่อนข้างซับซ้อน หรือจะใช้คำว่าบิดเบี้ยวมาอธิบายก็ได้ บารอนเปโดรหมกมุ่นอยู่กับการแสวงหาอำนาจ แม้ภายนอกจะดูเหมือนว่าเขาสนใจและห่วงใยลูกชายลูกสาวของตนเอง แต่ความจริงแล้ว เขากลับมองว่าทั้งสองคนเป็นเพียงเครื่องมือในการเลื่อนขั้นและฟื้นฟูตระกูลเท่านั้น","ส่วนไอวีน่าผู้เป็นน้องสาว ก็ยิ่งมีความรู้สึกอิจฉาริษยาและเกลียดชังลอธผสมปนเปกันไป","ลินน์ยังจำได้ว่า ก่อนที่เขาจะข้ามทะเลและจากเมืองท่าเรือไป เพื่อเป็นการตอบแทนที่ยืมตัวตนของลอธมาใช้ เขาได้สั่งสอนไอวีน่าไปชุดใหญ่ โดยหวังว่าจะสามารถทำลายความสัมพันธ์ในครอบครัวที่บิดเบี้ยวนี้ได้"," ่งขนาดไหน ถึงจะสามารถกัดหัวของมันจนขาด และกลืนกินลงไปได้!","เมื่อต้องเผชิญหน้ากับศัตรูแบบนี้ จอมเวทผู้ยิ่งใหญ่ทั้งหลายต่างก็รู้สึกหวาดหวั่นอยู่ในใจ","โชคดีที่ลินน์เดินทางมาถึงได้ทันเวลา ทำให้ราฟาเอลและคนอื่นๆ มีความมั่นใจมากขึ้น!","หลังจากที่มีการร่ายเวทมนตร์ระเบิดนิวเคลียร์ ในสายตาของพ่อมดจำนวนไม่น้อย ดาวรุ่งแห่งเวทมนตร์ผู้นี้ก็ได้ก้าวขึ้นเป็นผู้ที่มีพลังรบสูงสุดของสภาเวทมนตร์ไปแล้ว!","แตกต่างจากราฟาเอลและคนอื่นๆ ที่มีความมั่นใจอย่างเต็มเปี่ยม ลินน์เองก็ไม่แน่ใจเหมือนกันว่าเขาจะสามารถรับมือกับมันได้หรือไม่","ในความทรงจำของเขา สัตว์ประหลาดที่สามารถกลืนกินเชื้อเพลิงนิวเคลียร์ได้ มีอยู่แค่ในจินตนาการจากภาพยนตร์เก่าๆ ในชาติก่อนเท่านั้น","รู้สึกว่าจะชื่อ...ก็อตซิลล่างั้นรึ?","แต่ภูเขาเหมืองแร่ลูกนี้ เห็นได้ชัดว่าไม่น่าจะยัดสัตว์ประหลาดตัวใหญ่ขนาดนั้นเข้าไปได้...","ภายใต้คำเชิญอันกระตือรือร้นของราฟาเอลและคนอื่นๆ ในที่สุดลินน์ก็ตอบตกลงเข้าร่วมปฏิบัติการจับกุมในครั้งนี้ ถ้าหากเขารีบขอความช่วยเหลือตั้งแต่ยังไม่ทันได้เห็นหน้าอีกฝ่ายเลย มันก็คงจะดูไม่สมเหตุสมผลเท่าไหร่นัก","ถึงแม้ว่าการจับกุมในครั้งนี้จะล้มเหลว แต่อย่างน้อยเขาก็สามารถตรวจสอบที่มาที่ไปของอีกฝ่ายได้","...","การวางกับดักใช้เวลาประมาณหนึ่งช่วงเช้า โดยวิธีการของราฟาเอลนั้นเรียบง่ายมาก นั่นก็คือการให้คนงานเหมืองเข้าไปในส่วนลึกของถ้ำเหมืองแร่ และลงมือขุดแร่ต่อไปเหมือนกับที่เคยทำ","มีเพียงสิ่งเดียวที่แตกต่างออกไป ก็คือมีมิธริลที่เต็มไปด้วยพลังเวทมนตร์ถูกวางเอาไว้ข้างๆ พวกเขาเป็นจำนวนมาก","นี่เป็นการตอบสนองต่อสองเงื่อนไขที่พวกเขาคาดเดาเอาไว้ ว่าเป็นสาเหตุของการโจมตีในครั้งก่อน...","นั่นก็คืออาหารชั้นดี และอาณาเขตถูกบุกรุก!","“ข้าว่านะ ทำแบบนี้มันจะไม่ชัดเจนไปหน่อยงั้นรึ?”","ลินน์ที่กำลังใช้เวทมนตร์พรางตัวหลบซ่อนอยู่ตรงมุมถ้ำ เหลือบมองไปที่อักษรรูนเล่นแร่แปรธาตุที่เห็นได้อย่างชัดเจนบนเพดานและพื้นถ้ำ ก่อนจะอดไม่ได้ที่จะเอ่ยถามขึ้นมา","“น่าจะไม่มีปัญหาอะไรนะ ตราบใดที่ยังไม่ได้เปิดใช้งาน มันก็จะไม่มีความผันผวนของพลังเวทมนตร์”","ราฟาเอลกล่าวอย่างมั่นใจ เขาไม่คิดว่าสัตว์เวทมนตร์โง่เขลาพวกนั้น จะสามารถเข้าใจความหมายของอักษรรูนได้หรอก","ลินน์ส่ายหน้าและไม่ได้พูดอะไรอีก แต่เขาหันไปให้ความสนใจกับคนงานเหมืองเหล่านี้แทน","เห็นได้ชัดว่าเหยื่อล่อเหล่านี้รู้ตัวว่าพวกเขากำลังตกอยู่ในอันตราย แม้ว่าการขุดแร่จะไม่ได้หยุดลง แต่ขาทั้งสองข้างของพวกเขาก็สั่นเทาอย่างเห็นได้ชัด","แต่ลินน์ก็ไม่ได้รู้สึกเห็นใจพวกเขาเลย เพราะคนที่จะถูกส่งมาขุดแร่ยูเรเนียมที่นี่ได้ มีเพียงแค่สองประเภทเท่านั้น หากไม่ใช่พวกลูกหลานขุนนางที่ชื่นชอบการกดขี่ข่มเหงคนยากจนในยามปกติ ก็เป็นนักโทษอุกฉกรรจ์ที่ต้องโทษประหารชีวิต","ในเมื่อพวกเขาเข้ามาที่นี่แล้ว เพื่อเป็นการป้องกันไม่ให้ข้อมูลรั่วไหล พวกเขาก็ย่อมไม่มีโอกาสได้ออกไปอีก การต้องเผชิญกับกัมมันตภาพรังสีในระหว่างที่ขุดแร่ยูเรเนียม ก็ถือเป็นการลงโทษอีกรูปแบบหนึ่ง","ส่วนบรรดาผู้ศรัทธาที่เคร่งศาสนาที่ถูกจับกุมตัวมาได้ ลินน์นั้นไม่กล้าปล่อยให้พวกเขาเข้ามาใกล้ที่นี่เลย เพราะวิญญาณของคนเหล่านี้ จะต้อง ‘ขึ้นสวรรค์’ หลังจากที่ตายไป ซึ่งนั่นก็เท่ากับเป็นการส่งข้อมูลไปให้เอลา โดยเปล่าประโยชน์ ดังนั้น เขาจึงโยนคนพวกนั้นไปสร้างถนนให้หมด!","ลินน์ ราฟาเอล อารัด และซานเชซทำเพียงแค่เฝ้ารออยู่อย่างเงียบๆ เสียงเครื่องจักรดังก้องกังวานอยู่ในหูอย่างต่อเนื่อง นั่นคือเสียงที่เกิดจากเครื่องเจาะในมือของคนงานเหมือง","แต่ผ่านไปสิบชั่วโมงแล้ว พวกเขาก็ยังไม่พบกับการโจมตีที่ว่าเลย","“หรือว่ามันจะกินอิ่มแล้ว?”","อารัดที่เริ่มจะหมดความอดทน อดไม่ได้ที่จะคาดเดาออกมา","ราฟาเอลเองก็เริ่มไม่แน่ใจแล้วเหมือนกัน ว่าการจัดเตรียมของตนเองมีปัญหาอะไรตรงไหนหรือเปล่า","ในขณะที่ทุกคนกำลังครุ่นคิดอยู่ว่า ควรจะให้คนงานเหมืองหยุดพัก และค่อยกลับมาลองใหม่ในวันพรุ่งนี้ดีหรือไม่ ลินน์ก็เอ่ยขึ้นมาอย่างกะทันหัน","“มันน่าจะมาแล้วล่ะ”","“อยู่ไหนล่ะ?”","ราฟาเอลรีบเอ่ยถามในทันที","ลินน์ไม่ได้ตอบกลับไป เพราะเขาเองก็ไม่รู้เหมือนกัน แต่ความรู้สึกถูกคุกคามอย่างเลือนรางกำลังก่อตัวขึ้นในใจของเขา","ในตอนที่คนงานเหมืองกำลังจะขนแร่ยูเรเนียมที่ขุดได้ขึ้นรถบรรทุกและเตรียมจะจากไป ลำแสงสีฟ้าครามก็พุ่งวาบผ่านเข้ามา ราวกับว่าโลกทั้งใบถูกฉีกขาดออกเป็นสองซีก เลือดสีแดงฉานสาดกระเซ็นออกมา ในพริบตาเดียว คนงานเหมืองทั้งห้าคน รวมไปถึงรถบรรทุกแร่ ก็ถูกฉีกออกเป็นชิ้นๆ ...","ช่างเป็นความเร็วที่น่าเหลือเชื่อจริงๆ...","ราฟาเอลและคนอื่นๆ ต่างก็รู้สึกเย็นยะเยือกขึ้นมาในใจ ลินน์เองก็ได้เห็นรูปร่างหน้าตาที่แท้จริงของสัตว์เวทมนตร์ตัวนี้อย่างชัดเจน มันมีความสูงประมาณสองเมตรกว่า ทั่วทั้งร่างเป็นสีฟ้าคราม รูปร่างภายนอกดูเหมือนสัตว์ร้าย ผิวหนังของมันไหลเวียนไปมาราวกับเปลวเพลิง...","ไม่สิ ใช้คำว่าผิวหนังคงจะไม่ถูกต้องนัก เพราะมันไม่มีเลือดเนื้อเลย ร่างกายของมันก่อตัวขึ้นจากพลังงานบริสุทธิ์ มันเป็นสิ่งมีชีวิตที่มีพลังงานบริสุทธิ์ หรือจะเรียกว่าสิ่งมีชีวิตธาตุบริสุทธิ์ แบบที่เขาไม่เคยพบเห็นมาก่อนเลย...","สิ่งมีชีวิตระดับตำนานแต่กำเนิดงั้นรึ?!","ลินน์เกิดความคิดที่จะวิ่งหนีขึ้นมาในใจแล้ว..."]},{"n":458,"t":"เปลวเพลิงอมตะที่ลุกโชน และลมหายใจปรมาณูอันน่าสะพรึงกลัว","c":["เช่นเดียวกับลินน์ ราฟาเอลและคนอื่นๆ ต่างก็ประหลาดใจกับโครงสร้างร่างกายอันเป็นเอกลักษณ์ของสัตว์เวทมนตร์ตัวนี้ จึงไม่ได้ลงมือบุ่มบ่าม","สัตว์เวทมนตร์รูปร่างประหลาดตัวนี้ ก็ดูเหมือนจะไม่สังเกตเห็นพวกเขาเช่นกัน หลังจากที่ฆ่าคนงานเหมืองที่กำลังขุดแร่ไปแล้ว มันก็กลืนแร่ยูเรเนียมทั้งคันรถลงไปในคำเดียว","ไม่ผิดหรอก คำเดียวหมดคันรถเลย!","เนื่องจากมันไม่มีข้อจำกัดทางด้านร่างกายและกระดูก ปากของมันจึงสามารถขยายออกได้อย่างไร้ขีดจำกัด และภายในร่างกายของมัน ก็เปรียบเสมือนเตาหลอมที่มีอุณหภูมิสูงลิ่ว ซึ่งสามารถย่อยสลายแร่ยูเรเนียมที่กลืนลงไปได้อย่างรวดเร็ว","ภาพที่เห็น ทำให้ลินน์และคนอื่นๆ รู้สึกขนลุกซู่ไปทั้งตัว","นี่มันตัวประหลาดอะไรกันเนี่ย!","ราฟาเอลตกอยู่ในสถานการณ์ที่กลืนไม่เข้าคายไม่ออกทันที ว่าควรจะลงมือหรือไม่ลงมือดี","ตอนนี้คือช่วงเวลาที่ดีที่สุดอย่างไม่ต้องสงสัย แม้ว่ารูปแบบการดำรงอยู่ของอีกฝ่าย จะแตกต่างจากสิ่งมีชีวิตทั่วไป แต่จากแร่ยูเรเนียมที่มองเห็นลางๆ อยู่ในท้องของมัน ตอนนี้มันน่าจะกินอิ่มและอยู่ในช่วงของการย่อยอาหาร พลังรบของมันจะต้องลดลงอย่างแน่นอน","โอกาสเกิดขึ้นเพียงแค่ชั่วพริบตา เมื่อเห็นว่ามันกินแร่ยูเรเนียม และมิธริลที่เป็นเหยื่อล่อจนหมด และกำลังจะจากไป ราฟาเอลก็ตัดสินใจอย่างเด็ดขาด เขาเปิดใช้งานกับดักที่วางเอาไว้ล่วงหน้าในทันที","“ผนึก!”","ราฟาเอลเอามือขวาแตะลงบนพื้น พร้อมกับตวาดเสียงต่ำ ในชั่วพริบตา อักษรรูนเล่นแร่แปรธาตุที่กระจายอยู่บนพื้น กำแพง และเพดาน ก็พุ่งเข้ามาราวกับโซ่ตรวน ปิดกั้นพื้นที่รอบๆ เอาไว้จนหมด","แม้ว่าทักษะการเล่นแร่แปรธาตุของเขาจะยังห่างชั้นกับวิกโตริโอมาก แต่ในหมู่จอมเวทผู้ยิ่งใหญ่ เขาก็ถือว่าอยู่ในระดับแนวหน้าแล้ว!","ด้วยการจัดเตรียมล่วงหน้า พลังของมันแทบจะเทียบเท่ากับเวทมนตร์หกวงแหวนระดับสูงสุดเลยทีเดียว!","โซ่ตรวนที่ส่องแสงเรืองรอง พันธนาการไปที่แขนขาและลำคอของร่างเงาสัตว์ร้ายอย่างรวดเร็ว วงแล้ววงเล่า รัดมันเอาไว้อย่างแน่นหนา","แต่สีหน้าของราฟาเอลไม่ได้ผ่อนคลายลงเลยแม้แต่น้อย ในทางกลับกัน เขากลับมีสีหน้าเคร่งเครียดมากขึ้น เพราะเขาสัมผัสได้ว่า ในวินาทีที่โซ่รูนสัมผัสกับอีกฝ่าย พลังของมันก็ลดลงอย่างรวดเร็ว!","“เร็วเข้า ลงมือเลย! ข้าผนึกมันไว้ได้ไม่นานหรอก!”","ราฟาเอลกัดฟันคำรามเสียงต่ำ","ความจริงแล้ว ไม่ต้องให้เขาเตือน อารัดและซานเชซก็สัมผัสได้ถึงแรงกดดันจากร่างเงาสัตว์ร้ายสีฟ้าครามตรงหน้าแล้ว","ร่างกายของซานเชซบิดเบี้ยวไปมา และภายในเวลาเพียงแค่สามวินาที เขาก็กลายร่างเป็นสัตว์ประหลาดขนาดยักษ์ที่มีความสูงถึงห้าเมตร","ในขณะเดียวกัน ลูกไฟที่ร้อนระอุก็ปรากฏขึ้นบนฝ่ามือของอารัด","เปลวไฟในสถานะพลาสมาพวยพุ่งออกมาอย่างต่อเนื่อง อุณหภูมิของมันสูงเกือบหนึ่งหมื่นองศาเซลเซียส ซึ่งเป็นหนึ่งจุดห้าเท่าของอุณหภูมิพื้นผิวของดวงอาทิตย์!","ชื่อของมันคือ เปลวเพลิงนิรันดร์!","แต่ลินน์กลับไม่ได้ลงมือบุ่มบ่ามเหมือนกับทั้งสองคน สายตาของเขาจับจ้องไปที่ร่างเงาสัตว์ร้ายสีฟ้าครามตัวนั้นตลอดเวลา ซึ่งเขากลับมองเห็นแววตาเยาะเย้ยปรากฏอยู่บนใบหน้าของอีกฝ่าย","จนกระทั่งตอนนี้ เขาถึงเพิ่งตระหนักได้ว่า สัตว์เวทมนตร์รูปร่างประหลาดตัวนี้ ไม่ได้รู้สึกหวาดกลัว วิตกกังวล หรือประหลาดใจกับการปรากฏตัวของพวกเขา และโซ่รูนเลยแม้แต่น้อย และเมื่อนึกถึงความรู้สึกถึงอันตรายที่ปรากฏขึ้นมาลางๆ ในใจก่อนหน้านี้ ลินน์ก็อดไม่ได้ที่จะเกิดข้อสันนิษฐานที่ไร้สาระขึ้นมาอย่างหนึ่ง","เวทมนตร์พรางตัวที่พวกเขาสร้างขึ้น ไม่สามารถหลอกตาอีกฝ่ายได้เลย","สัตว์เวทมนตร์ตรงหน้านี้ รู้ทั้งรู้ว่ามันเป็นกับดัก แต่ก็ยังจงใจเดินเข้ามา!","บางทีอาจจะเป็นเพราะว่า มันหมกตัวอยู่ในถ้ำเหมืองแร่มานานเกินไป ก็เลยอยากจะหาเรื่องสนุกๆ ทำ...","หรือไม่อีกฝ่ายก็อาจจะคิดว่า พวกเขาไม่สามารถเป็นภัยคุกคามต่อมันได้เลย!","โฮก~","เสียงคำรามดังกึกก้องไปทั่วทั้งถ้ำเหมืองแร่ คลื่นเสียงที่รุนแรงสะท้อนไปมาในพื้นที่แคบๆ โซ่รูนที่พันธนาการอยู่รอบตัวของมัน ก็แตกสลายไปในชั่วพริบตา!","ไม่เพียงเท่านั้น คลื่นเสียงยังคงแพร่กระจายออกไปด้วยความเร็วสูง กำแพงถ้ำทั้งสี่ด้านพังทลายลงมาเป็นชั้นๆ แม้แต่ศพที่แหลกเหลวบนพื้นก็ยังถูกแรงสั่นสะเทือนจนกระจุยกระจาย!","โชคดีที่ทุกคนในที่นี้ ล้วนเป็นจอมเวทผู้ยิ่งใหญ่ที่สามารถสร้างอาณาเขตเวทมนตร์ได้ เมื่อคลื่นเสียงปะทะเข้ากับอาณาเขตของพวกเขา มันก็ถูกลดทอนความรุนแรงลงไปมากกว่าสิบเท่าในทันที แต่ถึงอย่างนั้น มันก็เกือบจะทำให้แก้วหูของลินน์และคนอื่นๆ ขาดอยู่ดี","ในวินาทีต่อมา สัตว์ร้ายตัวนี้ก็กลายเป็นลำแสง และพุ่งตรงมาที่พวกเขาทั้งสามคน ภายใต้สายตาที่ไม่อยากจะเชื่อของอารัด มันอ้าปากกว้าง และกลืนเปลวเพลิงนิรันดร์ เวทมนตร์หกวงแหวนของเขาลงไปดื้อๆ","“นี่มันเป็นไปไม่ได้?!”","อารัดเบิกตากว้าง","เปลวเพลิงนิรันดร์เป็นเวทมนตร์ที่เขาสร้างขึ้นมา โดยอ้างอิงจากทฤษฎีสสารในสถานะพลาสมาของลินน์ ซึ่งอุณหภูมิของมันก็สูงมากจนสามารถหลอมละลายเหล็กกล้าได้ในชั่วพริบตา แต่ตอนนี้มันกลับถูกคน...ไม่สิ...ถูกสัตว์ประหลาดกลืนกินลงไปเนี่ยนะ","นี่มันไม่เป็นเวทมนตร์เอาเสียเลย!","ไม่ว่าอารัดจะเบิกตากว้างแค่ไหน เขาก็ไม่สามารถเปลี่ยนแปลงความจริงได้ ร่างเงาสัตว์ร้ายสีฟ้าครามก็เหมือนกับตอนที่มันกลืนกินแร่ยูเรเนียมเข้าไปก่อนหน้านี้ มันกลืนกินเวทมนตร์ไฟที่มีอุณหภูมิสูงลิ่วลงไปได้อย่างง่ายดาย หน้าท้องของมันป่องขึ้นมาอย่างเห็นได้ชัด ก่อนจะเริ่มกลับคืนสู่สภาพเดิม","“ระเบิด!”","ในตอนนั้นเอง ราฟาเอลก็เอ่ยขึ้นมากะทันหัน","หน้าท้องของร่างเงาสัตว์ร้ายที่เพิ่งจะยุบลงไป กลับพองขึ้นมาอีกครั้ง มันป่องขึ้นมาเหมือนกับลูกบอลลูกหนึ่ง ที่แท้มิธริลที่มันกลืนกินเข้าไปก่อนหน้านี้ ก็ระเบิดขึ้นในท้องของมัน!","นี่คือกับดักที่สองที่ราฟาเอลวางเอาไว้ มิธริลทุกชิ้นที่มันกลืนกินเข้าไป ล้วนถูกสลักเวทมนตร์จุดระเบิดเอาไว้ทั้งหมด!","โชคดีที่เขาเดิมพันถูก!","สัตว์ร้ายขนาดยักษ์ตัวนี้ แม้ว่ามันจะกินได้ทุกอย่าง แต่การจะย่อยสลายมันให้หมด ก็ไม่ใช่สิ่งที่จะสามารถทำได้ในเวลาอันสั้นอย่างแน่นอน!","แต่แม้จะถูกโจมตีอย่างหนักหน่วงเช่นนี้ ร่างเงาสัตว์ร้ายกลับไม่ได้รับผลกระทบอะไรมากมายนัก หน้าท้องที่ป่องออกมาของมัน กลับคืนสู่สภาพเดิมภายในเวลาไม่ถึงหนึ่งวินาที","แต่การเปลี่ยนแปลงทางร่างกาย ก็ทำให้การเคลื่อนไหวของมันชะงักไปเล็กน้อย!","ลินน์จับช่องโหว่เพียงชั่วพริบตานี้เอาไว้ได้อย่างเฉียบแหลม ลำแสงเลเซอร์อันแหลมคมถูกยิงออกไปในทันที!","ความเร็วของแสง ทำให้แม้แต่ร่างเงาสัตว์ร้ายที่น่าสะพรึงกลัวก็ยังไม่สามารถหลบหลีกได้ทัน ในวินาทีที่ลำแสงพาดผ่าน ร่างของมันก็ถูกตัดขาดออกเป็นสองท่อน!","ช้าไปนิดนึง...","ลินน์แอบเสียดายอยู่ในใจ ถ้าหากเขาสามารถตัดร่างของมันให้ขาดออกจากกันได้ ในตอนที่พลังงานระเบิดออกมา เขาก็อาจจะอาศัยแรงกระแทกอันน่าสะพรึงกลัวจากภายใน เพื่อทำให้มันได้รับบาดเจ็บสาหัสได้!","เพียงแต่การชาร์จพลังของลำแสงเลเซอร์นั้นจำเป็นต้องใช้เวลา แม้ว่าเขาจะใช้ความเร็วสูงสุดแล้ว แต่ก็ยังช้าไป 0.5 วินาทีอยู่ดี!","เป็นไปตามที่ลินน์คาดคิดเอาไว้ ร่างเงาสัตว์ร้ายที่ถูกตัดขาดครึ่งตัวไม่ได้ตายลง รอยตัดตรงกลางค่อยๆ เคลื่อนตัวเข้าหากันช้าๆ ราวกับผิวน้ำที่ถูกแยกออกจากกัน","เมื่อปราศจากข้อจำกัดทางด้านร่างกายและเลือดเนื้อ ร่างเงาสัตว์ร้ายก็แสดงให้เห็นถึงความสามารถในการเป็นอมตะ ที่คล้ายคลึงกับเอ็ดเวลและสตรีศักดิ์สิทธิ์ลูเซีย","ในเมื่อชอบกินทุกอย่างขนาดนี้ งั้นลองกินเจ้านี่ดูหน่อยเป็นไงล่ะ?","ความคิดหนึ่งผุดขึ้นมาในใจของลินน์ เขายกมือขวาขึ้นมาไว้ตรงหน้า เปลวไฟที่ร้อนระอุพวยพุ่งออกมาจากฝ่ามือ จากนั้นก็ขยายตัวและแผ่ขยายออกไปอย่างรวดเร็ว...","เปลวไฟเผาไหม้กำแพงถ้ำและก้อนหิน ก่อนจะพุ่งตรงไปม้วนตัวเข้าหาร่างเงาสัตว์ร้าย!","นี่คือเวทมนตร์ห้าวงแหวน...เพลิงอมตะ!","“ไฟน่าจะทำอะไรมันไม่ได้นะ ท่านลินน์!”","อารัดรีบเอ่ยเตือนด้วยความร้อนใจ แต่ในวินาทีที่เขากล่าวจบ เสียงคำรามอย่างบ้าคลั่งก็ดังกึกก้องไปทั่วทั้งถ้ำเหมืองแร่ แต่ครั้งนี้ไม่ใช่การอวดเบ่งเหมือนครั้งก่อน แต่เป็นเสียงร้องที่เต็มไปด้วยความเจ็บปวดและความโกรธแค้น!","คลอรีนไตรฟลูออไรด์ ที่สามารถแย่งชิงอิเล็กตรอนได้ หลังจากที่ถูกร่างเงาสัตว์ร้ายกลืนกินเข้าไป มันก็ลุกไหม้ขึ้นมาภายในร่างกายของอีกฝ่ายทันที","ลินน์ไม่คิดที่จะออมมือเลยแม้แต่น้อย เปลวเพลิงอมตะพวยพุ่งออกมามากขึ้นเรื่อยๆ เปลวไฟลุกโชนอย่างรุนแรง คลื่นความร้อนพัดผ่านทุกซอกทุกมุมของถ้ำ กำแพงหินหลอมละลายและพังทลายลงมาภายใต้เปลวไฟอย่างต่อเนื่อง...","“นั่นมันเปลวเพลิงอมตะนี่!”","ในตอนนั้นเอง อารัดถึงเพิ่งจะนึกถึงท่าไม้ตายที่สร้างชื่อเสียงให้กับดาวรุ่งแห่งเวทมนตร์ท่านนี้ได้ เพียงแต่ในตอนนั้น เวทมนตร์ระเบิดนิวเคลียร์ได้ทิ้งความประทับใจที่ลึกซึ้งเอาไว้ให้กับพวกเขามากเกินไป จนทำให้พวกเขาลืมเปลวเพลิงอมตะที่สามารถกลืนกินทุกสิ่งได้อย่างน่าประหลาดใจชนิดนี้ไปเสียสนิท!","ทางด้านราฟาเอลและซานเชซ ที่เห็นว่าสัตว์ร้ายผู้ทรงพลังถูกกลืนกินโดยเปลวเพลิงอันน่าสะพรึงกลัว ต่างก็ถอนหายใจออกมาด้วยความโล่งอก","ลินน์เองก็เช่นกัน ดูเหมือนว่าแม้ระดับชีวิตของสัตว์เวทมนตร์ตัวนี้จะสูงกว่าพวกเขา แต่มันกลับไม่รู้จักวิธีใช้ประโยชน์จากความได้เปรียบนั้น มันถึงได้ถูกเปลวเพลิงอมตะของเขาจัดการได้อย่างง่ายดายขนาดนี้","พูดง่ายๆ ก็คือ อีกฝ่ายมีสติปัญญา แต่ไม่สูงนัก ประมาณเด็กแปดขวบก็แค่นั้น","ต้องรู้ก่อนว่า ลูเซียที่มีระดับตำนานเหมือนกัน เพียงแค่เป่าลมหายใจออกมา ก็สามารถดับเปลวเพลิงอมตะของเขาได้แล้ว","เสียงกรีดร้องของร่างเงาสัตว์ร้ายดำเนินต่อไปเป็นเวลาหนึ่งนาทีเต็ม ราฟาเอลเห็นว่าเปลวไฟได้ห่อหุ้มสัตว์ร้ายขนาดยักษ์ตัวนี้เอาไว้จากข้างในสู่ข้างนอก จึงอดไม่ได้ที่จะเอ่ยถามขึ้นมา","“ท่านลินน์ ข้าว่ามันน่าจะถึงเวลาพอได้แล้วมั้ง?”","พวกเขายังต้องพึ่งพามันในการสกัดแร่ยูเรเนียมนะ...","เผาต่อไปอีกหน่อยเถอะ เจ้านี่มันไม่ได้ตายง่ายขนาดนั้นหรอก...","ลินน์กำลังจะอ้าปากตอบ แต่ความรู้สึกถึงอันตรายอย่างรุนแรงก็ปรากฏขึ้นมาในใจของเขาอีกครั้ง","แสงสว่างอันเจิดจ้าสว่างวาบขึ้นท่ามกลางทะเลเพลิงอมตะ ร่างเงาสัตว์ร้ายที่กำลังถูกเปลวไฟแผดเผาอ้าปากกว้าง ก่อนที่คลื่นพลังงานความเข้มข้นสูงจะพวยพุ่งออกมาจากปากของมัน","ลมหายใจปรมาณูงั้นรึ?!","ม่านตาของลินน์หดเกร็งเล็กน้อย เขารีบทิ้งตัวลงบนพื้น แล้วกลิ้งตัวหลบอย่างทุลักทุเล เพื่อหลบคลื่นพลังงานที่พ่นออกมา","ความเร็วในการตอบสนองของราฟาเอลช้าไปครึ่งจังหวะ โชคดีที่ซานเชซลงมือทันเวลา และตบเขาจนกระเด็นออกไป แต่หัวไหล่และแขนขวาทั้งหมดของเขากลับถูกลบหายไปในคลื่นพลังงานอันรุนแรงนั้น!","โชคดีที่การแผดเผาของเปลวไฟไม่ได้สูญเปล่า ลมหายใจพลังงานของร่างเงาสัตว์ร้าย นอกจากครั้งแรกแล้ว การโจมตีครั้งต่อไปก็ไม่มีความแม่นยำเลยแม้แต่น้อย มันพุ่งไปกระแทกกับกำแพงถ้ำที่อยู่รอบๆ ทั้งหมด","ชั้นหินที่แข็งแกร่งหลุดลอกออกมาเป็นชั้นๆ ทิ้งรอยบุ๋มลึกหลายสิบเมตรเอาไว้ ทำให้พื้นที่ขนาดใหญ่กลายเป็นพื้นที่สุญญากาศไปในทันที!","ผ่านไปประมาณครึ่งนาที ลมหายใจก็ค่อยๆ หยุดลง เปลวเพลิงอมตะที่ปกคลุมอยู่ภายในถ้ำเหมืองแร่ ถูกทำลายไปมากกว่าครึ่ง","แม้ว่าเจ้านี่จะแย่งชิงอิเล็กตรอนอย่างบ้าคลั่งเพื่อเพิ่มพลังให้กับตัวเอง แต่เมื่อต้องเผชิญกับคลื่นพลังงานที่มีความรุนแรงและรวดเร็วขนาดนี้ ผลลัพธ์ที่ได้ก็มีจำกัด มันไม่ทันได้แสดงพลังในการแย่งชิงอิเล็กตรอน ก็ถูกทำลายจนสลายไปในพริบตา","ในตอนนั้นเอง ภาพภายในถ้ำเหมืองแร่ก็ปรากฏขึ้นต่อสายตาของทุกคนอย่างชัดเจน ร่างเงาสัตว์ร้ายที่เดิมทีมีความสูงมากกว่าสองเมตร บัดนี้หดตัวลงเหลือเพียงแค่หนึ่งเมตรเท่านั้น เปลวเพลิงอมตะที่เผาไหม้อยู่ภายในร่างกายของมันก็หายไปแล้ว คาดว่าน่าจะถูกลมหายใจทำลายไปจนหมดสิ้น","สถานการณ์กลับมาตึงเครียดอีกครั้ง ดวงตาทั้งสองข้างของร่างเงาสัตว์ร้ายจ้องเขม็งมาที่พวกเขาทั้งสามคน แววตาเยาะเย้ยในตอนแรกหายไปจนหมดสิ้น กลายเป็นความระแวดระวังอย่างถึงที่สุด","ลินน์ยกมือขึ้น เปลวไฟที่แฝงไปด้วยอันตรายลุกโชนขึ้นรอบๆ ตัวของเขาอีกครั้ง","แม้ว่าเปลวเพลิงอมตะจะไม่สามารถสร้างบาดแผลฉกรรจ์ให้กับร่างเงาสัตว์ร้ายตรงหน้าได้ แต่มันก็น่าจะสามารถลดทอนพละกำลังของอีกฝ่ายได้อย่างมีประสิทธิภาพ","แค่นี้ก็เพียงพอแล้ว!","เมื่อต้องเผชิญหน้ากับเปลวไฟอันน่าสะพรึงกลัวที่ลุกโชนขึ้นมาอีกครั้ง ร่างเงาสัตว์ร้ายก็เหมือนกับแมวที่ถูกเหยียบหาง ร่างกายที่ก่อตัวขึ้นจากพลังงานสั่นสะเทือนไปมาราวกับผิวน้ำ มันอ้าปากเตรียมจะพ่นลมหายใจออกมาอีกครั้ง","ลินน์ อารัด ราฟาเอล และซานเชซต่างก็มีสีหน้าเคร่งเครียด พวกเขาเปลี่ยนจากการโจมตีเป็นการตั้งรับในทันที แต่ร่างเงาสัตว์ร้ายตรงหน้ากลับหุบปากลงอย่างกะทันหัน แล้วพุ่งตรงไปยังรูที่ถูกลมหายใจโจมตีจนทะลุด้วยความเร็วสูง","หนีไปแล้วงั้นรึ?!","ลินน์ถึงกับอึ้งไปเลย เขาไม่คาดคิดเลยว่าเจ้านี่จะรู้จักใช้การข่มขวัญและกลยุทธ์ด้วย","เขาจึงปรับการประเมินสติปัญญาของมันในใจ จากเด็กแปดขวบเป็นเก้าขวบในทันที...","“ตามไป!”","ลินน์ไม่มีทางปล่อยโอกาสทองแบบนี้หลุดมือไปหรอกนะ อุตส่าห์ตามจับและลดพละกำลังของอีกฝ่ายลงได้แล้ว ถ้าปล่อยให้มันหนีไปได้ ครั้งหน้าก็คงจะลากตัวมันออกมาได้ยากแล้ว!","ราฟาเอลและคนอื่นๆ ก็รีบตามไปติดๆ ชายทั้งสี่คนไล่ตามร่างเงาสัตว์ร้ายตัวนี้ไปในถ้ำเหมืองแร่ที่มืดมิด","หลังจากไล่ตามไปได้สักพัก พวกเขาก็พบว่าภายในถ้ำเหมืองแร่แห่งนี้สลับซับซ้อนเป็นอย่างมาก ความเข้มข้นของรังสีและเวทมนตร์ก็ค่อยๆ สูงขึ้น ร่างเงาสัตว์ร้ายเปลี่ยนทิศทางอย่างต่อเนื่อง และความเร็วของมันก็เร็วมาก ดูเหมือนว่ามันต้องการจะสลัดหลุดจากการถูกตามล่าด้วยวิธีนี้","แต่ลินน์และคนอื่นๆ ก็ไม่ใช่พวกกินพืชนะ สัตว์ประหลาดที่ซานเชซแปลงกายขึ้นมา มีอวัยวะรับรู้พลังงานที่ยอดเยี่ยมมาก ตราบใดที่ยังอยู่ไม่ไกลจนเกินไป ก็ไม่มีทางตามพลาดอย่างแน่นอน","ไม่นานนัก พวกเขาก็ไล่ตามมาจนถึงส่วนลึกของถ้ำเหมืองแร่ โดยบนกำแพงถ้ำรอบๆ มีผลึกหินคริสตัลฝังอยู่เต็มไปหมด","“นี่มัน...คริสตัลเวทมนตร์งั้นรึ?!”","ลินน์รู้สึกประหลาดใจเป็นอย่างมาก หรือว่าภายในถ้ำเหมืองแร่ยูเรเนียมแห่งนี้ จะเป็นเหมืองคริสตัลเวทมนตร์ด้วยงั้นรึ?","รังสี เวทมนตร์ และร่างเงาสัตว์ร้ายที่เป็นพลังงานตรงหน้านี้ ดูเหมือนจะมีความเชื่อมโยงอะไรบางอย่างกัน","ลินน์ตัดสินใจอย่างเด็ดขาดในทันที ว่าจะปล่อยให้อีกฝ่ายหนีกลับไปที่รังไม่ได้เด็ดขาด ไม่อย่างนั้นอาจจะเกิดความเปลี่ยนแปลงขึ้นมาอีก!","ลินน์กะจังหวะได้อย่างแม่นยำ ลำแสงเลเซอร์ถูกยิงออกไปอีกครั้ง มันตัดกำแพงถ้ำที่อยู่ด้านหน้าของร่างเงาสัตว์ร้ายจนขาด หินก้อนใหญ่ร่วงหล่นลงมาขวางทางของมันเอาไว้","จากนั้น เพลิงอมตะอันบ้าคลั่งก็พวยพุ่งตามมาติดๆ","ราฟาเอลและคนอื่นๆ ก็ร่ายเวทมนตร์ ทำให้กำแพงถ้ำถล่มลงมาขวางทางของอีกฝ่ายเอาไว้อย่างพร้อมเพรียงกัน","ภายในเวลาเพียงแค่หนึ่งวินาที ร่างเงาสัตว์ร้ายก็ถูกล้อมรอบด้วยเปลวเพลิงอมตะทั้งด้านหน้า ด้านหลัง ด้านซ้าย และด้านขวา ดวงตาสัตว์ร้ายที่ราวกับไพลินหรี่ลง พร้อมที่จะต่อสู้จนตัวตาย","“เดี๋ยวก่อน พวกเราไม่ได้มาร้าย บางทีพวกเราอาจจะคุยกันได้นะ!”","จู่ๆ ลินน์ก็เอ่ยปากพูดขึ้นมา แต่พอนึกขึ้นได้ว่าอีกฝ่ายน่าจะฟังภาษากลางไม่ออก เขาจึงขยายวงแหวนไฟที่ล้อมรอบอีกฝ่ายให้กว้างขึ้นอีกนิด ส่วนตัวเองก็ถอยหลังไปสองสามก้าว เพื่อแสดงความจริงใจผ่านการกระทำ","ความจริงแล้ว ถ้าจะว่ากันตามตรง ทั้งสองฝ่ายก็ไม่ได้มีความแค้นที่ต้องฆ่ากันให้ตายไปข้างหนึ่ง ในทางกลับกัน พวกเขาสามารถพึ่งพาอาศัยกันได้อย่างสมบูรณ์แบบด้วยซ้ำ","สัตว์เวทมนตร์ตัวนี้ก็ไม่ได้กินคน มันแค่ต้องการกินแร่ธาตุที่มีพลังงานสูงต่างๆ เท่านั้น และจากการที่มันขับหินปีศาจออกมา ก็สามารถบอกได้เลยว่า แม้ว่ามันจะสามารถกลืนกินธาตุหนักบางชนิดเข้าไปได้ แต่มันก็ไม่สามารถย่อยสลายมันได้อย่างสมบูรณ์ ซึ่งนั่นก็ตรงกับความต้องการของพวกเขาในการสกัดวัตถุดิบพอดี","เมื่อพิจารณาจากจุดนี้แล้ว ลินน์จึงคิดหาวิธีที่จะสื่อสารกับอีกฝ่าย โดยไม่จำเป็นต้องใช้ภาษาเดียวกันขึ้นมาได้","เขาเริ่มจากการใช้เวทมนตร์ รวบรวมเศษหินที่กระจัดกระจายอยู่รอบๆ เข้าด้วยกัน จากนั้นก็ยืดเปลวไฟให้กลายเป็นรูปร่างเหมือนกับร่างเงาสัตว์ร้าย แล้วเลียนแบบการกระทำของอีกฝ่ายก่อนหน้านี้ ด้วยการกลืนกินแร่ลงไปจนหมด","เปลวไฟลุกไหม้ สกัด และกำจัดสิ่งเจือปนที่มากเกินไปออกไปอย่างรวดเร็ว จนเหลือเพียงแค่ยูเรเนียมที่มีขนาดไม่ถึงหนึ่งเปอร์เซ็นต์ของก่อนหน้านี้","ลินน์ลงมือเก็บแร่ที่ถูกสกัดเรียบร้อยแล้ว แล้วรวบรวมเศษหินอีกกองหนึ่งเข้ามา ทำกระบวนการนี้ซ้ำไปซ้ำมา เพื่อแสดงให้เห็นภาพชีวิตหลังจากที่อีกฝ่ายยอมจำนน","มีอาหารส่งมาให้ถึงที่ทุกวัน แค่กินแล้วก็ขับออกมา ชีวิตที่สุขสบายแบบนี้ จะไปหาจากที่ไหนได้อีกนอกจากที่นี่?"]},{"n":459,"t":"ปริมาณสำรองนิวเคลียร์ที่เพิ่มขึ้นอย่างก้าวกระโดด และประตูมิติแห่งใหม่!","c":["ภายใต้เงื่อนไขที่เย้ายวนจนแทบจะสมบูรณ์แบบของลินน์ ร่างเงาสัตว์ร้ายก็ยังคงไม่หวั่นไหว มันยังคงส่งเสียงขู่คำรามอยู่ภายในวงแหวนไฟด้วยความกระวนกระวายใจ พร้อมสายตาของมันที่เต็มไปด้วยความไม่ไว้วางใจ","“งั้นก็ฆ่ามันทิ้งซะเลยดีไหม!”","ซานเชซที่ต้องสูญเสียแขนไปข้างหนึ่งจากการฝืนต้านทานคลื่นพลังงาน เอ่ยขึ้นมาด้วยความโมโห","ในสายตาของเขา แม้ว่าสัตว์เวทมนตร์รูปร่างประหลาดตัวนี้จะมีประโยชน์อยู่บ้าง แต่มันก็เป็นภัยคุกคามที่ใหญ่หลวงเกินไป หากไม่ใช่เพราะเพลิงอมตะของลินน์มีผลในการต่อต้านอีกฝ่ายได้ในระดับหนึ่ง วันนี้พวกเขาก็คงจะถอนตัวออกไปได้ยากแล้ว","การเลี้ยงสัตว์เวทมนตร์ที่แข็งแกร่งขนาดนี้เอาไว้ หากควบคุมไม่ดี ก็อาจจะทำให้เกิดความสูญเสียครั้งใหญ่ได้","ลินน์เองก็รู้สึกหนักใจขึ้นมาชั่วขณะ หลังจากที่ครุ่นคิดอยู่ครู่หนึ่ง เขาก็นึกขึ้นได้ว่า เจ้านี่น่าจะมีความสนใจในกลุ่มก้อนพลังงานสูงที่แปลกใหม่และไม่เคยกินมาก่อนเป็นอย่างมาก เขาจึงตัดสินใจที่จะลองดูอีกครั้ง เมื่อเขาแบมือออก ลูกบอลทรงกลมที่ถูกห่อหุ้มด้วยชั้นตะกั่วก็ปรากฏขึ้นบนฝ่ามือ","เมื่อชั้นตะกั่วถูกลอกออก ‘ผลึกน้ำแข็ง’ ที่สวยงามก็เผยให้เห็น","นี่คือสิ่งที่สกัดออกมาจากน้ำ ซึ่งถูกเก็บรักษาเอาไว้ด้วยความเย็น และกำลังจะถูกนำไปใช้เป็นเชื้อเพลิงสำหรับเตาปฏิกรณ์นิวเคลียร์ฟิวชัน...ธาตุทริเทียม!","เช่นเดียวกับยูเรเนียม เจ้านี่ก็เป็นธาตุกัมมันตรังสีเหมือนกัน แถมมันยังมีครึ่งชีวิตเพียงแค่ 12.43 ปีเท่านั้น!","ถ้าเขาเดาไม่ผิด ร่างเงาสัตว์ร้ายตรงหน้า น่าจะอาศัยการดูดซับรังสีแอลฟา รังสีบีตา หรือรังสีแกมมาที่แผ่ออกมา เพื่อเติมพลังงาน หรือเพิ่มขนาดร่างกายของมัน","งั้นธาตุทริเทียม ก็ย่อมต้องเคี้ยวง่ายกว่ายูเรเนียมที่ ‘แข็ง’ กว่าอย่างแน่นอน!","เป็นไปตามคาด หลังจากที่ได้เห็นผลึกน้ำแข็งที่ปรากฏขึ้นบนฝ่ามือของลินน์ ร่างเงาสัตว์ร้ายก็แสดงอาการกระวนกระวายใจขึ้นมาทันที มันแสดงออกถึงความปรารถนาอย่างแรงกล้า","ลินน์หัวเราะออกมา ดูเหมือนว่าจะมีลุ้นแฮะ เขาหันไปมองอารัด ก่อนจะเอ่ยสั่งการ","“ไปสั่งให้คนขนแร่ยูเรเนียมมาให้หน่อยสิ!”","...","ในสัปดาห์ต่อมา ลินน์ก็ดำเนินการตามแผนการฝึกสัตว์ของเขาอยู่ภายในถ้ำเหมืองแร่ยูเรเนียม","แม้ว่าความสามารถในการสกัดแร่ของร่างเงาสัตว์ร้ายจะมีความสำคัญต่อพวกเขามาก แต่ลินน์ก็ไม่ได้ตามใจมันไปซะทุกอย่าง และการให้รางวัลสลับกับการลงโทษต่างหาก ถึงจะเป็นวิธีฝึกสัตว์ที่ถูกต้องที่สุด","อย่างน้อยก็ต้องทำให้อีกฝ่ายรู้ว่า ใครคือเจ้านายที่แท้จริง","นอกจากนี้ พลังรบของอีกฝ่ายก็ประมาทไม่ได้เลย ด้วยร่างกายที่เป็นพลังงาน ซึ่งมีพลังทำลายล้างที่น่าสะพรึงกลัว และมีความเร็วที่เหนือกว่าปกติมาก หากไม่ได้พึ่งพาคุณสมบัติอันน่าสะพรึงกลัวของคลอรีนไตรฟลูออไรด์ เขาก็คงจะไม่มีปัญญาจัดการกับเจ้านี่ได้จริงๆ ถ้าหากเขาสามารถฝึกมันได้อย่างสมบูรณ์แบบ มันก็คงจะเป็นผู้ช่วยที่ดีในการรับมือกับศาสนจักรอย่างแน่นอน","คราวก่อน เขาอาศัยเวทมนตร์ระเบิดนิวเคลียร์ที่ถูกใช้ในจังหวะที่ไม่มีใครคาดคิด เพื่อจัดการกับร่างสถิตของเทพเจ้าจอมปลอม แต่ในครั้งหน้า ถ้าหากอีกฝ่ายมีการป้องกันเอาไว้ล่วงหน้า มันก็คงจะยากที่จะประสบความสำเร็จได้อีก","หลังจากผ่าน ‘การสื่อสารอย่างเป็นมิตร’ มาตลอดหนึ่งสัปดาห์ ในที่สุดทั้งสองฝ่ายก็สามารถสร้างความไว้วางใจเบื้องต้นต่อกันได้แล้ว","เพื่อความสะดวกในการเรียกขาน ลินน์จึงตั้งชื่อที่ไพเราะให้กับอีกฝ่ายด้วย","ในเมื่อมันสามารถกลืนกินเชื้อเพลิงนิวเคลียร์ได้ แถมยังสามารถพ่นคลื่นพลังงานที่แข็งแกร่งออกมาจากปากได้ ซึ่งมันก็มีความคล้ายคลึงกับลักษณะของก็อตซิลล่า ในภาพยนตร์เก่าแก่เรื่องหนึ่งในชาติก่อนของเขาอยู่บ้าง","งั้นก็ให้ชื่อว่า...","มูโตก็แล้วกัน!","ศัตรูตัวฉกาจของก็อตซิลล่า!","แน่นอนว่าตลอดทั้งเจ็ดวันนี้ ลินน์ไม่ได้ใช้เวลาทั้งหมดไปกับการฝึกสัตว์ เขาได้ร่วมมือกับราฟาเอลและคนอื่นๆ เพื่อสำรวจลึกเข้าไปภายในถ้ำเหมืองแร่ยูเรเนียมแห่งนี้","ภาพที่อยู่ภายในนั้น ทำให้ลินน์รู้สึกตกตะลึงเป็นอย่างมาก ยิ่งเข้าไปลึกเท่าไหร่ รังสีก็ยิ่งรุนแรงมากขึ้นเท่านั้น เวทมนตร์ก็ยิ่งหนาแน่นมากขึ้น และจำนวนของคริสตัลเวทมนตร์ที่ฝังอยู่บนกำแพงถ้ำรอบๆ ก็ยิ่งมีจำนวนมากขึ้นด้วย","ก้อนหินที่ยื่นออกมาบางส่วน ถึงกับถูกเวทมนตร์กลืนกินไปครึ่งหนึ่งแล้วด้วยซ้ำ","ในไม่ช้า เขาก็หาต้นกำเนิดของรังสีพบแล้ว นั่นก็คือหินปีศาจจำนวนมาก ที่กระจัดกระจายอยู่ภายในถ้ำเหมืองแร่","ลินน์เก็บรวบรวมพวกมันมาทีละชิ้น และหลังจากที่ลองชั่งน้ำหนักดู ตามข้อมูลการย่อยสลายที่ได้รับในครั้งก่อน ปริมาณของพวกมันน่าจะเพียงพอสำหรับจุดวิกฤตของเวทมนตร์ระเบิดนิวเคลียร์ถึงห้าครั้ง","นั่นหมายความว่า ในที่สุดสภาเวทมนตร์ก็สามารถหลุดพ้นจากสภาวะขาดแคลนนิวเคลียร์ และสามารถยืดอกได้อย่างสง่าผ่าเผยได้แล้ว!","มูโตที่ถูกปล่อยออกมาจากวงแหวนไฟแล้ว หลังจากที่ได้รับการบำรุงด้วยแร่ยูเรเนียมจำนวนมหาศาลภายในเจ็ดวัน มันก็สามารถฟื้นฟูร่างกายกลับมาได้ถึงสามในสี่ของขนาดเดิมแล้ว เพียงแต่ ‘สมอง’ ของมันก็ยังคงไม่สามารถเข้าใจได้เลย ว่าทำไมสิ่งมีชีวิตสองขาที่อยู่ตรงหน้านี้ ถึงได้หลงใหลในการเก็บอุจจาระของมันนัก...แถมยังทำหน้าตาดีใจอีกต่างหาก","ภายใต้การนำทางของมูโต กลุ่มของลินน์ก็ใช้เวลาประมาณหนึ่งชั่วโมง ในการเดินทางไปจนถึงส่วนที่ลึกที่สุดของถ้ำเหมืองแร่","ตรงหน้าของพวกเขา คือถ้ำหินย้อยขนาดใหญ่ที่มีเส้นผ่านศูนย์กลางกว่าเจ็ดร้อยเมตร บนกำแพงและพื้นของถ้ำเต็มไปด้วยคริสตัลเวทมนตร์ที่มีลักษณะเป็นผลึก ซึ่งกำลังส่องแสงสีฟ้าจางๆ ออกมาท่ามกลางความมืดมิด","“จุ๊ๆๆ พวกเรากำลังจะรวยแล้ว!”","ราฟาเอลอดไม่ได้ที่จะเดาะลิ้นออกมา","มูลค่าของเหมืองคริสตัลเวทมนตร์แห่งหนึ่งนั้นชัดเจนอยู่แล้ว สาเหตุที่สภาเวทมนตร์เลือกที่จะสร้างบ้านเกิดแห่งใหม่ในดินแดนพ่อมด ก็เป็นเพราะว่าพวกเขาพบเหมืองคริสตัลเวทมนตร์ที่มีปริมาณมหาศาลอยู่ที่นั่น","เพียงแต่หลังจากการขุดค้นมานานนับร้อยปี ปริมาณคริสตัลเวทมนตร์ที่อยู่ภายในนั้น ก็ถูกใช้ไปจนเกือบจะหมดแล้ว หากไม่ใช่เพราะสงครามในครั้งนี้ สภาเวทมนตร์ก็คงจะไม่ยอมนำคริสตัลเวทมนตร์ที่มีอยู่อย่างจำกัดออกมาใช้อย่างแน่นอน","และตอนนี้ พวกเขาก็ได้ค้นพบถ้ำเหมืองคริสตัลเวทมนตร์แห่งใหม่ ซึ่งนั่นก็ถือว่าเป็นข่าวดีที่ยิ่งใหญ่มาก!","ส่วนสายตาของลินน์ กลับจับจ้องไปที่ส่วนที่ลึกที่สุดของถ้ำหินย้อย พลังเวทมนตร์มหาศาลกำลังไหลไปรวมกันอยู่ที่นั่น จนก่อให้เกิดเป็นจุดเชื่อมต่อพลังเวทมนตร์ที่แปลกประหลาดขึ้นที่ใจกลาง แสงสีฟ้าส่องประกายอยู่รอบๆ จุดเชื่อมต่อนั้น ในรัศมีประมาณสามเมตร ราวกับน้ำวนที่กำลังหมุนวนไปมาอย่างต่อเนื่อง...","ลินน์เข้าใจดีว่า นั่นคือปรากฏการณ์ทางสายตาที่เกิดจากการบิดเบี้ยวของกาลอวกาศ!","“นี่มัน...ประตูมิติหรือเปล่า?!”","สีหน้าของลินน์เปลี่ยนเป็นเคร่งเครียดในทันที","อารัดและคนอื่นๆ เองก็สังเกตเห็นจุดเชื่อมต่อพลังเวทมนตร์นี้เช่นกัน แต่พวกเขาไม่ได้รู้สึกประหลาดใจเหมือนกับลินน์ เพราะยังไงเสีย ภายในถ้ำเหมืองคริสตัลเวทมนตร์ที่ดินแดนพ่อมด ก็มีประตูมิติอยู่บานหนึ่งเหมือนกัน และบรรดาจอมเวทผู้ยิ่งใหญ่ต่างก็เคยไปที่นั่นมากันหมดแล้ว","เพียงแต่ประตูมิติที่อยู่ตรงหน้านี้ แตกต่างจากประตูมิติที่ดินแดนพ่อมดเล็กน้อย","หลังจากที่ครุ่นคิดอยู่ครู่หนึ่ง ราฟาเอลก็สันนิษฐานว่า ประตูมิติแห่งนี้อาจจะอยู่ในสถานะปิดใช้งาน","โดยข้อสันนิษฐานนั้นมีอยู่สองข้อ","ข้อแรก ภายในถ้ำเหมืองแร่ไม่มีสัตว์เวทมนตร์ปรากฏตัวขึ้นมาเป็นจำนวนมาก (หรืออาจจะเป็นเพราะว่าพวกมันบุกรุกเข้ามาในอาณาเขต แล้วก็เลยถูกมูโตจัดการไปหมดแล้ว)","ข้อที่สอง ก็คือความผันผวนของพลังเวทมนตร์ที่เกิดขึ้นนั้น ด้อยกว่าประตูบานนั้นมาก และผลกระทบที่เกิดขึ้นก็มีจำกัดมากเช่นกัน","ต้องรู้ก่อนว่า ตอนที่ประตูมิติในถ้ำเหมืองคริสตัลเวทมนตร์ไม่ถูกจำกัด พื้นที่ในรัศมีหนึ่งพันเมตร ก็จะเกิดความผิดปกติจากการบิดเบี้ยวของกาลอวกาศขึ้นมา","แต่เนื่องจากมีตัวอย่างให้เปรียบเทียบน้อยเกินไป ราฟาเอลก็เลยไม่สามารถฟันธงได้ร้อยเปอร์เซ็นต์เหมือนกัน","ในขณะที่บรรดาจอมเวทผู้ยิ่งใหญ่ กำลังถกเถียงกันว่าจุดเชื่อมต่อมิติแห่งนี้ถูกเปิดใช้งานแล้วหรือยัง ลินน์กลับกำลังครุ่นคิดถึงอีกเรื่องหนึ่ง นั่นก็คือจุดเชื่อมต่อแห่งนี้เกิดขึ้นมาได้อย่างไร...","ตามข้อสันนิษฐานของสภาเวทมนตร์ มันอาจจะเป็นเพราะว่าความเข้มข้นของพลังเวทมนตร์ที่มากเกินไป ได้ส่งผลกระทบต่อกาลอวกาศในพื้นที่แห่งนี้ แม้กระทั่งตัวลินน์เอง ในก่อนหน้านี้เขาก็เคยคิดแบบนั้น","เพราะยังไงเสีย เขาก็ยังไม่เข้าใจคุณสมบัติทั้งหมดของพลังเวทมนตร์อย่างถ่องแท้","แต่เมื่อได้มาเห็นจุดที่เรียกว่าจุดเชื่อมต่อมิติแห่งนี้ด้วยตาตัวเอง ลินน์ก็อดไม่ได้ที่จะเกิดข้อสงสัยขึ้นมาอีกข้อหนึ่ง","ด้วยพลังงานของเหมืองคริสตัลเวทมนตร์เพียงแห่งเดียว มันจะเพียงพอที่จะบิดเบี้ยวกาลอวกาศ จนสร้าง ‘ประตู’ ขึ้นมาได้จริงๆ งั้นรึ?","แม้แต่จุดศูนย์กลางของการระเบิดนิวเคลียร์ที่ทรงพลัง ก็ยังส่งผลกระทบต่อกาลอวกาศได้อย่างจำกัดเลย","ลินน์พอนึกถึงความเป็นไปได้อีกอย่างหนึ่งขึ้นมาได้ลางๆ แต่เขาก็ไม่ได้คิดที่จะบอกกับราฟาเอลและคนอื่นๆ ...","“เจ้ามาจากที่นั่นงั้นรึ มูโต?”","จู่ๆ ลินน์ก็หันไปมองร่างเงาสัตว์ร้ายสีฟ้าครามที่อยู่ข้างๆ แล้วเอ่ยถามขึ้นมา","ร่างเงาสัตว์ร้ายสีฟ้าครามไม่ได้ตอบกลับ แต่มันยังคงรักษาท่าทีที่เย่อหยิ่งเอาไว้อย่างเต็มเปี่ยม","ลินน์ส่ายหน้าอย่างจนใจ ด้วยความไว้วางใจเบื้องต้นที่สร้างขึ้นมาตลอดหนึ่งสัปดาห์นั้น มีขีดจำกัดมาก มันเพียงแค่ทำให้อีกฝ่ายไม่แสดงท่าทีเป็นปรปักษ์อย่างรุนแรงออกมาก็เท่านั้น","ความจริงแล้ว นอกจากการ ‘กิน’ แล้ว เวลาส่วนใหญ่ของเจ้านี่ก็ถูกใช้ไปกับการนอนพักผ่อน มันไม่ค่อยจะสนใจเขาเท่าไหร่เลย และที่มันยอมพาพวกเขากลับมาที่รังในครั้งนี้ ก็เป็นเพราะว่าเขาให้ธาตุทริเทียมกับมันไปถึงครึ่งกิโลกรัมต่างหาก","มูโตที่แทะ ‘กระดูกแข็ง’ มาเยอะมาก กลับรู้สึกสนใจในขนมขบเคี้ยวที่ ‘นุ่มนิ่ม’ แบบนี้เป็นอย่างมาก ลินน์ก็เลยจำเป็นต้องใช้สิ่งนี้ เพื่อ ‘ควบคุม’ อีกฝ่ายไปพลางๆ ก่อน","“พวกเรารีบกลับกันเถอะ จะได้เอาเรื่องการค้นพบที่นี่ไปรายงานให้สภาเวทมนตร์ทราบ”","ลินน์กล่าวด้วยน้ำเสียงหนักแน่น","ราฟาเอลและคนอื่นๆ ต่างก็พยักหน้าอย่างพร้อมเพรียงกัน ไม่ว่าประตูมิติแห่งนี้จะถูกเปิดออกหรือไม่ แต่มันก็ถือว่าเป็นภัยคุกคามที่ไม่เล็กเลย ทางที่ดีควรจะให้นักเล่นแร่แปรธาตุที่เชี่ยวชาญเวทมนตร์สนามพลังมาจัดการจะดีกว่า และก็ต้องเพิ่มการป้องกันของถ้ำเหมืองแร่ยูเรเนียมให้แน่นหนาขึ้นด้วย","หลังจากที่ตัดคริสตัลเวทมนตร์ภายในถ้ำเหมืองแร่ออกมาสองสามก้อนเพื่อเป็นตัวอย่าง ลินน์ก็ไม่ได้รั้งอยู่ต่อ เขาเดินทางออกจากถ้ำเหมืองแร่ยูเรเนียมพร้อมกับบรรดาจอมเวทผู้ยิ่งใหญ่ และขึ้นเรือเหาะกลับไปยังเมืองน้ำมันดินในทันที","สำหรับ ‘สัตว์เลี้ยง’ ตัวใหม่ของเขาอย่างมูโต ก็ต้องพาตัวกลับไปด้วยอย่างแน่นอน เพราะนอกจากตัวเขาเองแล้ว ภายในเหมืองแร่แห่งนี้ ก็ไม่มีใครสามารถรับมือกับเจ้านี่ได้เลย","หากเกิดเหตุการณ์ไม่คาดฝันขึ้น อย่างเช่นถ้าจู่ๆ มันเกิดคลุ้มคลั่งขึ้นมา ทุกคนที่อยู่ที่นั่นก็คงจะต้องตายกันหมด","เพียงแต่ถ้าเป็นแบบนี้ การนำแร่ยูเรเนียมมาสกัดที่เมืองน้ำมันดิน ก็จะค่อนข้างเสียเวลาและแรงงานพอสมควร แต่นั่นก็เป็นวิธีที่ดีที่สุดแล้ว","...","หลังจากทำการบินมานานหลายชั่วโมง เมืองน้ำมันดินก็เริ่มปรากฏขึ้นให้เห็นอยู่ลิบๆ","ตลอดการเดินทาง ลินน์คอยจับตาดูท่าทีของมูโตอยู่ตลอดเวลา เพราะกลัวว่ามันจะเกิดอาการตื่นตระหนก กับการขึ้นเรือเหาะเป็นครั้งแรก","โชคดีที่ร่างเงาสัตว์ร้ายสีฟ้าคราม นิ่งสงบกว่าที่เขาคิดเอาไว้มาก มันทำเพียงแค่นอนหมอบอยู่ข้างๆ เพื่อย่อยสลายธาตุทริเทียมที่เพิ่งจะกินเข้าไป โดยไม่มีท่าทีหวาดกลัวหรือตื่นตระหนกเลยแม้แต่น้อย","เพียงแต่อุณหภูมิบนร่างกายของมันสูงเกินไป จนเกือบจะเผาพื้นระเบียงเรือให้ทะลุอยู่แล้ว...","แต่พอลองคิดดูดีๆ แล้ว มันก็เป็นเรื่องปกติ ในเมื่อมันเป็นสิ่งมีชีวิตพลังงาน มันก็ย่อมต้องบินได้โดยที่ไม่จำเป็นต้องมีปีก และก็ไม่มีทางที่จะตกมาตายอย่างแน่นอน","เรือเหาะค่อยๆ ร่อนลงจอดที่เมืองน้ำมันดิน เวลาผ่านไปเพียงแค่หนึ่งสัปดาห์เท่านั้น หลังจากที่ราฟาเอลเดินลงมาจากเรือเหาะ เขาก็เกือบจะคิดไปแล้วว่า ตัวเองได้เดินทางมายังเมืองอีกเมืองหนึ่ง","ภายใต้การร่วมมือกันระหว่างเวทมนตร์และเทคโนโลยี เมืองน้ำมันดินทั้งเมือง ก็เปลี่ยนไปในทุกๆ วัน","ถนนสายหลักภายในเมือง ถูกขยายให้กว้างขึ้นเกือบเท่าตัว เขตสลัมที่เคยทรุดโทรมและเต็มไปด้วยกลิ่นเหม็นเน่าในอดีต บัดนี้กลับมีคฤหาสน์ที่สวยงามผุดขึ้นมามากมาย การปรับปรุงเสร็จสิ้นไปแล้วถึงหนึ่งในสี่ โครงสร้างของสถานีรถไฟก็ถูกสร้างขึ้นมาจนเกือบจะเสร็จสมบูรณ์แล้ว ไม่เหมือนกับตอนที่พวกเขาจากไป ที่มีเพียงแค่กำแพงโล่งๆ สองสามด้าน","คาดว่าเมื่อทางรถไฟถูกสร้างมาถึงที่นี่ สถานีรถไฟก็น่าจะสร้างเสร็จพอดี","ไม่เพียงเท่านั้น ในช่วงหนึ่งเดือนที่พวกเขายึดครองเมืองน้ำมันดินมาได้ ก็ได้มีการก่อตั้งโรงงานขึ้นมามากกว่าหนึ่งร้อยแห่ง มีการว่าจ้างคนงานหลายหมื่นคน เพราะยังไงเสีย ที่นี่ก็คือแนวหน้าของสงคราม หากสามารถผลิตสิ่งของต่างๆ ที่นี่ได้ มันก็จะสะดวกสบายที่สุด","หมอกควันจำนวนมหาศาล พวยพุ่งออกมาจากปล่องควันขนาดใหญ่ของโรงงานอย่างต่อเนื่อง แต่ลินน์กลับกำลังคิดว่า เขาสามารถใช้เวทมนตร์ เพื่อนำก๊าซไอเสียเหล่านี้ กลับมาใช้ใหม่ได้หรือไม่","อย่างเช่นการนำคาร์บอนไดออกไซด์ที่เป็นของเสียหลัก ไปใช้ในการสังเคราะห์แป้ง เพื่อแก้ไขปัญหาเรื่องการผลิตอาหารบางส่วน","ลินน์เตรียมที่จะพัฒนาเมืองน้ำมันดินที่อยู่ในดินแดนของจักรวรรดิแห่งนี้ ให้กลายเป็นเมืองต้นแบบ และอาศัยขบวนกองคาราวานสินค้าที่เดินทางผ่านไปมา ในการประชาสัมพันธ์ เพื่อทำลายความศรัทธาของชาวเมืองในจักรวรรดิให้พังทลายลง!","ในตอนแรก ราฟาเอลและคนอื่นๆ ยังรู้สึกสงสัย ว่าจะมีพ่อค้าของจักรวรรดิคนไหนที่ไม่กลัวตาย กล้าฝ่าฝืนคำสั่งห้ามที่เข้มงวดที่สุดในประวัติศาสตร์ของจักรวรรดิ และมาทำการค้าขายกับพ่อมดอย่างพวกเขา","แต่ไม่นาน เขาก็ถูกตอกกลับหน้าหงาย เพราะจำนวนขบวนกองคาราวานสินค้าที่เดินทางผ่านไปมา มีมากกว่าที่เขาคิดเอาไว้มาก","ความจริงก็เป็นไปตามที่ลินน์พูด พ่อค้าไม่ได้เกรงกลัวต่อกฎหมาย และก็ไม่ได้สนใจเลยว่าตัวเองจะถูกจับไปแขวนคอหรือไม่ สิ่งเดียวที่พวกเขาหวาดกลัว ก็คือการที่พวกเขาจะไม่ได้กำไรที่มากพอก็เท่านั้น!","แต่มันมีอยู่แล้วอย่างแน่นอน!","กระจก ผ้า หม้อดิน เกลือบริสุทธิ์ และสิ่งประดิษฐ์เล่นแร่แปรธาตุแปลกใหม่ที่น่าสนใจ ซึ่งผลิตขึ้นในเมืองน้ำมันดิน ล้วนเป็นสินค้าที่ขายดีที่สุดในจักรวรรดิ ขอเพียงแค่สามารถลักลอบนำมันกลับไปได้ พวกเขาก็สามารถขายมันออกไปได้อย่างง่ายดาย ในราคาที่เพิ่มขึ้นถึงหนึ่งเท่าตัว หรือแม้กระทั่งสิบกว่าเท่า!","ภายใต้ผลประโยชน์ที่บ้าคลั่งเช่นนี้ คำสั่งห้ามของศาสนจักร ก็กลายเป็นเรื่องตลกที่ไร้สาระที่สุด!","“ช่วยไปแจ้งท่านประธานสภาทั้งหลายให้หน่อย ข้าต้องการจะจัดการประชุมภายใน!”","ทันทีที่ลินน์ลงมาจากเรือเหาะ เขาก็ไม่ได้คิดที่จะพักผ่อนเลย เขาบอกให้เอล็อคและคนอื่นๆ ที่มารอต้อนรับพวกเขากลับเมือง ไปแจ้งให้บรรดาประธานสภาทราบในทันที ส่วนเขาก็กลับไปที่คฤหาสน์ เพื่อเอาข้อมูลงานวิจัยก่อนหน้านี้ไปด้วย","ในเมื่อปัญหาเรื่องการขาดแคลนนิวเคลียร์ได้รับการแก้ไขแล้ว ถ้างั้นการสร้างเตาปฏิกรณ์นิวเคลียร์ฟิวชันก็น่าจะถูกนำมาพิจารณาได้แล้วล่ะ!","ยิ่งพวกเขาเลื่อนขั้นเป็นระดับตำนานได้เร็วเท่าไหร่ พวกเขาก็ยิ่งมีสิทธิ์ที่จะงัดข้อกับเทพเจ้าจอมปลอมองค์นั้นได้เร็วขึ้นเท่านั้น","ในช่วงหัวค่ำ ภายในคฤหาสน์ของท่านดยุก การประชุมฉุกเฉินระหว่างประธานสภาก็ถูกจัดขึ้น","ทันทีที่ออโรร่าเดินเข้ามาในห้องประชุม เธอก็สังเกตเห็นร่างเงาสัตว์ร้ายสีฟ้าครามที่มีความสูงมากกว่าสองเมตรในทันที เธอจึงเอ่ยถามขึ้นมาด้วยความอยากรู้อยากเห็น","“นี่คือสัตว์เวทมนตร์ที่สามารถกลืนกินแร่ยูเรเนียมได้งั้นรึ? ช่างเป็นตัวประหลาดจริงๆ!”","แฮร์รอฟและวิกโตริโอเองก็รู้สึกทึ่งเช่นกัน คงจะมีแค่สิ่งมีชีวิตแบบนี้เท่านั้นแหละ ที่สามารถกินธาตุกัมมันตรังสีที่อันตรายแบบนี้เป็นอาหารได้","ภายใต้สายตาที่เต็มไปด้วยความสงสัยของบรรดาประธานสภา มูโตที่กำลังอยู่ในช่วงย่อยอาหารก็ ‘ลืม’ ตาขึ้น เมื่อเห็นว่าเป็นสิ่งมีชีวิตสองขาที่ไม่มีพิษมีภัยอะไร มันก็หลับตาลงอีกครั้ง","“มันชื่อมูโต ถือว่าเป็นหนึ่งในผลเก็บเกี่ยวจากการเดินทางไปยังถ้ำเหมืองแร่ยูเรเนียมในครั้งนี้ พอมีมันแล้ว การสกัดแร่กัมมันตรังสีก็จะง่ายขึ้นเยอะ นอกจากนี้ ข้ายังพบหินปีศาจเพิ่มมาอีก ซึ่งมันน่าจะเพียงพอสำหรับเวทมนตร์ระเบิดนิวเคลียร์อีกห้าครั้ง”","ลินน์เอ่ยอธิบาย","“เยี่ยมมาก ถ้าเป็นแบบนี้ พวกเราก็ไม่ต้องแสร้งทำเป็นเก่งเหมือนเมื่อก่อนอีกแล้ว”","เมื่อได้ยินดังนี้ แฮร์รอฟก็อดไม่ได้ที่จะถอนหายใจออกมาด้วยความโล่งอก น้ำเสียงของเขาฟังดูผ่อนคลายขึ้นมาก","แม้ว่าตอนนี้ พวกเขาจะได้รับชัยชนะมาอย่างต่อเนื่อง ทั้งศาสนจักรและจักรวรรดิต่างก็ถูกโจมตีจนแตกพ่าย แต่ถึงอย่างนั้น ความแตกต่างของความแข็งแกร่งระดับสูงก็เห็นได้อย่างชัดเจน พวกเขาแค่ใช้เวทมนตร์ระเบิดนิวเคลียร์ในการข่มขวัญ เพื่อรักษาความได้เปรียบเอาไว้ก็เท่านั้น","บรรดาประธานสภาต่างก็รู้ดี ว่าก่อนหน้านี้ลินน์มีโอกาสใช้เวทมนตร์นี้ได้อีกเพียงแค่ครั้งเดียวเท่านั้น หากใช้ไปแล้ว พวกเขาก็จะสูญเสียข้อต่อรองสุดท้ายไป ดังนั้น แฮร์รอฟจึงกังวลอยู่ตลอดเวลา ว่าศาสนจักรจะบุกมาอีก","แต่ตอนนี้ พวกเขามีเชื้อเพลิงนิวเคลียร์สำรองอยู่มากมาย อย่างน้อยพวกเขาก็สามารถทำการตอบโต้ได้อย่างทัดเทียม อย่างเช่น หากถึงเวลาจำเป็น พวกเขาก็สามารถส่งเครื่องบินรบไปทิ้งระเบิดที่เมืองศักดิ์สิทธิ์ได้..."]},{"n":460,"t":"แผนการของข้าเรียบง่ายมาก นั่นก็คือการสร้างดวงอาทิตย์ขึ้นมาบนพื้นดิน!","c":["ปริมาณเชื้อเพลิงนิวเคลียร์สำรองที่เพิ่มขึ้น นับว่าเป็นข่าวดีอย่างไม่ต้องสงสัย บรรดาประธานสภาที่รู้สึกกังวลอยู่ตลอดเวลา ในที่สุดก็สามารถวางใจลงได้","“ข้าได้ยินมาว่า พวกเจ้ายังพบคริสตัลเวทมนตร์จำนวนมาก ภายในถ้ำเหมืองแร่ยูเรเนียมด้วยงั้นรึ?”","แฮร์รอฟเอ่ยถามต่อไป","“ถ้าจะพูดให้ถูก ก็คือมีเหมืองคริสตัลเวทมนตร์ขนาดเล็กซ่อนอยู่ภายในนั้นต่างหาก...”","ลินน์พยายามอธิบายสิ่งที่ได้พบเห็นมาในครั้งนี้ ให้กระชับมากที่สุดเท่าที่จะทำได้ และยังเน้นย้ำถึงการมีอยู่ของ ‘ประตูมิติ’ ด้วย","ในเมื่อดินแดนพ่อมดมีจุดเชื่อมต่อมิติอยู่แห่งหนึ่ง และพวกเขาก็ยังพบจุดเชื่อมต่อมิติอีกแห่ง ภายในถ้ำเหมืองแร่ยูเรเนียม นั่นหมายความว่า ในทวีปแห่งนี้ น่าจะมีจุดเชื่อมต่อมิติแบบนี้อยู่อีกไม่น้อยเลยทีเดียว","แต่สิ่งที่ทำให้ลินน์รู้สึกสับสนอย่างแท้จริง ก็คือพวกมันถูกสร้างขึ้
