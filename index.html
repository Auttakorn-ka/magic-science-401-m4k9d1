ใจไปบ้างแล้ว”","วิกโตริโอส่ายหน้า","แต่อันที่จริง แฮร์รอฟก็ทำหน้าที่ได้รอบคอบมากพอแล้ว ก่อนที่การต่อสู้จะเริ่มขึ้น เขาก็ได้ส่งเรือเหาะส่วนใหญ่ไปสำรวจพื้นที่โดยรอบแล้ว เกรงว่าคงจะไม่มีใครคาดคิดว่ากองทัพที่มีกำลังพลนับหมื่นนาย จะสามารถแอบลักลอบเข้ามาได้อย่างเงียบเชียบแบบนี้","หากเปลี่ยนเป็นตัวเขาเอง ก็เกรงว่าคงจะพลาดท่าเช่นเดียวกัน","“พวกมันทำได้ยังไงกันแน่?”","ออโรร่ารู้สึกสนใจในประเด็นนี้เป็นอย่างมาก สำหรับเธอที่เชี่ยวชาญเวทมนตร์โพลาไรเซชัน ก็สามารถทำให้กองทหารปืนคาบศิลาหลายร้อย หรือแม้แต่หลายพันคนหายไปจากการมองเห็น และเดินทัพได้อย่างลับๆ แต่นั่นมันกองทัพที่มีกำลังพลนับหมื่นนายเลยนะ!","แค่ล่องหนอย่างเดียวยังไม่พอ พวกยักษ์ที่สูงตั้งเจ็ดแปดเมตรเหล่านั้น ทุกย่างก้าวที่พวกมันเหยียบย่ำลงมา คงจะทำให้แผ่นดินสั่นสะเทือนไปหมด มันไม่มีทางที่จะซ่อนตัวได้เลย","“เป็นไปได้ไหมว่าจะเป็นอาณาเขตของพระผู้เป็นเจ้า?”","ลินน์จู่ๆ ก็เอ่ยเตือนขึ้นมา","ในตอนที่เขาปะทะกับเอ็ดเวลล์ที่เมืองหลวง เขาก็สังเกตเห็นแล้วว่า สิ่งนี้มันประหลาดมาก โดยที่ภายในและภายนอกนั้น ราวกับเป็นสองมิติที่แตกต่างกันอย่างสิ้นเชิง","“มีความเป็นไปได้สูงมาก!”","วิกโตริโอพยักหน้า หากเป็นเช่นนั้นจริงๆ มันก็ไม่ใช่เรื่องดีอะไรเลย การที่อีกฝ่ายสามารถขยายอาณาเขตของพระผู้เป็นเจ้าให้กว้างใหญ่ได้ขนาดนี้ นั่นย่อมหมายความว่าความแข็งแกร่งของอีกฝ่าย จะต้องเหนือกว่าที่พวกเขาคาดการณ์เอาไว้มากอย่างไม่ต้องสงสัย","“ปรมาจารย์ลินน์ ก่อนหน้านี้ที่ท่านรั้งท้ายอยู่คนเดียว ก็น่าจะหยั่งเชิงจนรู้ถึงภูมิหลังของอีกฝ่ายมาบ้างแล้วใช่ไหม?”","แฮร์รอฟปรับสีหน้าให้เป็นปกติ ก่อนจะเอ่ยถาม","เวทมนตร์แสงอาทิตย์สาดส่อง ที่ลินน์ร่ายออกมานั้น ทั้งขอบเขตและอานุภาพของมัน แม้แต่ตัวเขาเองก็ยังรู้สึกตื่นตะลึง โดยคนที่สามารถยื่นมือเข้ามาคลี่คลายเวทมนตร์บทนี้ และทำลายร่างจำลองเวทมนตร์ลงได้ในเวลาอันสั้น จะต้องเป็นนักบวชระดับตำนานอย่างแน่นอน","ประธานสภาทั้งสองคนก็หันมามองเช่นกัน โดยเฉพาะออโรร่า ก่อนหน้านี้ตอนที่ได้ฟังแฮร์รอฟเล่าว่าลินน์สามารถหยุดยั้งกองทัพปราบปรามของศาสนจักรได้ด้วยตัวคนเดียว เธอเป็นคนที่ตกใจมากที่สุด","เธออุตส่าห์รีบเร่งบินมาให้ความช่วยเหลืออย่างร้อนรน แต่ผลปรากฏว่าลินน์ที่ใช้แค่ร่างจำลอง กลับสามารถแก้ปัญหานี้ได้แล้ว...","ลินน์ครุ่นคิดอยู่ครู่หนึ่ง ก่อนจะสะบัดมือขวาไปบนโต๊ะ ม่านน้ำชั้นหนึ่งก็ปรากฏขึ้นมาทันที บนนั้นปรากฏภาพของคนสองคน","ชายหนึ่ง หญิงหนึ่ง","ฝ่ายชายมีอายุประมาณห้าสิบปี สวมชุดคลุมสีทอง รูปร่างสูงโปร่ง และมีสีหน้าเคร่งขรึม","“คนนี้คือประธานผู้พิพากษาของศาสนจักรที่ชื่อว่าโจชัว! ก่อนหน้านี้คนที่ปะทะกับข้าที่ทะเลหมอกก็น่าจะเป็นเขานี่แหละ”","ออโรร่าเอ่ยปากระบุตัวตนของหนึ่งในนั้น","บรรดาพ่อมดที่อยู่ในที่นั้นต่างก็พยักหน้า ประธานผู้พิพากษาผู้นี้คือหนึ่งในห้านักบวชระดับตำนานของศาสนจักรที่เป็นที่รู้จักกันดี จึงไม่ใช่เรื่องยากที่จะยืนยันตัวตนของเขา","ส่วนอีกคน...","“สตรีศักดิ์สิทธิ์ลูเซีย ไม่คิดเลยว่านางจะครอบครองพลังระดับตำนานอยู่ด้วย”","แฮร์รอฟเอ่ยด้วยความประหลาดใจเป็นอย่างยิ่ง","ภาพวาดและข้อมูลของบุคคลสำคัญภายในศาสนจักรตั้งแต่ระดับบิชอปขึ้นไป พวกเขาก็ได้รวบรวมเอาไว้ทั้งหมด ซึ่งสตรีศักดิ์สิทธิ์แห่งศาสนจักรก็ย่อมไม่เว้นเช่นกัน","เพียงแต่ตามข้อมูลข่าวสารที่พวกเขาได้รับมา ตำแหน่งสตรีศักดิ์สิทธิ์จะมีการผลัดเปลี่ยนหมุนเวียนทุกๆ ไม่กี่ปี โดยจะมีแม่ชีวัยสิบกว่าปีเป็นผู้รับตำแหน่ง โดยสิ่งเดียวที่พวกนางมีเหมือนกันก็คือ รูปร่างหน้าตาที่งดงามและเยือกเย็น","ไม่ว่าจะมองยังไง ก็ดูเหมือนเป็นแค่ของประดับที่ถูกนำมาวางเอาไว้เบื้องหน้า เพื่อหลอกลวงพวกชาวบ้านยากจนเท่านั้น","แต่บุคคลเช่นนี้ กลับสามารถใช้พลังศักดิ์สิทธิ์ระดับตำนานได้ มันออกจะเกินจริงไปหน่อยแล้ว","ต้องรู้ก่อนว่า พวกเขาต้องใช้เวลาถึงครึ่งชีวิต กว่าจะสามารถบรรลุถึงจุดนี้ได้ด้วยวิธีการลัด แถมยังไม่ได้ก้าวเข้าสู่อาณาจักรระดับตำนานอย่างแท้จริงเลยด้วยซ้ำ...","ช่องว่างความห่างชั้นนี้ มันกว้างใหญ่เสียจนทำให้รู้สึกสิ้นหวังเลยทีเดียว!","“ข้าว่ามันก็คงจะไม่ได้ง่ายดายขนาดนั้นหรอก ไม่อย่างนั้นระดับตำนานของศาสนจักรก็คงจะมีเกลื่อนกลาดไปหมดแล้ว”","วิกโตริโอเอ่ยขัดขึ้นมา","ผู้ที่ได้รับเลือกให้เป็นสตรีศักดิ์สิทธิ์นั้นถูกเปลี่ยนตัวบ่อยมาก ไม่แน่ว่าอาจจะเป็นเพราะพวกนางไม่สามารถแบกรับพลังอันยิ่งใหญ่เช่นนี้ได้ จึงถูกบังคับให้ต้องผลัดเปลี่ยนหมุนเวียนกันไป ส่วนพวกสตรีศักดิ์สิทธิ์รุ่นก่อนๆ ก็หายตัวไปอย่างลึกลับ ซึ่งตามที่ศาสนจักรกล่าวอ้าง พวกนางถูกส่งตัวไปปรนนิบัติพระผู้เป็นเจ้า...แต่มีความเป็นไปได้สูงมากที่พวกนางจะตายไปแล้ว!","“แต่พวกมันกลับส่งระดับตำนานมาแค่สองคนเท่านั้น นี่มันช่าง...”","วิกโตริโอมีสีหน้าแปลกประหลาด บอกไม่ถูกว่าดีใจหรือเสียใจกันแน่","“อาจจะเป็นเพราะยังมีกองกำลังอื่นที่ยังเดินทางมาไม่ถึง แต่ไม่ว่าจะด้วยเหตุผลอะไร นี่ก็ถือว่าเป็นข่าวดีทั้งนั้น!”","สีหน้าของแฮร์รอฟดูผ่อนคลายลงเล็กน้อย","นั่นก็หมายความว่า ในตอนนี้พวกเขามีความได้เปรียบในแง่ของขุมพลังระดับสูงอยู่บ้างแล้ว ทางที่ดีพวกเขาควรจะเป็นฝ่ายบุกโจมตี และอาศัยจังหวะที่กำลังเสริมของอีกฝ่ายยังมาไม่ถึง บดขยี้พวกมันให้พ่ายแพ้ไปในรวดเดียวเลย","ตามการคาดเดาของแฮร์รอฟ เทพจอมปลอมนั่นคือแหล่งพลังของบรรดานักบวชเหล่านี้ ตราบใดที่สามารถจัดการกับต้นตอได้ จักรวรรดิและศาสนจักรก็จะพังทลายลงไปเอง!","กุญแจสำคัญของการต่อสู้ในครั้งนี้ ก็คือการหาวิธีบีบบังคับให้พวกมันเปิดประตูสวรรค์ ในช่วงเวลาที่เหมาะสมให้ได้เท่านั้น","“สถานที่ในการตัดสินแพ้ชนะ ควรจะเปิดโล่งให้ได้มากที่สุด เพื่อหลีกเลี่ยงการโดนลูกหลง”","แฮร์รอฟเอ่ยเสริม","“ถ้าสามารถหลอกล่อให้สตรีศักดิ์สิทธิ์หรือประธานผู้พิพากษาคนนั้นออกมาได้ก็คงจะดี”","บรรดาพ่อมดที่อยู่ในที่นั้นก็เริ่มถกเถียงกันในสองประเด็นนี้ทันที พวกเขาต้องการแผนการที่สมบูรณ์แบบ และแผนรับมือในกรณีที่เกิดเหตุการณ์ไม่คาดฝันขึ้น","ราฟาเอลถึงขั้นเสนอว่า พวกเขาสามารถทำแบบเดียวกับเอ็ดเวลล์ได้ โดยการขุดอุโมงค์ลอบเข้าไปในเมืองน้ำมันดินนั่น โดยพวกเขาจะสร้างสถานการณ์โจมตีหลอกๆ อยู่ด้านนอก แล้วให้ประธานสภาและดาวรุ่งแห่งเวทมนตร์อย่างลินน์ เป็นคนลงมือลอบสังหาร","หากเป็นเช่นนี้ ต่อให้ท้ายที่สุดแล้วเวทมนตร์จะเกิดการควบคุมไม่ได้ ผู้ที่ล้มตายหรือบาดเจ็บก็มีเพียงกองทัพจักรวรรดิและประชาชนที่อยู่ในเมืองเท่านั้น ซึ่งจะไม่ส่งผลกระทบมาถึงพวกเดียวกันอย่างแน่นอน","แฮร์รอฟและคนอื่นๆ ที่เคยได้เห็นอานุภาพของระเบิดนิวเคลียร์มาแล้ว ต่างก็มองหน้ากันและส่ายหน้า เห็นได้ชัดว่าราฟาเอลประเมินค่าเวทมนตร์บทใหม่ที่ลินน์สร้างขึ้นมาต่ำเกินไป หากสิ่งนั้นเกิดการควบคุมไม่ได้ขึ้นมาล่ะก็ อย่าว่าแต่ยืนอยู่หน้าเมืองเลย ต่อให้อยู่ห่างออกไปหลายกิโลเมตร ก็คงจะถูกคลื่นกระแทกฉีกร่างจนเป็นชิ้นๆ อยู่ดี","แต่ถึงอย่างนั้น ข้อเสนอของราฟาเอลก็ยังถือว่าสร้างสรรค์มาก และสามารถนำมาเป็นหนึ่งในแผนสำรองได้","“ปรมาจารย์ลินน์ เจ้าคิดว่ายังไง?”","วิกโตริโอรู้สึกว่าแผนนี้ก็ไม่เลว ตราบใดที่สามารถรับประกันได้ว่าจะไม่มีข้อผิดพลาด และไม่ส่งผลกระทบมาถึงภายนอกก็เพียงพอแล้ว","ลินน์ครุ่นคิดอยู่นาน เขาไม่ได้ตอบคำถามโดยตรง แต่จู่ๆ ก็เอ่ยถามขึ้นมาว่า","“ท่านประธานสภาวิกโตริโอ ที่นี่อยู่ห่างจากแหล่งผลิตน้ำมันดินไกลแค่ไหน?”","“ถ้าข้อมูลที่ข้าได้รับมาไม่ผิดพลาดล่ะก็ ระยะทางเป็นเส้นตรงก็น่าจะประมาณสิบกว่ากิโลเมตร”","วิกโตริโอตอบ","“เอาแผนที่มาให้ข้าดูหน่อย!”","ลินน์ลุกขึ้นยืน ก่อนจะรับม้วนหนังแกะที่พ่อมดยื่นมาให้ โดยพิจารณาลักษณะภูมิประเทศของดินแดนมิสต์อย่างละเอียด และภายในใจก็มีความคิดดีๆ ผุดขึ้นมาอย่างรวดเร็ว"]},{"n":423,"t":"จิตใจของพวกมันล้วนถูกกัดกร่อนด้วยเงินตราไปหมดแล้ว!","c":["ปัง...ปัง...ปัง!","ณ เมืองน้ำมันดิน แห่งดินแดนมิสต์ เสียงระเบิดดังกึกก้องราวกับฟ้าผ่าดังก้องไปทั่วลานฝึกซ้อมอย่างต่อเนื่อง","ทหารจักรวรรดินับสิบนายยืนเรียงแถวหน้ากระดาน แล้วเหนี่ยวไกปืนด้วยความเงอะงะ ซึ่งมีลูกตะกั่วแต่ละนัดพุ่งทะยานออกจากปากกระบอกปืนที่พ่นเปลวไฟออกมา พุ่งตรงเข้าใส่เป้าหมายที่อยู่ห่างออกไปห้าสิบเมตร โดยชุดเกราะที่แข็งแกร่งก็ถูกเจาะทะลุเป็นรูโหว่ในพริบตา และท่อนไม้ที่อยู่ด้านหลังก็ถูกยิงจนแหลกละเอียด","“อานุภาพไม่เลวเลย มิน่าล่ะ กองทัพปราบปรามของจักรวรรดิที่นำโดยเอ็ดเวลล์ ถึงได้พ่ายแพ้ยับเยินด้วยน้ำมือของพวกมัน”","โจชัวมองไปที่ปืนคาบศิลาในมือของทหารเหล่านั้น ก่อนจะเอ่ยด้วยน้ำเสียงทุ้มต่ำ","“เอาไปให้พวกช่างฝีมือดูหรือยัง? พอจะมีวิธีลอกเลียนแบบมันได้ไหม?”","ลูเซียเอ่ยถามด้วยความสนใจ","“ชิ้นส่วนอื่นๆ ของอาวุธชนิดนี้ การจะลอกเลียนแบบไม่ใช่ปัญหาเลย จะมีก็แต่ท่อเหล็กนี่แหละที่พิเศษมาก”","โจชัวดึงปืนคาบศิลากระบอกหนึ่งเข้ามาหาตัว เพียงแค่สะบัดข้อมือ เขาใช้พลังศักดิ์สิทธิ์แยกชิ้นส่วนของมันออก จนเหลือเพียงแค่ลำกล้องปืน","ลูเซียยื่นมือออกไปรับมาพิจารณาดูอย่างละเอียดอยู่ครู่หนึ่ง แต่ก็ไม่พบความผิดปกติใดๆ มันก็เป็นแค่สิ่งประดิษฐ์จากเหล็กกล้าธรรมดาๆ ไม่มีร่องรอยของเวทมนตร์หรือพลังศักดิ์สิทธิ์เลยแม้แต่น้อย","“มันไม่มีรอยแยก แล้วก็ไม่มีร่องรอยของการเชื่อมต่อเลยสักนิด!”","โจชัวเอ่ยเตือนเสียงเบา","ลูเซียชะงักไปครู่หนึ่ง ก่อนจะตระหนักขึ้นมาได้","ช่างฝีมือทั่วไป หากต้องการจะเปลี่ยนแร่เหล็กให้กลายเป็นเหล็กกล้าที่แข็งแกร่ง ก็จะต้องใช้ความร้อนสูงในการหลอมละลาย และต้องผ่านการตีขึ้นรูปนับครั้งไม่ถ้วน","แต่ท่อเหล็กตรงหน้านี้กลับมีความยาวถึงหนึ่งเมตร แต่มีเส้นผ่านศูนย์กลางเพียงแค่ไม่กี่สิบมิลลิเมตรเท่านั้น ดูเหมือนว่ามันจะถูกสร้างขึ้นมาเป็นชิ้นเดียวกันทั้งหมด และภายในนั้นยังมีโครงสร้างที่คล้ายกับเกลียวอยู่อีกด้วย นี่มันน่าทึ่งมากจริงๆ","“เป็นไปได้ไหมว่าจะใช้เวทมนตร์สร้างขึ้นมา?”","คาร์ดินัลซิริดที่อยู่ข้างๆ เอ่ยทักท้วง","“ไม่น่าจะเป็นไปได้หรอก!”","ลูเซียส่ายหน้า","มีเพียงจอมเวทผู้ยิ่งใหญ่เท่านั้นที่จะมีความสามารถในการควบคุมธาตุโลหะได้ การจะสร้างท่อเหล็กแบบนี้ขึ้นมา แม้จะไม่มีปัญหาอะไรเลยก็จริง แต่เท่าที่เธอรู้ จอมเวทผู้ยิ่งใหญ่ของสภาเวทมนตร์ทั้งหมดมีไม่ถึงสามสิบคนด้วยซ้ำ แต่กองทหารปืนคาบศิลากลับมีจำนวนนับหมื่นนาย เพียงแค่อาศัยจอมเวทผู้ยิ่งใหญ่ไม่กี่สิบคน จะต้องใช้เวลาสร้างนานแค่ไหนกันล่ะ?","ถ้าอย่างนั้น แต่ละวันพวกเขาก็ไม่ต้องทำอะไรอย่างอื่นแล้ว เอาแต่นั่งสร้างท่อเหล็กอย่างเดียว แค่คิดก็รู้แล้วว่าเป็นไปไม่ได้ นั่นมันใช้คนเก่งไปทำเรื่องเล็กๆ น้อยๆ เกินไปแล้ว...","ลูเซียครุ่นคิดอยู่ครู่หนึ่ง และคิดว่าน่าจะมีวิธีแก้ปัญหาที่เป็นไปได้อยู่สองวิธี","อย่างเช่น การหาสสารที่มีความแข็งแกร่งเป็นอย่างยิ่ง ไปวางไว้ตรงกลางของเหล็กหลอมเหลว แล้วค่อยนำไปตีขึ้นรูป หรือไม่ก็เตรียมแม่พิมพ์เอาไว้ แล้วเทเหล็กหลอมเหลวลงไป","หลังจากที่ลูเซียพูดจบ โจชัวก็เอ่ยบอกเธออย่างอ้อมๆ ว่า ช่างฝีมือเหล่านั้นก็ได้ลองใช้วิธีที่คล้ายคลึงกันนี้ไปหมดแล้ว!","ผลปรากฏว่าท่อเหล็กที่สร้างออกมานั้นไม่ได้มาตรฐานเลย เมื่อนำกลับไปประกอบเข้ากับปืนคาบศิลา ความแม่นยำก็ลดลงอย่างมาก และมีปืนกระบอกหนึ่งที่เกิดระเบิดขึ้นมาเลยด้วยซ้ำ","ลูเซียรู้สึกประหลาดใจไม่น้อย ดูเหมือนว่าพวกพ่อมดจะสร้างสิ่งที่น่าสนใจขึ้นมาได้จริงๆ สินะ","“แล้วเชลยศึกพวกนั้นล่ะ? พวกเขาก็ไม่รู้เรื่องงั้นหรือ?”","การต่อสู้ในครั้งนี้ นอกจากจะยึดปืนคาบศิลามาได้เป็นจำนวนมากแล้ว พวกเขายังจับกุมทหารปืนคาบศิลามาได้อีกหลายร้อยคน ซึ่งวิธีการใช้ปืนคาบศิลานั้น ก็ได้มาจากการค้นความทรงจำของคนพวกนี้นี่แหละ","“ก่อนหน้านี้ พวกเขาเป็นเพียงแค่ชาวนาชาวประมงที่ยากจนเท่านั้น ทำเป็นแค่ใช้งาน แต่ไม่รู้เรื่องวิธีการสร้างอาวุธชนิดนี้เลยแม้แต่น้อย”","พูดถึงตรงนี้ โจชัวก็ชะงักไปครู่หนึ่ง ก่อนจะเอ่ยต่อ","“จิตใจของคนพวกนี้ล้วนถูกปีศาจร้ายกัดกร่อนไปหมดแล้ว เว้นเสียแต่ว่าจะใช้วิธีการบังคับ ไม่อย่างนั้นก็คงจะเค้นข้อมูลอะไรจากปากของพวกเขาไม่ได้เลย...”","“ไม่มีข้อยกเว้นเลยงั้นหรือ?”","ลูเซียเลิกคิ้วขึ้น ตามหลักแล้ว ในจำนวนคนหลายร้อยคนนี้ ก็น่าจะมีพวกขี้ขลาดอยู่บ้างสิ","“ไม่มีข้อยกเว้นเลย!”","โจชัวเอ่ยด้วยน้ำเสียงจริงจัง","เขาได้ค้นความทรงจำของคนพวกนี้มาแล้ว และพอจะเดาสาเหตุได้บ้างแล้ว","ก่อนหน้านี้ ทหารปืนคาบศิลาเหล่านี้ ล้วนเป็นเพียงชาวบ้านยากจนที่ต้องทนทุกข์ทรมานจากความหิวโหยและความหนาวเหน็บ ซึ่งส่วนใหญ่ก็ล้วนแต่มีครอบครัวกันทั้งนั้น การได้เข้าร่วมกองทหารปืนคาบศิลา คงต้องใช้คำว่าตกถังข้าวสารมาอธิบายเท่านั้น!","เพราะข้อเสนอที่สภาเวทมนตร์หยิบยื่นให้นั้นสูงมาก ตราบใดที่ได้เป็นทหารปืนคาบศิลา ในแต่ละเดือนก็จะได้รับเงินสิบห้าถึงยี่สิบเหรียญเงิน และได้ใช้ชีวิตแบบที่มีเนื้อกินทุกมื้อ","หากต้องมาสังเวยชีวิตในสนามรบ ก็ยังจะได้รับเงินชดเชยก้อนโต พร้อมครอบครัวที่จะได้รับการดูแลอย่างดี และถูกส่งตัวไปทำงานในโรงงาน","สวัสดิการแบบนี้ มันสูงยิ่งกว่ากองกำลังรักษาพระองค์ที่เก่งกาจที่สุดของจักรวรรดิเสียอีก แทบจะเทียบเท่ากับกองทัพทัณฑ์ศักดิ์สิทธิ์อยู่แล้ว ดังนั้น ทหารปืนคาบศิลาส่วนใหญ่ จึงตกอยู่ในสภาวะที่คล้ายกับความคลั่งไคล้ในศรัทธา โดยที่จิตใจของพวกมันล้วนถูกกัดกร่อนด้วยเงินตราไปหมดแล้ว","คงพูดได้เพียงแค่ว่า เพื่อรับมือกับการปราบปรามของจักรวรรดิ พวกพ่อมดเองก็ทุ่มทุนสร้างไปไม่น้อยเลยทีเดียว","ในระหว่างที่ทั้งสองคนกำลังปรึกษาหารือกันอยู่นั้น ทหารจักรวรรดิที่กำลังสาธิตการใช้ปืนคาบศิลา ก็สามารถบรรจุกระสุนเสร็จอย่างยากลำบาก และทำการยิงพร้อมกันอีกครั้ง จนทำให้เป้าหมายตรงหน้าแหลกละเอียด","“การบรรจุกระสุนต้องใช้เวลามากกว่าหนึ่งนาที ข้าว่านะ อาวุธของพวกพ่อมดก็คงมีดีแค่นี้แหละ...เมื่ออยู่บนสนามรบ มันยังไม่มีประโยชน์เท่ากับพลธนูหนึ่งคนเลยด้วยซ้ำ”","เมื่อเห็นว่านายท่านทั้งสองให้ความสนใจกับสิ่งประดิษฐ์ของปีศาจร้ายที่เรียกว่าปืนคาบศิลามากขนาดนี้ ซิริดก็อดไม่ได้ที่จะเอ่ยปาก","ในฐานะบิชอปฝ่ายอนุรักษ์นิยม ซิริดมักจะระแวดระวังอาวุธเวทมนตร์เหล่านี้อยู่เสมอ และตามกฎของศาสนจักร ทันทีที่พบเห็น การทำลายพวกมันทิ้งต่างหาก คือสิ่งที่สมควรทำมากที่สุด","ยิ่งไปกว่านั้น การที่ต้องใช้เวลามากกว่าหนึ่งนาที เพื่อยิงกระสุนออกมาเพียงแค่นัดเดียวนั้น ถือเป็นจุดอ่อนที่ร้ายแรงมาก หากยิงพลาดไปเพียงแค่นัดเดียว หลังจากนั้นก็จะไม่มีความสามารถในการตอบโต้เลย","ซิริดมั่นใจว่า ต่อให้เขาจะต้องเผชิญหน้ากับกองทหารปืนคาบศิลาทั้งกองทัพ เขาก็ยังมีวิธีอีกนับร้อยวิธีที่จะสังหารอีกฝ่าย หรือแม้แต่จะปั่นหัวพวกมันเล่นก็ยังได้","แน่นอนว่าโจชัวเองก็รู้ถึงจุดอ่อนของสิ่งประดิษฐ์ชิ้นนี้ดี แต่มันก็ยังไม่สามารถปกปิดข้อดีของปืนคาบศิลาได้อยู่ดี","“เจ้ารู้ไหมว่าการจะฝึกฝนพลธนูของจักรวรรดิให้ได้มาตรฐานนั้น ต้องใช้เวลานานแค่ไหน?”","“ก็น่าจะ...ครึ่งปีได้กระมัง?”","ซิริดตอบด้วยความลังเล","“มันคือสามถึงห้าปีต่างหากล่ะ!”","โจชัวเอ่ยแก้ไข","“และข้อกำหนดสำหรับบุคลากรก็ยังเข้มงวดมากอีกด้วย จำเป็นต้องคัดเลือกจากทหารที่มีร่างกายแข็งแรงกำยำเท่านั้น”","“แต่พวกเขาใช้เวลาเพียงแค่สองถึงสามชั่วโมง ในการเรียนรู้วิธีการใช้ปืนคาบศิลา!”","โจชัวชี้ไปที่ทหารจักรวรรดิ ที่กำลังทดสอบอาวุธอยู่","และที่สำคัญที่สุดก็คือ ปืนคาบศิลาเจาะเกราะได้ดีมาก ซึ่งเป็นจุดที่หน้าไม้และธนูไม่สามารถเทียบได้เลย","ในการต่อสู้ที่ผ่านๆ มา อัศวินที่สวมชุดเกราะชั้นดี สามารถพุ่งทะยานเข้าฟาดฟันศัตรูในสนามรบได้อย่างอิสระ โดยที่ลูกธนูเพียงเล็กน้อยไม่สามารถเจาะทะลุการป้องกันเข้ามาได้เลย","แต่สถานการณ์ในตอนนี้มันเปลี่ยนไปแล้ว เกรงว่าปืนคาบศิลาเพียงแค่นัดเดียว ก็สามารถปลิดชีพพวกเขาได้แล้ว!","พัฒนาการเช่นนี้ ช่างน่าสะพรึงกลัวอย่างไม่ต้องสงสัย!","นั่นก็หมายความว่า พวกพ่อมดเพียงแค่ไปสุ่มจับชาวบ้านยากจนตามท้องถนนมาสักคน แล้วฝึกฝนพวกเขาเพียงไม่กี่ชั่วโมง อีกฝ่ายก็มีโอกาสที่จะสังหารอัศวิน ที่ฝึกฝนฝีมือมาอย่างหนักนานนับสิบปีในสนามรบได้!","“จากรายงานของอัศวินทัณฑ์ศักดิ์สิทธิ์หลายนาย พวกพ่อมดได้นำปืนคาบศิลาชนิดพิเศษ ไปติดตั้งเอาไว้บนกล่องเหล็กที่วิ่งได้ ซึ่งมันสามารถยิงกระสุนออกไปได้หลายสิบนัดภายในหนึ่งวินาที ต่อให้เป็นบิชอป ก็คงจะถูกฉีกร่างเป็นชิ้นๆ ได้ในทันที”","โจชัวเอ่ยด้วยสีหน้าเคร่งเครียด","เห็นได้ชัดว่าพวกพ่อมดได้ค้นพบวิธีเอาชนะจุดอ่อนของปืนคาบศิลาแล้ว เพียงแต่ยังไม่ได้นำมาใช้งานในสเกลใหญ่ก็เท่านั้น"]},{"n":424,"t":"เสียงคำรามของมังกรไฟ วิธีรับมือกับเรือเหาะ","c":["หลังจากได้ฟังคำอธิบายของโจชัว ซิริดก็เพิ่งจะตระหนักได้ถึงความน่าสะพรึงกลัวของอาวุธชนิดใหม่นี้ เหงื่อเย็นๆ ผุดพรายขึ้นบนหน้าผากของเขา ก่อนจะรีบเอ่ยขึ้นมา","“พวกเราจะรอช้าต่อไปไม่ได้แล้ว ต้องรีบส่งสมุนของปีศาจร้ายพวกนี้ลงนรกไปให้หมดเดี๋ยวนี้เลย!”","ซิริดไม่อาจจินตนาการได้เลยว่า หากปล่อยให้พวกพ่อมดเหล่านี้พัฒนาต่อไป อีกฝ่ายจะสามารถสร้างอาวุธเวทมนตร์ที่ทรงพลังมากขนาดไหนออกมาได้อีก","“รู้อย่างนี้ ก่อนหน้านี้พวกเราน่าจะไล่ตามพวกมันต่อไป”","ซิริดเอ่ยด้วยความเสียดาย พวกเขาอุตส่าห์คว้าชัยชนะครั้งใหญ่มาได้จากการโจมตีสายฟ้าแลบ แต่กลับไม่ได้ฉวยโอกาสกวาดล้างพวกมันให้สิ้นซาก","ตอนนี้หากจะบุกโจมตีอีกครั้ง ก็เห็นได้ชัดว่าพวกเขาจะต้องสูญเสียอย่างหนักแน่ๆ","“ไม่ต้องกังวลไปหรอกซิริด ภายใต้พลังอำนาจอันยิ่งใหญ่ของพระผู้เป็นเจ้า การต่อต้านใดๆ ก็ล้วนแต่เปล่าประโยชน์ทั้งนั้น!”","โจชัวเอ่ยปลอบใจ","ที่พวกเขาปล่อยให้กองทัพของพวกพ่อมดแตกพ่ายและหนีไปได้ ด้านหนึ่งเป็นเพราะกองทัพปราบปรามบาดเจ็บล้มตายอย่างหนัก และขวัญกำลังใจก็ตกต่ำลง แต่อีกด้านหนึ่งก็เป็นความตั้งใจของพวกเขาเอง ที่จะใช้กองทัพนี้เป็นเหยื่อล่อ เพื่อดึงดูดกองกำลังหลักของพวกพ่อมดให้ตามมา","เขารู้ดีว่า เมื่อสตรีศักดิ์สิทธิ์ทุ่มเทกำลังอย่างเต็มที่ สิ่งที่เรียกว่าอาวุธชนิดใหม่เหล่านั้น ก็จะกลายเป็นเหมือนของเล่นที่น่าขันไปเลย","เพียงแต่หลังจากจบการต่อสู้ ร่างนี้ก็จะไม่สามารถใช้งานได้อีก และจำเป็นต้องเปลี่ยนร่างใหม่ ซึ่งจะต้องใช้เวลาอีกหลายปีในการฟื้นฟูพลัง","“ท่านลูเซีย พลังศักดิ์สิทธิ์ที่ท่านต้องการ ถูกจัดเตรียมเอาไว้เรียบร้อยแล้วเจ้าค่ะ!”","แม่ชีคนหนึ่งเดินเข้ามาจากนอกลานฝึกซ้อม ก่อนจะกระซิบที่ข้างหูของสตรีศักดิ์สิทธิ์อย่างนอบน้อม","ลูเซียพยักหน้า เพียงแค่ใช้ความคิด ท่อเหล็กไร้รอยต่อในมือก็ถูกสลายให้กลายเป็นธาตุพื้นฐาน ตราบใดที่สามารถกวาดล้างสภาเวทมนตร์ได้สำเร็จ เธอก็จะได้รับวิธีการสร้างและเทคนิคการใช้อาวุธชนิดใหม่ทั้งหมดมาอย่างแน่นอน","นี่แหละคือวิธีที่รวดเร็วที่สุด!","คนหลายคนเดินออกจากลานฝึกซ้อมไปด้วยกัน และไม่นานก็ก้าวเข้าไปในมหาวิหารแห่งดินแดนมิสต์","แกรนด์ดยุกผู้ปกครองดินแดนแห่งนี้ ในช่วงไม่กี่ปีที่ผ่านมา อาศัยการขุดเจาะน้ำมันดินจนร่ำรวยมหาศาล และเพื่อแสดงให้เห็นถึงความศรัทธาที่เขามีต่อพระผู้เป็นเจ้า โบสถ์แห่งนี้จึงถูกสร้างขึ้นมาอย่างใหญ่โตโอ่อ่า และดูเคร่งขรึมสง่างามเป็นอย่างมาก","ที่จัตุรัสหน้าโบสถ์ บิชอปกว่าร้อยคนกำลังยืนล้อมวงกันอยู่ที่นี่ ในมือของพวกเขาถือพระคัมภีร์ และกำลังสวดภาวนาอยู่","รอบๆ ตัวพวกเขามีเสาสีทองต้นใหญ่ตั้งตระหง่านอยู่ และที่ใต้เท้าของพวกเขาก็คือวงเวทศักดิ์สิทธิ์ขนาดมหึมา ที่ถูกสลักเอาไว้ด้วยลวดลายอันซับซ้อน","ลูเซียเดินเข้าไปยืนอยู่ตรงกลางวงเวทศักดิ์สิทธิ์","“สรรเสริญพระผู้เป็นเจ้า เทพเจ้าผู้ยิ่งใหญ่และเป็นนิรันดร์...”","“ความรุ่งโรจน์ของพระองค์สาดส่องไปทั่วทั้งทวีป แม้แต่หมู่ดาวก็ยังต้องหมองหม่น!”","ท่ามกลางบทเพลงสรรเสริญอันเปี่ยมไปด้วยความศรัทธาของบรรดาบิชอป รูปปั้นของพระผู้เป็นเจ้าภายในโบสถ์ ก็เปล่งแสงสีทองอันอ่อนโยนออกมา จากนั้นแสงแบบเดียวกันก็ปรากฏขึ้นบนร่างของลูเซีย","ตามมาด้วยคลื่นความผันผวนของพลังศักดิ์สิทธิ์อันรุนแรง ที่เริ่มแผ่ขยายออกไปโดยรอบ วงเวทศักดิ์สิทธิ์ที่สลักอยู่บนพื้นราวกับมีชีวิตขึ้นมา มิติบนพื้นดินเริ่มบิดเบี้ยว ก้อนอิฐที่เรียงรายอย่างเป็นระเบียบหายไปจากสายตาของทุกคนโดยสิ้นเชิง","พื้นที่ภายในวงเวทศักดิ์สิทธิ์ทั้งหมด กลายเป็นม่านสีดำทึบอย่างรวดเร็ว และมันก็กำลังกระเพื่อมไปมา ราวกับคลื่นน้ำอย่างไม่หยุดหย่อน","วินาทีต่อมา กรงเล็บแหลมคมขนาดมหึมาอันน่าสะพรึงกลัว ก็โผล่ขึ้นมาจากขุมนรกอันมืดมิดไร้ก้นบึ้ง ตามมาด้วยร่างสีแดงฉานที่ราวกับถูกหล่อหลอมขึ้นมาจากลาวา กลิ่นอายอันทรงพลังของมัน ทำให้ทุกคนที่อยู่ในเหตุการณ์ถึงกับต้องกลั้นหายใจโดยไม่รู้ตัว","เมื่อสัตว์ประหลาดตัวนี้ปีนขึ้นมาจนสุด ซิริดก็เพิ่งจะมองเห็นได้อย่างชัดเจนว่า มันคือมังกรไฟลาวา!","ในขณะเดียวกัน โซ่พลังศักดิ์สิทธิ์ก็พุ่งออกมาจากเสาที่อยู่รอบๆ และพันธนาการร่างอันใหญ่โตของมังกรเอาไว้แน่น","“โฮก~”","มังกรไฟลาวาดิ้นรนอย่างรุนแรง โซ่พลังศักดิ์สิทธิ์ถูกดึงจนเกิดเสียงดังเคร้งคร้าง แต่ยิ่งมันดิ้นรนมากเท่าไหร่ โซ่ที่พันธนาการมันเอาไว้ก็จะยิ่งรัดแน่นมากขึ้นเท่านั้น","หลังจากพยายามอยู่หลายครั้ง มังกรไฟลาวาก็ล้มเลิกความตั้งใจนี้ ดวงตาอันดุร้ายที่มีขนาดเท่ากำปั้นของมัน ก็จ้องเขม็งไปที่ลูเซียซึ่งลอยตัวอยู่เหนือม่านสีดำ ก่อนจะอ้าปากพ่นลมหายใจอันร้อนระอุออกมา...","ลมหายใจมังกรนี้รุนแรงเป็นอย่างมาก ราวกับว่ามิติทั้งหมดกำลังจะถูกแผดเผา คลื่นความร้อนที่แผ่ซ่านออกมา ถึงกับทำให้ซิริดนึกย้อนไปถึงลำแสงอันร้อนระอุที่พุ่งลงมาจากฟากฟ้าในสนามรบ!","“ท่านลูเซีย!”","ซิริดตะโกนออกมาด้วยความหวาดกลัว แต่หลังจากนั้นเขาก็พบว่า ความกังวลของเขาช่างเป็นเรื่องที่ไร้สาระสิ้นดี เพราะก่อนที่ลมหายใจมังกรอันรุนแรงนั้นจะพุ่งไปถึงตัวสตรีศักดิ์สิทธิ์ ความรุนแรงของมันก็เริ่มลดลงอย่างรวดเร็ว","“มังกรสายพันธุ์ย่อย สมกับที่ไม่มีสมองจริงๆ”","ลูเซียยกมือขึ้น เปลวเพลิงก็ดับลงในพริบตา มังกรไฟลาวาทั้งตัวราวกับถูกใครบางคนบีบคอเอาไว้ มันส่งเสียงคำรามในลำคอด้วยความเจ็บปวด","โซ่พลังศักดิ์สิทธิ์ที่พันธนาการร่างของมังกรเอาไว้ ก็เริ่มหลอมละลาย และจมลงไปในเกล็ดมังกรสีแดงฉาน...","เมื่อเห็นว่าลูเซียสามารถปราบมังกรไฟลาวาที่ถูกอัญเชิญข้ามมิติมาได้อย่างง่ายดาย ซิริดก็อดไม่ได้ที่จะถอนหายใจออกมาอย่างโล่งอก ในขณะเดียวกัน ทัศนคติที่เขามีต่อสตรีศักดิ์สิทธิ์ที่ศาสนจักรคัดเลือกมา ก็เปลี่ยนไปอย่างมาก จากที่เคยเชื่อฟังเพียงเพราะตำแหน่งของนาง ตอนนี้เขากลับรู้สึกยำเกรงและอิจฉาจากก้นบึ้งของหัวใจ","การที่อีกฝ่ายมีพละกำลังเช่นนี้ได้ ย่อมต้องได้รับพรจากพระผู้เป็นเจ้าอย่างแน่นอน!","บรรดาแม่ชีที่อยู่รอบๆ ก็มีสีหน้าเลื่อมใสศรัทธาเช่นกัน โดยวาดฝันเอาไว้ว่า สักวันหนึ่งตัวเองจะถูกพระผู้เป็นเจ้าเลือกบ้าง เพื่อที่จะได้ก้าวขึ้นสู่จุดสูงสุด และกลายเป็นสตรีศักดิ์สิทธิ์แห่งศาสนจักร","หลังจากที่จัดการกับมังกรไฟลาวาผู้ดุร้ายตัวนี้จนสิ้นฤทธิ์ ลูเซียก็สร้างอัญมณีรูปมังกรขึ้นมา และยื่นมันให้กับซิริดที่อยู่ข้างๆ","“เจ้าเป็นคนควบคุมมันก็แล้วกัน!”","อัญมณีเม็ดนี้ถูกสร้างขึ้นมาจากพลังของเธอ ซึ่งมันเชื่อมต่อกับพลังศักดิ์สิทธิ์ที่ใช้พันธนาการมังกรไฟลาวาเอาไว้ ทำให้สามารถออกคำสั่งกับมันได้","“ขอบพระคุณในความไว้วางใจของท่าน ท่านลูเซีย!”","ซิริดรับมันมาด้วยความปลาบปลื้มใจ","เขาย่อมเข้าใจดีว่า การที่สตรีศักดิ์สิทธิ์ต้องทุ่มเทแรงกายแรงใจมากมาย เพื่ออัญเชิญมังกรไฟลาวาข้ามมิติมาเช่นนี้ จุดประสงค์ก็ชัดเจนอยู่แล้วว่า ต้องการจะใช้มันจัดการกับเรือเหาะพวกนั้น!","ก่อนหน้านี้ซิริดเคยได้ยินมาว่า สิ่งประดิษฐ์เล่นแร่แปรธาตุขนาดมหึมาชนิดนี้ มีความคล่องตัวสูงมาก โดยมีความเร็วที่สูงกว่าร้อยกิโลเมตรต่อชั่วโมง และยังสามารถยิงลำแสงที่ทรงพลังออกมา ทำลายล้างอัศวินกริฟฟอนไปหลายร้อยนาย ซึ่งคือขุมกำลังทางอากาศที่สำคัญที่สุด ในมือของพวกพ่อมด","หากไม่หาทางยับยั้ง เรือเหาะกว่าร้อยลำ ก็เพียงพอที่จะบดขยี้กองทัพปราบปรามทั้งหมดให้พ่ายแพ้ราบคาบได้","แต่ตอนนี้ สถานการณ์มันเปลี่ยนไปแล้ว เมื่อมีมังกรไฟลาวาตัวนี้คอยให้ความช่วยเหลือ มังกรสายพันธุ์ย่อยระดับสูงชนิดนี้ ไม่เพียงแต่จะมีความเร็วที่เหนือกว่าเรือเหาะเท่านั้น แต่ลมหายใจมังกรและเวทมนตร์ประจำเผ่าพันธุ์ของมัน ก็ยังสามารถรับมือกับการต่อสู้กลางเวหาได้อย่างสบายๆ อีกด้วย","เรือเหาะที่มีขนาดใหญ่ และมีความเร็วในการเลี้ยวหลบหลีกที่เชื่องช้า เมื่ออยู่ต่อหน้ามังกรไฟลาวา ก็เป็นแค่เป้านิ่งที่มีชีวิตเท่านั้น","“แล้วทหารของพวกเราล่ะเป็นยังไงบ้าง? พวกเขาฟื้นตัวกันหรือยัง?”","ลูเซียหันไปมองโจชัวที่อยู่ข้างๆ ก่อนจะเอ่ยถาม","“เรียนท่านสตรีศักดิ์สิทธิ์ หลังจากผ่านการชำระล้างด้วยพลังศักดิ์สิทธิ์ของบรรดานักบวช พวกเขาก็สามารถเอาชนะความหวาดกลัวที่มีต่อเวทมนตร์เหล่านั้นได้แล้วครับ”","โจชัวตอบ","“ในเมื่อเป็นเช่นนั้น คืนนี้ก็ออกเดินทางกันเลยเถอะ!”","ลูเซียเอ่ยอย่างเด็ดขาด","ลำแสงที่พุ่งทะลวงสวรรค์และปฐพีในตอนเที่ยงวันนั้น ได้ฝังรากลึกอยู่ในความทรงจำของเธอ แม้ว่าลูเซียจะเข้าใจถึงหลักการของเวทมนตร์บทนี้ และหาวิธีรับมือเอาไว้ได้แล้ว แต่การกระทำที่มีเหตุผลที่สุด ก็ย่อมต้องเป็นการหลีกเลี่ยงจุดแข็งของศัตรู และไม่เปิดโอกาสให้อีกฝ่ายได้ใช้งานมันอีก"]},{"n":425,"t":"การโจมตีสายฟ้าแลบของศาสนจักรและกองกำลังรักษาการณ์ที่พ่ายแพ้","c":["เที่ยงคืน ณ ดินแดนมิสต์ กองทัพปราบปรามของจักรวรรดิจำนวนห้าหมื่นนาย ภายใต้การปกปิดของพลังศักดิ์สิทธิ์ระดับตำนานอย่าง ‘อาณาเขตมายา’ ก็ได้เดินทางมาถึงหน้ากำแพงเมืองอย่างเงียบเชียบ","“ดูเหมือนว่าพวกพ่อมดจะมีฝีมืออยู่บ้างเหมือนกันนะ!”","โจชัวมองไปที่กำแพงเมืองอันสูงตระหง่านตรงหน้า ก่อนจะพึมพำกับตัวเองเบาๆ","ตอนที่เขามาเยือนที่นี่เมื่อครั้งก่อน เมืองเล็กๆ ในดินแดนชายแดนแห่งนี้ มีเพียงกำแพงเตี้ยๆ ที่สูงไม่ถึงสามเมตรเท่านั้น แต่ตอนนี้สิ่งที่ปรากฏอยู่ตรงหน้าพวกเขากลับเป็นกำแพงอันแข็งแกร่งที่สูงถึงเจ็ดเมตร","พวกพ่อมดใช้เวลาเพียงแค่ครึ่งวัน ก็สามารถใช้เวทมนตร์สร้างปาฏิหาริย์เช่นนี้ได้สำเร็จ!","บนกำแพงเมือง มีกองไฟลุกโชนสว่างไสว ทำให้พอมองเห็นทหารยามกว่าพันห้าร้อยนายกำลังประจำการอยู่บนนั้น ดูเหมือนว่าพวกเขาจะยังไม่พบร่องรอยของพวกโจชัว","จำนวนทหารยามมีน้อยกว่าที่โจชัวคาดการณ์เอาไว้มาก แต่เมื่อนึกถึงการต่อสู้ก่อนหน้านี้ กองทหารปืนคาบศิลาก็บาดเจ็บล้มตายอย่างหนักเช่นกัน และตอนนี้ คนส่วนใหญ่ก็น่าจะกำลังรักษาตัวอยู่ ประกอบกับพวกที่ต้องคอยเฝ้าพื้นที่อื่นๆ ภายในเมือง และทหารปืนคาบศิลาที่ประจำการอยู่ด้านในแล้ว จำนวนเท่านี้ก็ถือว่าสมเหตุสมผลอยู่","มุมปากของโจชัวยกขึ้นเป็นรอยยิ้มเย็นชา พวกพ่อมดคงจินตนาการไม่ถึงหรอกว่า พวกเขาจะใช้เวลาเพียงแค่สิบชั่วโมงในการฟื้นฟูกำลังรบให้กับทหารของจักรวรรดิ และบุกโจมตีสายฟ้าแลบในยามวิกาลเช่นนี้","“ท่านลูเซีย ท่านประธานผู้พิพากษา จะเริ่มโจมตีเลยไหมครับ?”","ซิริดเอ่ยถามอย่างนอบน้อม","ระยะห่างเจ็ดร้อยเมตรนี้คือขีดจำกัดแล้ว หากขยับเข้าไปใกล้กว่านี้ ต่อให้พวกเขาจะอยู่ภายในอาณาเขตมายา ก็จะต้องถูกจับได้อย่างแน่นอน!","ส่วนมังกรไฟลาวาตัวนั้น ซิริดให้มันรออยู่ห่างออกไปห้ากิโลเมตร และจะให้มันบินเข้ามาเมื่อการต่อสู้เริ่มต้นขึ้น เพื่อป้องกันไม่ให้พวกพ่อมดสัมผัสได้ถึงตัวมันเสียก่อน","ลูเซียยื่นมือขวาออกไป แสงศักดิ์สิทธิ์อันไร้ขอบเขตก็มารวมตัวกันที่ฝ่ามือ ก่อนจะหดตัวลงจนกลายเป็นทรงกลมขนาดเท่าหัวแม่มือ แล้วพุ่งตรงไปยังกำแพงเมืองที่สูงตระหง่านซึ่งอยู่ห่างออกไปเจ็ดร้อยเมตร","ทหารที่อยู่บนกำแพงเมืองมองเห็นเพียงแค่แสงหิ่งห้อยสว่างจ้าดวงหนึ่ง กำลังลอยเข้ามาหาท่ามกลางความมืดมิดของรัตติกาลด้วยความเร็วสูงลิ่ว ระยะทางเจ็ดร้อยเมตรนั้น ราวกับถูกย่นย่อให้มาถึงในพริบตา!","และยังไม่ทันที่พวกเขาจะได้ส่งเสียงร้อง แสงสว่างจ้าดวงนั้นก็ขยายตัวขึ้นอย่างรวดเร็ว ก่อนจะระเบิดออก!","ตู้ม!","เสียงระเบิดดังกึกก้องจนแสบแก้วหูดังไปทั่วทั้งเมือง กำแพงอันสูงใหญ่พังทลายลง ภายใต้แรงกระแทกของระเบิดอันรุนแรง ประตูเมืองถูกระเบิดจนเปิดออก เศษหินปลิวว่อนไปทั่ว ก่อตัวเป็นม่านหมอกราวกับสายฝนที่โปรยปรายอยู่เต็มท้องฟ้า","ทหารยามหลายสิบนายที่กำลังลาดตระเวนอยู่บนกำแพงเมือง ถูกแรงกระแทกจากการระเบิดซัดจนกระเด็นล้มลงไปกองกับพื้น เลือดสาดกระเซ็น เสียงกรีดร้องและเสียงโอดครวญดังกึกก้องไม่ขาดสาย...","ในวินาทีที่ลูเซียลงมือ ‘อาณาเขตมายา’ ก็พังทลายลงในพริบตา อัศวินทัณฑ์ศักดิ์สิทธิ์นับหมื่นนายต่างก็โห่ร้องว่า ‘เพื่อความรุ่งโรจน์ของพระผู้เป็นเจ้า!’ แล้วควบม้าพุ่งทะยานเข้าไปในประตูเมืองที่เปิดอ้า ดาบโค้งและดาบยาวที่ถูกเงื้อขึ้นสูง ฟาดฟันเหล่าทหารยามภายในเมืองจนล้มลงไปกองกับพื้นทีละคน!","อาจเป็นเพราะจังหวะที่พวกเขาลงมือนั้นกะทันหันเกินไป ศัตรูจึงยังไม่ทันได้ตั้งตัว หรือไม่ก็เป็นเพราะขวัญกำลังใจของคนพวกนี้ถูกบดขยี้ไปตั้งแต่การต่อสู้เมื่อตอนเที่ยงวัน และยังไม่ทันได้ฟื้นตัวกลับมา ภายใต้การบุกโจมตีในครั้งนี้ กองทัพปราบปรามของศาสนจักรจึงสามารถบุกเข้าไปในเมืองได้ โดยที่ไม่พบเจอกับอุปสรรคใดๆ เลย!","มันราบรื่นเกินไปแล้ว...ภายในใจของโจชัวเกิดความรู้สึกไม่สบายใจอย่างรุนแรง หลังจากที่บุกเข้ามาในเมืองได้ พวกเขาก็พบว่ามีคบเพลิงถูกจุดเอาไว้ตามท้องถนนทุกแห่งหน และมีทหารยามประจำการอยู่ไม่น้อย แต่พวกเขากลับไม่พบเจอกับการสกัดกั้นที่มีประสิทธิภาพเลยแม้แต่น้อย!","ไม่มีการเรียงแถวยิงปืนคาบศิลา ไม่มีปืนใหญ่ และไม่มีพ่อมด!","ทั่วทั้งเมือง ‘เงียบสงัด’ มีเพียงเสียงกรีดร้องด้วยความหวาดกลัวของเหล่าทหารยามที่แตกตื่นและวิ่งหนีไปคนละทิศคนละทางเท่านั้น","มันน่าขนลุกเสียจนทำให้รู้สึกหวาดกลัว!","“นี่มันเกิดอะไรขึ้นกันแน่?”","ซิริดรู้สึกงุนงงเป็นอย่างมาก เขาไม่เข้าใจสถานการณ์ที่เกิดขึ้นเลยจริงๆ","ศัตรูของพวกเขาล่ะ? พวกพ่อมดอยู่ที่ไหนกัน?","ในขณะที่ทุกคนกำลังสงสัยอยู่นั้น อัศวินทัณฑ์ศักดิ์สิทธิ์ที่ห้าวหาญกลุ่มหนึ่ง ก็จับตัวหัวหน้าทหารยามมาได้","เขาเป็นชายวัยกลางคนอายุราวๆ สามสิบปี รูปร่างค่อนข้างผอมบาง แต่แก้มกลับดูอวบอิ่มเล็กน้อย เขาก้มกราบลงบนพื้นด้วยใบหน้าที่เต็มไปด้วยความหวาดกลัว ก่อนจะโขกศีรษะลงกับพื้นซ้ำแล้วซ้ำเล่า และเอ่ยด้วยน้ำเสียงสั่นเครือ","“ท่านบิชอป ข้าขอยอมจำนน...ข้าขอยอมจำนน! ขอความกรุณาท่านโปรดยกโทษให้กับบาปของข้าด้วย เป็นเพราะพวกพ่อมดบัดซบนั่นร่ายคำสาปใส่พวกเรา และบังคับให้พวกเราช่วยพวกมันปกป้องเมืองแห่งนี้...”","“พอได้แล้ว!”","โจชัวเอ่ยขัดคำแก้ตัวของชายคนนั้น ก่อนจะเอ่ยถามด้วยน้ำเสียงเย็นชา","“บอกข้ามาสิว่า พวกพ่อมดอยู่ที่ไหน?”","“พวกมัน...พวกมันเพิ่งจะโดยสารสิ่งปลูกสร้างที่บินได้ แล้วจากไปเมื่อสิบห้านาทีก่อนแล้วขอรับ”","ชายวัยกลางคนรูปร่างผอมบางเอ่ยตอบด้วยความหวาดกลัว","“เจ้ากำลังจะบอกว่าพวกมันหนีไปแล้วงั้นหรือ?”","โจชัวขมวดคิ้ว ก่อนจะเอ่ยด้วยความประหลาดใจ","นี่ไม่ใช่เรื่องที่เป็นไปไม่ได้ เพราะขุมกำลังของจักรวรรดิและศาสนจักรนั้น ห่างไกลจากสิ่งที่สมุนของปีศาจร้ายเหล่านี้จะเทียบเคียงได้อย่างสิ้นเชิง พวกพ่อมดที่เพิ่งจะผ่านความพ่ายแพ้อย่างยับเยินมาหมาดๆ แถมยังมีทหารบาดเจ็บอีกมากมาย การหลบหนีไปตามสถานการณ์จึงถือเป็นเรื่องปกติมาก","เพียงแต่ช่วงเวลามันช่างประจวบเหมาะเหลือเกิน มันเพิ่งจะเกิดขึ้นก่อนหน้าที่พวกเขาจะมาถึงเพียงแค่สิบห้านาทีเท่านั้น","โชคของพวกเขานั้น คงต้องใช้คำว่าเลวร้ายมาอธิบายเท่านั้น!","“เจ้ารู้ไหมว่าพวกพ่อมดเดินทางไปทางไหน?”","ลูเซียจู่ๆ ก็เอ่ยถามขึ้นมา","“คือ...ทางเหนือขอรับ!”","ชายวัยกลางคนตอบด้วยความลังเล","เมื่อคำพูดนี้หลุดออกมา บรรดาบิชอปที่อยู่ในเหตุการณ์ต่างก็มีสีหน้าตื่นตระหนก เพราะอาณาจักรของพวกมันอยู่ทางทิศตะวันตก!","หากต้องการจะถอยทัพ ไม่ว่าจะมองยังไง ก็เป็นไปไม่ได้เลยที่จะบินไปทางทิศเหนือ!","“ทางเหนือมีอะไรอยู่กันแน่?”","ลูเซียเอ่ยถามด้วยความสงสัย","“มันคือน้ำมันดิน!”","สีหน้าของโจชัวดูเคร่งเครียดเป็นอย่างมาก ก่อนหน้านี้หลังจากที่เขาได้ค้นความทรงจำของเชลยศึกเหล่านั้น เขาก็รู้สึกสงสัยในจุดนี้มาตลอด","เพราะเป้าหมายแรกในการตอบโต้กลับของพวกพ่อมดในครั้งนี้ น่าจะเป็นการยึดดินแดนที่สูญเสียไปของอาณาจักรกลับคืนมาต่างหาก ซึ่งการที่กองทัพอีกสองกองกำลังยังคงรั้งอยู่ในเขตแดนของอาณาจักรมาโดยตลอด ก็สามารถพิสูจน์ให้เห็นถึงจุดนี้ได้เป็นอย่างดี","แต่กองทัพที่พวกเขาเผชิญหน้าด้วยกลับเป็นข้อยกเว้นเพียงหนึ่งเดียว เพราะกองทัพนี้เป็นฝ่ายบุกเข้ามาในเขตแดนของจักรวรรดิก่อน โดยมีเป้าหมายคือดินแดนมิสต์ ซึ่งมีความเป็นไปได้สูงมาก ว่าพวกมันต้องการน้ำมันดิน","“พวกพ่อมดเหล่านี้จะต้องคิดจะแย่งชิง หรือไม่ก็ทำลายอาวุธสงครามอันทรงพลังของจักรวรรดิอย่างแน่นอน!”","ซิริดเอ่ยด้วยใบหน้าที่เต็มไปด้วยความโกรธแค้น","ความสำคัญของน้ำมันดินนั้นเป็นสิ่งที่เห็นกันอยู่ชัดๆ ในช่วงไม่กี่ปีที่ผ่านมา มันได้สร้างประโยชน์อย่างมหาศาลในการทำสงครามกับพวกคนเถื่อนและปีศาจร้าย ช่วยลดจำนวนผู้บาดเจ็บและเสียชีวิตลงได้เป็นจำนวนมาก","ลูเซียส่ายหน้า เธอไม่เห็นด้วยกับการคาดเดาของซิริด","แม้น้ำมันดินจะมีประโยชน์มากก็ตาม แต่เมื่อนำไปเทียบกับปืนใหญ่ที่พวกพ่อมดมี มันก็เทียบกันไม่ได้เลย","“บางทีสภาเวทมนตร์อาจจะค้นพบวิธีใช้น้ำมันดินในรูปแบบอื่นแล้วก็เป็นได้”","ลูเซียคาดเดา","ในสงครามปราบปรามอาณาจักรเมื่อครั้งก่อน กองอัศวินกริฟฟอนที่นำโดยเอ็ดเวลล์ ได้นำน้ำมันดินไปด้วยเป็นจำนวนมาก ซึ่งมีความเป็นไปได้ถึงแปดหรือเก้าส่วนเลยทีเดียว ที่พวกมันจะถูกยึดไป","พวกพ่อมดจะต้องนำสิ่งนี้ไปทำการศึกษาค้นคว้า และค้นพบความลับอะไรบางอย่างอย่างแน่นอน จึงทำให้พวกมันต้องการมันอย่างเร่งด่วน ถึงขั้นที่คิดว่าสิ่งนี้ จะสามารถส่งผลกระทบต่อผลแพ้ชนะของสงครามได้ในระดับหนึ่ง พวกมันจึงได้เดินทางไปตามหาน้ำมันดินอย่างกะทันหัน ในช่วงเวลาที่สำคัญเช่นนี้..."]},{"n":426,"t":"แผนการถูกเปิดเผย ลินน์ผู้คาดการณ์ได้ราวกับเทพเจ้า","c":["ในขณะที่คนหลายคนกำลังคิดว่า น้ำมันดินมีความลับอะไรซ่อนอยู่กันแน่ ทหารม้าทัณฑ์ศักดิ์สิทธิ์ก็พากันหลั่งไหลเข้ามาอย่างต่อเนื่อง เพื่อรายงานข้อมูลที่พวกเขาตรวจสอบพบภายในเมืองแห่งนี้","เป็นไปตามที่หัวหน้าทหารยามพูดเอาไว้ ภายในเมืองแห่งนี้ไม่มีศัตรูเหลืออยู่เลยแม้แต่คนเดียว พ่อมดทั้งหมดได้ถอนกำลังออกไปแล้ว และผู้ที่รับหน้าที่ป้องกันเมือง ก็มีเพียงกองทหารรักษาการณ์ที่ถูกเรียกตัวมารวมกันเป็นการชั่วคราวเท่านั้น","ว่ากันว่าทุกคนล้วนถูกร่ายคำสาปอันชั่วร้ายใส่ หากไม่ยอมทำตามคำสั่ง ทั่วทั้งร่างก็จะมีหนองไหลเยิ้ม และเน่าเปื่อยจนตาย!","สิ่งที่เรียกว่าการป้องกันที่แน่นหนา และมีกองกำลังทหารประจำการอยู่อย่างหนาแน่น ล้วนเป็นเพียงแค่ภาพลวงตาทั้งสิ้น!","พวกพ่อมดอาศัยเมืองเปล่าๆ เพียงเมืองเดียวเป็นเครื่องข่มขวัญ เพื่อถ่วงเวลาพวกเขาเอาไว้ที่นี่ และถึงขั้นสร้างกำแพงอันแข็งแกร่งเอาไว้ เฉพาะด้านที่หันหน้าไปทางเมืองน้ำมันดินเท่านั้น ส่วนอีกสามด้านที่เหลือ ก็เป็นแค่ของทำเลียนแบบขึ้นมาหลอกๆ","“มิน่าล่ะ...”","โจชัวเอ่ยด้วยน้ำเสียงเย็นชา ก่อนหน้านี้เขาก็รู้สึกว่าการเสริมความแข็งแกร่งให้กับกำแพงเมืองทั้งสี่ด้าน ในเวลาเพียงไม่กี่ชั่วโมงนั้น ไม่มีทางที่จะทำได้สำเร็จอย่างแน่นอน","เห็นได้ชัดว่าพวกเขาทุกคนถูกหลอกเข้าให้แล้ว!","“เดี๋ยวก่อน ถ้าหากพวกพ่อมดถอนกำลังออกไปหมดแล้ว แล้วเวทมนตร์ที่ข้าสัมผัสได้มันคืออะไรล่ะ?”","ลูเซียชะงักไปครู่หนึ่ง ก่อนจะนึกถึงเรื่องนี้ขึ้นมาได้","ก่อนที่จะเข้ามาในเมือง เธอสัมผัสได้ถึงความผันผวนของเวทมนตร์อันรุนแรงภายในเมือง เธอจึงคิดว่าพวกพ่อมดยังคงรวมตัวกันอยู่ภายในเมืองแห่งนี้","นั่นน่าจะเป็นทิศทางของคฤหาสน์!","“เดี๋ยวนี้ รีบไปเรียกคนที่เดินทางไปที่คฤหาสน์กลับมาให้หมดเลย!”","ภายในใจของลูเซียเกิดลางสังหรณ์แห่งความตื่นตระหนกขึ้นมาสายหนึ่ง และไม่รอให้บรรดาบิชอปได้ลงมือทำอะไร เธอก็หลับตาลงและใช้พลังศักดิ์สิทธิ์ในการส่งข้อความทันที","แต่น่าเสียดายที่สุดท้ายแล้วมันก็ยังสายไปก้าวหนึ่ง ในขณะที่เสียงพูดเพิ่งจะขาดคำ เสียงระเบิดอันรุนแรงก็ดังกึกก้องขึ้นมาทันที และมีแสงไฟอันเจิดจ้าพวยพุ่งขึ้นมาจากทิศทางของคฤหาสน์...","และนี่ก็คือของขวัญที่ลินน์ทิ้งเอาไว้ให้พวกเขาก่อนจากไป...ดินปืนจำนวนมหาศาล!","ภายในคฤหาสน์ถูกติดตั้งเวทมนตร์ตรวจจับแรงสั่นสะเทือนเอาไว้ หลังจากที่ตรวจพบว่ามีคนจำนวนมากเหยียบย่างเข้ามาภายในคฤหาสน์ มันก็จะจุดชนวนระเบิดขึ้นในอีกสามนาทีต่อมา!","เมื่อดูจากความรุนแรงของการระเบิดแล้ว ทหารชั้นยอดจำนวนมากที่เดินทางไปค้นในคฤหาสน์ คงจะมีลางร้ายมากกว่าดีแล้วล่ะ!","สีหน้าของโจชัวดูมืดมนจนถึงขีดสุด สีหน้าของลูเซียก็เย็นเยียบราวกับน้ำแข็ง","“พวกมันเพิ่งจะจากไปได้สิบกว่านาทีเท่านั้น แถมยังต้องพาทหารอีกแปดพันกว่านาย และปืนใหญ่อันหนักอึ้งไปด้วย จึงเป็นไปไม่ได้เลยที่พวกมันจะเคลื่อนที่ด้วยความเร็วสูงสุด ตอนนี้หากไล่ตามไปก็คงจะยังทัน...”","ซิริดเอ่ยเตือนเสียงเบา","อีกทั้งน้ำมันดินยังมีความสำคัญต่อจักรวรรดิเป็นอย่างมาก ดังนั้นในพื้นที่ขุดเจาะ จึงยังมีคนประจำการอยู่อีกเป็นจำนวนมาก ซึ่งก็น่าจะสามารถถ่วงเวลาเอาไว้ได้อีกสักพัก","เมื่อหัวหน้าทหารยามเห็นว่าซิริดเสนอให้เดินทางต่อ เขาก็ร้องห่มร้องไห้น้ำตานองหน้า พลางร้องตะโกนขึ้นมาว่า","“ท่านประธานผู้พิพากษา ท่านสตรีศักดิ์สิทธิ์ ข้าคือผู้ศรัทธาที่ซื่อสัตย์ที่สุดของพระผู้เป็นเจ้านะขอรับ ข้าจะไปฟังคำสอนที่โบสถ์ทุกสัปดาห์ ได้โปรดเถอะ ขอร้องล่ะ ได้โปรดช่วยข้าด้วย!”","โจชัวพุ่งตัวไปข้างหน้าอย่างรวดเร็ว ก่อนจะวางมือลงบนศีรษะของหัวหน้าทหารยาม สามถึงห้าวินาทีต่อมา สีหน้าของเขาก็มืดมนลงยิ่งกว่าเดิม","“ไอ้โง่เอ๊ย บนตัวเจ้าไม่มีคำสาปอะไรเลยสักนิด!”","หัวหน้าทหารยามถึงกับตัวแข็งทื่อไปด้วยความโง่งม แต่เขาเห็นกับตาตัวเองเลยนะ ว่าเพื่อนร่วมงานคนหนึ่งที่ฝ่าฝืนคำสั่งของพวกพ่อมด ร่างกายของเขากลายเป็นแอ่งเลือดท่ามกลางความเจ็บปวดและเสียงกรีดร้อง","“นั่นมันก็แค่ภาพลวงตา เป็นแค่กลอุบายเล็กๆ น้อยๆ ของพวกพ่อมด ที่ใช้ข่มขู่พวกเจ้าก็เท่านั้น”","โจชัวเอ่ยอธิบายประโยคหนึ่ง จากนั้นก็ไม่สนใจว่าอีกฝ่ายจะเชื่อหรือไม่ เขาหันไปมองลูเซีย และขอร้องให้รีบไล่ตามไปทันที เพื่อลบพวกพ่อมดที่ใช้วิธีการต่ำทรามเหล่านี้ให้หายไปให้หมด!","หากปล่อยให้พวกมันได้น้ำมันดินไป ไม่แน่ว่าอาจจะเกิดเหตุการณ์ไม่คาดฝันขึ้น และนำไปสู่ปัญหาอื่นๆ อีกก็เป็นได้","“ซิริด ให้เจ้าเป็นทัพหน้า นำกำลังไปสกัดกั้นเรือเหาะพวกนั้นเอาไว้ ไม่จำเป็นต้องบุกโจมตีอย่างหนัก แค่ถ่วงความเร็วของพวกมันเอาไว้ก็พอแล้ว!”","ลูเซียพยายามข่มความโกรธเอาไว้ ก่อนจะเอ่ยสั่งการด้วยน้ำเสียงทุ้มต่ำ","“ข้าเข้าใจแล้ว ท่านสตรีศักดิ์สิทธิ์ ข้าจะไม่มีวันยอมให้พวกพ่อมดมาแย่งชิงอาวุธสงครามของจักรวรรดิไปได้อย่างแน่นอน”","ซิริดคุกเข่าลงข้างหนึ่ง ก่อนจะตอบรับอย่างหนักแน่น","มังกรไฟลาวาขนาดมหึมาตัวหนึ่งร่อนลงมาจากฟากฟ้า ด้วยร่างอันหนักอึ้งของมัน ก็ได้กดทับก้อนอิฐที่แข็งแกร่งจนพังทลายลงไป พร้อมกับดวงตาสีแดงฉานคู่นั้น จ้องมองไปที่บรรดาบิชอปที่อยู่ตรงหน้าเขม็ง แววตาของมันเต็มไปด้วยความเกลียดชัง แต่ร่างกายและจิตสำนึกกลับยังคงถูกพันธนาการเอาไว้ด้วยพลังศักดิ์สิทธิ์อย่างแน่นหนา","หลังจากที่ซิริดร่ายพลังศักดิ์สิทธิ์เพื่อปกป้องตัวเองแล้ว เขาก็กระโดดขึ้นไปบนหลังมังกรเพียงลำพัง และควบคุมร่างของมังกรให้บินขึ้นไปบนท้องฟ้า","ทางด้านหลัง ก็ยังมีอัศวินกริฟฟอนอีกหลายร้อยนายบินตามมาด้วย!","……","ในเวลาเดียวกัน เรย์เดลและคนอื่นๆ ที่ซ่อนตัวอยู่นอกเมือง ก็มองเห็นมังกรยักษ์ที่บินทะยานขึ้นไปบนท้องฟ้าเช่นกัน","“จุ๊ๆ นั่นมันสัตว์ประหลาดอะไรกัน ทำไมถึงได้ตัวใหญ่ขนาดนี้?”","แฮมม์เอ่ยด้วยความตกตะลึง","“น่าจะเป็นมังกรนะ?”","เรย์เดลเอ่ยตอบอย่างไม่ค่อยแน่ใจ ถึงแม้ว่าพวกเขาทั้งหมดจะไม่เคยเห็นมังกรตัวเป็นๆ มาก่อน แต่มันก็เป็นสิ่งที่คุ้นหูคุ้นตากันดี จากบทละครโอเปร่าและคำบอกเล่าของเหล่านักกวีพเนจร ซึ่งมันก็คือสัญลักษณ์ของความดุร้ายและความทรงพลัง!","“ดูเหมือนว่าท่านลินน์จะพูดถูกจริงๆ คนพวกนี้ออกไปไล่ตามแล้วจริงๆ ด้วย!”","เรย์เดลมองดูกองทัพปราบปรามที่เพิ่งจะบุกเข้าไปในเมือง แต่เพียงพริบตาเดียว พวกมันก็บุกออกมาอย่างยิ่งใหญ่ และมุ่งหน้าไปทางทิศเหนือ ทำให้เขารู้สึกเลื่อมใสในใจเป็นอย่างยิ่ง","นี่มันเป็นไปตามที่ลินน์คาดการณ์เอาไว้ทุกประการเลย!","“ถ้าอย่างนั้นพวกเราจะลงมือกันเลยไหม?”","แฮมม์ถูมือไปมา ก่อนจะเอ่ยถามด้วยความตื่นเต้น","“ไม่ รออีกหน่อยเถอะ”","เรย์เดลส่ายหน้า ก่อนจะเอ่ยอย่างระมัดระวัง","“รอให้พวกมันเดินไปไกลกว่านี้อีกสักหน่อย ยังไงก็ส่งข่าวไปก่อนก็แล้วกัน!”","“รบกวนท่านด้วยนะครับ ท่านแอนโธนี่!”","เรย์เดลหันไปมองแอนโธนี่ที่อยู่ข้างๆ","ฝ่ายหลังพยักหน้า ก่อนจะหลับตาลงและดึงดูดสนามแม่เหล็กไฟฟ้าโดยรอบ เพื่อส่งสัญญาณคลื่นแม่เหล็กไฟฟ้าออกไป!","เนื่องจากเรือเหาะเพิ่งจะออกเดินทางมาได้เพียงแค่ยี่สิบนาทีเท่านั้น ระยะทางจึงยังไม่ไกลมากนัก ดังนั้น จึงไม่จำเป็นต้องใช้สถานีถ่ายทอดสัญญาณเลยด้วยซ้ำ และความเร็วของมันก็ยังเร็วถึงขีดสุดอีกด้วย","และในวินาทีต่อมา หลังจากที่แอนโธนี่ร่ายเวทมนตร์เสร็จสิ้น พวกลินน์ที่อยู่บนเรือเหาะก็ได้รับข้อความแล้ว","“ดีมาก ในเมื่อพวกมันตามมาแล้ว งั้นสมรภูมิรบหลังจากนี้ พวกเราก็จะเป็นคนกำหนดเอง!”","แฮร์รอฟที่อยู่ข้างๆ เผยรอยยิ้มออกมาที่มุมปาก","ก่อนหน้านี้ พวกเขาทั้งหมดต่างก็กำลังเค้นสมองคิดหาหนทาง ว่าจะทำอย่างไรถึงจะจงใจหลอกล่ออีกฝ่ายให้ออกมาได้ เพื่อใช้เป็นสถานที่ที่เหมาะสมในการร่ายเวทมนตร์บทใหม่ที่เพิ่งคิดค้นขึ้นมา","แต่ลินน์กลับเสนอแนวคิดอีกรูปแบบหนึ่งขึ้นมา นั่นก็คือการเลือกโจมตีเป้าหมายที่อีกฝ่ายจะต้องปกป้องอย่างแน่นอน!","และน้ำมันดินก็คือเป้าหมายที่ดีที่สุด!","ทันทีที่พวกเขาแสดงความปรารถนาอันแรงกล้าที่มีต่อสิ่งนี้ออกมา ศาสนจักรก็ไม่มีทางปล่อยให้พวกเขาทำสำเร็จได้อย่างแน่นอน พวกมันจะต้องไล่ตามมาอย่างแน่นอน!","นี่แหละคือแผนการที่เปิดเผยอย่างแท้จริง!","ยิ่งไปกว่านั้น พวกเขายังทิ้ง ‘ของขวัญเล็กๆ น้อยๆ’ เอาไว้ในเมืองอีกด้วย หากทุกอย่างเป็นไปอย่างราบรื่น อีฝ่ายก็จะต้องกำลังโกรธจัดจนขาดสติไปแล้วแน่ๆ ใช่ไหมล่ะ?","การถูกปั่นหัวเล่นตั้งหลายครั้งต่อหลายครั้ง ไม่ว่าใครก็ต้องสู้ตายทั้งนั้นแหละ!","“น่าเสียดายที่มันเร็วกว่าที่คิดไปหน่อย ทำให้พวกเราเตรียมการได้ไม่มากพอ ไม่อย่างนั้นมันก็คงจะไม่เกิดข้อผิดพลาดอะไรเลย!”","ลินน์เอ่ยด้วยความจนใจเล็กน้อย","ตามการคาดการณ์ก่อนหน้านี้ของเขา ศาสนจักรเพิ่งจะสูญเสียทหารไปหลายพันคน ต่อให้จะร้อนรนแค่ไหน ก็ต้องใช้เวลาพักฟื้นอย่างน้อยครึ่งวัน แล้วค่อยเริ่มโจมตีในเช้าวันพรุ่งนี้ แต่เห็นได้ชัดว่าความเคลื่อนไหวของอีกฝ่าย กลับรวดเร็วกว่าที่เขาคาดการณ์เอาไว้มาก..."]},{"n":427,"t":"นี่มันไม่วิทยาศาสตร์เอาซะเลย แต่มันคือเวทมนตร์สุดๆ!","c":["“ไม่มีอะไรที่ไร้ข้อผิดพลาดหรอก อุบัติเหตุสามารถเกิดขึ้นได้ทุกเมื่อ หากมั่นใจว่ามีโอกาสชนะถึงแปดส่วน มันก็คุ้มค่าที่จะทุ่มเทอย่างสุดกำลังแล้ว!”","แฮร์รอฟเอ่ยปลอบใจ","หากไม่ใช่เพราะลินน์เพิ่งจะคิดค้นวิธีตรวจสอบสถานการณ์ของศัตรู ผ่านการรับรู้แรงสั่นสะเทือนของพื้นดินขึ้นมาได้เป็นการชั่วคราวแล้วล่ะก็ เกรงว่าพวกเขาคงจะไม่สามารถหลบเลี่ยงการบุกโจมตีสายฟ้าแลบของศาสนจักรในครั้งนี้ไปได้หรอก","ถ้าเป็นแบบนั้น สถานการณ์ก็คงจะยากที่จะคาดเดาได้ เพราะถ้าต้องต่อสู้กันจริงๆ ต่อให้จะเอาชนะมาได้ แต่ก็จะต้องสูญเสียอย่างหนักอย่างแน่นอน!","ความเป็นไปได้ที่มากกว่าก็คือ พวกเขาอาจจะต้องพ่ายแพ้อีกครั้ง หรือไม่ก็อาจจะต้องตายตกไปตามกัน...","“ตามความเห็นของข้า พวกเราไม่จำเป็นต้องกังวลขนาดนั้นหรอกนะ ครั้งนี้พวกเรา ‘ออกรบด้วยสัมภาระที่เบาหวิว’ คนพวกนั้นทำได้แค่ตามดมฝุ่นอยู่ข้างหลังพวกเราเท่านั้น การจะถ่วงเวลาเอาไว้สักหน่อย คงไม่ใช่เรื่องยากอะไร...”","ราฟาเอลเอ่ยด้วยท่าทีที่ค่อนข้างมองโลกในแง่ดี","“อย่าเพิ่งพูดอะไรที่มันมั่นใจเกินไปจะดีกว่า!”","ลินน์ส่ายหน้า เขามองไปทางด้านหลัง ก่อนจะเอ่ยขึ้นมา","“พวกมันตามมาทันแล้ว!”","ในระหว่างที่พูด เสียงคำรามของมังกรที่ทำให้ผู้คนรู้สึกหวาดหวั่น ก็ดังแว่วมาจากที่ไกลๆ","ภายใต้การจับจ้องของทุกคน ลูกไฟสีแดงฉานลูกหนึ่งกำลังพุ่งตรงมาทางนี้ด้วยความเร็วสูง","เมื่อมันเข้ามาใกล้ พวกเขาก็พบว่านั่นไม่ใช่ลูกไฟ แต่เป็นสัตว์ประหลาดที่มีรูปร่างหน้าตาดุร้าย โดยปีกของมันกางออกได้กว้างกว่ายี่สิบเมตร เกล็ดสีแดงฉานราวกับถูกหล่อหลอมขึ้นมาจากลาวา ดวงตาทั้งสองข้างมีสีแดงก่ำราวกับเลือด แผ่กลิ่นอายความดุร้ายกระหายเลือดออกมา","“นี่มัน...มังกรเหรอ?”","รูม่านตาของราฟาเอลหดเล็กลง เขาพลันนึกถึงหายนะจากมังกรยักษ์ในดินแดนพ่อมดเมื่อหลายสิบปีก่อนขึ้นมาได้ทันที","“น่าจะเป็นแค่มังกรสายพันธุ์ย่อยเท่านั้น!”","แฮร์รอฟเอ่ยแก้ไข","“เร็วมาก ความเร็วน่าจะอยู่ที่อย่างน้อยหนึ่งร้อยแปดสิบกิโลเมตรต่อชั่วโมง สิ่งมีชีวิตที่ทั้งใหญ่และหนักขนาดนี้ มันอาศัยร่างกายบินได้เร็วขนาดนี้ได้ยังไงกัน?”","ลินน์เอ่ยด้วยความประหลาดใจเป็นอย่างมาก ลำพังแค่ปีกมังกรคู่นั้น ต่อให้กระพือจนปีกหัก ก็ไม่มีทางที่จะทำความเร็วได้ถึงหนึ่งร้อยกิโลเมตรต่อชั่วโมงได้หรอก อันที่จริง แค่จะลอยตัวขึ้นไปในอากาศก็ยังยากเลย","แฮร์รอฟและคนอื่นๆ มองไปที่ลินน์ด้วยสายตาแปลกๆ พวกเขาไม่เข้าใจว่าทำไมดาวรุ่งแห่งเวทมนตร์ผู้นี้ ถึงได้พูดจาแบบนี้ออกมา เครื่องบินรบที่ทำมาจากเหล็กกล้าของเขา ก็ทำความเร็วได้ถึงสามถึงสี่ร้อยกิโลเมตรต่อชั่วโมงเหมือนกันไม่ใช่หรือไง","ลินน์ไม่รู้หรอกว่าคนอื่นๆ กำลังคิดอะไรอยู่ ไม่อย่างนั้นเขาจะต้องบอกพวกนั้นไปอย่างแน่นอน ว่าวิธีการบินของเครื่องบินรบนั้นเป็นวิทยาศาสตร์มากๆ ในขณะที่เจ้านี่ คงพูดได้แค่ว่ามันเวทมนตร์สุดๆ!","แต่ตอนนี้ ลินน์ไม่มีใจจะไปค้นหาคำตอบแล้ว ว่ามังกรไฟตรงหน้าตัวนี้บินขึ้นมาได้ยังไง","เพราะศัตรูของพวกเขาได้เข้ามาอยู่ในระยะโจมตีและระยะการร่ายเวทมนตร์แล้ว","ปืนกลหลายกระบอกที่ติดตั้งอยู่ทางด้านหลังของเรือเหาะ เริ่มทำการยิงทันที ห่ากระสุนอันหนาแน่นสาดซัดเข้าใส่มังกรไฟลาวาตัวนั้น ราวกับพายุฝนที่โหมกระหน่ำ","แม้ว่ามังกรไฟลาวาตัวนี้จะมีขนาดใหญ่โต แต่มันกลับมีความคล่องแคล่วว่องไวมากกว่าที่พวกเขาคิดเอาไว้มาก เพียงแค่กระพือปีก มันก็สามารถหลบห่ากระสุนที่พุ่งเข้ามาได้อย่างง่ายดาย","“น่าจะคาดเดาและเล็งไปที่เส้นทางข้างหน้าของมันนะ...”","ลินน์ส่ายหน้า พลปืนกลเหล่านี้ยังอ่อนหัดเกินไป และมันก็เกี่ยวข้องกับการที่พวกเขาใช้เวลาฝึกฝนสั้นเกินไป แล้วต้องรีบออกรบด้วย","จากนั้นแนวป้องกันที่สองซึ่งประกอบไปด้วยเหล่าพ่อมด ก็ตามมาติดๆ ลูกไฟจำนวนมาก ใบมีดน้ำแข็ง และพลังสายฟ้า ครอบคลุมพื้นที่เป็นบริเวณกว้าง ในเมื่ออีกฝ่ายมีความเร็วสูงและคล่องแคล่วว่องไวมากนัก ถ้าอย่างนั้นก็แค่ทำให้มันหลบไม่ได้ก็สิ้นเรื่อง!","แต่ในครั้งนี้ เป้าหมายของพวกเขากลับไม่ได้หลบหลีก แต่มันกลับอ้าปากพ่นลมหายใจมังกรอันร้อนระอุออกมา เปลวเพลิงที่มีอุณหภูมิสูงถึงหลายพันองศา แผดเผาเวทมนตร์ที่พุ่งเข้ามาจนสูญสลายไปจนหมดสิ้น จากนั้นมันก็พ่นลมหายใจมังกร และพุ่งเข้าใส่ขบวนเรือเหาะ","คลื่นเปลวเพลิงอันร้อนระอุพุ่งเข้ามาในพริบตา ลินน์ก้าวไปข้างหน้าหนึ่งก้าว ก่อนจะยื่นมือออกไป นิ้วชี้และนิ้วกลางสั่นไหวเล็กน้อย มิติและเวลาที่มองไม่เห็นเกิดคลื่นกระเพื่อม ลมหายใจมังกรที่พุ่งเข้ามาอย่างดุดัน ถูกพลังที่มองไม่เห็นด้วยตาเปล่าตัดแบ่งออกเป็นสองสาย และพุ่งผ่านด้านข้างของเรือเหาะไป คลื่นความร้อนอันมหาศาล ทำให้แม้แต่อากาศก็ยังบิดเบี้ยว...","แม้ว่าคลื่นห้วงมิติสั่นสะเทือนที่มองไม่เห็นด้วยตาเปล่าจะไม่สามารถมองเห็นได้ แต่ในฐานะพระคาร์ดินัล ซิริดกลับสามารถสัมผัสได้ถึงพลังอันแข็งแกร่งนี้ ซึ่งมากพอที่จะกระตุ้นให้เกิดความผันผวนของมิติได้","การรับรู้ถึงอันตรายของมังกรไฟลาวาที่อยู่ใต้ร่าง ก็ไม่ได้อ่อนด้อยไปกว่ากันเลย หรืออาจจะแข็งแกร่งกว่าซิริดด้วยซ้ำ ก่อนที่คลื่นห้วงมิติสั่นสะเทือนจะเข้ามาใกล้ มันก็ได้บินหลบออกไปแล้ว และลมหายใจมังกรก็หยุดชะงักลงอย่างกะทันหันเช่นกัน","เมื่อตระหนักได้ว่าบนเรือเหาะลำนี้มีพ่อมดที่ทรงพลังคอยปกป้องอยู่ และมันยากที่จะทำลายลงได้ ซิริดจึงหลีกเลี่ยงมันโดยตรง และเปลี่ยนเป้าหมายไปที่ลำอื่นแทน","ภายในขบวนเรือเหาะ มีเรือเหาะอยู่มากกว่าหนึ่งร้อยลำ และมีความยาวกว่าหนึ่งกิโลเมตร!","หากอาวุธสงครามเช่นนี้ไปปรากฏอยู่บนสนามรบ เกรงว่ามันคงจะสามารถบดขยี้กองทัพนับหมื่นนายได้อย่างง่ายดาย แต่ในสายตาของซิริด พวกมันก็เป็นแค่เป้านิ่งเท่านั้น!","ปีกของมังกรไฟลาวาที่มีความยาวถึงยี่สิบเมตรกระพืออย่างแรง ร่างมังกรอันใหญ่โตเร่งความเร็วขึ้นอีกครั้ง มันพุ่งเข้าใส่เรือเหาะลำหนึ่งทางด้านขวา พร้อมลมหายใจมังกรอันร้อนระอุที่ถูกพ่นออกมา คลื่นเปลวเพลิงอันดุดันทำลายบาเรียเวทมนตร์ป้องกันได้อย่างง่ายดาย และกลืนกินเรือเหาะทั้งลำเข้าไปในกองเพลิง","ในพริบตา แสงไฟก็สว่างวาบขึ้นไปบนท้องฟ้า เรือเหาะทั้งลำลุกไหม้ เสียงระเบิดอันรุนแรงดังกึกก้องไปทั่วท้องฟ้า","แม้ว่าตอนที่สร้างบอลลูนของเรือเหาะ จะมีการจงใจใช้วัสดุทนไฟ แต่ก็ไม่สามารถต้านทานความร้อนอันน่าสะพรึงกลัวเช่นนี้ได้ ทำให้โครงเหล็กถูกหลอมละลายและเผาไหม้ไปโดยตรง...","มังกรไฟลาวาบินทะยานขึ้นไปอีกครั้ง เพื่อหลบหลีกใบมีดน้ำแข็งหลายสิบเล่มที่พุ่งเข้ามา หางมังกรอันหนาเตอะของมันสะบัดอย่างแรง ฟาดเข้าที่เปลือกนอกของเรือเหาะอย่างจัง ตามมาด้วยเสียงดังสนั่นหวั่นไหวที่ทำให้รู้สึกเสียวฟัน รั้วเหล็กถูกฟาดจนแหลกละเอียด ส่งผลให้ห้องนักบินครึ่งหนึ่งระเบิดออกโดยตรง และกลายเป็นลูกไฟตกลงสู่พื้นดิน...","“บัดซบเอ๊ย ส่งข้อความไป ให้พวกมันกระจายกำลังกันออกไป!”","เมื่อเห็นเรือเหาะลำหนึ่งถูกยิงตกภายในเวลาเพียงไม่กี่วินาที ราฟาเอลก็ตะโกนออกมาด้วยความร้อนรน","เนื่องจากมังกรไฟลาวาพุ่งตรงเข้าไปในขบวนเรือเหาะ พวกเขาจึงไม่กล้าใช้เวทมนตร์โจมตีกลับอย่างเต็มกำลัง ไม่อย่างนั้นขอแค่อีกฝ่ายหลบได้ การโจมตีทั้งหมดก็จะต้องไปตกอยู่ที่ฝ่ายเดียวกันอย่างแน่นอน","ความจริงแล้ว ไม่จำเป็นต้องให้ราฟาเอลเตือน เรือเหาะที่รวมตัวกันอยู่ ก็เริ่มกระจายตัวออกไปรอบๆ แล้ว","เห็นได้ชัดว่าซิริดไม่มีทางปล่อยโอกาสนี้ไปอย่างแน่นอน เขาควบคุมมังกรไฟลาวาที่อยู่ใต้ร่าง ให้บินโฉบไปมาในขบวนเรือเหาะ คลื่นเปลวเพลิงพวยพุ่งขึ้นมาครั้งแล้วครั้งเล่า ย้อมท้องฟ้าจนกลายเป็นสีแดงฉาน ในเวลาเพียงสิบกว่าวินาทีเท่านั้น","ยาลี่ที่ทำหน้าที่เป็นคนขับเรือเหาะ ได้แต่มองดูเรือเหาะลำหนึ่งที่อยู่ไม่ไกลจากเขานัก ถูกลมหายใจมังกรอันร้อนระอุแผดเผาจนกลายเป็นลูกไฟ ด้วยความรู้สึกทั้งโกรธแค้นและหวาดกลัว","ก่อนหน้านี้ พวกเขาเป็นฝ่ายอาศัยความเร็วที่เหนือชั้นกว่า ปั่นหัวศัตรูเล่นอยู่ในกำมือ แต่เห็นได้ชัดว่าตอนนี้สถานการณ์มันกลับตาลปัตรไปแล้ว เพราะความเร็วในการบินของศัตรูในตอนนี้เร็วกว่า และคล่องแคล่วว่องไวกว่าพวกเขามาก!","เมื่อเป็นเช่นนี้ ข้อเสียของเรือเหาะที่มีขนาดใหญ่ และเปลี่ยนทิศทางได้ช้า ก็กลายเป็นจุดอ่อนที่ร้ายแรงมาก เมื่อต้องเผชิญหน้ากับลมหายใจมังกร พวกเขาก็ไม่สามารถแม้แต่จะหลบหลีกได้เลย","“บัดซบเอ๊ย!”","ยาลี่กัดฟันสบถด่าออกมาคำหนึ่ง จากนั้นเขาก็หันไปมองซานเชซ จอมเวทผู้ยิ่งใหญ่สายแปรสภาพที่อยู่ข้างๆ ก่อนจะเอ่ยถามด้วยความร้อนรน","“ท่านพ่อมด นี่พวกเราจะต้องทนดูอยู่เฉยๆ แบบนี้งั้นหรือ?”","ซานเชซเองก็รู้สึกร้อนรนจนแทบจะบ้าตายอยู่แล้ว แต่เขาก็ไม่มีวิธีอื่นใดเลย มังกรตัวนั้นบินเร็วเกินไปจริงๆ มันโจมตีเพียงครั้งเดียวแล้วก็หนีไป โดยไม่ยอมหยุดอยู่ที่ไหนเลย เวทมนตร์ของพวกเขา หากไม่โจมตีพลาด ก็รุนแรงไม่พอที่จะทำให้อีกฝ่ายได้รับบาดเจ็บ","ในขณะที่ซานเชซกำลังลังเลอยู่ว่า เขาควรจะแปลงกายเป็นอินทรียักษ์โดกัลด์ เพื่อต่อสู้ชี้ชะตากับอีกฝ่ายดีหรือไม่ จู่ๆ อุปกรณ์รับสัญญาณแม่เหล็กไฟฟ้าก็สว่างวาบขึ้นมา"]},{"n":428,"t":"การเปิดตัวครั้งแรกของเครื่องบินรบรุ่นแรก","c":["เสียงดังติ๊ดๆ ตือๆ ดังก้องไปทั่วเรือเหาะอย่างต่อเนื่อง ซานเชซรู้สึกสั่นสะท้านไปทั้งจิตใจ สีหน้าที่เคยร้อนรนค่อยๆ สงบลง หลังจากที่ถอดรหัสข้อความได้สำเร็จ เขาก็รีบเอ่ยสั่งการทันที","“ตอนนี้ เลี้ยวกลับให้หมด!”","ยาลี่ที่เต็มเปี่ยมไปด้วยความโกรธแค้นรู้สึกดีใจเป็นอย่างมาก คนควบคุมเรือเหาะคนอื่นๆ ก็พากันรวบรวมสมาธิอย่างเต็มที่ และควบคุมเรือเหาะเพื่อเปลี่ยนทิศทาง ถึงเวลาที่พวกเขาจะต้องตอบโต้กลับบ้างแล้ว!","ซิริดขี่มังกรไฟขนาดยักษ์อาละวาดไปทั่วท้องฟ้า แต่เขากลับไม่ได้สังเกตเห็นเลยว่า เรือเหาะที่อยู่รอบๆ เหล่านี้ ไม่ได้กำลังหลบหนีเพียงอย่างเดียว ซึ่งมีเรือเหาะหลายสิบลำแอบเปลี่ยนทิศทางอย่างเงียบๆ ภายใต้การควบคุมของลินน์ พวกมันก็จัดขบวนเสร็จสิ้นอย่างรวดเร็ว แสงสายฟ้าสว่างวาบขึ้นมาบนเรือเหาะทุกลำครั้งแล้วครั้งเล่า","“โซ่สายฟ้า!”","“คุกอสนีบาต พายุสายฟ้า!”","พ่อมดสายฟ้ากว่าห้าสิบคนร่ายเวทมนตร์พร้อมกัน อาณาเขตแม่เหล็กไฟฟ้าที่ครอบคลุมรัศมีหลายร้อยเมตร ก่อตัวขึ้นในพริบตา","เมื่อซิริดตระหนักได้ถึงความผิดปกติ แสงสายฟ้าสีน้ำเงินอมม่วงก็ครอบครองวิสัยทัศน์ทั้งหมดไปแล้ว บาเรียพลังศักดิ์สิทธิ์ที่อยู่รอบกายของเขา ก็ปริแตกออกเป็นรอยร้าวหลายสาย ภายใต้การโจมตีของกระแสไฟฟ้าอันบ้าคลั่ง มังกรไฟลาวาที่อยู่ใต้ร่างส่งเสียงคำรามออกมาด้วยความเจ็บปวด และความเร็วในการกระพือปีกของมันก็ช้าลงเช่นกัน","จากนั้น ลำแสงเลเซอร์อันหนาแน่นหลายสิบสายก็สาดซัดเข้ามาจากทุกทิศทุกทาง ทำให้มังกรไฟลาวาที่ร่างกายเป็นอัมพาตจนไม่สามารถหลบหลีกได้ทัน ก็ไม่ต่างอะไรกับเป้านิ่งขนาดใหญ่ และมันก็ถูกโจมตีเข้าอย่างจังในเวลาอันรวดเร็ว","ลำแสงเลเซอร์ที่รุนแรงที่สุด ได้พุ่งเข้าตัดคอของมังกรไฟลาวา และฉีกกระชากเกล็ดมังกรอันแข็งแกร่ง เลือดที่ราวกับลาวาพุ่งกระฉูดออกมา ย้อมท้องฟ้าจนกลายเป็นสีแดงฉาน...","แต่ลำแสงเลเซอร์สายอื่นๆ กลับไม่ได้รุนแรงขนาดนั้น พวกมันเพียงแค่กรีดรอยแผลขนาดเท่านิ้วก้อยเอาไว้บนเกล็ดมังกรอันแข็งแกร่งเท่านั้น และไม่สามารถเจาะทะลุการป้องกันเข้ามาได้เลยด้วยซ้ำ","“แข็งอะไรขนาดนี้!”","ลินน์ลอบตกใจอยู่ในใจ","เวทมนตร์เลเซอร์สายที่รุนแรงที่สุดนั้น ย่อมต้องเป็นฝีมือของเขาอย่างแน่นอน และการโจมตีเข้าเป้าอย่างจังขนาดนี้ กลับไม่สามารถสังหารมันได้เลย","ส่วนเวทมนตร์ลำแสงสายอื่นๆ ก็ยิ่งไม่ต้องพูดถึงเลย พวกมันไม่สามารถแม้แต่จะตัดเกล็ดมังกรให้ขาดได้","แม้ว่าเพื่อหลีกเลี่ยงการทำร้ายพวกเดียวกันเอง เขาจึงสั่งให้ขบวนเรือเหาะรักษาระยะห่างเอาไว้ ซึ่งมันก็ช่วยลดทอนความรุนแรงของเลเซอร์ลงไปได้ระดับหนึ่ง แต่ความสามารถในการเจาะเกราะอันทรงพลังของมัน ก็เพียงพอที่จะตัดโลหะได้เลยนะ แต่ตอนนี้กลับยากที่จะเจาะการป้องกันเข้ามาได้อย่างฝืนๆ เสียด้วยซ้ำ...","ดูจากสถานการณ์แล้ว ต่อให้ปืนกลเมื่อครู่นี้จะยิงเข้าเป้า แต่ลำพังแค่การกราดยิงของปืนกล ก็คงไม่เพียงพอที่จะทำให้อีกฝ่ายได้รับบาดเจ็บได้อยู่ดี","“มังกรสายพันธุ์ย่อยตัวนี้ มีความต้านทานต่อเปลวเพลิงและอุณหภูมิสูงมาก อีกทั้งระยะห่างก็ไกลเกินไป ถ้าหากอยู่ใกล้กว่านี้ ข้าคิดว่าเวทมนตร์เลเซอร์ก็น่าจะพอมีประโยชน์อยู่บ้าง!”","แฮร์รอฟเอ่ยด้วยสีหน้าเคร่งเครียด","น่าเสียดายที่โอกาสแบบนี้มีเพียงแค่ครั้งเดียวเท่านั้น หลังจากที่เพลี่ยงพล้ำไปครั้งหนึ่ง ซิริดก็ควบคุมมังกรไฟลาวาให้บินขึ้นไปอยู่เหนือหัวของพวกเขา และนี่ก็คือจุดอ่อนประการที่สองของเรือเหาะ เนื่องจากบอลลูนมีขนาดใหญ่เกินไป จนบดบังวิสัยทัศน์ ทำให้พวกเขาไม่สามารถโจมตีศัตรูที่อยู่ด้านบนของเรือเหาะได้เลย","นี่เป็นครั้งแรกเลยที่พวกเขาตกเป็นรองในเรื่องของความเร็วอย่างเห็นได้ชัด และในที่สุดแฮร์รอฟก็ได้สัมผัสกับความรู้สึกอัดอั้นตันใจ ของการที่โจมตีคู่ต่อสู้ไม่โดนเหมือนกับที่คู่ต่อสู้ในอดีตเคยเผชิญมา","หากวิกโตริโออยู่ที่นี่ บางทีเขาอาจจะสามารถผนึกท้องฟ้าแห่งนี้เอาไว้ เพื่อจำกัดการเคลื่อนไหวของอีกฝ่าย จากนั้นก็ปล่อยให้เขาใช้ ดาบตัดมิติ สังหารมันในคราวเดียว","แต่วิกโตริโอและออโรร่า ต่างก็ล่วงหน้าไปก่อนแล้ว เพื่อเตรียมการสำหรับสมรภูมิรบหลังจากนี้","ในวินาทีนั้นเอง จู่ๆ เสียงกรีดร้องอันแหลมแสบแก้วหูก็ดังขึ้นมาบนท้องฟ้า โดยมีกลุ่มเงาดำสายหนึ่งปรากฏขึ้นในวิสัยทัศน์ของทุกคนจากที่ไกลๆ","“อัศวินกริฟฟอน!”","แฮร์รอฟขมวดคิ้ว มังกรไฟเพียงตัวเดียว พวกเขายังพอจะรับมือได้ฝืนๆ แต่ถ้าถูกอัศวินกริฟฟอนเหล่านี้ประชิดตัวได้ มันก็เป็นเรื่องง่ายมาก ที่พวกมันจะสร้างความเสียหายอย่างหนักให้กับขบวนเรือเหาะ","ในการต่อสู้กลางเวหาที่เมืองหลวงก่อนหน้านี้ พวกเขาอาศัยเวทมนตร์เลเซอร์ จนได้รับชัยชนะอย่างเด็ดขาด แต่นั่นก็ตั้งอยู่บนพื้นฐานของการเปิดตัวเวทมนตร์บทใหม่ ซึ่งเป็นการอาศัยช่องว่างของข้อมูลที่อีกฝ่ายไม่รู้","แต่ตอนนี้มันจะไม่ง่ายแบบนั้นอีกแล้ว!","และก็เป็นอย่างที่คิด เมื่ออัศวินกริฟฟอนเหล่านี้บินเข้ามาใกล้ พวกมันก็รีบบินขึ้นไปบนที่สูงโดยตรง เพื่อเตรียมที่จะทำลายบอลลูนของเรือเหาะจากด้านบน และปล่อยให้มันตกลงมาเอง โดยไม่ได้มีความคิดที่จะต่อสู้พัวพันกับพวกเขาเลยแม้แต่น้อย","แต่สีหน้าของลินน์กลับผ่อนคลายลง และเขาเอ่ยขึ้นมาว่า","“ไม่ต้องห่วงหรอก กำลังเสริมของพวกเราก็มาถึงแล้วเหมือนกัน!”","กำลังเสริมที่ว่านี้ ย่อมต้องเป็นเครื่องบินรบรุ่นใหม่ของลิเดียอย่างแน่นอน","เนื่องจากสิ่งนี้บรรทุกเชื้อเพลิงได้ไม่มากนัก ทำให้มีความสามารถในการบินที่จำกัด และบนเครื่องบินก็ยังบรรทุกอาวุธสังหารอันทรงพลังเอาไว้ด้วย ดังนั้น ลินน์จึงต้องรอจนแน่ใจแล้วว่าศาสนจักรนั้นไล่ตามมาจริงๆ เขาถึงจะยอมให้ลิเดียขับเครื่องบินรบมาสมทบ!","แต่ตอนนี้พวกเธอกลับมาถึงพร้อมกับพวกอัศวินกริฟฟอนพอดี","……","“บุกเข้าไปให้หมด! จะยอมให้พวกสวะน่ารังเกียจ สมุนของปีศาจร้ายพวกนี้ มาแย่งชิงอาวุธสงครามของจักรวรรดิไปไม่ได้เด็ดขาด!”","อัศวินกริฟฟอนนายหนึ่งชูค้อนศึกในมือขึ้นสูง ก่อนจะตะโกนออกมาเสียงดังลั่น","“ฆ่าพวกดูหมิ่นพระผู้เป็นเจ้าพวกนี้ซะ!”","“บุก บุกเข้าไป!”","เสียงโห่ร้องดังกึกก้องราวกับฟ้าผ่า ขวัญกำลังใจของอัศวินกริฟฟอนกว่าร้อยนายพุ่งทะยานขึ้นถึงขีดสุด พวกมันพุ่งเข้าใส่เรือเหาะที่อยู่รอบนอกราวกับฝูงหมาป่าที่หิวโซ หมายมั่นที่จะลบล้างความอัปยศจากการพ่ายแพ้ครั้งแล้วครั้งเล่าก่อนหน้านี้ให้จงได้!","แต่เสียงพูดของพวกเขายังไม่ทันขาดคำ เสียงคำรามของปืนกลก็ดังสนั่นหวั่นไหว อัศวินกริฟฟอนหลายนายที่เป็นแกนนำและตะโกนว่า ‘บุก’ ถูกห่ากระสุนกลืนกินเข้าไปต่อหน้าต่อตาผู้คน โดยร่างกายถูกยิงจนพรุนเป็นรังผึ้ง","“บัดซบเอ๊ย นี่มันเกิดอะไรขึ้นกันแน่?”","“ศัตรูอยู่ที่ไหน?”","“ศัตรูบุก ศัตรูบุก!”","เสียงกรีดร้องดังก้องไปทั่วท้องฟ้า กองอัศวินกริฟฟอนที่เดิมทีมีขวัญกำลังใจพุ่งทะยาน ก็พลันตกอยู่ในความสับสนวุ่นวายในทันที","เครื่องบินรบล่องหนหลายลำที่ถูกร่ายเวทมนตร์หักเหแสงเอาไว้ พุ่งทะยานผ่านไปอย่างรวดเร็ว ประกายไฟจากปืนกลสว่างวาบขึ้นในอากาศเพียงพริบตาเดียว ห่ากระสุนจากการกราดยิงของปืนกล ก็เจาะทะลุร่างของอัศวินกริฟฟอนในพริบตา และฉีกกระชากพวกมันจนแหลกละเอียด","เลือดสาดกระเซ็น เสียงร้องโหยหวนดังขึ้นระงมไปทั่ว","แม้ว่ากริฟฟอนจะมีประสาทสัมผัสในการดมกลิ่นที่น่าทึ่ง และการล่องหนทางแสงจึงไม่ค่อยมีประโยชน์กับพวกมันเท่าไหร่นัก แต่ความเร็วของเครื่องบินรบนั้นรวดเร็วเกินไป พวกมันจึงไม่มีทางที่จะยืนยันตำแหน่งของศัตรูได้ โดยอาศัยเพียงแค่การดมกลิ่นเท่านั้น","และภายใต้การปกปิดของเวทมนตร์หักเหแสง และความมืดมิดของรัตติกาล เครื่องบินรบเหล่านั้นก็ไม่ต่างอะไรกับยมทูตที่ไร้ตัวตน คอยเก็บเกี่ยวชีวิตของเหล่าอัศวินกริฟฟอนอย่างต่อเนื่อง","ในช่วงเวลาแห่งการโต้กลับและกอบกู้อาณาจักร เหล่าพ่อมดแห่งสถาบันเล่นแร่แปรธาตุ ก็ได้ผลิตและดัดแปลงเครื่องบินรบเวทมนตร์ออกมาเพิ่มอีกสี่ลำ โดยที่นักบินทั้งหมดล้วนถูกคัดเลือกมาจากบรรดาพ่อมดที่ยอดเยี่ยมที่สุด ถึงแม้ว่าการฝึกฝนจะหละหลวมไปบ้าง แต่ก็เพียงพอที่จะใช้รับมือกับอัศวินกริฟฟอนเหล่านี้แล้ว","ลิเดียที่มีทักษะการขับเครื่องบินที่เชี่ยวชาญที่สุด ได้มุ่งเป้าไปที่มังกรไฟลาวาขนาดมหึมา ที่อยู่ท่ามกลางขบวนเรือเหาะ","เมื่อปุ่มยิงปืนกลถูกกดลง ปืนกลที่ติดตั้งอยู่บนปีกทั้งสองข้างก็เริ่มยิงอีกครั้ง ห่ากระสุนลูกโซ่สาดซัดเข้าใส่แผ่นหลังของมังกรไฟอย่างต่อเนื่อง ประกายไฟหลายสายสาดกระเซ็นออกมา และยังมีเสียงดังกึกก้องราวกับเหล็กปะทะกันอีกด้วย","“แข็งอะไรขนาดนี้!”","ลิเดียอุทานออกมาเหมือนกับที่ลินน์พูด ต้องรู้ก่อนนะว่าปืนกลของเครื่องบินรบ ไม่ได้ใช้กระสุนตะกั่ว แต่เป็นกระสุนแบบตลับที่มีอานุภาพรุนแรงกว่า แต่ผลลัพธ์กลับถูกเกล็ดมังกรกระแทกจนแตกกระจายไปเสียอย่างนั้น","แต่ลิเดียก็ไม่ได้ย่อท้อแต่อย่างใด เธอเร่งความเร็วขึ้นจนถึงขีดสุด และพุ่งตรงไปยังมังกรไฟขนาดมหึมาที่อยู่ตรงหน้า..."]},{"n":429,"t":"เครื่องบินรบรุ่นแรกปะทะมังกรไฟลาวา","c":["ห่ากระสุนที่สาดซัดเข้ามาอย่างต่อเนื่อง ไม่ได้ทำให้ซิริดให้ความสนใจมากนัก เพราะในขณะที่มังกรไฟลาวากำลังทำลายเรือเหาะอยู่นั้น มันก็ต้องเผชิญหน้ากับการตอบโต้กลับของพวกพ่อมดอยู่ตลอดเวลาเช่นกัน","ส่วนตัวซิริดเอง สมาธิส่วนใหญ่ของเขา ล้วนจดจ่ออยู่กับการสะกดข่มมังกรไฟลาวาที่อยู่ใต้ร่าง และการสร้างพลังศักดิ์สิทธิ์เพื่อปกป้องตัวเอง จึงไม่สามารถแบ่งสมาธิไปตรวจสอบการโจมตี ที่ไม่รู้ว่าบินมาจากที่ไหนนี้ได้มากนัก","แต่การประมาทศัตรูของเขาก็เป็นเรื่องที่ร้ายแรงถึงชีวิตอย่างเห็นได้ชัด เพราะเครื่องบินรบที่มีความเร็วสามร้อยหกสิบกิโลเมตรต่อชั่วโมงนั้น รวดเร็วราวกับสายลมพัดผ่าน เพียงแค่พริบตาเดียว มันก็ข้ามผ่านระยะทางหลายร้อยเมตรไปแล้ว","ก่อนที่จะพุ่งชนเข้ากับร่างมังกรอันใหญ่โต ลิเดียก็พยายามหักเหตัวเครื่องอย่างสุดกำลัง และดึงคันโยกสีแดงที่อยู่ด้านข้างลงมาจนสุดแรง","ในวินาทีที่บินสวนกับร่างของมังกร ลำแสงเลเซอร์อันรุนแรงสายหนึ่ง ก็พุ่งทะยานออกมาจากส่วนหัวของตัวเครื่อง","ส่วนปลายของเครื่องบินรบ ดูราวกับว่าถูกติดตั้งดาบศักดิ์สิทธิ์ที่ยาวไร้ที่สิ้นสุด และสามารถทำลายล้างได้ทุกสิ่งเอาไว้!","และระยะห่างในตอนที่ทั้งสองฝ่ายบินสวนกันนั้น กลับไม่ถึงสามสิบเมตรด้วยซ้ำ!","ลิเดียสามารถมองเห็นลวดลายพลังศักดิ์สิทธิ์ที่ดูราวกับโซ่ตรวน บนเกล็ดมังกรสีแดงฉานได้อย่างชัดเจน...ระยะห่างที่ใกล้ชิดเช่นนี้ ย่อมทำให้พลานุภาพของลำแสงเลเซอร์ถูกดึงออกมาใช้ได้อย่างถึงขีดสุด เกล็ดมังกรอันแข็งแกร่งถูกตัดขาดในพริบตา เมื่อเครื่องบินรบบินผ่านไป บนร่างมังกรอันใหญ่โตก็มีรอยเลือดที่ยาวหลายเมตรปรากฏขึ้น","เลือดสดๆ สาดกระเซ็นไปทั่วท้องฟ้า เสียงคำรามของมังกรดังกึกก้องไม่ขาดสาย","“นี่มันตัวอะไรกันแน่?”","ซิริดที่เพิ่งจะรู้ตัว ก็เพิ่งจะตระหนักได้ถึงความผิดปกติ หลังจากที่มังกรไฟที่อยู่ใต้ร่างได้รับบาดเจ็บ เขาทำได้เพียงแค่สัมผัสได้ลางๆ ว่ามีบางสิ่งบางอย่างบุกรุกเข้ามาในอาณาเขตของเขา โดยมันพุ่งผ่านไปในพริบตา ด้วยความเร็วที่ยากจะจินตนาการได้","เมื่อถูกโจมตีอย่างหนักอีกครั้ง มังกรไฟลาวาก็โกรธเกรี้ยวจนถึงขีดสุด ดวงตาสีแดงฉานคู่นั้นพยายามมองหาศัตรูที่โจมตีมันอย่างต่อเนื่อง แต่ผลของการปกปิดของเวทมนตร์หักเหแสงในตอนกลางคืนนั้นยอดเยี่ยมมาก มันจึงทำได้เพียงสัมผัสได้ถึงกระแสลมในตอนที่เครื่องบินรบบินผ่าน และเสียงดังกึ่งก้องของใบพัดเท่านั้น...","มังกรไฟอ้าปากกว้าง ลมหายใจมังกรอันร้อนระอุพุ่งออกมาอย่างต่อเนื่อง และกวาดไปทางทิศทางที่เสียงนั้นดังมา","เพียงแต่ความเร็วของเครื่องบินรบนั้นรวดเร็วเกินไปจริงๆ ภายใต้การควบคุมของลิเดีย มันก็ไม่ต่างอะไรกับปลาที่แหวกว่ายไปมาอย่างคล่องแคล่ว มันบินโฉบไปมาท่ามกลางลมหายใจมังกรอันดุดัน และยังคอยยิงปืนกลเพื่อตอบโต้กลับเป็นระยะๆ...","เสียงปืนกลที่ดังสนั่นหวั่นไหวตามมาด้วยห่ากระสุนที่สาดซัดเข้ามาอย่างต่อเนื่องอีกครั้ง ในเวลาเพียงสิบกว่าวินาที กระสุนหลายร้อยนัดก็ถูกยิงออกไป และพุ่งเข้าโจมตีร่างของมังกรไฟอย่างต่อเนื่อง","แม้ว่าส่วนใหญ่จะถูกเกล็ดมังกรอันแข็งแกร่งกระแทกจนกระเด็นออกไป แต่ก็มีกระสุนไม่น้อยที่พุ่งตรงเข้าไปในบาดแผลที่กำลังมีเลือดไหลซึมออกมา ซึ่งทำให้บาดแผลนั้นทวีความรุนแรงยิ่งขึ้น เลือดสีแดงฉานไหลหยดลงมาจากหางมังกรอย่างต่อเนื่อง","ท่ามกลางเสียงคำรามแห่งความโกรธแค้นและความเจ็บปวด ลมหายใจมังกรอันร้อนระอุก็ยิ่งทวีความดุดันมากยิ่งขึ้น มังกรทั้งตัวพุ่งตรงไปยังทิศทางที่ห่ากระสุนสาดซัดเข้ามาโดยตรง","ลิเดียเป็นคนกล้าหาญมาก แต่เธอก็เข้าใจดีว่าเครื่องบินรบของเธอ ไม่มีทางที่จะไปปะทะกับมังกรแบบตาต่อตาฟันต่อฟันได้หรอก อีกทั้งลมหายใจมังกรที่กำลังลุกไหม้ ก็ยังส่งผลกระทบต่อการต่อสู้ในระดับหนึ่งด้วย","เพราะถึงยังไง การที่เธอสามารถมองเห็นสิ่งต่างๆ ในความมืดมิด และโจมตีเป้าหมายได้อย่างแม่นยำ ย่อมไม่ได้อาศัยเพียงแค่การมองเห็นเท่านั้น แต่มันยังได้ประโยชน์จากเวทมนตร์ตรวจจับความร้อนอีกด้วย","และนี่ก็คือเหตุผลว่าทำไม นักบินที่ขับเครื่องบินรบ จะต้องถูกคัดเลือกมาจากบรรดาพ่อมดเท่านั้น","โชคดีที่การต่อสู้ ไม่ได้วัดกันที่ว่าใครมีขนาดตัวที่ใหญ่กว่า หรือมีเวทมนตร์ที่ร้ายกาจกว่า เพราะถ้าโจมตีไม่โดน ข้อได้เปรียบเหล่านี้ก็ไร้ความหมาย!","เห็นได้ชัดว่าลิเดียนำคำว่า ‘การต่อสู้แบบฉาบฉวย’ มาใช้ได้อย่างถึงแก่น เธอรักษาระยะห่างเอาไว้เสมอ และบินวนรอบมังกรไฟขนาดยักษ์ คอยยิงปืนกลเพื่อโจมตีเป็นระยะๆ คอยรังควานและยั่วยุมังกรไฟที่กำลังกราดเกรี้ยวตัวนี้อย่างต่อเนื่อง เมื่อหาจังหวะที่เหมาะสมได้ ก็จะเข้าไปใกล้ๆ และใช้ลำแสงเลเซอร์โจมตีอย่างหนักหน่วง!","ตามคำพูดของท่านศาสตราจารย์ ยิ่งศัตรูโกรธแค้นและขาดสติมากเท่าไหร่ ก็จะยิ่งมีโอกาสมากเท่านั้น!","ส่วนซิริดที่อยู่บนหลังมังกรน่ะเหรอ?","เป้าหมายนี้มันเล็กเกินไปจริงๆ ภายใต้เวทมนตร์ตรวจจับความร้อน มันถูกความร้อนมหาศาลของมังกรไฟปกปิดเอาไว้จนมิด ทำให้หาตัวไม่พบเลย","ประกอบกับการที่มังกรไฟเองก็เคลื่อนที่อยู่ตลอดเวลา การที่จะโจมตีเป้าหมายเล็กๆ ท่ามกลางท้องฟ้ายามค่ำคืนที่ทัศนวิสัยจำกัดเช่นนี้ จึงไม่ต่างอะไรกับเรื่องเพ้อฝัน ดังนั้น ลิเดียจึงทุ่มเทสมาธิทั้งหมดไปกับการรับมือกับมังกรตัวนี้","หลังจากที่ทั้งสองฝ่ายต่อสู้พัวพันกันอยู่หลายนาที บนร่างมังกรก็มีบาดแผลที่น่าหวาดเสียวเพิ่มขึ้นมาอีกหลายสิบแห่ง","มังกรไฟลาวาที่เดิมทีก็เกือบจะคุ้มคลั่งอยู่แล้ว จึงสูญเสียการควบคุมอย่างสมบูรณ์ ลมหายใจมังกรปกคลุมไปทั่วฟ้า หางมังกรสะบัดอย่างบ้าคลั่ง และโจมตีอย่างสะเปะสะปะโดยไร้จุดหมาย","ลิเดียหลบการสะบัดหางของมังกรไปได้อย่างหวุดหวิด จากนั้นเธอก็สาดกระสุนเข้าใส่ร่างของมังกรไฟอีกระลอกหนึ่ง...","“พลังชีวิตของมันแข็งแกร่งเกินไปแล้ว!”","ลิเดียมองดูมังกรไฟลาวาที่ยังคงส่งเสียงโอดครวญ แต่ก็ยังไม่ยอมล้มลง ด้วยความรู้สึกตกใจอยู่ในใจ เธอไม่เคยเห็นสิ่งมีชีวิตชนิดไหน ที่โดนลำแสงเลเซอร์เข้าไปตั้งหลายนัด และโดนปืนกลกราดยิงใส่ขนาดนี้แล้ว แต่ยังคง ‘มีชีวิตชีวา’ ได้แบบนี้มาก่อนเลย","กระสุนจำนวนสี่พันนัดที่สำรองเอาไว้ในเครื่องบินรบ ก็ถูกใช้ไปแล้วถึงแปดส่วน พลังงานที่คอยจ่ายให้กับลำแสงเลเซอร์ ก็เหลืออยู่ไม่ถึงหนึ่งในสามแล้วด้วยซ้ำ...","ดูเหมือนว่าจะต้องประหยัดกระสุนสักหน่อยแล้วสิ แล้วค่อยๆ ผลาญพละกำลังและพลังชีวิตของอีกฝ่ายไปเรื่อยๆ ลิเดียไม่เชื่อหรอกว่าเจ้านี่จะมีร่างกายที่เป็นอมตะ เชื้อเพลิงของเครื่องบินรบยังเหลืออยู่อีกตั้งกว่าครึ่ง หากยืดเยื้อต่อไป ชัยชนะจะต้องตกเป็นของเธออย่างแน่นอน!","“พอได้แล้ว หยุดเดี๋ยวนี้!”","ซิริดจับหนามแหลมที่ยื่นออกมาบนหลังมังกรเอาไว้แน่น เขาถึงไม่ถูกสะบัดตกลงไป จากนั้นเขาก็ถ่ายเทพลังศักดิ์สิทธิ์จำนวนมากลงไปในอัญมณีรูปมังกร เพื่อบังคับควบคุมให้มังกรไฟลาวาที่อยู่ใต้ร่างหยุดการโจมตีที่ไร้ความหมายลง","เป้าหมายของพวกเขาไม่ได้อยู่ที่การต่อสู้พัวพันกับเป้าหมายที่มองไม่เห็น และโจมตีไม่โดนอยู่ที่นี่ แต่เป็นการถ่วงเวลาเอาไว้ และทำลายเรือเหาะเหล่านั้นให้ได้มากที่สุดเท่าที่จะเป็นไปได้","เพราะผลงานเล่นแร่แปรธาตุเหล่านี้ บรรทุกกองกำลังหลักของพวกพ่อมดเอาไว้ การยิงตกหนึ่งลำ ก็หมายความว่ามีทหารปืนคาบศิลาและพ่อมดนับร้อยคนจะต้องจบชีวิตลง","ภายใต้การควบคุมอย่างต่อเนื่องของซิริด มังกรไฟลาวาที่กำลังกราดเกรี้ยว จึงได้ระบายความโกรธแค้นและความอัดอั้นตันใจทั้งหมด ลงไปที่เรือเหาะที่ยังหนีไปได้ไม่ไกลนัก","เมื่อลิเดียเห็นมังกรไฟที่กลายเป็นบ้าไปแล้วภายใต้การ ‘ยั่วยุ’ ของเธอ จู่ๆ ก็หันกลับไปไล่ตามเรือเหาะเหล่านั้น เธอก็รีบบินตามไปทันที พร้อมกับเปิดค่ายกลขยายเสียงที่บรรดานักเล่นแร่แปรธาตุติดตั้งเพิ่มเอาไว้ให้ ก่อนจะเอ่ยเยาะเย้ยเสียงดัง","“มาตีฉันสิ ฉันอยู่นี่แล้ว...”","ลิเดียยั่วยุอยู่นาน เมื่อเห็นว่ามังกรชั่วร้ายตัวนี้ยังคงสนใจแต่จะไล่ตามเรือเหาะต่อไป เธอก็สบถด่าออกมาด้วยความโมโห","“มีแต่พวกขี้ขลาดเท่านั้นแหละที่จะหนี!”","ซิริดไม่ได้สนใจคำพูดของลิเดีย เขาควบคุมมังกรไฟที่อยู่ใต้ร่าง ให้เปลี่ยนตำแหน่งอย่างต่อเนื่อง เพื่อลดความถี่ในการถูกลำแสงเลเซอร์โจมตี","แม้ว่ามังกรไฟลาวาจะดูเหมือนยังมีชีวิตชีวาอยู่ แต่ซิริดที่ครอบครองอัญมณีรูปมังกร และสามารถรับรู้ถึงสถานะของอีกฝ่ายได้กลับเข้าใจดี ว่าบาดแผลเหล่านี้กำลังสูบพลังชีวิตของมันไปทีละนิด เพียงแต่มันไม่ได้แสดงออกมาชัดเจนนักเพราะความโกรธแค้นเท่านั้น","ในระหว่างที่มังกรไฟลาวายังคงทนรับการโจมตีไหว เขาจะต้องพยายามทำลายเรือเหาะเหล่านี้ให้ได้มากที่สุด และขัดขวางไม่ให้อีกฝ่ายเดินทางไปยังแหล่งผลิตน้ำมันดิน..."]},{"n":430,"t":"สังหารมังกร ระดับพลังงานขั้นที่ห้า!","c":["เมื่อเห็นเรือเหาะอีกลำถูกลมหายใจมังกรกลืนกินเข้าไป ลิเดียก็โกรธแค้นจนถึงขีดสุด แต่เธอก็ไม่มีวิธีอื่นใดเลย","เพราะปืนกลและลำแสงเลเซอร์ที่อยู่ด้านหน้า คือสองอาวุธร้ายแรงของเครื่องบินรบ แต่เห็นได้ชัดว่าทั้งสองอย่างนี้ ไม่สามารถสร้างความเสียหายถึงตายให้กับมังกรไฟตัวนี้ได้เลย มันทำได้เพียงแค่ทำให้อีกฝ่ายได้รับบาดเจ็บเท่านั้น","ลิเดียอดไม่ได้ที่จะหันไปมองปุ่มสีดำ ที่ดูไม่ค่อยสะดุดตาบนแผงควบคุมของเครื่องบินรบ","เครื่องบินรบรุ่นแรกที่เธอขับนั้น ค่อนข้างจะพิเศษกว่าลำอื่น เพราะมันผ่านการดัดแปลงมาเป็นพิเศษ เมื่อเทียบกับเครื่องบินรบลำอื่นๆ มันก็ยังมีฟังก์ชันทิ้งระเบิดเพิ่มขึ้นมาอีกด้วย","แต่ก่อนออกเดินทาง ท่านศาสตราจารย์เคยบอกกับเธอเอาไว้ ว่าสิ่งที่บรรทุกมาบนเครื่องบินรบในครั้งนี้นั้นร้ายกาจมาก และก็อันตรายมากๆ เช่นกัน หากไม่ระวังเพียงนิดเดียว ก็อาจจะก่อให้เกิดผลลัพธ์ที่ไม่อาจแก้ไขได้ ดังนั้น จึงจำเป็นจะต้องได้รับคำสั่ง ในช่วงเวลาที่สถานการณ์วิกฤตที่สุดเท่านั้น ถึงจะสามารถใช้งานมันได้","แม้ว่าลิเดียจะไม่รู้แน่ชัดว่ามันคืออะไร แต่มันจะต้องเป็นของที่ร้ายกาจมากๆ อย่างแน่นอน...","ตอนนี้ก็น่าจะเรียกได้ว่าเป็นสถานการณ์ที่วิกฤตแล้วใช่ไหมล่ะ?","ขืนปล่อยให้เป็นแบบนี้ต่อไป ทุกคนจะต้องถูกมังกรตัวนี้จัดการจนหมดแน่ๆ!","ในขณะที่ลิเดียกำลังลังเลอยู่นั้น จู่ๆ ก็มีเสียงหนึ่งดังขึ้นที่ข้างกายของเธอ","“ตอนนี้ยังไม่ใช่เวลาที่จะใช้เจ้านั่นหรอกนะ!”","เสียงที่ดังขึ้นมาอย่างกะทันหัน ทำให้ลิเดียตกใจจนสะดุ้งโหยง และเครื่องบินรบก็เกือบจะพุ่งชนเข้ากับบอลลูนของเรือเหาะที่อยู่ข้างๆ","“ดูเหมือนว่าทักษะการขับเครื่องบินของเธอ ยังต้องได้รับการฝึกฝนให้หนักขึ้นอีกเป็นเท่าตัวเลยนะ”","ลินน์ที่จู่ๆ ก็มาปรากฏตัวอยู่บนที่นั่งผู้ช่วยนักบินของเครื่องบินรบอย่างไม่มีปี่มีขลุ่ย เอ่ยด้วยความผิดหวังเล็กน้อย","ลิเดียกลอกตาไปมาเมื่อครู่นี้ เธอกำลังรวบรวมสมาธิคิดหาวิธีรับมือกับมังกรไฟอยู่ จู่ๆ ก็มีเสียงโผล่ขึ้นมาข้างๆ แบบนี้ จะไม่ให้ตกใจแทบตายได้ยังไงล่ะ!","แต่ลิเดียก็ไม่ได้โต้แย้งหรือบ่นอะไรออกมา แต่เธอกลับเอ่ยถามด้วยความประหลาดใจ","“ท่านศาสตราจารย์ ท่านมาอยู่ที่นี่ได้ยังไงคะ?”","“ข้าขอให้บรรดานักเล่นแร่แปรธาตุ ช่วยติดตั้งเวทมนตร์เล็กๆ เอาไว้ในเครื่องบินรบลำนี้ โดยมันจะสามารถส่งพลังเวทมนตร์และเจตจำนงส่วนหนึ่งมาที่นี่ได้ ในเวลาที่จำเป็นน่ะ”","ลินน์เอ่ยอธิบายประโยคหนึ่ง เครื่องบินรบลำนี้ เป็นหนึ่งในแผนสำรองของเขาอยู่แล้ว การดัดแปลงในภายหลัง เขาก็ได้เสนอความคิดเห็นไปไม่น้อย ย่อมเป็นไปไม่ได้เลยที่เขาจะไม่ได้เตรียมการอะไรเอาไว้บ้าง","“แล้วตอนนี้พวกเราควรจะทำยังไงกันดีล่ะคะ?”","ลิเดียขมวดคิ้วถาม มังกรตัวนั้นรับมือยากเกินไปจริงๆ แม้เธอจะใช้พลังจนหมดแล้ว แต่ก็ยังไม่สามารถจัดการอีกฝ่ายได้อยู่ดี","“ข้าจะเป็นคนเตรียมเวทมนตร์สำหรับสังหารมังกรตัวนี้เอง เธอพยายามเข้าไปให้ใกล้ที่สุด และถ่วงเวลาเอาไว้อีกสักหน่อย!”","ลินน์เอ่ยอย่างตรงไปตรงมา","“ได้เลยค่ะ!”","คิ้วที่ขมวดแน่นของลิเดียคลายออกในทันที สำหรับท่านศาสตราจารย์แล้ว เธอมักจะเชื่อมั่นในตัวเขาแบบร้อยเปอร์เซ็นต์เสมอ จากนั้นเธอก็ขับเครื่องบินรบ พุ่งเข้าหามังกรไฟอีกครั้ง","ส่วนลินน์ก็ลงมือรื้อระบบจ่ายพลังงานของอุปกรณ์ยิงเลเซอร์ และนำทับทิมเม็ดหนึ่งที่อยู่ด้านในออกมา","อุปกรณ์ยิงเลเซอร์ที่ติดตั้งอยู่บนเครื่องบินรบ สามารถปล่อยลำแสงเลเซอร์ระดับพลังงานที่สี่ ซึ่งมีเส้นผ่านศูนย์กลางประมาณ 0.3 มิลลิเมตรออกมาได้ และนี่ก็เป็นระดับที่ถูกสั่งทำขึ้นมาเป็นพิเศษแล้ว!","ซึ่งสามารถฉีกกระชากเหล็กกล้าได้อย่างง่ายดาย!","แต่ความรุนแรงในระดับนี้ ภายในระยะสามสิบเมตร กลับทำได้เพียงแค่เจาะทะลุการป้องกันของเกล็ดมังกรได้อย่างฝืนๆ เท่านั้น แต่ไม่สามารถสร้างบาดแผลถึงตายได้ เห็นได้ชัดเลยว่าพลังป้องกันของเจ้านี่สูงมากแค่ไหน!","ดังนั้น เขาจึงทำได้เพียงแค่เสี่ยงลองยกระดับมันให้ถึงระดับพลังงานขั้นที่ห้าดูสักครั้ง!","และสิ่งที่เรียกว่าระดับพลังงานทั้งห้าของเลเซอร์ ก็คือวงโคจรทั้งห้าของอิเล็กตรอนภายในอะตอมนั่นเอง ซึ่งหลักการของมันก็คือ อิเล็กตรอนจะดูดซับพลังงานก่อน จากนั้นก็จะกระโดดจากระดับพลังงานต่ำไปยังระดับพลังงานสูง และร่วงหล่นจากระดับพลังงานสูงกลับลงมายังระดับพลังงานต่ำอีกครั้ง ในกระบวนการนี้ พลังงานที่ถูกดูดซับเข้าไป ก็จะถูกปล่อยออกมาในรูปแบบของแสง!","ก่อนหน้านี้ สาเหตุที่เขาไม่พยายามยกระดับของลำแสงเลเซอร์ให้ไปถึงระดับพลังงานสูงสุด นั่นก็เป็นเพราะว่า สถานะของระดับพลังงานขั้นที่ห้านั้นยากที่จะควบคุม หากพลังงานที่ดูดซับเข้าไปสูงกว่าระดับนี้เพียงเล็กน้อย ธาตุก็จะกลายสภาพเป็นสถานะพลาสม่าโดยตรง แต่ถ้าหากต่ำกว่าเพียงเล็กน้อย มันก็จะร่วงกลับไปสู่ระดับพลังงานที่สี่ในทันที","แต่ตอนนี้ เพื่อรับมือกับมังกรไฟตัวนี้ เขาจึงทำได้เพียงแค่พยายามลองดูเท่านั้น!","โชคดีที่บนเครื่องบินรบ ยังมีทับทิมคุณภาพเยี่ยมที่สามารถใช้ร่ายเวทมนตร์เลเซอร์ได้อีกหนึ่งเม็ด ไม่อย่างนั้นด้วยสถานะของร่างจำลองนี้ ย่อมไม่มีทางที่จะปล่อยเวทมนตร์อันทรงพลังเช่นนี้ออกมาได้อย่างแน่นอน","ลินน์หลับตาลงและรวบรวมสมาธิในการร่ายเวทมนตร์ ทับทิมขนาดเท่ากำปั้นเม็ดนี้ หมุนวนไปมาอยู่ระหว่างฝ่ามือที่ประกบเข้าหากันอย่างต่อเนื่อง","จากนั้น ชั้นสะท้อนแสงหลายชั้น ก็ปรากฏขึ้นรอบๆ ทับทิมและห่อหุ้มมันเอาไว้ด้านใน...","ในขณะที่ลินน์กำลังร่ายเวทมนตร์อยู่นั้น ลิเดียก็เริ่มลงมือแล้วเช่นกัน โดยเธอเข้าไปใกล้มังกรไฟลาวาขนาดมหึมาอีกครั้ง และไม่ประหยัดกระสุนอีกต่อไป เสียงปืนกลที่ดังสนั่นหวั่นไหวดังกึกก้องขึ้นมาอีกครั้ง","ประกายไฟหลายสายสาดกระเซ็นออกมาอย่างต่อเนื่อง และพุ่งเข้าโจมตีร่างที่เต็มไปด้วยเลือดและเนื้อที่เละเทะ พร้อมเกล็ดบนร่างกายที่หลุดลอกออกมาอย่างต่อเนื่อง ซึ่งเผยให้เห็นเลือดเนื้อที่ดูราวกับลาวา","มังกรไฟที่ถูกรังควานอย่างต่อเนื่องก็โกรธเกรี้ยวจนถึงขีดสุด มันสะบัดหางพยายามขับไล่แมลงร้ายตัวนี้ไปให้พ้นทาง ในขณะเดียวกันก็ระบายความโกรธแค้นทั้งหมดลงไปที่เรือเหาะ","ในเวลาเพียงครึ่งนาทีสั้นๆ กระสุนปืนกลที่เหลืออยู่ก็ถูกยิงออกไปจนหมด พร้อมกับระยะห่างระหว่างทั้งสองฝ่ายก็ถูกดึงให้เข้ามาใกล้กันมาก ลิเดียจึงรีบเอ่ยเรียก","“ท่านศาสตราจารย์ ใกล้จะเสร็จหรือยังคะ!”","“ได้แล้ว เล็งไปที่หัวของมันแล้วลุยเลย!”","ลินน์ลืมตาขึ้น ก่อนจะเอ่ยด้วยน้ำเสียงที่รวดเร็ว กระจกสะท้อนแสงทรงกลมในมือของเขาสั่นไหวอย่างรุนแรง และอาจจะสูญเสียการควบคุมได้ทุกเมื่อ!","ภายในส่วนที่มองไม่เห็น ทับทิมเม็ดนั้นได้ส่องแสงสว่างเจิดจ้าจนถึงขีดสุดแล้ว!","“บุก บุกเข้าไปเลย!”","ลิเดียตื่นเต้นจนดึงคันโยกเร่งความเร็วลงมาจนสุด เครื่องบินรบพุ่งทะยานเข้าหามังกรไฟลาวาขนาดมหึมาด้วยความเร็วสูง และในวินาทีที่กำลังจะพุ่งชน เธอก็หักเลี้ยวอย่างกะทันหัน และบินโฉบผ่านด้านข้างของมังกรยักษ์ไป","ในวินาทีที่ทั้งสองฝ่ายบินสวนกัน ลำแสงที่มีขนาดเล็กราวกับเส้นผม ก็พุ่งทะยานออกมาจากชั้นสะท้อนแสง!","ซิริดที่อยู่บนหลังมังกร ก็สัมผัสได้ถึงการถูกบุกรุกอาณาเขตเช่นกัน จากนั้นแสงสว่างอันเจิดจ้าหาที่เปรียบไม่ได้ก็ปรากฏขึ้นตรงหน้า มันพุ่งตรงผ่านร่างมังกรไป พลานุภาพอันทรงพลังถึงกับทำให้ซิริดสัมผัสได้ถึงกลิ่นอายแห่งความตายที่คืบคลานเข้ามาใกล้!","โชคดีที่ลำแสงสายนี้เพียงแค่พุ่งผ่านไปในพริบตา และหายวับไปอย่างรวดเร็ว มังกรไฟลาวาที่อยู่ใต้ร่าง ก็ดูเหมือนจะไม่ได้รับผลกระทบอะไรมากนัก ซึ่งนั่นก็ทำให้ซิริดลอบถอนหายใจออกมาด้วยความโล่งอก","แกรก...","ในวินาทีต่อมา เสียงฉีกขาดเบาๆ ก็ดังขึ้นที่ข้างหูของซิริด จากนั้นภายใต้สายตาอันตื่นตระหนกของเขา อัญมณีรูปมังกรที่อยู่ในมือ ก็แตกกระจายออกเป็นเสี่ยงๆ โดยตรง!","ร่างมังกรที่กำลังบินไปตามแรงเฉื่อย พ่นเลือดสดๆ ออกมาเป็นจำนวนมาก ท่ามกลางเสียงคำรามด้วยความเจ็บปวด หัวมังกรขนาดมหึมาก็ถูกตัดขาดออกเป็นสองท่อนจากตรงกลาง!","และสิ่งที่ถูกตัดขาดไปด้วยกันนั้น ก็คือแขนซ้ายของซิริด เพราะสิ่งที่ถูกลำแสงเลเซอร์โจมตี ไม่ได้มีแค่มังกรไฟเท่านั้น แต่มันยังรวมถึงตัวเขาด้วย เพียงแต่ลำแสงสายนั้นพุ่งเข้ามาเร็วเกินไป ในวินาทีที่เขามองเห็น มันก็ได้ทะลุผ่านร่างกายของเขาไปแล้ว...","เมื่อเห็นร่างมังกรอันใหญ่โตถูกตัดออกเป็นสองท่อน ศพของมันร่วงหล่นลงมาราวกับเศษผ้าขี้ริ้ว ลิเดียก็พึมพำกับตัวเองเบาๆ","“สุดยอดไปเลย!”","ลินน์ที่อยู่บนที่นั่งนักบินผู้ช่วยก็ถอนหายใจออกมาด้วยความโล่งอก ดูเหมือนว่าทฤษฎีของเขาจะถูกต้องจริงๆ และโชคก็ถือว่าไม่เลวเลย ส่วนทับทิมในฝ่ามือของเขา ก็ได้กลายสภาพเป็นพลาสม่าอย่างสมบูรณ์ และไม่สามารถนำกลับมาใช้ได้อีกแล้ว..."]},{"n":431,"t":"ลังเลใจ กองทัพปราบปรามที่ตกอยู่ในสภาวะกลืนไม่เข้าคายไม่ออก","c":["เมื่อมังกรไฟลาวาร่วงหล่นลงมา บรรดาพ่อมดที่อยู่บนเรือเหาะก็พากันถอนหายใจออกมาด้วยความโล่งอก ในที่สุดพวกเขาก็ปลอดภัยแล้ว หลังจากที่จัดการกับปัญหาใหญ่ไปได้","ส่วนกองอัศวินกริฟฟอนของศาสนจักร ก็ยิ่งอ่อนแอจนทนรับการโจมตีไม่ไหว ภายใต้การรังควานของเครื่องบินรบหลายลำ พวกมันร่วงหล่นลงมาจากท้องฟ้าอย่างต่อเนื่องราวกับใบไม้ร่วง","บรรดาบิชอปที่อยู่บนพื้นดินก็เห็นฉากนี้เช่นเดียวกัน เมื่อเห็นมังกรไฟอันแข็งแกร่งที่สตรีศักดิ์สิทธิ์อัญเชิญมา ถูกตัดหัวในพริบตา และกองอัศวินกริฟฟอนก็ถูกโจมตีจนไม่มีทางสู้กลับได้เลย พวกเขาก็ทั้งตกใจและโกรธแค้น แต่ก็ไม่สามารถทำอะไรได้เลย","สิ่งที่สำคัญที่สุดก็คือ ภายใต้การปกปิดของความมืดมิดในยามค่ำคืนและเวทมนตร์หักเหแสง พวกเขามองไม่ออกเลยจริงๆ ว่าอัศวินกริฟฟอนเหล่านั้นถูกจัดการได้อย่างไร","“ท่านโจชัว สตรีศักดิ์สิทธิ์ หรือว่าพวกเราจะถอนทัพกันก่อนดีขอรับ”","พระคาร์ดินัลรูปหนึ่งเอ่ยเกลี้ยกล่อมอย่างระมัดระวัง","เมื่อไม่มีมังกรไฟแล้ว ส่วนกองอัศวินกริฟฟอนก็ยังได้รับความเสียหายอย่างหนักอีก ในการต่อสู้กลางเวหานั้น เรียกได้ว่าพวกเขาพ่ายแพ้อย่างย่อยยับ ซึ่งนั่นก็หมายความว่าพวกเขาได้สูญเสียพลังที่จะคอยควบคุมและสกัดกั้นเรือเหาะไปแล้ว และการต่อสู้หลังจากนี้ พวกเขาก็จะต้องเผชิญหน้ากับภัยคุกคามจากทางอากาศอยู่ตลอดเวลา","หรืออาจจะตกอยู่ในสถานการณ์ที่ยากลำบาก เหมือนกับการต่อสู้ที่ทะเลหมอก ที่ถูกคนอื่นไล่ตามโจมตีอยู่ตลอดเวลาก็เป็นได้","แต่ยังไม่ทันที่ลูเซียจะได้ตอบกลับอะไร ข้อเสนอนี้ก็ถูกคัดค้านอย่างรุนแรงจากบรรดาบิชอปทั้งหลาย","“ท่านหมายความว่าจะยอมยกอาวุธสงครามของจักรวรรดิให้พวกมันไปง่ายๆ และทนดูสมุนของปีศาจร้ายพวกนั้น เข่นฆ่าสาวกของพระผู้เป็นเจ้าอย่างนั้นหรือ?”","“ยอมไม่ได้เด็ดขาด นี่มันน่าอับอายชัดๆ!”","บรรดาบิชอปพากันโต้เถียงจนหน้าดำหน้าแดง พร้อมกับมีกริฟฟอนตัวหนึ่งที่ถูกปืนกลกราดยิงใส่ ร่วงหล่นลงมาทางนี้","ลูเซียไม่ได้สนใจการโต้เถียงของบรรดาบิชอป เธอยื่นมือออกไป แสงศักดิ์สิทธิ์อันอ่อนโยนก็ปรากฏขึ้น กริฟฟอนที่ร่วงหล่นลงมามีความเร็วที่ช้าลงเรื่อยๆ และตกลงบนพื้นอย่างนุ่มนวลในที่สุด","กริฟฟอนที่น่าสงสารตัวนี้ มีปีกขาดไปครึ่งหนึ่ง มันส่งเสียงร้องโหยหวนออกมาเป็นระยะๆ และยังมีสติสัมปชัญญะหลงเหลืออยู่บ้างเล็กน้อย","อัศวินที่อยู่บนหลังของมัน ยิ่งไม่ต้องพูดถึง เขาถูกปืนกลยิงจนร่างพรุนเป็นรังผึ้ง ศพกระเด็นหายไปไหนแล้วก็ไม่รู้","‘หยาดฝนศักดิ์สิทธิ์ประทานพร’","ลูเซียลูบหัวของกริฟฟอนเบาๆ ละอองน้ำที่แฝงไปด้วยแสงศักดิ์สิทธิ์ ก็ปกคลุมลงบนร่างที่แหลกเหลวในทันที ร่างกายที่ถูกปืนกลเจาะทะลุ ค่อยๆ ฟื้นฟูสภาพกลับมาด้วยความเร็วที่มองเห็นได้ด้วยตาเปล่า และปีกที่ขาดหายไปก็งอกกลับคืนมาอีกครั้ง","กริฟฟอนที่ฟื้นตัวกลับมาแล้ว ดูเหมือนจะยังไม่สามารถคลายความหวาดกลัวลงไปได้ มันจึงส่งเสียงร้องออกมาเป็นระยะๆ...","ลูเซียสะบัดชายกระโปรงที่กว้างใหญ่ของเธอ และขึ้นไปนั่งบนหลังของสัตว์ร้ายขนาดยักษ์ตัวนี้อย่างคล่องแคล่ว พร้อมกับใช้พลังศักดิ์สิทธิ์สะกดข่มความหวาดกลัวของกริฟฟอนเอาไว้","ในตอนนี้บรรดาบิชอปต่างก็ไม่มีกะจิตกะใจจะมาโต้เถียงกันอีกต่อไป พวกเขามองไปยังสตรีศักดิ์สิทธิ์ด้วยความตกใจและสงสัย","“ท่านลูเซีย นี่ท่านคงไม่ได้คิดจะลงสนามรบด้วยตัวเองหรอกนะขอรับ?”","“มันอันตรายเกินไปแล้ว อีกอย่าง หากพึ่งพาท่านเพียงคนเดียว เกรงว่ามันคงจะไม่ช่วยอะไรหรอกขอรับ”","พระคาร์ดินัลรูปหนึ่งรีบเอ่ยห้ามด้วยความร้อนรน","แม้ว่าก่อนหน้านี้ พลังอันแข็งแกร่งที่ลูเซียแสดงออกมาในตอนที่อัญเชิญและตกเป็นทาสของมังกรไฟ จะทำให้พวกเขามีมุมมองต่อสตรีศักดิ์สิทธิ์เปลี่ยนไปมาก แต่พวกเขาก็ยังคงไม่เห็นด้วยกับการกระทำที่เสี่ยงอันตรายเพียงลำพังของอีกฝ่ายอยู่ดี","เพราะถึงยังไง สตรีศักดิ์สิทธิ์ก็เปรียบเสมือนหน้าตาของศาสนจักร และเป็นผู้รับใช้ของพระผู้เป็นเจ้า จะปล่อยให้เธอไปเสี่ยงอันตรายง่ายๆ ไม่ได้เด็ดขาด","ยิ่งไปกว่านั้น หลังจากที่ได้รับเลือก ลูเซียก็ใช้ชีวิตอย่างสุขสบายอยู่ในนครศักดิ์สิทธิ์มาโดยตลอด เธอจึงไม่มีประสบการณ์ในการต่อสู้เลยแม้แต่น้อย ต่อให้จะมีพลังที่แข็งแกร่งมากแค่ไหน ก็ใช่ว่าจะสามารถดึงออกมาใช้ได้อย่างเต็มประสิทธิภาพ!","ในขณะที่พากันเอ่ยเกลี้ยกล่อม บรรดาบิชอปก็หันไปมองโจชัวเช่นกัน โดยหวังว่าท่านประธานผู้พิพากษาผู้นี้ จะสามารถหยุดยั้งการกระทำที่วู่วามของลูเซียได้","แต่โจชัวกลับไม่ได้ทำตามความปรารถนาของพวกเขา เขากลับเอ่ยถามด้วยความเคารพว่า","“มีอะไรให้พวกเราช่วยไหมขอรับ ท่านลูเซีย?”","ลูเซียกวาดสายตามองไปที่เรือเหาะที่กระจายตัวกันอยู่บนท้องฟ้าอีกครั้ง ก่อนจะเอ่ยด้วยน้ำเสียงเด็ดขาด","“เจ้านำคนจำนวนหนึ่ง กลับไปที่เมืองน้ำมันดินเดี๋ยวนี้!”","“จำนวนของพวกมันน้อยเกินไปจริงๆ!”","ลูเซียพึมพำออกมา","เมื่อสิ้นเสียง กริฟฟอนที่ฟื้นฟูสภาพเสร็จแล้วก็กางปีกบินขึ้นสู่ท้องฟ้า โดยมีฝุ่นควันที่ถูกพัดฟุ้งกระจาย ทำให้บรรดาบิชอปนับสิบรูปต้องขมวดคิ้ว แต่สิ่งที่ทำให้พวกเขาสับสนยิ่งกว่าก็คือคำพูดของลูเซีย","กลับไปที่เมืองน้ำมันดินงั้นเหรอ?","นี่หมายความว่าจะให้พวกเขาถอนทัพไปก่อนอย่างนั้นหรือ?","หรือว่าจะให้คนบางส่วนถอนตัวไปก่อน?","“ทำตามนั้นเถอะ!”","โจชัวไม่ได้ลังเลเลยแม้แต่น้อย เขาหันไปมองบรรดาบิชอป ก่อนจะเอ่ยสั่งการอย่างตรงไปตรงมา","“ข้าจะนำกองทัพทัณฑ์ศักดิ์สิทธิ์ส่วนหนึ่ง มุ่งหน้าไปยังเมืองน้ำมันดินเดี๋ยวนี้ แร็กนาร์ เจ้าเป็นคนรับผิดชอบสั่งการเรื่องหลังจากนี้ก็แล้วกัน!”","“แต่ว่า ท่านประธานผู้พิพากษาศักดิ์สิทธิ์...”","คาร์ดินัลแร็กนาร์มีสีหน้าลังเลใจ คำสั่งที่ดูสับสนวุ่นวายและไร้เหตุผลเช่นนี้ พวกเขาจะต้องทำตามจริงๆ งั้นเหรอ?","บรรดาบิชอปรูปอื่นๆ เองก็ไม่พอใจเป็นอย่างมาก พวกเขาคิดว่านั่นเป็นเพียงแค่การสั่งการส่งเดชของลูเซีย ที่ไม่มีประสบการณ์ในการทำสงครามเลยแม้แต่น้อย โดยอาศัยเพียงแค่ฐานะอันสูงส่งของตัวเองเท่านั้น","ท่ามกลางเสียงแห่งความเคลือบแคลงสงสัย โจชัวก็ค่อยๆ เอ่ยปากขึ้นมา","“สตรีศักดิ์สิทธิ์ได้รับวิวรณ์จากพระเจ้าแล้ว คำสั่งของนางก็คือเจตจำนงของพระผู้เป็นเจ้า!”","แร็กนาร์และคนอื่นๆ หุบปากลงในทันที เพราะพวกเขาเข้าใจดีว่า ท่านประธานผู้พิพากษาศักดิ์สิทธิ์ ไม่มีทางเอาเรื่องนี้มาล้อเล่นอย่างแน่นอน!","หลังจากที่เอ่ยสั่งการอีกสองสามประโยค โจชัวก็นำกองทัพทัณฑ์ศักดิ์สิทธิ์จำนวนสามพันนาย ออกเดินทางไปยังเมืองน้ำมันดิน...","ในขณะเดียวกัน บรรดาอัศวินทัณฑ์ศักดิ์สิทธิ์ที่ออกไปตามหาและรักษาผู้บาดเจ็บ ก็พากันเดินทางกลับมา","อัศวินกริฟฟอนที่ถูกลำแสงเลเซอร์และปืนกลโจมตี จนร่วงหล่นลงมาจากท้องฟ้า เรียกได้ว่าโอกาสรอดชีวิตแทบจะเป็นศูนย์ ส่วนเรือเหาะที่ถูกเปลวเพลิงยิงจนร่วงหล่นลงมาก็ไม่เว้น ไม่พบผู้รอดชีวิตเลยแม้แต่คนเดียว","แร็กนาร์คิดอะไรบางอย่างขึ้นมาได้ จึงเอ่ยถามขึ้นอย่างกะทันหัน","“เรือเหาะเหล่านั้นถูกตรวจสอบหรือยัง? บนนั้นมีศพอยู่กี่ศพ?”","“น่าจะไม่ถึงยี่สิบศพขอรับ!”","อัศวินที่เข้ามารายงานตอบอย่างลังเล แม้เรือเหาะส่วนใหญ่ถูกลมหายใจมังกรอันร้อนระอุเผาทำลายจนแทบไม่เหลือซากก่อนที่จะตกลงมาเสียอีก ศพก็ถูกเผาจนไหม้เกรียม แต่จำนวนก็น่าจะไม่เกินนี้อย่างแน่นอน...","“มียี่สิบศพเองงั้นเหรอ?!”","รูม่านตาของแร็กนาร์หดตัวลงเล็กน้อย ในใจของเขาอดไม่ได้ที่จะเกิดความรู้สึกหนาวสั่นขึ้นมา และตระหนักได้ถึงปัญหาบางอย่าง ที่พวกเขาละเลยมาโดยตลอดในทันที","เรือเหาะที่พวกเขามองเห็นนั้น มีเพียงร้อยกว่าลำเท่านั้น และตามการคาดเดาก่อนหน้านี้ หลังจากจบศึกครั้งนั้น กองทัพของพวกพ่อมด ก็น่าจะยังมีจำนวนคนเหลืออยู่อีกประมาณแปดพันคน ซึ่งนี่ก็ยังไม่นับรวมกำลังเสริมที่ตามมาในภายหลังอีกนะ","นั่นก็หมายความว่า เรือเหาะแต่ละลำ จะต้องบรรทุกคนจำนวนเจ็ดถึงแปดสิบคนถึงจะถูกสิ แถมยังจะต้องบรรทุกอาวุธชนิดใหม่ที่หนักอึ้งเหล่านั้นอีก...","นี่มันเป็นไปไม่ได้เลย!","ไม่ใช่แค่แร็กนาร์เท่านั้น แต่บรรดาบิชอปรูปอื่นๆ ก็ตอบสนองกลับมาอย่างรวดเร็วเช่นกัน และเข้าใจในทันที ว่าทำไมสตรีศักดิ์สิทธิ์ถึงได้สั่งให้พวกเขาจัดส่งคนไปสนับสนุนเมืองน้ำมันดินอย่างกะทันหัน!","เพราะกองกำลังหลักของพวกพ่อมดไม่ได้อยู่ที่นี่ตั้งแต่แรก พวกเขาอาจจะยังคงหลบซ่อนตัวอยู่ภายในเมืองแห่งนั้น เพียงแต่สร้างภาพลวงตาว่าถอนกำลังออกไปแล้ว เพื่อให้ทุกคนมุ่งหน้าไปไล่ตามเรือเหาะ...","เมื่อตระหนักได้ถึงจุดนี้ แร็กนาร์ก็มีเหงื่อเย็นๆ ผุดขึ้นมาบนหน้าผากทันที","ฝั่งหนึ่งก็คือแหล่งผลิตน้ำมันดินที่สำคัญเป็นอย่างมาก ส่วนอีกฝั่งก็คือป้อมปราการและเมืองที่แข็งแกร่งทางภาคตะวันตกของจักรวรรดิ เป้าหมายที่แท้จริงของพวกพ่อมดคือที่ไหนกันแน่?"]},{"n":432,"t":"นี่คือกลยุทธ์โจมตีจุดตาย และลอบตีเฉินชาง!","c":["เที่ยงคืน กองไฟที่ลุกโชนส่องสว่างลานกว้างที่มืดมิดจนสว่างไสว","คนยากจนนับหมื่นคนเข้าแถวเรียงยาวท่ามกลางความมืดมิดในยามค่ำคืน","ลอเรน หัวหน้าทหารยามถือแส้ยาวที่มีหนามแหลมอยู่ในมือ และเอ่ยด้วยน้ำเสียงดุดัน","“เอาเงินที่ได้รับแจกมาส่งคืนให้ข้าให้หมด ใครกล้าแอบซ่อนเอาไว้ ก็ลองถามแส้ในมือของข้าดูก่อนก็แล้วกัน!”","“ข้าจำได้ว่ามันน่าจะเป็นสิบสองเหรียญเงินนะ!”","ลอเรนแค่นเสียงหัวเราะเย็นชา","บรรดาคนยากจนที่อยู่ในลานกว้างต่างพากันมองหน้ากันไปมา ผ่านไปครู่ใหญ่ ถึงมีคนยากจนในชุดขาดวิ่นคนหนึ่งเอ่ยขึ้นอย่างระมัดระวัง","“ท่านลอเรน ท่านจำผิดหรือเปล่าขอรับ มันน่าจะเป็นสิบเหรียญเงินต่างหาก...”","ก่อนหน้านี้ หลังจากที่พวกพ่อมดเข้ายึดครองเมืองแห่งนี้ ก็ได้ทำการกวาดล้างครั้งใหญ่ โดยการแขวนคอบรรดาขุนนางและอันธพาลที่ชอบทำเรื่องชั่วร้ายอยู่เป็นประจำไปเป็นจำนวนมาก จากนั้นก็นำทรัพย์สินส่วนใหญ่ที่ยึดมาได้แจกจ่ายให้กับผู้คน","คนยากจนแต่ละคนจะได้รับเงินสิบเหรียญเงิน เพื่อเป็นค่าชดเชยที่ถูกขุนนางกดขี่และใช้งานเยี่ยงทาส...","แม้ว่าภายใต้การโฆษณาชวนเชื่อของศาสนจักร พ่อมดจะกลายเป็นตัวแทนของความชั่วร้ายไปแล้ว แต่เมื่อต้องเผชิญหน้ากับความเย้ายวนของเงินตราที่อยู่ตรงหน้า คนยากจนที่ใช้ชีวิตอย่างยากลำบากส่วนใหญ่ก็ยังคงเลือกที่จะรับมันเอาไว้อยู่ดี","“เจ้าคิดจะหลอกข้าอย่างนั้นรึ?”","ลอเรนยกยิ้มเหี้ยมเกรียมขึ้นมาที่มุมปาก เขาเงื้อแส้ยาวในมือขึ้นสูงอย่างกะทันหัน และฟาดลงไปที่คนยากจนคนนั้นอย่างสุดแรง","เพียะ!","เสียงดังกังวานดังขึ้น คนยากจนผู้โชคร้ายส่งเสียงร้องโหยหวนออกมาในทันที แก้มของเขาบวมปูดขึ้นมาอย่างเห็นได้ชัด","“ข้าบอกว่าสิบสองเหรียญ ก็คือสิบสองเหรียญ!”","ลอเรนแค่นเสียงเย็นชา ก่อนจะฟาดแส้ลงไปอีกครั้ง คนยากจนผู้โชคร้ายล้มลงไปนอนกองกับพื้นด้วยความเจ็บปวด ร่างกายของเขาสั่นสะท้านไปทั้งตัว","ลอเรนจ้องมองไปยังสายตาที่หวาดกลัวของคนยากจนคนอื่นๆ ด้วยความรู้สึกสะใจเป็นอย่างมาก พวกพ่อมดบัดซบพวกนั้นได้ปล้นสะดมคฤหาสน์ของขุนนางทุกแห่ง และตระกูลลอเรนของเขาก็ย่อมไม่ได้รับการยกเว้นเช่นกัน","แต่สิ่งที่ทำให้เขารู้สึกยากที่จะเข้าใจยิ่งกว่าก็คือ พวกพ่อมดกลับนำทรัพย์สมบัติจำนวนมหาศาล ไปแจกจ่ายให้กับพวกชั้นต่ำเหล่านี้!","ลอเรนคิดว่า จะต้องมีคนยากจนบางคน แอบสมคบคิดกับพวกพ่อมดอย่างลับๆ และลอบส่งข่าวให้ ถึงได้รับรางวัลเหล่านี้ ไม่อย่างนั้นใครจะไปรังเกียจว่าตัวเองมีเงินเยอะเกินไปล่ะ?","ด้วยเหตุนี้ ลอเรนจึงนำเรื่องที่คนยากจนเหล่านี้สมคบคิดกับพวกพ่อมด ไปรายงานให้กับท่านบิชอป และได้รับสิทธิ์ในการลงโทษคนยากจนเหล่านี้ รวมถึงการทวงคืนทรัพย์สมบัติที่ถูกปล้นไป ยิ่งไปกว่านั้น เขายังเตรียมที่จะสั่งสอนพวกคนทรยศเหล่านี้ ให้รู้สำนึกเสียบ้าง ซึ่งเงินสองเหรียญเงินที่เพิ่มขึ้นมานั้น ก็คือบทลงโทษ!","ภายใต้คำขู่ของลอเรน ชาวเมืองที่โกรธแค้นแต่ก็ไม่กล้าพูดอะไร ก็ทำได้เพียงแค่ส่งมอบทรัพย์สินเพียงน้อยนิดที่ตัวเองมีอยู่ออกไปเท่านั้น","ส่วนใครที่จ่ายเงินไม่ครบ ก็จะถูกทุบตีอย่างหนัก!","เงินสองเหรียญเงินที่เพิ่มขึ้นมา ดูเหมือนจะไม่เยอะเท่าไหร่ แต่คนยากจนส่วนใหญ่ก็ยากไร้มากอยู่แล้ว การทำเช่นนี้ ย่อมไม่ต่างอะไรกับการพรากเอาชีวิตของพวกเขาไปเลย...","มีคนยากจนคนหนึ่ง ที่แม้แต่เหรียญเงินเพียงเหรียญเดียวก็ยังไม่มีจ่าย ในฐานะสาวกที่ศรัทธาต่อพระผู้เป็นเจ้ามากที่สุด เขาเชื่อมั่นอย่างแน่วแน่ว่าพวกพ่อมดไม่ได้มาดี และจะต้องร่ายเวทมนตร์อันชั่วร้ายบางอย่างลงไปบนเงินเหล่านั้นอย่างแน่นอน ดังนั้น เขาจึงไม่ได้ไปรับเงินชดเชยเลยตั้งแต่แรก...","แต่ลอเรนกลับไม่สนอะไรทั้งนั้น เพราะเขาไม่เชื่อหรอกว่าจะมีใครที่ไม่ยอมรับเหรียญเงินที่มาส่งถึงมือแบบนี้ เขาจึงสะบัดแส้และฟาดลงไปอย่างรุนแรง โดยระบายความโกรธแค้นที่มีต่อพวกพ่อมดทั้งหมด ลงไปที่คนยากจนเหล่านี้!","โดยลืมไปเสียสนิทเลยว่า เมื่อครึ่งชั่วโมงก่อน ตัวเขาเองก็คุกเข่าอ้อนวอนขอการอภัยจากท่านประธานผู้พิพากษาศักดิ์สิทธิ์ และสตรีศักดิ์สิทธิ์อยู่บนพื้นเช่นเดียวกัน...","เวลาเพียงหนึ่งนาทีสั้นๆ ลอเรนก็ทุบตีสาวกผู้ศรัทธาคนนี้จนแทบจะทนไม่ไหวแล้ว และในจังหวะที่เขากำลังเตรียมที่จะฟาดชายคนนี้ให้ตายทั้งเป็น เพื่อเป็นการข่มขวัญคนยากจนคนอื่นๆ ที่คิดจะโกหก จู่ๆ เสียงปืนใหญ่ที่ดังกึกก้องก็ดังมาจากนอกเมืองอย่างกะทันหัน!","เสียงนี้...มันปืนใหญ่นี่?","ลอเรนสะดุ้งโหยงในทันที ความหวาดกลัวที่ออกมาจากก้นบึ้งของหัวใจ ผุดขึ้นมาในใจของเขา เพราะเมื่อหลายวันก่อน พวกพ่อมดก็ใช้ปืนใหญ่ที่รุนแรงแบบนี้ ยิงทำลายประตูเมืองอันแข็งแกร่งเช่นเดียวกัน","แต่นี่มันจะเป็นไปได้ยังไง?","พวกพ่อมดไม่ได้นั่งเรือเหาะไปโจมตีแหล่งผลิตน้ำมันดินแล้วอย่างนั้นเหรอ?","ตอนนี้พวกมันน่าจะกำลังถูกกองทัพปราบปรามของศาสนจักรโจมตีจนต้องหนีหัวซุกหัวซุนอยู่สิ","หรือว่ากองทัพปราบปรามจะพ่ายแพ้แล้ว?","ลอเรนไม่ยอมเชื่อในความเป็นไปได้นี้เด็ดขาด แต่ในไม่ช้า เขาก็เห็นทหารรักษาการณ์เมืองหลายร้อยนาย ทิ้งหมวกและชุดเกราะ และวิ่งหนีตายมาทางนี้","“หนีเร็ว เป็นพวกพ่อมด พวกพ่อมดบุกกลับมาอีกแล้ว!”","ทหารรักษาการณ์เมืองหลายนายตะโกนออกมาอย่างสุดเสียง จากนั้นพวกเขาก็ถูกปืนคาบศิลายิงจนล้มลงไปกองกับพื้น","ภายใต้แสงจันทร์และแสงจากกองไฟ ทหารปืนคาบศิลาหลายพันนายที่ดูดุดันราวกับหมาป่าในระยะไกล ได้กำลังมุ่งหน้ามาทางนี้ ซึ่งทำให้ลอเรนตกใจจนแทบสิ้นสติ เขาจึงรีบสั่งให้ทหารยามที่อยู่ข้างๆ ไปสกัดกั้นพวกมันเอาไว้ ส่วนตัวเองก็แย่งม้าศึกมาตัวหนึ่ง และตั้งใจจะหาทางหนีเอาตัวรอด","บรรดาคนยากจนที่เต็มไปด้วยความโกรธแค้น ย่อมไม่ยอมทนดูให้ลอเรนหนีไปได้ง่ายๆ พวกเขาพากันกระโจนเข้าไป ลากตัวเขาลงมาจากม้าศึก จากนั้นก็ทั้งเตะและต่อย หรือแม้กระทั่งใช้ฟันกัด ใช้เล็บข่วน...","“ไสหัวไปให้พ้น! พวกชั้นต่ำอย่างพวกเจ้า รอให้ท่านประธานผู้พิพากษาศักดิ์สิทธิ์มาถึงก่อนเถอะ พวกเจ้าจะต้องถูกจับโยนลงนรกกันให้หมด!”","ลอเรนตะโกนออกมาด้วยความตื่นตระหนก แต่ทหารยามที่อยู่ใต้บังคับบัญชาของเขากลับหนีหายไปจนหมดแล้ว ลำพังเพียงแค่เขาคนเดียว ย่อมไม่มีทางที่จะต่อต้านการรุมทำร้ายของกลุ่มนี้ได้อย่างแน่นอน และภายใต้หมัดเหล็กแห่งความยุติธรรม ในไม่ช้าเขาก็แน่นิ่งไป","และในเวลาเดียวกันนี้เอง กองทหารปืนคาบศิลาก็บุกมาถึงลานกว้างที่เต็มไปด้วยผู้คนแล้ว บรรดาคนยากจนต่างก็รอรับการพิพากษาจากพวกพ่อมดด้วยความหวาดกลัวและตื่นตระหนก","แต่เรย์เดลที่เป็นผู้นำ เมื่อได้ทราบเรื่องราวทั้งหมด เขาก็สั่งให้คนนำเงินที่ลอเรนยึดมาได้ กลับไปแจกจ่ายให้กับผู้คนทีละคน ส่วนสาวกที่ถูกแส้ฟาดจนแทบจะทนไม่ไหว ก็ได้รับการรักษาเช่นกัน","แต่หลังจากที่บาดแผลทางร่างกายได้รับการรักษาด้วยเวทมนตร์แล้ว สาวกผู้ศรัทธาคนนี้ก็ดูเหม่อลอย ราวกับคนไร้วิญญาณ","บรรดาคนยากจนที่ได้รับเงินคืนมาอีกครั้งต่างก็มีสีหน้าเหลือเชื่อ ในใจของพวกเขาก็มีความคิดหนึ่งผุดขึ้นมาลางๆ","ดูเหมือนว่าภายใต้การปกครองของพวกพ่อมด มันก็ไม่ได้มีอะไรแย่นักหรอก","อย่างน้อยก็ไม่มีใครคิดจะมาแย่งชิงเงินเก็บเพียงน้อยนิดที่พวกเขาเหลืออยู่ไป","ภายใต้การบุกโจมตีอย่างกะทันหัน กองทหารปืนคาบศิลาก็สามารถยึดอำนาจการควบคุมเมืองแห่งนี้กลับคืนมาได้อย่างรวดเร็ว","เนื่องจากกองทัพปราบปรามกำลังยุ่งอยู่กับการไล่ตามโจมตี ทำให้กองกำลังป้องกันที่ถูกทิ้งเอาไว้หลังจากที่ยึดครองเมืองได้นั้นอ่อนแอเป็นอย่างมาก ดังนั้น พวกเขาจึงแทบไม่สูญเสียกำลังคนไปเลย","“ท่านศาสตราจารย์ลินน์คาดการณ์ได้ราวกับเทพเจ้าจริงๆ...”","เรย์เดลอดไม่ได้ที่จะถอนหายใจออกมาด้วยความทึ่ง","ในการต่อสู้เมื่อตอนเที่ยงวันนั้น พวกเขาได้สูญเสียปืนใหญ่และรถหุ้มเกราะไปเป็นจำนวนมาก แถมยังต้องพาผู้บาดเจ็บอีกเกือบสามพันคนไปด้วย ดังนั้น การไปปะทะกับกองทัพปราบปรามของศาสนจักรแบบตาต่อตาฟันต่อฟัน ย่อมไม่ใช่ทางเลือกที่เหมาะสมอย่างเห็นได้ชัด","แต่การจะถอนกำลังออกไปก็เป็นเรื่องยากเช่นกัน ด้วยเรือเหาะที่มีเพียงร้อยกว่าลำเท่านั้น จึงเป็นไปไม่ได้เลยที่จะพาทุกคนหนีไปได้","ดังนั้น ลินน์จึงได้เสนอให้ซ่อนกองกำลังหลักเอาไว้นอกเมือง จากนั้นก็สร้างภาพลวงตาอย่างเอิกเกริก ว่าพวกเขานั่งเรือเหาะไปแย่งชิงน้ำมันดิน เพื่อล่อให้กองทัพปราบปรามของศาสนจักรออกไป","รอจนกว่ากองทัพปราบปรามจะจากไป และศัตรูลดการป้องกันลง พวกเขาก็จะบุกกลับมาอีกครั้ง หรือกระทั่งสามารถยึดเมืองน้ำมันดินที่หละหลวมในการป้องกันไปได้ในคราวเดียวเลย!","ตามที่ท่านศาสตราจารย์ลินน์ได้กล่าวเอาไว้ พวกเขาได้ใช้กลยุทธ์เมืองร้าง โจมตีจุดตาย ลอบตีเฉินชาง และล่อเสือออกจากถ้ำ!","จนทำให้พ่อมดหลายคนต่างก็สงสัยเป็นอย่างมาก ว่าดาวรุ่งแห่งเวทมนตร์ผู้นี้ เคยทำอาชีพอะไรมาก่อน ก่อนที่จะเดินทางมายังดินแดนแห่งพ่อมด?","หรือว่าเขาจะเป็นลอร์ดผู้ยิ่งใหญ่ของจักรวรรดิ ไม่อย่างนั้นทำไมถึงได้รู้ทักษะและกลยุทธ์การรบมากมายขนาดนี้ล่ะ"]},{"n":433,"t":"นี่คือการต่อสู้ที่ต้องเป็นพ่อมดระดับตำนานเท่านั้น ถึงจะสามารถเข้าร่วมได้ พวกเรามันก็เป็นได้แค่ตัวถ่วงเท่านั้น!","c":["“ท่านแอนโธนี่ พวกเราจะมุ่งหน้าไปยังเมืองน้ำมันดินกันตอนนี้เลยหรือไม่ขอรับ?”","หลังจากที่เรย์เดลจัดการให้คนยากจนที่มารวมตัวกันอยู่ที่ลานกว้างสงบลงได้แล้ว เขาก็หันไปมองแอนโธนี่ที่อยู่ด้านข้าง ก่อนจะเอ่ยถามขึ้นมา","“ใช่ ยิ่งเร็วยิ่งดี ตอนนี้ภายในเมืองน้ำมันดินน่าจะไม่มีกำลังป้องกันเหลืออยู่มากนักหรอก”","แอนโธนี่พยักหน้ารับ จากนั้นก็เอ่ยด้วยรอยยิ้ม","“และพวกมันก็คงไม่มีทางคาดคิดอย่างแน่นอน ว่าพวกเราจะเปิดฉากโจมตีกลับในเวลานี้!”","ตอนนี้แผนการทุกอย่างดำเนินไปอย่างราบรื่นเป็นอย่างมาก เพื่อการต่อสู้ชี้ชะตาในคืนนี้ เรียกได้ว่าศาสนจักรได้ทุ่มเทกองกำลังระดับหัวกะทิออกมาจนหมด โดยกองกำลังที่ถูกทิ้งเอาไว้ป้องกันเมืองน้ำมันดิน จะต้องมีไม่เกินสามพันคนอย่างแน่นอน","สิ่งที่สำคัญที่สุดก็คือ นักบวชระดับตำ
