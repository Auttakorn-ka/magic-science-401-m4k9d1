องบินรบกับเรือเหาะได้อย่างรวดเร็ว โดยมันให้ความรู้สึกที่เบาสบาย และไม่ได้ดูเทอะทะเลยแม้แต่น้อย ซึ่งนางสามารถบังคับให้มันเลี้ยว หรือเชิดหัวขึ้นกลางอากาศได้ทุกเมื่อที่ต้องการ","ตอนนี้นางรู้สึกเหมือนกับว่าตัวเองได้กลายเป็นนกที่กำลังโบยบินอย่างอิสระอยู่บนท้องฟ้า จนทำให้นางนั้นสนุกสนานกับการบินจนลืมเวลาไปเลย","“เครื่องบินรุ่นใหม่นี้ สามารถทำความเร็วได้สูงสุดเท่าไหร่หรือ?”","เมื่อเห็นเครื่องบินใบพัดที่กำลังเร่งความเร็วขึ้นเรื่อยๆ ราวกับว่ามันยังไม่ถึงขีดจำกัด ธีโอดอร์ก็อดไม่ได้ที่จะเอ่ยถามขึ้นมา","“ตามทฤษฎีแล้ว ความเร็วสูงสุดของมันน่าจะอยู่ที่ประมาณ 360 กิโลเมตรต่อชั่วโมง...”","ลินน์ตอบหลังจากที่คิดอยู่ครู่หนึ่ง อย่างไรเสีย นี่ก็เป็นเพียงเครื่องบินรบรุ่นแรก ดังนั้น ประสิทธิภาพการทำงานในด้านต่างๆ จึงยังคงถูกตั้งค่าเอาไว้อย่างระมัดระวัง","“นี่มันเร็วเกินไปแล้ว!”","ธีโอดอร์เดาะลิ้นด้วยความทึ่ง ความเร็วที่เร็วกว่าเรือเหาะถึงสามเท่านี้ มันทิ้งห่างสัตว์เวทมนตร์บินได้ทุกชนิดที่พวกเขารู้จักไปไกลลิบลับ เรียกได้ว่าไม่มีสิ่งมีชีวิตใดบนท้องฟ้า ที่สามารถไล่ตามเครื่องบินรุ่นใหม่นี้ได้ทันเลย ต่อให้เป็นกริฟฟอน ก็คงทำได้แค่มองตามตาปริบๆ เท่านั้น","ลินน์เพียงแค่ยิ้มและไม่ได้ตอบอะไรกลับไป ถ้าจะเอาเจ้านี่ไปเทียบกับเครื่องบินเจ็ทแล้วล่ะก็ คงต้องบอกว่ามันช้าเป็นหอยทากเลยล่ะ แต่สำหรับในต่างโลกแห่งนี้ มันก็ถือว่าเป็นจ้าวแห่งเวหาตัวจริงเสียงจริงแล้ว!","วิกตอริโอที่ยืนอยู่ข้างๆ เงยหน้าขึ้นมองเครื่องบินรบ ที่กำลังตีลังกาและพุ่งทะยานขึ้นสู่ท้องฟ้าอย่างต่อเนื่อง ก่อนจะเอ่ยถามขึ้นมาอย่างไม่มีปี่มีขลุ่ยว่า","“เจ้าตั้งใจจะใช้ไอ้สิ่งที่เรียกว่าเครื่องบินรุ่นใหม่นี้ ทำงานร่วมกับเวทมนตร์ระเบิดนิวเคลียร์อย่างนั้นหรือ?”","เมื่อวานนี้ แม้ว่าเขาจะสัมผัสได้ถึงอานุภาพของการระเบิดนิวเคลียร์ โดยมีภูเขาทั้งลูกขวางกั้นเอาไว้ แต่ในขณะที่รู้สึกตกตะลึงกับความทรงพลังของมัน เขาก็รู้สึกกังวลใจอยู่ไม่น้อย เพราะรัศมีการทำลายล้างของมันกว้างเกินไป ดังนั้น การจะใช้งานมันให้เกิดประสิทธิภาพสูงสุด โดยที่สามารถกำจัดศัตรูไปพร้อมๆ กับการรักษาชีวิตของตัวเองให้รอดปลอดภัยนั้น จึงเป็นปัญหาที่สำคัญอย่างยิ่ง","แต่เมื่อดูจากสถานการณ์ในตอนนี้แล้ว การใช้เครื่องบินรบที่มีความเร็วสูงเช่นนี้ ก็ถือเป็นทางออกที่ไม่เลวเลย โดยให้ลิเดียเป็นคนขับ ส่วนลินน์ก็คอยร่ายเวทอยู่ข้างๆ แล้วทิ้งระเบิดเวทมนตร์ลงมาจากบนฟ้า จากนั้น ในตอนที่เกิดการระเบิด พวกเขาก็อาศัยความเร็วอันเหนือชั้นของเครื่องบินรบ บินหนีออกจากพื้นที่นั้น ก่อนที่คลื่นกระแทกจากการระเบิดจะพุ่งเข้ามาถึงตัว...","“นั่นเป็นเพียงแผนสำรองเท่านั้น หากไม่ถึงคราวจำเป็นจริงๆ ข้าก็ไม่อยากจะใช้วิธีนี้สักเท่าไหร่นัก!”","ลินน์ส่ายหน้าและพูดด้วยความระมัดระวัง","เพราะเวทมนตร์ระเบิดนิวเคลียร์ลูกใหญ่นั้น เหมาะที่จะใช้กับเอลาเพียงคนเดียว หรือไม่ก็ใช้ในยามคับขันเพื่อทำลายกองทัพหลักของจักรวรรดิเท่านั้น ส่วนการใช้เครื่องบินรบทิ้งระเบิดปูพรมใส่เมืองศัตรูนั้น ถือเป็นทางเลือกสุดท้ายจริงๆ","การทำแบบนั้นมันก็สะใจอยู่หรอก แต่ผลกระทบที่ตามมามันก็รุนแรงมากเช่นกัน","ท้ายที่สุดแล้ว จุดประสงค์ที่พวกเขามาที่นี่ ก็เพื่อนำพาประชาชนของจักรวรรดิ ให้ลุกขึ้นสู้กับการหลอกลวงของศาสนจักร ไม่ใช่เพื่อมาสานต่อการปกครองแบบเผด็จการ และสร้างความหวาดกลัวให้กับผู้คน...เพราะการทำเช่นนั้น มันก็ไม่ต่างอะไรกับการหาเรื่องใส่ตัว และเพิ่มภาระในการปกครองให้กับตัวเองเลย","“ข้าคิดว่า ทางที่ดีที่สุดคือการโยนเวทมนตร์ระเบิดนิวเคลียร์เข้าไปในที่แห่งนั้น…เพราะถ้าทำแบบนั้น มันก็จะไม่ส่งผลกระทบใดๆ ต่อโลกภายนอกเลย!”","ลินน์พูดขึ้นหลังจากที่ครุ่นคิดอยู่ครู่หนึ่ง","“เจ้าหมายความว่า?”","วิกตอริโอฉุกคิดขึ้นมาได้ทันที โดยเขานึกถึงประตูสวรรค์ ซึ่งเป็นประตูที่เชื่อมต่อระหว่างอาณาจักรเทพกับโลกแห่งความเป็นจริง","หากพวกเขาสามารถหาทางโยนเวทมนตร์ระเบิดนิวเคลียร์เข้าไปข้างใน ในจังหวะที่เหล่านักบวชระดับตำนานเปิดประตูสวรรค์ขึ้นมา พร้อมกับสังหารผู้ร่ายเวทไปในเวลาเดียวกัน การระเบิดนิวเคลียร์ก็จะเกิดขึ้นภายในอาณาจักรเทพเท่านั้น ซึ่งนี่ถือเป็นแผนการที่ดีที่สุดอย่างไม่ต้องสงสัย เพราะมันจะทำให้พวกเขาสามารถใช้เวทมนตร์ที่มีพลังทำลายล้างสูง และมีรัศมีเป็นวงกว้างเช่นนี้ได้อย่างไร้กังวล","“แต่การกะจังหวะให้แม่นยำขนาดนั้น มันไม่ใช่เรื่องง่ายเลยนะ”","วิกตอริโอพูดด้วยสีหน้าเคร่งเครียด","เมื่อได้ยินลินน์และวิกตอริโอพูดคุยกันถึงวิธีการใช้เวทมนตร์รูปแบบใหม่ ธีโอดอร์และคนอื่นๆ ต่างก็เงี่ยหูฟังอย่างตั้งใจ","โดยพวกเขานั้นให้ความสนใจกับเวทมนตร์ใหม่ที่ศาสตราจารย์พัฒนาขึ้นมาเป็นอย่างมาก หรือจะพูดให้ถูกก็คือ ไม่มีใครในสภาเลยที่ไม่นึกอยากรู้เรื่องนี้ และตอนนี้มันก็ได้กลายเป็นหัวข้อสนทนาที่ทุกคนต่างก็พูดถึงกันไปแล้ว...เพราะนั่นคือเวทมนตร์ที่อ้างว่าสามารถใช้ต่อกรกับเทพเจ้าจอมปลอมองค์นั้นได้เชียวนะ!","ไม่รู้ว่าแผ่นดินไหวครั้งใหญ่ที่เกิดขึ้นเมื่อวานนี้ จะมีส่วนเกี่ยวข้องกับเวทมนตร์รูปแบบใหม่นี้ด้วยหรือเปล่า...","แต่ที่น่าเสียดายก็คือ ไม่ว่าจะเป็นลินน์หรือประธานสภา ต่างก็เก็บงำเรื่องนี้เอาไว้เป็นความลับอย่างมิดชิด โดยไม่มีทีท่าว่าจะเปิดเผยออกมาเลยแม้แต่น้อย แม้แต่คำพูดของพวกเขาก็ยังคลุมเครือ จนทำให้คนฟังรู้สึกงุนงงไปตามๆ กัน..."]},{"n":412,"t":"ท่านยังจะอยากให้เครื่องบินรบบินเร็วเท่าแสงอีกอย่างนั้นหรือ?","c":["ในขณะที่ธีโอดอร์และคนอื่นๆ กำลังแอบฟังอยู่นั้น ลิเดียที่กำลังบังคับเครื่องบินรบรุ่นแรกอยู่บนท้องฟ้า ก็เริ่มคุ้นเคยกับของเล่นชิ้นใหญ่ใต้ร่างของนางมากขึ้นเรื่อยๆ และอีกไม่นานนางก็จะเริ่มทดสอบประสิทธิภาพในการรบแล้ว!","ลิเดียดันคันเร่งควบคุมเครื่องยนต์จนสุดความเร็ว ทำให้เครื่องบินพุ่งทะยานด้วยความเร็วสูงสุด ก่อนจะเชิดหัวดิ่งลงสู่พื้นดิน","ตัวเครื่องบินรบเปรียบเสมือนพญาอินทรียักษ์ที่พุ่งทะยานลงมาจากฟากฟ้าด้วยความเร็วสูง จนเกิดเสียงแหวกอากาศดังสนั่นหวั่นไหว แต่เพียงพริบตาต่อมา เสียงนั้นก็ถูกกลบด้วยเสียงปืนกลที่ดังสนั่นมาจากปีกทั้งสองข้าง!","พื้นหินที่ถูกเสริมความแข็งแกร่งด้วยเวทมนตร์ ปรากฏหลุมบ่อขึ้นมามากมายในทันที ลิเดียที่กำลังตื่นเต้นสุดขีด รีบดึงคันบังคับเพื่อเชิดหัวเครื่องบินขึ้น จากที่กำลังดิ่งพสุธา ก็เปลี่ยนเป็นพุ่งทะยานขึ้นสู่ท้องฟ้าอย่างฉับพลัน เครื่องบินรบบินโฉบผ่านไปโดยอยู่ห่างจากพื้นดินเพียงแค่สามสิบเมตรเท่านั้น ทำเอาธีโอดอร์และคนอื่นๆ ถึงกับใจหายใจคว่ำ เพราะกลัวว่าไอ้ของเล่นชิ้นนี้มันจะเสียการควบคุม แล้วพุ่งโหม่งโลกเข้าให้...","แต่ความกังวลของพวกเขาก็ไม่เกิดขึ้นจริง แม้ว่านี่จะเป็นครั้งแรกที่ลิเดียได้ขับเครื่องบินรบของจริง แต่ทักษะการบังคับของนางกลับไม่ธรรมดาเลย โดยนางสามารถบินโฉบพื้นดิน ซึ่งเป็นท่าที่อันตรายมากได้อย่างง่ายดาย แถมก่อนที่นางจะบินเชิดหัวขึ้นไปบนฟ้าจนสุด นางก็ยังเปิดช่องทิ้งระเบิดใต้ท้องเครื่อง และทิ้งระเบิดเพลิงลงมาหลายลูก...","ตูม! ตูม! ตูม!","ท่ามกลางเสียงระเบิดที่ดังกึกก้อง พื้นที่ประมาณหนึ่งในสี่ของรันเวย์ ก็ถูกปกคลุมไปด้วยเปลวเพลิงสีขาวของฟอสฟอรัสขาวในพริบตา!","เพื่อแลกมาซึ่งความเร็วสูงสุด ความจุในการบรรทุกของเครื่องบินรบจึงมีจำกัด ซึ่งทำให้มันสามารถบรรทุกระเบิดวิถีโค้งได้เพียงพอสำหรับการโจมตีเพียงครั้งเดียวเท่านั้น","แต่ตามการออกแบบเบื้องต้นแล้ว เจ้านี่ไม่ควรจะมีช่องทิ้งระเบิดด้วยซ้ำ เพราะหน้าที่หลักของเครื่องบินรบรุ่นแรก คือการขจัดภัยคุกคามทางอากาศ ส่วนที่เหลือก็ปล่อยให้เป็นหน้าที่ของเรือเหาะไป","เห็นได้ชัดว่าจุดประสงค์ที่แท้จริงของการสร้างมันขึ้นมา ก็เพื่อใช้ในการทิ้งอาวุธทำลายล้างอีกชิ้นหนึ่งนั่นเอง...","ณ หุบเขาในเวลานี้ วิกตอริโอ ธีโอดอร์ รวมถึงเหล่านักเล่นแร่แปรธาตุที่เฝ้าสังเกตการณ์อยู่ ต่างก็รู้สึกพึงพอใจกับประสิทธิภาพของเครื่องบินรบรุ่นใหม่นี้เป็นอย่างมาก","มีเพียงลินน์เท่านั้น ที่มองดูรันเวย์ที่กำลังลุกไหม้ และเต็มไปด้วยหลุมระเบิดด้วยสีหน้าเหนื่อยใจ","เจ้าเล่นระเบิดรันเวย์ซะเละเทะแบบนี้ แล้วจะเอาเครื่องลงจอดได้ยังไงล่ะ?","ลิเดียที่กำลังชื่นชมผลงานการยิงของตัวเองอยู่บนฟ้า ก็เพิ่งจะนึกเรื่องนี้ขึ้นมาได้เช่นกัน ในฐานะผู้ออกแบบและผู้สร้างเครื่องบินรบลำนี้ นางย่อมรู้ดีว่ามันจำเป็นต้องใช้ทางวิ่งที่ราบเรียบมากๆ ในการขึ้นบินและลงจอด หากพลาดพลั้งไปเพียงนิดเดียว ก็อาจจะหมายถึงจุดจบที่เครื่องบินพังยับเยิน และนักบินก็ตายคาที่ได้เลย","และในหุบเขาแห่งนี้ นอกจากรันเวย์ที่เพิ่งสร้างขึ้นมาใหม่ด้วยเวทมนตร์แล้ว พื้นที่ส่วนที่เหลือก็มีแต่พื้นดินที่อ่อนนุ่มและขรุขระ แถมยังมีต้นไม้ขวางทางอยู่เต็มไปหมด ซึ่งมันไม่ใช่ที่ที่จะสามารถนำเครื่องลงจอดได้อย่างแน่นอน","ลิเดียทำได้เพียงขับเครื่องบินวนเวียนอยู่บนท้องฟ้า เพื่อรอให้เหล่าพ่อมดที่อยู่ข้างล่างซ่อมแซมรันเวย์ให้เสร็จ แต่นางก็บินวนไปหลายรอบแล้ว ก็ยังไม่เห็นวี่แววว่าจะมีใครขยับเขยื้อนเลยสักคน","และในขณะที่นางกำลังร้อนรนจนทนไม่ไหว และเตรียมที่จะบินกลับไปลงจอดฉุกเฉินที่จัตุรัสกลางเมืองหลวงนั่นเอง ลินน์ก็เพิ่งจะลงมือใช้เวทมนตร์ดับไฟที่กำลังลุกไหม้ และซ่อมแซมรันเวย์ที่พังเสียหายให้กลับมาใช้งานได้ตามปกติ","เมื่อเครื่องบินรบลงจอดได้อย่างปลอดภัย ลิเดียที่ก่อนหน้านี้ยังตื่นเต้นสุดขีด ก็เหลือเพียงความหวาดหวั่นในใจเท่านั้น","“ความเร็วที่สูงมากของเครื่องบินรบ ถือเป็นข้อดีของมัน แต่บางครั้งมันก็เป็นข้อเสียได้เหมือนกัน ภายใต้ความเร็วระดับนั้น แม้แต่การชนกับนกเพียงตัวเดียว ก็อาจจะทำให้เครื่องบินตกได้เลย...”","ลินน์เอ่ยเตือนด้วยน้ำเสียงจริงจัง","พรสวรรค์ด้านวิศวกรรมของลิเดียนั้นเป็นสิ่งที่ทุกคนยอมรับ แต่นางมักจะดีใจจนลืมตัวอยู่เสมอ ซึ่งนี่ถือเป็นข้อห้ามที่ร้ายแรงมากสำหรับนักบิน","เขาควรจะพิจารณาเรื่องการเพิ่มร่มชูชีพ หรืออะไรทำนองนั้นเข้าไปด้วย เพื่อเตรียมพร้อมสำหรับเหตุการณ์ที่ไม่คาดฝัน และหากนำมาใช้ควบคู่กับเวทมนตร์อย่างเวทชะลอการตก ก็จะสามารถช่วยชีวิตนักบินเอาไว้ได้ในยามเกิดเหตุฉุกเฉิน","เพราะในหลายๆ ครั้ง ผู้ที่ควบคุมอาวุธนั้น สำคัญกว่าตัวอาวุธเองเสียอีก...","ยิ่งอุตสาหกรรมมีความก้าวหน้ามากเท่าไหร่ ก็ยิ่งเป็นเช่นนั้นมากเท่านั้น","“การขึ้นบินและลงจอดของเครื่องบินรบรุ่นใหม่นี้ จำเป็นต้องพึ่งพารันเวย์ ซึ่งถือว่าเป็นข้อบกพร่องที่ใหญ่พอสมควรเลยนะ”","วิกตอริโอเสนอความคิดเห็น ในเมื่อเครื่องบินรบสร้างขึ้นจากโลหะ บางทีพวกเขาก็อาจจะลองเสริมพลังเวทมนตร์แม่เหล็กไฟฟ้าเข้าไปที่ตัวเครื่อง เพื่อใช้แรงผลักจากแม่เหล็กไฟฟ้า ส่งเครื่องบินรบขึ้นสู่ท้องฟ้าโดยตรงเลยก็ได้","“ท่านหมายถึงการใช้แม่เหล็กไฟฟ้าดีดตัวขึ้นสู่อากาศอย่างนั้นหรือ?”","ลินน์เข้าใจความหมายของวิกตอริโอในทันที แต่เขาก็ยังส่ายหน้าและปฏิเสธความคิดนี้อยู่ดี","“ความเร็วของเครื่องบินรบชนิดนี้มันช้าเกินไป อัตราเร่งในชั่วพริบตามันไม่เพียงพอหรอก ขืนส่งขึ้นไปบนฟ้าโดยตรง ผลลัพธ์เพียงอย่างเดียวก็คือตกลงมาพังยับเยินเท่านั้นแหละ!”","เครื่องบินรบที่จะสามารถใช้เทคโนโลยีดีดตัวด้วยแม่เหล็กไฟฟ้าได้นั้น จะต้องเป็นเครื่องบินรบไฮเปอร์โซนิก ที่มีความเร็วหลายมัค หรืออาจจะหลายสิบมัคต่อวินาที ซึ่งขับเคลื่อนด้วยเครื่องยนต์เจ็ท และสามารถเร่งความเร็วได้ในชั่วพริบตา จนสามารถพยุงตัวเครื่องบินเอาไว้ได้","สำหรับเครื่องบินใบพัดแบบนี้น่ะ เลิกคิดไปได้เลย!","เมื่อเห็นว่าลินน์ปฏิเสธข้อเสนอของตัวเอง วิกตอริโอก็ไม่ได้ใส่ใจอะไรมากนัก แต่สิ่งที่ทำให้เขารู้สึกไม่เข้าใจจริงๆ ก็คือ การที่ลินน์บอกว่าเครื่องบินรบรุ่นใหม่ ที่มีความเร็ว 360 กิโลเมตรต่อชั่วโมงนั้น ‘ช้าเกินไป’ ต่างหากล่ะ","ถ้าความเร็วขนาดนี้ยังเรียกว่าช้า แล้วอะไรถึงจะเรียกว่าเร็วล่ะ?","นี่ท่านยังจะหวังให้ไอ้กล่องเหล็กบินได้นี่ บินได้เร็วเท่ากับแสง แล้วบินรอบทวีปได้เจ็ดรอบครึ่งในหนึ่งวินาทีอีกอย่างนั้นหรือ?","ธีโอดอร์และคนอื่นๆ ต่างก็พากันเสนอความคิดเห็น ในการปรับปรุงเครื่องบินรบอย่างกระตือรือร้น ซึ่งนี่ก็คือเหตุผลที่ลินน์เชิญพวกเขามาในวันนี้","คำแนะนำบางอย่างก็ดูเพ้อฝันและไร้สาระเอามากๆ แต่บางอย่างก็เป็นแนวคิดที่สามารถนำไปใช้งานได้จริง","ตัวอย่างเช่น เวทมนตร์พรางตาที่เคยใช้กับเรือเหาะมาแล้ว หรือการติดตั้งเครื่องยิงเลเซอร์เข้าไปในเครื่องบินรบ","ซึ่งทั้งสองอย่างนี้ ล้วนสามารถเพิ่มความสามารถในการเอาชีวิตรอด และประสิทธิภาพในการต่อสู้ของเครื่องบินรบได้อย่างมหาศาล โดยที่ไม่เป็นการเพิ่มน้ำหนัก จนส่งผลกระทบต่อสมรรถนะของเครื่องบินมากจนเกินไป","แน่นอนว่าคนที่แฮปปี้ที่สุดก็คงหนีไม่พ้นลิเดีย เพราะในมุมมองของนาง ข้อบกพร่องที่ใหญ่ที่สุดของเครื่องบินรบชนิดนี้ ไม่ใช่การที่มันต้องพึ่งพารันเวย์ในการลงจอด แต่เป็นเรื่องที่ความอึดในการต่อสู้ของมันนั้นต่ำเตี้ยเรี่ยดินเอามากๆ ต่างหาก!","มันมีระเบิดวิถีโค้งให้ใช้แค่ลูกเดียว แถมปืนกล ถ้าหากยิงต่อเนื่องล่ะก็ กระสุนที่มีก็จะหมดเกลี้ยงภายในหนึ่งนาที หลังจากนั้นมันก็จะหมดสภาพในการต่อสู้ และทำได้เพียงแค่เป็นเครื่องบินลาดตระเวนเท่านั้น ไม่อย่างนั้นก็ต้องบินกลับไปเติมกระสุนใหม่","นี่แหละที่เรียกว่าบินเป็นชั่วโมง แต่สนุกได้แค่นาทีเดียว...","แต่ถ้าหากมีการติดตั้งเครื่องยิงเลเซอร์เข้าไปล่ะก็ มันจะเปลี่ยนไปเป็นคนละเรื่องเลย เพราะหลังจากที่กระสุนปืนกลหมดแล้ว นางก็ยังสามารถต่อสู้ ‘ระยะประชิด’ กับศัตรูได้ ราวกับว่านางมีดาบปลายปืนติดอยู่ที่ปืนคาบศิลาอย่างไรอย่างนั้น","นั่นถึงจะเรียกว่าการต่อสู้ที่สูบฉีดเลือดลมได้อย่างแท้จริง!","ภายใต้ไอเดียสุดบรรเจิดและคำแนะนำของเหล่านักเล่นแร่แปรธาตุ แผนการปรับปรุงเวทมนตร์สำหรับเครื่องบินรบก็ถูกร่างขึ้นมาจนเสร็จสิ้น ภายในเวลาเพียงแค่สองชั่วโมงเท่านั้น","แน่นอนว่า การจะวาดวงเวทแปรธาตุลงบนตัวเครื่อง รวมถึงการปรับแต่งในภายหลังนั้น ยังต้องใช้เวลาอีกอย่างน้อยหนึ่งสัปดาห์","“ถ้าอย่างนั้น ข้าก็อดเอาเจ้านี่ไปร่วมรบในศึกครั้งหน้าน่ะสิ”","ลิเดียพูดด้วยน้ำเสียงหงอยเหงา นางอุตส่าห์อดหลับอดนอนเร่งสร้างมันขึ้นมา ก็เพื่อจะได้เอามันไปเข้าร่วมในศึกแรกแท้ๆ!","“การชิงอาณาจักรคืน ไม่จำเป็นต้องใช้อาวุธล้ำสมัยขนาดนั้นหรอกน่า”","ลินน์พูดกลั้วหัวเราะ ศัตรูของพวกเขาก็แค่ขุนนางที่กลับกลอกไปมา และคอยดูทิศทางลมเท่านั้น","รอให้ถึงเวลาที่ต้องบุกเข้าไปในเขตแดนของจักรวรรดิจริงๆ เมื่อนั้นแหละ ที่ไอ้เจ้านี่จะได้แสดงอานุภาพที่แท้จริงของมัน","ยิ่งไปกว่านั้น เครื่องบินรบแค่ลำเดียวจะไปทำอะไรได้ หากต้องการจะครองน่านฟ้าให้เบ็ดเสร็จ อย่างน้อยๆ ก็ต้องมีเครื่องบินรบสักหนึ่งฝูงนู่นแหละ!"]},{"n":413,"t":"เป่าแตรสัญญาณแห่งการโต้กลับ!","c":["ช่วงกลางเดือนสิงหาคม ณ เมืองเหล็กกล้าเซลทอด ซึ่งตั้งอยู่ทางภาคตะวันตกของอาณาจักรฮัดลาตา มาร์ควิสยูลิสซิสไม่ได้นอนหลับสนิทมาเป็นเวลากว่าหนึ่งเดือนแล้ว","ในช่วงที่ผ่านมา สถานการณ์ทั่วทั้งอาณาจักรนั้นปั่นป่วนและเปลี่ยนแปลงไปอย่างรวดเร็ว จนแทบจะไม่อยากเชื่อสายตาตัวเองเลยทีเดียว","เมื่อครึ่งปีก่อน บรรดาลอร์ดแห่งอาณาจักรยังคงแบ่งฝักแบ่งฝ่าย เพื่อถกเถียงกันเรื่องการแย่งชิงตำแหน่งรัชทายาทอยู่เลย และในฐานะที่อยู่ฝ่ายเป็นกลาง ยูลิสซิสจึงไม่ได้สนใจนักว่าใครจะได้ขึ้นเป็นกษัตริย์ เพราะท้ายที่สุดแล้ว คำสั่งจากเมืองหลวงก็แทบจะส่งผลกระทบต่อลอร์ดชายแดนอย่างพวกเขาน้อยมาก","แต่สิ่งที่เขาคาดไม่ถึงก็คือ องค์ชายรองฮัตตาร์กลับกล้าสมคบคิดกับพวกพ่อมดที่ฉาวโฉ่ ถึงขั้นบุกโจมตีเมืองหลวง และปลงพระชนม์กษัตริย์บาเซล!","การกระทำนี้สร้างความตกตะลึงไปทั่วทั้งอาณาจักร!","แม้ว่ากษัตริย์องค์ใหม่ของพวกเขาจะประกาศกร้าวต่อหน้าสาธารณชนว่า องค์ชายใหญ่ได้สมรู้ร่วมคิดกับพระคาร์ดินัลแห่งศาสนจักร เพื่อก่อเหตุลอบปลงพระชนม์อันน่าสยดสยองนี้ขึ้น ส่วนตัวเขาเพียงแค่ออกมากวาดล้างกบฏ และขึ้นครองบัลลังก์เพื่อกอบกู้สถานการณ์เท่านั้น แต่ข้ออ้างที่ฟังดูไม่ขึ้นแบบนี้ ต่อให้เป็นชาวบ้านตาดำๆ ก็คงไม่หลงเชื่อหรอก!","และการกระทำแบบนี้ ก็ย่อมต้องจุดประกายความโกรธแค้นให้กับศาสนจักรอย่างแน่นอน!","ด้วยเหตุนี้ ยูลิสซิสจึงแสร้งทำเป็นยอมรับการเรียกตัวของฮัตตาร์ และกลับเข้าสู่ใต้ร่มธงของอาณาจักรอีกครั้ง แต่ในความเป็นจริงแล้ว เขาได้แอบร่วมมือกับขุนนางชายแดนบางส่วน เพื่อส่งข่าวการล่มสลายของเมืองหลวงไปให้ทางศาสนจักรทราบต่างหาก","และเมื่อตอนที่เอ็ดเวลล์นำกองทัพปราบปรามมาถึง ยูลิสซิสก็ไม่ลังเลเลยที่จะเปิดประตูเมืองต้อนรับกองทัพอันเกรียงไกรนี้!","เพราะเขารู้ดีถึงความน่าสะพรึงกลัวของจักรวรรดิและศาสนจักร แม้ว่าพวกบูชาเทพนอกรีตจะสามารถอวดดีได้เพียงชั่วครู่ชั่วยาม จนถึงขั้นก่อเหตุลอบปลงพระชนม์กษัตริย์ในเมืองหลวงได้ แต่ทันทีที่กองทัพของศาสนจักรเดินทางมาถึง พวกมันก็จะถูกกวาดล้างจนสิ้นซากในพริบตา!","และยูลิสซิสก็เชื่อมั่นในความคิดนี้อย่างสุดหัวใจ แต่ใครจะไปคิดล่ะว่า เวลาผ่านไปไม่ถึงเดือน เขากลับได้รับข่าวว่ากองทัพปราบปรามของศาสนจักรพ่ายแพ้ยับเยิน แถมยังถึงขั้นถูกกวาดล้างจนหมดสิ้น...","ในวินาทีที่ได้รับข่าวนี้ ยูลิสซิสถึงกับสติแตก และไม่อยากจะเชื่อเลยว่า กองทัพปราบปรามที่แข็งแกร่งขนาดนั้น จะต้องมาพบกับความพ่ายแพ้ที่น่าสมเพชเช่นนี้ เขาถึงกับสงสัยด้วยซ้ำว่า พวกสายลับอาจจะรวมหัวกันแต่งเรื่องขึ้นมาหลอกเขาหรือเปล่า","แต่เมื่อได้รับการยืนยันแล้วว่าข่าวนั้นเป็นความจริง ยูลิสซิสก็ตกอยู่ในความหวาดผวาอย่างหนัก ในขณะเดียวกัน เขาก็ต้องเผชิญกับการตัดสินใจครั้งสำคัญที่สุดในชีวิต","นั่นก็คือ เขาจะยังคงทำตามคำสั่งของศาสนจักรต่อไป หรือจะหันหลังกลับไปซบอกกษัตริย์องค์ใหม่แทน...","ในฐานะขุนนางผู้เพียบพร้อม ยูลิสซิสไม่ได้เป็นคนที่มีความยึดมั่นถือมั่นอะไรมากมายนัก และไม่ว่าจะเป็นนักฆ่าชั้นต่ำ หรือพ่อมดที่มีชื่อเสียงฉาวโฉ่ ตราบใดที่สามารถนำมาใช้ประโยชน์ได้ เขาก็พร้อมที่จะอ้าแขนรับเสมอ","ส่วนเรื่องความศรัทธาต่อพระผู้เป็นเจ้านั้น แน่นอนว่าเขามีอยู่แล้ว แต่มันก็ไม่ได้มีมากมายอะไรนัก และยิ่งหลังจากที่กองทัพปราบปรามพ่ายแพ้ยับเยิน ความศรัทธาของเขาก็ยิ่งลดน้อยถอยลงไปอีก!","การยืนหยัดอยู่ข้างผู้ชนะ คือเคล็ดลับที่ทำให้ตระกูลยูลิสซิส สามารถยืนหยัดและเติบโตมาได้นานหลายร้อยปี...","แต่ท้ายที่สุดแล้ว ยูลิสซิสก็เลือกที่จะดูท่าทีไปก่อน เพราะในช่วงกว่าหนึ่งเดือนที่ผ่านมา พวกพ่อมดที่ได้รับชัยชนะในการศึกครั้งแรก กลับไม่มีความเคลื่อนไหวใดๆ เลย ซึ่งนั่นก็ทำให้เขาเริ่มสงสัยว่า หรือพวกสาวกเทพนอกรีตเองก็ได้รับความเสียหายอย่างหนักในสงครามครั้งนั้น จนไม่กล้าก้าวเท้าออกจากเมืองหลวงแม้แต่ก้าวเดียว","ยูลิสซิสที่อยู่ในชุดนอนเดินวนไปวนมาภายในคฤหาสน์อันกว้างใหญ่ ผ่านไปไม่นาน เขาก็ได้รับรายงานว่าสายลับที่ส่งออกไปได้เดินทางกลับมาแล้ว นั่นทำให้ยูลิสซิสที่ไม่แม้แต่จะเปลี่ยนเสื้อผ้า ก็เร่งรีบเรียกตัวสายลับเหล่านั้นเข้ามาพบ และเอ่ยถามด้วยความร้อนรนทันทีว่า","“สถานการณ์ในเมืองหลวงเป็นอย่างไรบ้าง? กษัตริย์ฮัตตาร์และพวกพ่อมดมีความเคลื่อนไหวอะไรผิดปกติหรือไม่?”","“เรียนท่านลอร์ด กองทัพของพวกลูกสมุนเทพนอกรีต ได้เคลื่อนพลออกจากเมืองหลวงแล้วขอรับ จากการประเมินคร่าวๆ น่าจะมีกำลังพลไม่ต่ำกว่าสามหมื่นนาย โดยแบ่งออกเป็นสามกองทัพ ซึ่งตอนนี้มีอยู่สองกองทัพที่ยังไม่ทราบจุดหมายปลายทางที่แน่ชัด...”","อัศวินร่างกำยำคุกเข่าข้างหนึ่งลงบนพื้น และรายงานด้วยน้ำเสียงแผ่วเบา","“ไม่ทราบจุดหมายปลายทางอย่างนั้นรึ?”","ยูลิสซิสขมวดคิ้วด้วยความไม่พอใจ การที่กองทัพขนาดใหญ่เคลื่อนพล มันเป็นไปไม่ได้เลยที่จะสามารถปกปิดร่องรอยได้","“แล้วกองทัพที่เหลืออีกล่ะ? อย่าบอกนะว่าคลาดสายตาไปอีกน่ะ?”","ยูลิสซิสเอ่ยถามด้วยน้ำเสียงเย็นเยียบ","“ทะ...ท่านลอร์ด พวกมัน...พวกมันอยู่ข้างหลังนี่เองขอรับ!”","อัศวินตอบกลับด้วยน้ำเสียงตะกุกตะกัก","“ข้างหลังรึ?”","ยูลิสซิสชะงักไปครู่หนึ่ง","“พวกมันกำลังตั้งทัพอยู่ใกล้ๆ กับกำแพงเมืองของเรานี่เอง! ห่างจากเมืองเหล็กกล้าเซลทอดไปไม่ถึงสิบกิโลเมตรแล้วขอรับ!”","อัศวินร่างกำยำตอบด้วยความหวาดกลัว","“อยู่นอกเมืองงั้นรึ?! ทำไมพวกมันถึงมาโผล่ที่นี่ได้เร็วขนาดนี้?!”","ยูลิสซิสถึงกับวิญญาณหลุดออกจากร่าง เขาเบิกตากว้างด้วยความตกตะลึง เมืองหลวงอยู่ห่างจากที่นี่ตั้งสองร้อยกิโลเมตรเชียวนะ แถมยังมีดินแดนของเคานต์แฮนเซ่นขวางกั้นอยู่ ซึ่งมีทั้งป้อมปราการถึงห้าแห่ง และหมู่บ้านอีกกว่ายี่สิบแห่ง!","อย่าบอกนะว่าไอ้กองทัพนับหมื่นพวกนี้ มันติดปีกบินมาน่ะ?","ในตอนนั้นเอง ยูลิสซิสก็พลันนึกถึงข้อมูลข่าวสารที่เขาได้รับมาก่อนหน้านี้ ที่เล่าลือกันว่ามีสิ่งประดิษฐ์เวทมนตร์ขนาดมหึมา ที่มีขนาดใหญ่กว่าบ้าน แถมยังสามารถบินได้อยู่บนท้องฟ้า","เขาจึงรีบพุ่งตัวออกไปจากคฤหาสน์ทันที ก่อนจะกระโดดขึ้นขี่ม้าศึกที่ยอดเยี่ยมที่สุดในคฤหาสน์ และควบม้าทะยานขึ้นไปบนกำแพงเมืองภายในเวลาไม่ถึงห้านาที","ภาพของยูลิสซิสที่สวมเพียงชุดนอนยืนอยู่บนกำแพงเมืองนั้น ดูสะดุดตาเป็นอย่างมาก แต่ในเวลานี้กลับไม่มีใครสนใจในความไม่เรียบร้อยของท่านลอร์ดเลยแม้แต่น้อย เพราะที่เส้นขอบฟ้าอันไกลโพ้นนั้น กองทัพที่มีกำลังพลกว่าหมื่นนาย กำลังมุ่งหน้าตรงมายังเมืองเหล็กกล้าเซลทอด","แนวหน้าของพวกมันคือกล่องเหล็กหน้าตาประหลาดนับสิบกล่อง ซึ่งมีรูปร่างคล้ายคลึงกับห้องโดยสารของรถม้า แต่มันกลับสามารถแล่นฉิวไปบนที่ราบอันกว้างใหญ่ได้อย่างอิสระ โดยที่ไม่ต้องพึ่งพาสัตว์ลากจูงใดๆ และยังมีปืนใหญ่หน้าตาน่าเกรงขาม ถูกลากตามหลังพวกมันมาอีกหลายกระบอกด้วย","ในขณะที่กองทหารปืนคาบศิลานับหมื่นนาย ก็เดินขนาบข้างกล่องเหล็กเหล่านั้นมาอย่างเป็นระเบียบเรียบร้อย การที่กองทัพอันกว้างใหญ่สามารถเดินแถวได้อย่างพร้อมเพรียงขนาดนี้ นับว่าเป็นเรื่องที่น่าทึ่งมาก โดยในมือของพวกเขากำท่อนไม้ขนาดยาว ที่มีมีดแหลมคมผูกติดอยู่ที่ปลายเอาไว้แน่น","หากนี่เป็นครั้งแรกที่ยูลิสซิสได้เห็นอาวุธชนิดนี้ เขาคงจะคิดว่ามันคือหอกสั้นอย่างแน่นอน แต่จากรายงานของสายลับ อาวุธที่เรียกว่าปืนคาบศิลานี้ คืออาวุธเวทมนตร์ระยะไกลที่ทรงพลังอำนาจเป็นอย่างยิ่ง โดยภายในของมันนั้นอัดแน่นไปด้วยพลังแห่งสายฟ้าและเปลวเพลิง ซึ่งสามารถเจาะทะลุชุดเกราะเหล็กจากระยะร้อยเมตรได้อย่างง่ายดาย จนถึงขั้นทำให้กองทหารม้าอันน่าภาคภูมิใจของแกรนด์ดยุกริคแมน ต้องพ่ายแพ้อย่างย่อยยับมาแล้ว...","สิ่งเดียวที่ทำให้ยูลิสซิสรู้สึกโล่งใจได้บ้าง ก็คือการที่เขาไม่เห็นสิ่งประดิษฐ์เวทมนตร์ขนาดยักษ์ ที่สามารถบินได้อยู่บนท้องฟ้าเลย","แต่ถึงอย่างนั้น โอกาสที่พวกเขาจะได้รับชัยชนะก็ยังมีน้อยนิดอยู่ดี เพราะเซลทอดไม่มีทางแข็งแกร่งไปกว่าเมืองหลวงอย่างแน่นอน!","แถมขนาดกองทัพปราบปรามของศาสนจักรยังพ่ายแพ้มาแล้ว แล้วนับประสาอะไรกับกองทัพของเขากันล่ะ!","ยูลิสซิสประเมินสถานการณ์อย่างรวดเร็ว และกำลังชั่งใจอยู่ว่า ควรจะเปิดประตูเมืองยอมจำนนดีหรือไม่","อันที่จริงเขาก็อยากจะทำแบบนั้นอยู่หรอก แต่ติดตรงที่อาร์คบิชอปแห่งเซลทอด และเหล่านักบวชคนอื่นๆ ต่างก็ยืนอยู่ข้างๆ เขาในตอนนี้ แถมคนพวกนี้ยังได้รับข่าวสารเร็วกว่าเขาเสียอีก!","“ท่านมาร์ควิสยูลิสซิส ไม่ต้องกังวลไปหรอก”","อาร์คบิชอปเอ่ยปลอบประโลม เมื่อเห็นว่ายูลิสซิสเริ่มมีอาการหวาดกลัว","“ข้าได้รับนิมิตจากพระผู้เป็นเจ้าแล้วว่า สตรีศักดิ์สิทธิ์ลูเซียจะทรงนำทัพมากวาดล้างพวกลูกสมุนเทพนอกรีต ที่บังอาจก่อกบฏในอาณาจักรด้วยตัวพระองค์เอง ขอเพียงแค่พวกเราสามารถยื้อเวลาเอาไว้ได้อีกสักระยะ ชัยชนะก็จะต้องตกเป็นของพวกเราอย่างแน่นอน”","“และเมื่อถึงตอนนั้น ข้าจะรายงานความดีความชอบของท่านให้องค์พระสันตะปาปาทรงทราบ และท่านก็จะได้ขึ้นเป็นกษัตริย์แห่งฮัดลาตาองค์ต่อไป!”","อาร์คบิชอปกล่าวด้วยน้ำเสียงหนักแน่น"]},{"n":414,"t":"ชาวเมือง ‘ยินดีต้อนรับ’ กองทัพแห่งอาณาจักร","c":["แน่นอนว่ายูลิสซิสย่อมรู้ดี ว่าตำแหน่งกษัตริย์ที่อีกฝ่ายหยิบยื่นให้นั้น มันก็คือเหยื่อล่ออาบยาพิษดีๆ นี่เอง แต่มันช่างเป็นเหยื่อล่อที่หอมหวานเย้ายวนใจเสียเหลือเกิน และที่สำคัญที่สุดก็คือ สถานการณ์ในตอนนี้ยังไม่ชัดเจนนัก หากเขาเลือกข้างผิดล่ะก็ ชีวิตของเขาก็คงจะจบสิ้นลงตรงนี้แน่","สาเหตุที่เมืองเซลทอดได้รับฉายาว่า ‘เมืองเหล็กกล้า’ นั้น ก็เป็นเพราะพื้นที่โดยรอบอุดมไปด้วยทรัพยากรแร่เหล็ก ประกอบกับนิสัยที่รอบคอบระมัดระวังตัวของลอร์ดยูลิสซิส กำแพงเมืองแห่งนี้จึงถูกสร้างขึ้นมาให้สูงตระหง่าน แถมประตูเมืองก็ยังถูกเสริมความแข็งแกร่งด้วยเหล็กกล้าบริสุทธิ์อีกชั้นหนึ่ง ซึ่งต้องใช้ชายฉกรรจ์หลายคนช่วยกันดึงรอก ถึงจะสามารถเปิดปิดมันได้","แถมภายในเมืองยังมีทหารยามรักษาการณ์อยู่ประมาณเจ็ดพันนาย และยังสามารถเกณฑ์พวกชาวบ้านที่ลี้ภัยมาช่วยป้องกันเมืองได้ทุกเมื่อ บางทีพวกเขาอาจจะแค่ต้องยันเอาไว้สักวันสองวัน...","แค่วันสองวันก็พอแล้ว!","ในขณะที่ยูลิสซิสกำลังปลอบใจตัวเองอยู่นั้น ทางด้านอาร์คบิชอปก็รู้ดีว่า หากเขาไม่งัดพลังอำนาจออกมาโชว์ให้เห็นเป็นขวัญตาบ้าง ไม่ว่าจะเป็นพวกขุนนางหรือทหารยามในเมือง ก็คงจะขวัญหนีดีฝ่อ เมื่อต้องเผชิญหน้ากับการโจมตีด้วยเวทมนตร์อย่างแน่นอน เขาจึงได้พาเหล่านักบวชอีกหลายสิบคน ขึ้นไปยืนประจำการอยู่บนกำแพงเมืองเซลทอด","โดยความแตกต่างที่สำคัญที่สุดระหว่างอาร์คบิชอปกับบิชอปทั่วไป ก็คือพวกเขาเป็นถึงนักบวชระดับหัวกะทิในระดับสามวงแหวน และยังเป็นตัวเก็งที่จะได้เลื่อนขั้นเป็นพระคาร์ดินัลอีกด้วย ซึ่งสามารถสื่อสารกับพระผู้เป็นเจ้า เพื่อขอหยิบยืมพลังมาใช้ได้ในระดับหนึ่ง ดังนั้น พวกเขาจึงมักจะถูกส่งไปประจำการอยู่ในจุดยุทธศาสตร์ที่สำคัญ และหากได้รับการสนับสนุนจากบิชอปทั่วไป พร้อมกับกลุ่มนักบวชอีกหลายสิบคน พวกเขาก็สามารถที่จะต่อกรกับจอมเวทผู้ยิ่งใหญ่ได้ในระยะเวลาสั้นๆ เลยทีเดียว","“ข้าแต่จ้าวแห่งดวงดาว เทพีแห่งดวงจันทร์ พระผู้สร้างผืนปฐพีและสรรพชีวิต ข้ารับใช้ผู้ต่ำต้อยของพระองค์ขอวิงวอน ขอพระองค์โปรดประทานพรคุ้มครองดินแดนแห่งศรัทธาแห่งนี้ด้วยเถิด...”","เสียงสวดภาวนาอันดังกึกก้องสะท้อนไปทั่วกำแพงเมือง ไม่นานนัก แสงศักดิ์สิทธิ์อันเจิดจ้าก็เปล่งประกายออกมาจากร่างของอาร์คบิชอป","เหล่าทหารและขุนนางที่ถูกแสงนั้นสาดส่อง ต่างก็รู้สึกราวกับว่ากำลังถูกจ้องมองโดยพระผู้เป็นเจ้า ความฮึกเหิมก็ล้นทะลักขึ้นมาในอกของยูลิสซิสทันที ในตอนนี้เขารู้สึกว่ากองทัพนับหมื่นที่อยู่เบื้องล่างนั้น ก็เป็นเพียงแค่ฝูงมดปลวกเท่านั้น หากพวกเขาร่วมมือร่วมใจกัน ก็จะสามารถคว้าชัยชนะมาครองได้อย่างแน่นอน","“พระผู้เป็นเจ้าสถิตอยู่กับพวกเรา!”","อาร์คบิชอปตะโกนก้อง พระคัมภีร์ที่เหน็บอยู่ข้างเอวลอยขึ้นมาเหนือศีรษะของเขา","ในวินาทีต่อมา แสงสว่างอันเจิดจ้าก็สาดส่องเข้ามาเตะตาทุกคน และยูลิสซิสเพิ่งจะตระหนักได้ว่า แสงสว่างนั้นไม่ได้เปล่งประกายออกมาจากพระคัมภีร์ แต่มันพุ่งตรงมาจากกองทัพศัตรูต่างหาก!","ลำแสงสีแดงฉานนั้นพุ่งมาด้วยความเร็วที่เหลือเชื่อ และก่อนที่ใครจะทันได้ตั้งตัว มันก็ทะลวงผ่านร่างของอาร์คบิชอปไปเป็นที่เรียบร้อย แม้ร่างกายจะได้รับการเสริมด้วยพลังศักดิ์สิทธิ์ แต่มันกลับเปราะบางราวกับแผ่นกระดาษ  ซึ่งถูกฉีกกระชากจนแหลกละเอียด โดยทิ้งไว้เพียงเศษซากเนื้อและเลือดที่สาดกระเซ็นไปทั่วบริเวณ...","เสียงสวดภาวนาอันฮึกเหิมหยุดชะงักลงในทันที ความกระตือรือร้นที่เพิ่งจะพลุ่งพล่านขึ้นมาในใจของยูลิสซิส ก็มลายหายไปจนหมดสิ้น ขุนนางชั้นผู้น้อยหลายคนที่ยืนอยู่ข้างๆ ถึงกับตกใจจนฉี่ราดกางเกง และตะโกนออกมาอย่างสุดเสียงว่า","“เปิดประตูเมือง...ยอมจำนนเดี๋ยวนี้!”","แต่อนิจจา มันสายเกินไปเสียแล้ว ลำแสงอีกหลายสายพุ่งทะยานแหวกอากาศเข้ามา และประตูเมืองเหล็กกล้าที่ได้ชื่อว่าแข็งแกร่งไร้เทียมทาน ก็ถูกปืนแม่เหล็กไฟฟ้าเพียงไม่กี่กระบอก เป่ากระจุยกระจายไปในพริบตา!","“ไม่เลวเลย ฝีมือการยิงของพลปืนใหญ่พวกนี้แม่นยำขึ้นเรื่อยๆ เลยแฮะ!”","ณ นอกกำแพงเมือง ลินน์มองดูความโกลาหลที่เกิดขึ้นบนกำแพงเมือง ด้วยความรู้สึกพึงพอใจเป็นอย่างยิ่ง","การที่สามารถยิงปืนแม่เหล็กไฟฟ้า พุ่งเป้าไปที่บุคคลใดบุคคลหนึ่งได้อย่างแม่นยำ จากระยะห่างถึง 1.5 กิโลเมตร ถือว่าเป็นฝีมือที่น่าชื่นชมจริงๆ","“จุดตกกระทบของปืนแม่เหล็กไฟฟ้า คำนวณง่ายกว่าปืนใหญ่ตั้งเยอะ”","ราฟาเอลพูดกลั้วหัวเราะ","แถมอาร์คบิชอปคนนั้นยังกล้ามายืนสวดมนต์เป็นเป้านิ่งอยู่บนกำแพงเมืองอีก พวกเขาไม่ได้ตาบอดซะหน่อย เป้าหมายใหญ่โตขนาดนั้น ถ้าไม่ยิงก็บ้าแล้ว!","ลินน์หัวเราะร่วน ในขณะที่พวกเขากำลังพูดคุยกันอยู่นั้น ประตูเมืองเหล็กกล้าที่แสนจะแข็งแกร่ง ก็ถูกปืนใหญ่ยิงถล่มจนเปิดออก","การมีความได้เปรียบทางเทคโนโลยีที่เหนือกว่าอย่างเห็นได้ชัด ทำให้การทำสงครามปิดล้อมที่ยากลำบากที่สุด กลายเป็นเรื่องง่ายดายไปเลย โดยไม่จำเป็นต้องมานั่งวางแผนกลยุทธ์อะไรให้วุ่นวาย ความรู้สึกที่ได้บดขยี้ศัตรูอย่างราบคาบแบบนี้แหละ คือสิ่งที่เขารอคอยมาตลอด!","รถหุ้มเกราะพุ่งทะยานนำหน้าไปเป็นกลุ่มแรก เสียงปืนกลที่สาดกระสุนอย่างบ้าคลั่ง กวาดล้างทหารยามที่พยายามจะต่อต้านจนหมดสิ้น ส่วนกองทหารปืนคาบศิลาที่ตามมาข้างหลัง ก็มีหน้าที่แค่คอยจับกุมเชลยศึกเท่านั้น","อันที่จริง มีทหารเพียงหยิบมือเดียวเท่านั้นที่กล้าลุกขึ้นสู้ เพราะทหารส่วนใหญ่พากันโยนอาวุธทิ้ง และยอมจำนนตั้งแต่ตอนที่เห็นประตูเมืองเหล็กกล้าถูกทำลายลงอย่างง่ายดายแล้ว","การต่อสู้ครั้งนี้เริ่มต้นและจบลงเร็วมาก จนชาวเมืองเหล็กกล้าเซลทอดหลายคนยังไม่ทันตั้งตัว ก็เห็นรถหุ้มเกราะติดปืนกลพุ่งเข้ามาในเมืองแล้ว","บ้านเรือนและร้านค้าสองข้างทางต่างก็ปิดประตูเงียบ ชาวเมืองที่ยังคงหลงเหลืออยู่บนถนนต่างก็วิ่งหนีเอาชีวิตรอดด้วยความตื่นตระหนก จนเกิดเหตุการณ์เหยียบกันตายขึ้น ส่วนคนที่หนีไม่ทันก็ได้แต่คุกเข่าตัวสั่นงันงกอยู่กับพื้น พร้อมใบหน้าของพวกเขาที่มีแต่ความหวาดกลัวและสิ้นหวัง","เมื่อลินน์เห็นภาพนี้ เขาก็นึกย้อนไปถึงตอนที่พวกเขายึดดินแดนต่างๆ คืนมาระหว่างทาง ชาวเมืองหลายคนก็มีท่าทีหวาดกลัว หรือถึงขั้นลุกขึ้นมาต่อต้านพวกเขาด้วยซ้ำ ซึ่งนั่นก็ทำให้เขาอดไม่ได้ที่จะถอนหายใจออกมา","คงพูดได้คำเดียวว่า การโฆษณาชวนเชื่อและการล้างสมองของศาสนจักรตลอดหลายร้อยปีที่ผ่านมา มันฝังรากลึกอยู่ในใจของผู้คนมากจริงๆ เพราะในสายตาของชาวจักรวรรดิ พ่อมดก็ไม่ต่างอะไรกับปีศาจร้ายเลย!","“แบ่งคนไปช่วยดูแลคนเจ็บด้วยล่ะ!”","ลินน์หันไปออกคำสั่งกับเรย์เดล","“แต่ก็ระวังพวกผู้ศรัทธาคลั่งศาสนาที่อาจจะแฝงตัวอยู่ในกลุ่มชาวบ้าน เพื่อก่อเหตุโจมตีพลีชีพด้วยนะ”","เรย์เดลพยักหน้ารับคำสั่ง ก่อนจะนำกองทหารปืนคาบศิลา และพ่อมดที่เชี่ยวชาญด้านสมุนไพรอีกหลายคน ไปช่วยเหลือผู้บาดเจ็บทันที","หลังจากที่ขบวนรถหุ้มเกราะแล่นเข้ามาในเมืองได้ไม่นาน พวกเขาก็ต้องหยุดชะงักลง","เพราะที่ลานกว้างใกล้กับประตูเมือง มีกองทหารยามนับพันนายคุกเข่าเรียงรายกันอย่างเป็นระเบียบ ซึ่งเป็นภาพที่ดูน่าตื่นตาตื่นใจเป็นอย่างมาก!","ยูลิสซิสและกลุ่มขุนนางที่คุกเข่าอยู่แถวหน้าสุด ต่างก็มีเลือดสาดกระเซ็นเต็มตัว แถมในมือของพวกเขายังถือหัวมนุษย์เอาไว้ด้วย","และนั่นก็คือหัวของเหล่านักบวชแห่งศาสนจักร!","ในจังหวะที่อาร์คบิชอปถูกสังหาร และเหล่านักบวชที่กำลังร่ายพลังศักดิ์สิทธิ์อยู่ก็ได้รับผลกระทบจากการสะท้อนกลับของพลังศักดิ์สิทธิ์ ยูลิสซิสก็ไม่รอช้าที่จะพลิกวิกฤตให้เป็นโอกาส โดยการนำกองกำลังองครักษ์ส่วนตัวเข้าเข่นฆ่าพวกนักบวชอย่างเลือดเย็น...เพื่อนำมาใช้เป็นเครื่องบรรณาการในการยอมจำนน!","ในฐานะขุนนาง การอ่านสถานการณ์และประเมินคน ถือเป็นทักษะพื้นฐานที่สำคัญที่สุด และยูลิสซิสที่มองปราดเดียวก็รู้แล้วว่าใครคือผู้กุมอำนาจที่แท้จริง","เขาทำราวกับว่าได้พบกับพ่อบังเกิดเกล้าที่พลัดพรากจากกันมานาน โดยไม่สนการขัดขวางของทหารปืนคาบศิลา เขาพุ่งเข้าไปคุกเข่าอยู่ตรงหน้าลินน์ ร้องห่มร้องไห้คร่ำครวญว่า ตนเองถูกพวกนักบวชแห่งศาสนจักรบังคับขู่เข็ญ จึงไม่สามารถตอบรับคำเชิญของกษัตริย์องค์ใหม่ได้!","และเขาก็ยังอ้างอีกว่า ตลอดเวลาที่ผ่านมา เขาได้แอบซ่องสุมกำลังพลอย่างลับๆ เฝ้ารอคอยวันที่กองทัพแห่งอาณาจักรจะหวนกลับมาทวงคืนความยุติธรรม ทั้งวันทั้งคืน!","“จริงหรือเปล่า ท่านเคานต์แฮนเซ่น?”","ลินน์ร้องถามขุนนางที่อยู่ด้านหลังด้วยน้ำเสียงขบขัน","ขุนนางชายแดนหลายคนที่อยู่ภายใต้ ‘การคุ้มครอง’ ของกองทหาร ก็เดินก้มหน้าก้มตาเข้ามาหาลินน์ ก่อนจะรีบพูดขึ้นว่า","“ท่านพ่อมด ยูลิสซิสกำลังโกหกหลอกลวงท่านอยู่ มันคือสุนัขรับใช้ของศาสนจักร และเป็นสาวกของเทพนอกรีต ก่อนหน้านี้ก็เป็นมันนี่แหละ ที่เสนอให้ส่งข่าวเรื่องเมืองหลวงไปให้ทางจักรวรรดิรับรู้ แถมข้ายังมีจดหมายเป็นหลักฐานด้วย!”","พูดจบ เคานต์แฮนเซ่นก็ปรายตามองยูลิสซิสแวบหนึ่ง","คิดไม่ถึงล่ะสิ ว่าพวกข้าจะชิงตัดหน้าฟ้องท่านพ่อมดไปก่อนแล้ว!","ยูลิสซิสโกรธจนแทบจะกระอักเลือด ในที่สุดเขาก็เข้าใจแล้วว่า ทำไมกองทัพนับหมื่นถึงมาโผล่ที่หน้าประตูบ้าน โดยที่เขาไม่ได้รับข่าวสารอะไรเลย","ที่แท้ไอ้พวกขุนนางชายแดนพวกนี้ ก็ไม่ได้คิดจะต่อสู้ขัดขืนตั้งแต่แรก แล้วก็พากันยอมจำนนไปหมดแล้วนี่เอง!","และเห็นได้ชัดว่า ตัวเขานี่แหละคือเครื่องบรรณาการของพวกมัน!"]},{"n":415,"t":"สิ่งเดียวที่สามารถต่อกรกับความศรัทธาได้!","c":["ยูลิสซิสที่ไม่อาจแก้ตัวใดๆ ได้ จึงถูกกองทหารปืนคาบศิลาที่ดุดันราวกับหมาป่าจับมัดอย่างรวดเร็ว","ในฐานะอัศวินสายเลือด ยูลิสซิสมีความมั่นใจเต็มเปี่ยมว่า ในระยะประชิดขนาดนี้ เขาสามารถสังหารพวกไพร่ชั้นต่ำที่เข้ามาจับกุมเขาได้ในพริบตา แต่เมื่อถูกปลายกระบอกปืนดำทะมึนจ่อหัว แถมตรงหน้ายังมีจอมเวทผู้ยิ่งใหญ่อีกถึงสองคน เขาจึงเลือกที่จะยอมจำนน และไม่คิดต่อสู้ขัดขืนใดๆ","หลังจากที่ลอร์ดแห่งเมืองเหล็กกล้ายอมจำนน ลินน์ก็สามารถยึดครองเมืองที่สำคัญแห่งนี้ได้ โดยที่ไม่ต้องออกแรงอะไรมากมายนัก","เมืองเซลทอดคือแหล่งผลิตแร่เหล็กที่ใหญ่ที่สุดในอาณาจักร และเป็นหนึ่งในสองเป้าหมายสำคัญ ที่พวกเขาต้องยึดคืนมาให้ได้ ในการบุกโจมตีโต้กลับครั้งนี้!","เหล็กกล้าคือรากฐานของอุตสาหกรรม และความสำคัญของมันก็เป็นที่ประจักษ์ชัดอยู่แล้ว เพราะมันแทบจะเป็นสิ่งที่ต้องใช้ในทุกๆ ที่!","แม้ว่าในเมืองหลวงจะมีการสร้างโรงหลอมเหล็กกล้าขึ้นมาใหม่หลายแห่ง แต่ผลผลิตที่ได้ก็ยังไม่เพียงพอต่อความต้องการอยู่ดี และนี่ก็เป็นเหตุผลว่าทำไมพวกเขาถึงพัฒนาอาวุธรูปแบบใหม่ขึ้นมาได้มากมาย แต่กลับไม่สามารถผลิตออกมาใช้งานจริงในสเกลใหญ่ได้","อันที่จริง การที่พวกเขาสามารถสร้างรถหุ้มเกราะและเรือรบประจัญบานขึ้นมาได้นั้น ต้องยกความดีความชอบให้กับพลังแห่งเวทมนตร์ ไม่อย่างนั้นพวกเขาก็คงไม่สามารถแม้แต่จะผลิตเหล็กกล้าที่ได้มาตรฐานออกมาได้ด้วยซ้ำ!","แต่ด้วยจำนวนพ่อมดเต็มตัวที่มีอยู่อย่างจำกัด การจะให้บุคลากรระดับสูงเหล่านี้ มาเสียเวลาไปกับเรื่องเล็กๆ น้อยๆ อย่างการถลุงเหล็ก มันก็ดูจะสิ้นเปลืองเกินไป ดังนั้น หลังจากที่พวกเขาเอาชนะศาสนจักรในศึกครั้งนี้ได้แล้ว พวกเขาก็จะต้องเร่งสร้างห่วงโซ่อุตสาหกรรมทั้งหมดขึ้นมาให้เร็วที่สุด","กองทัพที่เดินทางรอนแรมมาหลายวันหลายคืน ได้หยุดพักผ่อนในเมืองเซลทอดชั่วคราว พร้อมกับเริ่มดำเนินแผนการ ‘โค่นล้มขุนนางและแจกจ่ายที่ดิน’ ขึ้นอีกครั้ง","เหล่ากองทหารปืนคาบศิลาที่มาจากครอบครัวยากจน ต่างก็ตื่นเต้นดีใจกันสุดๆ โดยพวกเขาพากันบุกเข้าไปในคฤหาสน์อันหรูหราของพวกขุนนาง จัดการกับพวกทหารยาม แล้วเริ่มลงมือตรวจนับทรัพย์สิน","ลินน์นั้นเข้มงวดเรื่องระเบียบวินัยของกองทัพเป็นอย่างมาก หากพบว่ามีใครแอบยักยอกทรัพย์สิน หรือเข่นฆ่าชาวบ้านตามอำเภอใจ คนผู้นั้นจะต้องถูกปลดออกจากตำแหน่ง หรืออาจจะถึงขั้นถูกลงโทษอย่างหนัก!","การจะสร้างระเบียบวินัยที่ดีในกองทัพได้นั้น ต้องอาศัยการฝึกฝนอย่างหนักวันแล้ววันเล่า แต่การที่ระเบียบวินัยจะพังทลายลงนั้น บางครั้งก็เกิดจากการปล่อยปละละเลยเพียงแค่ครั้งสองครั้งเท่านั้น","ส่วนทรัพย์สินและที่ดินที่ถูกยึดมาได้นั้น ก็จะถูกนำไปแจกจ่ายให้กับชาวบ้านที่ยากจน ซึ่งถูกพวกขุนนางและศาสนจักรขูดรีดมาตลอด","การแจกจ่ายที่ดิน, การแจกจ่ายเงินทอง, การประณามผู้กระทำผิด และการช่วยเหลือผู้บาดเจ็บ คือเคล็ดลับสี่ประการที่จะช่วยให้พวกเขา สามารถเปลี่ยนแปลงมุมมองของชาวบ้านที่มีต่อพวกเขาได้!","และผลประโยชน์ที่เป็นรูปธรรมเหล่านี้แหละ คือสิ่งเดียวที่สามารถใช้ต่อกรกับความศรัทธาได้!","แม้ว่าชาวบ้านที่ยากจนส่วนใหญ่จะไม่มีการศึกษา แต่มันก็ไม่ได้แปลว่าพวกเขาจะโง่ อย่างน้อยคนที่มีสติปัญญาปกติทุกคนก็ควรจะรู้ดีว่า หากพวกเขาต้องกลับไปอยู่ภายใต้การปกครองของศาสนจักร ทุกสิ่งทุกอย่างที่พวกเขาได้มา ก็จะถูกยึดคืนไปจนหมด","เมื่อราฟาเอลเห็นหีบสมบัติถูกเปิดออก และเหรียญทองคำเปล่งประกายระยิบระยับนับหมื่นเหรียญ ถูกนำไปแจกจ่ายให้กับชาวบ้านฟรีๆ เขาก็อดไม่ได้ที่จะเดาะลิ้นด้วยความทึ่ง และรู้สึกประหลาดใจกับความใจกว้างของดาวรุ่งแห่งเวทมนตร์ผู้นี้เป็นอย่างมาก","แม้แต่พวกพ่อมดจากสถาบันอิเยตาเองก็ยังรู้สึกไม่พอใจเล็กน้อย เพราะพวกเขาไม่เข้าใจเลยว่าทำไมอีกฝ่ายถึงได้เอาเงินทองไปแจกจ่ายแบบนี้","“เงินที่ถูกนำไปหมุนเวียนในระบบ ถึงจะเรียกว่าเป็นเงินที่แท้จริง!”","ลินน์ที่สังเกตเห็นความสงสัยของทุกคน จึงได้เอ่ยอธิบายขึ้นมา","มูลค่าของเงินทองนั้น เป็นสิ่งที่มนุษย์สร้างขึ้นมาเอง และมันจะแสดงมูลค่าที่แท้จริงออกมาได้ ก็ต่อเมื่อมันถูกนำไปแลกเปลี่ยนเป็นสินค้าเท่านั้น","ต่อให้คุณมีเหรียญทองของจักรวรรดิมากมายมหาศาลขนาดไหน คุณก็ไม่สามารถซื้อเรือเหาะหรือเครื่องบินรบได้ เพราะในจักรวรรดิไม่มีของพวกนั้นขาย","ดังนั้น สินค้าที่ถูกผลิตขึ้นมาต่างหาก ถึงจะเป็นสิ่งที่มีมูลค่าที่แท้จริง โดยเงินทองเป็นเพียงแค่เครื่องมือที่ใช้ในการแลกเปลี่ยน และวัดมูลค่าของสินค้าเท่านั้น หากคุณมีแต่เงินแต่ไม่สามารถซื้ออะไรได้เลย มันก็ไม่ได้ต่างอะไรกับการเป็นคนยากจนเลยสักนิด","และชาวบ้านที่ยากจนเหล่านี้ สามารถเปลี่ยนสถานะกลายเป็นแรงงาน ซึ่งเป็นทั้งผู้ผลิตสินค้า และในขณะเดียวกันก็เป็นผู้บริโภคด้วย","หากไม่มีอะไรผิดพลาด เงินทองที่ถูกแจกจ่ายให้กับชาวบ้านเหล่านี้ ในท้ายที่สุดแล้ว ก็จะกลับมาอยู่ในมือของพวกเขา ผ่านการซื้อหาสินค้าแปลกใหม่ต่างๆ จากนั้น พวกเขาก็จะนำเงินเหล่านั้นไปจ่ายเป็นค่าจ้างให้กับคนงาน ทำให้เกิดเป็นวงจรที่หมุนเวียนไปอย่างต่อเนื่อง...","และในกระบวนการนี้ ชาวบ้านก็จะได้มีงานทำ เศรษฐกิจก็จะได้รับการพัฒนา และสินค้ามากมายก็จะถูกผลิตขึ้นมา","ลินน์อธิบายทฤษฎีเศรษฐศาสตร์เบื้องต้นให้ฟังคร่าวๆ แต่ราฟาเอลและคนอื่นๆ กลับฟังไม่รู้เรื่องเลย และไม่เข้าใจจริงๆ ว่าทำไมการเอาเงินไปแจกชาวบ้าน ถึงจะทำให้เศรษฐกิจดีขึ้นได้","“พวกแกมันสมุนปีศาจ ไอ้พวกสารเลวหน้าไม่อาย พระผู้เป็นเจ้าจะต้องส่งพวกแกลงนรก และแผดเผาวิญญาณของพวกแกในเปลวเพลิงแห่งขุมนรกอย่างแน่นอน...”","บรรดาลูกหลานขุนนางที่ถูกจับกุมตัวเอาไว้ ได้แต่มองดูทรัพย์สินของตัวเองถูกยึด และถูกนำไปแจกจ่ายให้กับพวกชาวบ้านชั้นต่ำ ด้วยความโกรธแค้นจนแทบจะคลุ้มคลั่ง พวกเขาเบิกตากว้างและตะโกนด่าทอออกมาอย่างสุดเสียง","“ในเมื่อพวกมันคิดถึงเทพเจ้าจอมปลอมนั่นมากนัก ก็ส่งพวกมันไปสวรรค์ซะสิ!”","ลินน์โบกมือปัดอย่างรำคาญ ก่อนจะสั่งให้อัศวินองครักษ์ฝีมือดีหลายคน ลากตัวพวกขุนนางเหล่านั้นออกไป","“ไอ้พวกทรยศ ไอ้พวกสวะน่ารังเกียจ พวกแกมันเป็นความอัปยศของขุนนาง!”","ก่อนที่จะถูกลากตัวออกไป ลูกหลานขุนนางแห่งเซลทอดก็ยังคงตะโกนด่าทออย่างบ้าคลั่ง แต่คราวนี้ เป้าหมายของการด่าทอกลับเปลี่ยนไปเป็นแฮนเซ่นและพวกขุนนางชายแดนแทน","เมื่อเทียบกับพวกพ่อมดที่ถูกตราหน้าว่า ‘ชั่วร้ายมาตั้งแต่เกิด’ แล้ว พวกขุนนางที่ทรยศพวกเดียวกันเอง กลับน่ารังเกียจและน่าชิงชังยิ่งกว่า...","แต่เคานต์แฮนเซ่นกลับทำเป็นหูทวนลมกับเสียงด่าทอเหล่านั้น เพราะเขาเชื่อมั่นว่า หากพวกมันมีโอกาส พวกมันก็คงจะเลือกหักหลังเขา เพื่อแลกกับการเอาชีวิตรอดเหมือนกันนั่นแหละ!","มันก็แค่เรื่องของใครลงมือก่อนเท่านั้นแหละ...","ด้วยเวลาที่มีอยู่อย่างจำกัด พวกเขาจำเป็นต้องยึดคืนดินแดนของอาณาจักรกลับมาให้ได้มากที่สุด ก่อนที่กองทัพของศาสนจักรจะเดินทางมาถึง ดังนั้น ลินน์และกองทัพของเขา จึงไม่ได้ตั้งใจที่จะอยู่ที่เมืองเหล็กกล้าแห่งนี้นานนัก หลังจากที่หยุดพักและจัดการเรื่องต่างๆ เป็นเวลาสามวัน พวกเขาก็ทำอะไรไปได้มากมายเลยทีเดียว","อย่างแรกคือการจัดการกับพวกขุนนางในเมือง หลังจากที่มีการตรวจสอบแล้ว พวกที่มีความผิดร้ายแรงก็จะถูกนำตัวไปตัดหัว และแขวนประจานเอาไว้ที่ประตูเมือง ส่วนพวกที่มีความผิดไม่มาก ก็จะถูกส่งไปเป็นแรงงานในเหมืองแร่หรือสร้างถนน ซึ่งมีเพียงขุนนางส่วนน้อยที่มีประวัติดีเท่านั้น ที่สามารถรักษาชีวิตและทรัพย์สินเอาไว้ได้ แต่พวกเขาก็จะถูกถอดยศและริบสิทธิ์ความเป็นขุนนางไป","ส่วนพวกแก๊งมาเฟียหรือผู้มีอิทธิพลในท้องถิ่น ก็ถูกกวาดล้างและจับกุมตัวไปประหารชีวิตจนหมดเกลี้ยง","ผ่านการใช้มาตรการเด็ดขาดและนองเลือดนี้ ผนวกกับนโยบายผ่อนปรนในการแจกจ่ายที่ดินและเงินทองก่อนหน้านี้ จึงทำให้พวกเขาสามารถควบคุมเมืองเหล็กกล้าแห่งนี้ได้ในระยะเวลาเพียงสามวัน แถมยังได้รับความไว้วางใจจากประชาชนบางส่วนอีกด้วย","และข้อดีอีกอย่างหนึ่งก็คือ ในเมื่อดินแดนแห่งนี้ไม่มีพวกขุนนางคอยเป็นตัวถ่วงอีกต่อไป ในอนาคตพวกเขาก็สามารถที่จะพัฒนาอุตสาหกรรมได้อย่างเต็มที่","หลังจากที่จัดการกับเรื่องจุกจิกเหล่านี้เสร็จสิ้น ลินน์ก็ทิ้งพ่อมดเอาไว้สามคน พร้อมกับกองทหารปืนคาบศิลาอีกสองร้อยนาย แล้วทำการจัดตั้งหน่วยรักษาความสงบที่มีกำลังพลถึงสองพันคน โดยคัดเลือกมาจากพวกชาวบ้านที่ยากจน เพื่อใช้รับมือกับพวกผู้ศรัทธาคลั่งศาสนาที่อาจจะก่อความวุ่นวาย จากนั้นพวกเขาก็เตรียมตัวที่จะออกเดินทางต่อ","“ฝั่งของท่านประธานสภาทั้งสองคน ราบรื่นดีใช่ไหม?”","ก่อนออกเดินทาง ลินน์ได้เรียกตัวราฟาเอลที่รับหน้าที่ดูแลเรื่องการสื่อสารมาสอบถาม","ในสงครามครั้งก่อน การที่พวกเขาขาดแคลนเครื่องมือสื่อสารทางไกล ทำให้เกือบจะเกิดเรื่องใหญ่ขึ้นมาแล้ว หากออโรร่าไม่ได้นำกองเรือไปบังเอิญเจอกับกองเรือรบของจักรวรรดิเข้าล่ะก็ กว่าพวกเขาจะทำสงครามกับอาณาจักรเสร็จ ฐานทัพของพวกเขาก็คงจะถูกถล่มจนราบเป็นหน้ากลองไปแล้ว","ดังนั้น ด้วยความเจ็บปวดจากบทเรียนในครั้งนั้น ลินน์จึงได้นำเทคโนโลยีการสื่อสารไร้สายขั้นพื้นฐานที่สุดออกมาใช้ ซึ่งด้วยเทคโนโลยีนี้ กองทัพทั้งหลายที่แยกย้ายกันไปยึดคืนดินแดนของอาณาจักร ก็จะสามารถติดต่อสื่อสารกันได้ หากเกิดเหตุการณ์ไม่คาดฝันขึ้น เพื่อเป็นการป้องกันไม่ให้เกิดความผิดพลาดซ้ำรอยเดิมอีก..."]},{"n":416,"t":"พลังแห่งทวยเทพ ความพ่ายแพ้ครั้งแรก ข่าวร้ายจากจักรวรรดิ!","c":["เทคโนโลยีการสื่อสารไร้สายนั้นมีอยู่หลากหลายรูปแบบ แต่ถ้าจะให้สรุปสั้นๆ ก็คือการใช้คลื่นแม่เหล็กไฟฟ้าในการสื่อสารนั่นเอง","สำหรับพ่อมดที่สามารถรับรู้ แล้วสามารถควบคุมสนามไฟฟ้าและสนามแม่เหล็กได้ในระดับหนึ่งแล้ว การใช้เวทมนตร์เพื่อทำสิ่งนี้ ก็ถือว่าไม่ใช่เรื่องยากเย็นอะไร อย่างน้อยๆ การส่งสัญญาณง่ายๆ ก็สามารถทำได้อย่างแน่นอน","แต่ด้วยระดับพลังของพวกพ่อมดในปัจจุบัน คลื่นแม่เหล็กไฟฟ้าที่พวกเขาสร้างขึ้น จะอ่อนกำลังลงเรื่อยๆ ทำให้ระยะทางในการส่งสัญญาณมีจำกัด ลินน์จึงได้ใช้เรือเหาะกว่าร้อยลำ ที่ทำหน้าที่ลาดตระเวนอยู่ตามพื้นที่ต่างๆ มาดัดแปลงเป็นสถานีส่งสัญญาณชั่วคราว เพื่อให้ครอบคลุมพื้นที่เกือบครึ่งหนึ่งของอาณาจักร","ซึ่งทำให้ บนเรือเหาะแต่ละลำ จะมีพ่อมดที่เชี่ยวชาญเวทมนตร์สายฟ้าประจำการอยู่หนึ่งคน โดยพวกเขาจะมีหน้าที่รับสัญญาณคลื่นแม่เหล็กไฟฟ้าที่อ่อนกำลังลง แล้วทำการขยายและส่งต่อสัญญาณนั้นออกไป ซึ่งด้วยวิธีการส่งต่อแบบทอดๆ นี้ ก็จะทำให้พวกเขาสามารถส่งข่าวสาร ให้กระจายไปทั่วทั้งอาณาจักรได้ในเวลาอันสั้น","แต่ความจริงแล้ว ลินน์นั้นยังมีวิธีสื่อสารที่ง่ายกว่านี้ นั่นก็คือการเชื่อมต่อกับพ่อมดที่ถูกเขาทะลวงกำแพงทางจิตวิญญาณ ผ่านทางเครือข่ายเวทมนตร์ แต่วิธีนี้ยังคงเป็นความลับอยู่ โดยเขาเคยแสดงความสามารถนี้ ให้แอนโธนี่กับเรย์เดลเห็นแค่สองคนเท่านั้น","เพราะท้ายที่สุด คงไม่มีพ่อมดคนไหนชอบใจนักหรอก ที่จะให้คนอื่นเข้ามาสอดแนมในสมองของตัวเองได้อย่างง่ายดาย ดังนั้น ในตอนที่เขายังไม่มีพลังมากพอที่จะกดดันให้ทุกคนยอมรับ การเปิดเผยเรื่องนี้ออกไป ก็ไม่ต่างอะไรกับการรนหาที่ตาย","“จากสัญญาณที่เราได้รับในช่วงไม่กี่วันที่ผ่านมา กองทัพอีกสองกองกำลังรุกคืบเข้าไปในดินแดนของอาณาจักรได้อย่างราบรื่น โดยที่ไม่พบเจอกับอุปสรรคชิ้นใหญ่เลย และตอนนี้ท่านประธานสภาแฮร์รอฟ ก็ได้บุกเข้าไปในเขตแดนของจักรวรรดิแล้ว คาดว่าน่าจะกำลังโจมตีดินแดนมิสต์อยู่!”","ดินแดนมิสต์ตั้งอยู่ทางตะวันออกของจักรวรรดิ และเป็นดินแดนชายแดนที่ติดกับอาณาจักร ก่อนหน้านี้วิกตอริโอได้เค้นเอาข้อมูลที่เป็นประโยชน์มากมาย มาจากความทรงจำของพวกนักบวชที่ถูกจับเป็นเชลย ซึ่งหนึ่งในข้อมูลเหล่านั้นก็คือ สถานที่แห่งนี้เป็นแหล่งผลิตน้ำมันดิบนั่นเอง","และที่นี่ก็คือหนึ่งในสองเป้าหมายหลัก ที่พวกเขาต้องยึดครองให้ได้ ในการบุกโจมตีโต้กลับครั้งนี้ด้วย!","“ทุกอย่างราบรื่นก็ดีแล้ว...”","ลินน์พยักหน้ารับ แต่ในใจลึกๆ กลับรู้สึกถึงความผิดปกติบางอย่าง","เวลาล่วงเลยมากว่าสองเดือนแล้ว นับตั้งแต่สงครามในเมืองหลวงจบลง แต่ทั้งจักรวรรดิและศาสนจักรกลับเงียบเชียบจนผิดสังเกต แถมเรือเหาะลาดตระเวนของพวกเขา ก็ยังไม่พบร่องรอยการเคลื่อนทัพของศัตรู ที่จะบุกเข้ามาในเขตแดนเลยแม้แต่น้อย","ความผิดปกตินี้ ทำให้ลินน์รู้สึกกังวลใจอยู่ไม่น้อย","“ข้าว่าตอนนี้ในเมืองศักดิ์สิทธิ์คงจะวุ่นวายน่าดู ในช่วงเวลาสั้นๆ นี้ พวกเขาคงไม่มีเวลามาสนใจเรื่องของอาณาจักรหรอก”","ราฟาเอลพูดขึ้นด้วยท่าทีสบายใจ","การที่กองทัพปราบปรามของศาสนจักรเพิ่งจะพ่ายแพ้ยับเยินไปถึงสองครั้งติดๆ กัน การจะเรียกขวัญกำลังใจและรวบรวมกองทัพขึ้นมาใหม่ ก็คงไม่ใช่เรื่องง่ายอย่างแน่นอน","ในขณะที่ราฟาเอลกำลังคิดอยู่นั้น เครื่องรับสัญญาณคลื่นแม่เหล็กไฟฟ้าในอ้อมอกของเขาก็สว่างวาบขึ้น","“ดูเหมือนว่าท่านประธานสภาแฮร์รอฟ จะสามารถยึดดินแดนมิสต์ได้สำเร็จแล้วล่ะ”","ราฟาเอลพูดพลางวางเครื่องรับสัญญาณลงบนโต๊ะ","ลินน์เองก็หันไปมองเช่นกัน เนื่องจากการนำเทคโนโลยีคลื่นแม่เหล็กไฟฟ้ามาประยุกต์ใช้กับเวทมนตร์นั้น ยังอยู่ในช่วงเริ่มต้น แม้ว่าพ่อมดที่ควบคุมเวทมนตร์สายฟ้า จะเรียนรู้วิธีส่งสัญญาณได้แล้ว แต่ก็ยังคงต้องพึ่งพาเครื่องรับสัญญาณชนิดพิเศษนี้ ถึงจะสามารถรับรู้ถึงคลื่นแม่เหล็กไฟฟ้าที่แผ่วเบาได้","ติ๊ด...ตื๊ด...ติ๊ด...ตื๊ด...","เสียงสัญญาณดังสลับกันไปมาดังก้องไปทั่วทั้งห้อง","ราฟาเอลหยิบสมุดรหัสมอร์สขึ้นมา และเริ่มทำการถอดรหัส","เครื่องรับสัญญาณคลื่นแม่เหล็กไฟฟ้ารุ่นแรกนี้ ยังมีฟังก์ชันการทำงานที่ค่อนข้างเรียบง่าย โดยมันจะส่งเสียงดัง ‘ติ๊ด’ และ ‘ตื๊ด’ ออกมา เมื่อได้รับคลื่นแม่เหล็กไฟฟ้าที่มีความถี่ต่างกันสองแบบ","จำได้ว่าตอนที่ลินน์เอาเจ้านี่ออกมาให้ดูครั้งแรก ราฟาเอลนั้นรู้สึกผิดหวังมาก เพราะแม้ว่ามันจะเป็นวิธีการสื่อสารทางไกลที่ได้ผลดี แต่ข้อมูลที่มันสามารถส่งผ่านได้นั้น ก็มีอยู่อย่างจำกัดเหลือเกิน","โดยเสียง ‘ติ๊ด’ หมายถึงชัยชนะ และเสียง ‘ตื๊ด’ หมายถึงความพ่ายแพ้ ซึ่งทำให้พวกเขารับรู้สถานการณ์การรบได้เพียงคร่าวๆ เท่านั้น","แต่เห็นได้ชัดว่า จินตนาการของดาวรุ่งแห่งเวทมนตร์ผู้นี้ มันล้ำลึกเกินกว่าที่พวกเขาจะหยั่งถึงได้ เพราะลินน์ได้คิดค้นวิธีเรียงร้อยเสียงสั้นยาวสลับกันไปมา จนเกิดเป็นรูปแบบที่หลากหลายแทบจะนับไม่ถ้วน เพื่อใช้ในการส่งข้อความใดๆ ก็ตามที่พวกเขาต้องการจะสื่อสาร!","แถมวิธีนี้ยังสามารถป้องกันไม่ให้ศัตรูดักฟังสัญญาณ หรือเค้นเอาข้อมูลจากเจ้าหน้าที่สื่อสารที่ถูกจับเป็นเชลยได้อีกด้วย","เพราะข้อมูลทั้งหมดได้ถูกเข้ารหัสเอาไว้แล้ว และมีเพียงผู้ที่มีสมุดรหัสเท่านั้น ถึงจะสามารถถอดรหัสมันออกมาได้!","ปัญหาเดียวก็คือ การถอดรหัสนั้นค่อนข้างจะยุ่งยากและเสียเวลาไปหน่อย","“ดินแดนมิสต์, พ่ายแพ้ยับเยิน...”","ราฟาเอลค่อยๆ อ่านข้อความที่ถอดรหัสออกมาได้ ทีละคำๆ","นี่หมายความว่าพวกเขาสามารถบดขยี้ศัตรูได้แล้วใช่ไหม?","ราฟาเอลคิดในใจ แต่ในไม่ช้า เขาก็พบว่ารหัสชุดสุดท้ายนั้น มันหมายความว่า...","“ขอความช่วยเหลือ!”","ลินน์ลุกพรวดขึ้นจากเก้าอี้ด้วยสีหน้าเคร่งเครียด แม้จะไม่ได้ดูสมุดรหัส แต่เขากลับสามารถถอดรหัสข้อความทั้งหมดได้เร็วกว่าราฟาเอลเสียอีก","“พวกเราพ่ายแพ้ยับเยินที่ดินแดนมิสต์ ต้องการความช่วยเหลือ...เดี๋ยวนี้!”","ราฟาเอลรู้สึกเหมือนมีคนเอาค้อนมาทุบหัวอย่างจัง ในฐานะผู้ถือกุญแจรหัส เขาย่อมรู้ดีว่าสิ่งที่ลินน์พูดออกมานั้นไม่มีผิดเพี้ยนเลยแม้แต่น้อย!","แต่มันจะเป็นไปได้ยังไง?","ใบหน้าของราฟาเอลเต็มไปด้วยความตกตะลึงและไม่เข้าใจ แม้ว่ากองทัพทั้งสามที่ถูกส่งไปยึดคืนอาณาจักร จะมีกำลังพลเพียงกองทัพละหมื่นนาย แต่พวกเขาก็มีความได้เปรียบทางด้านเทคโนโลยีอย่างขาดลอย!","และเพื่อความปลอดภัย ท่านประธานสภาทั้งสามคน ก็ได้เดินทางไปพร้อมกับกองทัพด้วย","เพียงแต่พวกเขาแกล้งทำเป็นยังคงปักหลักอยู่ในเมืองหลวง เพื่อลวงให้ศัตรูสับสน และไม่ได้เปิดเผยตัวตนออกมาเท่านั้น","ซึ่งมันก็ทำให้เมืองหลวงที่ดูเหมือนจะมีการคุ้มกันอย่างแน่นหนา ในตอนนี้กลับกลายเป็นเมืองที่ว่างเปล่าไปเลย","“หรือว่าที่ดินแดนมิสต์ จะมีนักบวชระดับตำนานประจำการอยู่พอดี?”","ราฟาเอลคิดจนหัวแทบแตก แต่ก็คิดออกเพียงแค่ความเป็นไปได้เดียวเท่านั้น","เพราะมีเพียงพลังแห่งทวยเทพเท่านั้น ที่จะสามารถบดขยี้กองทัพนับหมื่นนาย ที่ติดอาวุธปืนคาบศิลารุ่นใหม่และรถหุ้มเกราะได้ จนทำให้ท่านประธานสภาแฮร์รอฟ ต้องใช้คำว่า ‘พ่ายแพ้ยับเยิน’ ในการส่งข้อความสื่อสาร","ลินน์ขมวดคิ้วมุ่น เขาไม่คิดว่ามันจะเป็นแบบนั้น เพราะก่อนหน้านี้พวกเขาเคยหารือเกี่ยวกับสถานการณ์ทำนองนี้เอาไว้แล้ว หากกองทัพใดกองทัพหนึ่งพบว่าศัตรูมีนักบวชระดับตำนานอยู่ด้วยล่ะก็ พวกเขาจะต้องล้มเลิกแผนการบุกโจมตีทันที และเปลี่ยนไปตั้งรับเพื่อรอความช่วยเหลือ หรืออาจจะถึงขั้นล่าถอยไปเลย","เพราะการอัญเชิญทวยเทพนั้นต้องแลกมาด้วยข้อแลกเปลี่ยนที่แสนแพง หากไม่ถึงคราวคับขันจนถึงขั้นต้องเอาชีวิตเข้าแลกแล้วล่ะก็ อีกฝ่ายก็คงไม่ผลีผลามใช้มันออกมาอย่างแน่นอน","การแลกชีวิตกับนักบวชระดับตำนาน มันไม่ใช่เรื่องคุ้มค่าสำหรับศาสนจักรเลย!","ยิ่งไปกว่านั้น ทันทีที่พบตัวนักบวชระดับตำนาน แฮร์รอฟก็ควรจะส่งสัญญาณมาบอกทันที ไม่ใช่รอจนกระทั่งพ่ายแพ้แตกพ่าย แล้วค่อยส่งสัญญาณขอความช่วยเหลือมาแบบนี้","ลินน์คาดเดาว่า สถานการณ์จะต้องพลิกผันอย่างกะทันหันแน่นอน ถึงได้เกิดเรื่องแบบนี้ขึ้น!","และที่สำคัญที่สุดก็คือ ในข้อความที่ส่งมานั้น ไม่ได้มีคำว่า ‘อัญเชิญเทพ’ อยู่เลย!","“ยังมีความเป็นไปได้อีกอย่างหนึ่ง นั่นก็คือกองทัพปราบปรามของจักรวรรดิ ได้มาปรากฏตัวที่ดินแดนมิสต์อย่างกะทันหัน หรืออาจจะลอบเข้าจู่โจมแบบสายฟ้าแลบ...”","ออโรร่าค่อยๆ ปรากฏตัวออกมาจากด้านข้าง พร้อมกับพูดถึงสถานการณ์ที่มีความเป็นไปได้มากที่สุด","ซึ่งนั่นก็หมายความว่า กองทัพของจักรวรรดิ สามารถหลบเลี่ยงการลาดตระเวนของเรือเหาะมาได้ และสามารถเข้ามาประชิดตัวพวกเขาได้ โดยที่พวกเขาไม่รู้ตัวเลยแม้แต่น้อย","ซึ่งมันก็ไม่ใช่เรื่องที่เป็นไปไม่ได้!","บางทีเรือเหาะลาดตระเวนของพวกเขา อาจจะถูกพลังศักดิ์สิทธิ์อันทรงพลังบางอย่างทำลายไปอย่างเงียบๆ หรือไม่ก็ศัตรูอาจจะใช้พลังศักดิ์สิทธิ์พรางตาในอาณาบริเวณกว้าง เพื่อซ่อนเร้นกองทัพทั้งกองทัพให้หายไปจากสายตา และเดินทัพเข้ามาตลบหลังพวกเขาอย่างหน้าตาเฉย..."]},{"n":417,"t":"แข่งกับเวลา สมรภูมิอันพังทลาย","c":["เหงื่อเย็นๆ ผุดพรายขึ้นเต็มหน้าผากของราฟาเอล เพราะไม่ว่าจะเป็นข้อสันนิษฐานไหน มันก็คือข่าวร้ายแบบสุดๆ ทั้งนั้น","“ข้าจะรีบไปเดี๋ยวนี้!”","หลังจากที่ร่วมกันวิเคราะห์สถานการณ์คร่าวๆ กับลินน์เสร็จแล้ว ออโรร่าก็ไม่รอช้า ร่างของเธอหายวับไปจากตรงนั้นทันที","แต่สีหน้าของราฟาเอลกลับไม่ได้คลายความกังวลลงเลยแม้แต่น้อย เพราะระยะทางจากที่นี่ไปถึงดินแดนมิสต์นั้นไกลมาก แม้จะวัดเป็นเส้นตรง ก็ยังห่างกันถึงร้อยห้าสิบกิโลเมตร ต่อให้เดินทางด้วยความเร็วระดับท่านประธานสภา ก็ยังต้องใช้เวลาบินถึงสองชั่วโมง ซึ่งเกรงว่ามันอาจจะสายเกินไปเสียแล้ว...","ทางด้านลินน์ได้ลูบแหวนแห่งศาสตร์เร้นลับในมือเบาๆ เพื่อให้ปัญญาประดิษฐ์สนับสนุนเริ่มทำการค้นหาพิกัด เขาเตรียมพร้อมที่จะใช้เครือข่ายเวทมนตร์ เป็นสื่อกลางในการส่งผ่านพลังและจิตมุ่งมั่นของเขาไปยังดินแดนมิสต์","เขาจะต้องไปดูให้เห็นกับตาตัวเองว่า เกิดอะไรขึ้นที่ฝั่งของแฮร์รอฟกันแน่!","ก่อนหน้านี้ ลินน์ได้เตรียมมาตรการฉุกเฉินเอาไว้บ้างแล้ว อย่างเช่น การส่งพ่อมดจากสถาบันอิเยตาไปประจำการอยู่ในกองทัพอีกสองกองทัพที่เหลือ ซึ่งพ่อมดเหล่านั้นจะพกแหวนแห่งศาสตร์เร้นลับแบบพิเศษติดตัวไว้ และพวกเขาก็ล้วนถูกทะลวงกำแพงจิตวิญญาณไปมากกว่าสามสิบเปอร์เซ็นต์แล้วทั้งสิ้น!","การฝังพิกัดลงไปลึกถึงระดับจิตวิญญาณแบบนี้ ทำให้เขาสามารถระบุตำแหน่งที่อยู่ห่างออกไปหลายร้อยหรือหลายพันกิโลเมตรได้อย่างง่ายดาย และเมื่อนำมาผสานกับปัญญาประดิษฐ์สนับสนุนและแหวนแห่งศาสตร์เร้นลับในฐานะสื่อกลาง เขาก็จะสามารถส่งผ่านพลังของตัวเองข้ามระยะทางไกลๆ ได้","พูดให้ถูกก็คือ มันคือศาสตร์แห่งเวทมนตร์วิญญาณ ซึ่งล้ำลึกและซับซ้อนกว่าเทคโนโลยีคลื่นแม่เหล็กไฟฟ้ามากนัก แต่มันถูกจัดให้เป็นวิชาต้องห้ามในดินแดนแห่งพ่อมด และจนถึงตอนนี้ ลินน์ก็เคยเห็นคนที่มีความสามารถคล้ายคลึงกันนี้เพียงแค่สามคนเท่านั้น","คนแรกก็คือเฮลราม เขาอาศัยบันทึกเวทมนตร์วิญญาณจำนวนมหาศาล ที่เมิร์กซึ่งเป็นจอมเวทผู้ชั่วร้ายทิ้งเอาไว้ มาบวกกับความฉลาดหลักแหลมของตัวเอง จนสามารถสร้างเครือข่ายเวทมนตร์ที่ไม่สมบูรณ์ขึ้นมาได้ แถมยังสร้างค่ายกลกลืนวิญญาณอันแสนวิปริต เพื่อสูบเอาพลังเวทมนตร์ของบรรดาพ่อมดในกลุ่ม ‘ผู้ไร้หน้า’ ที่ถูกทะลวงกำแพงจิตวิญาณ มาใช้เป็นพลังงานในการชุบชีวิตลูกสาวของเขา","เส้นทางที่ลินน์กำลังเดินอยู่นี้ ก็คล้ายคลึงกับเฮลราม เพียงแต่วิธีการของเขานั้นนุ่มนวลกว่ามาก โดยเขายึดหลักการพัฒนาอย่างยั่งยืนและได้ประโยชน์กันทั้งสองฝ่าย โดยเขาเป็นคนมอบความรู้ ส่วนพวกพ่อมดก็มอบพลังในการประมวลผลให้ ซึ่งถือว่าวิน-วินกันทั้งสองฝ่าย และเขาก็ไม่มีทางทำเรื่องโง่เขลา อย่างการฆ่าห่านที่ออกไข่เป็นทองคำอย่างแน่นอน","คนที่สองคือออโรร่า เธอเคยประทับตราเวทมนตร์เอาไว้บนหน้าผากของเขา เพื่อใช้เป็นพิกัดในการส่งผ่านพลังมาคุ้มครองเขา แต่วิธีนี้เห็นได้ชัดว่า เป็นเพียงมาตรการฉุกเฉินเท่านั้น เพราะมันต้องการทักษะของผู้ร่ายเวทมนตร์ในระดับสูงลิบ จึงไม่อาจนำมาใช้ได้อย่างแพร่หลาย","ส่วนคนที่สามนั้น ก็คือ ‘เอลา’ เทพเจ้าจอมปลอมนั่นเอง!","อีกฝ่ายไม่เพียงแต่สามารถประทานพลังศักดิ์สิทธิ์ ให้กับเหล่านักบวชได้เท่านั้น แต่ในระดับพระคาร์ดินัลขึ้นไป ยังสามารถถูกใช้เป็นร่างทรง เพื่อรองรับการส่งผ่านพลังแห่งทวยเทพได้อีกด้วย และยิ่งถ้าเป็นนักบวชระดับตำนานด้วยแล้วล่ะก็ ถึงขั้นสามารถเปิดประตูสวรรค์ เพื่ออัญเชิญร่างจริงของ ‘เอลา’ ลงมาประทับร่างได้เลยทีเดียว!","ซึ่งทำให้ลินน์นั้นสงสัยมาตลอดว่า พลังในการประทานพลังศักดิ์สิทธิ์และพิธีกรรมอัญเชิญเทพของศาสนจักร จะต้องมีความคล้ายคลึงกับเครือข่ายเวทมนตร์ของเขาอย่างแน่นอน เพียงแต่เขายังไม่มีหลักฐานมายืนยันสมมติฐานนี้เท่านั้น","[ค้นพบพิกัด 043 ระยะทางเป็นเส้นตรง 159 กิโลเมตร ต้องการเริ่มการส่งผ่านเวทมนตร์หรือไม่?]","เสียงเตือนจากสมองกลดึงสติของลินน์กลับมา เขาไม่รอช้าที่จะตอบกลับในใจทันที","“ตกลง!”","...","ในขณะเดียวกัน ณ ดินแดนมิสต์ บริเวณชายแดนของจักรวรรดิเซคัส การต่อสู้อันดุเดือดกำลังเปิดฉากขึ้น เสียงโห่ร้องและเสียงอาวุธปะทะกันดังกึกก้องไปทั่วบริเวณ","“ฆ่าพวกสมุนปีศาจให้หมด!”","“เพื่อความรุ่งโรจน์แห่งพระผู้เป็นเจ้า!”","อัศวินในชุดเกราะสีเงินพุ่งทะยานเป็นแนวหน้า พร้อมแววตาของพวกเขาที่เต็มไปด้วยความคลั่งไคล้และกระหายเลือด หอกยาวในมือถูกแทงออกไปอย่างต่อเนื่อง สังหารกองทหารปืนคาบศิลาที่กำลังบรรจุกระสุนไปหลายนาย","แต่การบุกทะลวงของพวกเขาก็ต้องหยุดชะงักลง เมื่อถูกลูกไฟฝูงใหญ่พุ่งเข้าใส่ เสียงระเบิดตูมตามพร้อมกับเปลวไฟและฝุ่นควันที่คละคลุ้ง ทำให้กองทหารม้าต้องชะลอความเร็วลง และในพริบตานั้น รถหุ้มเกราะหลายคันก็แล่นเข้ามาขวางหน้าพวกเขาเอาไว้","เสียงปืนกลคำรามลั่น เปลวไฟที่แลบออกมาจากปลายกระบอกปืน ราวกับเคียวของยมทูตที่กวาดล้างทุกสิ่งทุกอย่างที่ขวางหน้า ไม่ว่าจะเป็นบาเรียศักดิ์สิทธิ์ หรือชุดเกราะเหล็กที่แข็งแกร่ง ก็ล้วนถูกฉีกกระชากเป็นชิ้นๆ ในพริบตา","ภายใต้การโจมตีอันดุดัน กองทหารม้าขนาดใหญ่ก็แตกพ่ายกระจัดกระจายไป!","ทันใดนั้น ยักษ์ร่างใหญ่โตมโหฬารก็ปรากฏตัวขึ้นต่อหน้าเหล่าพ่อมด มันมีความสูงกว่าเจ็ดเมตร สวมชุดเกราะเหล็กทั้งตัว แถมในมือยังถือโล่เหล็กขนาดยักษ์เอาไว้อีกด้วย มันฝืนทนต่อห่ากระสุนปืนกล แล้วพุ่งเข้าไปคว่ำรถหุ้มเกราะคันหนึ่งจนหงายท้อง แต่ในพริบตาต่อมา มันก็ถูกลำแสงสีแดงฉานหลายสายที่พุ่งมาจากระยะไกล ทะลวงร่างจนเป็นรูพรุน","แน่นอนว่านี่คือผลงานของปืนใหญ่แม่เหล็กไฟฟ้านั่นเอง!","ร่างอันใหญ่โตราวกับภูเขาย่อมๆ ของยักษ์ล้มตึงลงมา ทับทหารทั้งสองฝ่ายที่กำลังต่อสู้กันอยู่จนแบนแต๊ดแต๋ เลือดสีแดงสดสาดกระเซ็น ย้อมผืนดินบริเวณนั้นจนกลายเป็นสีเลือด","ในสมรภูมิอันแสนโกลาหลนี้ ความเป็นและความตาย สามารถพลิกผันกันได้ในเสี้ยววินาที","แต่ยักษ์ชุดเกราะเหล็กนั้นไม่ได้มีเพียงแค่ตัวเดียว พวกมันปรากฏตัวขึ้นทั่วทุกหนทุกแห่งในสนามรบ และมีจำนวนมากมายมหาศาล พวกมันไม่เพียงแต่มีผิวหนังที่หนาเตอะ ซึ่งสามารถทนทานต่อการโจมตีทางกายภาพและเวทมนตร์ได้อย่างดีเยี่ยมเท่านั้น แต่พวกมันยังติดตั้งอาวุธและชุดเกราะที่ทรงพลังอีกด้วย","ไม่ว่าจะเป็นปืนคาบศิลาหรือเวทมนตร์ระดับต่ำ ก็ทำได้เพียงแค่สร้างรอยขีดข่วนให้กับพวกมันเท่านั้น แม้แต่ปืนใหญ่แม่เหล็กไฟฟ้า เมื่อเจาะทะลุโล่เหล็กและชุดเกราะเหล็กที่หนาหลายสิบเซนติเมตรเข้าไปได้ ก็ยังไม่สามารถสร้างบาดแผลฉกรรจ์ให้กับพวกมันได้ เว้นเสียแต่ว่าจะระดมยิงเข้าใส่จุดอ่อนพร้อมๆ กัน","แฮร์รอฟใช้เวทมนตร์สนามพลังฉีกร่างยักษ์ชุดเกราะเหล็กไปได้ถึงสองตัว แต่ก็ยังไม่อาจกอบกู้สถานการณ์ที่กำลังย่ำแย่ลงเรื่อยๆ ได้","นั่นก็เป็นเพราะกองทัพของจักรวรรดิปรากฏตัวขึ้นในจังหวะที่ประจวบเหมาะเกินไป!","ในขณะที่พวกเขากำลังบุกโจมตีเมืองอยู่นั้น จู่ๆ ศัตรูก็โผล่มาตลบหลัง และเปิดฉากโจมตีอย่างไม่ทันตั้งตัว!","ไม่ว่าจะเป็นเรือเหาะหรือพ่อมดที่ทำหน้าที่สอดแนม ต่างก็ไม่มีใครรับรู้ถึงการมาของพวกมันเลยแม้แต่น้อย จนกระทั่งกองทัพของจักรวรรดิเคลื่อนตัวเข้ามาใกล้ และทำให้แผ่นดินสั่นสะเทือน พวกเขาถึงเพิ่งจะรู้ตัวว่ามีศัตรูบุกมา","แต่มันก็สายเกินไปเสียแล้ว กองทหารปืนใหญ่ที่อยู่ด้านหลัง ถูกอัศวินทัณฑ์ศักดิ์สิทธิ์นับพันนายพุ่งเข้าชนจนแตกพ่าย พร้อมกับพ่อมดที่ประจำการอยู่ ก็ไม่สามารถต้านทานการโจมตีของกองทหารม้า ที่แข็งแกร่งราวกับสัตว์ร้าย แถมยังได้รับการเสริมพลังจากพลังศักดิ์สิทธิ์ได้","ไม่ต้องพูดถึงพวกนักบวชและบิชอปของศาสนจักรเลย ที่แฝงตัวมากับกลุ่มอัศวินเกราะเงิน และคอยร่ายพลังศักดิ์สิทธิ์ใส่พวกเขาเป็นระยะๆ ซึ่งสร้างความปวดหัวให้กับพวกเขาเป็นอย่างมาก","สำหรับกองทหารปืนคาบศิลาแล้ว สิ่งที่สำคัญที่สุดก็คือ ‘การจัดกระบวนทัพ’ เพราะหากกระบวนทัพแตกพ่าย ก็ไม่สามารถสร้างตาข่ายการยิงที่หนาแน่นได้ และประสิทธิภาพในการรบก็จะลดฮวบลงอย่างหลีกเลี่ยงไม่ได้ ยิ่งไปกว่านั้น ในครั้งนี้พวกเขายังต้องเผชิญหน้ากับกองทัพทัณฑ์ศักดิ์สิทธิ์ บนพื้นที่ราบเปิดกว้างอีกด้วย","ตามแผนการรบที่พวกเขาวางเอาไว้ล่วงหน้า หากต้องปะทะกับกองกำลังขนาดใหญ่บนพื้นที่ราบ พวกเขาจะต้องใช้รถหุ้มเกราะเป็นเกราะกำบัง และใช้ปืนกลกับปืนใหญ่คอยยิงสนับสนุน พร้อมกับการทิ้งระเบิดจากเรือเหาะ เพื่อสร้างการโจมตีประสานทั้งทางบกและทางอากาศ โดยมีเป้าหมายเพื่อสกัดกั้นศัตรู ให้อยู่ห่างออกไปอย่างน้อยห้าสิบเมตร และไม่ยอมให้ศัตรูเข้าประชิดตัวได้อย่างเด็ดขาด","แต่ดูเหมือนว่าแผนการนั้นจะพังไม่เป็นท่าเสียแล้ว...ในตอนนี้ กระบวนทัพของพวกเขาแตกพ่าย ทำให้ต้องต่อสู้ในระยะประชิดอย่างเลี่ยงไม่ได้ และสิ่งเดียวที่พวกเขาทำได้ในตอนนี้ก็คือ การรักษาชีวิตของกำลังพลเอาไว้ให้ได้มากที่สุด แล้วพยายามล่าถอยไปให้พ้นจากอันตราย"]},{"n":418,"t":"คนที่ใช้เวทมนตร์จริงๆ ไม่ใช่ข้า แต่เป็นดวงอาทิตย์ต่างหากล่ะ!","c":["“ท่านประธานสภา พวกเรารอต่อไปแบบนี้ไม่ได้แล้วล่ะครับ ให้พวกข้าอยู่รั้งท้ายเพื่อถ่วงเวลาเอาไว้เถอะ”","ซานเชซเอ่ยขึ้นด้วยความร้อนใจ เมื่อเห็นว่ากระบวนทัพที่อุตส่าห์รวบรวมขึ้นมาได้ ต้องมาแตกพ่ายลงอีกครั้ง","ด้วยสถานการณ์ในตอนนี้ เกรงว่าพวกเขาคงจะรอความช่วยเหลือไม่ไหวแล้ว ทางออกที่ดีที่สุดก็คือการทิ้งกองกำลังชั้นยอดส่วนหนึ่งเอาไว้ เพื่อคอยสกัดกั้นศัตรู ไม่อย่างนั้น พวกเขาก็คงจะได้ตายกันอยู่ที่นี่หมดแน่","“ไม่ ลำพังแค่พวกเจ้า คงไม่สามารถหยุดยั้งพวกมันได้หรอก”","แฮร์รอฟเอ่ยด้วยสีหน้าเคร่งเครียด","กองทัพของจักรวรรดิที่มาปรากฏตัวอยู่ด้านหลังของพวกเขาอย่างกะทันหันนี้ มีกำลังพลห้าถึงหกหมื่นนาย ซึ่งในจำนวนนั้นจะต้องมีนักบวชระดับตำนานรวมอยู่ด้วยอย่างแน่นอน และอาจจะมีมากกว่าหนึ่งคนด้วยซ้ำ และสาเหตุที่เขายังไม่ได้ทุ่มพลังเวทมนตร์ออกมาอย่างเต็มที่ ก็เพื่อเตรียมรับมือกับศัตรูระดับตำนานพวกนี้นี่แหละ","ด้วยระดับพลังของซานเชซและคนอื่นๆ เกรงว่าคงไม่อาจหยุดยั้งศัตรูได้แม้แต่นิดเดียว ในตอนนี้ คนเพียงคนเดียวที่สามารถอยู่รั้งท้าย เพื่อถ่วงเวลาศัตรูได้ ก็คงมีแต่เขาเท่านั้น!","ในขณะที่แฮร์รอฟกำลังจะอ้าปากพูดนั้น จู่ๆ ก็มีเสียงหนึ่งดังขึ้นที่ข้างหูของทุกคน","“พวกท่านรีบล่าถอยไปก่อนเถอะ ข้าจะเป็นคนสกัดกั้นพวกมันเอง!”","แฮร์รอฟและคนอื่นๆ รีบหันขวับไปมองตามเสียง และก็ได้พบกับร่างที่ไม่มีใครคาดคิดปรากฏขึ้นตรงหน้าพวกเขา...ลินน์ที่ตามข้อมูลแล้ว ควรจะอยู่ที่เมืองเหล็กกล้าเซลทอด กลับมาปรากฏตัวอยู่ที่นี่ได้อย่างไรกัน!","“ปรมาจารย์ลินน์?”","ซานเชซเอ่ยด้วยความประหลาดใจระคนดีใจ","“ยอดเยี่ยมไปเลย! พวกท่านมาได้ทันเวลาพอดี! แล้วท่านประธานสภาออโรร่ากับท่านวิกตอริโอล่ะ? พวกเขาเดินทางมาถึงแล้วหรือยัง?”","หากมีกำลังเสริมมาสมทบ แถมยังมีท่านประธานสภาอีกหลายคนมาร่วมมือกัน พวกเขาก็จะสามารถตอบโต้ศัตรูได้อย่างสาสม!","แต่แฮร์รอฟกลับมองออกในพริบตาว่า ร่างของลินน์ที่อยู่ตรงหน้านี้ ไม่ใช่ร่างจริง แต่เป็นเพียงร่างจำลอง ที่ถูกสร้างขึ้นจากเวทมนตร์ที่คล้ายคลึงกับเวทมนตร์ของออโรร่าเท่านั้น","และก็เป็นไปตามที่เขาคาดคิด ลินน์รีบเอ่ยอธิบายทันที","“ไม่ กำลังเสริมยังมาไม่ถึง ท่านประธานสภาทั้งสองคนจะต้องใช้เวลาอย่างน้อยสองถึงสามชั่วโมงกว่าจะมาถึงที่นี่ และถ้ารอกำลังสนับสนุนจากอีกสองกองทัพที่เหลือ ก็คงจะยิ่งช้าเข้าไปใหญ่”","แม้ว่าพวกเขาจะมีเรือเหาะไว้ใช้สำหรับขนส่งกำลังพล แต่การเคลื่อนย้ายกองทัพขนาดใหญ่ มันก็ไม่ใช่เรื่องง่ายดายเลย","“แล้วด้วยสภาพของเจ้าในตอนนี้ เจ้าจะสามารถดึงพลังออกมาใช้ได้สักกี่ส่วนกันเชียว?”","แฮร์รอฟอดไม่ได้ที่จะเอ่ยขัดขึ้น","เขายอมรับในความแข็งแกร่งของลินน์ แต่ถึงกระนั้น อีกฝ่ายก็ยังเป็นเพียงแค่พ่อมดระดับสี่วงแหวนเท่านั้น หากลินน์มาด้วยตัวเอง และใช้เวทมนตร์ต้องห้าม ที่สามารถเพิ่มพลังเวทมนตร์ได้ชั่วคราว เหมือนกับตอนที่ต่อสู้กับเทพ ‘เอลา’ ก็อาจจะพอรับมือได้อยู่หรอก แต่ร่างที่มาปรากฏตัวอยู่ที่นี่ เป็นเพียงแค่ร่างจำลองที่สร้างจากพลังเวทมนตร์เท่านั้น","อย่าบอกนะว่าเขาพกเอาวัตถุดิบสำหรับใช้เวทมนตร์ระเบิดนิวเคลียร์ติดตัวมาด้วยน่ะ?","เมื่อคิดถึงความเป็นไปได้นี้ แฮร์รอฟก็เริ่มมีความหวังขึ้นมาเล็กน้อย แต่เพียงเสี้ยววินาทีต่อมา ความหวังนั้นก็พังทลายลง","“ความจริงแล้ว ร่างจำลองนี้มีพลังเวทมนตร์เพียงพอที่จะร่ายเวทระดับสี่วงแหวนแบบเต็มกำลังได้เพียงแค่ครั้งเดียวเท่านั้น!”","ลินน์ตอบตามความจริง ก่อนจะรีบพูดเสริมด้วยน้ำเสียงหนักแน่น ราวกับรู้ว่าทุกคนกำลังจะเอ่ยคัดค้าน","“แต่ข้าคิดว่าแค่นั้นก็เพียงพอแล้วล่ะ!”","เมื่อเห็นว่าดาวรุ่งแห่งเวทมนตร์ผู้นี้มีความมั่นใจอย่างเต็มเปี่ยม แฮร์รอฟก็เก็บความสงสัยที่มีอยู่เต็มอกเอาไว้ และไม่ได้เอ่ยคัดค้านใดๆ แต่กลับถามถึงแผนการของลินน์อย่างตรงไปตรงมาแทน","“สรุปก็คือ ข้าต้องการความช่วยเหลือจากพวกท่านนิดหน่อย...ช่วยแยกกองทัพของเราออกจากกองทัพศัตรูให้ที จะได้ไม่เกิดการบาดเจ็บล้มตายในฝ่ายเดียวกัน”","ลินน์พูดรัวและเร็ว จากนั้นก็หันไปมองสมรภูมิอันแสนโกลาหล แล้วถอนหายใจออกมาเบาๆ","“ดูเหมือนว่าเราคงต้องยอมสละกำลังพลบางส่วนแล้วล่ะ!”","ภายใต้การสั่งการอย่างเป็นระบบ บรรดาพ่อมดที่กำลังแตกพ่าย ก็กลับมารวมตัวกันได้อย่างรวดเร็ว และเริ่มเปิดฉากตอบโต้ครั้งใหญ่ที่สุด โดยคราวนี้ไม่มีใครออมพลังเวทมนตร์เอาไว้อีกต่อไป!","แฮร์รอฟเป็นคนแรกที่ลงมือ เขาถ่ายทอดพลังเวทมนตร์อันมหาศาลลงไปในผืนแผ่นดิน และในพริบตาต่อมา สมรภูมิรบก็เริ่มพังทลายลง โดยแผ่นดินนั้นถูกฉีกขาดออกจากกัน ก่อให้เกิดเป็นหุบเหวลึก แถมรอยแยกยังขยายตัวออกไปด้านข้างอย่างรวดเร็ว","หากมองลงมาจากท้องฟ้า ก็จะเห็นว่าสมรภูมิรบถูกผ่าออกเป็นสองซีก!","การเปลี่ยนแปลงภูมิประเทศ และควบคุมสถานการณ์ในสนามรบด้วยตัวคนเดียว นี่แหละคือพลังของเวทมนตร์ระดับ ‘ตำนาน’!","และกระบวนการทั้งหมดนี้ก็ใช้เวลาเพียงแค่สิบกว่าวินาทีเท่านั้น","แฮร์รอฟหอบหายใจถี่รัว พลังเวทมนตร์ในร่างถูกสูบออกไปจนเกือบครึ่ง การร่ายเวทมนตร์ระดับตำนานในสเกลที่ใหญ่ขนาดนี้ ไม่ใช่เรื่องง่ายสำหรับเขาเลย","ตามมาด้วยซานเชซและพ่อมดคนอื่นๆ ที่ร่ายเวทมนตร์ออกมาอย่างต่อเนื่อง โดยมีเวทมนตร์หลากหลายรูปแบบ ทั้งน้ำแข็ง เปลวไฟ และสายฟ้า ผสมผสานกันพุ่งเข้าถล่มกองทัพศัตรูอย่างดุเดือด","“ด้วยเจตจำนงแห่งพระผู้เป็นเจ้า ความชั่วร้ายทั้งปวงจะต้องถูกขจัดสิ้น!”","ในขณะเดียวกัน เสียงอันทรงพลังและศักดิ์สิทธิ์ก็ดังกึกก้องไปทั่วสนามรบ ม่านพลังที่มองไม่เห็นปรากฏขึ้นกลางอากาศ และสกัดกั้นห่าฝนเวทมนตร์เหล่านั้นเอาไว้ แม้ว่าม่านพลังจะถูกระเบิดเวทมนตร์นับร้อยลูกทำลายลงอย่างรวดเร็ว แต่มันก็ช่วยลดทอนความสูญเสียไปได้มากทีเดียว","แฮร์รอฟรู้ทันทีว่าเป็นฝีมือของนักบวชระดับตำนานแห่งศาสนจักร แต่อย่างน้อยเป้าหมายของพวกเขาก็บรรลุแล้ว ในตอนนี้ สมรภูมิรบได้ถูกแบ่งแยกออกจากกันอย่างชัดเจน","กองทหารม้าที่กำลังพุ่งทะยานเข้ามา ต้องชะลอความเร็วลง ในขณะที่ยักษ์สองสามตัวที่สมองไม่ค่อยจะดีนัก พุ่งตกลงไปในหุบเหว หัวกระแทกจนหน้ามืดตาลาย และยังไม่สามารถปีนขึ้นมาได้","“ระดมยิงเวทมนตร์ใส่อีกระลอก แล้วค่อยถอยทัพ! หลังจากนี้ก็คงต้องฝากความหวังไว้ที่ปรมาจารย์ลินน์แล้ว...”","แฮร์รอฟเอ่ยพร้อมกับถอนหายใจ ในตอนนี้เขาได้ทำทุกอย่างที่สามารถทำได้แล้ว","ซานเชซอึกอัก คล้ายกับมีบางอย่างอยากจะพูด เขาคิดว่าการฝากความหวังทั้งหมดไว้กับร่างจำลองของลินน์นั้น ดูจะเป็นเรื่องที่เสี่ยงเกินไป แต่สุดท้ายเขาก็ยอมทำตามคำสั่ง เพราะในสถานการณ์เช่นนี้ พวกเขาไม่มีทางเลือกอื่นที่ดีกว่านี้อีกแล้ว","ในตอนนี้ ลินน์ที่ใช้เวทมนตร์หักเหแสงเพื่อพรางตัว กำลังลอยตัวอยู่บนท้องฟ้าสูง พร้อมพลังเวทอันมหาศาลแผ่ซ่านออกมาจากร่าง ราวกับคลื่นน้ำที่แผ่ขยายออกไปครอบคลุมพื้นที่รัศมีหลายร้อยเมตร","หากเป็นเวลาปกติ การแผ่พลังเวทมนตร์ออกมามากขนาดนี้ ย่อมต้องดึงดูดความสนใจของศัตรูอย่างแน่นอน แต่ลินน์ก็ไม่ได้กังวลใจนัก เพราะในเวลานี้ ทั่วทั้งสมรภูมิรบล้วนเต็มไปด้วยร่องรอยของการใช้พลังเวทมนตร์ การที่เขาให้แฮร์รอฟและคนอื่นๆ ทุ่มพลังเวทมนตร์ทั้งหมดเพื่อตอบโต้ศัตรู ไม่ใช่แค่เพื่อแยกสนามรบเท่านั้น แต่เพื่อใช้เป็นฉากบังหน้าให้กับเขาด้วย","“อากาศวันนี้ช่างดีเหลือเกิน!”","ลินน์แหงนหน้ามองขึ้นไปบนท้องฟ้า ซึ่งมีดวงอาทิตย์สีแดงเพลิงกำลังสาดแสงอย่างเจิดจ้า","เดือนสิงหาคมคือช่วงที่อากาศร้อนระอุที่สุดในจักรวรรดิ และแสงแดดยามเที่ยงวันนี่แหละ ที่จะช่วยเพิ่มอานุภาพให้กับเวทมนตร์ที่เขากำลังจะร่าย!","...","“ดูเหมือนว่าการต่อสู้ใกล้จะจบลงแล้วสินะ!”","ภายในค่ายของศาสนจักร โจชัวมองดูห่าฝนเวทมนตร์ที่พุ่งเข้าใส่ พร้อมกับเอ่ยขึ้นมาเรียบๆ","แม้ว่าการตอบโต้ของศัตรูจะดุเดือดมาก แต่ในสายตาของโจชัว นี่ก็เป็นเพียงแค่การดิ้นรนของสัตว์ที่จนตรอกเท่านั้น ทันทีที่พวกมันใช้พลังเวทมนตร์จนหมด พวกมันก็จะหมดปัญญาที่จะต่อกรกับเขาอีกต่อไป","ส่วนหุบเหวลึกที่กั้นกลางสนามรบอยู่นั้น เขาแทบจะไม่ต้องลงมือเองด้วยซ้ำ เพราะเพียงแค่พระคาร์ดินัลหลายคนร่วมมือกัน พวกเขาก็สามารถใช้พลังศักดิ์สิทธิ์ เพื่อสร้างสะพานขนาดใหญ่ให้กองทัพเดินข้ามไปได้อย่างง่ายดายแล้ว","ส่วนสตรีศักดิ์สิทธิ์ลูเซียที่ยืนอยู่ข้างๆ ก็กำลังจับตามองสถานการณ์อยู่เช่นกัน เพียงแต่การที่แฮร์รอฟและพวกพ่อมด ร่ายเวทมนตร์ออกมาอย่างไม่คิดชีวิตแบบนี้ ทำให้เธอรู้สึกถึงความผิดปกติบางอย่าง เธอจึงเงยหน้าขึ้นมองดวงอาทิตย์ที่ร้อนระอุอยู่บนท้องฟ้า ก่อนจะพึมพำออกมาเบาๆ","“พวกเจ้ารู้สึกไหม? เหมือนว่าแสงแดดจะมืดลงนิดนึงนะ!”"]},{"n":419,"t":"ทุกสิ่งหวนคืนสู่ความว่างเปล่า แสงอาทิตย์สาดส่อง!","c":["มืดลงงั้นเหรอ?","โจชัวขมวดคิ้วมุ่น ก่อนจะแหงนหน้าขึ้นมองท้องฟ้า และเขาก็สัมผัสได้ถึงกลิ่นอายของความไม่ชอบมาพากลจริงๆ","“เป็นเวทมนตร์!”","ลูเซียเอ่ยขึ้นมาเรียบๆ ด้วยประสาทสัมผัสของเธอ เธอสามารถรับรู้ได้ว่า บนท้องฟ้าเหนือสมรภูมิรบที่อยู่ห่างออกไปหลายร้อยเมตร มีความผันผวนของเวทมนตร์อย่างรุนแรงเกิดขึ้น และมันกำลังแผ่ขยายมาทางนี้","โดยก่อนหน้านี้ ที่เธอไม่ทันสังเกตเห็น ก็เป็นเพราะพวกพ่อมดเอาแต่ร่ายเวทมนตร์กันอย่างบ้าคลั่ง ซึ่งมันก็ทำให้ความหนาแน่นของเวทมนตร์ในบริเวณนั้นพุ่งสูงขึ้นอย่างหลีกเลี่ยงไม่ได้ ดังนั้น ลูเซียจึงเพิ่งจะมาสังเกตเห็นความผิดปกติ ก็ตอนที่ความหนาแน่นของเวทมนตร์มันพุ่งทะลุขีดจำกัดไปแล้วเท่านั้น","แต่การมาไหวตัวทันเอาป่านนี้ มันก็สายเกินไปเสียแล้ว เพราะลินน์ได้ร่ายเวทมนตร์เสร็จสิ้นเป็นที่เรียบร้อยแล้ว!","“ท้องฟ้ามืดลงแล้ว!”","คราวนี้ไม่ใช่แค่ลูเซียที่รู้สึกได้ แม้กระทั่งเหล่าทหารที่กำลังควบม้าบุกทะลวงอยู่กลางสมรภูมิรบ ก็สามารถสัมผัสได้อย่างชัดเจน เพราะจู่ๆ พื้นที่ในรัศมีหลายกิโลเมตร ก็เปลี่ยนจากตอนกลางวันแสกๆ กลายเป็นพลบค่ำไปเสียดื้อๆ ปรากฏการณ์อันแสนพิศวงนี้ ทำให้แม้แต่บรรดาผู้ศรัทธาที่เคร่งครัดที่สุด ยังอดไม่ได้ที่จะเกิดความลังเลขึ้นมาชั่วขณะ","และเมื่อทุกคนแหงนหน้าขึ้นไปมอง พวกเขาก็ต้องตกตะลึง เมื่อพบว่ามี ‘กระจกเงา’ โปร่งใสบานยักษ์ ปรากฏขึ้นเหนือหัวของพวกเขา","รูปร่างของมันดูราวกับกระทะก้นลึกแบบโปร่งแสงที่ถูกคว่ำเอาไว้ ซึ่งมันได้บดบังแสงอาทิตย์ที่ร้อนระอุในยามเที่ยงวันไปจนหมดสิ้น","ลินน์ยกมือขึ้น ทำให้แสงสว่างทั่วทั้งสมรภูมิรบลดลงไปอีกหลายระดับ แสงอาทิตย์อันร้อนแรงที่สาดส่องลงมาจากฟากฟ้า เมื่อส่องผ่านกระจกรวมแสงบานยักษ์ มันก็ถูกหักเหและรวมตัวเข้าด้วยกันในทันที","“ทุกสิ่งหวนคืนสู่ความว่างเปล่า แสงอาทิตย์สาดส่อง!”","จู่ๆ ประโยคสุดคลาสสิกนี้ก็ผุดขึ้นมาในหัวของลินน์ โดยเวทมนตร์ทั้งหมดที่ถูกส่งผ่านร่างจำลองมา ก็ได้ถูกสูบออกไปกว่าเก้าในสิบส่วน แถมยังต้องดึงพลังจากเครือข่ายเวทมนตร์มาช่วยอีกด้วย!","ในพริบตาต่อมา ลำแสงรูปกรวยคว่ำที่มีเส้นผ่านศูนย์กลางกว้างกว่าร้อยเมตร และมีความสูงแทบจะไร้ขีดจำกัด ก็พุ่งตกลงมาจากฟากฟ้า!","แสงอาทิตย์ที่ควรจะสาดส่องไปทั่วทั้งสมรภูมิรบ ได้ถูกบีบอัดให้รวมอยู่ในพื้นที่เพียงหนึ่งร้อยเมตร","แสงสว่างที่จ้าจนแสบตา ทำให้ทุกคนในที่นั้นแทบจะลืมตาไม่ขึ้น และตามมาด้วยเสียงกรีดร้องโหยหวน ที่ดังกึกก้องไปทั่วทั้งสนามรบ","“อ๊ากกก!”","บรรดาทหารของจักรวรรดิที่อยู่ในรัศมีของลำแสง ถูกความร้อนที่เทียบเท่ากับพื้นผิวของดวงอาทิตย์แผดเผา จนระเหยหายไปในพริบตา!","ส่วนพวกกองทัพทัณฑ์ศักดิ์สิทธิ์ที่มีพลังศักดิ์สิทธิ์คอยคุ้มครอง อาจจะทนอยู่ได้นานกว่าหน่อย แต่มันก็เป็นเพียงแค่การยืดเวลาตายออกไปเท่านั้น ม้าศึกร้องเสียงหลงก่อนจะล้มฟาดลงกับพื้น ชุดเกราะเหล็กบนตัวพวกมันละลายกลายเป็นน้ำเหล็ก ส่งเสียงดังฉ่าๆ ภายใต้ความร้อนระอุ พร้อมเสื้อผ้าที่อยู่ข้างในก็ลุกเป็นไฟ...","ภายใต้การกวาดล้างของลำแสง ต้นหญ้าแห้งเหี่ยวและสลายไป ผืนดินแห้งแตกระแหง ทหารจักรวรรดินับพันนาย ถูกเปลี่ยนให้กลายเป็นลูกไฟลูกแล้วลูกเล่าในชั่วพริบตา...","ภายใต้ความร้อนที่เหนือกว่าพื้นผิวของดวงอาทิตย์ ทุกสรรพสิ่งล้วนเท่าเทียมกัน แม้แต่ยักษ์ที่มีความต้านทานเวทมนตร์สูง ก็ยังไร้ซึ่งพลังที่จะต่อต้าน และถูกย่างสดจนกลายเป็นตอตะโกไปในทันที!","“นี่มันเวทมนตร์ระดับตำนาน!”","โจชัวรูม่านตาหดเกร็ง","ความเร็วของลำแสงนั้นรวดเร็วเกินไป จากตอนที่เริ่มรวมแสงจนถึงตอนที่กวาดล้างศัตรู มันกินเวลาเพียงแค่หนึ่งวินาทีเท่านั้น แต่ทหารจักรวรรดิกว่าสองพันนาย กลับถูกสังหารไปต่อหน้าต่อตาของเขาในพริบตาเดียว!","“ในนามแห่งพระผู้เป็นเจ้า ศรแห่งการพิพากษา!”","โจชัวชูคทาในมือขึ้นสูง พร้อมกับแผดเสียงคำรามลั่น พร้อมลูกศรที่เปล่งประกายด้วยพลังศักดิ์สิทธิ์นับร้อยดอก ปรากฏขึ้นกลางอากาศ และพุ่งตรงไปยังกระจกรวมแสงที่คว่ำอยู่เหนือหัว","ลูกศรเหล่านี้ถูกอาบไปด้วยพลังทำลายล้างเวทมนตร์แบบพิเศษ และกระจกบานยักษ์ที่ครอบคลุมพื้นที่ทั่วทั้งสมรภูมิรบ ก็ไม่มีทางที่จะขยับเขยื้อนหลบหลีกได้เลย!","ห่าฝนลูกศรพุ่งทะยานออกไปราวกับดาวตกที่สว่างไสว และพุ่งเข้าชนกับกระจกรวมแสงบานยักษ์ในเวลาอันรวดเร็ว","กระจกบานนั้นเปราะบางกว่าที่โจชัวคาดคิดเอาไว้มาก มันไม่สามารถต้านทานการโจมตีได้เลยแม้แต่น้อย และแตกกระจายเป็นชิ้นเล็กชิ้นน้อยร่วงหล่นลงสู่พื้นดินในพริบตา","“ดูเหมือนว่าจะดีแต่เปลือกสินะ!”","โจชัวถอนหายใจออกมาอย่างโล่งอก เพราะมันรับมือได้ง่ายกว่าที่เขาคิดเอาไว้มาก","“มันไม่ง่ายขนาดนั้นหรอก...”","ลูเซียส่ายหน้า แม้เธอจะไม่ได้รีบร้อนที่จะลงมือ แต่ก็พยายามใช้ประสาทสัมผัสทั้งหมด เพื่อค้นหาตำแหน่งของผู้ร่ายเวทมนตร์","ร่างกายนี้เป็นข้อจำกัดสำหรับเธออย่างมาก แม้ว่าจะ ‘หล่อเลี้ยง’ มานานถึงเจ็ดแปดปีแล้ว แต่เนื่องจากความเข้ากันได้ที่ไม่สูงนัก ทำให้พลังที่เธอสามารถดึงออกมาใช้ได้ มีอยู่อย่างจำกัดเหลือเกิน","และก็เป็นไปตามคาด เพียงเสี้ยววินาทีหลังจากที่ลูเซียเอ่ยปาก เศษกระจกรวมแสงชิ้นใหญ่หลายสิบชิ้น ก็ไม่ได้ร่วงหล่นลงมา แต่มันกลับลอยค้างอยู่กลางอากาศ พร้อมกับเปลี่ยนรูปทรงกลายเป็น ‘กระจกรวมแสง’ ขนาดเล็กอีกหลายบาน","ด้วยขีดจำกัดในการประมวลผลของลินน์ในตอนนี้ การจะจัดโครงสร้างเวทมนตร์ใหม่ในเวลาอันสั้นขนาดนี้ ถือเป็นเรื่องเพ้อฝันอย่างแท้จริง แต่ด้วยความช่วยเหลือจากเครือข่ายเวทมนตร์และปัญญาประดิษฐ์สนับสนุน ทุกอย่างก็กลายเป็นเรื่องที่เป็นไปได้","โครงสร้างเวทมนตร์ทั้งหมด สามารถถูกสร้างขึ้นใหม่ โดยอาศัยพลังในการประมวลผลของบรรดาพ่อมดในเครือข่ายเวทมนตร์ ที่ปัญญาประดิษฐ์สนับสนุนเป็นผู้ดึงมาใช้ และกระบวนการทั้งหมดนี้ ก็ใช้เวลาไม่ถึงหนึ่งวินาทีด้วยซ้ำ!","กองทัพปราบปรามของจักรวรรดิที่ยังไม่ทันหายตกตะลึง ภาพอันน่าสะพรึงกลัวของลำแสงขนาดร้อยเมตร ก็ต้องเผชิญหน้ากับการโจมตีจากลำแสงเลเซอร์อีกระลอก!","ในพริบตา ลำแสงเลเซอร์ระดับรองหลายสิบเส้น ก็กวาดผ่านไปทั่วทั้งสมรภูมิรบ แม้ว่าอานุภาพของมันจะลดลงจาก ‘แสงอาทิตย์สาดส่อง’ เมื่อครู่นี้ไปมาก แต่ระยะการโจมตีของมัน กลับกว้างขึ้นกว่าเดิมหลายสิบเท่า!","ทหารจักรวรรดิหลายนายที่โชคดีรอดพ้นจากลำแสงขนาดยักษ์มาได้ กลับถูกลำแสงเลเซอร์กวาดผ่านร่างไปอย่างไม่ทันตั้งตัว จนร่างกายถูกตัดขาดเป็นสองท่อนตั้งแต่หัวจรดเท้า และภาพเหตุการณ์แบบเดียวกันนี้ ก็กำลังเกิดขึ้นทั่วทุกมุมของสมรภูมิรบ","สีหน้าของโจชัวเปลี่ยนเป็นบิดเบี้ยวจนดูไม่ได้ในทันที","“เจอตัวแล้ว!”","ลูเซียหันไปมองทิศทางหนึ่งบนท้องฟ้าที่อยู่ห่างออกไปไกลลิบ ก่อนจะยื่นมือขวาออกไป แล้วกำหมัดแน่น","ลินน์ที่กำลังพรางตัวอยู่บนท้องฟ้าสูงด้วยเวทมนตร์โพลาไรเซชัน และกำลังควบคุมเวทมนตร์รวมแสงอยู่ จู่ๆ ร่างของเขาก็เริ่มบิดเบี้ยวผิดรูป หากเขามีกายเนื้อล่ะก็ ป่านนี้ร่างของเขาคงจะถูกบีบจนแหลกเหลวไปแล้ว!","แต่ถึงกระนั้น ‘แหวนแห่งศาสตร์เร้นลับ’ ซึ่งเป็นแกนกลาง ก็เริ่มมีรอยร้าวปรากฏขึ้นให้เห็น และมันก็พร้อมที่จะแตกสลายได้ทุกเมื่อ","“ประสาทสัมผัสเฉียบคมไม่เบาเลยนี่!”","ลินน์เอ่ยขึ้นอย่างประหลาดใจ เพราะในตอนนี้เขาเป็นเพียงแค่ร่างจำลองที่สร้างจากเวทมนตร์ ซึ่งเขาสามารถพรางตัวให้กลมกลืนไปกับสภาพแวดล้อม ที่มีความหนาแน่นของเวทมนตร์สูงได้อย่างแนบเนียน","เขาคิดว่าอีกฝ่ายจะต้องใช้เวลาสักพักกว่าจะหาตัวเขาเจอเสียอีก ไม่คิดเลยว่าจะหาเจอเร็วขนาดนี้","ก่อนที่แหวนแห่งศาสตร์เร้นลับที่เป็นตัวนำจะแตกสลาย ลินน์ได้รวบรวมพลังเฮือกสุดท้าย เพื่อบังคับกระจกสะท้อนแสงบานยักษ์ ให้ฟันแสงที่รวมตัวกันพุ่งเข้าใส่จุดที่มีคลื่นพลังศักดิ์สิทธิ์รุนแรงที่สุด","ซึ่งนั่นก็คือทิศทางที่ลูเซียยืนอยู่นั่นเอง แต่ก่อนที่ลำแสงจะพุ่งไปถึง สตรีศักดิ์สิทธิ์แห่งศาสนจักรผู้นี้ ก็ได้ยกมือขึ้นเสียก่อน โดยกระจกเงาที่เรียบเนียนบานหนึ่งได้ปรากฏขึ้นตรงหน้าเธอ และสะท้อนลำแสงเลเซอร์อันทรงพลังนั้นกลับมา ด้วยความเร็วที่ยากจะจินตนาการ ซึ่งพุ่งทะลุร่างจำลองของลินน์ พร้อมกับทำลายแหวนแห่งศาสตร์เร้นลับที่เป็นแกนกลางจนแตกกระจาย","ดูเหมือนว่าคงจะทำได้แค่นี้สินะ...ลินน์คิดในใจ แต่เขาก็มีโอกาสได้เห็นหน้าผู้หญิงที่สะท้อนแสงเลเซอร์กลับมาอย่างชัดเจน","หญิงสาวหน้าตาประมาณยี่สิบสามยี่สิบสี่ปี สวมมงกุฎและชุดคลุมนักบวชสีขาวบริสุทธิ์ นัยน์ตาสีเขียวมรกตเป็นประกายระยิบระยับราวกับดวงดาว","เมื่อนำไปปะติดปะต่อกับข้อมูลที่ได้รับมาก่อนหน้านี้ ลินน์ก็สามารถเดาตัวตนของอีกฝ่ายได้ในทันที ก่อนที่ร่างจำลองซึ่งถูกสร้างขึ้นจากเวทมนตร์ จะสลายหายไปอย่างรวดเร็ว เมื่อสูญเสียสิ่งยึดเหนี่ยว..."]},{"n":420,"t":"หยุดยั้งกองทัพปราบปรามด้วยตัวคนเดียว นี่จะต้องเป็นการต่อสู้ที่ถูกจารึกไว้ในหน้าประวัติศาสตร์อย่างแน่นอน!","c":["เมื่อผู้ร่ายเวทมนตร์หายตัวไป ลำแสงเลเซอร์ที่พุ่งลงมาจากท้องฟ้าอย่างต่อเนื่องก็หยุดลงเช่นกัน","ในขณะนี้ สมรภูมิรบเต็มไปด้วยความวุ่นวายและเละเทะ เศษหินและดินโคลนนับไม่ถ้วนกระจัดกระจายไปทั่ว ผืนดินถูกแผดเผาจนเกรียม ทหารนับหมื่นนายถูกลำแสงแผดเผาจนร่างกายไหม้เกรียมและมีควันดำลอย บางคนถึงกับหมดสติไปแล้ว ในขณะที่บางคนยังคงพยายามพยุงร่างเอาไว้อย่างยากลำบาก แต่พวกเขาทั้งหมดล้วนสูญเสียความสามารถในการต่อสู้ไปโดยสิ้นเชิง","กองทัพของจักรวรรดิที่เดิมทีตั้งใจจะจัดทัพเปิดฉากโจมตีอย่างฉับพลัน เพื่อหวังจะบดขยี้กองทหารปืนคาบศิลาให้แตกพ่าย กลับต้องกลายเป็นฝ่ายที่สูญเสียอย่างหนักในชั่วพริบตา","ทหารบางคนที่ศรัทธาไม่แรงกล้าพอ ถึงกับเกิดความหวาดกลัวและตื่นตระหนกต่อแสงอาทิตย์ เมื่อแสงแดดอันอบอุ่นสาดส่องลงมากระทบตัว พวกเขาก็แผดเสียงร้องออกมาด้วยความหวาดผวา","บทเพลงสวดอันศักดิ์สิทธิ์ดังล่องลอยไปทั่วสมรภูมิอันแสนโหดร้ายอย่างรวดเร็ว ท่ามกลางแสงแดดอันร้อนระอุ หยาดฝนสีเขียวมรกตก็โปรยปรายลงมาจากฟากฟ้า...","ทหารบาดเจ็บที่กำลังร้องโอดครวญด้วยความเจ็บปวด เมื่อได้สัมผัสกับหยาดฝน สีหน้าอันบิดเบี้ยวของพวกเขาก็ค่อยๆ ผ่อนคลายลง ก่อนจะผล็อยหลับไป พร้อมบาดแผลไฟไหม้บนร่างกายของพวกเขาก็ค่อยๆ สมานตัวลงอย่างช้าๆ","นี่คือพลังศักดิ์สิทธิ์ระดับตำนาน หยาดฝนแห่งความเมตตา!","มันถูกร่ายโดยลูเซียด้วยตัวเอง ซึ่งครอบคลุมพื้นที่ทั่วทั้งสมรภูมิรบ ทหารจักรวรรดิที่ยังมีชีวิตอยู่ ไม่ว่าจะถูกไฟคลอกหรือสูญเสียอวัยวะ บาดแผลของพวกเขาก็ฟื้นฟูอย่างรวดเร็ว","ร่างของผู้เสียชีวิตก็ปรากฏแสงเรืองรองขึ้นมาเช่นกัน","ผลลัพธ์ที่สองของหยาดฝนแห่งความเมตตา ก็คือความสามารถในการนำพาดวงวิญญาณของผู้ล่วงลับ ให้กลับคืนสู่อาณาจักรของพระผู้เป็นเจ้า","“ขอให้ดวงวิญญาณของพวกเขาได้รับการคุ้มครองชั่วนิรันดร์ และได้พบกับความสุขอันเป็นนิรันดร์ในอาณาจักรของพระองค์...”","บรรดาบิชอปร้องเพลงสวดเสียงดัง","หลังจากใช้พลังศักดิ์สิทธิ์ ลูเซียก็สามารถประเมินจำนวนผู้เสียชีวิตและบาดเจ็บได้ภายในเวลาเพียงหนึ่งนาที ซึ่งมีผู้เสียชีวิตจากเวทมนตร์โจมตีครั้งนั้นประมาณสี่พันกว่าคน และมีผู้บาดเจ็บอีกนับหมื่นนาย...","ข่าวดีเพียงอย่างเดียวก็คือ ผู้เสียชีวิตและบาดเจ็บส่วนใหญ่เป็นเพียงทหารธรรมดา ส่วนกองทัพทัณฑ์ศักดิ์สิทธิ์ที่สวมชุดเกราะเงินสะท้อนแสง และมีการป้องกันหลายชั้นนั้น สามารถต้านทานพลังของลำแสงเลเซอร์ได้ในระดับหนึ่ง โดยสูญเสียกำลังพลไปประมาณหนึ่งพันนายจากเวทมนตร์ ‘แสงอาทิตย์สาดส่อง’ เมื่อครู่นี้","“ท่านลูเซีย ต้องการให้ตามล่าพวกมันต่อไปไหมขอรับ?”","โจชัวมองดูสมรภูมิอันเละเทะตรงหน้าแล้วเอ่ยถาม","“จัดการเรื่องคนเจ็บให้เรียบร้อยก่อนเถอะ”","ลูเซียส่ายหน้า แม้ว่าเธอจะรักษาอาการบาดเจ็บของพวกเขาได้แล้ว แต่ขวัญกำลังใจของกองทัพจักรวรรดิก็ยังคงบอบช้ำอย่างหนัก","ยิ่งไปกว่านั้น ภายในช่วงเวลาสั้นๆ กองทหารปืนคาบศิลาที่แตกพ่าย ก็สามารถตั้งหลักและล่าถอยออกไปจนพ้นระยะสายตาได้อย่างเป็นระเบียบเรียบร้อยแล้ว","การไล่ตามต่อไป รังแต่จะไม่ได้ผลลัพธ์ที่ดีอะไรเลย","“เจ้ามีข้อมูลเกี่ยวกับพ่อมดคนนี้บ้างไหม?”","ลูเซียจู่ๆ ก็ยื่นมือออกไป และม่านน้ำก็ปรากฏขึ้นตรงหน้าเธอทันที","ภายในม่านน้ำนั้น ปรากฏภาพของพ่อมดหนุ่มผมสีน้ำตาล","“ถ้าข้าจำไม่ผิด เขาคือจอมเวทผู้ยิ่งใหญ่ที่ชื่อว่า ลินน์!","พวกสาวกของเทพนอกรีตขนานนามเขาว่า ดาวรุ่งแห่งเวทมนตร์ และตามข่าวลือที่ได้ยินมา ดูเหมือนว่าสิ่งประดิษฐ์แปลกใหม่ที่ปรากฏขึ้นในดินแดนของพวกพ่อมด ล้วนมีส่วนเกี่ยวข้องกับเขาทั้งสิ้น...”","โจชัวเอ่ยด้วยสีหน้าเคร่งเครียด","หลังจากที่กองทัพปราบปรามภายใต้การนำของเอ็ดเวลล์พ่ายแพ้ยับเยินในอาณาจักรแห่งนั้น พวกเขาก็เริ่มให้ความสำคัญกับข้อมูลข่าวสารมากขึ้น แม้ว่าสายลับส่วนใหญ่ที่ถูกส่งไปจะถูกจับได้ แต่พวกเขาก็ยังคงได้ข้อมูลที่เป็นประโยชน์มาไม่น้อย","โดยมีข่าวลือ ว่าการเปลี่ยนแปลงทั้งหมดที่เกิดขึ้นในดินแดนของพ่อมดแห่งนั้น ไม่ว่าจะเป็นปืนคาบศิลา ปืนใหญ่ เรือเหาะ หรือแม้แต่กล่องเหล็กที่วิ่งได้ ล้วนเป็นผลงานของดาวรุ่งแห่งเวทมนตร์ผู้นี้ทั้งสิ้น","และเงินรางวัลนำจับที่ศาสนจักรตั้งเอาไว้สำหรับหัวของเขานั้น ก็สูงทะลุหนึ่งล้านเหรียญทองไปแล้ว!","ลูเซียจดจำชื่อนี้เอาไว้ในใจอย่างเงียบๆ ก่อนที่เธอจะใช้ความคิดสั่งการให้ปืนคาบศิลากระบอกหนึ่งที่อยู่ไกลออกไป ลอยเข้ามาตกอยู่ในมือของเธอ","เธอรู้สึกสนใจอาวุธรูปแบบใหม่ที่พวกพ่อมดนำมาแสดงให้เห็นเป็นอย่างมาก แต่ดูเหมือนว่าเวทมนตร์แสงอาทิตย์สาดส่องของลินน์เมื่อครู่นี้ จะจงใจพุ่งเป้าไปที่รถหุ้มเกราะและปืนใหญ่ที่ถูกทิ้งไว้ในสนามรบโดยเฉพาะ จนพวกมันหลอมละลายกลายเป็นกองเหล็กเหลวไปหมดแล้ว","และสิ่งที่พวกเขาได้มาจากการต่อสู้ครั้งนี้ ก็มีเพียงแค่สิ่งที่เรียกว่าปืนคาบศิลากระบอกนี้เท่านั้น...","ในขณะเดียวกัน แฮร์รอฟที่อาศัยจังหวะชุลมุนหลบหนีออกมาได้ไกลหลายกิโลเมตร เมื่อเห็นว่าศัตรูไม่ได้ไล่ตามมา เขาก็อดไม่ได้ที่จะถอนหายใจออกมาอย่างโล่งอก ดูเหมือนว่าตอนนี้พวกเขาจะปลอดภัยแล้ว","“นี่หรือคือเวทระดับสี่วงแหวนที่ปรมาจารย์ลินน์พูดถึง?”","ซานเชซมีสีหน้าแปลกประหลาด แม้ว่าก่อนหน้านี้เขาจะเอาแต่หนีเอาตัวรอด แต่ก็ใช่ว่าจะไม่ได้สนใจสถานการณ์ที่อยู่เบื้องหลังเลย","อันที่จริง ตราบใดที่ไม่ใช่คนตาบอด ใครๆ ก็ย่อมมองเห็นลำแสงขนาดยักษ์ที่มีเส้นผ่านศูนย์กลางนับร้อยเมตรนั่นได้ และอานุภาพของมันก็คงต้องใช้คำว่าน่าสะพรึงกลัวมาอธิบายเท่านั้น!","แม้แต่เวทมนตร์ระดับตำนานก็ยังทำได้เพียงเท่านี้...","แม้ว่าตอนนี้พวกเขาจะยังไม่รู้ผลของการต่อสู้ แต่ศัตรูก็น่าจะสูญเสียไปไม่น้อย และศาสนจักรก็คงจะไม่มีเวลามาสนใจพวกเขาในระยะเวลาอันใกล้นี้อย่างแน่นอน","“มันก็ไม่ได้เกินขอบเขตของเวทมนตร์ระดับสี่วงแหวนจริงๆ นั่นแหละ”","แฮร์รอฟส่ายหน้า เขาก็ตกใจกับอานุภาพของเวทมนตร์นั้นเช่นกัน แต่เขาก็มองออกว่านั่นไม่ใช่พลังที่ลินน์มีอยู่แต่เดิม แต่มันเป็นการประยุกต์ใช้หลักการหักเหและรวมแสงต่างหาก","เวทมนตร์กระจกเงานั้นก็เปรียบเสมือนคานงัด ที่ไปดึงเอาพลังอันมหาศาลของดวงดาวที่อยู่เหนือหัวพวกเขางัดออกมาใช้...","ซึ่งนั่นก็หมายความว่า คนที่ปลดปล่อยเวทมนตร์ระดับตำนานบทนี้ออกมาไม่ใช่ลินน์ แต่เป็นดวงอาทิตย์ที่อยู่เหนือหัวของพวกเขานั่นเอง!","และด้วยความที่ตอนนี้เป็นช่วงฤดูร้อน เวทมนตร์บทนี้ถึงได้มีอานุภาพร้ายแรงขนาดนี้!","หลังจากฟังคำอธิบายของแฮร์รอฟ ซานเชซก็เข้าใจในที่สุด แต่เขาก็ยังคงรู้สึกเลื่อมใสในจินตนาการและความคิดสร้างสรรค์ในการใช้เวทมนตร์ของลินน์อยู่ดี","...","ทางด้านของลินน์ที่กำลังถูกทุกคนกล่าวชื่นชม สติสัมปชัญญะของเขาก็ได้กลับคืนสู่ร่างเนื้อเป็นที่เรียบร้อยแล้ว","การต้องควบคุมร่างจำลองที่อยู่ห่างออกไปไกลกว่าร้อยกิโลเมตร เพื่อร่ายเวทมนตร์ที่ยิ่งใหญ่ขนาดนี้ ย่อมไม่ใช่เรื่องง่ายเลย และจิตวิญญาณของเขาก็ถูกสูบออกไปอย่างหนัก จนทำให้เขารู้สึกปวดหนึบที่สมอง","“ท่านปรมาจารย์ลินน์ ท่านไม่เป็นอะไรใช่ไหมครับ?”","ราฟาเอลรีบเอ่ยถามด้วยความเป็นห่วง","ก่อนหน้านี้ พวกเขากำลังคุยกันอยู่ว่าควรจะส่งเรือเหาะไปช่วยก่อนดีไหม จู่ๆ ลินน์ก็ยกมือขึ้นห้ามไม่ให้เขาพูดต่อ ก่อนจะหลับตาลงและนั่งนิ่งไป","“ไม่เป็นไร ข้าสบายดี!”","ลินน์นวดขมับเบาๆ ก่อนจะหันไปมองราฟาเอลและคนอื่นๆ แล้วประกาศข่าวดี","“ท่านประธานสภาแฮร์รอฟและคนอื่นๆ น่าจะปลอดภัยแล้วล่ะ!”","เมื่อได้ยินเช่นนั้น พ่อมดทุกคนที่อยู่ที่นั่นก็ถอนหายใจออกมาอย่างโล่งอก เพียร์ซก็เอ่ยถามด้วยความอยากรู้","“สรุปว่าเมื่อครู่นี้ ท่านกำลังพยายามติดต่อกับท่านประธานสภาแฮร์รอฟงั้นหรือครับ?”","“เปล่า ข้าไปที่นั่นด้วยตัวเองมาน่ะ”","ลินน์ไม่ได้ปิดบังอะไร และเล่าทุกสิ่งที่เขาได้เห็นและได้ยินมาให้ทุกคนฟังโดยตรง","“นั่นก็หมายความว่า ท่านศาสตราจารย์เพียงคนเดียว ก็สามารถขับไล่กองทัพปราบปรามของศาสนจักรนับหมื่นนายกลับไปได้งั้นหรือครับ?”","บนใบหน้าของเอล็อคเต็มไปด้วยความเลื่อมใสและแทบไม่อยากจะเชื่อ","ต้องรู้ก่อนว่า ขนาดท่านประธานสภาแฮร์รอฟที่นำกองทหารปืนคาบศิลานับหมื่นนาย ยังทำได้เพียงแค่หนีเอาตัวรอด แต่ท่านศาสตราจารย์กลับสามารถใช้เวทมนตร์โจมตีพวกมันจนบาดเจ็บสาหัสได้","นี่มันเหลือเชื่อเกินไปแล้ว...","“จะเรียกว่าขับไล่ก็คงไม่ได้หรอก อย่างมากก็แค่ถ่วงเวลาเอาไว้ได้สักพักเท่านั้นแหละ”","ลินน์ส่ายหน้า พร้อมกับเอ่ยตามความจริง","แต่ในสายตาของราฟาเอลและคนอื่นๆ ถึงจะเป็นแบบนั้น มันก็ยังถือว่าเกินจริงไปมากอยู่ดี เพียงแค่อาศัยร่างจำลองร่างเดียว ก็สามารถหยุดยั้งกองทัพปราบปรามนับหมื่นนาย และนักบวชระดับตำนานได้อย่างน้อยหนึ่งคน นี่จะต้องเป็นการต่อสู้ที่ถูกจารึกไว้ในหน้าประวัติศาสตร์อย่างแน่นอน!"]},{"n":421,"t":"ต้องขอบคุณท่าน ไม่อย่างนั้นพวกเราคงได้ตายกันหมดในสนามรบแน่","c":["“น่าเสียดายจริงๆ หากไม่ใช่เพราะสตรีศักดิ์สิทธิ์แห่งศาสนจักรเข้ามาขัดขวาง ท่านเพียงคนเดียวก็คงจะสามารถกวาดล้างกองทัพปราบปรามของจักรวรรดิได้ทั้งหมดแล้ว!”","ราฟาเอลเอ่ยขึ้นด้วยความเสียดาย","เอล็อคที่ยืนอยู่ข้างๆ เอ่ยถามด้วยความอยากรู้อยากเห็น","“ท่านศาสตราจารย์ เวทมนตร์ที่ร้ายกาจขนาดนี้ ทำไมก่อนหน้านี้ไม่เคยเห็นท่านใช้มาก่อนเลยล่ะครับ?”","“ ‘แสงอาทิตย์สาดส่อง’ เป็นเวทมนตร์ที่มีข้อจำกัดเรื่องสภาพอากาศค่อนข้างสูง และมันจะใช้ได้ผลดีที่สุดก็แค่ในครั้งแรกที่ใช้เท่านั้น”","ลินน์เอ่ยอธิบาย","หากไม่ใช่เพราะสถานการณ์ในครั้งนี้ฉุกเฉินจริงๆ เขาก็ตั้งใจจะเก็บมันไว้ใช้ในเวลาที่สำคัญกว่านี้","เพราะถึงแม้ว่าเวทมนตร์บทนี้จะมีอานุภาพที่ร้ายกาจ แต่ก็ต้องใช้เวลาในการเตรียมตัวนาน และยังมีข้อเสียอีกมากมาย เช่น ต้องใช้ในวันที่อากาศแจ่มใส และแสงก็สามารถถูกหักเห สะท้อน หรือดูดซับได้","ศัตรูเองก็ไม่ได้โง่ เมื่อเคยเสียท่ามาแล้วครั้งหนึ่ง พวกมันก็ย่อมต้องหาวิธีป้องกันอย่างแน่นอน","อย่างในครั้งนี้ ลำแสงเลเซอร์ที่เขายิงออกไป ก็ถูกสะท้อนกลับมา","เห็นได้ชัดว่าทางศาสนจักรได้รับบทเรียนราคาแพงมาแล้ว และได้หาวิธีรับมือกับเวทมนตร์เลเซอร์เอาไว้แล้ว","แน่นอนว่า ลินน์ไม่ได้คิดว่าอีกฝ่ายจะมีความสามารถในการสร้างกระจกที่สามารถสะท้อนแสงได้แบบร้อยเปอร์เซ็นต์ เพราะตราบใดที่ลำแสงเลเซอร์มีความเข้มข้นมากพอ ต่อให้เป็นกระจกสะท้อนแสง ก็สามารถถูกตัดขาดได้ในพริบตา!","“ไปแจ้งให้เรย์เดลและคนอื่นๆ ทราบ ให้พวกเขาเตรียมตัวออกเดินทางไปยังดินแดนมิสต์เดี๋ยวนี้!”","ลินน์ลุกขึ้นยืน พร้อมกับเอ่ยด้วยน้ำเสียงจริงจัง","แม้ว่าเขาจะสามารถขับไล่การโจมตีของศาสนจักรไปได้ชั่วคราว แต่ก็ไม่อาจตัดความเป็นไปได้ที่อีกฝ่ายจะไล่ตามมา ดังนั้น เขาจึงต้องรีบส่งกำลังเสริมไปช่วยโดยด่วน","ราฟาเอลและคนอื่นๆ พยักหน้าอย่างพร้อมเพรียง อันที่จริง วันนี้พวกเขาก็กำลังเตรียมตัวที่จะออกเดินทางจากเมืองเหล็กกล้าแห่งนี้อยู่แล้ว และได้เตรียมเสบียงสัมภาระทั้งหมดเอาไว้ล่วงหน้าแล้วด้วย!","เนื่องจากจำเป็นต้องใช้สร้างสถานีฐานการสื่อสาร และการลาดตระเวนตามปกติ เรือเหาะเกือบสี่สิบเปอร์เซ็นต์ จึงถูกดึงตัวไปทำภารกิจ และกองทัพของพวกเขาจึงได้รับส่วนแบ่งเรือเหาะมาเพียงแค่สี่สิบลำ ซึ่งไม่เพียงพอที่จะขนส่งกองกำลังนับหมื่นนายไปพร้อมกันได้","หลังจากปรึกษาหารือกันสั้นๆ ลินน์ก็ตัดสินใจได้อย่างรวดเร็ว โดยเขาและราฟาเอลจะโดยสารเรือเหาะ นำกองกำลังส่วนหนึ่งล่วงหน้าไปยังจุดหมายก่อน ส่วนเรย์เดลและจอมเวทผู้ยิ่งใหญ่อีกสองคน จะคอยนำกองทัพที่เหลือตามมาทีหลัง","...","เมืองเหล็กกล้าเซลทอดอยู่ห่างจากชายแดนของจักรวรรดิเป็นเส้นตรงประมาณหนึ่งร้อยห้าสิบเก้ากิโลเมตร หากเดินทัพตามปกติ โดยต้องอ้อมภูเขาและข้ามแม่น้ำ ก็ต้องใช้เวลาอย่างน้อยหลายวัน แต่ถ้าโดยสารด้วยเรือเหาะ ก็จะใช้เวลาเพียงแค่ชั่วโมงกว่าๆ เท่านั้น!","ตลอดการเดินทาง ข่าวกรองจากทั่วทุกมุมของอาณาจักร ก็ถูกส่งผ่านเทคโนโลยีการสื่อสารด้วยคลื่นแม่เหล็กไฟฟ้า มายังอุปกรณ์รับสัญญาณอย่างต่อเนื่อง ก่อนจะถูกนำมาแปลความหมาย","ราฟาเอลอดไม่ได้ที่จะถอนหายใจออกมาด้วยความทึ่ง ในความสะดวกสบายของสิ่งประดิษฐ์ชิ้นนี้ ข้อความที่ถูกส่งมาจากที่ใดก็ตาม สามารถแพร่กระจายไปทั่วทั้งอาณาจักรได้ภายในเวลาเพียงไม่กี่นาที!","ซึ่งเมื่อสรุปข่าวสารทั้งหมดเข้าด้วยกันแล้ว มันก็บอกได้แค่สองเรื่องเท่านั้น","เรื่องแรกก็คือ เรือเหาะลาดตระเวนที่พวกเขาจัดวางกำลังเอาไว้ตามแนวชายแดนของอาณาจักรและจักรวรรดิยังคงปลอดภัยดี ซึ่งนั่นหมายความว่ากองทัพปราบปรามของศาสนจักร แอบลักลอบเข้ามาในเขตป้องกันของพวกเขา โดยที่ยังไม่ได้ถอน ‘หนามยอกอก’ เหล่านี้ออกไป","เรื่องนี้ทำให้ลินน์รู้สึกโล่งใจขึ้นมาเล็กน้อย ต้องรู้ก่อนว่า เพื่อสร้างแนวป้องกันที่ครอบคลุมไปทั่วทั้งอาณาจักร และป้องกันการถูกลอบโจมตี เขาต้องทุ่มเทความพยายามไปมากทีเดียว เพราะเส้นทางการลาดตระเวนและตำแหน่งของเรือเหาะทุกลำ ล้วนถูกออกแบบมาอย่างพิถีพิถัน เพื่อให้แน่ใจว่าพวกมันจะสามารถสนับสนุนซึ่งกันและกันได้ และยังต้องมีการสื่อสารกันเป็นระยะๆ อีกด้วย","เว้นเสียแต่ว่าอีกฝ่ายจะสามารถทำลายเรือเหาะในพื้นที่บริเวณกว้างได้พร้อมกันในพริบตา ไม่อย่างนั้นก็จะต้องมีข่าวสารส่งมาถึงพวกเขาอย่างแน่นอน","เรื่องที่สองก็คือ แฮร์รอฟได้นำกองกำลังล่าถอยไปยังเมืองของจักรวรรดิที่พวกเขายึดมาได้ก่อนหน้านี้ และกำลังปักหลักรอความช่วยเหลืออยู่","เมื่อเรือเหาะร่อนลงจอดในเมือง กลุ่มพ่อมดที่กำลังวุ่นอยู่กับการเสริมแนวป้องกันกำแพงเมือง เมื่อเห็นว่าเป็นลินน์ พวกเขาก็รีบโค้งคำนับทำความเคารพอย่างนอบน้อม","“ปรมาจารย์ลินน์ ครั้งนี้ต้องขอบคุณท่านมากจริงๆ ไม่อย่างนั้นพวกเราคงได้ตายกันหมดในสนามรบแน่”","ซานเชซเดินเข้าไปตบไหล่ลินน์เบาๆ พร้อมกับเอ่ยด้วยความซาบซึ้งใจ","หากก่อนหน้านี้ลินน์ไม่โผล่มาได้ทันเวลา เขาก็เตรียมใจที่จะอยู่รั้งท้ายเพื่อถ่วงเวลาศัตรูเอาไว้แล้ว ซึ่งมันก็ชัดเจนอยู่แล้วว่า นั่นคือการตัดสินใจที่แทบจะไม่มีโอกาสรอดชีวิตเลย","“ไม่ต้องเกรงใจไปหรอกครับ ในการเผชิญหน้ากับการต่อต้านของจักรวรรดิและศาสนจักร ทุกคนจะต้องทุ่มเทอย่างสุดความสามารถ”","ลินน์ส่ายหน้า ด้วยระดับพลังที่สูงกว่า พวกเขาย่อมเสียเปรียบอยู่แล้ว และการสูญเสียกองกำลังใดๆ ไป ย่อมเป็นความสูญเสียที่ยากจะยอมรับได้","หลังจากนั้น ลินน์ก็เอ่ยถามถึงยอดความสูญเสียในสงครามครั้งนี้","“หนักหนาสาหัสกว่าที่คาดการณ์เอาไว้มากเลยล่ะ”","ซานเชซยิ้มขื่นๆ พลางเอ่ย","“มีคนตายไปถึงหนึ่งพันสองร้อยคน และมีคนเจ็บอีกสามพันเจ็ดร้อยกว่าคน”","นั่นก็หมายความว่ากองทหารปืนคาบศิลานับหมื่นนาย มีผู้เสียชีวิตและบาดเจ็บเกินครึ่ง ยิ่งไปกว่านั้น พวกเขายังสูญเสียปืนใหญ่และปืนไปเป็นจำนวนมาก","“ข้าคิดว่าอาวุธพวกนี้คงถูกพวกมันยึดไปหมดแล้วล่ะ!”","ซานเชซเอ่ยด้วยสีหน้าเคร่งเครียด และนี่ก็คือปัญหาที่เขาเป็นกังวลมากที่สุด","นับตั้งแต่ที่พวกเขาออกจากดินแดนของพ่อมดมา ในสงครามหลายครั้งก่อนหน้านี้ แม้กระทั่งในศึกป้องกันเมืองหลวงที่ดุเดือดที่สุด พวกเขาก็ยังคงเป็นฝ่ายคว้าชัยชนะมาได้ ดังนั้น พวกเขาจึงไม่จำเป็นต้องระวังในเรื่องนี้เลย","แต่มันต่างออกไปในตอนนี้ เมื่ออาวุธจำนวนมากถูกศัตรูยึดไปได้ อีกฝ่ายก็มีแนวโน้มสูงมากที่จะนำไปลอกเลียนแบบ","“ไม่เป็นไรหรอกครับ ข้าได้หลอมปืนใหญ่และรถหุ้มเกราะทิ้งไปหมดแล้ว ส่วนวิธีการสร้างอาวุธพื้นฐานอย่างปืนคาบศิลานั้น มันเป็นไปไม่ได้หรอกที่จะปิดบังเอาไว้ได้ตลอดไป การที่ศัตรูจะถอดรหัสและลอกเลียนแบบได้ มันก็เป็นแค่เรื่องของเวลาเท่านั้น โดยสิ่งที่เราต้องทำก็คือ ทำให้แน่ใจว่าการพัฒนาและอัปเกรดอาวุธของเรา จะรวดเร็วกว่าศัตรูมากก็พอแล้วล่ะครับ!”","ลินน์มองโลกในแง่ดี","เขารู้ดีว่า อาวุธที่มีโครงสร้างเรียบง่ายอย่างปืนคาบศิลาแบบจุดชนวนด้วยหินเหล็กไฟ และเรือเหาะ ตราบใดที่พวกหัวกะทิของจักรวรรดิและศาสนจักรยอมเสียเวลามาศึกษาอย่างจริงจัง พวกเขาก็สามารถสร้างมันขึ้นมาได้ในที่สุด","ที่ตอนนี้ยังไม่มีความเคลื่อนไหวใดๆ ก็เป็นเพียงเพราะเวลามันสั้นเกินไป ประกอบกับการที่บรรดาบิชอปของศาสนจักร เอาแต่มุ่งเน้นไปที่ความเชื่อเรื่องโชคลาง และปักใจเชื่อว่ามันคือสิ่งประดิษฐ์ของปีศาจนั่นเอง","แน่นอนว่า สำหรับ ‘อุปกรณ์ขั้นสูง’ ที่ต้องใช้เทคโนโลยีอย่างเครื่องยนต์สันดาปภายในนั้น หากไม่มีแบบแปลน ต่อให้พวกมันคิดจนหัวแทบระเบิด ก็ไม่มีทางสร้างมันขึ้นมาได้อย่างแน่นอน","ในระหว่างที่พูดคุยกันนั้น ซานเชซก็พาทุกคนเดินเข้าไปในคฤหาสน์หลังหนึ่ง","นี่คือคฤหาสน์ของเอิร์ลเล็กๆ คนหนึ่งในจักรวรรดิ ก่อนหน้านี้ตอนที่พวกเขานำกำลังบุกข้ามมาจากอาณาจักร อีกฝ่ายก็รีบเก็บข้าวของหนีไปทันที โดยไม่ทิ้งทหารยามไว้เลยแม้แต่คนเดียว พวกเขาจึงสามารถเข้าควบคุมเมืองนี้ได้อย่างง่ายดาย","แต่ในตอนนี้ คฤหาสน์แห่งนี้ได้กลายเป็นกองบัญชาการชั่วคราว และเป็นสถานที่สำหรับพักฟื้นของผู้บาดเจ็บไปแล้ว ในพื้นที่ว่างเปล่า มีเต็นท์ถูกกางเอาไว้มากมาย บรรดาหมอสมุนไพรกำลังง่วนอยู่กับการปรุงยาสมุนไพร และยังคงได้ยินเสียงร้องโอดครวญด้วยความเจ็บปวดดังแว่วมาเป็นระยะๆ","“ไม่รู้จริงๆ ว่าสงครามจะสิ้นสุดลงเมื่อไหร่กัน”","จอห์นนี่ที่เดินตามหลังทั้งสองคนมา มองไปยังเต็นท์ที่ตั้งเรียงราย ก่อนจะถอนหายใจออกมา","“คงจะเป็นวันที่พวกเราสามารถเอาชนะศาสนจักรได้อย่างเด็ดขาดนั่นแหละ!”","เอล็อคเอ่ยต่อด้วยความคาดหวัง","“พวกเราจะกระชากเทพเจ้าลงมาจากสรวงสวรรค์ สร้างหอคอยเวทมนตร์ของพ่อมดขึ้นในทุกหนทุกแห่งบนทวีปแห่งนี้ เพื่อเผยแพร่ความรู้ ขจัดความเขลา และสาดส่องความรุ่งโรจน์ของเวทมนตร์ไปทั่วทั้งผืนแผ่นดิน!”","และนี่ก็คือคำโฆษณาชวนเชื่อที่สภาเวทมนตร์มักจะใช้ในการทำสงคราม ซึ่งต้องยอมรับเลยว่า มันสามารถปลุกปั่นและสร้างแรงบันดาลใจ ให้กับพ่อมดหนุ่มสาวผู้มีปณิธานอันแรงกล้า และเปี่ยมไปด้วยความกระตือรือร้นได้อย่างยอดเยี่ยม","“มันจะต้องมีวันนั้นอย่างแน่นอน!”","เอล็อคเอ่ยด้วยความมั่นใจ","ลินน์เองก็พยักหน้า ก่อนจะยิ้มและพูดว่า","“ก็คงจะอีกไม่นานหรอก ถ้าสงครามครั้งนี้ราบรื่นดีล่ะก็นะ”"]},{"n":422,"t":"โอกาสในการเอาชนะศาสนจักร","c":["ซานเชซนำทางพาลินน์และคนอื่นๆ เข้ามายังห้องประชุม ซึ่งมีพ่อมดกว่าร้อยคนกำลังรวมตัวกันอยู่ที่นี่ พร้อมกับเสียงทะเลาะเบาะแว้งดังกึกก้องไม่ขาดสาย โดยทุกคนล้วนกำลังถกเถียงกันถึงความพ่ายแพ้ยับเยินที่เพิ่งเผชิญมาเมื่อไม่นานนี้","ออโรร่าที่ออกเดินทางมาก่อนหน้านี้ก็ได้มาถึงนานแล้ว แม้แต่วิกโตริโอก็มาถึงที่นี่แล้วเช่นกัน เห็นได้ชัดว่าพวกเขาเองก็รีบรุดมาที่นี่ทันทีที่ได้รับข่าว","หลังจากที่พวกของลินน์นั่งลงเรียบร้อยแล้ว แฮร์รอฟก็ห้ามปรามเสียงถกเถียงภายในห้องประชุม ก่อนจะเอ่ยขึ้นด้วยน้ำเสียงจริงจัง","“ความพ่ายแพ้อย่างยับเยินในครั้งนี้ เป็นความประมาทเลินเล่อของข้าเองจริงๆ!”","แม้ว่ากองทัพปราบปรามของศาสนจักรจะฉวยโอกาสโจมตีได้อย่างแม่นยำ และพลังศักดิ์สิทธิ์ที่ทำให้ทั้งกองทัพล่องหนและแอบลักลอบเข้ามาได้อย่างเงียบเชียบนั้นจะพิเศษมากก็ตาม แต่ถ้าหากพวกเขาระแวดระวังมากพอ ก็คงจะไม่ถึงกับต้องรอให้ถูกประชิดตัวแล้วค่อยรู้สึกถึงความผิดปกติ","“ดูเหมือนว่าชัยชนะที่ต่อเนื่องยาวนาน จะทำให้พวกเราเกิดความชะล่า
