ชิ้น จากนั้น เขาก็นำกองทัพพลปืนคาบศิลาจำนวนมาก มุ่งหน้าไปยังเมืองหลวงโดยตรง","ตลอดทาง พวกเขาไม่พบเจออุปสรรคใดๆ เลย แม้ว่าทหารองครักษ์ของเมืองหลวง จะเข้ามาปิดล้อมพวกเขาเอาไว้ แต่ก็ไม่มีใครกล้าลงมือทำอะไรเลยสักคน พวกเขาปล่อยให้ลอดด์ เดินผ่านเมืองหลวงไปกว่าครึ่งเมือง และก้าวเข้าไปในประตูของตำหนักใหญ่แต่โดยดี","ในขณะนี้ ภายในพระราชวัง กษัตริย์ฮาตาร์ กำลังนั่งตัวตรงอยู่บนบัลลังก์ เพื่อปรึกษาหารือกับบรรดาขุนนางใหญ่ ถึงเรื่องราคาเสบียงอาหารภายในอาณาจักร ที่จู่ๆ ก็พุ่งสูงขึ้นอย่างกะทันหัน และดิ่งลงสู่จุดต่ำสุดอย่างรวดเร็ว","และลอดด์ก็พากองทัพพลปืนคาบศิลาบุกรุกเข้ามาอย่างกะทันหัน!","พระราชวังอันกว้างใหญ่เงียบสงบลงในทันที บรรดาขุนนางใหญ่ที่กำลังพูดคุยกันอย่างออกรสเมื่อครู่นี้ ต่างก็พากันหุบปากเงียบ ราวกับว่าเส้นเสียงของพวกเขาถูกตัดขาดไปแล้วอย่างไรอย่างนั้น","ลอดด์เองก็ไม่ได้พูดอะไรออกมา เขาทำเพียงแค่นำ [แหวนเวทมนตร์ลับ] ที่ถูกสร้างขึ้นมาเป็นพิเศษในมือออกมาวางไว้บนฝ่ามืออย่างนอบน้อม","แสงสีฟ้าจางๆ กระพริบวาบอยู่บนแหวนอย่างต่อเนื่อง จากนั้น ร่างอันคุ้นเคยร่างหนึ่ง ก็ปรากฏขึ้นเบื้องหน้าของทุกคน","“ไม่ได้พบกันนานเลยนะพ่ะย่ะค่ะ ฝ่าบาทฮาตาร์!”","ฮาตาร์มีสีหน้าเหม่อลอยไปเล็กน้อย ฉากนี้ ราวกับเป็นภาพจำลองของสงครามในเมืองหลวง เมื่อปีกว่าๆ ที่แล้ว พ่อมดชายที่อยู่ตรงหน้า ดูเหมือนจะไม่มีการเปลี่ยนแปลงใดๆ เลย เขายังคงดูสุภาพอ่อนโยนเช่นเคย!","เพียงแต่คนที่นั่งอยู่บนบัลลังก์ ไม่ใช่กษัตริย์บาเซลผู้ชราภาพอีกต่อไป แต่เป็นตัวเขาเอง...","มือของฮาตาร์ที่กำลังจับพนักพิงของบัลลังก์เอาไว้แน่น มีเหงื่อผุดขึ้นมาลางๆ แต่เขาก็ยังคงฝืนทำใจให้สงบ แล้วพูดขึ้น “ไม่ได้พบกันนานเลยนะ ท่านปรมาจารย์ลินน์ การที่ท่านมาที่พระราชวังในครั้งนี้ มีเรื่องสำคัญอะไรต้องการจะแจ้งให้ข้าทราบงั้นหรือ?”","“จะพูดแบบนั้นก็ได้พ่ะย่ะค่ะ!” ลินน์พยักหน้า จากนั้น เขาก็ตบมือเบาๆ แล้วบรรดาคนรับใช้ที่ถูกมัดเอาไว้ ก็ถูกพาตัวเข้ามาทีละคน","สีหน้าของฮาตาร์ซีดเผือดลงในทันที แน่นอนว่าเขาจำพวกคนรับใช้ที่ถูกพาตัวเข้ามาเหล่านี้ได้ พวกเขาล้วนเป็นคนสนิทของตน ที่รับหน้าที่แอบไปติดต่อกับแกรนด์ดยุกการ์ด เพื่อให้อีกฝ่ายออกหน้า และคอยควบคุมการเคลื่อนไหวของบรรดาขุนนางเหล่านั้น","แต่เขาจำได้ ว่าคนพวกนี้ถูกจัดการไปหมดแล้วนี่นา..."]}];
let idx = 0;
function initIdx(){const h=parseInt(location.hash.replace('#',''));if(h>=1&&h<=CHAPTERS.length)idx=h-1;}
function render(){
  const ch=CHAPTERS[idx];
  const paras=ch.c.map(function(p){return '<p>'+escapeHtml(p)+'</p>';}).join('');
  const isLast=idx===CHAPTERS.length-1;
  const endNote='';
  document.getElementById('reader').innerHTML=
    '<h2 class="chap-title">บทที่ '+ch.n+' : '+escapeHtml(ch.t)+'</h2>'+
    '<div class="body">'+paras+'</div>'+
    '<div class="nav">'+
      '<button class="btn" onclick="go(-1)" '+(idx===0?'disabled':'')+'>← ตอนก่อนหน้า</button>'+
      '<button class="btn" onclick="go(1)" '+(isLast?'disabled':'')+'>ตอนถัดไป →</button>'+
    '</div>'+endNote;
  location.hash=idx+1;buildTOC();window.scrollTo(0,0);
}
function go(d){const n=idx+d;if(n>=0&&n<CHAPTERS.length){idx=n;render();}}
function buildTOC(){document.getElementById('toc').innerHTML=CHAPTERS.map(function(ch,i){return '<li class="'+(i===idx?'active':'')+'" onclick="jump('+i+')"><span class="n">'+ch.n+'</span>'+escapeHtml(ch.t)+'</li>';}).join('');}
function jump(i){idx=i;render();toggleTOC();}
function toggleTOC(){document.getElementById('overlay').classList.toggle('open');}
function toggleTheme(){const h=document.documentElement,d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');document.getElementById('themeBtn').textContent=d?'🌙':'☀️';}
let fs=19;
function changeFont(d){fs=Math.min(30,Math.max(15,fs+d*2));document.documentElement.style.setProperty('--reader-size',fs+'px');}
function escapeHtml(s){return s.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
initIdx();render();
['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();return false;});});
document.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','a','s','u','p'].includes(k))e.preventDefault();if(k==='f12')e.preventDefault();});
</script></body></html>
